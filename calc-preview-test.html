      printReadyBlob = pdf.output("blob");
    }

    // ── Manipulation manifest ──
    setGenProgress({ step: "manifest", page: totalPages, totalPages });
    const fitLabel = (fm, as) => ({
      crop: "Crop (native size, centered)",
      cover: "Fill (cover, overflow cropped)",
      contain: "Fit (contain, letterboxed)",
      stretch: "Stretch to fill (distorted to fit bleed area)",
      scale: `Scale (${as}% of native size)`,
    })[fm] || fm;
    const allTx = pageSources.map((_, i) => getTx(i));
    const sameFit = allTx.every(t => t.fitMode === allTx[0].fitMode);
    const sameRot = allTx.every(t => t.rotateSteps === allTx[0].rotateSteps);
    const sameScale = allTx.every(t => t.artScale === allTx[0].artScale);
    const txSummaryFit = sameFit ? fitLabel(allTx[0].fitMode, allTx[0].artScale) : "mixed (see Per-Page Detail)";
    const txSummaryRot = sameRot ? `${allTx[0].rotateSteps * 90}° clockwise${allTx[0].rotateSteps === 0 ? " (none)" : ""}` : "mixed (see Per-Page Detail)";
    const txSummaryScale = sameScale ? `${allTx[0].artScale}%` : "mixed (see Per-Page Detail)";

    const manifestLines = [
      "ARTWORK MANIPULATION MANIFEST",
      "=" .repeat(50),
      `Generated: ${new Date().toISOString()}`,
      "",
      "── Source File ──",
      `Filename: ${fileName || "unknown"}`,
      `Source type: ${artDims?.source === "pdf" ? "PDF" : "Image"}`,
      `Original dimensions: ${artDims ? `${artDims.wIn}″ × ${artDims.hIn}″ (${artDims.wPx} × ${artDims.hPx} px)` : "unknown"}`,
      `Pages detected: ${uploadPageCount}`,
      "",
      "── Booklet Specifications ──",
      `Trim size: ${dims.w}″ × ${dims.h}″`,
      `Bleed-inclusive size: ${bleedW}″ × ${bleedH}″`,
      `Bleed margin: ${BLEED}″ per side`,
      `Binding: Saddle Stitch`,
      `Page count (with padding): ${totalPages}`,
      "",
      "── Customer Transforms (summary) ──",
      `Fit mode: ${txSummaryFit}`,
      `Rotation: ${txSummaryRot}`,
      `Scale: ${txSummaryScale}`,
      "",
      "── Edge Detection ──",
      `Margins detected: ${edgeHasMargins === null ? "not analyzed" : edgeHasMargins ? "yes — white edges found (art may not bleed)" : "no — art extends to edges"}`,
      "",
      "── Deliverables ──",
      `1. Raw file: ${fileName || "original upload"} (unmodified customer upload)`,
      noTransforms
        ? `2. Print-ready PDF: SKIPPED — raw file is already print-ready (no transforms applied, art matches bleed size)`
        : `2. Print-ready PDF: ${totalPages} pages at ${DPI} DPI, ${bleedW}″ × ${bleedH}″, JPEG quality 0.95`,
      `3. Screen previews: ${previewBlobs.filter(b => b).length} page images at 150 DPI, JPEG quality 0.85`,
      `4. This manifest`,
      "",
      "── Per-Page Detail ──",
    ];
    pageSources.forEach((p, i) => {
      const t = getTx(i);
      const ped = effectiveDimsFor(artDims, t.rotateSteps);
      const pdims = ped ? `${ped.wIn}″ × ${ped.hIn}″ post-rotation` : "N/A";
      manifestLines.push(`  Page ${i + 1}: ${p.label}${p.isBlank ? " (blank — no art)" : ""}`);
      manifestLines.push(`    fit=${t.fitMode} rotate=${t.rotateSteps * 90}° scale=${t.artScale}%  [${pdims}]`);
    });
    manifestLines.push("", "── Notes ──");
    if (noTransforms) manifestLines.push("No customer transforms were applied on any page. The raw uploaded file is print-ready as-is — no rasterized print PDF was generated, preserving original vector/quality.");

    const manifestBlob = new Blob([manifestLines.join("\n")], { type: "text/plain" });

    return { printReadyBlob, previewBlobs, manifestBlob, skippedGeneration: noTransforms };
  }

  // Effective pages (rotated if needed) — cached to avoid re-rotating on every render
  const [rotatedCache, setRotatedCache] = useState({ key: "", pages: [] });

  useEffect(() => {
    if (rawPages.length < 2) {
      setRotatedCache({ key: "", pages: [] });
      return;
    }
    const rotSig = rawPages.map((_, i) => getTx(i).rotateSteps).join(",");
    const allZero = rawPages.every((_, i) => getTx(i).rotateSteps === 0);
    if (allZero) {
      if (rotatedCache.key !== "") setRotatedCache({ key: "", pages: [] });
      return;
    }
    const cacheKey = `rot${rotSig}_${rawPages.length}_${rawPages[0]?.dataUrl?.length || 0}`;
    if (rotatedCache.key === cacheKey) return;

    let cancelled = false;
    (async () => {
      const rotated = [];
      for (let i = 0; i < rawPages.length; i++) {
        if (cancelled) return;
        const p = rawPages[i];
        const steps = getTx(i).rotateSteps;
        const rotUrl = steps > 0 ? await rotateImageBySteps(p.dataUrl, steps) : p.dataUrl;
        rotated.push({ ...p, dataUrl: rotUrl });
      }
      if (!cancelled) setRotatedCache({ key: cacheKey, pages: rotated });
    })();
    return () => { cancelled = true; };
  }, [txHash, rawPages]);

  // The pages we actually use for preview — rotated (mixed) or raw (all 0°)
  const anyRotated = useMemo(() => rawPages.some((_, i) => getTx(i).rotateSteps > 0), [txHash, rawPages]);
  const effectivePages = anyRotated && rotatedCache.pages.length === rawPages.length
    ? rotatedCache.pages : rawPages;

  // ── Edge margin detection: sample pixels along all 4 edges of first page ──
  // For PDFs: renders directly from pdfDocRef at sampling resolution — no JPEG artifacts.
  // For images: uses the raw dataUrl (already at native resolution).
  useEffect(() => {
    if (!rawPages.length || rawPages[0].isBlank) { setEdgeHasMargins(null); return; }
    let cancelled = false;

    // Shared: given a canvas with image data, sample edges and classify
    function analyzeEdges(c) {
      const w = c.width, h = c.height;
      const d = c.getContext("2d").getImageData(0, 0, w, h).data;
      const px = (x, y) => { const i = (y * w + x) * 4; return { r: d[i], g: d[i+1], b: d[i+2] }; };
      const isLight = (p) => p.r > 230 && p.g > 230 && p.b > 230;
      const N = 20;
      let lightCount = 0, total = 0;
      for (let i = 0; i < N; i++) {
        const fx = Math.max(2, Math.min(Math.round((i / (N-1)) * (w-1)), w-3));
        const fy = Math.max(2, Math.min(Math.round((i / (N-1)) * (h-1)), h-3));
        if (isLight(px(fx, 2))) lightCount++; total++;
        if (isLight(px(fx, h-3))) lightCount++; total++;
        if (isLight(px(2, fy))) lightCount++; total++;
        if (isLight(px(w-3, fy))) lightCount++; total++;
      }
      if (!cancelled) setEdgeHasMargins(lightCount / total > 0.85);
    }

    // PDF source: render page 1 directly to a small canvas — clean vector render, no JPEG artifacts
    if (pdfDocRef.current && artDims?.source === "pdf") {
      (async () => {
        try {
          const pg = await pdfDocRef.current.getPage(1);
          // Render at a scale that gives ~200px on the short side — enough for edge sampling
          const baseVp = pg.getViewport({ scale: 1 });
          const targetShort = 200;
          const scale = targetShort / Math.min(baseVp.width, baseVp.height);
          const vp = pg.getViewport({ scale });
          const c = document.createElement("canvas");
          c.width = Math.round(vp.width); c.height = Math.round(vp.height);
          await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
          if (!cancelled) analyzeEdges(c);
        } catch (e) { console.warn("Bleed detection render failed:", e); }
      })();
      return () => { cancelled = true; };
    }

    // Image source: load the dataUrl (already at full native resolution)
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      const sz = Math.min(img.naturalWidth, img.naturalHeight, 200);
      const w = Math.round(img.naturalWidth * (sz / Math.max(img.naturalWidth, img.naturalHeight)));
      const h = Math.round(img.naturalHeight * (sz / Math.max(img.naturalWidth, img.naturalHeight)));
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      analyzeEdges(c);
    };
    img.src = rawPages[0].dataUrl;
    return () => { cancelled = true; };
  }, [rawPages, artDims]);

  // ── Preflight checks ──
  const _preflight = useMemo(() => {
    if (!effectiveDims || !rawPages.length) return null;
    const checks = [];
    const { wIn, hIn, wPx, hPx, source } = effectiveDims;
    const targetW = dims.w, targetH = dims.h;

    // 0. Rotation notice
    if (shouldRotate) {
      checks.push({ level: "info", id: "rotate", label: `Rotated ${rotateSteps * 90}°`, detail: `Art rotated ${rotateSteps * 90}° clockwise — click Rotate 90° to continue or return to 0°` });
    } else if (needsRotation) {
      checks.push({ level: "warn", id: "rotate", label: "Orientation", detail: `Art is ${artDims.hIn > artDims.wIn ? "portrait" : "landscape"} but booklet is ${dims.h > dims.w ? "portrait" : "landscape"} — use Rotate 90° to fix` });
    }

    // 1. Dimension match & bleed detection (using effective/rotated dimensions)
    const wDiff = Math.abs(wIn - targetW), hDiff = Math.abs(hIn - targetH);
    const tolerance = 0.08; // tight match = no bleeds
    const bleedPerSide = 0.125; // standard print bleed
    const fullBleed = bleedPerSide * 2; // 0.25" total added
    const bleedTol = 0.04; // tolerance around bleed size
    const wBleed = Math.abs((wIn - targetW) - fullBleed), hBleed = Math.abs((hIn - targetH) - fullBleed);
    let hasBleed = false;

    if (wDiff <= tolerance && hDiff <= tolerance) {
      checks.push({ level: "pass", id: "dims", label: "Page size", detail: `${wIn}″×${hIn}″ matches ${targetW}″×${targetH}″ — no bleeds detected` });
    } else if (wBleed <= bleedTol && hBleed <= bleedTol) {
      hasBleed = true;
      checks.push({ level: "pass", id: "dims", label: "Page size", detail: `${wIn}″×${hIn}″ — proper bleeds detected (⅛″ per side)` });
    } else if (wIn > targetW && hIn > targetH && wDiff <= 0.5 && hDiff <= 0.5) {
      hasBleed = true;
      checks.push({ level: "info", id: "dims", label: "Page size", detail: `${wIn}″×${hIn}″ — oversized by ${wDiff.toFixed(3)}″×${hDiff.toFixed(3)}″ (non-standard bleed)` });
    } else {
      const artAR = wIn / hIn, targetAR = targetW / targetH;
      if (Math.abs(artAR - targetAR) < 0.05) {
        checks.push({ level: "warn", id: "dims", label: "Page size", detail: `${wIn}″×${hIn}″ — aspect ratio OK but size differs from ${targetW}″×${targetH}″. Art will be scaled.`, action: "matchSize" });
      } else {
        checks.push({ level: "warn", id: "dims", label: "Page size", detail: `${wIn}″×${hIn}″ vs ${targetW}″×${targetH}″ — aspect ratio differs.`, action: "matchSize" });
      }
    }

    // Bleed suggestion (informed by edge pixel analysis)
    if (hasBleed) {
      checks.push({ level: "pass", id: "bleed", label: "Bleeds", detail: "Artwork has bleeds — select \"My artwork has proper bleeds\" below" });
    } else if (wDiff <= tolerance && hDiff <= tolerance) {
      if (edgeHasMargins === true) {
        checks.push({ level: "pass", id: "bleed", label: "Bleeds", detail: "Artwork has white margins — no bleeds needed" });
      } else if (edgeHasMargins === false) {
        checks.push({ level: "warn", id: "bleed", label: "Bleeds", detail: "Artwork has content at edges but no bleed area — bleeds should be added to prevent white trim lines" });
      } else {
        checks.push({ level: "info", id: "bleed", label: "Bleeds", detail: "Checking artwork edges…" });
      }
    }

    // 2. Resolution
    if (source === "pdf") {
      checks.push({ level: "pass", id: "res", label: "Resolution", detail: "PDF source — vector/high resolution" });
    } else {
      const dpi = Math.min(wIn > 0 ? Math.round(wPx / wIn) : 0, hIn > 0 ? Math.round(hPx / hIn) : 0);
      if (dpi >= 300) checks.push({ level: "pass", id: "res", label: "Resolution", detail: `~${dpi} DPI — print quality` });
      else if (dpi >= 150) checks.push({ level: "warn", id: "res", label: "Resolution", detail: `~${dpi} DPI — may appear soft (300 DPI recommended)` });
      else if (dpi > 0) checks.push({ level: "fail", id: "res", label: "Resolution", detail: `~${dpi} DPI — too low for quality print (300 DPI recommended)` });
    }

    // 3. Page count
    const raw = rawPages.length;
    if (raw === pageCount) {
      checks.push({ level: "pass", id: "pages", label: "Page count", detail: `${raw} pages — matches selected count` });
    } else if (raw < pageCount) {
      checks.push({ level: "warn", id: "pages", label: "Page count", detail: `${raw} pages in file — ${pageCount - raw} blank${pageCount - raw > 1 ? "s" : ""} will be added` });
    } else {
      checks.push({ level: "warn", id: "pages", label: "Page count", detail: `${raw} pages in file — last ${raw - pageCount} won't print at current setting` });
    }

    // 4. Orientation (only if NOT already handled by auto-rotate)
    if (!needsRotation) {
      // No mismatch — skip
    }
    // If needsRotation is true, it's already covered by the rotation checks above

    return { checks, hasBleed, hasMargins: edgeHasMargins, artW: wIn, artH: hIn };
  }, [effectiveDims, rawPages, dims, pageCount, shouldRotate, needsRotation, rotateSteps, artDims, edgeHasMargins]);

  const preflight = useMemo(() => _preflight?.checks || null, [_preflight]);
  const detectedBleed = _preflight?.hasBleed || false;
  const bleedCbRef = useRef(onBleedDetected);
  bleedCbRef.current = onBleedDetected;
  useEffect(() => { if (bleedCbRef.current) bleedCbRef.current(detectedBleed); }, [detectedBleed]);

  const sizeOverrideCbRef = useRef(onSizeOverride);
  sizeOverrideCbRef.current = onSizeOverride;
  const handleMatchSize = () => {
    if (!_preflight || !sizeOverrideCbRef.current) return;
    const { artW, artH } = _preflight;
    if (!artW || !artH) return;

    // Always ask how much of the artwork size is bleed
    const input = prompt(
      `Artwork is ${artW}″ × ${artH}″.\n\n` +
      `How much of this size is bleed (per side)?\n\n` +
      `Enter 0 if artwork has no bleeds.\n` +
      `Standard print bleed is 0.125″.`,
      "0.125"
    );
    if (input === null) return; // cancelled
    const bleedVal = parseFloat(input);
    if (isNaN(bleedVal) || bleedVal < 0 || bleedVal >= Math.min(artW, artH) / 2) {
      alert("Invalid bleed value.");
      return;
    }
    const trimW = artW - bleedVal * 2;
    const trimH = artH - bleedVal * 2;
    sizeOverrideCbRef.current(trimW, trimH);
  };

  // ── Reconcile effectivePages against pageCount ──
  const { displayPages, reconcileInfo } = useMemo(() => {
    if (effectivePages.length === 0) {
      // No file yet — generate empty slot grid from pageCount
      const slots = Array.from({ length: pageCount }, (_, i) => ({
        dataUrl: blankPage,
        label: pageLabel(i, pageCount),
        isBlank: true,
      }));
      return { displayPages: slots, reconcileInfo: null };
    }
    if (effectivePages.length === 1) {
      // Single-page upload — drop it into the front-cover slot, pad the rest.
      const single = effectivePages[0];
      const slots = Array.from({ length: pageCount }, (_, i) =>
        i === 0
          ? { ...single, label: pageLabel(0, pageCount), isBlank: false }
          : { dataUrl: blankPage, label: pageLabel(i, pageCount), isBlank: true }
      );
      return { displayPages: slots, reconcileInfo: { type: "padded", count: pageCount - 1, raw: 1, target: pageCount } };
    }
    const target = pageCount, raw = effectivePages.length;
    const frontCover = effectivePages[0], backCover = effectivePages[effectivePages.length - 1];
    const rawInterior = effectivePages.slice(1, effectivePages.length - 1);
    const neededInterior = target - 2;
    let interior, info = null;

    if (rawInterior.length === neededInterior) {
      interior = rawInterior;
    } else if (rawInterior.length < neededInterior) {
      const n = neededInterior - rawInterior.length;
      interior = [...rawInterior, ...Array.from({ length: n }, (_, i) => ({ dataUrl: blankPage, label: `Blank ${i + 1}`, isBlank: true }))];
      info = { type: "padded", count: n, raw, target };
    } else {
      const n = rawInterior.length - neededInterior;
      interior = rawInterior.slice(0, neededInterior);
      info = { type: "trimmed", count: n, raw, target };
    }

    const result = [
      { ...frontCover, label: pageLabel(0, target) },
      ...interior.map((p, i) => ({ ...p, label: pageLabel(i + 1, target) })),
      { ...backCover, label: pageLabel(target - 1, target) },
    ];
    return { displayPages: result, reconcileInfo: info };
  }, [effectivePages, pageCount, blankPage]);

  // Trimmed pages for 3D book preview — each page rendered with its transforms applied,
  // then cropped to strip the 0.125" bleed off every edge. 3D preview shows finished
  // trimmed book; proof modal keeps the bleed-inclusive view with guides.
  const [trimmedPages, setTrimmedPages] = useState([]);
  useEffect(() => {
    if (displayPages.length === 0) { setTrimmedPages([]); return; }
    let cancelled = false;
    (async () => {
      const BLEED = 0.125;
      const bleedW = dims.w + BLEED * 2;
      const bleedH = dims.h + BLEED * 2;
      const DPI = 200;
      const canvasW = Math.round(bleedW * DPI);
      const canvasH = Math.round(bleedH * DPI);
      const trimPxX = Math.round(BLEED * DPI);
      const trimPxY = Math.round(BLEED * DPI);
      const outW = canvasW - trimPxX * 2;
      const outH = canvasH - trimPxY * 2;

      const results = [];
      for (let i = 0; i < displayPages.length; i++) {
        if (cancelled) return;
        const page = displayPages[i];
        if (page.isBlank || !page.dataUrl) {
          const bc = document.createElement("canvas");
          bc.width = outW; bc.height = outH;
          const bctx = bc.getContext("2d");
          bctx.fillStyle = "#f8f5f0";
          bctx.fillRect(0, 0, outW, outH);
          results.push({ ...page, dataUrl: bc.toDataURL("image/jpeg", 0.85) });
          continue;
        }
        const tx = getTx(i);
        const ed = effectiveDimsFor(artDims, tx.rotateSteps);
        const img = await new Promise(res => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = () => res(null);
          im.src = page.dataUrl;
        });
        if (!img) { results.push(page); continue; }

        const c = document.createElement("canvas");
        c.width = canvasW; c.height = canvasH;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvasW, canvasH);
        const srcW = img.naturalWidth, srcH = img.naturalHeight;
        if (tx.fitMode === "stretch") {
          ctx.drawImage(img, 0, 0, canvasW, canvasH);
        } else if (tx.fitMode === "crop" || tx.fitMode === "scale") {
          const mult = tx.fitMode === "scale" ? tx.artScale / 100 : 1;
          const nativeW = ed ? (ed.wIn / bleedW) * mult : mult;
          const nativeH = ed ? (ed.hIn / bleedH) * mult : mult;
          const drawW = canvasW * nativeW, drawH = canvasH * nativeH;
          ctx.drawImage(img, (canvasW - drawW) / 2, (canvasH - drawH) / 2, drawW, drawH);
        } else if (tx.fitMode === "cover") {
          const sc = Math.max(canvasW / srcW, canvasH / srcH);
          ctx.drawImage(img, (canvasW - srcW * sc) / 2, (canvasH - srcH * sc) / 2, srcW * sc, srcH * sc);
        } else {
          const sc = Math.min(canvasW / srcW, canvasH / srcH);
          ctx.drawImage(img, (canvasW - srcW * sc) / 2, (canvasH - srcH * sc) / 2, srcW * sc, srcH * sc);
        }

        const tc = document.createElement("canvas");
        tc.width = outW; tc.height = outH;
        tc.getContext("2d").drawImage(c, trimPxX, trimPxY, outW, outH, 0, 0, outW, outH);
        results.push({ ...page, dataUrl: tc.toDataURL("image/jpeg", 0.85) });
      }
      if (!cancelled) {
        setTrimmedPages(results);
        if (onCoverArt && results[0] && !results[0].isBlank) onCoverArt(results[0].dataUrl);
      }
    })();
    return () => { cancelled = true; };
  }, [displayPages, artDims, dims.w, dims.h, txHash]);

  // Pixel dimensions
  const compactH = 160, pxPerInch = compactH / dims.h;
  const cBookW = Math.round(dims.w * pxPerInch), cBookH = compactH;
  const spineW = 0, cScale = Math.min(1, 200 / (cBookW * 1.8));
  const exH = 360, exPPI = exH / dims.h;
  const exBookW = Math.round(dims.w * exPPI), exBookH = exH;
  const exScale = Math.min(1, 700 / (exBookW * 2.5));
  const totalSpreads = Math.max(1, Math.ceil((displayPages.length - 2) / 2));

  // Render current proof page at 300 DPI on demand
  useEffect(() => {
    if (activeModal !== "proof") { return; }
    const page = displayPages[proofIdx];
    if (!page || page.isBlank) { setHiResProof(null); return; }
    // Cache hit — already have correct hi-res for this page + rotation state
    if (hiResProof && hiResProof.idx === proofIdx && hiResProof.rotated === rotateSteps) return;
    // For PDF source — re-render from PDF at 300 DPI
    if (pdfDocRef.current && artDims?.source === "pdf") {
      let cancelled = false;
      const pdfPageNum = proofIdx + 1; // pdf.js pages are 1-indexed
      if (pdfPageNum > pdfDocRef.current.numPages) return;
      (async () => {
        try {
          const pg = await pdfDocRef.current.getPage(pdfPageNum);
          const scale300 = 300 / 72; // 72 PDF units per inch → 300 DPI
          const vp = pg.getViewport({ scale: scale300 });
          const canvas = document.createElement("canvas");
          canvas.width = vp.width; canvas.height = vp.height;
          await pg.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
          // Apply N-step rotation if needed
          let outUrl;
          if (rotateSteps > 0) {
            const s = rotateSteps % 4;
            const swap = s % 2 === 1;
            const rc = document.createElement("canvas");
            rc.width = swap ? canvas.height : canvas.width;
            rc.height = swap ? canvas.width : canvas.height;
            const rctx = rc.getContext("2d");
            rctx.translate(rc.width / 2, rc.height / 2);
            rctx.rotate((s * Math.PI) / 2);
            rctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
            outUrl = rc.toDataURL("image/jpeg", 0.92);
          } else {
            outUrl = canvas.toDataURL("image/jpeg", 0.92);
          }
          if (!cancelled) setHiResProof({ idx: proofIdx, rotated: rotateSteps, dataUrl: outUrl });
        } catch(e) { console.error("Hi-res render error:", e); }
      })();
      return () => { cancelled = true; };
    }
    // For image source — displayPages already has the rotated version
    setHiResProof({ idx: proofIdx, rotated: rotateSteps, dataUrl: page.dataUrl });
  }, [activeModal, proofIdx, displayPages, artDims, rotateSteps]);

  useEffect(() => { if (spread >= totalSpreads) setSpread(Math.max(0, totalSpreads - 1)); }, [totalSpreads]);

  async function processFiles(fileList) {
    if (!fileList || !fileList.length) return;
    const f0 = fileList[0];
    const isPdf = f0.type === "application/pdf" || /\.pdf$/i.test(f0.name);
    const isImage = f0.type.startsWith("image/") || /\.(png|jpe?g|gif|webp|bmp|tiff?)$/i.test(f0.name);
    if (!isPdf && !isImage) {
      setUploadError(`Unsupported file type: ${f0.type || f0.name.split(".").pop()}. Upload a PDF or image (PNG, JPG, TIFF).`);
      return;
    }
    if (f0.size === 0) {
      setUploadError(`File is empty (0 bytes): ${f0.name}`);
      return;
    }
    setUploadError("");
    rawFileRef.current = f0;
    setLoading(true); setFileName(f0.name); setLoadingProgress(null);
    try {
      const onProgress = (current, total) => setLoadingProgress({ current, total });
      const extracted = isPdf
        ? await extractPdfPages(f0, onProgress)
        : await extractImagePages(fileList, onProgress);
      setRawPages(extracted.pages);
      setArtDims(extracted.dims);
      setUploadPageCount(extracted.pages.length);
      pdfDocRef.current = extracted.pdfDoc || null;
      setHiResProof(null);
      setPreviewMode("closed"); setSpread(0); setRot({ x: -15, y: -25 });
      // Full file upload replaces any per-slot files
      slotFilesRef.current = {};
      // Auto-enable rotation if orientation mismatch detected — seed ALL pages uniformly
      const { wIn, hIn } = extracted.dims;
      const artIsPortrait = hIn > wIn, bookIsPortrait = dims.h > dims.w;
      const isMismatch = Math.abs(wIn - hIn) > 0.5 && Math.abs(dims.w - dims.h) > 0.5 && artIsPortrait !== bookIsPortrait;
      if (isMismatch) {
        const seed = {};
        for (let i = 0; i < extracted.pages.length; i++) seed[i] = { ...DEFAULT_TX, rotateSteps: 1 };
        setPageTransforms(seed);
      } else {
        setPageTransforms({});
      }
      if (onCoverArt && extracted.pages.length >= 1) onCoverArt(extracted.pages[0].dataUrl);
      if (onBackCoverArt && extracted.pages.length >= 2) onBackCoverArt(extracted.pages[extracted.pages.length - 1].dataUrl);
      if (onPagesDetected && extracted.pages.length >= 2) {
        let pg = Math.ceil(extracted.pages.length / 4) * 4;
        if (pg < 8) pg = 8;
        onPagesDetected(pg);
      }
      // Pass raw file up for order submission
      if (onArtwork) onArtwork({ type: "files", list: [fileList[0]] });
      setSlotsOpen(true);
      setArtApproved(false);
    } catch (err) {
      console.error("Extraction error:", err);
      setUploadError(`Couldn't read ${f0.name}: ${err?.message || "the file may be corrupt or password-protected"}. Try re-exporting as PDF or PNG.`);
      setFileName("");
    }
    setLoading(false); setLoadingProgress(null);
  }

  function handleFiles(e) { processFiles(e.target.files); }

  function handleDrop(e) {
    e.preventDefault(); e.stopPropagation();
    setDropHover(false);
    processFiles(e.dataTransfer.files);
  }

  function handleDragOver(e) { e.preventDefault(); e.stopPropagation(); setDropHover(true); }
  function handleDragLeave(e) { e.preventDefault(); e.stopPropagation(); setDropHover(false); }

  function handleClear() {
    setRawPages([]); setFileName(""); setUploadPageCount(0);
    setArtDims(null); setPreviewMode("closed"); setSpread(0); setActiveModal(null);
    setRotatedCache({ key: "", pages: [] }); setPageTransforms({});
    setEdgeHasMargins(null); setHiResProof(null); setArtApproved(false); setApprovalPkg(null);
    pdfDocRef.current = null;
    rawFileRef.current = null;
    slotFilesRef.current = {};
    if (onArtwork) onArtwork({ type: "none" });
    if (onCoverArt) onCoverArt(null);
    if (onBackCoverArt) onBackCoverArt(null);
  }

  // Drag rotation
  function onPointerDown(e) { e.preventDefault(); dragRef.current = { active: true, sx: e.clientX, sy: e.clientY, bx: rot.x, by: rot.y }; }
  function onPointerMove(e) {
    if (!dragRef.current.active) return;
    const d = dragRef.current;
    setRot({ x: Math.max(-60, Math.min(60, d.bx - (e.clientY - d.sy) * 0.3)), y: d.by + (e.clientX - d.sx) * 0.4 });
  }
  useEffect(() => {
    if (!expanded) return;
    const up = () => { dragRef.current.active = false; };
    document.addEventListener("mouseup", up); document.addEventListener("mousemove", onPointerMove);
    return () => { document.removeEventListener("mouseup", up); document.removeEventListener("mousemove", onPointerMove); };
  }, [expanded, rot]);
  useEffect(() => {
    if (activeModal !== "preview" || previewMode !== "open") return;
    const h = (e) => { if (e.key === "ArrowRight" && spread < totalSpreads - 1) setSpread(s => s + 1); else if (e.key === "ArrowLeft" && spread > 0) setSpread(s => s - 1); };
    document.addEventListener("keydown", h); return () => document.removeEventListener("keydown", h);
  }, [activeModal, previewMode, spread, totalSpreads]);
  useEffect(() => {
    if (!expanded) return;
    const h = (e) => { if (e.key === "Escape") setActiveModal(null); };
    document.addEventListener("keydown", h); return () => document.removeEventListener("keydown", h);
  }, [expanded]);

  const hasFile = rawPages.length >= 2 || rawPages.some(p => !p.isBlank);
  const PF = { pass: { dot: "#4ade80", text: "#3a7124" }, warn: { dot: "#fbbf24", text: "#b8860b" }, fail: { dot: "#f87171", text: "#c2185b" }, info: { dot: "#60a5fa", text: "#2563eb" } };

  // Expose an imperative open-preview hook for the sidebar preview card.
  useEffect(() => {
    if (!openPreviewModalRef) return;
    openPreviewModalRef.current = hasFile ? () => setActiveModal("preview") : null;
    return () => { if (openPreviewModalRef) openPreviewModalRef.current = null; };
  }, [hasFile, openPreviewModalRef]);

  // ── Per-slot upload logic ──
  const slotInputRef = useRef(null);
  const activeSlotRef = useRef(-1);

  function handleSlotClick(idx) {
    activeSlotRef.current = idx;
    if (slotInputRef.current) { slotInputRef.current.value = ""; slotInputRef.current.click(); }
  }

  async function handleSlotFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const idx = activeSlotRef.current;
    if (idx < 0) return;

    if (file.type === "application/pdf") {
      // PDF dropped on a slot — extract all pages, replace everything
      processFiles([file]);
      return;
    }

    // Single image → insert/replace at slot index
    const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
    const imgDims = await new Promise(res => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth, h: img.naturalHeight }); img.src = dataUrl; });

    const newPage = { dataUrl, label: pageLabel(idx, pageCount) };

    // Track the original File object for this slot (preserves full quality for submission)
    slotFilesRef.current = { ...slotFilesRef.current, [idx]: file };
    // Build ordered file list from slot map and notify parent
    if (onArtwork) {
      const list = Object.entries(slotFilesRef.current)
        .sort((a, b) => Number(a[0]) - Number(b[0]))
        .map(([i, f]) => new File([f], `page_${String(i).padStart(3,"0")}_${f.name}`, { type: f.type }));
      onArtwork({ type: "files", list });
    }

    setRawPages(prev => {
      // Always maintain full pageCount-length array
      const next = Array.from({ length: pageCount }, (_, j) => {
        if (j < prev.length && prev[j]) return prev[j];
        return { dataUrl: blankPage, label: pageLabel(j, pageCount), isBlank: true };
      });
      next[idx] = newPage;

      // Update dims from first real image if we don't have them yet
      if (!artDims && imgDims.w > 0) {
        const wIn = parseFloat((imgDims.w / 300).toFixed(3));
        const hIn = parseFloat((imgDims.h / 300).toFixed(3));
        setArtDims({ wIn, hIn, wPx: imgDims.w, hPx: imgDims.h, source: "image" });
      }
      return next;
    });

    // Set file info
    if (!fileName) setFileName(`${pageCount} individual pages`);
    setUploadPageCount(prev => Math.max(prev, idx + 1));
    if (idx === 0 && onCoverArt) onCoverArt(dataUrl);
    if (onBackCoverArt && idx === pageCount - 1) onBackCoverArt(dataUrl);
  }

  function handleSlotRemove(idx) {
    // Remove tracked file for this slot
    const updated = { ...slotFilesRef.current };
    delete updated[idx];
    slotFilesRef.current = updated;
    if (onArtwork) {
      const entries = Object.entries(updated);
      if (entries.length > 0) {
        const list = entries.sort((a, b) => Number(a[0]) - Number(b[0]))
          .map(([i, f]) => new File([f], `page_${String(i).padStart(3,"0")}_${f.name}`, { type: f.type }));
        onArtwork({ type: "files", list });
      } else {
        onArtwork({ type: "none" });
      }
    }

    setRawPages(prev => {
      const next = [...prev];
      if (idx < next.length) {
        next[idx] = { dataUrl: blankPage, label: pageLabel(idx, pageCount), isBlank: true };
      }
      // If ALL pages are now blank, clear everything
      if (next.every(p => p.isBlank)) {
        handleClear();
        return [];
      }
      return next;
    });
    if (idx === 0 && onCoverArt) onCoverArt(null);
    if (onBackCoverArt && idx === pageCount - 1) onBackCoverArt(null);
  }

  function handleSlotDrop(e, idx) {
    e.preventDefault(); e.stopPropagation();
    const file = e.dataTransfer.files?.[0];
    if (!file) return;
    activeSlotRef.current = idx;
    // Reuse handleSlotFile by synthesizing a minimal event
    handleSlotFile({ target: { files: [file] } });
  }

  // Fit toggle (light theme for inline)
  const FitToggle = ({ dark }) => (
    <div style={{ display: "flex", alignItems:"center", gap: 6 }}>
      <div style={{ display:"flex", borderRadius:6, overflow:"hidden", border:"1px solid rgba(255,255,255,.12)" }}>
        {[{ v: "crop", l: "Crop" }, { v: "cover", l: "Fill" }, { v: "contain", l: "Fit" }, { v: "scale", l: "Scale" }].map(o => (
          <button type="button" key={o.v} onClick={() => { setFitMode(o.v); if (o.v === "scale") setArtScale(100); }} style={{
            padding:"6px 14px", fontSize:11, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
            background: fitMode === o.v ? CK.cyan : "rgba(255,255,255,.06)",
            color: fitMode === o.v ? "#000" : "rgba(255,255,255,.5)",
          }}>{o.l}</button>
        ))}
        <button type="button" onClick={() => setRotateSteps(s => (s + 1) % 4)} style={{
          padding:"6px 14px", fontSize:11, fontWeight:600, border:"none", borderLeft:"1px solid rgba(255,255,255,.08)", cursor:"pointer", fontFamily:"inherit",
          background: rotateSteps > 0 ? CK.cyan : "rgba(255,255,255,.06)",
          color: rotateSteps > 0 ? "#000" : "rgba(255,255,255,.5)",
        }}>Rotate 90°{rotateSteps > 0 ? ` (${rotateSteps * 90}°)` : ""}</button>
      </div>
      {fitMode === "scale" && (
        <div style={{ display:"flex", alignItems:"center", gap:3 }}>
          <div style={{ display:"flex", borderRadius:6, overflow:"hidden", border:"1px solid rgba(255,255,255,.12)" }}>
            <button type="button" onClick={() => setArtScale(s => Math.max(10, s - 1))} style={{
              padding:"6px 10px", fontSize:12, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
              background:"rgba(255,255,255,.06)", color:"rgba(255,255,255,.5)",
            }}>−</button>
            <button type="button" onClick={() => setArtScale(s => Math.min(300, s + 1))} style={{
              padding:"6px 10px", fontSize:12, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
              background:"rgba(255,255,255,.06)", color:"rgba(255,255,255,.5)",
            }}>+</button>
          </div>
          <span style={{ fontSize:10, fontWeight:600, color:"rgba(255,255,255,.4)", minWidth:32, textAlign:"center" }}>{artScale}%</span>
        </div>
      )}
    </div>
  );

  // How many user-uploaded (non-blank) pages exist
  const filledCount = rawPages.filter(p => !p.isBlank).length;

  return (
    <div style={{ marginTop: 8 }}>
      <input ref={fileInputRef} type="file" accept=".pdf,image/*" multiple onChange={handleFiles} style={{display:"none"}} />
      <input ref={slotInputRef} type="file" accept=".pdf,image/*" onChange={handleSlotFile} style={{display:"none"}} />

      {!hasFile ? (
        /* ── No file yet: dropzone ── */
        <>
          <div data-pps-dropzone="1" className={`bp-dropzone${loading ? " has-file" : ""}${dropHover ? " drag-active" : ""}`}
            onClick={() => !loading && fileInputRef.current && fileInputRef.current.click()}
            onDrop={handleDrop} onDragOver={handleDragOver} onDragLeave={handleDragLeave}>
            {loading
              ? <div style={{ width:"80%", textAlign:"center" }}>
                  <div style={{ fontSize: 12, color: CK.cyan, marginBottom: 6 }}>
                    {loadingProgress ? `Extracting page ${loadingProgress.current} of ${loadingProgress.total}…` : "Reading file…"}
                  </div>
                  <div style={{ width:"100%", height:6, borderRadius:3, background:"rgba(0,126,255,.12)", overflow:"hidden" }}>
                    <div style={{ height:"100%", borderRadius:3, background:CK.cyan, transition:"width .15s ease-out", width: loadingProgress ? `${(loadingProgress.current / loadingProgress.total) * 100}%` : "5%" }}/>
                  </div>
                  {loadingProgress && <div style={{ fontSize:9, color:CC.light, marginTop:4 }}>{Math.round((loadingProgress.current / loadingProgress.total) * 100)}%</div>}
                </div>
              : dropHover
              ? <><div style={{ fontSize: 18 }}>📥</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: CK.cyan }}>Drop file here</div></>
              : <><div style={{ fontSize: 18, opacity: 0.5 }}>📖</div>
                  <div style={{ fontSize: 11.5, fontWeight: 600, color: CC.mid }}>Upload complete artwork PDF</div>
                  <div style={{ fontSize: 10, color: CC.light, marginTop: 2 }}>Drop a file or click to browse</div></>
            }
          </div>
          {uploadError && (
            <div role="alert" style={{ marginTop: 8, padding: "8px 10px", borderRadius: 6, border: "1px solid #f5cccc", background: "#fef2f2", fontSize: 12, color: "#8b2e2e", display: "flex", alignItems: "flex-start", gap: 8 }}>
              <span style={{ flex: 1 }}>{uploadError}</span>
              <button type="button" onClick={() => setUploadError("")} style={{ border: "none", background: "transparent", color: "#8b2e2e", fontSize: 14, cursor: "pointer", fontFamily: "inherit", padding: 0, lineHeight: 1 }}>✕</button>
            </div>
          )}
          <button type="button" onClick={() => generateTemplate(dims.w, dims.h, pageCount, sizeLabel, roundCorner)} style={{
            width: "100%", marginTop: 6, padding: "8px", borderRadius: 4, border: `1px dashed ${CC.border}`,
            background: "#fafafa", color: CC.mid, fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
          }}>📐 Download Artwork Template ({dims.w}×{dims.h}″ · {pageCount}pg)</button>
        </>
      ) : (artApproved && proof === 0) ? (
        /* ── Approved state — green compact view ── */
        <div style={{ padding:"12px 14px", borderRadius:6, background:"#f0fdf4", border:"1px solid #86efac" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ width:22, height:22, borderRadius:"50%", background:"#22c55e", display:"inline-flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:13, fontWeight:700, flexShrink:0 }}>✓</span>
              <div>
                <span style={{ fontSize:12, fontWeight:700, color:"#166534" }}>Artwork Approved</span>
                <span style={{ fontSize:10, color:"#6ee7b7", marginLeft:8 }}>{fileName} · {filledCount}/{pageCount}pg</span>
              </div>
            </div>
            <div style={{ display:"flex", gap:4 }}>
              <button type="button" onClick={() => setArtApproved(false)} style={{
                padding:"3px 10px", fontSize:10, fontWeight:600, borderRadius:4, cursor:"pointer", fontFamily:"inherit",
                border:"1px solid #86efac", background:"#fff", color:"#16a34a",
              }}>Review</button>
              <button type="button" onClick={() => { if(confirm("Remove all artwork and reset?")) handleClear(); }} style={{
                padding:"3px 6px", fontSize:10, borderRadius:4, cursor:"pointer", fontFamily:"inherit",
                border:"1px solid #86efac", background:"#fff", color:"#a3a3a3",
              }}>✕</button>
            </div>
          </div>
        </div>
      ) : (
        /* ── Has file, not yet approved: inline controls + pill selector ── */
        <div>
          {/* File header */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <div style={{ fontSize: 11, color: CC.mid, fontWeight: 500 }}>
              📄 {fileName} · {filledCount}/{pageCount}pg
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <button type="button" onClick={() => generateTemplate(dims.w, dims.h, pageCount, sizeLabel, roundCorner)} style={{
                padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                border: `1px solid ${CC.border}`, background: CC.white, color: CC.mid,
              }}>📐 Download Template</button>
              {onSizeOverride && (
                <button type="button" onClick={() => {
                  if (confirm("This will change your selected booklet size to match the uploaded artwork dimensions. Continue?")) handleMatchSize();
                }} style={{
                  padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                  border: `1px solid ${CC.border}`, background: CC.white, color: CC.mid,
                }}>↔ Match ordered size to art</button>
              )}
              <button type="button" onClick={() => { if(confirm("Remove all artwork and reset?")) handleClear(); }} style={{ fontSize: 10, padding: "3px 8px", borderRadius: 4, border: `1px solid ${CC.border}`, background: CC.white, color: CC.light, cursor: "pointer", fontFamily: "inherit" }}>Remove uploads</button>
            </div>
          </div>

          {/* Inline preflight */}
          {preflight && preflight.length > 0 && (
            <div style={{ marginBottom: 6, padding: "8px 10px", borderRadius: 6, background: "#fafafa", border: `1px solid ${CC.border}` }}>
              {preflight.map((c, i) => (
                <div key={i} style={{ display: "flex", alignItems: "baseline", gap: 7, padding: "2px 0", flexWrap:"wrap" }}>
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: PF[c.level].dot, flexShrink: 0, marginTop: 2 }} />
                  <span style={{ fontSize: 10.5, fontWeight: 600, color: PF[c.level].text, minWidth: 72 }}>{c.label}</span>
                  <span style={{ fontSize: 10, color: CC.mid, flex:1 }}>{c.detail}</span>
                </div>
              ))}
              {reconcileInfo && reconcileInfo.type === "padded" && (
                <div style={{ display:"flex", alignItems:"baseline", gap:7, padding:"2px 0" }}>
                  <span style={{ width:7, height:7, borderRadius:"50%", background:"#b8860b", flexShrink:0, marginTop:2 }}/>
                  <span style={{ fontSize:10.5, fontWeight:600, color:"#b8860b", minWidth:72 }}>Pages</span>
                  <span style={{ fontSize:10, color:CC.mid }}>{reconcileInfo.count} blank{reconcileInfo.count>1?"s":""} added ({reconcileInfo.raw}→{reconcileInfo.target})</span>
                </div>
              )}
            </div>
          )}

          {/* ── Pill Selector: Proof | Preview ── (wrapped brochure-style) */}
          {(() => {
            const needsApproval = proof === 0 && !artApproved;
            return (
              <div style={{
                display:"flex", flexDirection:"column", gap:6, marginBottom:8,
                padding: needsApproval ? "10px 12px" : 0,
                background: needsApproval ? "#fef2f2" : "transparent",
                border: needsApproval ? "1px solid #fecaca" : "none",
                borderRadius: 6,
              }}>
                <div style={{ display:"flex", borderRadius:6, overflow:"hidden", border:`1px solid ${CC.border}`, boxShadow:"0 1px 3px rgba(0,0,0,.06)" }}>
                  <button type="button" onClick={() => { setActiveModal("proof"); setProofIdx(0); setProofView("single"); }} style={{
                    flex:1, padding:"11px 10px", fontSize:13, fontWeight:700, border:"none", cursor:"pointer", fontFamily:"inherit",
                    display:"flex", alignItems:"center", justifyContent:"center", gap:6,
                    background: artApproved && proof===0
                      ? "linear-gradient(135deg, #22c55e 0%, #16a34a 100%)"
                      : "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)",
                    color: artApproved && proof===0 ? "#fff" : "#555",
                    borderRight:`1px solid ${CC.border}`,
                  }}>
                    {artApproved && proof===0 ? "✓ Proof Approved" : "🔍 Proof"} {needsApproval && <span style={{ fontSize: 9, fontWeight: 700, background: "#fee2e2", color: "#dc2626", padding: "1px 6px", borderRadius: 4 }}>required</span>}
                    {debug && <span title="Proof debug mode is on (?debug=1)." style={{ marginLeft:8, fontSize:9, fontWeight:700, background:"rgba(251,191,36,.18)", color:"#fbbf24", padding:"2px 8px", borderRadius:4, letterSpacing:".06em", textTransform:"uppercase", border:"1px solid rgba(251,191,36,.4)" }}>🔧 Debug</span>}
                  </button>
                  <button type="button" onClick={() => { setActiveModal("preview"); setPreviewMode("closed"); setRot({x:-15,y:-25}); }} style={{
                    flex:1, padding:"11px 10px", fontSize:13, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
                    display:"flex", alignItems:"center", justifyContent:"center", gap:6,
                    background: "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)", color: "#555",
                  }}>
                    📖 Preview
                  </button>
                </div>
                {needsApproval && (
                  <div style={{ fontSize: 11, color: "#b91c1c", lineHeight: 1.4 }}>
                    Open proof to review bleed, trim, safety and approve artwork
                  </div>
                )}
              </div>
            );
          })()}

          {/* Proof messages for non-online-proof modes */}
          {proof === 0.01 && (
            <div style={{ padding:"10px 12px", borderRadius:6, background:"#f0f9ff", border:"1px solid #bae6fd", marginBottom:6, fontSize:11, color:CC.mid, lineHeight:1.5 }}>
              <strong style={{color:CC.dark}}>Manual Digital Proof selected</strong> — We'll review your art and endeavor to ensure compatibility with our processes. A proof will be emailed for your approval before printing.
            </div>
          )}
          {proof >= 3 && (
            <div style={{ padding:"10px 12px", borderRadius:6, background:"#fefce8", border:"1px solid #fde68a", marginBottom:6, fontSize:11, color:CC.mid, lineHeight:1.5 }}>
              <strong style={{color:"#854d0e"}}>Hardcopy Proof selected</strong> — We'll issue a mailed proof. The hardcopy may or may not include binding and is primarily for review of print and papers.
            </div>
          )}
        </div>
      )}

      {/* ── Page Slots Grid — collapsible (hidden when approved) ── */}
      {hasFile && !(artApproved && proof === 0) && <div style={{ marginTop: 8 }}>
        <div onClick={() => setSlotsOpen(o => !o)} style={{ display:"flex", alignItems:"center", gap:6, cursor:"pointer", padding:"6px 0", userSelect:"none" }}>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={CC.mid} strokeWidth="2.5" style={{ transform:slotsOpen?"rotate(90deg)":"rotate(0deg)", transition:"transform .2s" }}><polyline points="9 6 15 12 9 18"/></svg>
          <span style={{ fontSize:10.5, fontWeight:600, color:CC.mid }}>Upload pages individually</span>
          <span style={{ fontSize:9, color:CC.light }}>({filledCount}/{pageCount} filled)</span>
        </div>
        {slotsOpen && <div style={{ display:"grid", gridTemplateColumns:`repeat(auto-fill, minmax(${mob ? 56 : 68}px, 1fr))`, gap: 6, marginTop: 4 }}>
        {displayPages.map((p, i) => {
          const isEmpty = p.isBlank;
          const isUserPage = !isEmpty;
          return (
            <div key={i} data-pps-dropzone="1" style={{ position:"relative", textAlign:"center" }}
              onDragOver={e => { e.preventDefault(); e.currentTarget.style.outline = `2px solid ${CK.cyan}`; }}
              onDragLeave={e => { e.currentTarget.style.outline = "none"; }}
              onDrop={e => { e.currentTarget.style.outline = "none"; handleSlotDrop(e, i); }}>
              <div onClick={() => handleSlotClick(i)} style={{
                  width: "100%", aspectRatio: `${dims.w} / ${dims.h}`,
                  borderRadius: 3, overflow: "hidden", cursor: "pointer",
                  border: isEmpty ? `1.5px dashed ${CC.border}` : `1px solid ${CC.border}`,
                  background: isEmpty ? "#fafafa" : "none",
                  display: "flex", alignItems: "center", justifyContent: "center",

      {activeModal === "preview" && hasFile && (

function buildSummary(config, result) {
  const lines = [];
  const r = result;
  const sh = r.shipping || {};

  // Size & quantity
  const setsStr = config.sets.map(s =>
    `${s.qty.toLocaleString()} qty × ${s.pages}pg` + (s.name ? ` "${s.name}"` : "")
  ).join(", ");
  lines.push(`${config.sizeLabel} · ${setsStr}`);

  // Paper
  const colorName = v => v === "color" ? "Full Color" : "Black & White";
  lines.push(`Inside: ${config.insidePaper.label} · ${colorName(config.insideColor)}`);
  if (config.coverMode !== "same") {
    lines.push(`Cover: ${config.coverPaper.label} · ${colorName(config.coverColor)}`);
  } else {
    lines.push(`Cover: Self-cover (same as inside)`);
  }

  // Binding
  const staple = r.twoAuto || config.twoStaple ? "Two Staples" : "Single Staple";
  lines.push(staple);

  // Finishing — only if selected
  const coat = COATINGS.find(x => x.val === config.coating);
  if (coat && coat.val > 0) lines.push(coat.label);
  const bund = BUNDLING.find(x => x.val === config.bundling);
  if (bund && bund.val > 0) lines.push(bund.label);
  const rc = CORNERS.find(x => x.val === config.roundCorner);
  if (rc && rc.val > 0) lines.push(rc.label);
  if (config.vividPrint) lines.push("Enhanced Vivid Print");

  // Artwork
  const art = ART_OPTS.find(x => x.val === config.artwork);
  if (art) lines.push(art.label);
  const bld = BLEED_OPTS.find(x => x.val === config.bleed);
  if (bld && bld.val > 0) lines.push(bld.label);
  if (config.proof > 0) lines.push(config.proof >= 3 ? "Hardcopy Proof" : "Digital Proof");

  // Delivery — stored as business days, not calendar dates
  if (config.needByDate && sh.rushCost > 0) {
    lines.push(`Rush: ${sh.bizDaysToDate} business days · ${sh.rushMultiplier.toFixed(2)}×`);
  } else {
    lines.push(`Standard delivery: ${sh.freeDeliveryBizDays} business days`);
  }
  lines.push(`Ship to: ${config.shipState}${config.shipAddr?.zip ? " "+config.shipAddr.zip : ""}`);

  return lines.join("\n");
}

function buildMetadata(config, result) {
  const sh = result.shipping || {};
  return JSON.stringify({
    // Customer selections
    sizeLabel: config.sizeLabel,
    customLong: config.customLong,
    customShort: config.customShort,
    bindDir: config.bindDir,
    sets: config.sets,
    insideColor: config.insideColor,
    coverColor: config.coverColor,
    insidePaper: config.insidePaper,
    insidePaperType: config.insidePaperType,
    coverMode: config.coverMode,
    coverPaper: config.coverPaper,
    coverPaperType: config.coverPaperType,
    twoStaple: config.twoStaple,
    vividPrint: config.vividPrint,
    coating: config.coating,
    bundling: config.bundling,
    roundCorner: config.roundCorner,
    artwork: config.artwork,
    artEditPages: config.artEditPages,
    bleed: config.bleed,
    proof: config.proof,
    // Per-page art transforms — what the customer approved per page in the
    // proof modal. Keyed by page index → { fitMode, artScale, rotateSteps }.
    // (Phase 2: server-side rendering will use these to produce print-ready
    // files. Earlier code stored these as four flat scalars, which both
    // crashed handleAddToOrder via ReferenceError and silently lost the
    // per-page distinction.)
    pageTransforms: config.pageTransforms || {},
    artDims: config.artDims || null,
    shipState: config.shipState,
    shipZip: config.shipZip || '',
    shipAddr: config.shipAddr || {},
    needByDate: config.needByDate,
    // Shipping — stored as durations, not dates
    transitDays: sh.transitDays,
    productionBizDays: sh.productionBizDays,
    requestedBizDays: sh.bizDaysToDate || sh.freeDeliveryBizDays,
    freeDeliveryBizDays: sh.freeDeliveryBizDays,
    rushMultiplier: sh.rushMultiplier,
    rushCost: sh.rushCost,
    // Production schedule
    productionStartDate: sh.productionStartYMD,
    mustShipByDate: sh.mustShipYMD,
    estimatedDeliveryDate: config.needByDate || sh.freeDeliveryYMD,
    // Computed results
    total: result.total,
    baseTotal: result.baseTotal,
    perUnit: result.perUnit,
    totalQty: result.tQ,
    days: result.days,
    debug: result.debug,
  });
}

// Upload a FormData via XHR with progress callback — returns parsed JSON response
function uploadWithProgress(url, formData, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.withCredentials = true;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch (err) { reject(new Error("Invalid server response")); }
    };
    xhr.onerror = () => reject(new Error("Network error during upload"));
    xhr.send(formData);
  });
}

async function submitToWooCommerce(total, summary, metadata, rushCost, artFiles, onProgress) {
  const PPS = window.PPS_CONFIG || {};

  // ── Standalone mode: download artwork + order summary as a zip-like package ──
  if (!PPS.ajaxUrl) {
    console.warn("PPS: Standalone mode — triggering local download.");
    // Build a text summary
    const lines = [
      "PPS Order Summary", "=" .repeat(40), "",
      `Total: $${total.toFixed(2)}`, `Rush: $${rushCost.toFixed(2)}`, "",
      "Summary:", summary, "",
      "Metadata:", metadata, "",
      `Artwork: ${artFiles.type === "files" ? artFiles.list.map(f => f.name).join(", ") : artFiles.type === "existing" ? artFiles.path : "none"}`, ""
    ];
    // Download summary text
    const blob = new Blob([lines.join("\n")], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pps_order_summary.txt";
    a.click();
    URL.revokeObjectURL(a.href);
    // Download each artwork file
    if (artFiles.type === "files") {
      for (const file of artFiles.list) {
        const url = URL.createObjectURL(file);
        const dl = document.createElement("a");
        dl.href = url;
        dl.download = file.name;
        dl.click();
        URL.revokeObjectURL(url);
      }
    }
    alert(`Standalone mode: downloaded order summary${artFiles.type === "files" ? " + " + artFiles.list.length + " artwork file(s)" : ""}.`);
    return;
  }

  // ── Server mode ──
  let artworkPath = "";

  if (artFiles.type === "files") {
    const total_files = artFiles.list.length;
    for (let fi = 0; fi < total_files; fi++) {
      const file = artFiles.list[fi];
      try {
        const fd = new FormData();
        fd.append("action", "pps_upload_artwork");
        fd.append("nonce", PPS.uploadNonce);
        fd.append("artwork", file, file.name);
        if (onProgress) onProgress({ phase: "upload", fileIdx: fi, fileCount: total_files, fileName: file.name, pct: 0 });
        const data = await uploadWithProgress(PPS.ajaxUrl, fd, (pct) => {
          if (onProgress) onProgress({ phase: "upload", fileIdx: fi, fileCount: total_files, fileName: file.name, pct });
        });
        if (data.success && data.data.path) {
          if (!artworkPath) artworkPath = data.data.path;
        } else {
          alert("Artwork upload failed: " + (data.data || "Unknown error") + "\nPlease try again.");
          return;
        }
      } catch (err) {
        alert("Artwork upload error: " + err.message + "\nPlease try again.");
        return;
      }
    }
    if (onProgress) onProgress({ phase: "cart", pct: 100 });
  } else if (artFiles.type === "existing") {
    artworkPath = artFiles.path;
  }

  // Add to cart
  try {
    const fd = new FormData();
    fd.append("action", "pps_add_to_cart");
    fd.append("nonce", PPS.cartNonce);
    fd.append("product_id", PPS.productId);
    fd.append("pps_price", total.toFixed(2));
    fd.append("pps_rush", rushCost.toFixed(2));
    fd.append("pps_summary", summary);
    fd.append("pps_metadata", metadata);
    const parsed = JSON.parse(metadata);
    fd.append("pps_biz_days", String(parsed.requestedBizDays || parsed.freeDeliveryBizDays || 5));
    if (artworkPath) fd.append("pps_artwork_path", artworkPath);

    const resp = await fetch(PPS.ajaxUrl, { method: "POST", credentials: "same-origin", body: fd });
    const data = await resp.json();
    if (data.success) {
      window.location.href = PPS.cartUrl;
    } else {
      alert("Error: " + (data.data || "Could not add to cart."));
    }
  } catch (err) {
    alert("Network error: " + err.message);
  }
}

  }),[sets,sizeLabel,customLong,customShort,bindDir,insideColor,coverColor,

  }, [result, sets, sizeLabel,customLong,customShort,bindDir,insideColor,coverColor,

  // NOTE: hardcopy proof is NOT auto-removed — always available as option

  const[shareCopied,setShareCopied]=useState(false);

  return(

      `}</style>
      {/* Hero header — bold mockup treatment (eyebrow + 44px uppercase display + tagline) */}
      <section style={{maxWidth:1180,margin:"0 auto",padding:mob?"18px 14px 6px":"34px 28px 18px"}}>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",flexWrap:"wrap",gap:mob?10:20}}>

            <h1 style={{fontFamily:"'Segoe UI','Helvetica Neue',Arial,sans-serif",fontWeight:800,lineHeight:1,letterSpacing:"-0.02em",color:CC.dark,textTransform:"uppercase",margin:mob?"8px 0 0":"10px 0 0",maxWidth:720,fontSize:mob?28:44}}>
