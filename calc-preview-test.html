<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 0; }
  /* 3D Book Preview Styles */
  .bp-viewport{width:100%;height:200px;perspective:1200px;display:flex;align-items:center;justify-content:center;cursor:grab;overflow:hidden;border-radius:8px;background:linear-gradient(135deg,#1a1d23,#2a2e36);border:1px solid rgba(255,255,255,.08);position:relative;transition:border-color .2s}

  .bp-scene{transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,0,.2,1)}
  .bp-closed{position:relative;transform-style:preserve-3d}
  .bp-face{position:absolute;background-position:center;background-repeat:no-repeat;backface-visibility:hidden;image-rendering:auto;overflow:hidden}
  .bp-face.front{transform:translateZ(var(--half-depth,1px))}
  .bp-face.back{transform:rotateY(180deg) translateZ(var(--half-depth,1px))}
  .bp-face.spine{transform:rotateY(-90deg) translateX(calc(var(--half-depth,1px) * -1));transform-origin:left center;background:linear-gradient(90deg,rgba(0,0,0,.15),#555,rgba(0,0,0,.15))}
  .bp-face.top-edge{transform:rotateX(90deg) translateY(calc(var(--half-depth,1px) * -1));transform-origin:top center;background:linear-gradient(180deg,#f5f0e8,#e8e0d4,#f0ebe3)}
  .bp-face.bottom-edge{transform:rotateX(-90deg) translateY(var(--half-depth,1px));transform-origin:bottom center;background:linear-gradient(180deg,#f5f0e8,#e8e0d4,#f0ebe3)}
  .bp-face.fore-edge{right:0;transform:rotateY(90deg) translateX(var(--half-depth,1px));transform-origin:right center;background:linear-gradient(180deg,#f5f0e8,#e8e0d4,#f0ebe3)}
  /* Open book */
  .bp-open{position:relative;transform-style:preserve-3d;display:none}
  .bp-open .bp-page{position:absolute;top:0;background:#f8f5f0;overflow:hidden;backface-visibility:hidden}

  .bp-page-num{position:absolute;bottom:6px;font-size:9px;color:rgba(0,0,0,.3);font-family:'Segoe UI',sans-serif}

<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

function useIsMobile(breakpoint=700){
  const[m,setM]=useState(()=>typeof window!=="undefined"?window.innerWidth<breakpoint:false);
  useEffect(()=>{
    const h=()=>setM(window.innerWidth<breakpoint);
    window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);
  },[breakpoint]);
  return m;
}

// ═══════════════════════════════════════════════════════════════
// PRIORITY PRINT SERVICE — Saddlestitch Booklet Calculator v8
//
// CMYK color scheme from "Printing in Full Color" logo
// Binding edge > 5.25" = auto two staple (no single option)
// Hardcopy proof always visible (warning if non-factory paper)
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// ADMIN CONFIG OVERRIDE — reads from PPS_CONFIG.calc (injected by PHP)
// Falls back to hardcoded defaults for standalone testing
// ═══════════════════════════════════════════════════════════════
const _CFG = (typeof window !== 'undefined' && window.PPS_CONFIG && window.PPS_CONFIG.calc) ? window.PPS_CONFIG.calc : {};

const PCF = Object.assign({
  printing_fullcolor_cost:0.05, printing_black_cost:0.01,
  labor_press_hr:35, labor_bindery_hr:35, labor_cutting_hr:45,
  labor_horizonspf20_hr:50, labor_horizonspf20_setup:35,
  press_printsperhour:600, bindery_morgana_impressionperhour:750,
  cutter_sheetsperhour:15000, horizonspf20_sheetsperhour:4000,
  cutterbasefee:7.5, sheetsturnaround:2500,
  backend_maximummarkup:15.2, backend_minimummarkup:3.5,
  easydiscount_max:0, uvcoaterimpressionsperhour:250,
  // Booklet-specific markup overrides (separate from brochure backend_* values)
  booklet_maximummarkup:3.6, booklet_minimummarkup:1.45,
  booklet_markup_coef_tS:0.15, booklet_markup_coef_pages:0.30,
  booklet_size_discount:0, booklet_surcharge:0.30,
  roundcornerperhour:75, bundlesperhour:50, addon_roundcornermaxdays:30,
  art_pagesperhour:8, art_newdesignmodifier:0.5,
  sheetsforlowcosthardcopyproof:1500,
  minimum_turnaround_days:3,
  two_staple_threshold:5.25,     // binding edge > this = auto two staple
  non_inventory_fee:35,          // surcharge for non-stock papers
  bw_discount_rate:0.3,          // press cost reduction for B&W
  easy_discount_rate:0.05,       // materials discount for easy (imp≥4) sizes
  common_discount_max:1500,   // competitive discount toggle (any value >0 enables full labor discount for common sizes at qty>250; 0 disables). Legacy name — no longer a $ cap.
  bundling_base_fee:7,           // flat add-on for any bundling
  proof_hardcopy_cost:35,        // hardcopy proof base price
  proof_digital_cost:10,         // digital proof base price
  sets_surcharge:20,             // per-set surcharge ($20×N - $20)
  bleed_minimum:15,              // minimum charge for adding bleeds
  default_transit_days:4,        // fallback when state not in transit map
  // Shipping & Rush
  shop_timezone:"America/Phoenix",  // IANA timezone — no DST in AZ
  shop_cutoff_hour:14,              // 2:00 PM — orders after this = next business day
  free_shipping_buffer:1.5,           // multiplier on production days for free ship ETA
  // Shippo integration (future) — when shippo_api_token is set, zip-based ETAs replace static transit map
  shippo_api_token:"",              // Shippo API Live Token — leave empty to use static transit map
  shippo_origin_zip:"85027",        // Shop origin zip for rate/ETA lookups
}, _CFG.pcf || {});

// Ground transit days from facility (Phoenix AZ) — state-level fallback
const TRANSIT_DAYS = _CFG.transit_days || {
  AZ:1,
  CA:2,CO:2,NM:2,NV:2,UT:2,
  ID:3,OR:3,TX:3,WA:3,
  AL:4,AR:4,FL:4,IA:4,IL:4,IN:4,KS:4,KY:4,LA:4,MI:4,MN:4,MO:4,MS:4,MT:4,ND:4,NE:4,OK:4,PA:4,SD:4,TN:4,WI:4,WV:4,WY:4,
  MA:5,NC:5,NJ:5,NY:5,OH:5,SC:5,VA:5,
  CT:6,DC:6,DE:6,MD:6,ME:6,NH:6,VT:6,
  AK:7,HI:7,PR:7,RI:7,
  VI:9,MP:7,
};
const US_STATES = Object.keys(TRANSIT_DAYS).sort();

// UPS Ground zone map: 3-digit ZIP prefix → transit days (from admin or seed)
const _PPS = window.PPS_CONFIG || {};
const ZONE_MAP = _PPS.zoneMap || {};
const HAS_ZONE_MAP = Object.keys(ZONE_MAP).length > 100;

// Look up transit days: zip-prefix first (granular), state fallback
function getTransitDays(state, zip) {
  if (HAS_ZONE_MAP && zip && zip.length >= 3) {
    const pfx = zip.replace(/[^0-9]/g,"").substring(0,3).padStart(3,"0");
    if (ZONE_MAP[pfx]) return ZONE_MAP[pfx];
  }
  return TRANSIT_DAYS[state] || PCF.default_transit_days;
}

// ── Shop closures: holidays + random days off ──
// Format: "YYYY-MM-DD" or "MM-DD" for annual recurring
const SHOP_CLOSURES = _CFG.closures || [
  // Annual recurring (MM-DD)
  "01-01",  // New Year's Day
  "07-04",  // Independence Day
  "12-25",  // Christmas Day
  "12-24",  // Christmas Eve
  "11-28",  // Thanksgiving (approx — update yearly)
  "11-29",  // Day after Thanksgiving
  // Specific one-off closures (YYYY-MM-DD)
  // "2026-03-15", // example: random day off
];

// Check if a date is a business day (M-F, not a closure)
function isBusinessDay(d) {
  const dow = d.getDay(); // 0=Sun, 6=Sat
  if (dow === 0 || dow === 6) return false;
  const mmdd = String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const ymd = d.toISOString().split("T")[0];
  for (const c of SHOP_CLOSURES) {
    if (c === mmdd || c === ymd) return false;
  }
  return true;
}

// Add N business days to a date, returning the landing date
function addBusinessDays(start, n) {
  const d = new Date(start);
  let added = 0;
  while (added < n) {
    d.setDate(d.getDate() + 1);
    if (isBusinessDay(d)) added++;
  }
  return d;
}

// Count business days between two dates (exclusive of start, inclusive of end)
function businessDaysBetween(a, b) {
  let count = 0;
  const d = new Date(a);
  while (d < b) {
    d.setDate(d.getDate() + 1);
    if (isBusinessDay(d)) count++;
  }
  return count;
}

// Get "today" in shop timezone, respecting cutoff hour.
// After cutoff, production start = next business day.
function getShopToday() {
  const now = new Date();
  const shopStr = now.toLocaleString("en-US", { timeZone: PCF.shop_timezone });
  const shopNow = new Date(shopStr);
  const shopHour = shopNow.getHours();
  
  const ymd = now.toLocaleDateString("en-CA", { timeZone: PCF.shop_timezone });
  let todayDate = new Date(ymd + "T00:00:00");
  
  // If past cutoff OR today isn't a business day, advance to next business day
  if (shopHour >= PCF.shop_cutoff_hour || !isBusinessDay(todayDate)) {
    todayDate.setDate(todayDate.getDate() + 1);
    while (!isBusinessDay(todayDate)) {
      todayDate.setDate(todayDate.getDate() + 1);
    }
  }
  return todayDate;
}

function fmtDate(d) {
  return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
}

function toYMD(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

const PAGE_COUNTS = _CFG.page_counts || [8,12,16,20,24,28,32,36,40,44,48,52,56,60,64];

// bindEdge = dimension that stays constant when opened (spine/staple edge)

function calcCustomImp(longest, shortest, bindDir) {
  const sA=x=>{const r=18.5/x;return r<.5?0:r<1?.5:r<2?1:r<3?2:r<4?3:r<5?4:4};
  const sB=x=>{const r=12.5/x;return r<2?1:r<3?2:2};
  return bindDir==="short"?sA(longest)*sB(shortest):sA(shortest)*sB(longest);
}

// Papers: factory = factory-coated (non-inventory), coatable = surface supports UV coating
const PAPERS_NC = _CFG.papers_nc || [

const INV_NC=_INV_NC, INV_CS=_INV_CS, COVER_INV=[COVER_SAME.val,...INV_CS];
// Combined paper lists: text weight first, then cardstock with suffix
const ALL_PAPERS=[...PAPERS_NC.map(p=>({...p,type:"noncardstock"})),...PAPERS_CS.map(p=>({...p,label:p.label+" (Cardstock)",type:"cardstock"}))];
const isCardstockVal=v=>PAPERS_CS.some(p=>p.val===v);

const COATINGS=_CFG.coatings||[{label:"No Additional Coating",val:0,price:0},{label:"UV Gloss",val:750,price:0.03},{label:"UV Matte",val:510,price:0.04}];
const BUNDLING=_CFG.bundling||[{label:"No Bundling",val:0,price:500},{label:"Bundle in 25s",val:750,price:25},{label:"Bundle in 50s",val:1500,price:50},{label:"Bundle in 100s",val:3000,price:100}];
const CORNERS=_CFG.corners||[{label:"No Round Cornering",val:0,price:0},{label:'¼" Round — Outside 2',val:216,price:0.2},{label:'⅜" Round — Outside 2',val:215,price:0.15},{label:'¼" Round — All 4',val:108,price:0.1},{label:'⅜" Round — All 4',val:107,price:0.075}];
const ART_OPTS=_CFG.art_opts||[{label:"Upload Art with Order",val:0.01,price:0},{label:"Email Art After Order",val:0.02,price:0},{label:"Artwork already discussed",val:0.03,price:0},{label:"I have a design in Canva",val:0.04,price:0},{label:"Artwork needs edits",val:2.01,price:75},{label:"Design from scratch",val:4.01,price:75}];
const BLEED_OPTS=_CFG.bleed_opts||[{label:"My artwork has proper bleeds",val:0,price:0},{label:"I don't have bleeds",val:1,price:0.5}];

// ═══════════════════════════════════════════════════════════════
// SIZE + PRICING
// ═══════════════════════════════════════════════════════════════

function pageLabel(idx, total) {
  if (idx === 0) return "Front Cover";
  if (idx === 1) return "Inside Front Cover";
  if (idx === total - 2 && total > 2) return "Inside Back Cover";
  if (idx === total - 1) return "Back Cover";
  return "Page " + (idx + 1);
}

function resolveSize(c) {
  // Signature limit: 12.5×27" press sheet BEFORE bleed
  // With 0.125" bleed per side: max trim spine = 12.25", max trim open = 13.25"
  const MAX_SPINE_TRIM = 12.25; // 12.5 - 0.25 bleed
  const MAX_OPEN_TRIM = 13.25;  // (27/2) - 0.25 bleed

  if (c.sizeLabel==="Custom Size") {
    let longest=Math.max(c.customLong||0,c.customShort||0);
    let shortest=Math.min(c.customLong||0,c.customShort||0);
    if(longest<2.5||shortest<2.5) return {imp:0,bindEdge:0,isCustom:true,errors:["Enter dimensions (min 2.5\")"],clamped:null};

    // Match against known presets
    const match=ALL_SIZES.find(s=>{
      const m=s.label.match(/([\d.]+)×([\d.]+)/);
      if(!m) return false;
      const pw=parseFloat(m[1]),ph=parseFloat(m[2]);
      return Math.abs(longest-Math.max(pw,ph))<0.05&&Math.abs(shortest-Math.min(pw,ph))<0.05;
    });
    if(match) return {imp:match.imp,bindEdge:match.bindEdge,isCustom:false,errors:[],clamped:null};

    // Determine spine and open side based on bind direction
    const bindEdge = c.bindDir==="short" ? shortest : longest;
    const openSide = c.bindDir==="short" ? longest : shortest;

    // Check signature limits and auto-clamp
    const errors = [];
    let clamped = null;
    if (bindEdge > MAX_SPINE_TRIM || openSide > MAX_OPEN_TRIM) {
      const clampedSpine = Math.min(bindEdge, MAX_SPINE_TRIM);
      const clampedOpen = Math.min(openSide, MAX_OPEN_TRIM);
      const newLong = Math.max(clampedSpine, clampedOpen);
      const newShort = Math.min(clampedSpine, clampedOpen);

      if (bindEdge > MAX_SPINE_TRIM) {
        errors.push(`Spine (${bindEdge}″) exceeds ${MAX_SPINE_TRIM}″ max — clamped to ${clampedSpine}″.`);
      }
      if (openSide > MAX_OPEN_TRIM) {
        errors.push(`Open side (${openSide}″) exceeds ${MAX_OPEN_TRIM}″ max — clamped to ${clampedOpen}″.`);
      }
      errors.push(`Press sheet limit: 12.5×27″. Dimensions adjusted.`);
      clamped = { long: newLong, short: newShort };
      longest = newLong;
      shortest = newShort;
    }

    const imp = calcCustomImp(longest, shortest, c.bindDir);
    const finalBindEdge = c.bindDir==="short" ? shortest : longest;
    if(imp<=0) errors.push("Cannot produce — adjust dimensions.");
    return {imp:Math.max(imp,0.5),bindEdge:finalBindEdge,isCustom:true,errors,clamped};
  }
  const p=ALL_SIZES.find(s=>s.label===c.sizeLabel)||ALL_SIZES[0];
  return {imp:p.imp,bindEdge:p.bindEdge,isCustom:false,errors:[],clamped:null};
}

function calculate(c) {
  const sz=resolveSize(c); const imp=sz.imp;
  const sets=c.sets.filter(s=>s.qty>0&&s.pages>0);
  if(!sets.length||sz.errors.length>0) return {error:sz.errors,sz};

  const N=sets.length;
  const coat=COATINGS.find(x=>x.val===c.coating)||COATINGS[0];
  const bund=BUNDLING.find(x=>x.val===c.bundling)||BUNDLING[0];
  const rc=CORNERS.find(x=>x.val===c.roundCorner)||CORNERS[0];
  const art=ART_OPTS.find(x=>x.val===c.artwork)||ART_OPTS[0];
  const bld=BLEED_OPTS.find(x=>x.val===c.bleed)||BLEED_OPTS[0];
  const cvr=c.coverMode==="same"?COVER_SAME:c.coverPaper;

  const tQ=sets.reduce((s,x)=>s+x.qty,0);
  const tP=sets.reduce((s,x)=>s+x.pages,0);
  const tS=sets.reduce((s,x)=>s+(x.qty*x.pages)/4,0)/(imp/2);
  const dL=PCF.booklet_markup_coef_tS*Math.log(tS)+PCF.booklet_markup_coef_pages*Math.log(tP);
  const mk=Math.max(PCF.booklet_maximummarkup-dL,PCF.booklet_minimummarkup);
  const spine=((((tP/2)*c.insidePaper.price)+cvr.price)*tQ)*0.10;
  const csOK=sets.every(s=>s.pages<=24);

  const cvrScoring=COVER_SCORING_VALS.includes(cvr.val);
  const csInside=c.insidePaperType==="cardstock"&&csOK;
  const artWork=art.val>=2;
  const q100=sets.some(s=>s.qty>=100);
  const q250=sets.some(s=>s.qty>250);
  const coatPaper=c.coverMode==="same"?c.insidePaper:cvr;
  const coatOK=coatPaper.coatable;
  const hcOK=c.insidePaper.factory;

  // Two staple: auto (no extra charge) for binding edge > 5.25"
  // Only charges when user opts in on small sizes (binding edge <= 5.25")
  const twoAuto=sz.bindEdge>TWO_STAPLE_THRESH;
  const twoOptIn=!twoAuto&&c.twoStaple;
  const twoApplied=twoAuto||twoOptIn;

  const easySize=!sz.isCustom?imp>=4:false;
  const commonSize=!sz.isCustom?["5.5×8.5 (Opens to 8.5×11)","8.5×11 (Opens to 11×17)"].includes(c.sizeLabel):false;

  const P={};
  P.insidePrint=c.insideColor==="bw"?((PCF.printing_black_cost*2)*tS)*mk:((PCF.printing_black_cost*2+PCF.printing_fullcolor_cost*2)*tS)*mk;
  // FIX 2026-04-14: cover print must scale with tQ (qty), not tS (inside sheets).
  // Cover is 1 sheet per book — cost should not depend on page count. Old formula:
  //   ((PCF.printing_fullcolor_cost*tS)*2)/imp)*mk
  // caused saddle-stitch to overcharge by 2-8x at 16-32pp configurations.
  P.coverPrint=c.coverColor==="bw"?(((PCF.printing_black_cost*2)*tQ)/imp)*mk:(((PCF.printing_fullcolor_cost*2)*tQ)/imp)*mk;
  P.insidePaper=(c.insidePaper.price*tS)*mk;
  P.coverPaper=((cvr.price*tQ)/imp)*mk;
  P.press=(tS/PCF.press_printsperhour)*PCF.labor_press_hr;
  P.cutting=((tS*imp)/PCF.cutter_sheetsperhour)*(PCF.labor_cutting_hr+mk)+PCF.cutterbasefee;
  P.scoreCover=cvrScoring?(tQ/PCF.bindery_morgana_impressionperhour)*PCF.labor_bindery_hr:0;
  P.scoreInsides=csInside?(((tS*(imp/2))-tQ)/PCF.bindery_morgana_impressionperhour)*PCF.labor_bindery_hr:0;
  P.stitching=((((tS*imp)/2)/PCF.horizonspf20_sheetsperhour)*PCF.labor_horizonspf20_hr)+PCF.labor_horizonspf20_setup;
  P.twoStitch=twoOptIn?Math.ceil(P.stitching*1):0;
  P.vivid=c.vividPrint?Math.ceil(P.press):0;
  P.coat=0;
  if(coat.val>0&&coatOK){const sc=tQ/imp;P.coat=Math.ceil((coat.price*sc*mk)+(((sc/PCF.uvcoaterimpressionsperhour)*PCF.labor_bindery_hr)*(coat.price*mk*3))+PCF.labor_bindery_hr)}
  P.bundle=(bund.val>0&&q100)?Math.ceil(((tQ/bund.price)/mk)*(PCF.labor_bindery_hr/PCF.bundlesperhour))+PCF.bundling_base_fee:0;
  P.rc=rc.val>0?Math.floor((spine/rc.price)/PCF.labor_bindery_hr*PCF.roundcornerperhour):0;

  let ndc=art.val>=4?(art.price*tP)*PCF.art_newdesignmodifier:0;
  let aec=(art.val>=2&&art.val<4)?PCF.art_pagesperhour+((c.artEditPages/PCF.art_pagesperhour)*art.price):0;
  P.artwork=artWork?(ndc+aec)*N:0;
  P.bleed=artWork?0:(bld.val>0?Math.max(bld.price*tP,PCF.bleed_minimum):0);
  P.proof=0;
  if(c.proof>0){const sf=(PCF.sheetsforlowcosthardcopyproof/tS)>1?1:(PCF.sheetsforlowcosthardcopyproof/tS);P.proof=((c.proof>=3?PCF.proof_hardcopy_cost:PCF.proof_digital_cost)*sf)*N}
  P.sets=(N*PCF.sets_surcharge)-PCF.sets_surcharge;
  P.diffSize=(sz.bindEdge<=3.5&&sz.bindEdge<=TWO_STAPLE_THRESH&&csInside)?Math.ceil(P.stitching):0;
  const iInv=c.insidePaperType==="cardstock"?INV_CS.includes(c.insidePaper.val):INV_NC.includes(c.insidePaper.val);
  P.nonInv=(iInv&&COVER_INV.includes(cvr.val))?0:PCF.non_inventory_fee;
  P.discBW=c.insideColor==="bw"?-(P.press*PCF.bw_discount_rate):0;
  const pComp=P.insidePaper+P.coverPaper+P.insidePrint+P.coverPrint;
  P.discEasy=easySize?-Math.min(pComp*PCF.easy_discount_rate,PCF.easydiscount_max):0;
  P.discCommon=(commonSize&&q250&&PCF.common_discount_max>0)?-(P.press+P.cutting+P.stitching):0;
  const subBeforeSize=Object.values(P).reduce((s,v)=>s+v,0);
  P.discSize=imp<4?subBeforeSize*(-PCF.booklet_size_discount):0;
  const subBeforeSurcharge=Object.values(P).reduce((s,v)=>s+v,0);
  P.surcharge=subBeforeSurcharge*(PCF.booklet_surcharge||0);

  const total=Object.values(P).reduce((s,v)=>s+v,0);

  // Turnaround
  const pT=(c.insidePaper.val||0)+(cvr.val||0);
  const aT=(twoApplied?Math.floor(tQ/PCF.sheetsturnaround):0)+(c.vividPrint?Math.floor(tS/PCF.sheetsturnaround):0)+
    (coat.val>0&&coatOK?Math.floor((tQ/(imp/2))/coat.val):0)+
    (bund.val>0&&q100?Math.floor(spine/bund.val):0)+
    (rc.val>0?Math.floor(Math.min(spine/rc.val,PCF.addon_roundcornermaxdays)):0);
  const dT=art.val>=4?Math.ceil(art.val*(tP/4)):0;
  const eT=(art.val>=2&&art.val<4)?Math.ceil((c.artEditPages/PCF.art_pagesperhour)/2):0;
  const bT=(!artWork&&bld.val>0)?Math.floor(bld.val*tP)/12:0;
  const pE=c.proof>=3?Math.ceil(pT+3.01):0;
  const artT=dT+(pE+dT)+eT+bT;
  const days=Math.max(PCF.minimum_turnaround_days,Math.floor((tS/PCF.sheetsturnaround)+pT+aT+artT));

  // Turnaround impact per option (for UI badges)
  const ti = {
    insidePaper: Math.floor(c.insidePaper.val || 0),
    coverPaper: Math.floor(cvr.val || 0),
    twoStaple: twoApplied ? Math.floor(tQ/PCF.sheetsturnaround) : 0,
    vivid: c.vividPrint ? Math.floor(tS/PCF.sheetsturnaround) : 0,
    coating: (coat.val>0&&coatOK) ? Math.floor((tQ/(imp/2))/coat.val) : 0,
    bundling: (bund.val>0&&q100) ? Math.floor(spine/bund.val) : 0,
    roundCorner: rc.val>0 ? Math.floor(Math.min(spine/rc.val,PCF.addon_roundcornermaxdays)) : 0,
    artDesign: dT,
    artEdits: eT,
    bleed: Math.round(bT*10)/10,
    proof: pE,
  };

  // ── Shipping & Rush (all in business days) ──
  const transitDays = getTransitDays(c.shipState, c.shipZip);
  const productionBizDays = days;
  // Free shipping = minimum turnaround × 2 + ground transit
  const bufferedProdDays = productionBizDays * 2;
  const freeDeliveryBizDays = bufferedProdDays + transitDays;
  // Minimum days are mandatory — production + 1 day overnight shipping
  const earliestBizDays = productionBizDays + 1;
  const shopToday = getShopToday();
  const freeDeliveryDate = addBusinessDays(shopToday, freeDeliveryBizDays);
  const earliestDate = addBusinessDays(shopToday, earliestBizDays);

  let rushMultiplier = 1;
  let rushCost = 0;
  let bizDaysToDate = freeDeliveryBizDays;
  let needByValid = false;
  let tooSoon = false;

  if (c.needByDate) {
    const nbd = new Date(c.needByDate + "T00:00:00");
    if (nbd > shopToday) {
      bizDaysToDate = businessDaysBetween(shopToday, nbd);
      needByValid = true;
      if (bizDaysToDate < earliestBizDays) {
        // Can't deliver — inside mandatory production window
        tooSoon = true;
        rushMultiplier = 1;
        rushCost = 0;
      } else if (bizDaysToDate < freeDeliveryBizDays) {
        // Rush zone — between earliest possible and free delivery
        rushMultiplier = freeDeliveryBizDays / bizDaysToDate;
        rushCost = Math.max(0, (total * rushMultiplier) - total);
      } else {
        rushMultiplier = 1;
      }
    }
  }
  const grandTotal = total + rushCost;

  // Production start date = delivery date - transit - production days
  // Production is a hard floor — never compressed. Transit adjusts instead:
  // if the remaining days after production < ground transit, overnight/expedited is used.
  const effectiveDeliveryBiz = (needByValid && !tooSoon) ? bizDaysToDate : freeDeliveryBizDays;
  const effectiveTransit = Math.min(transitDays, Math.max(1, effectiveDeliveryBiz - productionBizDays));
  const prodStartBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit - productionBizDays);
  const productionStartDate = addBusinessDays(shopToday, prodStartBiz);
  // Production must-ship-by date = delivery date - effective transit days
  const mustShipBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit);
  const mustShipDate = addBusinessDays(shopToday, mustShipBiz);

  const bd=[
    {l:"Inside Paper",v:P.insidePaper,g:"mat"},{l:"Cover Paper",v:P.coverPaper,g:"mat"},
    {l:"Inside Print",v:P.insidePrint,g:"mat"},{l:"Cover Print",v:P.coverPrint,g:"mat"},
    {l:"Press",v:P.press,g:"lab"},{l:"Cutting",v:P.cutting,g:"lab"},
    {l:"Cover Scoring",v:P.scoreCover,g:"lab"},{l:"Inside Scoring",v:P.scoreInsides,g:"lab"},
    {l:"Stitching",v:P.stitching,g:"lab"},
    {l:"Two-Staple",v:P.twoStitch,g:"add"},{l:"Vivid Print",v:P.vivid,g:"add"},
    {l:"UV Coating",v:P.coat,g:"add"},{l:"Bundling",v:P.bundle,g:"add"},
    {l:"Round Cornering",v:P.rc,g:"add"},
    {l:"Artwork",v:P.artwork,g:"art"},{l:"Bleed",v:P.bleed,g:"art"},{l:"Proofing",v:P.proof,g:"art"},
    {l:"Sets Surcharge",v:P.sets,g:"fee"},{l:"Difficult Size",v:P.diffSize,g:"fee"},{l:"Non-Inventory",v:P.nonInv,g:"fee"},{l:"Pricing Surcharge",v:P.surcharge,g:"fee"},
    {l:"BW Discount",v:P.discBW,g:"disc"},{l:"Easy Size",v:P.discEasy,g:"disc"},{l:"Competitive",v:P.discCommon,g:"disc"},{l:"Size Adj.",v:P.discSize,g:"disc"},
  ].filter(r=>Math.abs(r.v)>0.005);

  // CMYK-derived group colors
  const gC={mat:CK.cyan,lab:CK.key,add:CK.yellow,art:CK.magenta,fee:"#c25050",disc:CK.cyan};
  const gL={mat:"Materials & Ink",lab:"Production Labor",add:"Addons",art:"Artwork & Proofing",fee:"Fees",disc:"Discounts"};
  const grouped=Object.entries(gL).map(([k,label])=>{
    const val=bd.filter(r=>r.g===k).reduce((s,r)=>s+r.v,0);
    return {label,val,c:gC[k]};
  }).filter(g=>Math.abs(g.val)>0.005);

  // Debug: intermediate values
  const baseDays=Math.floor(tS/PCF.sheetsturnaround);
  const paperDays=Math.floor(pT);
  const perSetSheets=sets.map(s=>({name:s.name||`Set ${sets.indexOf(s)+1}`,qty:s.qty,pages:s.pages,bookletSheets:(s.qty*s.pages)/4}));
  const bookletSheetsTotal=sets.reduce((s,x)=>s+(x.qty*x.pages)/4,0);

  const debug={
    // Sheet math
    perSetSheets,
    bookletSheetsTotal,
    parentSheets:tS,
    imp,
    impHalf:imp/2,
    // Volumes
    totalQty:tQ,
    totalPages:tP,
    numSets:N,
    // Pricing intermediates
    markup:mk,
    discountLog:dL,
    spineThickness:spine,
    materialsSubtotal:pComp,
    // Flags
    coverNeedsScoring:cvrScoring,
    cardstockInsideActive:csInside,
    cardstockPagesOK:csOK,
    coatingEligible:coatOK,
    coatPaperLabel:coatPaper.label,
    hardcopyEligible:hcOK,
    insideInventory:iInv,
    coverInventory:COVER_INV.includes(cvr.val),
    coverPaperUsed:cvr.label,
    // Size
    bindingEdge:sz.bindEdge,
    isCustom:sz.isCustom,
    easySize,
    commonSize,
    // Two staple
    twoStapleMode:twoAuto?"auto (no charge)":twoOptIn?"user opt-in (+charge)":"single staple",
    twoStapleApplied:twoApplied,
    // Turnaround breakdown
    turnaround:{
      baseDays,
      paperDays,
      paperValRaw:pT,
      insidePaperVal:c.insidePaper.val,
      coverPaperVal:cvr.val,
      addonDays:aT,
      addonBreakdown:{
        twoStaple:twoApplied?Math.floor(tQ/PCF.sheetsturnaround):0,
        vivid:c.vividPrint?Math.floor(tS/PCF.sheetsturnaround):0,
        coating:(coat.val>0&&coatOK)?Math.floor((tQ/(imp/2))/coat.val):0,
        bundling:(bund.val>0&&q100)?Math.floor(spine/bund.val):0,
        roundCorner:rc.val>0?Math.floor(Math.min(spine/rc.val,PCF.addon_roundcornermaxdays)):0,
      },
      artworkDays:artT,
      artBreakdown:{
        designTime:dT,
        editTime:eT,
        bleedTime:bT,
        proofTime:pE,
      },
      preFloor:(tS/PCF.sheetsturnaround)+pT+aT+artT,
      totalDays:days,
    },
    // Shipping
    shipping:{
      transitDays,
      freeDeliveryBizDays,
      freeDeliveryBuffer:PCF.free_shipping_buffer,
      bufferedProdDays,
      earliestBizDays,
      rushMultiplier,
      rushCost:Math.round(rushCost*100)/100,
      bizDaysToDate,
      needByValid,
      tooSoon,
    },
    minDaysConfig:PCF.minimum_turnaround_days,
  };

  return {total:Math.round(grandTotal*100)/100,baseTotal:Math.round(total*100)/100,perUnit:Math.round((grandTotal/tQ)*100)/100,days,tQ,bd,grouped,twoAuto,q100,coatOK,hcOK,sz,debug,ti,
    shipping:{transitDays,effectiveTransit,freeDeliveryBizDays,freeDeliveryDate:fmtDate(freeDeliveryDate),freeDeliveryYMD:toYMD(freeDeliveryDate),earliestBizDays,earliestDate:fmtDate(earliestDate),earliestYMD:toYMD(earliestDate),shopToday:fmtDate(shopToday),bizDaysToDate,rushMultiplier,rushCost:Math.round(rushCost*100)/100,needByValid,tooSoon,bufferedProdDays,productionBizDays,productionStartDate:fmtDate(productionStartDate),productionStartYMD:toYMD(productionStartDate),mustShipDate:fmtDate(mustShipDate),mustShipYMD:toYMD(mustShipDate),prodStartBiz,mustShipBiz,pastCutoff:new Date().toLocaleString("en-US",{timeZone:PCF.shop_timezone,hour:"numeric",minute:"numeric",hour12:true})}};
}

const CK = {
  cyan: "#007eff",       // process cyan
  magenta: "#d1246a",    // process magenta
  yellow: "#f0a830",     // process yellow
  key: "#2b2b2b",
  rush: "#BADA55",        // rush surcharge green
  rushLight: "#f0fad6",   // rush background
  cyanLight: "#e0edff",
  magentaLight: "#fce8ef",

const Chev=()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>;

function Sel({label,value,onChange,children,disabled,note,badge}){
  const m=useIsMobile();
  return <div style={ST.f}>{label&&<label style={ST.lbl}>{label}{badge}</label>}<div style={{position:"relative"}}><select value={value} onChange={e=>onChange(e.target.value)} style={{...ST.sel,fontSize:m?16:15,padding:m?"10px 32px 10px 12px":"10px 32px 10px 12px",...(disabled?{opacity:.4,pointerEvents:"none"}:{})}} disabled={disabled}>{children}</select><span style={ST.selA}><Chev/></span></div>{note&&<p style={ST.note}>{note}</p>}</div>;
}

function TxtNum({label,value,onChange,min=1,max=99999}){
  const[raw,setRaw]=useState(String(value));
  useEffect(()=>setRaw(String(value)),[value]);
  return <div style={ST.f}>{label&&<label style={ST.lbl}>{label}</label>}<input type="text" inputMode="decimal" value={raw} onChange={e=>{setRaw(e.target.value);const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=min&&v<=max)onChange(v)}} onBlur={()=>{let v=parseFloat(raw);if(isNaN(v))v=min;v=Math.min(max,Math.max(min,v));onChange(v);setRaw(String(v))}} style={ST.inp}/></div>;
}

function Pil({label,options,value,onChange,disabled,badge}){
  const m=useIsMobile();
  return <div style={ST.f}>{label&&<label style={ST.lbl}>{label}{badge}</label>}<div style={ST.pills}>{options.map(o=><button type="button" key={String(o.v)} onClick={()=>!disabled&&onChange(o.v)} style={{...ST.pill,padding:m?"11px 10px":"9px 10px",...(value===o.v?(o.onStyle||ST.pillOn):{}),...(disabled?{opacity:.4,cursor:"default"}:{})}}>{o.t}</button>)}</div></div>;
}

function TurnBadge({days}){
  if(!days || days < 0.5) return null;
  const d = Math.round(days);
  const label = d === 0 ? `+${days.toFixed(1)}d` : `+${d} day${d!==1?"s":""}`;
  return <span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:10,fontWeight:600,color:CK.magenta,background:CK.magentaLight,padding:"1px 6px",borderRadius:8,marginLeft:6,whiteSpace:"nowrap",verticalAlign:"middle"}}>⏱ {label}</span>;
}

function Sec({title,open,onToggle,children,badge,num,subtitle}){
  const m=useIsMobile();
  const numStr=num!=null?String(num).padStart(2,"0"):null;
  return <div style={ST.card}><button type="button" onClick={onToggle} style={{...ST.cardH,padding:m?"12px 14px":"14px 18px",fontSize:m?14:15,alignItems:subtitle?"flex-start":"center"}}><div style={{display:"flex",alignItems:subtitle?"flex-start":"baseline",gap:m?10:12,flex:1,minWidth:0,textAlign:"left"}}>{numStr&&<span style={ST.secNum}>{numStr}</span>}<div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,color:CC.dark,fontSize:"inherit",textTransform:"uppercase",letterSpacing:"-0.005em"}}>{title}</div>{subtitle&&<div style={ST.secSub}>{subtitle}</div>}</div></div><div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0,marginTop:subtitle?2:0}}>{badge&&<span style={{fontSize:11,fontWeight:700,color:CC.primary,background:CK.cyanLight,padding:"3px 9px",borderRadius:10}}>{badge}</span>}<span style={{color:CC.light,transition:"transform .2s",display:"flex",transform:open?"rotate(180deg)":"none"}}><Chev/></span></div></button>{open&&<div style={{padding:m?"12px 14px":"14px 18px",borderTop:`1px solid ${CC.border}`}}>{children}</div>}</div>;
}

const DNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MNAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function DatePicker({value, onChange, earliestDate, freeDate}) {
  const [open, setOpen] = useState(false);
  const now = new Date();
  const [vYear, setVYear] = useState(now.getFullYear());
  const [vMonth, setVMonth] = useState(now.getMonth());
  const initRef = useRef(false);
  const trigRef = useRef(null);
  const dropRef = useRef(null);
  const [pos, setPos] = useState({top:0,left:0,width:0});
  const isMob = useIsMobile();

  const earliest = earliestDate ? new Date(earliestDate + "T00:00:00") : null;
  const free = freeDate ? new Date(freeDate + "T00:00:00") : null;

  // Jump to the month with actionable dates once props arrive
  useEffect(()=>{
    if(initRef.current)return;
    const target = free || earliest;
    if(target){ initRef.current=true; setVYear(target.getFullYear()); setVMonth(target.getMonth()); }
  },[freeDate,earliestDate]);

  // Position the dropdown below the trigger (desktop) or as centered modal (mobile)
  useEffect(()=>{
    if(open&&trigRef.current){
      const r=trigRef.current.getBoundingClientRect();
      const vw=window.innerWidth;
      const vh=window.innerHeight;
      const isMob=vw<700;
      if(isMob){
        // Centered modal — ignore trigger position
        const w=Math.min(vw-32,360);
        setPos({top:Math.max(16,vh*0.08),left:(vw-w)/2,width:w,modal:true});
      } else {
        // Dropdown below trigger, ensure it doesn't clip bottom
        let top=r.bottom+4;
        const estH=360;
        if(top+estH>vh) top=Math.max(8,r.top-estH-4);
        setPos({top,left:r.left,width:Math.max(r.width,300),modal:false});
      }
    }
  },[open]);

  // Close on outside click
  useEffect(()=>{
    if(!open)return;
    const handler=e=>{
      if(trigRef.current&&trigRef.current.contains(e.target))return;
      if(dropRef.current&&dropRef.current.contains(e.target))return;
      setOpen(false);
    };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[open]);

  const navM = dir => {
    let m = vMonth + dir, y = vYear;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    setVMonth(m); setVYear(y);
  };

  const first = new Date(vYear, vMonth, 1);
  const last = new Date(vYear, vMonth + 1, 0);
  const pad = first.getDay();
  const cells = [];
  for (let i = 0; i < pad; i++) cells.push(null);
  for (let d = 1; d <= last.getDate(); d++) cells.push(new Date(vYear, vMonth, d));

  const selected = value ? toYMD(new Date(value + "T00:00:00")) : null;

  const pick = (d) => {
    onChange(toYMD(d));
    setOpen(false);
  };

  const clear = () => { onChange(""); setOpen(false); };

  const displayVal = value ? fmtDate(new Date(value + "T00:00:00")) : "";

  return (
    <>
      <div ref={trigRef} onClick={()=>setOpen(!open)} style={{...ST.inp,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",minHeight:36}}>
        <span style={{color:value?CC.dark:CC.light}}>{displayVal||"Select a date..."}</span>
        <span style={{display:"flex",gap:4,alignItems:"center"}}>
          {value&&<span onClick={e=>{e.stopPropagation();clear()}} style={{color:CC.light,fontSize:14,cursor:"pointer",lineHeight:1}}>✕</span>}
          <Chev/>
        </span>
      </div>
      {open&&ReactDOM.createPortal(<>
        {/* Backdrop on mobile */}
        {pos.modal&&<div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,zIndex:99999,background:"rgba(0,0,0,.4)"}}/>}
        <div ref={dropRef} style={{position:"fixed",top:pos.top,left:pos.left,width:pos.width||300,zIndex:100000,background:CC.white,borderRadius:isMob?12:6,border:`1px solid ${CC.border}`,boxShadow:isMob?"0 12px 40px rgba(0,0,0,.25)":"0 8px 24px rgba(0,0,0,.15)",padding:isMob?16:10,maxHeight:isMob?"80vh":"70vh",overflowY:"auto",fontFamily:"'Segoe UI','Helvetica Neue',Arial,sans-serif",boxSizing:"border-box"}}>
          {/* Close button on mobile */}
          {isMob&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:14,fontWeight:700,color:CC.dark}}>Select Delivery Date</span>
            <button type="button" onClick={()=>setOpen(false)} style={{background:"none",border:"none",fontSize:20,color:CC.light,cursor:"pointer",padding:"0 4px",lineHeight:1}}>✕</button>
          </div>}
          {/* Month nav */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <button type="button" onClick={()=>navM(-1)} style={{background:"none",border:`1px solid ${CC.border}`,borderRadius:3,padding:isMob?"6px 14px":"2px 8px",cursor:"pointer",color:CC.mid,fontFamily:"inherit",fontSize:isMob?16:14}}>◀</button>
            <span style={{fontSize:isMob?14:12.5,fontWeight:700,color:CC.dark}}>{MNAMES[vMonth]} {vYear}</span>
            <button type="button" onClick={()=>navM(1)} style={{background:"none",border:`1px solid ${CC.border}`,borderRadius:3,padding:isMob?"6px 14px":"2px 8px",cursor:"pointer",color:CC.mid,fontFamily:"inherit",fontSize:isMob?16:14}}>▶</button>
          </div>
          {/* Day headers */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:isMob?2:1,marginBottom:2}}>
            {DNAMES.map(d=><div key={d} style={{textAlign:"center",fontSize:isMob?11:9.5,fontWeight:600,color:d==="Sun"||d==="Sat"?"#ccc":CC.light,padding:isMob?4:2}}>{d}</div>)}
          </div>
          {/* Day cells */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:isMob?2:1}}>
            {cells.map((d,i) => {
              if (!d) return <div key={`p${i}`}/>;
              const ymd = toYMD(d);
              const we = d.getDay()===0||d.getDay()===6;
              const closed = !isBusinessDay(d);
              const beforeEarliest = earliest && d < earliest;
              const disabled = we || closed || beforeEarliest;
              const isSel = ymd === selected;
              const isFree = free && ymd === toYMD(free);
              const isRush = !disabled && earliest && free && d >= earliest && d < free;
              const isPast = d < getShopToday();

              let bg = "transparent";
              let color = CC.dark;
              let fontWeight = 400;
              let border = "1px solid transparent";

              if (isSel) { bg = CK.cyan; color = "#fff"; fontWeight = 700; border = `1px solid ${CK.cyan}`; }
              else if (disabled || isPast) { bg = "#f8f8f8"; color = "#d0d0d0"; }
              else if (isFree) { bg = "#e8f5e3"; color = "#3a7124"; fontWeight = 600; border = "1px solid #b5d8a8"; }
              else if (isRush) { bg = CK.yellowLight; color = CK.yellow; }

              return (
                <div key={ymd}
                  onClick={()=>!disabled&&!isPast&&pick(d)}
                  style={{textAlign:"center",padding:isMob?"10px 2px":"5px 2px",borderRadius:isMob?4:3,fontSize:isMob?14:11.5,fontWeight,background:bg,color,border,
                    cursor:disabled||isPast?"default":"pointer",userSelect:"none",transition:"background .1s"}}>
                  {d.getDate()}
                </div>
              );
            })}
          </div>
          {/* Legend */}
          <div style={{display:"flex",gap:isMob?12:10,marginTop:8,paddingTop:6,borderTop:`1px solid ${CC.border}`,flexWrap:"wrap"}}>
            <span style={{fontSize:isMob?10:9,color:CC.light,display:"flex",alignItems:"center",gap:3}}>
              <span style={{width:8,height:8,borderRadius:2,background:CK.yellowLight,border:`1px solid ${CK.yellow}44`}}/> Rush zone
            </span>
            <span style={{fontSize:isMob?10:9,color:CC.light,display:"flex",alignItems:"center",gap:3}}>
              <span style={{width:8,height:8,borderRadius:2,background:"#e8f5e3",border:"1px solid #b5d8a8"}}/> Free delivery
            </span>
            <span style={{fontSize:isMob?10:9,color:CC.light,display:"flex",alignItems:"center",gap:3}}>
              <span style={{width:8,height:8,borderRadius:2,background:"#f8f8f8"}}/> Unavailable
            </span>
          </div>
        </div>
      </>, document.body)}
    </>
  );
}

function SidebarBookPreview({sizeLabel,pages,quantity,coverColor,coverPaper,insidePaper,coverMode,coverArt,backCoverArt,onOpenPreview}){

  const maxDim=150, longSide=Math.max(wIn,hIn), px=maxDim/longSide;

  const displayCover=coverMode==="same"?insidePaper:coverPaper;
  const coverTone=displayCover?.tone||"#f7f3e8";
  const inkColor=coverColor==="bw"?"#2b2b2b":CK.cyan;
  // Generate a simple placeholder cover SVG (title-less — we don't know the booklet name).
  const placeholder=useMemo(()=>{
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" preserveAspectRatio="xMidYMid slice">
<rect width="300" height="450" fill="${coverTone}"/>
<rect x="36" y="58" width="110" height="4" fill="${inkColor}"/>

</g>
<text x="36" y="412" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#555" letter-spacing="2">PRIORITY PRINT</text>
</svg>`;
    return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
  },[coverTone,inkColor]);
  const backCover=useMemo(()=>{
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450">
<rect width="300" height="450" fill="${coverTone}"/>
<g transform="translate(150,220)">
<rect x="-30" y="-30" width="60" height="60" fill="#fff" stroke="#2b2b2b" stroke-width="1.5"/>
<rect x="-22" y="-22" width="44" height="44" fill="#2b2b2b"/>
<rect x="-16" y="-16" width="4" height="4" fill="#fff"/>
<rect x="-8" y="-16" width="4" height="4" fill="#fff"/>
<rect x="0" y="-16" width="4" height="4" fill="#fff"/>
<rect x="12" y="-16" width="4" height="4" fill="#fff"/>
<rect x="-16" y="-4" width="4" height="4" fill="#fff"/>
<rect x="0" y="-4" width="4" height="4" fill="#fff"/>
<rect x="8" y="-4" width="4" height="4" fill="#fff"/>
<rect x="-16" y="4" width="4" height="4" fill="#fff"/>
<rect x="-8" y="4" width="4" height="4" fill="#fff"/>
<rect x="8" y="4" width="4" height="4" fill="#fff"/>
<rect x="-16" y="12" width="4" height="4" fill="#fff"/>
<rect x="8" y="12" width="4" height="4" fill="#fff"/>
</g>
<text x="150" y="300" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#555" text-anchor="middle" letter-spacing="1">PRIORITYPRINTSERVICE.COM</text>
</svg>`;

  const hasArt=!!coverArt;
  // When real art is uploaded we use it for the front; back cover falls back
  // to the front image if a back hasn't been detected yet (most uploads are
  // single-file print-ready PDFs where the back is the last page).
  const previewPages=useMemo(()=>[
    {dataUrl:coverArt||placeholder,isBlank:false},

          <span>{wIn}×{hIn}″</span>
          <span>{pages}pp · {quantity.toLocaleString()} qty</span>
        </div>
      </div>
    </div>
  );
}

// Mobile: inline full-card preview below the hero that collapses into a
// small sticky top-of-viewport strip once it scrolls out of view.
function MobilePreviewBar(props){
  const {sizeLabel,pages,quantity,coverArt,onOpenPreview}=props;
  const hostRef=useRef(null);
  const [collapsed,setCollapsed]=useState(false);
  useEffect(()=>{
    const el=hostRef.current;
    if(!el||typeof IntersectionObserver==="undefined")return;
    const obs=new IntersectionObserver(([entry])=>{
      // When the bottom of the full card has scrolled above the viewport, collapse.
      setCollapsed(!entry.isIntersecting && entry.boundingClientRect.top < 0);
    },{threshold:0,rootMargin:"0px 0px 0px 0px"});
    obs.observe(el);
    return ()=>obs.disconnect();
  },[]);
  const m=(sizeLabel||"").match(/(\d+(?:\.\d+)?)\s*[×x]\s*(\d+(?:\.\d+)?)/);
  const wIn=m?parseFloat(m[1]):5.5, hIn=m?parseFloat(m[2]):8.5;
  const hasArt=!!coverArt;
  const clickable=hasArt&&typeof onOpenPreview==="function";
  return (
    <>
      {/* Inline full card — shows by default above the sections */}
      <div ref={hostRef} style={{margin:"6px 10px 10px"}}>
        <SidebarBookPreview {...props}/>
      </div>

      {/* Sticky top strip — slides down when the full card scrolls out */}
      <div
        role={clickable?"button":undefined}
        tabIndex={clickable?0:undefined}
        onClick={clickable?onOpenPreview:undefined}
        onKeyDown={clickable?(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpenPreview();}}:undefined}
        style={{
          position:"fixed",top:0,left:0,right:0,zIndex:45,
          transform:collapsed?"translateY(0)":"translateY(-110%)",
          transition:"transform .22s ease-out",
          background:"linear-gradient(135deg,#1a1d23,#2a2e36)",
          borderBottom:"1px solid rgba(255,255,255,.08)",
          boxShadow:"0 6px 18px rgba(0,0,0,.25)",
          padding:"7px 12px",
          display:"flex",alignItems:"center",gap:10,
          cursor:clickable?"pointer":"default",
          color:"#fff",
        }}>
        {/* Thumbnail — aspect ratio preserved */}
        <div style={{width:32,height:Math.max(24,Math.min(48,(32*hIn)/wIn)),borderRadius:3,overflow:"hidden",flexShrink:0,background:"#2a2e36",boxShadow:"0 0 0 1px rgba(255,255,255,.12)"}}>
          {hasArt
            ? <img src={coverArt} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
            : <div style={{width:"100%",height:"100%",background:"linear-gradient(135deg,#e0edff,#f7f3e8)"}}/>
          }
        </div>
        {/* Params — size · pages · qty */}
        <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:1}}>
          <div style={{fontSize:8,fontWeight:700,letterSpacing:".12em",opacity:.6,textTransform:"uppercase"}}>
            {hasArt?"Your Artwork":"3D Preview"}
          </div>
          <div style={{fontSize:12,fontWeight:700,letterSpacing:".01em",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {wIn}×{hIn}″ · {pages}pp · {quantity.toLocaleString()} qty
          </div>
        </div>
        {/* CMYK dots — taps anywhere on the strip still open the preview modal when art is uploaded */}
        <div style={{display:"inline-flex",gap:3,alignSelf:"center"}} aria-hidden="true">
          <span style={{width:6,height:6,borderRadius:"50%",background:CK.cyan}}/>
          <span style={{width:6,height:6,borderRadius:"50%",background:CK.magenta}}/>
          <span style={{width:6,height:6,borderRadius:"50%",background:CK.yellow}}/>
          <span style={{width:6,height:6,borderRadius:"50%",background:"rgba(255,255,255,.7)"}}/>
        </div>
      </div>
    </>
  );
}

function SpecSheet({result,pages,sizeLabel}){
  if(!result||result.error?.length>0)return null;
  const sz=result.sz;
  if(!sz)return null;
  const sheets=result.debug?.parentSheets;
  const items=[
    ["size",sz.label||sizeLabel||"—"],
    ["imp",`${sz.imp}-up`],
    ["pages",`${pages}pp`],
    ["sheets",sheets!=null?Math.round(sheets).toLocaleString():"—"],
    ["bind",result.twoAuto?"2-staple":"1-staple"],
    ["prod",`${result.days}d biz`],
  ];
  return (

async function extractPdfPages(file, onProgress) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const result = [];
  // Get dimensions from first page (PDF units = 1/72 inch)
  const firstPg = await pdf.getPage(1);
  const [x0, y0, x1, y1] = firstPg.view;
  const pdfW = parseFloat(((x1 - x0) / 72).toFixed(3));
  const pdfH = parseFloat(((y1 - y0) / 72).toFixed(3));
  const pxW = Math.round(x1 - x0), pxH = Math.round(y1 - y0);

  for (let i = 1; i <= pdf.numPages; i++) {
    if (onProgress) onProgress(i, pdf.numPages);
    const pg = await pdf.getPage(i);
    const vp = pg.getViewport({ scale: 1.5 });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await pg.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    const url = canvas.toDataURL("image/jpeg", 0.8);
    let label = pageLabel(i - 1, pdf.numPages);
    result.push({ dataUrl: url, label });
  }
  return { pages: result, dims: { wIn: pdfW, hIn: pdfH, wPx: pxW, hPx: pxH, source: "pdf" }, pdfDoc: pdf };
}

async function extractImagePages(files, onProgress) {
  const sorted = Array.from(files).filter(f => f.type.startsWith("image/"))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  const result = [];
  let imgW = 0, imgH = 0;
  for (let i = 0; i < sorted.length; i++) {
    if (onProgress) onProgress(i + 1, sorted.length);
    const url = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(sorted[i]); });
    if (i === 0) {
      const d = await new Promise(res => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth, h: img.naturalHeight }); img.src = url; });
      imgW = d.w; imgH = d.h;
    }
    let label = pageLabel(i, sorted.length);
    result.push({ dataUrl: url, label });
  }
  // Estimate at 300 DPI
  const wIn = imgW > 0 ? parseFloat((imgW / 300).toFixed(3)) : 0;
  const hIn = imgH > 0 ? parseFloat((imgH / 300).toFixed(3)) : 0;
  return { pages: result, dims: { wIn, hIn, wPx: imgW, hPx: imgH, source: "image" } };
}

function BookClosed3D({ pages, bookW, bookH, spineW, rotateX: rX, rotateY: rY, scale, fitMode }) {
  if (!pages.length) return null;
  const isSaddle = spineW <= 0;
  // Saddlestitch: derive visual thickness from page count (exaggerated for 3D effect)
  const saddleDepth = isSaddle ? Math.max(2, pages.length * 0.3) : 0;
  const halfDepth = isSaddle ? saddleDepth / 2 : Math.max(1, spineW / 2);
  const bgFit = fitMode === "contain" ? "contain" : "cover"; // crop and scale map to cover for 3D preview
  const edgeGrad = "linear-gradient(180deg,#f5f0e8,#e8e0d4,#f0ebe3)";
  // Page-edge texture: repeating thin lines to suggest individual pages
  const pageEdgeBg = `repeating-linear-gradient(${isSaddle ? "0deg" : "90deg"},#f5f0e8 0px,#e8e0d4 1px,#f0ebe3 2px)`;
  return (
    <div className="bp-scene" style={{ transform: `scale(${scale}) rotateX(${rX}deg) rotateY(${rY}deg)` }}>
      <div className="bp-closed" style={{ width: bookW, height: bookH, "--half-depth": halfDepth + "px", transformStyle: "preserve-3d" }}>
        <div className="bp-face front" style={{ width: bookW, height: bookH, backgroundImage: `url(${pages[0].dataUrl})`, backgroundSize: bgFit, backgroundColor: "#f8f5f0", borderRadius: isSaddle ? "1px 4px 4px 1px" : "0 4px 4px 0" }} />
        <div className="bp-face back" style={{ width: bookW, height: bookH, backgroundImage: `url(${pages[pages.length - 1].dataUrl})`, backgroundSize: bgFit, backgroundColor: "#f8f5f0", borderRadius: isSaddle ? "4px 1px 1px 4px" : "4px 0 0 4px" }} />
        {!isSaddle && <>
          <div className="bp-face spine" style={{ width: spineW, height: bookH }} />
          <div className="bp-face top-edge" style={{ width: bookW, height: spineW, background: edgeGrad }} />
          <div className="bp-face bottom-edge" style={{ width: bookW, height: spineW, background: edgeGrad }} />
          <div className="bp-face fore-edge" style={{ width: spineW, height: bookH, background: edgeGrad }} />
        </>}
        {isSaddle && <>
          {/* Top edge — page edges visible from above */}
          <div className="bp-face top-edge" style={{ width: bookW, height: saddleDepth, background: pageEdgeBg }} />
          {/* Bottom edge */}
          <div className="bp-face bottom-edge" style={{ width: bookW, height: saddleDepth, background: pageEdgeBg }} />
          {/* Fore edge (right side) — page edges */}
          <div className="bp-face fore-edge" style={{ width: saddleDepth, height: bookH, background: pageEdgeBg }} />
          {/* Spine edge (left side, staple side) — slightly darker */}
          <div style={{
            position: "absolute", width: saddleDepth, height: bookH,
            transform: `rotateY(-90deg) translateX(-${halfDepth}px)`, transformOrigin: "left center",
            background: "linear-gradient(90deg,#d8d0c4,#cec6ba,#d8d0c4)",
            backfaceVisibility: "hidden",
          }} />
        </>}
      </div>
    </div>
  );
}

function BookOpen3D({ pages, bookW, bookH, spread, scale, rotateX: rX, rotateY: rY, fitMode }) {
  const interior = pages.slice(1, pages.length - 1);
  const li = spread * 2, ri = spread * 2 + 1;
  const lp = interior[li], rp = interior[ri];
  const objFit = fitMode === "contain" ? "contain" : "cover"; // crop and scale map to cover for 3D preview
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      <div className="bp-scene" style={{ transform: `scale(${scale}) rotateX(${rX}deg) rotateY(${rY}deg)` }}>
        <div className="bp-open" style={{ width: bookW * 2, height: bookH, position: "relative", display: "block" }}>
          <div style={{ width: bookW * 2, height: bookH, position: "relative", transformStyle: "preserve-3d" }}>
            <div className="bp-page left" style={{ width: bookW, height: bookH, position: "absolute", top: 0, left: 0 }}>
              {lp && <img src={lp.dataUrl} style={{ objectFit: objFit }} />}
              <div className="bp-shadow-l" />
            </div>
            <div className="bp-page right" style={{ width: bookW, height: bookH, position: "absolute", top: 0, left: bookW }}>
              {rp && <img src={rp.dataUrl} style={{ objectFit: objFit }} />}
              <div className="bp-shadow-r" />
            </div>
            <div className="bp-spine-shadow" style={{ height: bookH }} />
          </div>
        </div>
      </div>
      {/* Page numbers in negative space below the book */}
      <div style={{ display: "flex", width: bookW * 2 * scale, justifyContent: "space-between", marginTop: 6, padding: "0 4px" }}>
        <span style={{ fontSize: 10, color: "rgba(255,255,255,.35)", fontFamily: "'Segoe UI',sans-serif" }}>
          {lp ? li + 2 : ""}
        </span>
        <span style={{ fontSize: 10, color: "rgba(255,255,255,.35)", fontFamily: "'Segoe UI',sans-serif" }}>
          {rp ? ri + 2 : ""}
        </span>
      </div>
    </div>
  );
}

function InfoTip({ children, text, dark }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0 });
  const ref = useRef(null);
  const qRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [open]);
  // Position the tooltip using fixed coordinates so it escapes any overflow:hidden parent
  useEffect(() => {
    if (!open || !qRef.current) return;
    const r = qRef.current.getBoundingClientRect();
    const tipW = 280;
    let left = r.left + r.width / 2 - tipW / 2;
    // Clamp to viewport edges with 8px padding
    if (left < 8) left = 8;
    if (left + tipW > window.innerWidth - 8) left = window.innerWidth - 8 - tipW;
    setPos({ top: r.top - 8, left });
  }, [open]);
  return (
    <span ref={ref} style={{ position: "relative", display: "inline-flex", alignItems: "center" }}>
      <span ref={qRef} onClick={() => setOpen(o => !o)} style={{ cursor: "pointer", display: "inline-flex", alignItems: "center" }}>
        {children}
        <span style={{ marginLeft: 4, width: 14, height: 14, borderRadius: "50%", display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, background: dark ? "rgba(255,255,255,.12)" : "rgba(0,0,0,.08)", color: dark ? "rgba(255,255,255,.5)" : "rgba(0,0,0,.4)", flexShrink: 0 }}>?</span>
      </span>
      {open && (
        <div style={{
          position: "fixed", bottom: `${window.innerHeight - pos.top}px`, left: pos.left,
          background: dark ? "#2a2e36" : "#fff", border: `1px solid ${dark ? "rgba(255,255,255,.15)" : "#ddd"}`,
          borderRadius: 8, padding: "10px 14px", fontSize: 11, lineHeight: 1.5,
          color: dark ? "rgba(255,255,255,.7)" : CC.mid, width: 280, boxShadow: dark ? "0 8px 24px rgba(0,0,0,.5)" : "0 6px 20px rgba(0,0,0,.12)",
          zIndex: 100000,
        }}>
          {text}
        </div>
      )}
    </span>
  );
}

function generateTemplate(trimW, trimH, pageCount, sizeLabel, roundCorner) {
  try {
    if (!window.jspdf) { alert("PDF library not loaded. Please refresh the page."); return; }
    const { jsPDF } = window.jspdf;
    const bleed = 0.125;
    const safety = 0.125;
    const docW = trimW + bleed * 2;
    const docH = trimH + bleed * 2;
    const pdf = new jsPDF({
      orientation: docW > docH ? "l" : "p",
      unit: "in",
      format: [docW, docH],
    });

    // Round corner params
    const rcVal = roundCorner || 0;
    const rcRadius = (rcVal === 216 || rcVal === 108) ? 0.25 : (rcVal === 215 || rcVal === 107) ? 0.375 : 0;
    const rcAll4 = rcVal === 108 || rcVal === 107;
    const rcOutside2 = rcVal === 216 || rcVal === 215;

    for (let pg = 0; pg < pageCount; pg++) {
      if (pg > 0) pdf.addPage([docW, docH], docW > docH ? "l" : "p");

      // Light grey bleed zone background
      pdf.setFillColor(240, 240, 240);
      pdf.rect(0, 0, docW, docH, "F");

      // White trim area
      pdf.setFillColor(255, 255, 255);
      pdf.rect(bleed, bleed, trimW, trimH, "F");

      // Bleed line — red solid at document edge
      pdf.setDrawColor(229, 62, 62);
      pdf.setLineWidth(0.012);
      pdf.rect(0.006, 0.006, docW - 0.012, docH - 0.012, "S");

      // Trim line — black dashed (with rounded corners if selected)
      pdf.setDrawColor(30, 30, 30);
      pdf.setLineWidth(0.01);
      if (rcRadius > 0) {
        drawDashedRoundedRect(pdf, bleed, bleed, trimW, trimH, rcRadius, rcAll4, 0.08, 0.05);
      } else {
        drawDashedRect(pdf, bleed, bleed, trimW, trimH, 0.08, 0.05);
      }

      // Safety line — green dashed (with rounded corners if selected)
      pdf.setDrawColor(56, 161, 105);
      pdf.setLineWidth(0.008);
      if (rcRadius > 0) {
        drawDashedRoundedRect(pdf, bleed + safety, bleed + safety, trimW - safety * 2, trimH - safety * 2, Math.max(0, rcRadius - safety), rcAll4, 0.05, 0.03);
      } else {
        drawDashedRect(pdf, bleed + safety, bleed + safety, trimW - safety * 2, trimH - safety * 2, 0.05, 0.03);
      }

      // Bound edge indicator — alternates per page
      // Even pages (0,2,4..) = spine left, Odd pages (1,3,5..) = spine right
      var spineLeft = pg % 2 === 0;
      var spineX = spineLeft ? bleed : bleed + trimW;
      pdf.setDrawColor(59, 130, 246);
      pdf.setLineWidth(0.025);
      pdf.line(spineX, bleed + 0.15, spineX, bleed + trimH - 0.15);
      // Staple marks
      var stapleY1 = bleed + trimH * 0.33;
      var stapleY2 = bleed + trimH * 0.67;
      pdf.setLineWidth(0.015);
      pdf.line(spineX - 0.04, stapleY1, spineX + 0.04, stapleY1);
      pdf.line(spineX - 0.04, stapleY2, spineX + 0.04, stapleY2);
      // Label — rotated vertically along the spine
      pdf.setFontSize(5.5);
      pdf.setTextColor(59, 130, 246);
      var labelX = spineLeft ? bleed - 0.06 : bleed + trimW + 0.06;
      var labelAngle = spineLeft ? 90 : -90;
      pdf.text("SPINE / BOUND EDGE", labelX, bleed + trimH / 2, { angle: labelAngle, align: "center" });

      var logoW = Math.min(trimW * 0.25, 1.5); // max 1.5" or 25% of trim width
      var logoH = logoW; // 1:1 aspect ratio

      var logoY = bleed + safety + 0.2;
      try { pdf.addImage(PPS_LOGO_B64, "PNG", logoX, logoY, logoW, logoH); } catch(e) {}

      // Page label — below logo
      var cx = docW / 2;
      var labelY = logoY + logoH + 0.25;
      pdf.setFontSize(10);
      pdf.setTextColor(170, 170, 170);
      var pgLabel = pageLabel(pg, pageCount);
      pdf.text(pgLabel, cx, labelY, { align: "center" });

      // Dimension info
      pdf.setFontSize(7);
      pdf.setTextColor(190, 190, 190);
      pdf.text("Trim: " + trimW + '" \u00d7 ' + trimH + '"  |  With bleeds: ' + docW.toFixed(3) + '" \u00d7 ' + docH.toFixed(3) + '"', cx, labelY + 0.18, { align: "center" });

      // Website URL — bottom center
      pdf.setFontSize(7);
      pdf.setTextColor(150, 150, 150);
      pdf.text("priorityprintservice.com", cx, docH - bleed - 0.08, { align: "center" });

      // Legend on first page
      if (pg === 0) {
        var lx = bleed + safety + 0.1;
        var ly = docH - bleed - 0.42;

        pdf.setTextColor(229, 62, 62);
        pdf.text("\u2014 Bleed (extend backgrounds to this edge)", lx, ly - 0.30);
        pdf.setTextColor(30, 30, 30);
        pdf.text("- - Trim (cut line)", lx, ly - 0.21);
        pdf.setTextColor(56, 161, 105);
        pdf.text("- - Safety (keep all text inside this line)", lx, ly - 0.12);
        pdf.setTextColor(59, 130, 246);
        pdf.text("\u2014 Spine / bound edge (stapled side)", lx, ly - 0.03);
      }
    }

    var safeName = (sizeLabel || (trimW + "x" + trimH)).replace(/[^a-zA-Z0-9._-]/g, "_");
    pdf.save("PPS_Template_" + safeName + "_" + pageCount + "pg.pdf");
  } catch(e) {
    console.error("Template generation failed:", e);
    alert("Template generation failed: " + e.message);
  }
}

// Draw a dashed rectangle using individual line segments
function drawDashedRect(pdf, x, y, w, h, dashLen, gapLen) {
  drawDashedLine(pdf, x, y, x + w, y, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y, x + w, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y + h, x, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x, y + h, x, y, dashLen, gapLen);
}

function drawDashedLine(pdf, x1, y1, x2, y2, dashLen, gapLen) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len === 0) return;
  var ux = dx / len, uy = dy / len;
  var pos = 0;
  var drawing = true;
  while (pos < len) {
    var segLen = drawing ? dashLen : gapLen;
    if (pos + segLen > len) segLen = len - pos;
    if (drawing) {
      pdf.line(x1 + ux * pos, y1 + uy * pos, x1 + ux * (pos + segLen), y1 + uy * (pos + segLen));
    }
    pos += segLen;
    drawing = !drawing;
  }
}

// Draw a dashed rounded rectangle
// all4=true: all corners rounded. all4=false: only top-right and bottom-right (outside 2)
function drawDashedRoundedRect(pdf, x, y, w, h, r, all4, dashLen, gapLen) {
  var tl = all4 ? r : 0;
  var tr = r;
  var br = r;
  var bl = all4 ? r : 0;
  // Top edge: from (x+tl, y) to (x+w-tr, y)
  drawDashedLine(pdf, x + tl, y, x + w - tr, y, dashLen, gapLen);
  // Top-right corner arc
  if (tr > 0) drawDashedArc(pdf, x + w - tr, y + tr, tr, -90, 0, dashLen, gapLen);
  // Right edge
  drawDashedLine(pdf, x + w, y + tr, x + w, y + h - br, dashLen, gapLen);
  // Bottom-right corner arc
  if (br > 0) drawDashedArc(pdf, x + w - br, y + h - br, br, 0, 90, dashLen, gapLen);
  // Bottom edge
  drawDashedLine(pdf, x + w - br, y + h, x + bl, y + h, dashLen, gapLen);
  // Bottom-left corner arc
  if (bl > 0) drawDashedArc(pdf, x + bl, y + h - bl, bl, 90, 180, dashLen, gapLen);
  // Left edge
  drawDashedLine(pdf, x, y + h - bl, x, y + tl, dashLen, gapLen);
  // Top-left corner arc
  if (tl > 0) drawDashedArc(pdf, x + tl, y + tl, tl, 180, 270, dashLen, gapLen);
}

// Draw a dashed arc (quarter circle) for rounded corners
function drawDashedArc(pdf, cx, cy, r, startDeg, endDeg, dashLen, gapLen) {
  var arcLen = Math.abs(endDeg - startDeg) * Math.PI / 180 * r;
  var steps = Math.max(12, Math.ceil(arcLen / 0.02));
  var pos = 0;
  var drawing = true;
  var segStart = null;
  for (var i = 0; i <= steps; i++) {
    var t = i / steps;
    var angle = (startDeg + (endDeg - startDeg) * t) * Math.PI / 180;
    var px = cx + Math.cos(angle) * r;
    var py = cy + Math.sin(angle) * r;
    var dist = (arcLen * t);
    if (drawing) {
      if (segStart === null) segStart = { x: px, y: py };
      if (dist - (pos) >= dashLen || i === steps) {
        pdf.line(segStart.x, segStart.y, px, py);
        segStart = null;
        drawing = false;
        pos = dist;
      }
    } else {
      if (dist - pos >= gapLen) {
        drawing = true;
        segStart = { x: px, y: py };
        pos = dist;
      }
    }
  }
}
