    }
    setTimeout(() => {
      const t = document.querySelector('[autocomplete="shipping address-line1"]');
      if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); t.focus(); }
    }, 120);
  };

  const effectiveCoverMode = bindStyle==="openface" ? "same" : coverMode;
  // Shippo live transit: re-run the pricing memo when a live lookup lands.
  const [ltTick, setLtTick] = useState(0);
  useEffect(() => {
    const _f = () => setLtTick(t => t + 1);
    window.addEventListener("pps-live-transit", _f);
    return () => window.removeEventListener("pps-live-transit", _f);
  }, []);
  const result=useMemo(()=>calculate({
    sets,sizeLabel,customLong,customShort,bindDir,insideColor,coverColor,
    insidePaperType,insidePaper,coverMode:effectiveCoverMode,coverPaperType,coverPaper,
    twoStaple,vividPrint,coating,bundling,roundCorner,outfold,perforation,
    bindStyle,sidesPrinted,magnetBacker,
    artwork,artEditPages,bleed,proof,
    shipState,shipZip,needByDate,
  }),[sets,sizeLabel,customLong,customShort,bindDir,insideColor,coverColor,
    insidePaperType,insidePaper,effectiveCoverMode,coverPaperType,coverPaper,
    twoStaple,vividPrint,coating,bundling,roundCorner,outfold,perforation,
    bindStyle,sidesPrinted,magnetBacker,
    artwork,artEditPages,bleed,proof,
    shipState,shipZip,needByDate,ltTick]);

  const r=result||{};

  // ── SEO schema debug data (schemas injected by PHP plugin in production) ──
  const schemaData = useMemo(() => {
    const tQ = sets.reduce((s,x) => s + (x.qty || 0), 0);
    const tP = sets.reduce((s,x) => s + (x.pages || 0), 0);
    const total = result?.total || 0;
    const perUnit = result?.perUnit || 0;
    const days = result?.days || 3;
    const sh = result?.shipping || {};
    return {
      product: {
        name: `Custom Coupon Book / Pad — ${sizeLabel}`,
        description: `${tQ} qty, ${tP} pages, ${insidePaper.label} paper, ${insideColor === "bw" ? "greyscale" : "full color"} printing`,
        lowPrice: total.toFixed(2),
        perUnit: perUnit.toFixed(2),
        availability: total > 0 ? "InStock" : "OutOfStock",
        turnaround: `${days} business days`,
        size: sizeLabel, pages: tP, quantity: tQ,
        paper: insidePaper.label,
        coverPaper: coverMode === "same" ? "Same as inside" : coverPaper.label,
        color: insideColor === "bw" ? "Greyscale" : "Full Color",
        delivery: sh.freeDeliveryYMD || "", productionStart: sh.productionStartYMD || "",
      },
      injectedByPHP: !!(window.PPS_CONFIG || {}).ajaxUrl,
    };
  }, [result, sets, sizeLabel, insidePaper, insideColor, coverMode, coverPaper]);

  // Quantity projection table — recalculate at standard breakpoints
  const projectionsRaw = useMemo(() => {
    if (!result || result.error?.length) return null;
    const baseConfig = {
      sizeLabel,customLong,customShort,bindDir,insideColor,coverColor,
      insidePaperType,insidePaper,coverMode:effectiveCoverMode,coverPaperType,coverPaper,
      twoStaple,vividPrint,coating,bundling,roundCorner,outfold,perforation,
      bindStyle,sidesPrinted,magnetBacker,
      artwork,artEditPages,bleed,proof,
      shipState,shipZip,needByDate,
    };
    const currentQty = sets[0]?.qty || 100;
    const currentPages = sets[0]?.pages || 10;
    const breakpoints = [25,50,100,250,500,1000,2500,5000].filter(q => q !== currentQty);
    // Add current qty and sort
    const qtys = [...breakpoints, currentQty].sort((a,b) => a - b);
    // Derive color split for projection rows from the current set's colorMode.
    // Without this, calculate()'s insidePrint loop (which keys on colorPages/bwPages)
    // returns 0 and every projection row is missing the inside-print cost.
    const baseSet = sets[0] || {};
    const projColorMode = baseSet.colorMode || "color";
    const buildProjSet = (q) => {
      let cp, bp;
      if (projColorMode === "bw") { cp = 0; bp = currentPages; }
      else if (projColorMode === "color") { cp = currentPages; bp = 0; }
      else { // mixed — preserve ratio from the current set
        const baseColor = baseSet.colorPages || 0;
        const baseBw = baseSet.bwPages || 0;
        const ratio = (baseColor + baseBw) > 0 ? baseColor / (baseColor + baseBw) : 1;
        cp = Math.round(currentPages * ratio);
        bp = currentPages - cp;
      }
      return {qty: q, pages: currentPages, name: "", colorMode: projColorMode, colorPages: cp, bwPages: bp};
    };
    return qtys.map(q => {
      // If current order has no rush, strip needByDate from projections so
      // higher quantities don't accidentally trigger rush (production time grows with qty)
      const projNeedBy = (result.shipping?.rushCost > 0) ? needByDate : null;
      const projCfg = {...baseConfig, needByDate: projNeedBy, sets: [buildProjSet(q)]};
      const pr = calculate(projCfg);
      if (!pr || pr.error?.length) return {qty: q, total: null, perUnit: null, current: q === currentQty};
      return {
        qty: q, total: pr.total, perUnit: pr.perUnit,
        current: q === currentQty,
      };
    });
  }, [result, sets, sizeLabel,customLong,customShort,bindDir,insideColor,coverColor,
    insidePaperType,insidePaper,effectiveCoverMode,coverPaperType,coverPaper,
    twoStaple,vividPrint,coating,bundling,roundCorner,outfold,perforation,
    bindStyle,sidesPrinted,magnetBacker,
    artwork,artEditPages,bleed,proof,
    shipState,shipZip,needByDate]);

  // Debug-only quoting aid (unlocked by the %3414 job-name code): mark the whole
  // quantity table up or down by a percentage. Applies ONLY to the displayed and
  // copied table — `result` is untouched, so the price submitted to the cart is
  // never affected by this control.
  const[tableAdjPct,setTableAdjPct]=useState("");
  const projections = useMemo(() => {
    if (!projectionsRaw) return null;
    const adj = 1 + (parseFloat(tableAdjPct) || 0) / 100;
    return adj === 1 ? projectionsRaw : projectionsRaw.map(p => p.total === null ? p
      : {...p, total: p.total * adj, perUnit: p.perUnit * adj});
  }, [projectionsRaw, tableAdjPct]);

  useEffect(()=>{if(r.coatOK===false)setCoating(0)},[r.coatOK]);
  useEffect(()=>{if(r.vividOK===false)setVividPrint(false)},[r.vividOK]);
  useEffect(()=>{if(r.q100===false)setBundling(0)},[r.q100]);
  // The date field is pre-filled with the free delivery date so it never sits empty.
  // That has to stop the moment the customer picks their own, or every recalculation
  // that moves the free date — a quantity change, a different paper — silently threw
  // their choice away and put the default back.
  const needByTouched = useRef(false);
  useEffect(()=>{
    if(needByTouched.current) return;
    if(r.shipping?.freeDeliveryYMD) setNeedByDate(r.shipping.freeDeliveryYMD);
  },[r.shipping?.freeDeliveryYMD]);
  // NOTE: hardcopy proof is NOT auto-removed — always available as option
  const upSet=(i,p)=>setSets(s=>s.map((x,j)=>{
    if(j!==i) return x;
    const n={...x,...p};
    // Sync page counts when color mode or individual page counts change
    if(n.colorMode==="color") { n.colorPages=n.pages; n.bwPages=0; }
    else if(n.colorMode==="bw") { n.bwPages=n.pages; n.colorPages=0; }
    else if(n.colorMode==="mixed") {
      // If pages changed, preserve ratio; if colorPages/bwPages changed, update pages
      if(p.pages!=null) { const ratio=x.colorPages/(x.colorPages+x.bwPages||1); n.colorPages=Math.round(n.pages*ratio)||Math.floor(n.pages/2); n.bwPages=n.pages-n.colorPages; }
      else if(p.colorPages!=null||p.bwPages!=null) { n.pages=n.colorPages+n.bwPages; }
    }
    return n;
  }));
  const r2=mob?{display:"grid",gridTemplateColumns:"1fr",gap:8}:ST.row2;
  const r3=mob?{display:"grid",gridTemplateColumns:"1fr",gap:8}:ST.row3;

  const[submitting,setSubmitting]=useState(false);
  const[uploadProgress,setUploadProgress]=useState(null); // null | {phase, pct, fileName, fileIdx, fileCount}

  const buildShareUrl = () => {
    const p = new URLSearchParams();
    p.set("size", sizeLabel);
    p.set("long", customLong); p.set("short", customShort);
    p.set("bind", bindDir);
    p.set("color", insideColor);
    p.set("covercolor", coverColor);
    p.set("paper", insidePaperType);
    if (insidePaper && insidePaper.val != null) p.set("paperval", insidePaper.val);
    p.set("covermode", coverMode);
    p.set("coverpaper", coverPaperType);
    if (coverPaper && coverPaper.val != null) p.set("coverval", coverPaper.val);
    p.set("staple", twoStaple ? "true" : "false");
    p.set("vivid", vividPrint ? "true" : "false");
    p.set("coating", coating);
    p.set("bundling", bundling);
    p.set("corner", roundCorner);
    p.set("state", shipState);
    p.set("qty", sets[0].qty);
    p.set("pages", sets[0].pages);
    const base = window.location.origin + window.location.pathname;
    const qs = p.toString();
    return qs ? base + "?" + qs : base;
  };

  // The fallbacks below swap one calculator FILENAME for another, which is right on the
  // standalone Pages preview and a no-op on a WordPress product page -- there the path is
  // /product/<slug>/, the regex matches nothing, and .replace() hands back the same URL.
  // The "Try as Saddle Stitch" link then reloaded the perfect-bound page it was on.
  // PPS_CONFIG.switchTargets (injected by PHP, pointing at real product URLs) is the
  // intended source; until it is present, a target that resolves to the current page is
  // not a target, so it is dropped rather than rendered as a dead end.
  const _hereUrl = (location.origin + location.pathname).replace(/\/+$/, "");
  const switchTargets = (window.PPS_CONFIG && window.PPS_CONFIG.switchTargets) || [
    {type:"saddle",label:"Saddle Stitch",url:(location.origin+location.pathname).replace(/calc-coupon-book\.html/,"calc-preview-test.html")},
    {type:"perfect-bound",label:"Perfect Bound",url:(location.origin+location.pathname).replace(/calc-coupon-book\.html/,"calc-perfect-bound.html")},
  ].filter(t => t && t.url && t.url.replace(/\/+$/, "") !== _hereUrl);
  const buildSwitchUrl = (targetUrl) => {
    const p = new URLSearchParams();
    p.set("qty", sets[0].qty);
    p.set("pages", sets[0].pages);
    if (sizeLabel !== "5.5×8.5 (Opens to 8.5×11)") p.set("size", sizeLabel);
    if (sizeLabel === "Custom Size") { p.set("long", customLong); p.set("short", customShort); }
    if (bindDir !== "short") p.set("bind", bindDir);
    if (insideColor !== "color") p.set("color", insideColor);
    if (coverColor !== "color") p.set("covercolor", coverColor);
    p.set("paper", insidePaperType);
    if (insidePaper && insidePaper.val != null) p.set("paperval", insidePaper.val);
    if (coverMode !== "same") { p.set("covermode", coverMode); p.set("coverpaper", coverPaperType); }
    if (coverPaper && coverPaper.val != null) p.set("coverval", coverPaper.val);
    if (vividPrint) p.set("vivid", "true");
    if (coating > 0) p.set("coating", coating);
    if (bundling > 0) p.set("bundling", bundling);
    if (roundCorner > 0) p.set("corner", roundCorner);
    if (shipState !== "AZ") p.set("state", shipState);
    p.set("from", "coupon");
    const qs = p.toString();
    return qs ? targetUrl + (targetUrl.includes("?") ? "&" : "?") + qs : targetUrl;
  };

  const handleShareLink = () => {
    const url = buildShareUrl();
    navigator.clipboard.writeText(url).then(() => {
      setShareCopied(true);
      setTimeout(() => setShareCopied(false), 2000);
    }).catch(() => {
      // Fallback for non-HTTPS or denied clipboard
      prompt("Copy this link:", url);
    });
  };

  const handleAddToOrder = async () => {
    if (!result || result.error?.length || submitting) return;
    if (missingDest) { focusShipping(); return; }
    // Artwork integrity guard: pageTransforms must be a real object before we
    // serialize order metadata. An empty {} is fine (customer didn't open the
    // proof transform UI); undefined/non-object means something is wrong with
    // the lifted state and we'd corrupt the order. Bail rather than submit.
    if (pageTransforms == null || typeof pageTransforms !== "object") {
      console.error("PPS: refusing to submit — pageTransforms is missing or invalid", pageTransforms);
      return;
    }
    setSubmitting(true);
    setUploadProgress(null);
    const config = {
      sizeLabel, customLong, customShort, bindDir, sets,
      insideColor, coverColor, insidePaper, insidePaperType,
      coverMode: effectiveCoverMode, coverPaper, coverPaperType,
      bindStyle, sidesPrinted, magnetBacker,
      twoStaple, vividPrint, coating, bundling, roundCorner,
      artwork, artEditPages, bleed, proof,
      shipState, shipAddr, shipZip, needByDate,
      pageTransforms, artDims,
    };
    const summary = buildSummary(config, result);
    const metadata = buildMetadata(config, result);
    const rushCost = result.shipping?.rushCost || 0;
    await submitToWooCommerce(result.total, summary, metadata, rushCost, artFiles, setUploadProgress);
    // If still here (standalone mode), re-enable
    setUploadProgress(null);
    setSubmitting(false);
  };

  return(
    <div style={{minHeight:"100vh",background:CC.bg,fontFamily:"'Segoe UI','Helvetica Neue',Arial,sans-serif",color:CC.dark}}>
      <style>{`
                button:focus-visible,[role="button"]:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #1d6fe0 !important;outline-offset:2px;border-radius:3px;}
@media(max-width:700px){
          select,input[type="text"],input[type="number"],input[type="tel"],input[type="email"]{font-size:16px!important;padding:10px 12px!important;min-height:46px!important}
          /* Here the toggle is the short one — 40px, under the 44px tap-target minimum —
             so raise it to the fields rather than shrink the fields down to it. */
          button[aria-pressed]{min-height:44px!important}
          .pps-sec-hdr{padding:12px 14px!important;font-size:13px!important}
          .pps-sec-body{padding:12px 14px!important}
          .pps-pill{padding:10px 6px!important;font-size:12px!important;min-height:44px!important}
          .pps-ship-box{font-size:10px!important}
        }
      `}</style>
      {/* Hero header — eyebrow + display + tagline */}
      <section style={{maxWidth:1180,margin:"0 auto",padding:mob?"18px 14px 6px":"34px 28px 18px"}}>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",flexWrap:"wrap",gap:mob?10:20}}>
          <div style={{flex:"1 1 320px",minWidth:0}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:CK.magenta}}>Configure · Coupon Book</div>
            <h1 style={{fontFamily:"'Segoe UI','Helvetica Neue',Arial,sans-serif",fontWeight:800,lineHeight:1,letterSpacing:"-0.02em",color:CC.dark,textTransform:"uppercase",margin:mob?"8px 0 0":"10px 0 0",maxWidth:720,fontSize:mob?28:44}}>
              Coupon Book<br/>
              <span style={{color:CK.cyan}}>Instant Quote</span>
            </h1>
          </div>
        </div>
      </section>

      {mob && <MobilePreviewBar sizeLabel={sizeLabel} pages={sets[0]?.pages||0} quantity={sets.reduce((s,x)=>s+(x.qty||0),0)||sets[0]?.qty||0} coverColor={coverColor} coverPaper={coverPaper} insidePaper={insidePaper} coverMode={coverMode} coverArt={coverArt} backCoverArt={backCoverArt} bindEdge={result?.bindingEdge || result?.sz?.bindEdge} onOpenPreview={()=>openPreviewModalRef.current&&openPreviewModalRef.current()}/>}

      <div style={{maxWidth:1180,margin:"0 auto",padding:mob?"0 10px 140px":"0 24px 80px",display:"flex",flexDirection:mob?"column":"row",gap:mob?8:18,alignItems:"flex-start"}}>
        <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:mob?6:10,width:mob?"100%":undefined}}>

          {/* SECTION 1: Size */}
          <Sec title="Coupon Book Size" open={op.s1} onToggle={()=>tog("s1")} badge={isCustom?`${customLong}×${customShort}"`:sizeLabel.split(" (")[0]}>
            <div style={r2}>
              <Pil label={<Tip k="size">Booklet Size</Tip>} value={sizeMode} onChange={handleSizeMode} options={[{t:"Preset Sizes",v:"preset"},{t:"Custom Size",v:"custom"}]}/>
              {isCustom
                ? <div style={ST.f}><label style={ST.lbl}>Custom Size</label><div style={{position:"relative"}}><select disabled style={{...ST.sel,fontSize:mob?16:15,padding:mob?"10px 32px 10px 12px":"10px 32px 10px 12px",opacity:.6,pointerEvents:"none",fontWeight:600}}><option>{(customLong&&customShort)?(()=>{const lo=Math.max(customLong,customShort),sh=Math.min(customLong,customShort),spine=bindDir==="short"?sh:lo,nonSpine=bindDir==="short"?lo:sh;return `${lo}×${sh}" — Opens to ${nonSpine*2}×${spine}"`})():"Enter dimensions below"}</option></select><span style={ST.selA}><Chev/></span></div></div>
                : <Sel label={<Tip k="size">Select Size</Tip>} value={sizeLabel} onChange={handleSizeLabel}>
                    {SIZE_PRESETS.map(g=><optgroup key={g.group} label={g.group}>{g.items.map(s=><option key={s.label} value={s.label}>{s.label}</option>)}</optgroup>)}
                  </Sel>
              }
            </div>
            {isCustom&&<><div style={r3}>
              <TxtNum label={<Tip k="custom_width">Width (in)</Tip>} value={customLong} onChange={setCustomLong} min={2} max={13.25}/>
              <TxtNum label={<Tip k="custom_height">Height (in)</Tip>} value={customShort} onChange={setCustomShort} min={2} max={13.25}/>
              {(customLong&&customShort&&Number(customLong)===Number(customShort))?<div style={{...ST.f,opacity:.4,pointerEvents:"none"}}><label style={ST.lbl}>Spine Side</label><div style={{position:"relative"}}><select disabled style={{...ST.sel,fontSize:mob?16:15,padding:mob?"10px 32px 10px 12px":"10px 32px 10px 12px"}}><option>Square — opens to {customLong*2}×{customShort}"</option></select><span style={ST.selA}><Chev/></span></div></div>:<Sel label={<Tip k="spine_side">Spine Side</Tip>} value={bindDir} onChange={setBindDir}><option value="short">{customShort?`${Math.min(customLong||0,customShort||0)}" spine — Opens to ${Math.max(customLong||0,customShort||0)*2}×${Math.min(customLong||0,customShort||0)}"`:"Short Side"}</option><option value="long">{customLong?`${Math.max(customLong||0,customShort||0)}" spine — Opens to ${Math.min(customLong||0,customShort||0)*2}×${Math.max(customLong||0,customShort||0)}"`:"Long Side"}</option></Sel>}
            </div>
            {r.sz?.clamped && (
              <div style={{ fontSize:11, color:"#b45309", background:"#fef3c7", border:"1px solid #fcd34d", borderRadius:4, padding:"6px 10px", marginTop:4 }}>
                ⚠ Dimensions adjusted to fit press sheet (12.5×27″ max). 
                <button type="button" onClick={() => { setCustomLong(r.sz.clamped.long); setCustomShort(r.sz.clamped.short); }} style={{
                  marginLeft:8, fontSize:10, fontWeight:600, padding:"2px 8px", borderRadius:3, cursor:"pointer", fontFamily:"inherit",
                  border:"1px solid #f59e0b", background:"#fff", color:"#b45309",
                }}>Apply {r.sz.clamped.long}″ × {r.sz.clamped.short}″</button>
              </div>
            )}
            {r.error?.map((e,i)=><p key={i} style={ST.err}>{e}</p>)}</>}

            {/* Set 1 — always in the size section */}
            <div style={ST.hr}/>
            <div style={r3}>
              <TxtNum label={<Tip k="quantity">Quantity</Tip>} value={sets[0].qty} onChange={v=>upSet(0,{qty:Math.max(1,Math.round(v))})} min={1}/>
              <Pil label={<Tip k="inside_print">Inside Print Color</Tip>} value={sets[0].colorMode} onChange={v=>upSet(0,{colorMode:v})} options={[{t:"Full Color",v:"color",onStyle:{background:"conic-gradient(from 45deg, #00aeef 0deg, #ec008c 90deg, #fff200 180deg, #231f20 270deg, #00aeef 360deg)",color:"#fff",fontWeight:600,textShadow:"0 1px 4px rgba(0,0,0,.5)"}},{t:"Greyscale",v:"bw",onStyle:{background:"linear-gradient(135deg, #888 0%, #444 50%, #999 100%)",color:"#fff",fontWeight:600}} /* Mixed mothballed 2026-08-09 (owner) — per-set colorPages/bwPages logic preserved below; re-add {t:"Mixed",v:"mixed"} here to revive */]}/>
              <div style={ST.f}><label style={ST.lbl}>Job Name</label><input type="text" value={sets[0].name} onChange={e=>upSet(0,{name:e.target.value})} placeholder="Optional" style={ST.inp}/></div>
            </div>
            {sets[0].colorMode === "mixed" ? (
              <div style={{...r3, marginTop:6}}>
                <TxtNum label={<Tip k="color_pages">Color Pages</Tip>} value={sets[0].colorPages} onChange={v=>upSet(0,{colorPages:Math.max(0,Math.round(v))})} min={0} max={350}/>
                <TxtNum label={<Tip k="bw_pages">B&W Pages</Tip>} value={sets[0].bwPages} onChange={v=>upSet(0,{bwPages:Math.max(0,Math.round(v))})} min={0} max={350}/>
                <div style={{...ST.f, justifyContent:"center"}}><span style={{fontSize:11,color:CC.mid,fontWeight:600}}>{sets[0].colorPages+sets[0].bwPages} total pages</span></div>
              </div>
            ) : (
              <div style={{marginTop:6}}>
                {/* Customers count sheets (leaves); the engine keeps pages (2 per sheet), so
                  the conversion happens only here at the input boundary. */}
              <TxtNum label={<Tip k="page_count">{bindStyle==="openface"?"Total Sheets (incl. top sheet)":"Total Sheets (incl. cover)"}</Tip>} value={sets[0].pages/2} onChange={v=>{const sh=Math.max(2,Math.round(v)); upSet(0,{pages:Math.min(200,sh*2)});}} min={2} max={100} confirm unit="sheets" adjustHint="coupon books run 2–100 sheets"/>
              </div>
            )}

            {/* Bind Style & Printing Sides */}
            <div style={ST.hr}/>
            <div style={r2}>
              <Pil label={<Tip k="bind_style">Bind Style</Tip>} value={bindStyle} onChange={setBindStyle} options={[{t:"Open Faced / Padded",v:"openface"},{t:"Wraparound Cover",v:"wraparound"}]}/>
              <Pil label={<Tip k="sides">Printing Sides</Tip>} value={sidesPrinted} onChange={setSidesPrinted} options={[{t:"Double Sided",v:"double"},{t:"Single Sided",v:"single"}]}/>
            </div>
          </Sec>

          {/* SECTION 2: Printing & Paper */}
          <Sec title="Printing & Paper" open={op.s2} onToggle={()=>tog("s2")}>
            {bindStyle==="wraparound"&&<div style={r2}>
              <Pil label={<Tip k="cover_print">Cover Printing</Tip>} value={coverColor} onChange={setCoverColor} options={[{t:"Full Color",v:"color",onStyle:{background:"conic-gradient(from 45deg, #00aeef 0deg, #ec008c 90deg, #fff200 180deg, #231f20 270deg, #00aeef 360deg)",color:"#fff",fontWeight:600,textShadow:"0 1px 4px rgba(0,0,0,.5)"}},{t:"Greyscale",v:"bw",onStyle:{background:"linear-gradient(135deg, #888 0%, #444 50%, #999 100%)",color:"#fff",fontWeight:600}}]}/>
            </div>}
            {bindStyle==="wraparound"&&<div style={ST.hr}/>}
            <div style={r2}>
              <Pil label={<Tip k="inside_paper">Inside Paper</Tip>} value={insidePaperType} onChange={v=>{if(v==="cardstock"&&!csOK)return;setInsidePaperType(v);const pool=v==="cardstock"?PAPERS_CS:PAPERS_NC;setInsidePaper(pool[0])}} options={[{t:"Text Weight",v:"noncardstock"},{t:"Cardstock",v:"cardstock"}]}/>
              <Sel label={<Tip k="paper">Select Paper</Tip>} badge={<TurnBadge days={r.ti?.insidePaper}/>} value={insidePaper.val} onChange={v=>{const f=ALL_PAPERS.find(p=>String(p.val)===v);if(f){setInsidePaper(f);setInsidePaperType(f.type)}}}>{PAPERS_NC.map(p=><option key={p.val} value={p.val}>{paperDot(p)+p.label}</option>)}{csOK&&<optgroup label="Cardstock">{PAPERS_CS.map(p=><option key={p.val} value={p.val}>{paperDot(p)+p.label} (Cardstock)</option>)}</optgroup>}</Sel>
            </div>
            <PaperNote p={insidePaper} pool={insidePaperType==="cardstock"?"cs":"nc"} legend/>
            {insidePaperType==="cardstock"&&!csOK&&<p style={ST.err}>Cardstock requires all sets ≤ 12 sheets</p>}
            {bindStyle==="wraparound"&&<>
            <div style={ST.hr}/>
            <div style={r2}>
              <Pil label={<Tip k="cover_paper">Cover Paper</Tip>} value={coverMode} onChange={setCoverMode} options={[{t:"Same as Inside",v:"same"},{t:"Different Cover",v:"separate"}]}/>
              {coverMode==="separate"
                ? <Sel label={<Tip k="paper">Select Paper</Tip>} badge={<TurnBadge days={r.ti?.coverPaper}/>} value={coverPaper.val} onChange={v=>{const f=ALL_PAPERS.find(p=>String(p.val)===v);if(f){setCoverPaper(f);setCoverPaperType(f.type)}}}>{PAPERS_NC.map(p=><option key={p.val} value={p.val}>{paperDot(p)+p.label}</option>)}<optgroup label="Cardstock">{PAPERS_CS.map(p=><option key={p.val} value={p.val}>{paperDot(p)+p.label} (Cardstock)</option>)}</optgroup></Sel>
                : <div style={{...ST.f,marginTop:0}}><label style={ST.lbl}>&nbsp;</label><div style={{fontSize:14,color:CC.light,padding:"10px 0"}}>Uses same paper as inside pages</div></div>
              }
            </div>
            {coverMode==="separate"&&<PaperNote p={coverPaper} pool={coverPaperType==="cardstock"?"cs":"nc"}/>}
            </>}
            {bindStyle==="openface"&&<div style={{fontSize:12,color:CC.light,padding:"6px 0",fontStyle:"italic"}}>Open-faced pads use the same paper throughout — the top sheet is simply your first coupon sheet.</div>}
          </Sec>

          {/* SECTION 3: Finishing & Addons */}
          <Sec title="Finishing & Addons" open={op.s3} onToggle={()=>tog("s3")}>
            {(_AD.vivid!==false || vividPrint===true) && <Pil label={<RichTip tipKey="vivid">Print Quality</RichTip>} badge={<TurnBadge days={r.ti?.vivid}/>} value={vividPrint} onChange={setVividPrint} disabled={!r.vividOK} options={[{t:"Standard HQ",v:false},{t:"Enhanced Vivid",v:true}]}/>}
            {(_AD.vivid!==false) && !r.vividOK && <div style={{fontSize:12,color:CC.light,marginTop:-8,marginBottom:4}}>Requires matte or gloss coated paper</div>}
            {(_AD.vivid!==false || vividPrint===true) && <div style={ST.hr}/>}
            <div style={r2}>
              {(_AD.coating!==false || coating>0) && <Sel label={<RichTip tipKey="coating">{bindStyle==="openface"?"Top Sheet Coating":"Cover Coating"}</RichTip>} badge={<TurnBadge days={r.ti?.coating}/>} value={coating} onChange={v=>setCoating(Number(v))} disabled={!r.coatOK} note={!r.coatOK?(bindStyle==="openface"?"Requires glossy/coated paper":"Requires glossy/coated cover"):null}>{COATINGS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>}
              {(_AD.bundling!==false || bundling>0) && (r.q100!==false
                ? <Sel label={<RichTip tipKey="bundling">Bundling</RichTip>} badge={<TurnBadge days={r.ti?.bundling}/>} value={bundling} onChange={v=>setBundling(Number(v))}>{BUNDLING.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>
                : <div style={ST.f}><label style={ST.lbl}><RichTip tipKey="bundling">Bundling</RichTip></label><div style={{fontSize:12.5,color:CC.light}}>Available at qty ≥ 100</div></div>)}
            </div>
            {(_AD.rc!==false || roundCorner>0) && <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <Sel label={<RichTip tipKey="round_cornering">Round Cornering</RichTip>} badge={<TurnBadge days={r.ti?.roundCorner}/>} value={roundCorner} onChange={v=>setRoundCorner(Number(v))}>{CORNERS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>
              </div>
              {coverArt && roundCorner > 0 && (() => {
                const is4 = roundCorner === 108 || roundCorner === 107;
                const isLarge = roundCorner === 215 || roundCorner === 107;
                const r = isLarge ? 14 : 9;
                const br = is4 ? `${r}px` : `1px ${r}px ${r}px 1px`;
                return (
                  <div style={{ width: 72, height: 94, borderRadius: br, overflow: "hidden", border: `1px solid ${CC.border}`, flexShrink: 0, opacity: 0.8 }}>
                    <img src={coverArt} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                  </div>
                );
              })()}
            </div>}

            {/* Coupon book specific addons */}
            {/* Wraparound style perforates the cover as part of the binding, so the
                perforation add-on only offers coupon tear-outs on openface pads. */}
            {bindStyle==="openface" && (_AD.perforation!==false || perforation>0) && <Sel label={<RichTip tipKey="perforation">Coupon Perforation (tear-out)</RichTip>} badge={<TurnBadge days={r.ti?.perforation}/>} value={perforation} onChange={v=>setPerforation(Number(v))}>{PERF_OPTS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>}
            <Sel label={<Tip k="magnetic_backer">Magnetic Backer</Tip>} badge={<TurnBadge days={r.ti?.magnetBacker}/>} value={magnetBacker} onChange={v=>setMagnetBacker(Number(v))}>{MAGNET_OPTS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>
            {/* Outfold — mothballed 2026-08-09 (owner). OUTFOLD_OPTS + pricing logic preserved;
                legacy restores with outfold>0 still price it. Re-enable by uncommenting:
            {(_AD.outfold!==false || outfold>0) && <Sel label={<RichTip tipKey="outfold">Outfold (Fold-Out Page)</RichTip>} badge={<TurnBadge days={r.ti?.outfold}/>} value={outfold} onChange={v=>setOutfold(Number(v))}>{OUTFOLD_OPTS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>}
            */}
          </Sec>

          {/* SECTION 4: Artwork & Proofing */}
          <Sec title="Artwork & Proofing" open={op.s4} onToggle={()=>tog("s4")}>

            {/* Art options dropdown */}
            <Sel label={<Tip k="artwork_design">Artwork & Design</Tip>} badge={<TurnBadge days={(r.ti?.artDesign||0)+(r.ti?.artEdits||0)}/>} value={artwork} onChange={v=>{setArtwork(Number(v)); if(Number(v)===0.04) setProof(proof===0?0.01:proof); }}>{ART_OPTS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>

            {/* Pages needing edits — for artwork edits option */}
            {artwork>=2&&artwork<4&&<TxtNum label={<Tip k="pages_edits">Pages Needing Edits</Tip>} value={artEditPages} onChange={setArtEditPages} min={0}/>}

            {/* Generic file upload for edits / new design */}
            {artwork>=2 && (
              <div style={{marginTop:8, padding:"12px 14px", borderRadius:6, background:"#f8f8fa", border:`1px solid ${CC.border}`}}>
                <div style={{fontSize:12, fontWeight:700, color:CC.dark, marginBottom:4}}>📎 Upload Reference Files (optional)</div>
                <div style={{fontSize:11, color:CC.mid, marginBottom:8, lineHeight:1.4}}>
                  {artwork>=4 ? "Attach any reference materials, logos, content, or inspiration for your new design."
                    : "Attach your artwork files or references for the pages needing edits."}
                </div>
                <label style={{
                  display:"flex", alignItems:"center", justifyContent:"center", gap:6,
                  padding:"10px", borderRadius:6, border:`2px dashed ${CC.border}`, cursor:"pointer",
                  background:"#fff", fontSize:12, fontWeight:600, color:CC.mid, transition:"all .15s",
                }}>
                  <span>Choose Files</span>
                  <input type="file" multiple accept=".pdf,.ai,.psd,.tif,.tiff,.jpg,.jpeg,.png,.doc,.docx,.zip" onChange={e => {
                    const files = Array.from(e.target.files || []);
                    if (files.length) setReferenceFiles(prev => [...prev, ...files.map(f => ({ name: f.name, size: f.size, file: f }))]);
                    e.target.value = "";
                  }} style={{display:"none"}}/>
                </label>
                {referenceFiles.length > 0 && (
                  <div style={{marginTop:6, display:"flex", flexDirection:"column", gap:3}}>
                    {referenceFiles.map((f, i) => (
                      <div key={i} style={{display:"flex", alignItems:"center", gap:6, fontSize:11, color:CC.mid, padding:"4px 8px", background:"#fff", borderRadius:4, border:`1px solid ${CC.border}`}}>
                        <span style={{flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{f.name}</span>
                        <span style={{fontSize:10, color:CC.light, flexShrink:0}}>{(f.size/1024).toFixed(0)} KB</span>
                        <button type="button" onClick={() => setReferenceFiles(prev => prev.filter((_, j) => j !== i))} style={{
                          border:"none", background:"none", cursor:"pointer", color:CC.light, fontSize:12, padding:"0 2px", fontFamily:"inherit",
                        }}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* === CONDITIONAL CONTENT BASED ON ART OPTION === */}

            {/* Upload Art with Order — full upload + proof system */}
            {artwork===0.01 && <>
              <div style={{marginTop:8}}/>
              <SetPreview
                sizeLabel={sizeLabel} customLong={customLong} customShort={customShort} bindDir={bindDir}
                pageCount={sets[0]?.pages||8} roundCorner={roundCorner} insideColor={insideColor}
                proof={proof} setProof={setProof}
                pageTransforms={pageTransforms} setPageTransforms={setPageTransforms}
                artDims={artDims} setArtDims={setArtDims}
                onPagesDetected={(pg) => upSet(0, { pages: pg })}
                onCoverArt={setCoverArt}
                onArtwork={setArtFiles}
                openPreviewModalRef={openPreviewModalRef}
                debug={proofDebug}
                onBleedDetected={(has) => { if(has) setBleed(0); else setBleed(1); }}
                onSizeOverride={(w, h) => {
                  setSizeMode("custom"); setSizeLabel("Custom Size");
                  const long = Math.max(w, h), short = Math.min(w, h);
                  setCustomLong(parseFloat(long.toFixed(3))); setCustomShort(parseFloat(short.toFixed(3)));
                  // Spine goes on the vertical (height) edge so the booklet is side-bound
                  // (8.5x11 art -> opens to 11x17, not a top-bound 8.5x22).
                  setBindDir(h >= w ? "long" : "short");
                }}
              />
              {artFiles.type === "existing" && (
                <div style={{marginTop:8,padding:"8px 12px",background:"#e8f4ff",border:"1px solid #b8e0f5",borderRadius:5,fontSize:12,display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:16}}>📎</span>
                  <span><strong>Previously uploaded:</strong> {artFiles.path.split("/").pop()}</span>
                  <span style={{color:"#666",marginLeft:"auto",fontSize:11}}>Upload a new file above to replace</span>
                </div>
              )}
            </>}

            {/* Email Art After Order */}
            {artwork===0.02 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:6,fontSize:12,color:CC.dark,lineHeight:1.6}}>
                <div style={{fontWeight:700,marginBottom:4}}>📧 Email Your Artwork</div>
                <div>Send your artwork or a link to your files to:</div>
                <div style={{fontWeight:700,color:CC.primary,fontSize:14,margin:"6px 0"}}>office@priorityprintservice.com</div>
                <div style={{fontSize:11,color:CC.mid}}>Include your order number in the subject line. We accept PDF, AI, PSD, TIFF, and high-resolution JPG/PNG files.</div>
              </div>
            )}

            {/* Artwork already discussed/provided */}
            {artwork===0.03 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:6,fontSize:12,color:"#166534",lineHeight:1.6}}>
                <div style={{fontWeight:700,marginBottom:4}}>✓ Artwork Previously Provided</div>
                <div style={{fontSize:11,color:CC.mid}}>Your artwork has already been discussed or provided. We'll proceed with the files on hand. Contact us if you need to make changes.</div>
              </div>
            )}

            {/* Canva design */}
            {artwork===0.04 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#fefce8",border:"1px solid #fde68a",borderRadius:6}}>
                <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#854d0e"}}>🎨 Canva Design</div>
                <div style={{fontSize:11,color:CC.mid,marginBottom:8,lineHeight:1.5}}>
                  Share an <strong>editor link</strong> to your Canva design so we can download print-ready files. 
                  Go to Canva → Share → "Anyone with the link" → Copy link.
                </div>
                <label style={{fontSize:11,fontWeight:600,color:CC.dark,display:"block",marginBottom:3}}>Canva Editor Link</label>
                <input type="text" value={canvaLink} onChange={e=>setCanvaLink(e.target.value)} placeholder="https://www.canva.com/design/..." style={{...ST.inp,fontSize:13,marginBottom:8}}/>
                <label style={{fontSize:11,fontWeight:600,color:CC.dark,display:"block",marginBottom:3}}>Special Instructions (optional)</label>
                <textarea value={canvaInstructions} onChange={e=>setCanvaInstructions(e.target.value)} placeholder="Any notes about your design, page order, etc." rows={3} style={{...ST.inp,fontSize:13,resize:"vertical",fontFamily:"inherit"}}/>
                <div style={{fontSize:10,color:"#b45309",marginTop:6}}>* Canva designs require a manual digital or hardcopy proof before printing.</div>
              </div>
            )}

            {/* Proofing options */}
            <div style={{marginTop:10}}/>
            <Sel label={<Tip k="proofing">Proofing</Tip>} badge={<TurnBadge days={r.ti?.proof}/>} value={proof} onChange={v=>setProof(Number(v))} note={proof>=3&&!r.hcOK?"Hardcopy proofs may add lead time with non-factory papers":null}>
              {artwork===0.01 && <option value={0}>Proof & Approve Online (included)</option>}
              {artwork!==0.01 && artwork!==0.04 && <option value={0}>No Proof Needed</option>}
              <option value={0.01}>{`Manual Digital Proof ($${PCF.proof_digital_cost})`}</option>
              <option value={3.01}>{`Hardcopy Proof ($${PCF.proof_hardcopy_cost})`}</option>
            </Sel>
            {proof >= 3 && (
              <div style={{marginTop:8, padding:"10px 12px", borderRadius:6, background:"#fefce8", border:"1px solid #fde68a"}}>
                <div style={{fontSize:11, fontWeight:700, color:"#854d0e", marginBottom:6}}>📮 Proof Shipping Address</div>
                <div style={{display:"flex", gap:8, marginBottom:6}}>
                  {[{v:true, l:"Same as shipping address"},{v:false, l:"Different address"}].map(o => (
                    <button type="button" key={String(o.v)} onClick={() => setProofAddrSame(o.v)} style={{
                      flex:1, padding:"6px 8px", fontSize:11, fontWeight:600, borderRadius:4, cursor:"pointer", fontFamily:"inherit",
                      border:`1px solid ${proofAddrSame===o.v ? "#d97706" : "#fde68a"}`,
                      background: proofAddrSame===o.v ? "#fef3c7" : "#fff",
                      color: proofAddrSame===o.v ? "#854d0e" : CC.mid,
                    }}>{o.l}</button>
                  ))}
                </div>
                {!proofAddrSame && (
                  <form autoComplete="on" onSubmit={e=>e.preventDefault()} style={{display:"grid", gap:6}}>
                    <input type="text" name="proof-name" autoComplete="name" value={proofAddr.name} onChange={e=>setProofAddr(p=>({...p,name:e.target.value}))} placeholder="Full Name" style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>
                    <input type="text" name="proof-address-line1" autoComplete="address-line1" value={proofAddr.street} onChange={e=>setProofAddr(p=>({...p,street:e.target.value}))} placeholder="Street Address" style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 80px 80px",gap:6}}>
                      <input type="text" name="proof-address-level2" autoComplete="address-level2" value={proofAddr.city} onChange={e=>setProofAddr(p=>({...p,city:e.target.value}))} placeholder="City" style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>
                      <input type="text" name="proof-address-level1" autoComplete="address-level1" value={proofAddr.state} onChange={e=>setProofAddr(p=>({...p,state:e.target.value}))} placeholder="State" maxLength={2} style={{...ST.inp,fontSize:12,padding:"7px 10px",textTransform:"uppercase"}}/>
                      <input type="text" name="proof-postal-code" autoComplete="postal-code" value={proofAddr.zip} onChange={e=>setProofAddr(p=>({...p,zip:e.target.value}))} placeholder="ZIP" maxLength={10} style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>
                    </div>
                  </form>
                )}
              </div>
            )}
          </Sec>

          {/* SECTION 5: Shipping & Delivery */}
          <Sec title="Shipping & Delivery" open={op.s5} onToggle={()=>tog("s5")} badge={r.shipping?.rushCost>0?`+$${r.shipping.rushCost.toFixed(0)} rush`:null}>

            <form autoComplete="on" onSubmit={e=>e.preventDefault()}>
            <div style={{fontSize:11,fontWeight:600,color:CC.mid,textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>Shipping Address</div>
            <div style={r2}>
              <div style={ST.f}><label style={ST.lbl}>Full Name</label><input type="text" name="shipping-name" autoComplete="shipping name" value={shipAddr.name} onChange={e=>setShipAddr(p=>({...p,name:e.target.value}))} placeholder="Full Name" style={ST.inp}/></div>
              <div style={ST.f}><label style={ST.lbl}>Company <span style={{fontWeight:400,color:CC.light}}>(optional)</span></label><input type="text" name="shipping-organization" autoComplete="shipping organization" value={shipAddr.company} onChange={e=>setShipAddr(p=>({...p,company:e.target.value}))} placeholder="Company" style={ST.inp}/></div>
            </div>
            <div style={{...ST.f,marginTop:6}}><label style={ST.lbl}>Street Address</label><input type="text" name="shipping-address-line1" autoComplete="shipping address-line1" value={shipAddr.street1} onChange={e=>setShipAddr(p=>({...p,street1:e.target.value}))} placeholder="Street address" style={ST.inp}/></div>
            <div style={{...ST.f,marginTop:6}}><label style={ST.lbl}>Address Line 2 <span style={{fontWeight:400,color:CC.light}}>(optional)</span></label><input type="text" name="shipping-address-line2" autoComplete="shipping address-line2" value={shipAddr.street2} onChange={e=>setShipAddr(p=>({...p,street2:e.target.value}))} placeholder="Apt, suite, unit, etc." style={ST.inp}/></div>
            <div style={{...r3,marginTop:6}}>
              <div style={ST.f}><label style={ST.lbl}>City</label><input type="text" name="shipping-address-level2" autoComplete="shipping address-level2" value={shipAddr.city} onChange={e=>setShipAddr(p=>({...p,city:e.target.value}))} placeholder="City" style={ST.inp}/></div>
              <Sel label={<Tip k="ship_state">State</Tip>} value={shipState} onChange={v=>{setShipState(v)}} name="shipping-address-level1" autoComplete="shipping address-level1">
                {US_STATES.map(st=><option key={st} value={st}>{st}</option>)}
              </Sel>
              <div style={ST.f}><label style={ST.lbl}>ZIP Code</label><input type="text" name="shipping-postal-code" autoComplete="shipping postal-code" value={shipAddr.zip} onChange={e=>{
                const z=e.target.value.replace(/[^\d-]/g,"").slice(0,10);
                setShipAddr(p=>({...p,zip:z}));
              }} placeholder="ZIP" maxLength={10} style={ST.inp}/></div>
            </div>
            </form>

            {result&&!result.error?.length&&<>
              <div style={{marginTop:10,padding:mob?"8px 10px":"10px 14px",background:CK.cyanLight,borderRadius:5,border:`1px solid ${CK.cyan}33`}}>
                <div style={{fontSize:10.5,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",color:CK.cyan,marginBottom:2}}>Free Delivery Estimate</div>
                <div style={{fontSize:mob?14:15,fontWeight:700,color:CC.dark}}>{r.shipping?.freeDeliveryDate}</div>
                <div style={{fontSize:mob?10.5:11,color:CC.mid,marginTop:2}}>
                  {r.shipping?.freeDeliveryBizDays} business days
                </div>
                {/* Turnaround breakdown */}
                {r.ti && (() => {
                  const items = [
                    {l:"Base production", d:r.debug?.turnaround?.baseDays},
                    {l:"Paper lead time", d:r.ti.insidePaper + r.ti.coverPaper},
                    {l:"Perfect Binding", d:r.ti.perfectBind},
                    {l:"Outfold", d:r.ti.outfold},
                    {l:"Perforation", d:r.ti.perforation},
                    {l:"Vivid print", d:r.ti.vivid},
                    {l:"Coating", d:r.ti.coating},
                    {l:"Bundling", d:r.ti.bundling},
                    {l:"Round corners", d:r.ti.roundCorner},
                    {l:"Artwork/Design", d:(r.ti.artDesign||0)+(r.ti.artEdits||0)},
                    {l:"Bleed work", d:r.ti.bleed},
                    {l:"Hardcopy proof", d:r.ti.proof},
                  ].filter(x => x.d >= 0.5);
                  if (items.length <= 1) return null;
                  return (
                    <div style={{marginTop:6,paddingTop:6,borderTop:"1px solid #b3dff044",display:"flex",flexWrap:"wrap",gap:"2px 10px",fontSize:10,color:CC.light}}>
                      <span style={{fontWeight:600,color:CC.mid}}>Production {r.shipping?.productionBizDays}d:</span>
                      {items.map((x,i) => <span key={i}>{x.l} {Math.round(x.d)}d{i < items.length-1 ? " ·" : ""}</span>)}
                    </div>
                  );
                })()}
                {/* Production & ship-by dates */}
                <div style={{marginTop:6,paddingTop:6,borderTop:"1px solid #b3dff044",display:"flex",flexWrap:"wrap",gap:"2px 16px",fontSize:10.5}}>
                  <span style={{color:CC.mid}}><span style={{fontWeight:600}}>Production starts:</span> {r.shipping?.productionStartDate}</span>
                  <span style={{color:CC.mid}}><span style={{fontWeight:600}}>Must ship by:</span> {r.shipping?.mustShipDate}</span>
                  <span style={{color: r.shipping?.effectiveTransit < r.shipping?.transitDays ? "#f59e0b" : CC.light}}>
                    ({r.shipping?.effectiveTransit}d {r.shipping?.effectiveTransit < r.shipping?.transitDays ? "overnight" : "ground"} transit)
                  </span>
                </div>
                {!mob&&<div style={{fontSize:10,color:CC.light,marginTop:6,paddingTop:6,borderTop:"1px solid #b3dff044"}}>
                  Earliest possible: <strong style={{color:CC.mid}}>{r.shipping?.earliestDate}</strong> ({r.shipping?.earliestBizDays} business days)
                </div>}
                <div style={{fontSize:mob?9:10,color:CC.light,marginTop:4,...(mob?{paddingTop:4,borderTop:"1px solid #b3dff044"}:{})}}>
                  {mob?<>{r.shipping?.earliestDate} earliest · {r.shipping?.pastCutoff} shop time</>:<>Shop time: {r.shipping?.pastCutoff} ({PCF.shop_timezone.replace("America/","")}) · Cutoff: {PCF.shop_cutoff_hour>12?PCF.shop_cutoff_hour-12:PCF.shop_cutoff_hour}:00 {PCF.shop_cutoff_hour>=12?"PM":"AM"} · Starts: {r.shipping?.shopToday}</>}
                </div>
              </div>

              <div style={ST.f}>
                <label style={ST.lbl}>Select a specific date</label>
                <DatePicker value={needByDate} onChange={v=>{needByTouched.current=true;setNeedByDate(v);}}
                  earliestDate={r.shipping?.earliestYMD} freeDate={r.shipping?.freeDeliveryYMD}/>
                {needByDate&&r.shipping?.needByPast&&<p style={ST.err}>This date has passed — please select a future date</p>}
                {needByDate&&!r.shipping?.needByValid&&!r.shipping?.needByPast&&<p style={ST.err}>Date must be in the future</p>}
              </div>

              {debugUnlocked&&r.shipping?.needByValid&&!r.shipping?.tooSoon&&r.shipping?.rushMultiplier>1&&(
                <div style={{marginTop:10,padding:"10px 14px",background:CK.rushLight,borderRadius:5,border:`1px solid ${CK.rush}55`}}>
                  <div style={{display:"flex",flexDirection:mob?"column":"row",justifyContent:"space-between",alignItems:mob?"flex-start":"baseline",gap:mob?6:0}}>
                    <div>
                      <div style={{fontSize:10.5,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",color:"#6b8f2b",marginBottom:2}}>Rush Surcharge</div>
                      <div style={{fontSize:11,color:CC.mid}}>
                        {r.shipping?.bizDaysToDate} business days vs {r.shipping?.freeDeliveryBizDays} free — {r.shipping?.rushMultiplier.toFixed(2)}×
                      </div>
                    </div>
                    <div style={{fontSize:mob?22:18,fontWeight:800,color:"#6b8f2b"}}>+${r.shipping?.rushCost.toFixed(2)}</div>
                  </div>
                </div>
              )}

              {r.shipping?.needByValid&&!r.shipping?.tooSoon&&r.shipping?.rushMultiplier<=1&&(
                <div style={{marginTop:10,padding:"8px 14px",background:"#e8f5e3",borderRadius:5,border:"1px solid #b5d8a8"}}>
                  <span style={{fontSize:12,color:"#3a7124",fontWeight:600}}>✓ No rush needed — your date is within free delivery window</span>
                </div>
              )}
            </>}
          </Sec>


        {mob && projections && <div style={{...ST.pnl,marginTop:10,marginBottom:100,overflow:"hidden"}}>
          <div style={{padding:"10px 14px",background:"#fafafa",borderBottom:`1px solid ${CC.border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:CC.light}}>Quantity Pricing</div>
            {debugUnlocked&&(
                  <span title="Debug only — marks this table up or down. Does NOT change the order price." style={{display:"inline-flex",alignItems:"center",gap:3,marginLeft:"auto",marginRight:8}}>
                    <span style={{fontSize:9,fontWeight:700,color:CC.light,textTransform:"uppercase",letterSpacing:".4px"}}>Adjust Table</span>
                    <input type="text" inputMode="decimal" value={tableAdjPct} onChange={e=>setTableAdjPct(e.target.value)} placeholder="0"
                      style={{width:46,padding:"2px 5px",fontSize:11,textAlign:"right",border:`1px solid ${(parseFloat(tableAdjPct)||0)!==0?CK.magenta:CC.border}`,borderRadius:4,fontFamily:"inherit",color:CC.dark,background:"#fff",outline:"none"}}/>
                    <span style={{fontSize:10,color:CC.light,fontWeight:600}}>%</span>
                    {(parseFloat(tableAdjPct)||0)!==0&&<span style={{fontSize:9,fontWeight:700,color:CK.magenta,letterSpacing:".3px"}}>{(parseFloat(tableAdjPct)>0?"+":"")+parseFloat(tableAdjPct)}% applied</span>}
                  </span>
                )}
                <button type="button" onClick={copyProjections} title="Copy pricing table" style={{background:"none",border:"none",cursor:"pointer",padding:"2px 6px",fontSize:11,color:projCopied?"#16a34a":CC.light,fontFamily:"inherit",fontWeight:600,transition:"color .2s",letterSpacing:".3px"}}>{projCopied?"✓ Copied":"Copy"}</button>
          </div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11.5}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${CC.border}`}}>
                <th style={{padding:"6px 10px",textAlign:"left",fontSize:9,fontWeight:600,color:CC.light,textTransform:"uppercase"}}>Qty</th>
                <th style={{padding:"6px 4px",textAlign:"right",fontSize:9,fontWeight:600,color:CC.light,textTransform:"uppercase"}}>Unit</th>
                <th style={{padding:"6px 8px",textAlign:"right",fontSize:9,fontWeight:600,color:CC.light,textTransform:"uppercase"}}>Total</th>
              </tr>
            </thead>
            <tbody>
              {projections.map((p,i) => p.total !== null && (
                <tr key={i} style={{borderBottom:`1px solid ${CC.border}22`,background:p.current?"#f0f9ff":"transparent"}}
                  onClick={() => {if(!p.current) upSet(0,{qty:p.qty})}}>
                  <td style={{padding:"5px 10px",fontWeight:p.current?700:400,color:p.current?CK.cyan:CC.dark}}>{p.qty.toLocaleString()}{p.current&&" ●"}</td>
                  <td style={{padding:"5px 4px",textAlign:"right",color:CC.mid}}>${p.perUnit.toFixed(2)}</td>
                  <td style={{padding:"5px 8px",textAlign:"right",fontWeight:p.current?700:500,color:p.current?CK.cyan:CC.dark}}>${p.total.toFixed(0)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>}
        </div>
        {!mob&&<div style={{width:320,flexShrink:0,display:"flex",flexDirection:"column",gap:10}}>
          <SidebarBookPreview sizeLabel={sizeLabel} pages={sets[0]?.pages||0} quantity={sets.reduce((s,x)=>s+(x.qty||0),0)||sets[0]?.qty||0} coverColor={coverColor} coverPaper={coverPaper} insidePaper={insidePaper} coverMode={coverMode} coverArt={coverArt} backCoverArt={backCoverArt} bindEdge={result?.bindingEdge || result?.sz?.bindEdge} onOpenPreview={()=>openPreviewModalRef.current&&openPreviewModalRef.current()}/>
          <Panel result={result} debugUnlocked={debugUnlocked}/>
          {missingDest && <div style={{marginTop:10,fontSize:12,fontWeight:600,color:"#dc2626",lineHeight:1.35}}>{missingDestMsg}</div>}
          <button type="button" onClick={handleAddToOrder} style={{width:"100%",padding:"14px 18px",borderRadius:6,border:"none",background:(result?.error?.length||submitting)?CC.light:CK.cyan,color:"#fff",fontSize:15,fontWeight:700,cursor:(result?.error?.length||submitting)?"default":"pointer",fontFamily:"inherit",opacity:(result?.error?.length||submitting)?.5:1,letterSpacing:".01em",transition:"opacity .15s"}} disabled={!!result?.error?.length||submitting}>{submitting&&uploadProgress?<div><div style={{fontSize:12}}>{uploadProgress.phase==="upload"?`Uploading… ${uploadProgress.pct}%`:"Adding…"}</div><div style={{width:"100%",height:3,borderRadius:2,background:"rgba(255,255,255,.2)",overflow:"hidden",marginTop:4}}><div style={{height:"100%",borderRadius:2,background:"#fff",transition:"width .15s",width:uploadProgress.phase==="upload"?`${((uploadProgress.fileIdx/uploadProgress.fileCount)+(uploadProgress.pct/100/uploadProgress.fileCount))*100}%`:"100%"}}/></div></div>:submitting?"Uploading…":"Add to Order"}</button>
          {projections && <div style={{...ST.pnl,marginTop:10,overflow:"hidden"}}>
            <div style={{padding:"10px 18px",background:"#fafafa",borderBottom:`1px solid ${CC.border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:CC.light}}>Quantity Pricing</div>
              {debugUnlocked&&(
                  <span title="Debug only — marks this table up or down. Does NOT change the order price." style={{display:"inline-flex",alignItems:"center",gap:3,marginLeft:"auto",marginRight:8}}>
                    <span style={{fontSize:9,fontWeight:700,color:CC.light,textTransform:"uppercase",letterSpacing:".4px"}}>Adjust Table</span>
                    <input type="text" inputMode="decimal" value={tableAdjPct} onChange={e=>setTableAdjPct(e.target.value)} placeholder="0"
                      style={{width:46,padding:"2px 5px",fontSize:11,textAlign:"right",border:`1px solid ${(parseFloat(tableAdjPct)||0)!==0?CK.magenta:CC.border}`,borderRadius:4,fontFamily:"inherit",color:CC.dark,background:"#fff",outline:"none"}}/>
                    <span style={{fontSize:10,color:CC.light,fontWeight:600}}>%</span>
                    {(parseFloat(tableAdjPct)||0)!==0&&<span style={{fontSize:9,fontWeight:700,color:CK.magenta,letterSpacing:".3px"}}>{(parseFloat(tableAdjPct)>0?"+":"")+parseFloat(tableAdjPct)}% applied</span>}
                  </span>
                )}
                <button type="button" onClick={copyProjections} title="Copy pricing table" style={{background:"none",border:"none",cursor:"pointer",padding:"2px 6px",fontSize:11,color:projCopied?"#16a34a":CC.light,fontFamily:"inherit",fontWeight:600,transition:"color .2s",letterSpacing:".3px"}}>{projCopied?"✓ Copied":"Copy"}</button>
            </div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{borderBottom:`1px solid ${CC.border}`}}>
                  <th style={{padding:"7px 14px",textAlign:"left",fontSize:9.5,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Qty</th>
                  <th style={{padding:"7px 6px",textAlign:"right",fontSize:9.5,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Unit</th>
                  <th style={{padding:"7px 10px",textAlign:"right",fontSize:9.5,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Total</th>
                </tr>
              </thead>
              <tbody>
                {projections.map((p,i) => p.total !== null && (
                  <tr key={i} style={{borderBottom:`1px solid ${CC.border}22`,background:p.current?"#f0f9ff":"transparent",cursor:p.current?"default":"pointer"}}
                    onClick={() => {if(!p.current) upSet(0,{qty:p.qty})}}>
                    <td style={{padding:"6px 14px",fontWeight:p.current?700:400,color:p.current?CK.cyan:CC.dark}}>
                      {p.qty.toLocaleString()}{p.current&&<span style={{fontSize:9,color:CK.cyan,marginLeft:4}}>●</span>}
                    </td>
                    <td style={{padding:"6px 6px",textAlign:"right",color:CC.mid,fontWeight:500}}>${p.perUnit.toFixed(2)}</td>
                    <td style={{padding:"6px 10px",textAlign:"right",fontWeight:p.current?700:500,color:p.current?CK.cyan:CC.dark}}>${p.total.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                    {/* TEMPORARY saddle-stitch comparison cells */}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>}
          <button type="button" onClick={handleAddToOrder} disabled={!!result?.error?.length||submitting} style={{width:"100%",marginTop:10,padding: submitting && uploadProgress ? "10px 12px 6px" : "12px",borderRadius:6,border:"none",background:(result?.error?.length||submitting)?CC.light:CK.cyan,color:"#fff",fontSize:14,fontWeight:700,cursor:(result?.error?.length||submitting)?"default":"pointer",fontFamily:"inherit",opacity:(result?.error?.length||submitting)?.5:1,transition:"all .2s",overflow:"hidden"}}>
            {submitting && uploadProgress ? (
              <div>
                <div style={{marginBottom:6}}>
                  {uploadProgress.phase === "upload"
                    ? `Uploading${uploadProgress.fileCount > 1 ? ` file ${uploadProgress.fileIdx + 1}/${uploadProgress.fileCount}` : ""}… ${uploadProgress.pct}%`
                    : "Adding to cart…"
                  }
                </div>
                <div style={{width:"100%",height:4,borderRadius:2,background:"rgba(255,255,255,.2)",overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:2,background:"#fff",transition:"width .15s",width: uploadProgress.phase === "upload"
                    ? `${((uploadProgress.fileIdx / uploadProgress.fileCount) + (uploadProgress.pct / 100 / uploadProgress.fileCount)) * 100}%`
                    : "100%"
                  }}/>
                </div>
                {uploadProgress.phase === "upload" && uploadProgress.fileName && (
                  <div style={{fontSize:10,fontWeight:500,opacity:.7,marginTop:3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{uploadProgress.fileName}</div>
                )}
              </div>
            ) : submitting ? "Uploading artwork…" : "Add to Order"}
          </button>
          <button type="button" onClick={handleShareLink} style={{width:"100%",marginTop:8,padding:"8px",borderRadius:4,border:`1px solid ${shareCopied?"#86efac":"#ddd"}`,background:shareCopied?"#f0fdf4":"#fafafa",color:shareCopied?"#16a34a":CC.mid,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",transition:"all .2s"}}>
            {shareCopied ? "✓ Link copied to clipboard" : "Share this configuration"}
          </button>
          {switchTargets.length > 0 && <div style={{display:"flex",gap:6,marginTop:8}}>
            {switchTargets.map(t => <a key={t.type} href={buildSwitchUrl(t.url)} target="_blank" rel="noopener" style={{flex:1,display:"block",padding:"8px 6px",borderRadius:4,border:"1px solid #dbeafe",background:"#eff6ff",color:"#1d4ed8",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textAlign:"center",textDecoration:"none",transition:"all .2s"}}
              onMouseOver={e=>{e.currentTarget.style.background="#dbeafe";e.currentTarget.style.borderColor="#93c5fd"}}
              onMouseOut={e=>{e.currentTarget.style.background="#eff6ff";e.currentTarget.style.borderColor="#dbeafe"}}>
              Try as {t.label} →
            </a>)}
          </div>}
          {debugUnlocked&&<button type="button" onClick={()=>setShowDebug(p=>!p)} style={{width:"100%",marginTop:8,padding:"6px",borderRadius:4,border:`1px solid ${showDebug?"#555":"#ddd"}`,background:showDebug?"#1a1a1a":"#fafafa",color:showDebug?"#888":"#bbb",fontSize:10,fontWeight:600,letterSpacing:".5px",textTransform:"uppercase",cursor:"pointer",fontFamily:"inherit",transition:"all .2s"}}>
            {showDebug?"▼ Hide":"▶ Show"} Debug Panel
          </button>}
          {debugUnlocked&&r.shipping&&r.shipping.estWeightLb>0&&(()=>{queueShipCost(shipZip,shipState,r.shipping.estWeightLb);const _sc=getShipCostEst(shipZip,r.shipping.estWeightLb);return(
            <div style={{marginTop:8,padding:"7px 10px",background:"#1a1a1a",color:"#9fe870",borderRadius:5,fontSize:10.5,fontFamily:"monospace",lineHeight:1.5}}>
              SHIP EST (internal) · ~{r.shipping.estWeightLb} lb · {r.shipping.estCartons} carton{r.shipping.estCartons>1?"s":""}
              {_sc?(" · UPS Ground $"+_sc.amount.toFixed(2)+(_sc.parcels>1?" ("+_sc.parcels+" pkg)":"")):(String(shipZip||"").replace(/[^0-9]/g,"").length>=5?" · rate…":" · enter ZIP for rate")}
            </div>
          );})()}
          {debugUnlocked&&showDebug&&<DebugPanel debug={result?.debug}/>}
          {debugUnlocked && showDebug && schemaData && (
            <div style={{...ST.pnl, marginTop:10}}>
              <div style={{padding:"10px 16px",background:"#1a1a1a",borderBottom:"1px solid #333",display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",color:"#888"}}>🔍 SEO Schema</span>
                <span style={{fontSize:9,color:schemaData.injectedByPHP?"#4ade80":"#f59e0b",fontStyle:"italic"}}>
                  {schemaData.injectedByPHP ? "Injected by PHP plugin (production)" : "Standalone mode — schemas injected by PHP in production"}
                </span>
              </div>
              <div style={{padding:"10px 16px",fontSize:11}}>
                <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#999",padding:"4px 0 3px",borderBottom:"1px solid #eee"}}>Product Data (live from calculator)</div>
                <div style={{display:"grid",gridTemplateColumns:"140px 1fr",gap:"2px 8px",padding:"6px 0"}}>
                  {[
                    ["Name", schemaData.product.name],
                    ["Price", `$${schemaData.product.lowPrice}`],
                    ["Per Unit", `$${schemaData.product.perUnit}`],
                    ["Availability", schemaData.product.availability],
                    ["Size", schemaData.product.size],
                    ["Pages", schemaData.product.pages],
                    ["Quantity", schemaData.product.quantity],
                    ["Paper (inside)", schemaData.product.paper],
                    ["Paper (cover)", schemaData.product.coverPaper],
                    ["Color", schemaData.product.color],
                    ["Turnaround", schemaData.product.turnaround],
                    ["Production Start", schemaData.product.productionStart || "—"],
                    ["Delivery Est.", schemaData.product.delivery || "—"],
                  ].map(([k,v],i) => (
                    <React.Fragment key={i}>
                      <span style={{fontSize:10,color:"#888"}}>{k}</span>
                      <span style={{fontSize:10,color:CK.cyan,fontFamily:"'SF Mono','Consolas',monospace",fontWeight:500}}>{v}</span>
                    </React.Fragment>
                  ))}
                </div>
                <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#999",padding:"8px 0 3px",borderBottom:"1px solid #eee",marginTop:4}}>PHP-Injected Schemas (via wp_head)</div>
                <div style={{display:"grid",gridTemplateColumns:"140px 1fr",gap:"2px 8px",padding:"6px 0"}}>
                  {[
                    ["Product", "AggregateOffer with live pricing from WooCommerce product"],
                    ["LocalBusiness", "Priority Print Service — address, hours, geo, service area"],
                    ["FAQPage", "7 questions — binding, pages, paper, turnaround, sizes, bleeds, finishing"],
                    ["WebApplication", "Calculator tool identification for search engines"],
                    ["Noscript fallback", "Static HTML content for crawlers that don't render JS"],
                    ["llms.txt", "AI search engine content descriptor at /llms.txt"],
                  ].map(([k,v],i) => (
                    <React.Fragment key={i}>
                      <span style={{fontSize:10,color:"#888",fontWeight:600}}>{k}</span>
                      <span style={{fontSize:10,color:schemaData.injectedByPHP?"#4ade80":"#f59e0b"}}>{schemaData.injectedByPHP ? "✓ " : "○ "}{v}</span>
                    </React.Fragment>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>}
      </div>

      {/* Fixed bottom bar — mobile */}
      {mob&&<>
        {debugUnlocked&&showDebug&&<div style={{position:"fixed",bottom:76,left:0,right:0,zIndex:9989,maxHeight:"60vh",overflowY:"auto",background:CC.white,borderTop:`1px solid ${CC.border}`,boxShadow:"0 -4px 16px rgba(0,0,0,.12)",padding:"0 10px 10px",paddingBottom:"env(safe-area-inset-bottom)"}}>
          <DebugPanel debug={result?.debug}/>
          {schemaData && (
            <div style={{...ST.pnl, marginTop:10}}>
              <div style={{padding:"10px 16px",background:"#1a1a1a",borderBottom:"1px solid #333",display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",color:"#888"}}>🔍 SEO Schema</span>
              </div>
              <div style={{padding:"10px 16px",fontSize:11}}>
                <div style={{display:"grid",gridTemplateColumns:"120px 1fr",gap:"2px 8px",padding:"4px 0"}}>
                  {[["Price", `$${schemaData.product.lowPrice}`],["Per Unit", `$${schemaData.product.perUnit}`],["Pages", schemaData.product.pages],["Turnaround", schemaData.product.turnaround]].map(([k,v],i) => (
                    <React.Fragment key={i}>
                      <span style={{fontSize:10,color:"#888"}}>{k}</span>
                      <span style={{fontSize:10,color:CK.cyan,fontFamily:"'SF Mono','Consolas',monospace",fontWeight:500}}>{v}</span>
                    </React.Fragment>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>}
        <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:9990,background:CC.white,borderTop:`1px solid ${CC.border}`,boxShadow:"0 -4px 16px rgba(0,0,0,.08)",padding:"8px 10px",paddingBottom:"max(8px, env(safe-area-inset-bottom))"}}>
        <div style={{display:"flex",flexDirection:mobExpanded?"column":"row",alignItems:mobExpanded?"stretch":"center",gap:10}}>
          <div style={{flex:mobExpanded?undefined:1,minWidth:0}}>
            <Panel result={result} compact expanded={mobExpanded} onToggleExpand={()=>setMobExpanded(p=>!p)}/>
            {debugUnlocked&&<div style={{fontSize:8,textAlign:"center",color:showDebug?CK.cyan:CC.light,marginTop:2,letterSpacing:".5px",textTransform:"uppercase",fontWeight:600,cursor:"pointer"}} onClick={()=>setShowDebug(p=>!p)}>{showDebug?"▼ Hide Debug":"▲ Debug"}</div>}
          </div>
          <button type="button" onClick={handleAddToOrder} style={{flexShrink:0,padding:"12px 18px",borderRadius:6,border:"none",background:(result?.error?.length||submitting)?CC.light:CK.cyan,color:"#fff",fontSize:14,fontWeight:700,cursor:(result?.error?.length||submitting)?"default":"pointer",fontFamily:"inherit",opacity:(result?.error?.length||submitting)?.5:1,whiteSpace:"nowrap",minWidth:submitting&&uploadProgress?140:undefined,width:mobExpanded?"100%":undefined}}
            disabled={!!result?.error?.length||submitting}>
            {submitting && uploadProgress ? (
              <div>
                <div style={{fontSize:12}}>{uploadProgress.phase === "upload" ? `Uploading… ${uploadProgress.pct}%` : "Adding…"}</div>
                <div style={{width:"100%",height:3,borderRadius:2,background:"rgba(255,255,255,.2)",overflow:"hidden",marginTop:4}}>
                  <div style={{height:"100%",borderRadius:2,background:"#fff",transition:"width .15s",width: uploadProgress.phase === "upload"
                    ? `${((uploadProgress.fileIdx / uploadProgress.fileCount) + (uploadProgress.pct / 100 / uploadProgress.fileCount)) * 100}%`
                    : "100%"
                  }}/>
                </div>
              </div>
            ) : submitting ? "Uploading…" : "Add to Order"}
          </button>
        </div>
      </div>
      </>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// STYLES
// ═══════════════════════════════════════════════════════════════
const ST = {
  f:{marginTop:10},
  lbl:{display:"block",fontSize:13,fontWeight:600,color:CC.mid,marginBottom:5},
  sel:{width:"100%",padding:"10px 32px 10px 12px",borderRadius:6,border:`1px solid ${CC.border}`,background:"linear-gradient(180deg, #fff 0%, #f9f9fa 100%)",fontSize:15,color:CC.dark,fontFamily:"inherit",appearance:"none",cursor:"pointer",outline:"none",boxShadow:"0 1px 3px rgba(0,0,0,.04)"},
  selA:{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:CC.light,pointerEvents:"none"},
  inp:{width:"100%",padding:"10px 12px",borderRadius:6,border:`1px solid ${CC.border}`,background:"linear-gradient(180deg, #fff 0%, #f9f9fa 100%)",fontSize:15,color:CC.dark,fontFamily:"inherit",outline:"none",boxSizing:"border-box",boxShadow:"0 1px 3px rgba(0,0,0,.04)"},
  pills:{display:"flex",borderRadius:6,border:`1px solid ${CC.border}`,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.06)"},
  pill:{flex:1,padding:"9px 10px",fontSize:14,fontWeight:500,fontFamily:"inherit",border:"none",borderRight:`1px solid ${CC.border}`,background:`linear-gradient(180deg, #fff 0%, #f7f7f8 100%)`,color:"#555",cursor:"pointer",transition:"all .15s",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"inset 0 1px 0 rgba(255,255,255,.8), inset 0 -1px 0 rgba(0,0,0,.04)"},
  pillOn:{background:`linear-gradient(135deg, ${CK.cyan} 0%, #0070e6 40%, #3d9cff 50%, #0070e6 60%, #005cc8 100%)`,color:"#fff",fontWeight:600,boxShadow:"inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(0,0,0,.15), 0 1px 3px rgba(0,126,255,.2)"},
  row2:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12},
  row3:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12},
  hr:{height:1,background:"#eee",margin:"14px 0 4px"},
  setBox:{marginTop:10,padding:12,borderRadius:4,background:"#fafafa",border:"1px solid #eee"},
  addBtn:{width:"100%",marginTop:10,padding:"10px",borderRadius:4,border:`1px dashed ${CK.cyan}`,background:CC.white,color:CK.cyan,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"},
  err:{color:CC.red,fontSize:13,margin:"8px 0 0",padding:"8px 10px",background:"#fef2f2",borderRadius:4,border:"1px solid #f5cccc"},
  note:{fontSize:12,color:CC.light,margin:"4px 0 0"},
  card:{background:CC.white,borderRadius:6,border:`1px solid ${CC.border}`,borderLeft:`3px solid ${CC.primary}`,overflow:"hidden"},
  cardH:{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 18px",background:"#fafafa",border:"none",borderBottom:"1px solid #eee",cursor:"pointer",fontFamily:"inherit",fontSize:15},
  pnl:{background:CC.white,borderRadius:6,border:`1px solid ${CC.border}`,overflow:"hidden"},
};

// Mount
ReactDOM.createRoot(document.getElementById('pps-calculator-root'))
  .render(React.createElement(App));

})();
</script>
</body>
</html>
