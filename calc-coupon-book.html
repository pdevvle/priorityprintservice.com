<script>
/* pdf.js 4.x ships as ES modules only, so the classic-script global is gone. This
   loader dynamic-imports it at parse time -- the fetch is warm before anyone can pick a
   file -- and publishes it at window.pdfjsLib, the name every use site already resolves.
   Use sites await window.__ppsPdfJs first, so a slow network delays the first upload
   instead of breaking it.
   Why 4.x at all: 3.11.174 silently dropped an entire transparency group from a
   customer PDF -- the proof rendered without a block the press would print. 4.10.38 is
   pinned because it is the version verified against that file. The legacy build is
   deliberate: customers proof on phones whose Safari the modern build has dropped.
   Two mirrors, both exact npm layouts, full prefixes as literals so the offline test
   harness can string-replace them with vendored copies. */
(function () {
  var MIRRORS = [
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/",
    "https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/"
  ];
  function attempt(i) {
    if (i >= MIRRORS.length) return Promise.reject(new Error("pdf.js could not be loaded from any CDN"));
    return import(MIRRORS[i] + "pdf.min.mjs").then(function (m) {
      m.GlobalWorkerOptions.workerSrc = MIRRORS[i] + "pdf.worker.min.mjs";
      window.pdfjsLib = m;
      return m;
    }, function () { return attempt(i + 1); });
  }
  window.__ppsPdfJs = attempt(0);
  window.__ppsPdfJs.catch(function (e) { console.error("[pps]", e); });
})();

/* Preflight, not gatekeeping: names the constructs in an uploaded PDF that a browser
   preview is known to fumble -- pdf.js is a viewer, not a prepress RIP, and
   transparency is exactly where the two part company. Reads the operator lists the
   renderer builds anyway (they are cached and reused by the page renders that follow),
   so the scan costs almost nothing. Never throws: a preflight that can break an upload
   is worse than no preflight. Results accumulate in window.PPS_PDF_RISKS keyed by
   upload slot; the proof modal renders the union. */
window.PPS_PDF_RISKS = {};
window.ppsPdfRisks = function () {
  var o = window.PPS_PDF_RISKS, out = [], k, i, r;
  for (k in o) { r = o[k] || []; for (i = 0; i < r.length; i++) if (out.indexOf(r[i]) < 0) out.push(r[i]); }
  return out;
};
window.ppsAnalyzePdfRisks = async function (doc) {
  var risks = [];
  var add = function (x) { if (risks.indexOf(x) < 0) risks.push(x); };
  try {
    var OPS = window.pdfjsLib.OPS;
    var limit = Math.min(doc.numPages, 40);   // enough pages to decide; bounded on purpose
    for (var i = 1; i <= limit; i++) {
      var pg = await doc.getPage(i);
      var list = await pg.getOperatorList();
      for (var k = 0; k < list.fnArray.length; k++) {
        var f = list.fnArray[k], a = list.argsArray[k];
        if (f === OPS.beginGroup) add("transparency groups");
        else if (f === OPS.shadingFill) add("gradients");
        else if (f === OPS.setGState && a && Array.isArray(a[0])) {
          for (var e = 0; e < a[0].length; e++) {
            var ent = a[0][e]; if (!Array.isArray(ent)) continue;
            var key = ent[0], val = ent[1];
            if (key === "SMask" && val) add("soft masks");
            else if (key === "BM" && val && !/^(Normal|Compatible|source-over)$/i.test(String(val && val.name || val))) add("blend modes");
            else if ((key === "ca" || key === "CA") && val > 0 && val < 1) add("partial transparency");
          }
        } else if (f === OPS.setFont && a && typeof a[0] === "string") {
          try {
            var fnt = pg.commonObjs.get(a[0]);
            // The standard-14 faces are never embedded by design and substitute the
            // same way in every renderer; flagging them would banner every quick-tool
            // PDF and teach people to ignore the warning.
            if (fnt && fnt.missingFile && !/^(Helvetica|Times|Courier|Arial|Symbol|ZapfDingbats)/i.test(String(fnt.name || ""))) add("non-embedded fonts");
          } catch (e2) {}
        }
      }
      if (risks.length >= 4) break;
    }
  } catch (e3) {}
  return risks;
};
</script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 0; }
  /* 3D Book Preview Styles */
  .bp-viewport{width:100%;height:200px;perspective:1200px;display:flex;align-items:center;justify-content:center;cursor:grab;overflow:hidden;border-radius:8px;background:linear-gradient(135deg,#1a1d23,#2a2e36);border:1px solid rgba(255,255,255,.08);position:relative;transition:border-color .2s}
  .bp-viewport:not(.expanded):hover{border-color:rgba(0,126,255,.3)}
  .bp-expand-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;opacity:0;background:rgba(0,0,0,.55);transition:opacity .25s;z-index:2;border-radius:7px;pointer-events:none}
  .bp-clickable:hover .bp-expand-overlay{opacity:1}
  .bp-viewport:active{cursor:grabbing}
  .bp-viewport.expanded{height:420px;border-radius:12px}
  .bp-scene{transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,0,.2,1)}
  .bp-closed{position:relative;transform-style:preserve-3d}
  .bp-face{position:absolute;background-position:center;background-repeat:no-repeat;backface-visibility:hidden;image-rendering:auto;overflow:hidden}
  .bp-face.front{transform:translateZ(var(--half-depth,1px))}
  .bp-face.back{transform:rotateY(180deg) translateZ(var(--half-depth,1px))}
  .bp-face.spine{transform:rotateY(-90deg) translateX(calc(var(--half-depth,1px) * -1));transform-origin:left center;background:linear-gradient(90deg,rgba(0,0,0,.15),#555,rgba(0,0,0,.15))}
  .bp-face.top-edge{transform:rotateX(90deg) translateY(calc(var(--half-depth,1px) * -1));transform-origin:top center;background:linear-gradient(180deg,#f5f0e8,#e8e0d4,#f0ebe3)}
  .bp-face.bottom-edge{transform:rotateX(-90deg) translateY(var(--half-depth,1px));transform-origin:bottom center;background:linear-gradient(180deg,#f5f0e8,#e8e0d4,#f0ebe3)}
  .bp-face.fore-edge{right:0;transform:rotateY(90deg) translateX(var(--half-depth,1px));transform-origin:right center;background:linear-gradient(180deg,#f5f0e8,#e8e0d4,#f0ebe3)}
  /* Open book */
  .bp-open{position:relative;transform-style:preserve-3d;display:none}
  .bp-open .bp-page{position:absolute;top:0;background:#f8f5f0;overflow:hidden;backface-visibility:hidden}
  .bp-open .bp-page.left{border-radius:4px 0 0 4px}
  .bp-open .bp-page.right{border-radius:0 4px 4px 0}
  .bp-page img{width:100%;height:100%;display:block}
  .bp-page-num{position:absolute;bottom:6px;font-size:9px;color:rgba(0,0,0,.3);font-family:var(--pps-sans)}
  .bp-page.left .bp-page-num{right:8px}
  .bp-page.right .bp-page-num{left:8px}
  .bp-shadow-l{position:absolute;top:0;right:0;width:30px;height:100%;background:linear-gradient(to left,rgba(0,0,0,.12),transparent);pointer-events:none}
  .bp-shadow-r{position:absolute;top:0;left:0;width:30px;height:100%;background:linear-gradient(to right,rgba(0,0,0,.08),transparent);pointer-events:none}
  .bp-spine-shadow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:16px;height:100%;background:radial-gradient(ellipse at center,rgba(0,0,0,.2),transparent 70%);pointer-events:none;z-index:10}
  /* Page turn animation */
  .bp-turning{position:absolute;top:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.15,1);z-index:20}
  .bp-turning .turn-front,.bp-turning .turn-back{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;overflow:hidden}
  .bp-turning .turn-back{transform:rotateY(180deg)}
  .bp-turning.flip-right{transform-origin:left center;transform:rotateY(0deg)}
  .bp-turning.flip-right.flipped{transform:rotateY(-180deg)}
  .bp-turning.flip-left{transform-origin:right center;transform:rotateY(0deg)}
  .bp-turning.flip-left.flipped{transform:rotateY(180deg)}
  /* Upload zone */
  .bp-dropzone{border:2px dashed rgba(0,126,255,.3);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .25s;background:rgba(0,126,255,.03);position:relative}
  .bp-dropzone:hover{border-color:rgba(0,126,255,.6);background:rgba(0,126,255,.06)}
  .bp-dropzone.has-file{border-style:solid;border-color:rgba(0,126,255,.4);background:rgba(0,126,255,.05)}
  .bp-dropzone.drag-active{border-color:#007eff;background:rgba(0,126,255,.1);box-shadow:0 0 0 3px rgba(0,126,255,.15)}
  .bp-dropzone input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0)}
  /* Thumbstrip */
  .bp-thumbs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:thin}
  .bp-thumbs::-webkit-scrollbar{height:4px}
  .bp-thumbs::-webkit-scrollbar-thumb{background:var(--bp-line);border-radius:99px}
  .bp-thumb{flex-shrink:0;text-align:center}
  .bp-thumb img{height:44px;border-radius:6px;box-shadow:0 1px 3px rgba(16,24,40,.14);border:1px solid var(--bp-line)}
  .bp-thumb span{display:block;font-size:8.5px;color:var(--bp-faint);margin-top:3px}
  /* ── Modal chrome ──────────────────────────────────────────────────────────
     The proof and 3D preview modals used to be their own dark-only surface with
     white-on-black controls hardcoded inline. They now share the calculator's
     surface, ink and hairline tokens through these variables, so both modals sit
     in the modern skin and follow the light/dark toggle with everything else.
     Set here rather than from CC so plain CSS rules can reach them too. */
  :root{
    --bp-surface:#fff; --bp-surface-2:#f6f7f9; --bp-line:#e3e8ef;
    --bp-ink:#0f172a; --bp-dim:#475569; --bp-faint:#94a3b8;
    --bp-btn:#f1f4f8; --bp-scrim:rgba(15,23,42,.55);
  }
  :root[data-pps-theme="dark"]{
    --bp-surface:#161b22; --bp-surface-2:#0f151d; --bp-line:#2a3340;
    --bp-ink:#e6edf6; --bp-dim:#9fb0c6; --bp-faint:#7183a0;
    --bp-btn:#0f151d; --bp-scrim:rgba(2,6,12,.66);
  }
  /* The coupon's modal contents are authored in the dark design (hardcoded
     white text/controls). Pin the modal's token scope to the dark palette in
     every page theme so the shell always matches its contents — the light
     shell rendered the title, close button and toggles white-on-white. */
  .bp-modal-bg{
    --bp-surface:#161b22; --bp-surface-2:#0f151d; --bp-line:#2a3340;
    --bp-ink:#e6edf6; --bp-dim:#9fb0c6; --bp-faint:#7183a0;
    --bp-btn:#0f151d; --bp-scrim:rgba(2,6,12,.66);
  }
  .bp-modal-bg{position:fixed;inset:0;background:var(--bp-scrim);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
  .bp-modal{background:var(--bp-surface);border:1px solid var(--bp-line);border-radius:16px;width:90%;max-width:940px;max-height:90vh;display:flex;flex-direction:column;overflow:visible;box-shadow:0 4px 6px rgba(16,24,40,.06), 0 24px 64px rgba(16,24,40,.28)}
  .bp-modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bp-line);flex-shrink:0;overflow:visible;border-radius:16px 16px 0 0;background:var(--bp-surface)}
  .bp-modal-body{padding:16px 20px;overflow-y:auto;flex:1;min-height:0;border-radius:0 0 16px 16px;background:var(--bp-surface-2)}
  .bp-modal-title{font-family:var(--pps-display);font-weight:650;letter-spacing:-0.01em;color:var(--bp-ink)}
  .bp-mode-btn{background:var(--bp-btn);border:1px solid var(--bp-line);color:var(--bp-dim);padding:7px 18px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:all .2s;font-family:inherit}
  .bp-mode-btn:hover{background:rgba(0,126,255,.1);border-color:#007eff;color:#007eff}
  .bp-mode-btn.on{background:#007eff;border-color:#007eff;color:#fff;box-shadow:0 2px 10px rgba(0,126,255,.3)}
  .bp-nav-btn{background:var(--bp-btn);border:1px solid var(--bp-line);color:var(--bp-dim);width:36px;height:36px;min-width:36px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit;flex-shrink:0;box-sizing:border-box}
  .bp-nav-btn:hover:not(:disabled){background:rgba(0,126,255,.12);border-color:#007eff;color:#007eff}
  .bp-nav-btn:disabled{opacity:.25;cursor:not-allowed}
  /* Segmented control, matching the form's Pil: inset track with a rounded thumb
     rather than butted-together buttons, so the modals read as the same system. */
  .bp-seg{display:flex;gap:3;padding:3px;border-radius:10px;border:1px solid var(--bp-line);
    background:var(--bp-btn);box-shadow:inset 0 1px 2px rgba(16,24,40,.04)}
  .bp-seg-btn{padding:6px 14px;border:none;border-radius:7px;background:transparent;color:var(--bp-dim);
    font-size:11.5px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);
    display:flex;align-items:center;justify-content:center;gap:5px}
  .bp-seg-btn:hover:not(.on){color:#007eff}
  .bp-seg-btn.on{background:#007eff;color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,126,255,.35)}
  /* View settings popover — guides, zoom and the loupe now live behind a gear so the
     page-nav row has room for the page label instead of six competing controls. */
  .bp-viewmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:70;min-width:236px;padding:8px;
    background:var(--bp-surface);border:1px solid var(--bp-line);border-radius:12px;
    box-shadow:0 4px 6px rgba(16,24,40,.06), 0 12px 28px rgba(16,24,40,.18)}
  .bp-viewmenu-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px;border-radius:8px}
  .bp-viewmenu-row + .bp-viewmenu-row{border-top:1px solid var(--bp-line)}
  .bp-viewmenu-label{font-size:12px;font-weight:600;color:var(--bp-ink)}
  /* Transparency checker (Photoshop-style) — used as background where art doesn't cover */
  .bp-checker{
    background-color:#3a3e46;
    background-image:
      linear-gradient(45deg,#2a2e36 25%,transparent 25%),
      linear-gradient(-45deg,#2a2e36 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#2a2e36 75%),
      linear-gradient(-45deg,transparent 75%,#2a2e36 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0;
  }
  /* Approve Now CTA — strong call-to-action when art needs approval */
  /* Approve artwork — the primary action in the proof modal.
     It used to be a red five-stop gloss with a hard red pulse, welded to the two
     proof-type buttons inside a red 2px frame. Three alarm signals stacked on the
     one control we actually want pressed, and red reads as "something is wrong"
     rather than "confirm". It is now the same flat brand CTA as Add to Order, with
     one soft brand ring to keep the nudge, and it turns green once approved. */
  @keyframes bp-approve-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(0,126,255,.42),0 2px 10px rgba(0,126,255,.32)}
    50%{box-shadow:0 0 0 7px rgba(0,126,255,0),0 2px 10px rgba(0,126,255,.32)}
  }
  /* A light sweep travels across the button on a loop. It is the one control in the
     modal we want pressed, and flat blue read as just another button beside the proof
     picker. The gradient is oversized and its position animated, so nothing paints
     outside the button and there is no overlay element to sit above the label. */
  @keyframes bp-approve-shimmer{
    from{background-position:150% 0}
    to{background-position:-50% 0}
  }
  .bp-approve{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 23px;border:none;border-radius:10px;cursor:pointer;font-family:inherit;
    font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;white-space:nowrap;
    background:linear-gradient(105deg,#0062cc 0%,#007eff 34%,#8ccbff 50%,#007eff 66%,#0062cc 100%);
    background-size:300% 100%;
    animation:bp-approve-shimmer 2.9s linear infinite;
    box-shadow:0 3px 14px rgba(0,126,255,.4);
    transition:transform .15s ease,box-shadow .15s ease}
  /* Nudge adds the expanding ring on top of the sweep; both run together. */
  .bp-approve.nudge{animation:bp-approve-shimmer 2.9s linear infinite,
    bp-approve-pulse 2.4s ease-in-out infinite}
  /* Hover drops the ring but keeps the sweep — killing all animation on hover made the
     button look dead exactly when someone was about to press it. */
  .bp-approve:hover:not(:disabled){transform:translateY(-1px);
    box-shadow:0 8px 22px rgba(0,126,255,.5);
    animation:bp-approve-shimmer 1.5s linear infinite}
  .bp-approve:active:not(:disabled){transform:translateY(0);box-shadow:0 2px 8px rgba(0,126,255,.4)}
  /* Generating: a frozen gradient would strand a pale band mid-button, so go flat. */
  .bp-approve:disabled{cursor:wait;animation:none;background:#0062cc;filter:saturate(.7)}
  /* The global reduced-motion rule only shortens durations, which would freeze the
     sweep at whatever position it stopped on. Give it a flat brand fill instead. */
  @media (prefers-reduced-motion: reduce){
    .bp-approve,.bp-approve.nudge,.bp-approve:hover:not(:disabled){
      background:#007eff;background-size:auto;animation:none}
  }
  /* Done state: a status, not a button — flat green, no lift, no pointer. */
  .bp-approved{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;
    background:#16a34a;color:#fff;font-size:13px;font-weight:700;letter-spacing:.01em;white-space:nowrap;
    box-shadow:0 2px 10px rgba(22,163,74,.28)}
  .bp-prooflabel{font-size:10px;font-weight:700;color:var(--bp-dim);letter-spacing:.08em;
    text-transform:uppercase;flex-shrink:0}

  /* Primary CTA — lifts on hover so it reads as the one thing to press. */
  [data-pps-cta]:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 7px 20px rgba(0,126,255,.48) !important}
  [data-pps-cta]:active:not(:disabled){transform:translateY(0);box-shadow:0 3px 10px rgba(0,126,255,.4) !important}

  /* ===== MODERN DRAFT — typography =====
     Montserrat for display, Work Sans for UI and body, matching the site. The
     fallbacks are the stack this page used previously, so a blocked or slow font
     request degrades to the old look rather than to Times. */
  :root{
    --pps-display:'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif;
    --pps-sans:'Work Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;
  }
  body{font-family:var(--pps-sans)}

  /* ===== MODERN DRAFT — motion ===== */
  /* Select "pop" on choose. Two identical animations under different names so the
     same element can re-trigger without being remounted — remounting a <select>
     would drop focus and break keyboard use. */
  @keyframes pps-pop-0{0%{transform:scale(1)}38%{transform:scale(1.022)}100%{transform:scale(1)}}
  @keyframes pps-pop-1{0%{transform:scale(1)}38%{transform:scale(1.022)}100%{transform:scale(1)}}
  /* Condensed desktop total sliding up as the price card leaves the viewport. */
  @keyframes pps-mini-in{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  /* Editable job title in a section header: invisible at rest so the header reads as a
     heading, a real field the moment it is hovered or focused. The placeholder has to
     announce itself, since there is no label and no box to hint that it is editable. */
  /* Job name reads as one of the header's summary pills — same chip shape, background
     and hairline — so it belongs to the heading rather than looking like a form field
     wedged into it. Hover/focus deepen it just enough to say it is editable. */
  .pps-jobtitle{transition:background .15s ease, border-color .15s ease, box-shadow .15s ease}
  .pps-jobtitle::placeholder{color:#94a3b8;font-weight:600;opacity:1}
  .pps-jobtitle:hover:not(:focus){border-color:#cbd5e1 !important}
  .pps-jobtitle:focus{background:#fff}
  :root[data-pps-theme="dark"] .pps-jobtitle::placeholder{color:#7183a0}
  :root[data-pps-theme="dark"] .pps-jobtitle:hover:not(:focus){border-color:#3b4757 !important}
  :root[data-pps-theme="dark"] .pps-jobtitle:focus{background:#0f151d}
  /* Anyone who has asked their OS to reduce motion gets none of it. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;transition-delay:0s !important;animation-delay:0s !important}
  }

  /* ===== MODERN DRAFT — interaction states & page field ===== */
  body{background:#f6f7f9}
  /* ── Dark mode. Most surfaces repaint via the CC/ST swap; these are the ones
        inline styles can't reach: the page field, native select popups, and the
        handful of hardcoded #fafafa chrome bars (React emits them as rgb()). ── */
  html[data-pps-theme="dark"] body{background:#0d1117;color:#e6edf6}
  html[data-pps-theme="dark"] option{background:#161b22;color:#e6edf6}
  html[data-pps-theme="dark"] input::placeholder,html[data-pps-theme="dark"] textarea::placeholder{color:#5b6b83}
  html[data-pps-theme="dark"] [style*="rgb(250, 250, 250)"]{background:#1a212b !important}
  /* Status tints (error / warning / success banners) are pale by construction and
     stay bright on a dark page. Their ink lives on child spans with its own inline
     color, so each family remaps the container AND its descendants. Matching on the
     rgb() React emits catches every site, including ones not enumerated by hand. */
  html[data-pps-theme="dark"] [style*="rgb(254, 242, 242)"],
  html[data-pps-theme="dark"] [style*="rgb(254, 226, 226)"]{background:#2a1416 !important;border-color:#5b2b2f !important}
  /* ...but NOT the controls inside them. A tinted box that wraps buttons (the Proof /
     Preview pair sits in the red "approval required" box) is a container, not a banner:
