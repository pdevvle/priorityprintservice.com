   loader dynamic-imports it at parse time -- the fetch is warm before anyone can pick a
   file -- and publishes it at window.pdfjsLib, the name every use site already resolves.
   Use sites await window.__ppsPdfJs first, so a slow network delays the first upload
   instead of breaking it.

   customer PDF -- the proof rendered without a block the press would print. 4.10.38 is
   pinned because it is the version verified against that file. The legacy build is
   deliberate: customers proof on phones whose Safari the modern build has dropped.
   Two mirrors, both exact npm layouts, full prefixes as literals so the offline test
   harness can string-replace them with vendored copies. */

    "https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/"

    if (i >= MIRRORS.length) return Promise.reject(new Error("pdf.js could not be loaded from any CDN"));

      m.GlobalWorkerOptions.workerSrc = MIRRORS[i] + "pdf.worker.min.mjs";
      window.pdfjsLib = m;

/* Preflight, not gatekeeping: names the constructs in an uploaded PDF that a browser
   preview is known to fumble -- pdf.js is a viewer, not a prepress RIP, and
   transparency is exactly where the two part company. Reads the operator lists the
   renderer builds anyway (they are cached and reused by the page renders that follow),
   so the scan costs almost nothing. Never throws: a preflight that can break an upload
   is worse than no preflight. Results accumulate in window.PPS_PDF_RISKS keyed by
   upload slot; the proof modal renders the union. */

  for (k in o) { r = o[k] || []; for (i = 0; i < r.length; i++) if (out.indexOf(r[i]) < 0) out.push(r[i]); }
  return out;
};

  var risks = [];
  var add = function (x) { if (risks.indexOf(x) < 0) risks.push(x); };
  try {
    var OPS = window.pdfjsLib.OPS;
    var limit = Math.min(doc.numPages, 40);   // enough pages to decide; bounded on purpose

      var pg = await doc.getPage(i);
      var list = await pg.getOperatorList();

        var f = list.fnArray[k], a = list.argsArray[k];

            var ent = a[0][e]; if (!Array.isArray(ent)) continue;
            var key = ent[0], val = ent[1];
            if (key === "SMask" && val) add("soft masks");
            else if (key === "BM" && val && !/^(Normal|Compatible|source-over)$/i.test(String(val && val.name || val))) add("blend modes");
            else if ((key === "ca" || key === "CA") && val > 0 && val < 1) add("partial transparency");
          }

          try {
            var fnt = pg.commonObjs.get(a[0]);
            // The standard-14 faces are never embedded by design and substitute the
            // same way in every renderer; flagging them would banner every quick-tool
            // PDF and teach people to ignore the warning.
            if (fnt && fnt.missingFile && !/^(Helvetica|Times|Courier|Arial|Symbol|ZapfDingbats)/i.test(String(fnt.name || ""))) add("non-embedded fonts");
          } catch (e2) {}
        }
      }

    }
  } catch (e3) {}
  return risks;
};

// Check if a date is a business day (M-F, not a closure)
function isBusinessDay(d) {
  const dow = d.getDay(); // 0=Sun, 6=Sat
  if (dow === 0 || dow === 6) return false;
  const mmdd = String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const ymd = d.toISOString().split("T")[0];
  for (const c of SHOP_CLOSURES) {
    if (c === mmdd || c === ymd) return false;
  }
  return true;
}

// Add N business days to a date, returning the landing date
function addBusinessDays(start, n) {
  const d = new Date(start);
  let added = 0;
  while (added < n) {
    d.setDate(d.getDate() + 1);
    if (isBusinessDay(d)) added++;
  }
  return d;
}

// Count business days between two dates (exclusive of start, inclusive of end)
function businessDaysBetween(a, b) {
  let count = 0;
  const d = new Date(a);
  while (d < b) {
    d.setDate(d.getDate() + 1);
    if (isBusinessDay(d)) count++;
  }
  return count;
}

// Get "today" in shop timezone, respecting cutoff hour.
// After cutoff, production start = next business day.
function getShopToday() {
  const now = new Date();
  const shopStr = now.toLocaleString("en-US", { timeZone: PCF.shop_timezone });
  const shopNow = new Date(shopStr);
  const shopHour = shopNow.getHours();
  
  const ymd = now.toLocaleDateString("en-CA", { timeZone: PCF.shop_timezone });
  let todayDate = new Date(ymd + "T00:00:00");
  
  // If past cutoff OR today isn't a business day, advance to next business day
  if (shopHour >= PCF.shop_cutoff_hour || !isBusinessDay(todayDate)) {
    todayDate.setDate(todayDate.getDate() + 1);
    while (!isBusinessDay(todayDate)) {
      todayDate.setDate(todayDate.getDate() + 1);
    }
  }
  return todayDate;
}

function fmtDate(d) {
  return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });

function toYMD(d) {

function pageLabel(idx, total) {
  if (idx === 0) return "Front Cover";
  if (idx === 1) return "Inside Front Cover";
  if (idx === total - 2 && total > 2) return "Inside Back Cover";
  if (idx === total - 1) return "Back Cover";
  return "Page " + (idx + 1);
}

function resolveSize(c) {
  // Signature limit: 12.5×27" press sheet BEFORE bleed
  // With 0.125" bleed per side: max trim spine = 12.25", max trim open = 13.25"
  const MAX_SPINE_TRIM = 12.25; // 12.5 - 0.25 bleed
  const MAX_OPEN_TRIM = 13.25;  // (27/2) - 0.25 bleed

  if (c.sizeLabel==="Custom Size") {
    let longest=Math.max(c.customLong||0,c.customShort||0);
    let shortest=Math.min(c.customLong||0,c.customShort||0);
    if(longest<2||shortest<2) return {imp:0,bindEdge:0,isCustom:true,errors:["Enter dimensions (min 2\")"],clamped:null};

    // Match against known presets
    const match=ALL_SIZES.find(s=>{
      const m=s.label.match(/([\d.]+)×([\d.]+)/);
      if(!m) return false;
      const pw=parseFloat(m[1]),ph=parseFloat(m[2]);
      return Math.abs(longest-Math.max(pw,ph))<0.05&&Math.abs(shortest-Math.min(pw,ph))<0.05;
    });
    if(match) return {imp:match.imp,bindEdge:match.bindEdge,isCustom:false,errors:[],clamped:null,sheet:"13x19",needsLargeSheet:false};

    // Determine spine and open side based on bind direction
    const bindEdge = c.bindDir==="short" ? shortest : longest;
    const openSide = c.bindDir==="short" ? longest : shortest;

    // Check signature limits and auto-clamp
    const errors = [];
    let clamped = null;
    if (bindEdge > MAX_SPINE_TRIM || openSide > MAX_OPEN_TRIM) {
      const clampedSpine = Math.min(bindEdge, MAX_SPINE_TRIM);
      const clampedOpen = Math.min(openSide, MAX_OPEN_TRIM);
      const newLong = Math.max(clampedSpine, clampedOpen);
      const newShort = Math.min(clampedSpine, clampedOpen);

      if (bindEdge > MAX_SPINE_TRIM) {
        errors.push(`Spine (${bindEdge}″) exceeds ${MAX_SPINE_TRIM}″ max — clamped to ${clampedSpine}″.`);
      }
      if (openSide > MAX_OPEN_TRIM) {
        errors.push(`Open side (${openSide}″) exceeds ${MAX_OPEN_TRIM}″ max — clamped to ${clampedOpen}″.`);
      }
      errors.push(`Press sheet limit: 12.5×27″. Dimensions adjusted.`);
      clamped = { long: newLong, short: newShort };
      longest = newLong;
      shortest = newShort;
    }

    let imp = calcCustomImp(longest, shortest, c.bindDir);   // 13×19 sheet
    let sheet = "13x19", needsLargeSheet = false;
    if (imp < 1) {
      // Too big to image even one-up on 13×19 → run on the 13×27.5 press sheet
      // (stocked only for select papers; the non-inventory fee covers the rest).
      imp = calcCustomImp(longest, shortest, c.bindDir, 27);
      sheet = "13x27.5";
      needsLargeSheet = true;
    }
    const finalBindEdge = c.bindDir==="short" ? shortest : longest;
    if(imp<=0) errors.push("Cannot produce — adjust dimensions.");
    return {imp:Math.max(imp,0.5),bindEdge:finalBindEdge,isCustom:true,errors,clamped,sheet,needsLargeSheet};
  }
  const p=ALL_SIZES.find(s=>s.label===c.sizeLabel)||ALL_SIZES[0];
  return {imp:p.imp,bindEdge:p.bindEdge,isCustom:false,errors:[],clamped:null,sheet:"13x19",needsLargeSheet:false};
}

// ──────────────────────────────────────────────────────────────────
function sheetsToDays(sheets) {
  if (sheets > 100000) return null;
  const t = [1000,2500,5000,7500,10000,12500,15000,17500,20000,30000,40000,50000,60000,70000,80000,90000,100000];
  let d = 0;
  for (const th of t) { if (sheets > th) d++; else break; }
  return d;
}

// TEMPORARY — Saddle-stitch price estimator for side-by-side comparison
function calculate(c) {
  const sz=resolveSize(c); const imp=sz.imp;
  const sets=c.sets.filter(s=>s.qty>0&&s.pages>0);
  if(!sets.length||sz.errors.length>0) return {error:sz.errors,sz};

  const _adErrs=[];
  if(_AD.vivid===false && c.vividPrint===true) _adErrs.push("Vivid Print is currently unavailable. Please turn it off to continue.");
  if(_AD.coating===false && Number(c.coating)>0) _adErrs.push("UV Coating is currently unavailable. Please change Coating to None to continue.");
  if(_AD.bundling===false && Number(c.bundling)>0) _adErrs.push("Bundling is currently unavailable. Please change Bundling to None to continue.");
  if(_AD.rc===false && Number(c.roundCorner)>0) _adErrs.push("Round Cornering is currently unavailable. Please change Round Corner to None to continue.");
  if(_AD.perforation===false && Number(c.perforation)>0) _adErrs.push("Perforation is currently unavailable. Please change Perforation to None to continue.");
  if(_AD.outfold===false && Number(c.outfold)>0) _adErrs.push("Outfold is currently unavailable. Please change Outfold to None to continue.");
  if(_adErrs.length) return {error:_adErrs,sz};

  const N=1;
  const coat=COATINGS.find(x=>x.val===c.coating)||COATINGS[0];
  const bund=BUNDLING.find(x=>x.val===c.bundling)||BUNDLING[0];
  const rc=CORNERS.find(x=>x.val===c.roundCorner)||CORNERS[0];
  const art=ART_OPTS.find(x=>x.val===c.artwork)||ART_OPTS[0];
  const bld=BLEED_OPTS.find(x=>x.val===c.bleed)||BLEED_OPTS[0];
  const cvr=c.coverMode==="same"?COVER_SAME:c.coverPaper;
  const outfold=OUTFOLD_OPTS.find(x=>x.val===(c.outfold||0))||OUTFOLD_OPTS[0];
  const perf=PERF_OPTS.find(x=>x.val===(c.perforation||0))||PERF_OPTS[0];
  const magnet=MAGNET_OPTS.find(x=>x.val===(c.magnetBacker||0))||MAGNET_OPTS[0];
  const bindStyle=c.bindStyle||"openface";
  const sidesPrinted=c.sidesPrinted||"double";
  const sidesMult=sidesPrinted==="single"?2:1; // single-sided uses 2× sheets

  const tQ=sets.reduce((s,x)=>s+x.qty,0);
  const tP=sets.reduce((s,x)=>s+x.pages,0);
  // Coupon book: pages / 2 per sheet (double-sided). Single-sided = 1 page per sheet = 2× tS.
  const tS=(sets.reduce((s,x)=>s+(x.qty*x.pages)/2,0)/imp)*sidesMult;
  if (sheetsToDays(tS) === null) return {error:["This job exceeds our online ordering capacity. Please contact us for a custom quote."],sz};

  // Markup curve — saddle/PB-mirrored single-axis (2026-05-28).
  // ROLLBACK: prior was `dL = couponbook_discount_log_coef * Math.log(tS)` with max=22.
  const dL = PCF.couponbook_markup_coef_tS * Math.log(tS);
  const mk = Math.max(PCF.couponbook_maximummarkup - dL, PCF.couponbook_minimummarkup);

  // Spine proxy: used for bundling/corner turnaround estimates
  const spine=((((tP/2)*c.insidePaper.price)+cvr.price)*tQ)*0.10;
  const csOK=sets.every(s=>s.pages<=24);

  const cvrScoring=COVER_SCORING_VALS.includes(cvr.val);
  const csInside=c.insidePaperType==="cardstock"&&csOK;
  const artWork=art.val>=2;
  const q100=sets.some(s=>s.qty>=100);
  const q250=sets.some(s=>s.qty>250);
  const commonSize = !sz.isCustom ? ["5.5×8.5 (Opens to 8.5×11)","8.5×11 (Opens to 11×17)"].includes(c.sizeLabel) : false;
  const coatPaper=c.coverMode==="same"?c.insidePaper:cvr;
  const coatOK=coatPaper.coatable;
  const hcOK=c.insidePaper.factory;
  const easySize=!sz.isCustom?imp>=4:false;

  const P={};

  // ── Mixed color printing — per-set color/BW page splits ──
  // Each set specifies colorPages and bwPages independently.
  // Color pages get BOTH BW base cost + full color surcharge. BW pages get BW cost only.
  const totalColorPages = sets.reduce((s,x) => s + (x.colorPages || 0), 0);
  const totalBwPages = sets.reduce((s,x) => s + (x.bwPages || 0), 0);
  const bwFraction = tP > 0 ? totalBwPages / tP : 0;

  // Inside print: per-set calculation to handle mixed color correctly
  // Uniform print markup (2026-04-14): mk applied to BOTH BW and color surcharge.
  // ROLLBACK: prior asymmetric behavior had mk on bwCost only; restore by removing
  // `* mk` from colorCost and removing `* mk` from both coverPrint branches below.
  P.insidePrint = sets.reduce((sum, st) => {
    const cp = st.colorPages || 0;
    const bp = st.bwPages || 0;
    const sp = cp + bp; // set total pages
    if (sp <= 0 || st.qty <= 0) return sum;
    // BW cost on ALL pages + full color surcharge on color pages only (both * mk)
    const bwCost = ((PCF.printing_black_cost * sp / imp) * mk) * st.qty;
    const colorCost = (((PCF.printing_fullcolor_cost / imp) * cp) * mk) * st.qty;
    return sum + bwCost + colorCost;
  }, 0);
  // Cover print: front + back = 2 sides (uniform mk)
  P.coverPrint = c.coverColor === "bw"
    ? (((PCF.printing_black_cost * 2 * tQ) / imp) * mk)
    : (((PCF.printing_fullcolor_cost * 2 * tQ) / imp) * mk);

  // ── Paper ──
  const lowYield = imp < 1;
  const iPaper = lowYield && c.insidePaper.oversizePrice != null ? c.insidePaper.oversizePrice : c.insidePaper.price;
  const cPaper = lowYield && cvr.oversizePrice != null ? cvr.oversizePrice : cvr.price;
  P.insidePaper=(iPaper*tS)*mk;
  P.coverPaper=((cPaper*tQ)/(imp/2))*mk;

  // ── Production labor ──
  P.press=(tS/PCF.press_printsperhour)*PCF.labor_press_hr;
  P.cutting=((tS*imp)/PCF.cutter_sheetsperhour)*(PCF.labor_cutting_hr+mk)+PCF.cutterbasefee;
  // 3 finishing cuts (head, foot, face) after binding
  P.finishingCuts=(((spine/PCF.cutter_stackheight_inches)*3)/PCF.cutter_cyclesperhour)*PCF.labor_cutting_hr+PCF.cutterbasefee;
  P.scoreCover=cvrScoring?(tQ/PCF.bindery_morgana_impressionperhour)*PCF.labor_bindery_hr:0;
  P.scoreInsides=csInside?(((tS*(imp/2))-tQ)/PCF.bindery_morgana_impressionperhour)*PCF.labor_bindery_hr:0;

  // ── Binding — conditional on bind style ──
  const bindQty = imp >= 2 ? tQ / 2 : tQ;
  const isOpenFace = bindStyle === "openface";
  // Open-faced pads: glue/pad binding is simpler (half the binding cost)
  // Wraparound cover: full perfect binding
  P.perfectBind = isOpenFace
    ? ((bindQty/PCF.perfect_binding_speedperhr)*PCF.labor_perf_bind_hr*0.5)+PCF.labor_perf_bind_setup
    : ((bindQty/PCF.perfect_binding_speedperhr)*PCF.labor_perf_bind_hr)+PCF.labor_perf_bind_setup;
  const perfBindTurnaround = Math.ceil(tQ / PCF.perfboundunitsperday);

  // ── Addons ──
  P.vivid=(c.vividPrint&&c.insidePaper.coatable)?Math.ceil(P.press):0;
  P.coat=0;
  if(coat.val>0&&coatOK){const sc=tQ/imp;P.coat=Math.ceil((coat.price*sc*mk)+(((sc/PCF.uvcoaterimpressionsperhour)*PCF.labor_bindery_hr)*(coat.price*mk*3))+PCF.labor_bindery_hr)}
  P.bundle=(bund.val>0&&q100)?Math.ceil(((tQ/bund.price)/mk)*(PCF.labor_bindery_hr/PCF.bundlesperhour)+PCF.bundling_base_fee):0;
  P.rc=rc.val>0?Math.floor((spine/rc.price)/PCF.roundcornerperhour*PCF.labor_bindery_hr):0;

  // ── Outfold ──
  P.outfold=0;
  if(outfold.val>0){
    // Outfold pricing — Tier C (Aggressive). Mirrors perfect bound. ROLLBACK:
    // prior was `((printing*tQ*price)+(tQ*price)/bindery*labor)*mk` — effectively free.
    const ofCount = outfold.count || 1;
    const ofExtraSheets = tQ * ofCount;
    const ofMat = ofExtraSheets * (c.insidePaper.price + PCF.printing_fullcolor_cost * 2) * mk;
    const ofFold = (ofExtraSheets / PCF.bindery_morgana_impressionperhour) * PCF.labor_bindery_hr + (PCF.outfold_setup || 0) * ofCount;
    const ofHandle = tQ * (PCF.outfold_per_book_handling || 0) * ofCount;
    P.outfold = (ofMat + ofFold + ofHandle) * (PCF.outfold_specialty_markup || 1);
  }
  const outfoldTurnaround = outfold.val > 0 ? Math.ceil(tQ / outfold.val) : 0;

  // ── Perforation ──
  // Runtime is charged at 2x the base GW labor rate (specialty operation) and
  // marked up by mk. Setup is flat per-line (labor_gw_setup). Each additional
  // perf line past the first costs 60% of a full line. The bind-direction
  // factor (imp>=2 = 2.0, else 0.9) stacks on top for perfect bound.
  P.perforation=0;
  if(perf.val>0){
    const perfRuntime=((tS*perf.price)/PCF.speed_gwperhr)*(PCF.labor_gw_hour*2)*mk;
    const perfPerLine=perfRuntime+PCF.labor_gw_setup;
    const perfLineMult=1+(perf.count-1)*0.6;
    const bindDirMult=imp>=2?2.0:0.9;
    P.perforation=Math.ceil(perfPerLine*perfLineMult*bindDirMult);
  }
  const perfTurnaround = perf.val > 0 ? Math.ceil(tS / perf.val) : 0;

  // ── Magnetic backer ──
  P.magnetBacker = 0;
  if (magnet.val > 0) {
    const magnetSheets = tQ / imp;
    P.magnetBacker = Math.ceil(((magnetSheets * (18.5 / (sz.bindEdge || 5.5))) * magnet.price + (magnetSheets / PCF.magneticstripapplication_perhour) * PCF.labor_bindery_hr) * mk);
  }
  const magnetTurnaround = magnet.val > 0 ? Math.ceil(tQ / (PCF.magneticstripapplication_perhour * 8)) : 0;

  // ── Wraparound cover perforation (cover gets perforated when wraparound style selected) ──
  P.wraparoundPerf = 0;
  if (bindStyle === "wraparound") {
    P.wraparoundPerf = Math.ceil(((tQ / (sz.bindEdge || 5.5)) / PCF.speed_gwperhr) * PCF.labor_gw_hour * mk);
  }
  const wraparoundPerfTurnaround = bindStyle === "wraparound" ? Math.ceil(tQ / (PCF.speed_gwperhr * 8)) : 0;

  // ── Artwork ── fees live in PCF (Production tab → Artwork group)
  let ndc=art.val>=4?(PCF.art_design_rate*tP)*PCF.art_newdesignmodifier:0;
  let aec=(art.val>=2&&art.val<4)?PCF.art_pagesperhour+((c.artEditPages/PCF.art_pagesperhour)*PCF.art_edit_rate):0;
  const upc=(art.val>0.03&&art.val<1)?PCF.art_canva_fee:0; // val 0.04 = Canva
  P.artwork=artWork?(ndc+aec)*N:upc;
  P.bleed=artWork?0:(bld.val>0?Math.max(bld.price*tP,PCF.bleed_minimum):0);
  P.proof=0;
  if(c.proof>0){const sf=(PCF.sheetsforlowcosthardcopyproof/tS)>1?1:(PCF.sheetsforlowcosthardcopyproof/tS);P.proof=((c.proof>=3?PCF.proof_hardcopy_cost:PCF.proof_digital_cost)*sf)*N}

  // ── Fees & Discounts ──
  P.baseRate=PCF.base_rate;
  P.diffSize=P.finishingCuts; // finishing cuts serve as the difficult size surcharge
  const iInv=c.insidePaperType==="cardstock"?INV_CS.includes(c.insidePaper.val):INV_NC.includes(c.insidePaper.val);
  // Oversized jobs (sz.needsLargeSheet) run on 13×27.5, stocked only for select papers;
  // there "in stock" means both inside AND cover are 13×27.5 papers. Normal jobs use 13×19.
  let paperInStock;
  if(sz.needsLargeSheet){
    const insideLarge=LARGE_SHEET_VALS.includes(c.insidePaper.val);
    const coverLarge=c.coverMode==="same"?insideLarge:LARGE_SHEET_VALS.includes(cvr.val);
    paperInStock=insideLarge&&coverLarge;
  } else {
    paperInStock=iInv&&COVER_INV.includes(cvr.val);
  }
  P.nonInv=paperInStock?0:PCF.non_inventory_fee;
  // BW discount proportional to fraction of BW pages
  P.discBW = bwFraction > 0 ? -(P.press * PCF.bw_discount_rate * bwFraction) : 0;
  const pComp=P.insidePaper+P.coverPaper+P.insidePrint+P.coverPrint;
  P.discEasy=easySize?-Math.min(pComp*PCF.easy_discount_rate_1,PCF.easydiscount_max):0;
  P.discCommon=0;
  if(commonSize&&PCF.common_discount_max>0&&tQ>100){
    const frac=Math.min(1,Math.log(tQ/100)/Math.log(10));
    P.discCommon=-(P.press+P.cutting+P.perfectBind)*frac;
  }

  // Size-based adjustment — 15% off when imp<4 (8.5×11 and larger). Mirrors saddle-stitch booklet.
  const subBeforeSize=Object.values(P).reduce((s,v)=>s+v,0);
  P.discSize=imp<4?subBeforeSize*(-PCF.couponbook_size_discount):0;

  // Surcharge layer — mirrors saddle's booklet_surcharge / PB's perfectbound_surcharge.
  const subBeforeSurcharge=Object.values(P).reduce((s,v)=>s+v,0);
  P.surcharge=subBeforeSurcharge*(PCF.couponbook_surcharge||0);

  // Sale discount applies last, on the post-discount subtotal. Excludes shipping/rush.
  const subBeforeSale=Object.values(P).reduce((s,v)=>s+v,0);
  P.discSale=(PCF.sale_discount_pct>0)?-Math.round(subBeforeSale*PCF.sale_discount_pct*100)/100:0;

  const total=Object.values(P).reduce((s,v)=>s+v,0);

  // Turnaround
  // Material lead times STACK (run concurrently) rather than accumulating: the inside
  // and cover stocks are ordered from the supplier together and arrive in parallel, so
  // the wait is the longest of the two, not their sum. Materials still precede
  // production, so pT is added to sheetsToDays() below rather than maxed with it.
  const pT=Math.max(c.insidePaper.days!=null?c.insidePaper.days:Math.floor(c.insidePaper.val||0),cvr.days!=null?cvr.days:Math.floor(cvr.val||0));
  const aT=(c.vividPrint?Math.floor(tS/PCF.sheetsturnaround):0)+
    (coat.val>0&&coatOK?Math.floor((tQ/(imp/2))/coat.val):0)+
    (bund.val>0&&q100?Math.floor(spine/bund.val):0)+
    (rc.val>0?Math.floor(Math.min(spine/rc.val,PCF.addon_roundcornermaxdays)):0)+
    outfoldTurnaround+perfTurnaround+perfBindTurnaround+magnetTurnaround+wraparoundPerfTurnaround;
  const dT=art.val>=4?Math.ceil(art.val*(tP/4)):0;
  const eT=(art.val>=2&&art.val<4)?Math.ceil((c.artEditPages/PCF.art_pagesperhour)/2):0;
  const bT=(!artWork&&bld.val>0)?Math.floor(bld.val*tP)/12:0;
  const pE=c.proof>=3?Math.ceil(pT+3.01):0;
  const artT=dT+(pE+dT)+eT+bT;
  const days=Math.max(PCF.minimum_turnaround_days,Math.floor(sheetsToDays(tS)+pT+aT+artT));

  // Turnaround impact per option (for UI badges)
  const ti = {
    insidePaper: c.insidePaper.days != null ? c.insidePaper.days : Math.floor(c.insidePaper.val || 0),
    coverPaper: cvr.days != null ? cvr.days : Math.floor(cvr.val || 0),
    perfectBind: perfBindTurnaround,
    vivid: c.vividPrint ? Math.floor(tS/PCF.sheetsturnaround) : 0,
    coating: (coat.val>0&&coatOK) ? Math.floor((tQ/(imp/2))/coat.val) : 0,
    bundling: (bund.val>0&&q100) ? Math.floor(spine/bund.val) : 0,
    roundCorner: rc.val>0 ? Math.floor(Math.min(spine/rc.val,PCF.addon_roundcornermaxdays)) : 0,
    outfold: outfoldTurnaround,
    perforation: perfTurnaround,
    magnetBacker: magnetTurnaround,
    wraparoundPerf: wraparoundPerfTurnaround,
    artDesign: dT,
    artEdits: eT,
    bleed: Math.round(bT*10)/10,
    proof: pE,
  };

  // ── Shipping & Rush (all in business days) ──
  const transitDays = getTransitDays(c.shipState, c.shipZip);  // Internal shipping-weight estimate (owner rule 2026-07-19): a 45 lb carton
  // Do we know where this is going? A ZIP is what the zone map and the live UPS lookup
  // both key on, so a dated promise needs one; state alone is a coarse guess dressed up
  // as a delivery date. Clearing the ZIP used to leave the previous date on screen
  // unchanged, because the state fallback quietly produced the same number.
  const _hasDest = !!(c.shipState && String(c.shipState).trim())
    && String(c.shipZip || "").replace(/[^0-9]/g, "").length >= 3;
  // holds 900 text-weight or 400 cardstock 13x19 press sheets. Debug/ops only.
  const _cartonLb=PCF.ship_carton_lb||45;
  const _shFac=(sz&&sz.sheet==="13x27.5")?(27.5/19):1; // area scaling: oversize sheets vs 13x19
  const _osIn=(sz&&sz.sheet==="13x27.5")?imp:1, _osCvr=(sz&&sz.sheet==="13x27.5")?imp:1; // un-inflate the imp-0.5 oversized-premium sheet counts to physical sheets
  const cvrSheets=tQ/Math.max(imp,1);
  const _wInside=tS*(_cartonLb/((c.insidePaperType==="cardstock")?(PCF.ship_card_sheets_per_carton||400):(PCF.ship_text_sheets_per_carton||900)));
  const _cvrIsCard=c.coverMode==="same"?(c.insidePaperType==="cardstock"):isCardstockVal(cvr.val);
  const _wCover=cvrSheets*(_cartonLb/(_cvrIsCard?(PCF.ship_card_sheets_per_carton||400):(PCF.ship_text_sheets_per_carton||900)));
  const estWeightLb=Math.round((_wInside*_osIn+_wCover*_osCvr)*_shFac*10)/10;
  const estCartons=Math.max(1,Math.ceil(estWeightLb/_cartonLb));
  const productionBizDays = days;
  // Free shipping = minimum turnaround × 2 + ground transit
  const bufferedProdDays = productionBizDays * 2;
  const freeDeliveryBizDays = bufferedProdDays + transitDays;
  // Minimum days are mandatory — production + 1 day overnight shipping
  const earliestBizDays = productionBizDays + 1;
  const shopToday = getShopToday();
  const freeDeliveryDate = addBusinessDays(shopToday, freeDeliveryBizDays);
  const earliestDate = addBusinessDays(shopToday, earliestBizDays);

  let rushMultiplier = 1;
  let rushCost = 0;
  let bizDaysToDate = freeDeliveryBizDays;
  let needByValid = false;
  let tooSoon = false;

  let needByPast = false;
  if (c.needByDate) {
    const nbd = new Date(c.needByDate + "T00:00:00");
    if (nbd <= shopToday) {
      needByPast = true;
    } else if (nbd > shopToday) {
      bizDaysToDate = businessDaysBetween(shopToday, nbd);
      needByValid = true;
      if (bizDaysToDate < earliestBizDays) {
        // Can't deliver — inside mandatory production window
        tooSoon = true;
        rushMultiplier = 1;
        rushCost = 0;
      } else if (bizDaysToDate < freeDeliveryBizDays) {
        // Rush zone — between earliest possible and free delivery
        rushMultiplier = freeDeliveryBizDays / bizDaysToDate;
        rushCost = Math.max(0, (total * rushMultiplier) - total);
      } else {
        rushMultiplier = 1;
      }
    }
  }
  const grandTotal = total + rushCost;

  // Production start date = delivery date - transit - production days
  // Production is a hard floor — never compressed. Transit adjusts instead:
  // if the remaining days after production < ground transit, overnight/expedited is used.
  const effectiveDeliveryBiz = (needByValid && !tooSoon) ? bizDaysToDate : freeDeliveryBizDays;
  const effectiveTransit = Math.min(transitDays, Math.max(1, effectiveDeliveryBiz - productionBizDays));
  const prodStartBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit - productionBizDays);
  const productionStartDate = addBusinessDays(shopToday, prodStartBiz);
  // Production must-ship-by date = delivery date - effective transit days
  const mustShipBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit);
  const mustShipDate = addBusinessDays(shopToday, mustShipBiz);

  const bd=[
    {l:"Inside Paper",v:P.insidePaper,g:"mat"},{l:"Cover Paper",v:P.coverPaper,g:"mat"},
    {l:"Inside Print",v:P.insidePrint,g:"mat"},{l:"Cover Print",v:P.coverPrint,g:"mat"},
    {l:"Press",v:P.press,g:"lab"},{l:"Cutting",v:P.cutting,g:"lab"},{l:"Finishing Cuts",v:P.finishingCuts,g:"lab"},
    {l:"Cover Scoring",v:P.scoreCover,g:"lab"},{l:"Inside Scoring",v:P.scoreInsides,g:"lab"},
    {l:"Perfect Binding",v:P.perfectBind,g:"lab"},
    {l:"Vivid Print",v:P.vivid,g:"add"},
    {l:"UV Coating",v:P.coat,g:"add"},{l:"Bundling",v:P.bundle,g:"add"},
    {l:"Round Cornering",v:P.rc,g:"add"},{l:"Outfold",v:P.outfold,g:"add"},{l:"Perforation",v:P.perforation,g:"add"},
    {l:"Magnetic Backer",v:P.magnetBacker,g:"add"},{l:"Wraparound Perf",v:P.wraparoundPerf,g:"add"},
    {l:"Artwork",v:P.artwork,g:"art"},{l:"Bleed",v:P.bleed,g:"art"},{l:"Proofing",v:P.proof,g:"art"},
    {l:"Base Rate",v:P.baseRate,g:"fee"},{l:"Non-Inventory",v:P.nonInv,g:"fee"},{l:"Pricing Surcharge",v:P.surcharge,g:"fee"},
    {l:"BW Discount",v:P.discBW,g:"disc"},{l:"Easy Size",v:P.discEasy,g:"disc"},{l:"Competitive",v:P.discCommon,g:"disc"},{l:"Size Adj.",v:P.discSize,g:"disc"},
    {l:(PCF.sale_label||"Sale"),v:P.discSale,g:"disc"},
  ].filter(r=>Math.abs(r.v)>0.005);

  // CMYK-derived group colors
  const gC={mat:CK.cyan,lab:CK.key,add:CK.yellow,art:CK.magenta,fee:"#c25050",disc:CK.cyan};
  const gL={mat:"Materials & Ink",lab:"Production Labor",add:"Addons",art:"Artwork & Proofing",fee:"Fees",disc:"Discounts"};
  const grouped=Object.entries(gL).map(([k,label])=>{
    const val=bd.filter(r=>r.g===k).reduce((s,r)=>s+r.v,0);
    return {label,val,c:gC[k]};
  }).filter(g=>Math.abs(g.val)>0.005);

  // Debug: intermediate values
  const baseDays=Math.floor(tS/PCF.sheetsturnaround);
  const paperDays=pT;
  const perSetSheets=sets.map(s=>({name:s.name||`Set ${sets.indexOf(s)+1}`,qty:s.qty,pages:s.pages,bookletSheets:(s.qty*s.pages)/2}));
  const bookletSheetsTotal=sets.reduce((s,x)=>s+(x.qty*x.pages)/2,0);

  const debug={
    // Sheet math
    perSetSheets,
    bookletSheetsTotal,
    parentSheets:tS,
    imp,
    // Volumes
    totalQty:tQ,
    totalPages:tP,
    totalColorPages, totalBwPages, bwFraction,
    // Pricing intermediates
    markup:mk,coverMarkup:mk,
    discountLog:dL,
    spineThickness:spine,
    materialsSubtotal:pComp,
    // Flags
    coverNeedsScoring:cvrScoring,
    cardstockInsideActive:csInside,
    cardstockPagesOK:csOK,
    coatingEligible:coatOK,
    coatPaperLabel:coatPaper.label,
    hardcopyEligible:hcOK,
    insideInventory:iInv,
    coverInventory:COVER_INV.includes(cvr.val),
    pressSheet:sz.sheet,
    needsLargeSheet:sz.needsLargeSheet,
    coverPaperUsed:cvr.label,
    // Size
    bindingEdge:sz.bindEdge,
    isCustom:sz.isCustom,
    easySize,
    lowYield,
    lowYieldPaper: lowYield ? `oversize pricing (inside: $${iPaper}, cover: $${cPaper})` : "standard pricing",
    // Perfect binding
    bindMode: imp >= 2 ? "2-up" : "1-up",
    bindQty,
    perfBindTurnaround,
    outfoldLabel: outfold.label,
    perforationLabel: perf.label,
    bindStyle,
    sidesPrinted,
    sidesMult,
    magnetBackerLabel: magnet.label,
    // Turnaround breakdown
    turnaround:{
      baseDays,
      paperDays,
      paperValRaw:pT,
      insidePaperVal:c.insidePaper.val,
      coverPaperVal:cvr.val,
      addonDays:aT,
      addonBreakdown:{
        perfectBind:perfBindTurnaround,
        vivid:c.vividPrint?Math.floor(tS/PCF.sheetsturnaround):0,
        coating:(coat.val>0&&coatOK)?Math.floor((tQ/(imp/2))/coat.val):0,
        bundling:(bund.val>0&&q100)?Math.floor(spine/bund.val):0,
        roundCorner:rc.val>0?Math.floor(Math.min(spine/rc.val,PCF.addon_roundcornermaxdays)):0,
        outfold:outfoldTurnaround,
        perforation:perfTurnaround,
        magnetBacker:magnetTurnaround,
        wraparoundPerf:wraparoundPerfTurnaround,
      },
      artworkDays:artT,
      artBreakdown:{
        designTime:dT,
        editTime:eT,
        bleedTime:bT,
        proofTime:pE,
      },
      preFloor:(tS/PCF.sheetsturnaround)+pT+aT+artT,
      totalDays:days,
    },
    // Shipping
    shipping:{
      hasDest: _hasDest,
      transitDays,
      freeDeliveryBizDays,
      freeDeliveryBuffer:PCF.free_shipping_buffer,
      bufferedProdDays,
      earliestBizDays,
      rushMultiplier,
      rushCost:Math.round(rushCost*100)/100,
      bizDaysToDate,
      needByValid,
      tooSoon,
    },
    minDaysConfig:PCF.minimum_turnaround_days,
  };

  const saleActive=P.discSale<-0.005;
  const saleAmount=saleActive?Math.round(-P.discSale*100)/100:0;
  const totalWithoutSale=Math.round((grandTotal-P.discSale)*100)/100;
  return {total:Math.round(grandTotal*100)/100,baseTotal:Math.round(total*100)/100,perUnit:Math.round((grandTotal/tQ)*100)/100,days,tQ,bd,grouped,q100,coatOK,vividOK:c.insidePaper.coatable,hcOK,sz,debug,ti,saleActive,saleAmount,saleLabel:(PCF.sale_label||"Sale"),totalWithoutSale,
    shipping:{estWeightLb,estCartons,transitDays,effectiveTransit,freeDeliveryBizDays,freeDeliveryDate:fmtDate(freeDeliveryDate),freeDeliveryYMD:toYMD(freeDeliveryDate),earliestBizDays,earliestDate:fmtDate(earliestDate),earliestYMD:toYMD(earliestDate),shopToday:fmtDate(shopToday),bizDaysToDate,rushMultiplier,rushCost:Math.round(rushCost*100)/100,needByValid,needByPast,tooSoon,bufferedProdDays,productionBizDays,productionStartDate:fmtDate(productionStartDate),productionStartYMD:toYMD(productionStartDate),mustShipDate:fmtDate(mustShipDate),mustShipYMD:toYMD(mustShipDate),needByFmt:(needByValid&&!tooSoon&&c.needByDate)?fmtDate(new Date(c.needByDate+"T00:00:00")):null,prodStartBiz,mustShipBiz,pastCutoff:new Date().toLocaleString("en-US",{timeZone:PCF.shop_timezone,hour:"numeric",minute:"numeric",hour12:true})}};
}

const Chev=()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>;

function Sel({label,value,onChange,children,disabled,note,badge,autoComplete,name}){
  const m=useIsMobile();
  return <div style={ST.f}>{label&&<label style={ST.lbl}>{label}{badge}</label>}<div style={{position:"relative"}}><select value={value} onChange={e=>onChange(e.target.value)} autoComplete={autoComplete} name={name} style={{...ST.sel,fontSize:m?16:15,padding:m?"10px 32px 10px 12px":"10px 32px 10px 12px",...(disabled?{opacity:.4,pointerEvents:"none"}:{})}} disabled={disabled}>{children}</select><span style={ST.selA}><Chev/></span></div>{note&&<p style={ST.note}>{note}</p>}</div>;
}

// confirm=true is for fields whose value drives expensive downstream work (page
// count re-renders every page of the 3D preview). Nothing commits while typing,
// so there's no guessing whether a half-typed "12" was meant to be "120" — the
// value applies on Enter, on blur, or via the ✓ Apply button that appears while
// the entry differs from what's applied. Default = commit on every keystroke.
function TxtNum({label,value,onChange,min=1,max=99999,confirm=false,unit="",adjustHint=""}){
  const[raw,setRaw]=useState(String(value));
  // What was typed at the last commit. The caller normalises page counts (even, at
  // least 4), so the field can come back holding a number nobody entered -- which
  // reads as the input having been ignored unless it says otherwise.
  const typedRef=useRef(null);
  const[adjusted,setAdjusted]=useState(null);
  useEffect(()=>{
    setRaw(String(value));
    if(typedRef.current!==null&&typedRef.current!==value)setAdjusted({from:typedRef.current,to:value,clamped:typedRef.current<min||typedRef.current>max});
    typedRef.current=null;
  },[value]);
  const flush=()=>{
    const typed=parseFloat(raw);
    const v=isNaN(typed)?min:Math.min(max,Math.max(min,typed));
    typedRef.current=isNaN(typed)?null:typed;
    // The clamp this component owns; the effect above catches the caller's own.
    // out-of-range is a mistake worth flagging; a round-up to an even count is routine.
    setAdjusted(!isNaN(typed)&&typed!==v?{from:typed,to:v,clamped:typed<min||typed>max}:null);
    onChange(v);setRaw(String(v));
  };
  // A pending edit: what's typed isn't what's actually applied to the quote yet.
  const unapplied=confirm&&raw.trim()!==""&&raw.trim()!==String(value);
  return <div style={ST.f}>{label&&<label style={ST.lbl}>{label}</label>}
    <div style={{position:"relative"}}>
      <input type="text" inputMode="decimal" value={raw}
        onChange={e=>{setRaw(e.target.value);setAdjusted(null);if(confirm)return;const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=min&&v<=max)onChange(v)}}
        onBlur={flush}
        onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();flush()}}}
        style={{...ST.inp,...(unapplied?{paddingRight:80,borderColor:CK.cyan}:{})}}/>
      {unapplied&&(
        // preventDefault on mousedown keeps focus, so blur can't unmount the
        // button out from under the click that's about to land on it.
        <button type="button" onMouseDown={e=>e.preventDefault()} onClick={flush}
          title="Apply this count to the quote"
          style={{position:"absolute",right:5,top:"50%",transform:"translateY(-50%)",padding:"5px 10px",fontSize:12,fontWeight:700,border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",background:CK.cyan,color:"#fff",lineHeight:1.2,whiteSpace:"nowrap"}}>✓ Apply</button>
      )}
    </div>
    {/* The cyan border and the Apply button were the only sign the quote was stale.
        Somebody typed 48, watched the price sit at the 4pp figure, and concluded page
        count was free -- so say it in words. */}
    {unapplied&&<div style={{marginTop:4,fontSize:11,fontWeight:600,color:CK.cyan,lineHeight:1.3}}>
      Quote still shows {value}{unit?" "+unit:""} &mdash; press Apply or Enter to update it.
    </div>}
    {!unapplied&&adjusted&&<div style={{marginTop:4,fontSize:11,lineHeight:1.3,
      fontWeight:adjusted.clamped?600:400,color:adjusted.clamped?"#dc2626":CC.light}}>
      {adjusted.clamped?"\u26a0 ":""}Adjusted {adjusted.from} &rarr; {adjusted.to}{adjustHint?" \u2014 "+adjustHint:""}
    </div>}
  </div>;
}

function Pil({label,options,value,onChange,disabled,badge}){
  const m=useIsMobile();
  return <div style={ST.f}>{label&&<label style={ST.lbl}>{label}{badge}</label>}<div style={ST.pills}>{options.map(o=><button type="button" aria-pressed={value===o.v} key={String(o.v)} onClick={()=>!disabled&&onChange(o.v)} style={{...ST.pill,padding:m?"11px 10px":"9px 10px",...(value===o.v?(o.onStyle||ST.pillOn):{}),...(disabled?{opacity:.4,cursor:"default"}:{})}}>{o.t}</button>)}</div></div>;
}

function TurnBadge({days}){
  if(!days || days < 0.5) return null;
  const d = Math.round(days);
  const label = d === 0 ? `+${days.toFixed(1)}d` : `+${d} day${d!==1?"s":""}`;
  return <span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:10,fontWeight:600,color:CK.magenta,background:CK.magentaLight,padding:"1px 6px",borderRadius:8,marginLeft:6,whiteSpace:"nowrap",verticalAlign:"middle"}}>⏱ {label}</span>;
}

function Sec({title,open,onToggle,children,badge}){
  const m=useIsMobile();
  return <div style={ST.card}><button type="button" onClick={onToggle} style={{...ST.cardH,padding:m?"12px 14px":"14px 18px",fontSize:m?14:15}}><div style={{display:"flex",alignItems:"center",gap:m?10:12,flex:1,minWidth:0,textAlign:"left"}}><span style={{fontWeight:700,color:CC.dark,fontSize:"inherit",textTransform:"uppercase",letterSpacing:"-0.005em"}}>{title}</span></div><div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>{badge&&<span style={{fontSize:11,fontWeight:700,color:CC.primary,background:CK.cyanLight,padding:"3px 9px",borderRadius:10}}>{badge}</span>}<span style={{color:CC.light,transition:"transform .2s",display:"flex",transform:open?"rotate(180deg)":"none"}}><Chev/></span></div></button>{open&&<div style={{padding:m?"12px 14px":"14px 18px",borderTop:`1px solid ${CC.border}`}}>{children}</div>}</div>;
}

const DNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MNAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function DatePicker({value, onChange, earliestDate, freeDate}) {
  const [open, setOpen] = useState(false);
  const now = new Date();
  const [vYear, setVYear] = useState(now.getFullYear());
  const [vMonth, setVMonth] = useState(now.getMonth());
  const initRef = useRef(false);
  const trigRef = useRef(null);
  const dropRef = useRef(null);
  const [pos, setPos] = useState({top:0,left:0,width:0});
  const isMob = useIsMobile();

  const earliest = earliestDate ? new Date(earliestDate + "T00:00:00") : null;
  const free = freeDate ? new Date(freeDate + "T00:00:00") : null;

  // Jump to the month with actionable dates once props arrive
  useEffect(()=>{
    if(initRef.current)return;
    const target = free || earliest;
    if(target){ initRef.current=true; setVYear(target.getFullYear()); setVMonth(target.getMonth()); }
  },[freeDate,earliestDate]);

  // Position the dropdown below the trigger (desktop) or as centered modal (mobile)
  useEffect(()=>{
    if(open&&trigRef.current){
      const r=trigRef.current.getBoundingClientRect();
      const vw=window.innerWidth;
      const vh=window.innerHeight;
      const isMob=vw<700;
      if(isMob){
        // Centered modal — ignore trigger position
        const w=Math.min(vw-32,360);
        setPos({top:Math.max(16,vh*0.08),left:(vw-w)/2,width:w,modal:true});
      } else {
        // Dropdown below trigger, ensure it doesn't clip bottom
        let top=r.bottom+4;
        const estH=360;
        if(top+estH>vh) top=Math.max(8,r.top-estH-4);
        setPos({top,left:r.left,width:Math.max(r.width,300),modal:false});
      }
    }
  },[open]);

  // Close on outside click
  useEffect(()=>{
    if(!open)return;
    const handler=e=>{
      if(trigRef.current&&trigRef.current.contains(e.target))return;
      if(dropRef.current&&dropRef.current.contains(e.target))return;
      setOpen(false);
    };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[open]);

  const navM = dir => {
    let m = vMonth + dir, y = vYear;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    setVMonth(m); setVYear(y);
  };

  const first = new Date(vYear, vMonth, 1);
  const last = new Date(vYear, vMonth + 1, 0);
  const pad = first.getDay();
  const cells = [];
  for (let i = 0; i < pad; i++) cells.push(null);
  for (let d = 1; d <= last.getDate(); d++) cells.push(new Date(vYear, vMonth, d));

  const selected = value ? toYMD(new Date(value + "T00:00:00")) : null;

  const pick = (d) => {
    onChange(toYMD(d));
    setOpen(false);
  };

  const clear = () => { onChange(""); setOpen(false); };

  const displayVal = value ? fmtDate(new Date(value + "T00:00:00")) : "";

  return (
    <>
      <div ref={trigRef} onClick={()=>setOpen(!open)} style={{...ST.inp,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",minHeight:36}}>
        <span style={{color:value?CC.dark:CC.light}}>{displayVal||"Select a date..."}</span>
        <span style={{display:"flex",gap:4,alignItems:"center"}}>
          {value&&<span onClick={e=>{e.stopPropagation();clear()}} style={{color:CC.light,fontSize:14,cursor:"pointer",lineHeight:1}}>✕</span>}
          <Chev/>
        </span>
      </div>
      {open&&ReactDOM.createPortal(<>
        {/* Backdrop on mobile */}
        {pos.modal&&<div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,zIndex:99999,background:"rgba(0,0,0,.4)"}}/>}
        <div ref={dropRef} style={{position:"fixed",top:pos.top,left:pos.left,width:pos.width||300,zIndex:100000,background:CC.white,borderRadius:isMob?12:6,border:`1px solid ${CC.border}`,boxShadow:isMob?"0 12px 40px rgba(0,0,0,.25)":"0 8px 24px rgba(0,0,0,.15)",padding:isMob?16:10,maxHeight:isMob?"80vh":"70vh",overflowY:"auto",fontFamily:"'Segoe UI','Helvetica Neue',Arial,sans-serif",boxSizing:"border-box"}}>
          {/* Close button on mobile */}
          {isMob&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:14,fontWeight:700,color:CC.dark}}>Select Delivery Date</span>
            <button type="button" onClick={()=>setOpen(false)} style={{background:"none",border:"none",fontSize:20,color:CC.light,cursor:"pointer",padding:"0 4px",lineHeight:1}}>✕</button>
          </div>}
          {/* Month nav */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <button type="button" onClick={()=>navM(-1)} style={{background:"none",border:`1px solid ${CC.border}`,borderRadius:3,padding:isMob?"6px 14px":"2px 8px",cursor:"pointer",color:CC.mid,fontFamily:"inherit",fontSize:isMob?16:14}}>◀</button>
            <span style={{fontSize:isMob?14:12.5,fontWeight:700,color:CC.dark}}>{MNAMES[vMonth]} {vYear}</span>
            <button type="button" onClick={()=>navM(1)} style={{background:"none",border:`1px solid ${CC.border}`,borderRadius:3,padding:isMob?"6px 14px":"2px 8px",cursor:"pointer",color:CC.mid,fontFamily:"inherit",fontSize:isMob?16:14}}>▶</button>
          </div>
          {/* Day headers */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:isMob?2:1,marginBottom:2}}>
            {DNAMES.map(d=><div key={d} style={{textAlign:"center",fontSize:isMob?11:9.5,fontWeight:600,color:d==="Sun"||d==="Sat"?"#ccc":CC.light,padding:isMob?4:2}}>{d}</div>)}
          </div>
          {/* Day cells */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:isMob?2:1}}>
            {cells.map((d,i) => {
              if (!d) return <div key={`p${i}`}/>;
              const ymd = toYMD(d);
              const we = d.getDay()===0||d.getDay()===6;
              const closed = !isBusinessDay(d);
              const beforeEarliest = earliest && d < earliest;
              const disabled = we || closed || beforeEarliest;
              const isSel = ymd === selected;
              const isFree = free && ymd === toYMD(free);
              const isRush = !disabled && earliest && free && d >= earliest && d < free;
              const isPast = d < getShopToday();

              let bg = "transparent";
              let color = CC.dark;
              let fontWeight = 400;
              let border = "1px solid transparent";

              if (isSel) { bg = CK.cyan; color = "#fff"; fontWeight = 700; border = `1px solid ${CK.cyan}`; }
              else if (disabled || isPast) { bg = "#f8f8f8"; color = "#d0d0d0"; }
              else if (isFree) { bg = "#e8f5e3"; color = "#3a7124"; fontWeight = 600; border = "1px solid #b5d8a8"; }
              else if (isRush) { bg = CK.yellowLight; color = CK.yellow; }

              return (
                <div key={ymd}
                  onClick={()=>!disabled&&!isPast&&pick(d)}
                  style={{textAlign:"center",padding:isMob?"10px 2px":"5px 2px",borderRadius:isMob?4:3,fontSize:isMob?14:11.5,fontWeight,background:bg,color,border,
                    cursor:disabled||isPast?"default":"pointer",userSelect:"none",transition:"background .1s"}}>
                  {d.getDate()}
                </div>
              );
            })}
          </div>
          {/* Legend */}
          <div style={{display:"flex",gap:isMob?12:10,marginTop:8,paddingTop:6,borderTop:`1px solid ${CC.border}`,flexWrap:"wrap"}}>
            <span style={{fontSize:isMob?10:9,color:CC.light,display:"flex",alignItems:"center",gap:3}}>
              <span style={{width:8,height:8,borderRadius:2,background:CK.yellowLight,border:`1px solid ${CK.yellow}44`}}/> Rush zone
            </span>
            <span style={{fontSize:isMob?10:9,color:CC.light,display:"flex",alignItems:"center",gap:3}}>
              <span style={{width:8,height:8,borderRadius:2,background:"#e8f5e3",border:"1px solid #b5d8a8"}}/> Free delivery
            </span>
            <span style={{fontSize:isMob?10:9,color:CC.light,display:"flex",alignItems:"center",gap:3}}>
              <span style={{width:8,height:8,borderRadius:2,background:"#f8f8f8"}}/> Unavailable
            </span>
          </div>
        </div>
      </>, document.body)}
    </>
  );
}

function Panel({result,compact,debugUnlocked,expanded,onToggleExpand}){
  if(!result)return compact?null:<div style={ST.pnl}><p style={{color:CC.light,textAlign:"center",fontSize:14,margin:0,padding:"40px 20px"}}>Configure your booklet to see pricing</p></div>;
  if(result.error?.length>0)return compact?null:<div style={ST.pnl}><div style={{padding:20}}>{result.error.map((e,i)=><p key={i} style={{color:CC.red,fontSize:13,margin:"0 0 8px"}}>{e}</p>)}</div></div>;
  const{total,baseTotal,perUnit,days,tQ,bd,grouped,shipping:sh,saleActive,saleAmount,saleLabel,totalWithoutSale}=result;
  const hasRush=sh&&sh.rushCost>0;
  const availRange=sh?(sh.earliestBizDays===sh.freeDeliveryBizDays?`${sh.earliestBizDays}`:`${sh.earliestBizDays}–${sh.freeDeliveryBizDays}`):String(days);
  // A date the customer picked is an instruction, not an estimate, so it wins the
  // availability display. This used to be conditional and got it wrong two ways: the
  // modern draft fell back to the earliest-possible placeholder whenever no address
  // had been entered yet, and the rest honoured a picked date only when it triggered
  // a rush charge. Either way somebody who chose Aug 14 was told "as soon as Aug 7".
  // sh.needByFmt is non-null exactly when a picked date is valid and not too soon, so
  // it is the whole condition.
  // Compared against the free date, not merely checked for existence: four of these
  // calculators pre-fill the date field with the free delivery date as a convenience,
  // so "a date is set" is the default state and would make every quote read as a
  // promise. A date that DIFFERS from the free one is the customer actually asking
  // for something.
  const requestedDate = sh && sh.needByFmt && sh.needByFmt !== sh.freeDeliveryDate
    ? sh.needByFmt : null;
  const deliveryDate = sh?(requestedDate || (sh.hasDest?((hasRush&&sh.needByFmt)?sh.needByFmt:sh.freeDeliveryDate):null)) : null;
  const ti=result.ti||{};
  const _factors=[];
  if(ti.coverPaper>0)_factors.push("paper lead time");
  if(ti.vivid>0)_factors.push("vivid printing");
  if(ti.coating>0)_factors.push("coating");
  if(ti.bundling>0)_factors.push("bundling");
  if(ti.roundCorner>0)_factors.push("round corners");
  if(ti.perforation>0)_factors.push("perforation");
  if(ti.outfold>0)_factors.push("outfold");
  if(ti.artDesign>0||ti.artEdits>0)_factors.push("artwork");
  if(ti.proof>0)_factors.push("proofing");
  const _extraDays=Object.values(ti).reduce((s,v)=>s+(v||0),0);
  const _hasExtra=_extraDays>=1&&_factors.length>0;

  if(compact){
    const moneyC=Math.max(0,total).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    const [dC,cC]=moneyC.split(".");
    return(
      <div>
        <div onClick={onToggleExpand} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:hasRush?CK.rush:CK.cyan,borderRadius:expanded?"6px 6px 0 0":6,padding:"8px 14px",color:hasRush?"#333":"#fff",cursor:"pointer",WebkitTapHighlightColor:"transparent"}}>
          <div>
            <div style={{lineHeight:1,display:"flex",alignItems:"baseline",gap:6}}>
              {saleActive&&<span style={{fontSize:13,opacity:.6,textDecoration:"line-through",fontWeight:600}}>${totalWithoutSale.toFixed(2)}</span>}
              <span style={{fontSize:22,fontWeight:800}}>${dC}</span>
              <span style={{fontSize:13,fontWeight:600,opacity:.7,marginLeft:1}}>.{cC}</span>
            </div>
            {saleActive&&<div style={{fontSize:9,fontWeight:700,marginTop:1,letterSpacing:".5px",textTransform:"uppercase"}}>{saleLabel} · Save ${saleAmount.toFixed(2)}</div>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            {[["$/ea",Math.max(0,perUnit).toFixed(2)],["Qty",tQ.toLocaleString()],[(requestedDate||hasRush)?"Delivery":"Avail.",deliveryDate||availRange+" days"]].map(([l,v],i)=>(
              <div key={i} style={{textAlign:"center"}}>
                <div style={{fontSize:8.5,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",opacity:.7}}>{l}</div>
                <div style={{fontSize:13,fontWeight:700}}>{v}</div>
              </div>
            ))}
            <div style={{fontSize:10,opacity:.5,marginLeft:2,transition:"transform .2s",transform:expanded?"rotate(180deg)":"none"}}>▼</div>
          </div>
        </div>
        {expanded&&<div style={{background:"#fff",borderRadius:"0 0 6px 6px",border:`1px solid ${CC.border}`,borderTop:"none",maxHeight:"40vh",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
          {_hasExtra&&<div style={{padding:"5px 14px",borderBottom:`1px solid ${CC.border}`,background:"#fffbeb"}}>
            <div style={{fontSize:10.5,color:"#92400e",lineHeight:1.4}}>+{Math.round(_extraDays)} day{Math.round(_extraDays)!==1?"s":""} due to {_factors.join(", ")}</div>
          </div>}
          {sh&&sh.freeDeliveryDate&&<div style={{padding:"6px 14px",borderBottom:`1px solid ${CC.border}`,background:"#fafafa"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:10.5,color:CC.light}}>Free delivery by</span>
              <span style={{fontSize:11,fontWeight:600,color:CC.mid}}>{sh.freeDeliveryDate}</span>
            </div>
          </div>}
          <div style={{padding:"6px 12px"}}>{bd.map((r,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"2.5px 0"}}>
            <span style={{fontSize:11,color:CC.light}}>{r.l}</span>
            <span style={{fontSize:11,fontWeight:600,color:r.v<0?CK.cyan:CC.mid}}>{r.v<0?"−":""}${Math.abs(r.v).toFixed(2)}</span>
          </div>))}</div>
        </div>}
      </div>
    );
  }

  const moneyD=Math.max(0,total).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const [dD,cD]=moneyD.split(".");
  return(
    <div style={{...ST.pnl, pointerEvents: "none"}}>
      <div style={{padding:"22px 20px 18px",background:hasRush?`linear-gradient(135deg, ${CK.rush} 0%, ${CK.rush}dd 100%)`:`linear-gradient(135deg, ${CK.cyan} 0%, ${CK.cyan}dd 100%)`,color:hasRush?"#333":"#fff",pointerEvents:"none"}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",opacity:.8,marginBottom:4}}>{hasRush?"Rush Total":"Estimated Total"}</div>
        <div style={{lineHeight:1,display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap"}}>
          {saleActive&&<span style={{fontSize:18,opacity:.55,textDecoration:"line-through",fontWeight:700,letterSpacing:"-.5px"}}>${totalWithoutSale.toFixed(2)}</span>}
          <span style={{fontSize:38,fontWeight:800,letterSpacing:"-1.5px"}}>${dD}</span>
          <span style={{fontSize:22,fontWeight:700,opacity:.7,letterSpacing:"-0.5px",marginLeft:-9}}>.{cD}</span>
          {saleActive&&<span style={{display:"inline-block",background:CK.magenta,color:"#fff",fontSize:11,fontWeight:800,letterSpacing:".5px",padding:"3px 8px",borderRadius:4,textTransform:"uppercase"}}>{saleLabel} · Save ${saleAmount.toFixed(2)}</span>}
        </div>
        {hasRush&&<div style={{fontSize:13.5,fontWeight:800,marginTop:6,letterSpacing:".2px"}}>Delivery by {sh.needByFmt}</div>}
        {hasRush&&debugUnlocked&&<div style={{fontSize:12,opacity:.75,marginTop:4}}>Base ${baseTotal.toFixed(2)} + Rush ${sh.rushCost.toFixed(2)} ({sh.rushMultiplier.toFixed(2)}×)</div>}
      </div>
      <div style={{display:"flex",borderBottom:`1px solid ${CC.border}`}}>
        {[["Per Unit","$"+Math.max(0,perUnit).toFixed(2)],["Qty",tQ.toLocaleString()]].map(([l,v],i)=>(
          <div key={i} style={{flex:1,padding:"11px 8px",textAlign:"center",borderRight:`1px solid ${CC.border}`}}>
            <div style={{fontSize:9.5,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",color:CC.light,marginBottom:1}}>{l}</div>
            <div style={{fontSize:14.5,fontWeight:700,color:CC.dark}}>{v}</div>
          </div>
        ))}
        <div style={{flex:1,padding:"11px 8px",textAlign:"center",background:_hasExtra?"#fffbeb":"transparent",transition:"background .3s"}}>
          <div style={{fontSize:9.5,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",color:_hasExtra?"#92400e":CC.light,marginBottom:1}}>{(requestedDate||hasRush)?"Delivery by":"Availability"}</div>
          <div style={{fontSize:13.5,fontWeight:700,color:_hasExtra?"#b45309":CC.dark}}>{deliveryDate||availRange+" days"}</div>
        </div>
      </div>
      {_hasExtra&&<div style={{padding:"5px 18px",borderBottom:`1px solid ${CC.border}`,background:"#fffbeb"}}>
        <div style={{fontSize:10.5,color:"#92400e",lineHeight:1.4}}>* +{Math.round(_extraDays)} day{Math.round(_extraDays)!==1?"s":""} due to {_factors.join(", ")}</div>
      </div>}
      {sh&&<div style={{padding:"8px 18px",borderBottom:`1px solid ${CC.border}`,background:"#fafafa",pointerEvents:"none"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:11,color:CC.light}}>Free delivery by</span>
          <span style={{fontSize:11.5,fontWeight:600,color:CC.mid}}>{sh.freeDeliveryDate}</span>
        </div>
      </div>}
      {hasRush&&debugUnlocked&&<div style={{padding:"14px 18px"}}>
        <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}><span style={{width:7,height:7,borderRadius:"50%",background:CK.rush}}/><span style={{fontSize:13,color:CC.mid}}>Rush Surcharge</span></div>
          <span style={{fontSize:13,fontWeight:600,color:CK.rush}}>+${sh.rushCost.toFixed(2)}</span>
        </div>
      </div>}
      {debugUnlocked&&<details style={{borderTop:`1px solid ${CC.border}`,pointerEvents:"auto"}}><summary style={{padding:"10px 18px",fontSize:10.5,color:CC.light,cursor:"pointer",fontWeight:600,letterSpacing:".5px",textTransform:"uppercase"}}>Line Items</summary>
        <div style={{padding:"0 18px 14px"}}>{bd.map((r,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
          <span style={{fontSize:11.5,color:CC.light}}>{r.l}</span>
          <span style={{fontSize:11.5,fontWeight:600,color:r.v<0?CK.cyan:CC.mid}}>{r.v<0?"−":""}${Math.abs(r.v).toFixed(2)}</span>
        </div>))}</div>
      </details>}
    </div>
  );
}

function DebugPanel({debug}){
  if(!debug)return null;
  const d=debug;
  const t=d.turnaround;
  const ab=t.addonBreakdown;
  const arb=t.artBreakdown;

  const Row=({label,value,unit,indent})=>(
    <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0",paddingLeft:indent?16:0}}>
      <span style={{fontSize:11,color:indent?"#888":"#666"}}>{label}</span>
      <span style={{fontSize:11,fontFamily:"'SF Mono','Consolas',monospace",color:CK.cyan,fontWeight:indent?400:600}}>{typeof value==="number"?
        (Number.isInteger(value)?value.toLocaleString():value.toFixed(4)):
        typeof value==="boolean"?(value?"✓ yes":"✗ no"):String(value)}{unit?` ${unit}`:""}</span>
    </div>
  );
  const Hdr=({children})=><div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#999",padding:"8px 0 3px",borderBottom:"1px solid #eee",marginTop:6}}>{children}</div>;
  const Flag=({label,value})=>(
    <span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:10.5,padding:"2px 7px",borderRadius:3,marginRight:4,marginBottom:3,
      background:value?"#e0f2fa":"#f5f5f5",color:value?CK.cyan:"#bbb",fontWeight:value?600:400,border:`1px solid ${value?"#b3dff0":"#e5e5e5"}`}}>
      {value?"✓":"✗"} {label}
    </span>
  );

  return(
    <div style={{...ST.pnl,marginTop:10}}>
      <div style={{padding:"10px 16px",background:"#1a1a1a",borderBottom:"1px solid #333",display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",color:"#888"}}>⚙ Debug</span>
        <span style={{fontSize:9,color:"#555",fontStyle:"italic"}}>Backend calculation values</span>
      </div>
      <div style={{padding:"10px 16px",fontSize:11}}>

        <Hdr>Sheet Calculation</Hdr>
        {d.perSetSheets.map((s,i)=><Row key={i} label={`${s.name}: ${s.qty.toLocaleString()} qty × ${s.pages} pg ÷ 4`} value={s.bookletSheets} unit="booklet sheets" indent/>)}
        <Row label="Booklet sheets total (Σ)" value={d.bookletSheetsTotal} unit="sheets"/>
        <Row label="Imposition (imp)" value={d.imp} unit={`(÷${d.impHalf} for parent)`}/>
        <Row label="Press sheet" value={d.pressSheet}/>
        <Row label={`Parent ${d.pressSheet} sheets (totalSheets)`} value={d.parentSheets} unit="sheets"/>

        <Hdr>Volume & Pricing</Hdr>
        <Row label="Total quantity" value={d.totalQty} unit="pcs"/>
        <Row label="Total pages" value={d.totalPages} unit="pg"/>
        <Row label="Discount log" value={d.discountLog}/>
        <Row label="Markup multiplier" value={d.markup} unit="×"/>
        <Row label="Cover markup" value={d.coverMarkup} unit="×"/>
        <Row label="Spine thickness (proxy)" value={d.spineThickness}/>
        <Row label="Materials subtotal" value={d.materialsSubtotal} unit="$"/>

        <Hdr>Size & Binding</Hdr>
        <Row label="Binding edge" value={d.bindingEdge} unit="inches"/>
        <Row label="Binding mode" value={d.bindMode || "perfect bound"}/>
        <Row label="Bind quantity" value={d.bindQty} unit="units"/>
        {d.outfoldLabel && d.outfoldLabel !== "No Outfold" && <Row label="Outfold" value={d.outfoldLabel}/>}
        {d.perforationLabel && d.perforationLabel !== "No Perforation" && <Row label="Perforation" value={d.perforationLabel}/>}
        <div style={{padding:"4px 0",display:"flex",flexWrap:"wrap"}}>
          <Flag label="Custom size" value={d.isCustom}/>
          <Flag label="Easy size" value={d.easySize}/>
          <Flag label="Low yield (imp<1)" value={d.lowYield}/>
        </div>

        <Hdr>Paper & Cover</Hdr>
        <Row label="Cover paper used" value={d.coverPaperUsed}/>
        <Row label="Coat eligibility paper" value={d.coatPaperLabel}/>
        <div style={{padding:"4px 0",display:"flex",flexWrap:"wrap"}}>
          <Flag label="Inside inventory" value={d.insideInventory}/>
          <Flag label="Cover inventory" value={d.coverInventory}/>
          <Flag label="Cover scoring" value={d.coverNeedsScoring}/>
          <Flag label="Cardstock inside" value={d.cardstockInsideActive}/>
          <Flag label="Coating eligible" value={d.coatingEligible}/>
          <Flag label="Hardcopy eligible" value={d.hardcopyEligible}/>

        {ab.vivid>0&&<Row label="  Vivid" value={ab.vivid} unit="days" indent/>}
        {ab.coating>0&&<Row label="  Coating" value={ab.coating} unit="days" indent/>}
        {ab.bundling>0&&<Row label="  Bundling" value={ab.bundling} unit="days" indent/>}
        {ab.roundCorner>0&&<Row label="  Round corner" value={ab.roundCorner} unit="days" indent/>}
        <Row label="Artwork days (total)" value={t.artworkDays} unit="days"/>
        {arb.designTime>0&&<Row label="  Design time" value={arb.designTime} unit="days" indent/>}
        {arb.editTime>0&&<Row label="  Edit time" value={arb.editTime} unit="days" indent/>}
        {arb.bleedTime>0&&<Row label="  Bleed time" value={arb.bleedTime} unit="days" indent/>}
        {arb.proofTime>0&&<Row label="  Proof time" value={arb.proofTime} unit="days" indent/>}
        <div style={{marginTop:6,padding:"6px 8px",background:"#f8f8f8",borderRadius:4,border:"1px solid #eee"}}>
          <div style={{fontSize:10,color:"#999",marginBottom:2}}>floor( {t.baseDays} + {t.paperDays} + {t.addonDays} + {t.artworkDays} ) = floor({t.preFloor.toFixed(4)}) → max({d.minDaysConfig||3}, {Math.floor(t.preFloor)})</div>
          <div style={{fontSize:13,fontWeight:700,color:CK.cyan}}>{t.totalDays} days</div>
        </div>
      </div>
    </div>
  );
}

async function extractPdfPages(file, onProgress) {
  const buf = await file.arrayBuffer();
  await window.__ppsPdfJs;
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  window.PPS_PDF_RISKS = {};
  // Runs before the page renders below, so those reuse the operator lists this builds.
  window.PPS_PDF_RISKS.doc = await window.ppsAnalyzePdfRisks(pdf);
  const result = [];
  // Get dimensions from first page (PDF units = 1/72 inch)
  const firstPg = await pdf.getPage(1);
  const [x0, y0, x1, y1] = firstPg.view;
  const pdfW = parseFloat(((x1 - x0) / 72).toFixed(3));
  const pdfH = parseFloat(((y1 - y0) / 72).toFixed(3));
  const pxW = Math.round(x1 - x0), pxH = Math.round(y1 - y0);

  for (let i = 1; i <= pdf.numPages; i++) {
    if (onProgress) onProgress(i, pdf.numPages);
    const pg = await pdf.getPage(i);
    const vp = pg.getViewport({ scale: 1.5 });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await pg.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    const url = canvas.toDataURL("image/jpeg", 0.8);
    let label = pageLabel(i - 1, pdf.numPages);
    result.push({ dataUrl: url, label });
  }
  return { pages: result, dims: { wIn: pdfW, hIn: pdfH, wPx: pxW, hPx: pxH, source: "pdf" }, pdfDoc: pdf };
}

// Split a reader's-spread PDF into single pages. Any page wider than ~1.5× the
// booklet trim width is treated as a 2-up spread and cut down the middle (left
// half, then right half); narrower pages (standalone cover/back) pass through
// unchanged. Splitting in document order reconstructs correct reading order.
// Rendered at print DPI and returned as an "image" source so the existing
// single-page pipeline (proof, per-page transforms, print-ready) needs no changes.
async function splitReaderSpreads(pdfDoc, refWidthIn, onProgress) {
  const DPI = 300;
  const pages = [];
  let sW = 0, sH = 0;
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (onProgress) onProgress(i, pdfDoc.numPages);
    const pg = await pdfDoc.getPage(i);
    const [x0, y0, x1, y1] = pg.view;
    const pwIn = (x1 - x0) / 72, phIn = (y1 - y0) / 72;
    const isSpread = refWidthIn > 0 && pwIn > refWidthIn * 1.5;
    const vp = pg.getViewport({ scale: DPI / 72 });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    await pg.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    if (isSpread) {
      const halfW = Math.floor(canvas.width / 2);
      for (let s = 0; s < 2; s++) {
        const c = document.createElement("canvas");
        c.width = halfW; c.height = canvas.height;
        c.getContext("2d").drawImage(canvas, s === 0 ? 0 : canvas.width - halfW, 0, halfW, canvas.height, 0, 0, halfW, canvas.height);
        pages.push({ dataUrl: c.toDataURL("image/jpeg", 0.85) });
      }
      if (!sW) { sW = pwIn / 2; sH = phIn; }
    } else {
      pages.push({ dataUrl: canvas.toDataURL("image/jpeg", 0.85) });
      if (!sW) { sW = pwIn; sH = phIn; }
    }
  }
  pages.forEach((p, idx) => { p.label = pageLabel(idx, pages.length); });
  return {
    pages,
    dims: { wIn: +sW.toFixed(3), hIn: +sH.toFixed(3), wPx: Math.round(sW * DPI), hPx: Math.round(sH * DPI), source: "image" },
    pdfDoc: null,
  };
}

async function extractImagePages(files, onProgress) {
  const sorted = Array.from(files).filter(f => f.type.startsWith("image/"))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  const result = [];
  let imgW = 0, imgH = 0;
  for (let i = 0; i < sorted.length; i++) {
    if (onProgress) onProgress(i + 1, sorted.length);
    const url = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(sorted[i]); });
    if (!url) continue;
    if (i === 0) {
      const d = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth, h: img.naturalHeight }); img.onerror = () => rej(new Error("Image load failed")); img.src = url; }).catch(() => ({ w: 0, h: 0 }));
      imgW = d.w; imgH = d.h;
    }
    let label = pageLabel(i, sorted.length);
    result.push({ dataUrl: url, label });
  }
  // Estimate at 300 DPI
  const wIn = imgW > 0 ? parseFloat((imgW / 300).toFixed(3)) : 0;
  const hIn = imgH > 0 ? parseFloat((imgH / 300).toFixed(3)) : 0;
  return { pages: result, dims: { wIn, hIn, wPx: imgW, hPx: imgH, source: "image" } };
}

function BookClosed3D({ pages, bookW, bookH, spineW, rotateX: rX, rotateY: rY, scale, fitMode }) {
  if (!pages.length) return null;
  const isSaddle = spineW <= 0;
  // Saddlestitch: derive visual thickness from page count (exaggerated for 3D effect)
  const saddleDepth = isSaddle ? Math.max(2, pages.length * 0.3) : 0;
  const halfDepth = isSaddle ? saddleDepth / 2 : Math.max(1, spineW / 2);
  const bgFit = fitMode === "stretch" ? "100% 100%" : fitMode === "contain" ? "contain" : "cover"; // stretch distorts via explicit dimensions
  const edgeGrad = "linear-gradient(180deg,#f5f0e8,#e8e0d4,#f0ebe3)";
  // Page-edge texture: repeating thin lines to suggest individual pages
  const pageEdgeBg = `repeating-linear-gradient(${isSaddle ? "0deg" : "90deg"},#f5f0e8 0px,#e8e0d4 1px,#f0ebe3 2px)`;
  return (
    <div className="bp-scene" style={{ transform: `scale(${scale}) rotateX(${rX}deg) rotateY(${rY}deg)` }}>
      <div className="bp-closed" style={{ width: bookW, height: bookH, "--half-depth": halfDepth + "px", transformStyle: "preserve-3d" }}>
        <div className="bp-face front" style={{ width: bookW, height: bookH, backgroundImage: `url(${pages[0].dataUrl})`, backgroundSize: bgFit, backgroundColor: "#f8f5f0", borderRadius: isSaddle ? "1px 4px 4px 1px" : "0 4px 4px 0" }} />
        <div className="bp-face back" style={{ width: bookW, height: bookH, backgroundImage: `url(${pages[pages.length - 1].dataUrl})`, backgroundSize: bgFit, backgroundColor: "#f8f5f0", borderRadius: isSaddle ? "4px 1px 1px 4px" : "4px 0 0 4px" }} />
        {!isSaddle && <>
          <div className="bp-face spine" style={{ width: spineW, height: bookH }} />
          <div className="bp-face top-edge" style={{ width: bookW, height: spineW, background: edgeGrad }} />
          <div className="bp-face bottom-edge" style={{ width: bookW, height: spineW, background: edgeGrad }} />
          <div className="bp-face fore-edge" style={{ width: spineW, height: bookH, background: edgeGrad }} />
        </>}
        {isSaddle && <>
          {/* Top edge — page edges visible from above */}
          <div className="bp-face top-edge" style={{ width: bookW, height: saddleDepth, background: pageEdgeBg }} />
          {/* Bottom edge */}
          <div className="bp-face bottom-edge" style={{ width: bookW, height: saddleDepth, background: pageEdgeBg }} />
          {/* Fore edge (right side) — page edges */}
          <div className="bp-face fore-edge" style={{ width: saddleDepth, height: bookH, background: pageEdgeBg }} />
          {/* Spine edge (left side, staple side) — slightly darker */}
          <div style={{
            position: "absolute", width: saddleDepth, height: bookH,
            transform: `rotateY(-90deg) translateX(-${halfDepth}px)`, transformOrigin: "left center",
            background: "linear-gradient(90deg,#d8d0c4,#cec6ba,#d8d0c4)",
            backfaceVisibility: "hidden",
          }} />
        </>}
      </div>
    </div>
  );
}

// ── Flat dimensioned "spec" drawing shown in the preview card before artwork is
//    uploaded. Charts width × height with dimension lines; for booklets, marks the
//    bind (spine) edge. Swapped for the 3D render as soon as art is added.
function DimSpec({ wIn, hIn, bindEdge, bindLabel }) {
  const VW = 320, VH = 190;
  const padL = 20, padT = 20, padR = 46, padB = 34;
  const availW = VW - padL - padR, availH = VH - padT - padB;
  const w = Math.max(0.1, Number(wIn) || 1), h = Math.max(0.1, Number(hIn) || 1);
  const scale = Math.min(availW / w, availH / h);
  const sw = w * scale, sh = h * scale;
  const x0 = padL + (availW - sw) / 2, y0 = padT + (availH - sh) / 2;
  const L = "#6fb2ff", T = "#eef4fb";
  const fmt = n => (Math.round((Number(n) || 0) * 100) / 100).toString();
  const dimYB = y0 + sh + 15, dimXR = x0 + sw + 16;
  const be = Number(bindEdge) || 0;
  const spineV = be > 0 && Math.abs(be - h) <= Math.abs(be - w);
  const spineH = be > 0 && !spineV;
  const ah = (x, y, d) =>
    d === "l" ? `M${x+5},${y-3} L${x},${y} L${x+5},${y+3}` :
    d === "r" ? `M${x-5},${y-3} L${x},${y} L${x-5},${y+3}` :
    d === "u" ? `M${x-3},${y+5} L${x},${y} L${x+3},${y+5}` :
                `M${x-3},${y-5} L${x},${y} L${x+3},${y-5}`;
  return (
    <svg width="100%" height="100%" viewBox={`0 0 ${VW} ${VH}`} preserveAspectRatio="xMidYMid meet" style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      <rect x={x0} y={y0} width={sw} height={sh} fill="#f4efe2" stroke="#cfd8e3" strokeWidth="1" rx="1.5" />
      <rect x={x0+6} y={y0+6} width={Math.max(0, sw-12)} height={Math.max(0, sh-12)} fill="none" stroke="rgba(20,28,40,.14)" strokeWidth="0.75" strokeDasharray="3 3" />
      {spineV && <g>
        <line x1={x0} y1={y0} x2={x0} y2={y0+sh} stroke="#6b7890" strokeWidth="3" />
        <text x={x0+10} y={y0+sh/2} fill="#8492a8" fontFamily="Segoe UI, sans-serif" fontSize="7.5" fontWeight="800" letterSpacing="2" textAnchor="middle" transform={`rotate(-90 ${x0+10} ${y0+sh/2})`}>SPINE</text>
      </g>}
      {spineH && <g>
        <line x1={x0} y1={y0} x2={x0+sw} y2={y0} stroke="#6b7890" strokeWidth="3" />
        <text x={x0+sw/2} y={y0+12} fill="#8492a8" fontFamily="Segoe UI, sans-serif" fontSize="7.5" fontWeight="800" letterSpacing="2" textAnchor="middle">SPINE</text>
      </g>}
      <line x1={x0} y1={y0+sh+3} x2={x0} y2={dimYB+3} stroke={L} strokeWidth="0.6" opacity="0.5" />
      <line x1={x0+sw} y1={y0+sh+3} x2={x0+sw} y2={dimYB+3} stroke={L} strokeWidth="0.6" opacity="0.5" />
      <line x1={x0} y1={dimYB} x2={x0+sw} y2={dimYB} stroke={L} strokeWidth="1.2" />
      <path d={ah(x0,dimYB,"l")} fill="none" stroke={L} strokeWidth="1.2" />
      <path d={ah(x0+sw,dimYB,"r")} fill="none" stroke={L} strokeWidth="1.2" />
      <text x={x0+sw/2} y={dimYB+13} fill={T} fontFamily="Segoe UI, sans-serif" fontSize="11" fontWeight="700" textAnchor="middle">{fmt(w)}″</text>
      <line x1={x0+sw+3} y1={y0} x2={dimXR+3} y2={y0} stroke={L} strokeWidth="0.6" opacity="0.5" />
      <line x1={x0+sw+3} y1={y0+sh} x2={dimXR+3} y2={y0+sh} stroke={L} strokeWidth="0.6" opacity="0.5" />
      <line x1={dimXR} y1={y0} x2={dimXR} y2={y0+sh} stroke={L} strokeWidth="1.2" />
      <path d={ah(dimXR,y0,"u")} fill="none" stroke={L} strokeWidth="1.2" />
      <path d={ah(dimXR,y0+sh,"d")} fill="none" stroke={L} strokeWidth="1.2" />
      <text x={dimXR+5} y={y0+sh/2+4} fill={T} fontFamily="Segoe UI, sans-serif" fontSize="11" fontWeight="700" textAnchor="start">{fmt(h)}″</text>
    </svg>
  );
}

    return () => document.removeEventListener("mousedown", h);
  }, [open]);
