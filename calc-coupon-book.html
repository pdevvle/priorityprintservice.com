// DOWNLOADABLE ARTWORK TEMPLATE (jsPDF)
// ═══════════════════════════════════════════════════════════════

const PPS_LOGO_B64 = (window.PPS_CONFIG || {}).logoUrl || "";

function generateTemplate(trimW, trimH, pageCount, sizeLabel, roundCorner) {
  try {
    if (!window.jspdf) { alert("PDF library not loaded. Please refresh the page."); return; }
    const { jsPDF } = window.jspdf;
    const bleed = 0.125;
    const safety = 0.125;
    const docW = trimW + bleed * 2;
    const docH = trimH + bleed * 2;
    const pdf = new jsPDF({
      orientation: docW > docH ? "l" : "p",
      unit: "in",
      format: [docW, docH],
    });

    // Round corner params
    const rcVal = roundCorner || 0;
    const rcRadius = (rcVal === 216 || rcVal === 108) ? 0.25 : (rcVal === 215 || rcVal === 107) ? 0.375 : 0;
    const rcAll4 = rcVal === 108 || rcVal === 107;
    const rcOutside2 = rcVal === 216 || rcVal === 215;

    for (let pg = 0; pg < pageCount; pg++) {
      if (pg > 0) pdf.addPage([docW, docH], docW > docH ? "l" : "p");

      // Light grey bleed zone background
      pdf.setFillColor(240, 240, 240);
      pdf.rect(0, 0, docW, docH, "F");

      // White trim area
      pdf.setFillColor(255, 255, 255);
      pdf.rect(bleed, bleed, trimW, trimH, "F");

      // Bleed line — red solid at document edge
      pdf.setDrawColor(229, 62, 62);
      pdf.setLineWidth(0.012);
      pdf.rect(0.006, 0.006, docW - 0.012, docH - 0.012, "S");

      // Trim line — black dashed (with rounded corners if selected)
      pdf.setDrawColor(30, 30, 30);
      pdf.setLineWidth(0.01);
      if (rcRadius > 0) {
        drawDashedRoundedRect(pdf, bleed, bleed, trimW, trimH, rcRadius, rcAll4, 0.08, 0.05);
      } else {
        drawDashedRect(pdf, bleed, bleed, trimW, trimH, 0.08, 0.05);
      }

      // Safety line — green dashed (with rounded corners if selected)
      pdf.setDrawColor(56, 161, 105);
      pdf.setLineWidth(0.008);
      if (rcRadius > 0) {
        drawDashedRoundedRect(pdf, bleed + safety, bleed + safety, trimW - safety * 2, trimH - safety * 2, Math.max(0, rcRadius - safety), rcAll4, 0.05, 0.03);
      } else {
        drawDashedRect(pdf, bleed + safety, bleed + safety, trimW - safety * 2, trimH - safety * 2, 0.05, 0.03);
      }

      // Bound edge indicator — perfect bound: spine always on left
      var spineLeft = true;
      var spineX = bleed;
      pdf.setDrawColor(59, 130, 246);
      pdf.setLineWidth(0.025);
      pdf.line(spineX, bleed + 0.15, spineX, bleed + trimH - 0.15);
      // Glue edge marks (perfect bound spine)
      var stapleY1 = bleed + trimH * 0.25;
      var stapleY2 = bleed + trimH * 0.50;
      var stapleY3 = bleed + trimH * 0.75;
      pdf.setLineWidth(0.015);
      pdf.line(spineX - 0.04, stapleY1, spineX + 0.04, stapleY1);
      pdf.line(spineX - 0.04, stapleY2, spineX + 0.04, stapleY2);
      pdf.line(spineX - 0.04, stapleY3, spineX + 0.04, stapleY3);
      // Label — rotated vertically along the spine
      pdf.setFontSize(5.5);
      pdf.setTextColor(59, 130, 246);
      var labelX = bleed - 0.06;
      pdf.text("SPINE / GLUE EDGE", labelX, bleed + trimH / 2, { angle: 90, align: "center" });

      // Logo watermark — tiled step-repeat across the page within safety area
      var tileSize = Math.min(trimW * 0.18, 1.0); // each tile ~1" or 18% of trim width
      var tileGap = tileSize * 0.6; // gap between tiles
      var tileStep = tileSize + tileGap;
      var safeLeft = bleed + safety;
      var safeTop = bleed + safety;
      var safeRight = bleed + trimW - safety;
      var safeBottom = bleed + trimH - safety;
      var safeW = safeRight - safeLeft;
      var safeH = safeBottom - safeTop;
      var cols = Math.floor(safeW / tileStep);
      var rows = Math.floor(safeH / tileStep);
      // Center the grid within safety
      var gridW = cols * tileStep - tileGap;
      var gridH = rows * tileStep - tileGap;
      var offsetX = safeLeft + (safeW - gridW) / 2;
      var offsetY = safeTop + (safeH - gridH) / 2;
      pdf.saveGraphicsState();
      pdf.setGState(new pdf.GState({ opacity: 0.06 }));
      for (var row = 0; row < rows; row++) {
        for (var col = 0; col < cols; col++) {
          var tx = offsetX + col * tileStep;
          var ty = offsetY + row * tileStep;
          try { pdf.addImage(PPS_LOGO_B64, "PNG", tx, ty, tileSize, tileSize); } catch(e) {}
          // URL text below each logo tile
          pdf.setFontSize(tileSize * 4.5);
          pdf.setTextColor(180, 180, 180);
          pdf.text("PriorityPrintService.com", tx + tileSize / 2, ty + tileSize + tileSize * 0.12, { align: "center" });
        }
      }
      pdf.restoreGraphicsState();

      // Page label — centered
      var cx = docW / 2;
      var labelY = docH / 2 - 0.1;
      pdf.setFontSize(10);
      pdf.setTextColor(170, 170, 170);
      var pgLabel = pageLabel(pg, pageCount);
      pdf.text(pgLabel, cx, labelY, { align: "center" });

      // Dimension info
      pdf.setFontSize(7);
      pdf.setTextColor(190, 190, 190);
      pdf.text("Trim: " + trimW + '" \u00d7 ' + trimH + '"  |  With bleeds: ' + docW.toFixed(3) + '" \u00d7 ' + docH.toFixed(3) + '"', cx, labelY + 0.18, { align: "center" });

      // Website URL — bottom center
      pdf.setFontSize(7);
      pdf.setTextColor(150, 150, 150);
      pdf.text("priorityprintservice.com", cx, docH - bleed - 0.08, { align: "center" });

      // Legend on first page
      if (pg === 0) {
        var lx = bleed + safety + 0.1;
        var ly = docH - bleed - 0.42;
        pdf.setFontSize(6);
        pdf.setTextColor(229, 62, 62);
        pdf.text("\u2014 Bleed (extend backgrounds to this edge)", lx, ly - 0.30);
        pdf.setTextColor(30, 30, 30);
        pdf.text("- - Trim (cut line)", lx, ly - 0.21);
        pdf.setTextColor(56, 161, 105);
        pdf.text("- - Safety (keep all text inside this line)", lx, ly - 0.12);
        pdf.setTextColor(59, 130, 246);
        pdf.text("\u2014 Spine / glue edge (perfect bound)", lx, ly - 0.03);
      }
    }

    var safeName = (sizeLabel || (trimW + "x" + trimH)).replace(/[^a-zA-Z0-9._-]/g, "_");
    pdf.save("PPS_PerfBound_Template_" + safeName + "_" + pageCount + "pg.pdf");
  } catch(e) {
    console.error("Template generation failed:", e);
    alert("Template generation failed: " + e.message);
  }
}

// Draw a dashed rectangle using individual line segments
function drawDashedRect(pdf, x, y, w, h, dashLen, gapLen) {
  drawDashedLine(pdf, x, y, x + w, y, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y, x + w, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y + h, x, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x, y + h, x, y, dashLen, gapLen);
}

function drawDashedLine(pdf, x1, y1, x2, y2, dashLen, gapLen) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len === 0) return;
  var ux = dx / len, uy = dy / len;
  var pos = 0;
  var drawing = true;
  while (pos < len) {
    var segLen = drawing ? dashLen : gapLen;
    if (pos + segLen > len) segLen = len - pos;
    if (drawing) {
      pdf.line(x1 + ux * pos, y1 + uy * pos, x1 + ux * (pos + segLen), y1 + uy * (pos + segLen));
    }
    pos += segLen;
    drawing = !drawing;
  }
}

// Draw a dashed rounded rectangle

  // Top-right corner arc
  if (tr > 0) drawDashedArc(pdf, x + w - tr, y + tr, tr, -90, 0, dashLen, gapLen);
  // Right edge
  drawDashedLine(pdf, x + w, y + tr, x + w, y + h - br, dashLen, gapLen);
  // Bottom-right corner arc
  if (br > 0) drawDashedArc(pdf, x + w - br, y + h - br, br, 0, 90, dashLen, gapLen);

  drawDashedLine(pdf, x + w - br, y + h, x + bl, y + h, dashLen, gapLen);

// Draw a dashed arc (quarter circle) for rounded corners

    var t = i / steps;
    var angle = (startDeg + (endDeg - startDeg) * t) * Math.PI / 180;
    var px = cx + Math.cos(angle) * r;
    var py = cy + Math.sin(angle) * r;

        setPageTransforms({});
      }
      if (onCoverArt && extracted.pages.length >= 1) onCoverArt(extracted.pages[0].dataUrl);
      if (onPagesDetected && extracted.pages.length >= 2) {
        // Perfect bound: round up to next even page count, min 20
        let pg = extracted.pages.length % 2 === 0 ? extracted.pages.length : extracted.pages.length + 1;
        if (pg < 20) pg = 20;
        onPagesDetected(pg);
      }
      // Store raw file for the 4-deliverable package
      rawFileRef.current = fileList[0];
      if (onArtwork) onArtwork({ type: "files", list: [fileList[0]] });
      setSlotsOpen(true);
      setArtApproved(false); setApprovalPkg(null);
    } catch (err) { console.error("Extraction error:", err); }
    setLoading(false); setLoadingProgress(null);
  }

  function handleFiles(e) { processFiles(e.target.files); }

  function handleDrop(e) {
    e.preventDefault(); e.stopPropagation();
    setDropHover(false);
    processFiles(e.dataTransfer.files);
  }

  function handleDragOver(e) { e.preventDefault(); e.stopPropagation(); setDropHover(true); }
  function handleDragLeave(e) { e.preventDefault(); e.stopPropagation(); setDropHover(false); }

  function handleClear() {
    setRawPages([]); setFileName(""); setUploadPageCount(0);
    setArtDims(null); setPreviewMode("closed"); setSpread(0); setActiveModal(null);
    setRotatedCache({ key: "", pages: [] }); setPageTransforms({});
    setEdgeHasMargins(null); setHiResProof(null); setArtApproved(false); setApprovalPkg(null);
    pdfDocRef.current = null;
    slotFilesRef.current = {};
    rawFileRef.current = null;
    if (onArtwork) onArtwork({ type: "none" });
    if (onCoverArt) onCoverArt(null);
  }

  // Drag rotation
  function onPointerDown(e) { e.preventDefault(); dragRef.current = { active: true, sx: e.clientX, sy: e.clientY, bx: rot.x, by: rot.y }; }
  function onPointerMove(e) {
    if (!dragRef.current.active) return;
    const d = dragRef.current;
    setRot({ x: Math.max(-60, Math.min(60, d.bx - (e.clientY - d.sy) * 0.3)), y: d.by + (e.clientX - d.sx) * 0.4 });
  }
  useEffect(() => {
    if (!expanded) return;
    const up = () => { dragRef.current.active = false; };
    document.addEventListener("mouseup", up); document.addEventListener("mousemove", onPointerMove);
    return () => { document.removeEventListener("mouseup", up); document.removeEventListener("mousemove", onPointerMove); };
  }, [expanded, rot]);
  useEffect(() => {
    if (activeModal !== "preview" || previewMode !== "open") return;
    const h = (e) => { if (e.key === "ArrowRight" && spread < totalSpreads - 1) setSpread(s => s + 1); else if (e.key === "ArrowLeft" && spread > 0) setSpread(s => s - 1); };
    document.addEventListener("keydown", h); return () => document.removeEventListener("keydown", h);
  }, [activeModal, previewMode, spread, totalSpreads]);
  useEffect(() => {
    if (!expanded) return;
    const h = (e) => { if (e.key === "Escape") setActiveModal(null); };
    document.addEventListener("keydown", h); return () => document.removeEventListener("keydown", h);
  }, [expanded]);

  const hasFile = rawPages.length >= 2 || rawPages.some(p => !p.isBlank);
  const PF = { pass: { dot: "#4ade80", text: "#3a7124" }, warn: { dot: "#fbbf24", text: "#b8860b" }, fail: { dot: "#f87171", text: "#c2185b" }, info: { dot: "#60a5fa", text: "#2563eb" } };

  // Expose an imperative open-preview hook for the sidebar preview card.
  useEffect(() => {
    if (!openPreviewModalRef) return;
    openPreviewModalRef.current = hasFile ? () => { setActiveModal("preview"); setPreviewMode("closed"); setRot({ x: -15, y: -25 }); } : null;
    return () => { if (openPreviewModalRef) openPreviewModalRef.current = null; };
  }, [hasFile, openPreviewModalRef]);

  // ── Per-slot upload logic ──
  const slotInputRef = useRef(null);
  const activeSlotRef = useRef(-1);

  function handleSlotClick(idx) {
    activeSlotRef.current = idx;
    if (slotInputRef.current) { slotInputRef.current.value = ""; slotInputRef.current.click(); }
  }

  async function handleSlotFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const idx = activeSlotRef.current;
    if (idx < 0) return;

    if (file.type === "application/pdf") {
      // PDF dropped on a slot — extract all pages, replace everything
      processFiles([file]);
      return;
    }

    // Single image → insert/replace at slot index
    const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
    if (!dataUrl) return;
    const imgDims = await new Promise((res) => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth, h: img.naturalHeight }); img.onerror = () => res({ w: 0, h: 0 }); img.src = dataUrl; });

    const newPage = { dataUrl, label: pageLabel(idx, pageCount) };

    // Track the original File object for this slot (preserves full quality for submission)
    slotFilesRef.current = { ...slotFilesRef.current, [idx]: file };
    // Build ordered file list from slot map and notify parent
    if (onArtwork) {
      const list = Object.entries(slotFilesRef.current)
        .sort((a, b) => Number(a[0]) - Number(b[0]))
        .map(([i, f]) => new File([f], `page_${String(i).padStart(3,"0")}_${f.name}`, { type: f.type }));
      onArtwork({ type: "files", list });
    }

    setRawPages(prev => {
      // Always maintain full pageCount-length array
      const next = Array.from({ length: pageCount }, (_, j) => {
        if (j < prev.length && prev[j]) return prev[j];
        return { dataUrl: blankPage, label: pageLabel(j, pageCount), isBlank: true };
      });
      next[idx] = newPage;

      // Update dims from first real image if we don't have them yet
      if (!artDims && imgDims.w > 0) {
        const wIn = parseFloat((imgDims.w / 300).toFixed(3));
        const hIn = parseFloat((imgDims.h / 300).toFixed(3));
        setArtDims({ wIn, hIn, wPx: imgDims.w, hPx: imgDims.h, source: "image" });
      }
      return next;
    });

    // Set file info
    if (!fileName) setFileName(`${pageCount} individual pages`);
    setUploadPageCount(prev => Math.max(prev, idx + 1));
    if (idx === 0 && onCoverArt) onCoverArt(dataUrl);
  }

  function handleSlotRemove(idx) {
    // Remove tracked file for this slot
    const updated = { ...slotFilesRef.current };
    delete updated[idx];
    slotFilesRef.current = updated;
    if (onArtwork) {
      const entries = Object.entries(updated);
      if (entries.length > 0) {
        const list = entries.sort((a, b) => Number(a[0]) - Number(b[0]))
          .map(([i, f]) => new File([f], `page_${String(i).padStart(3,"0")}_${f.name}`, { type: f.type }));
        onArtwork({ type: "files", list });
      } else {
        onArtwork({ type: "none" });
      }
    }

    setRawPages(prev => {
      const next = [...prev];
      if (idx < next.length) {
        next[idx] = { dataUrl: blankPage, label: pageLabel(idx, pageCount), isBlank: true };
      }
      // If ALL pages are now blank, clear everything
      if (next.every(p => p.isBlank)) {
        handleClear();
        return [];
      }
      return next;
    });
    if (idx === 0 && onCoverArt) onCoverArt(null);
  }

  function handleSlotDrop(e, idx) {
    e.preventDefault(); e.stopPropagation();
    const file = e.dataTransfer.files?.[0];
    if (!file) return;
    activeSlotRef.current = idx;
    // Reuse handleSlotFile by synthesizing a minimal event
    handleSlotFile({ target: { files: [file] } });
  }

  // Fit toggle (light theme for inline)
  const FitToggle = ({ dark }) => (
    <div style={{ display: "flex", alignItems:"center", gap: 6 }}>
      <div style={{ display:"flex", borderRadius:6, overflow:"hidden", border:"1px solid rgba(255,255,255,.12)" }}>
        {[{ v: "crop", l: "Crop" }, { v: "cover", l: "Fill" }, { v: "contain", l: "Fit" }, { v: "stretch", l: "Stretch" }, { v: "scale", l: "Scale" }].map(o => (
          <button type="button" key={o.v} onClick={() => { setFitMode(o.v); if (o.v === "scale") setArtScale(100); }} style={{
            padding:"6px 14px", fontSize:11, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
            background: fitMode === o.v ? CK.cyan : "rgba(255,255,255,.06)",
            color: fitMode === o.v ? "#000" : "rgba(255,255,255,.5)",
          }}>{o.l}</button>
        ))}
        <button type="button" onClick={() => setRotateSteps(s => (s + 1) % 4)} style={{
          padding:"6px 14px", fontSize:11, fontWeight:600, border:"none", borderLeft:"1px solid rgba(255,255,255,.08)", cursor:"pointer", fontFamily:"inherit",
          background: rotateSteps > 0 ? CK.cyan : "rgba(255,255,255,.06)",
          color: rotateSteps > 0 ? "#000" : "rgba(255,255,255,.5)",
        }}>Rotate 90°{rotateSteps > 0 ? ` (${rotateSteps * 90}°)` : ""}</button>
        {(displayPages?.length || 0) > 1 && (
          <select value="" onChange={e => { const v = e.target.value; if (v) rotateAll(v); e.target.value = ""; }}
            title="Rotate every page at once. Heads → Spine rotates facing pages in opposite directions so each head points into the binding."
            style={{
              padding:"6px 10px", fontSize:11, fontWeight:600, border:"none", borderLeft:"1px solid rgba(255,255,255,.08)",
              cursor:"pointer", fontFamily:"inherit", background:"rgba(255,255,255,.06)", color:"rgba(255,255,255,.6)",
            }}>
            <option value="" disabled>Rotate all…</option>
            <option value="uniform">↻ Uniform 90°</option>
            <option value="spine">Heads → Spine</option>
            <option value="edge">Heads → Fore-edge</option>
          </select>
        )}
      </div>
      {fitMode === "scale" && (
        <div style={{ display:"flex", alignItems:"center", gap:3 }}>
          <div style={{ display:"flex", borderRadius:6, overflow:"hidden", border:"1px solid rgba(255,255,255,.12)" }}>
            <button type="button" onClick={() => setArtScale(s => Math.max(10, s - 1))} style={{
              padding:"6px 10px", fontSize:12, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
              background:"rgba(255,255,255,.06)", color:"rgba(255,255,255,.5)",
            }}>−</button>
            <button type="button" onClick={() => setArtScale(s => Math.min(300, s + 1))} style={{
              padding:"6px 10px", fontSize:12, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
              background:"rgba(255,255,255,.06)", color:"rgba(255,255,255,.5)",
            }}>+</button>
          </div>
          <span style={{ fontSize:10, fontWeight:600, color:"rgba(255,255,255,.4)", minWidth:32, textAlign:"center" }}>{artScale}%</span>
        </div>
      )}
      {fitMode === "stretch" && (
        <button type="button" onClick={() => setFitMode("crop")} style={{
          padding:"5px 12px", fontSize:10, fontWeight:700, border:"1px solid rgba(239,68,68,.4)",
          borderRadius:4, cursor:"pointer", fontFamily:"inherit", background:"rgba(239,68,68,.12)",
          color:"#f87171", letterSpacing:".03em",
        }}>Reset Stretch</button>
      )}
    </div>
  );

  // How many user-uploaded (non-blank) pages exist
  const filledCount = rawPages.filter(p => !p.isBlank).length;

  return (
    <div style={{ marginTop: 8 }}>
      <input ref={fileInputRef} type="file" accept=".pdf,image/*" multiple onChange={handleFiles} style={{display:"none"}} />
      <input ref={slotInputRef} type="file" accept=".pdf,image/*" onChange={handleSlotFile} style={{display:"none"}} />

      {!hasFile ? (
        /* ── No file yet: dropzone ── */
        <>
          <div className={`bp-dropzone${loading ? " has-file" : ""}${dropHover ? " drag-active" : ""}`}
            onClick={() => !loading && fileInputRef.current && fileInputRef.current.click()}
            onDrop={handleDrop} onDragOver={handleDragOver} onDragLeave={handleDragLeave}>
            {loading
              ? <div style={{ width:"80%", textAlign:"center" }}>
                  <div style={{ fontSize: 12, color: CK.cyan, marginBottom: 6 }}>
                    {loadingProgress ? `Extracting page ${loadingProgress.current} of ${loadingProgress.total}…` : "Reading file…"}
                  </div>
                  <div style={{ width:"100%", height:6, borderRadius:3, background:"rgba(0,126,255,.12)", overflow:"hidden" }}>
                    <div style={{ height:"100%", borderRadius:3, background:CK.cyan, transition:"width .15s ease-out", width: loadingProgress ? `${(loadingProgress.current / loadingProgress.total) * 100}%` : "5%" }}/>
                  </div>
                  {loadingProgress && <div style={{ fontSize:9, color:CC.light, marginTop:4 }}>{Math.round((loadingProgress.current / loadingProgress.total) * 100)}%</div>}
                </div>
              : dropHover
              ? <><div style={{ fontSize: 18 }}>📥</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: CK.cyan }}>Drop file here</div></>
              : <><div style={{ fontSize: 18, opacity: 0.5 }}>📖</div>
                  <div style={{ fontSize: 11.5, fontWeight: 600, color: CC.mid }}>Upload complete artwork PDF</div>
                  <div style={{ fontSize: 10, color: CC.light, marginTop: 2 }}>Drop a file or click to browse</div><div style={{ fontSize: 9.5, color: CC.light, marginTop: 4 }}>PDF, JPG, PNG or TIFF · up to 200 MB</div></>
            }
          </div>
          <button type="button" onClick={() => generateTemplate(dims.w, dims.h, pageCount, (sizeLabel === "Custom Size" ? `${customShort}×${customLong}` : sizeLabel), roundCorner)} style={{
            width: "100%", marginTop: 6, padding: "8px", borderRadius: 4, border: `1px dashed ${CC.border}`,
            background: "#fafafa", color: CC.mid, fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
          }}>📐 Download Artwork Template ({dims.w}×{dims.h}″ · {pageCount}pg)</button>
        </>
      ) : (artApproved && proof === 0) ? (
        /* ── Approved state — green compact view ── */
        <div style={{ padding:"12px 14px", borderRadius:6, background:"#f0fdf4", border:"1px solid #86efac" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ width:22, height:22, borderRadius:"50%", background:"#22c55e", display:"inline-flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:13, fontWeight:700, flexShrink:0 }}>✓</span>
              <div>
                <span style={{ fontSize:12, fontWeight:700, color:"#166534" }}>Artwork Approved</span>
                <span style={{ fontSize:10, color:"#6ee7b7", marginLeft:8 }}>{fileName} · {filledCount}/{pageCount}pg</span>
              </div>
            </div>
            <div style={{ display:"flex", gap:4 }}>
              <button type="button" onClick={() => { setArtApproved(false); setApprovalPkg(null); }} style={{
                padding:"3px 10px", fontSize:10, fontWeight:600, borderRadius:4, cursor:"pointer", fontFamily:"inherit",
                border:"1px solid #86efac", background:"#fff", color:"#16a34a",
              }}>Review</button>
              <button type="button" onClick={() => { if(confirm("Remove all artwork and reset?")) handleClear(); }} style={{
                padding:"3px 6px", fontSize:10, borderRadius:4, cursor:"pointer", fontFamily:"inherit",
                border:"1px solid #86efac", background:"#fff", color:"#a3a3a3",
              }}>✕</button>
            </div>
          </div>
        </div>
      ) : (
        /* ── Has file, not yet approved: inline controls + pill selector ── */
        <div>
          {/* File header */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <div style={{ fontSize: 11, color: CC.mid, fontWeight: 500 }}>
              📄 {fileName} · {filledCount}/{pageCount}pg
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <button type="button" onClick={() => generateTemplate(dims.w, dims.h, pageCount, (sizeLabel === "Custom Size" ? `${customShort}×${customLong}` : sizeLabel), roundCorner)} style={{
                padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                border: `1px solid ${CC.border}`, background: CC.white, color: CC.mid,
              }}>📐 Download Template</button>
              {onSizeOverride && (
                <button type="button" onClick={() => {
                  if (confirm("This will change your selected booklet size to match the uploaded artwork dimensions. Continue?")) handleMatchSize();
                }} style={{
                  padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                  border: `1px solid ${CC.border}`, background: CC.white, color: CC.mid,
                }}>↔ Match ordered size to art</button>
              )}
              <button type="button" onClick={() => { if(confirm("Remove all artwork and reset?")) handleClear(); }} style={{ fontSize: 10, padding: "3px 8px", borderRadius: 4, border: `1px solid ${CC.border}`, background: CC.white, color: CC.light, cursor: "pointer", fontFamily: "inherit" }}>Remove uploads</button>
            </div>
          </div>

          {/* Inline preflight */}
          {preflight && preflight.length > 0 && (
            <div style={{ marginBottom: 6, padding: "8px 10px", borderRadius: 6, background: "#fafafa", border: `1px solid ${CC.border}` }}>
              {preflight.map((c, i) => (
                <div key={i} style={{ display: "flex", alignItems: "baseline", gap: 7, padding: "2px 0", flexWrap:"wrap" }}>
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: PF[c.level].dot, flexShrink: 0, marginTop: 2 }} />
                  <span style={{ fontSize: 10.5, fontWeight: 600, color: PF[c.level].text, minWidth: 72 }}>{c.label}</span>
                  <span style={{ fontSize: 10, color: CC.mid, flex:1 }}>{c.detail}</span>
                </div>
              ))}
              {reconcileInfo && reconcileInfo.type === "padded" && (
                <div style={{ display:"flex", alignItems:"baseline", gap:7, padding:"2px 0" }}>
                  <span style={{ width:7, height:7, borderRadius:"50%", background:"#b8860b", flexShrink:0, marginTop:2 }}/>
                  <span style={{ fontSize:10.5, fontWeight:600, color:"#b8860b", minWidth:72 }}>Pages</span>
                  <span style={{ fontSize:10, color:CC.mid }}>{reconcileInfo.count} blank{reconcileInfo.count>1?"s":""} added ({reconcileInfo.raw}→{reconcileInfo.target})</span>
                </div>
              )}
            </div>
          )}

          {/* ── Pill Selector: Proof | Preview ── (wrapped brochure-style) */}
          {(() => {
            const needsApproval = proof === 0 && !artApproved;
            return (
              <div style={{
                display:"flex", flexDirection:"column", gap:6, marginBottom:8,
                padding: needsApproval ? "10px 12px" : 0,
                background: needsApproval ? "#fef2f2" : "transparent",
                border: needsApproval ? "1px solid #fecaca" : "none",
                borderRadius: 6,
              }}>
                <div style={{ display:"flex", borderRadius:6, overflow:"hidden", border:`1px solid ${CC.border}`, boxShadow:"0 1px 3px rgba(0,0,0,.06)" }}>
                  <button type="button" onClick={() => { setActiveModal("proof"); setProofIdx(0); setProofView("single"); }} style={{
                    flex:1, padding:"11px 10px", fontSize:13, fontWeight:700, border:"none", cursor:"pointer", fontFamily:"inherit",
                    display:"flex", alignItems:"center", justifyContent:"center", gap:6,
                    background: artApproved && proof===0
                      ? "linear-gradient(135deg, #22c55e 0%, #16a34a 100%)"
                      : "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)",
                    color: artApproved && proof===0 ? "#fff" : "#555",
                    borderRight:`1px solid ${CC.border}`,
                  }}>
                    {artApproved && proof===0 ? "✓ Proof Approved" : "🔍 Proof"} {needsApproval && <span style={{ fontSize: 9, fontWeight: 700, background: "#fee2e2", color: "#dc2626", padding: "1px 6px", borderRadius: 4 }}>required</span>}
                    {debug && <span title="Proof debug mode is on (?debug=1)." style={{ marginLeft:8, fontSize:9, fontWeight:700, background:"rgba(251,191,36,.18)", color:"#fbbf24", padding:"2px 8px", borderRadius:4, letterSpacing:".06em", textTransform:"uppercase", border:"1px solid rgba(251,191,36,.4)" }}>🔧 Debug</span>}
                  </button>
                  <button type="button" onClick={() => { setActiveModal("preview"); setPreviewMode("closed"); setRot({x:-15,y:-25}); }} style={{
                    flex:1, padding:"11px 10px", fontSize:13, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
                    display:"flex", alignItems:"center", justifyContent:"center", gap:6,
                    background: "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)", color: "#555",
                  }}>
                    📖 Preview
                  </button>
                </div>
                {needsApproval && (
                  <div style={{ fontSize: 11, color: "#b91c1c", lineHeight: 1.4 }}>
                    Open proof to review bleed, trim, safety and approve artwork
                  </div>
                )}
              </div>
            );
          })()}

          {/* Proof messages for non-online-proof modes */}
          {proof === 0.01 && (
            <div style={{ padding:"10px 12px", borderRadius:6, background:"#f0f9ff", border:"1px solid #bae6fd", marginBottom:6, fontSize:11, color:CC.mid, lineHeight:1.5 }}>
              <strong style={{color:CC.dark}}>Manual Digital Proof selected</strong> — We'll review your art and endeavor to ensure compatibility with our processes. A proof will be emailed for your approval before printing.
            </div>
          )}
          {proof >= 3 && (
            <div style={{ padding:"10px 12px", borderRadius:6, background:"#fefce8", border:"1px solid #fde68a", marginBottom:6, fontSize:11, color:CC.mid, lineHeight:1.5 }}>
              <strong style={{color:"#854d0e"}}>Hardcopy Proof selected</strong> — We'll issue a mailed proof. The hardcopy may or may not include binding and is primarily for review of print and papers.
            </div>
          )}
        </div>
      )}

      {/* ── Page Slots Grid — collapsible (hidden when approved) ── */}
      {hasFile && !(artApproved && proof === 0) && <div style={{ marginTop: 8 }}>
        <div onClick={() => setSlotsOpen(o => !o)} style={{ display:"flex", alignItems:"center", gap:6, cursor:"pointer", padding:"6px 0", userSelect:"none" }}>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={CC.mid} strokeWidth="2.5" style={{ transform:slotsOpen?"rotate(90deg)":"rotate(0deg)", transition:"transform .2s" }}><polyline points="9 6 15 12 9 18"/></svg>
          <span style={{ fontSize:10.5, fontWeight:600, color:CC.mid }}>Upload pages individually</span>
          <span style={{ fontSize:9, color:CC.light }}>({filledCount}/{pageCount} filled)</span>
        </div>
        {slotsOpen && <div style={{ display:"grid", gridTemplateColumns:`repeat(auto-fill, minmax(${mob ? 56 : 68}px, 1fr))`, gap: 6, marginTop: 4 }}>
        {displayPages.map((p, i) => {
          const isEmpty = p.isBlank;
          const isUserPage = !isEmpty;
          return (
            <div key={i} style={{ position:"relative", textAlign:"center" }}
              onDragOver={e => { e.preventDefault(); e.currentTarget.style.outline = `2px solid ${CK.cyan}`; }}
              onDragLeave={e => { e.currentTarget.style.outline = "none"; }}
              onDrop={e => { e.currentTarget.style.outline = "none"; handleSlotDrop(e, i); }}>
              <div onClick={() => handleSlotClick(i)} style={{
                  width: "100%", aspectRatio: `${dims.w} / ${dims.h}`,
                  borderRadius: 3, overflow: "hidden", cursor: "pointer",
                  border: isEmpty ? `1.5px dashed ${CC.border}` : `1px solid ${CC.border}`,
                  background: isEmpty ? "#fafafa" : "none",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  position: "relative", transition: "border-color .2s",
                }}>
                {isUserPage ? (
                  <img src={p.dataUrl} alt={p.label} style={{ position:"absolute", inset:0, width:"100%", height:"100%", objectFit: getTx(i).fitMode==="stretch"?"fill":getTx(i).fitMode==="contain"?"contain":"cover", display:"block", background:"#e8e8e8", filter:gsFilter }} />
                ) : (
                  <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:2, padding:4 }}>
                    <span style={{ fontSize:16, opacity:.3 }}>+</span>

                          <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:1 }}>
                            {/* Bleed — red dashed at container edge (art must extend to here) */}

                          </div>

                          <div style={{ position:"absolute", top:`${bleedPctY}%`, left:`${bleedPctX}%`, right:`${bleedPctX}%`, bottom:`${bleedPctY}%`, borderRadius:rcCSS, boxShadow:"0 0 0 200px rgba(0,0,0,0.15)", pointerEvents:"none", zIndex:0 }}/>

                        {/* Magnifier lens */}
                        {showMagnifier && magPos && !proofPage.isBlank && (() => {
                          const magSize = 160, zoom = 3;
                          const imgSrc = hiResValid ? hiResProof.dataUrl : proofPage.dataUrl;
                          const bgW = magPos.cw * zoom, bgH = magPos.ch * zoom;
                          const bgX = -(magPos.pctX / 100 * bgW) + magSize / 2;
                          const bgY = -(magPos.pctY / 100 * bgH) + magSize / 2;
                          const proofTx = getTx(proofIdx);
                          const lensEd = effectiveDimsFor(artDims, proofTx.rotateSteps);
                          const lensNativeW = lensEd ? lensEd.wIn / bleedW : (dims.w / bleedW);
                          const lensCropStyle = (mult) => ({
                            width: `${lensNativeW * mult * 100}%`, height: "auto",

                                  )
                                }} />
                                {showGuides && <>
                                  {/* Bleed — red dashed at container edge */}
                                  <div style={{ position:"absolute", inset:0, border:"2px dashed #ef4444", boxSizing:"border-box", opacity:0.8, pointerEvents:"none" }}/>
                                  {/* Trim — light dashed inset by bleed */}
                                  <div style={{ position:"absolute", top:`${bleedPctY}%`, left:`${bleedPctX}%`, right:`${bleedPctX}%`, bottom:`${bleedPctY}%`, border:"2px dashed #fff", boxSizing:"border-box", borderRadius: rcCSS, pointerEvents:"none", filter:"drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000)" }}/>

                      </div>

      {/* ════════════════════════════════════════════════════════════
           PREVIEW MODAL — 3D closed book, page spreads, animations
         ════════════════════════════════════════════════════════════ */}
      {activeModal === "preview" && hasFile && displayPages.length > 0 && (

                  <div style={{ fontSize:11, color:"rgba(255,255,255,.4)" }}>
                    {dims.w}″ × {dims.h}″ · {displayPages.length} pages · Perfect Bound
                    {reconcileInfo?.type === "padded" && <InfoTip dark text={`Perfect bound booklets require an even page count. Your file has ${reconcileInfo.raw} pages, so ${reconcileInfo.count} blank page${reconcileInfo.count > 1 ? "s are" : " is"} added to reach ${reconcileInfo.target}.`}><span style={{ color: CK.yellow, marginLeft: 6 }}>({reconcileInfo.count} blank{reconcileInfo.count > 1 ? "s" : ""} added)</span></InfoTip>}
                  </div>
                </div>
                <button type="button" onClick={() => setActiveModal(null)} style={{ background:"none", border:"1px solid rgba(255,255,255,.15)", color:"rgba(255,255,255,.5)", width:32, height:32, borderRadius:8, cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>

                      padding:"6px 14px", fontSize:11, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit",
                      background: previewMode === o.v ? CK.cyan : "rgba(255,255,255,.06)",

                {previewMode === "closed"
                  ? <BookClosed3D pages={trimmedPages.length ? trimmedPages : displayPages} bookW={exBookW} bookH={exBookH} spineW={spineW} rotateX={rot.x} rotateY={rot.y} scale={exScale} fitMode="stretch" />
                  : <BookOpen3D pages={trimmedPages.length ? trimmedPages : displayPages} bookW={exBookW} bookH={exBookH} spread={spread} scale={exScale} rotateX={-5} rotateY={0} fitMode="stretch" />
                }

                    {(() => { const int = displayPages.slice(1, displayPages.length - 1); const li = spread * 2, ri = spread * 2 + 1; return int[ri] ? `Pages ${li + 2}–${ri + 2}` : `Page ${li + 2}`; })()}
                  </span>
                  <button type="button" className="bp-nav-btn" disabled={spread >= totalSpreads - 1} onClick={() => setSpread(s => s + 1)}>›</button>

                  <div key={i} className="bp-thumb">

                    <span style={{ color: p.isBlank ? CK.yellow : "rgba(255,255,255,.4)" }}>{p.label}</span>

      )}
    </div>
  );

function buildSummary(config, result) {
  const lines = [];
  const r = result;
  const sh = r.shipping || {};

  // Size & quantity
  const setsStr = config.sets.map(s =>
    `${s.qty.toLocaleString()} qty × ${s.pages / 2} sheets` + (s.name ? ` "${s.name}"` : "")
  ).join(", ");
  lines.push(`${config.sizeLabel} · ${setsStr}`);

  // Paper
  const colorName = v => v === "color" ? "Full Color" : "Black & White";
  const isOpenFaceBind = config.bindStyle !== "wraparound";
  lines.push(`Inside: ${config.insidePaper.label} · ${colorName(config.insideColor)}`);
  if (config.coverMode !== "same") {
    lines.push(`Cover: ${config.coverPaper.label} · ${colorName(config.coverColor)}`);
  } else if (isOpenFaceBind) {
    lines.push(`Top sheet: same stock as coupon sheets`);
  } else {
    lines.push(`Cover: Self-cover (same as inside)`);
  }

  // Binding
  const bindLabel = config.bindStyle === "wraparound" ? "Wraparound Cover (Perfect Bound)" : "Open Faced: Glued/Padded";
  lines.push(bindLabel);
  if (config.sidesPrinted === "single") lines.push("Single Sided Printing");

  // Finishing — only if selected
  const coat = COATINGS.find(x => x.val === config.coating);
  if (coat && coat.val > 0) lines.push(coat.label);
  const bund = BUNDLING.find(x => x.val === config.bundling);
  if (bund && bund.val > 0) lines.push(bund.label);
  const rc = CORNERS.find(x => x.val === config.roundCorner);
  if (rc && rc.val > 0) lines.push(rc.label);
  if (config.vividPrint) lines.push("Enhanced Vivid Print");

  // Artwork
  const art = ART_OPTS.find(x => x.val === config.artwork);
  if (art) lines.push(art.label);
  const bld = BLEED_OPTS.find(x => x.val === config.bleed);
  if (bld && bld.val > 0) lines.push(bld.label);
  if (config.proof > 0) lines.push(config.proof >= 3 ? "Hardcopy Proof" : "Digital Proof");

  // Delivery — stored as business days, not calendar dates
  if (config.needByDate && sh.rushCost > 0) {
    lines.push(`Rush: ${sh.bizDaysToDate} business days`);
  } else {
    lines.push(`Standard delivery: ${sh.freeDeliveryBizDays} business days`);
  }
  lines.push(`Ship to: ${config.shipState}${config.shipAddr?.zip ? " "+config.shipAddr.zip : ""}`);

  return lines.join("\n");
}

function buildMetadata(config, result) {
  const sh = result.shipping || {};
  return JSON.stringify({
    // Customer selections
    sizeLabel: config.sizeLabel,
    customLong: config.customLong,
    customShort: config.customShort,
    bindDir: config.bindDir,
    sets: config.sets,
    insideColor: config.insideColor,
    coverColor: config.coverColor,
    insidePaper: config.insidePaper,
    insidePaperType: config.insidePaperType,
    coverMode: config.coverMode,
    coverPaper: config.coverPaper,
    coverPaperType: config.coverPaperType,
    bindStyle: config.bindStyle,
    sidesPrinted: config.sidesPrinted,
    magnetBacker: config.magnetBacker,
    twoStaple: config.twoStaple,
    vividPrint: config.vividPrint,
    coating: config.coating,
    bundling: config.bundling,
    roundCorner: config.roundCorner,
    outfold: config.outfold,
    perforation: config.perforation,
    artwork: config.artwork,
    artEditPages: config.artEditPages,
    bleed: config.bleed,
    proof: config.proof,
    // Per-page art transforms — what the customer approved per page in the
    // proof modal. Keyed by page index → { fitMode, artScale, rotateSteps }.
    // (Phase 2: server-side rendering will use these to produce print-ready
    // files. Earlier code stored these as four flat scalars, which both
    // crashed handleAddToOrder via ReferenceError and silently lost the
    // per-page distinction.)
    pageTransforms: config.pageTransforms || {},
    artDims: config.artDims || null,
    shipState: config.shipState,
    shipZip: config.shipZip || '',
    shipAddr: config.shipAddr || {},
    needByDate: config.needByDate,
    // Shipping — stored as durations, not dates
    // Physical shipment estimate. WooCommerce has nowhere to carry this on a virtual
    // line item, so it travels in the metadata blob and the plugin lifts it onto the
    // order — a fulfilment tool that imports the order needs a weight and a parcel
    // count, not just an address.
    estWeightLb: sh.estWeightLb,
    estCartons: sh.estCartons,
    transitDays: sh.transitDays,
    productionBizDays: sh.productionBizDays,
    requestedBizDays: sh.bizDaysToDate || sh.freeDeliveryBizDays,
    freeDeliveryBizDays: sh.freeDeliveryBizDays,
    rushMultiplier: sh.rushMultiplier,
    rushCost: sh.rushCost,
    // Production schedule
    productionStartDate: sh.productionStartYMD,
    mustShipByDate: sh.mustShipYMD,
    estimatedDeliveryDate: config.needByDate || sh.freeDeliveryYMD,
    // Computed results
    total: result.total,
    baseTotal: result.baseTotal,
    perUnit: result.perUnit,
    totalQty: result.tQ,
    days: result.days,
    debug: result.debug,
  });
}

// Upload a FormData via XHR with progress callback — returns parsed JSON response
function uploadWithProgress(url, formData, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.withCredentials = true;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch (err) { reject(new Error("Invalid server response")); }
    };
    xhr.onerror = () => reject(new Error("Network error during upload"));
    xhr.send(formData);
  });
}

async function submitToWooCommerce(total, summary, metadata, rushCost, artFiles, onProgress) {
  const PPS = window.PPS_CONFIG || {};

  // ── Standalone mode: download artwork + order summary as a zip-like package ──
  if (!PPS.ajaxUrl) {
    console.warn("PPS: Standalone mode — triggering local download.");
    // Build a text summary
    const lines = [
      "PPS Order Summary", "=" .repeat(40), "",
      `Total: $${total.toFixed(2)}`, `Rush: $${rushCost.toFixed(2)}`, "",
      "Summary:", summary, "",
      "Metadata:", metadata, "",
      `Artwork: ${artFiles.type === "files" ? artFiles.list.map(f => f.name).join(", ") : artFiles.type === "existing" ? artFiles.path : "none"}`, ""
    ];
    // Download summary text
    const blob = new Blob([lines.join("\n")], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pps_order_summary.txt";
    a.click();
    URL.revokeObjectURL(a.href);
    // Download each artwork file
    if (artFiles.type === "files") {
      for (const file of artFiles.list) {
        const url = URL.createObjectURL(file);
        const dl = document.createElement("a");
        dl.href = url;
        dl.download = file.name;
        dl.click();
        URL.revokeObjectURL(url);
      }
    }
    alert(`Standalone mode: downloaded order summary${artFiles.type === "files" ? " + " + artFiles.list.length + " artwork file(s)" : ""}.`);
    return;
  }

  // ── Server mode ──
  let artworkPath = "";

  if (artFiles.type === "files") {
    const total_files = artFiles.list.length;
    for (let fi = 0; fi < total_files; fi++) {
      const file = artFiles.list[fi];
      try {
        const fd = new FormData();
        fd.append("action", "pps_upload_artwork");
        fd.append("nonce", PPS.uploadNonce);
        fd.append("artwork", file, file.name);
        if (onProgress) onProgress({ phase: "upload", fileIdx: fi, fileCount: total_files, fileName: file.name, pct: 0 });
        const data = await uploadWithProgress(PPS.ajaxUrl, fd, (pct) => {
          if (onProgress) onProgress({ phase: "upload", fileIdx: fi, fileCount: total_files, fileName: file.name, pct });
        });
        if (data.success && data.data.path) {
          if (!artworkPath) artworkPath = data.data.path;
        } else {
          alert("Artwork upload failed: " + (data.data || "Unknown error") + "\nPlease try again.");
          return;
        }
      } catch (err) {
        alert("Artwork upload error: " + err.message + "\nPlease try again.");
        return;
      }
    }
    if (onProgress) onProgress({ phase: "cart", pct: 100 });
  } else if (artFiles.type === "existing") {
    artworkPath = artFiles.path;
  }

  // Add to cart
  try {
    const fd = new FormData();
    fd.append("action", "pps_add_to_cart");
    fd.append("nonce", PPS.cartNonce);
    fd.append("product_id", PPS.productId);
    const _pstr = total.toFixed(2);
    fd.append("pps_price", _pstr);
    // Payload integrity — both are revalidated server-side in pps_ajax_add_to_cart
    // and neither participates in pricing.
    fd.append("pps_tier", "retail");
    fd.append("pps_lock", (function(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h.toString(36);})(_pstr + "|" + PPS.productId));
    fd.append("pps_rush", rushCost.toFixed(2));
    fd.append("pps_summary", summary);
    fd.append("pps_metadata", metadata);
    const parsed = JSON.parse(metadata);
    fd.append("pps_biz_days", String(parsed.requestedBizDays || parsed.freeDeliveryBizDays || 5));
    if (artworkPath) fd.append("pps_artwork_path", artworkPath);

    const resp = await fetch(PPS.ajaxUrl, { method: "POST", credentials: "same-origin", body: fd });
    if (!resp.ok) { alert("Server error (" + resp.status + "). Please try again."); return; }
    const data = await resp.json();
    if (data && data.success) {
      window.location.href = PPS.cartUrl;
    } else {
      alert("Error: " + (data.data || "Could not add to cart."));
    }
  } catch (err) {
    alert("Network error: " + err.message);
  }
}

  const _findPaper = (list, val) => { const f = list.find(p => String(p.val) === String(val)); return f || list[2] || list[0]; };

  const[bindStyle,setBindStyle]=useState(D.bindStyle||"openface");

  const debugUnlocked = sets.some(s => s.name === "%3414");

  const[sizeLabel,setSizeLabel]=useState(D.sizeLabel || "5.5×8.5 (Opens to 8.5×11)");
  const[sizeMode,setSizeMode]=useState(D.sizeLabel==="Custom Size"?"custom":"preset");
  const[customLong,setCustomLong]=useState(D.customLong||8.5);
  const[customShort,setCustomShort]=useState(D.customShort||5.5);
  const[bindDir,setBindDir]=useState(D.bindDir||"short");
  // insideColor derived from sets' color modes (for gsFilter, metadata compat)
  const insideColor = sets.every(s => s.colorMode === "bw") ? "bw" : "color";
  const[coverColor,setCoverColor]=useState(D.coverColor||"color");
  const[insidePaperType,setInsidePaperType]=useState(D.insidePaperType||"noncardstock");
  const[insidePaper,setInsidePaper]=useState(()=>_findPaper(D.insidePaperType==="cardstock"?PAPERS_CS:PAPERS_NC, D.insidePaper));
  const[coverMode,setCoverMode]=useState(D.coverMode||"same");
  const[coverPaperType,setCoverPaperType]=useState(D.coverPaperType||"cardstock");
  const[coverPaper,setCoverPaper]=useState(()=>_findPaper(D.coverPaperType==="cardstock"?PAPERS_CS:PAPERS_NC, D.coverPaper));
  const[twoStaple,setTwoStaple]=useState(D.twoStaple===true||D.twoStaple==="true"||false);
  const[vividPrint,setVividPrint]=useState(D.vividPrint===true||D.vividPrint==="true"||false);
  const[coating,setCoating]=useState(Number(D.coating)||0);
  const[bundling,setBundling]=useState(Number(D.bundling)||0);
  const[roundCorner,setRoundCorner]=useState(Number(D.roundCorner)||0);
  const[outfold,setOutfold]=useState(Number(D.outfold)||0);
  const[perforation,setPerforation]=useState(Number(D.perforation)||0);
  // Wraparound binding perforates the cover as part of the bind style (P.wraparoundPerf),
  // so the separate coupon-perforation add-on is openface-only. Clearing here covers
  // both a live style switch and a restored legacy wraparound+perforation config.
  useEffect(()=>{if(bindStyle==="wraparound"&&perforation>0)setPerforation(0)},[bindStyle,perforation]);
  const[artwork,setArtwork]=useState(Number(D.artwork)||0.01);
  const[artEditPages,setArtEditPages]=useState(Number(D.artEditPages)||0);
  const[bleed,setBleed]=useState(Number(D.bleed)||0);
  const[proof,setProof]=useState(Number(D.proof)||0);
  const[proofAddrSame,setProofAddrSame]=useState(true);
  const[proofAddr,setProofAddr]=useState({name:"",street:"",city:"",state:"",zip:""});
  // Shipping & Rush
  const[shipState,setShipState]=useState(D.shipState||"AZ");
  const[shipAddr,setShipAddr]=useState({name:"",company:"",street1:"",street2:"",city:"",zip:""});
  const[needByDate,setNeedByDate]=useState("");
  const[coverArt,setCoverArt]=useState(null);
  const[backCoverArt,setBackCoverArt]=useState(null);
  const openPreviewModalRef=useRef(null);
  // Unified artwork file state — one variable, no priority logic
  // { type:"none" } | { type:"files", list:[File,...] } | { type:"existing", path:"/uploads/..." }
  const[artFiles,setArtFiles]=useState({type:"none"});
  const[canvaLink,setCanvaLink]=useState("");
  const[canvaInstructions,setCanvaInstructions]=useState("");
  const[referenceFiles,setReferenceFiles]=useState([]);
  // Lifted from SetPreview so handleAddToOrder/buildMetadata can serialize per-page
  // art transforms into WC order metadata. Source of truth lives here; SetPreview
  // receives them as props and threads them through getTx/setTx.
  const[pageTransforms,setPageTransforms]=useState({});
  const[artDims,setArtDims]=useState(null); // {wIn, hIn, wPx, hPx, source}
  // On upload, infer a standard left-edge (side-bound) spine from the art's
  // orientation: spine on the vertical (height) edge (8.5x11 -> 11x17, not 8.5x22).
  // Fires only on a real upload; artDims is set by the uploader, never by reorder.
  useEffect(() => {
    if (!artDims || !artDims.wIn || !artDims.hIn) return;
    setBindDir(artDims.hIn >= artDims.wIn ? "long" : "short");
  }, [artDims]);

  const iP=insidePaperType==="cardstock"?PAPERS_CS:PAPERS_NC;
  const cP=coverPaperType==="cardstock"?PAPERS_CS:PAPERS_NC;

  // ── Reorder: pre-fill from PPS_CONFIG.reorder (set by PHP from URL) ──
  useEffect(() => {
    const PPS = window.PPS_CONFIG || {};
    const encoded = PPS.reorder || "";
    if (!encoded) return;

    try {
      // URL-safe base64 decode
      const b64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
      const json = atob(b64);
      const rc = JSON.parse(json);

      // Size
      if (rc.sizeLabel) {
        if (rc.sizeLabel === "Custom Size") {
          setSizeMode("custom");
          setSizeLabel("Custom Size");
          if (rc.customLong) setCustomLong(Number(rc.customLong));
          if (rc.customShort) setCustomShort(Number(rc.customShort));
        } else {
          setSizeMode("preset");
          setSizeLabel(rc.sizeLabel);
        }
      }
      if (rc.bindDir) setBindDir(rc.bindDir);

      // Sets (quantity & pages) — clamp to MIN_QTY=1, MIN_PAGES=8 to prevent
      // crashes from malformed payloads (e.g. qty=-100) that previously caused
      // React render to throw silently and leave an empty calc root.
      if (rc.sets && Array.isArray(rc.sets)) {
        setSets(rc.sets.map(s => ({
          qty: Math.max(1, Number(s.qty) || 100),
          pages: Math.max(8, Number(s.pages) || 8),
          name: s.name || "",
        })));
      }

      // Color
      if (rc.insideColor) upSet(0, { colorMode: rc.insideColor === "bw" ? "bw" : "color" });
      if (rc.coverColor) setCoverColor(rc.coverColor);

      // Paper — match by label from current catalog
      if (rc.insidePaperType) setInsidePaperType(rc.insidePaperType);
      if (rc.insidePaper) {
        const pool = (rc.insidePaperType === "cardstock") ? PAPERS_CS : PAPERS_NC;
        const match = pool.find(p => p.label === rc.insidePaper.label);
        if (match) setTimeout(() => setInsidePaper(match), 0);
      }
      if (rc.coverMode) setCoverMode(rc.coverMode);
      if (rc.coverPaperType) setCoverPaperType(rc.coverPaperType);
      if (rc.coverPaper) {
        const pool = (rc.coverPaperType === "cardstock") ? PAPERS_CS : PAPERS_NC;
        const match = pool.find(p => p.label === rc.coverPaper.label);
        if (match) setTimeout(() => setCoverPaper(match), 0);
      }

      // Finishing — coerce types from JSON (strings → numbers/booleans)
      if (rc.twoStaple != null) setTwoStaple(rc.twoStaple === true || rc.twoStaple === "true");
      if (rc.vividPrint != null) setVividPrint(rc.vividPrint === true || rc.vividPrint === "true");
      if (rc.coating != null) setCoating(Number(rc.coating));
      if (rc.bundling != null) setBundling(Number(rc.bundling));
      if (rc.roundCorner != null) setRoundCorner(Number(rc.roundCorner));

      // Artwork & proofing
      if (rc.artwork != null) setArtwork(Number(rc.artwork));
      if (rc.artEditPages != null) setArtEditPages(Number(rc.artEditPages));
      if (rc.bleed != null) setBleed(Number(rc.bleed));
      if (rc.proof != null) setProof(Number(rc.proof));

      // Shipping (no date — recalculated fresh)
      if (rc.shipState) setShipState(rc.shipState);
      if (rc.shipAddr) setShipAddr(rc.shipAddr);
      if (rc.bindStyle) setBindStyle(rc.bindStyle);
      if (rc.magnetBacker != null) setMagnetBacker(Number(rc.magnetBacker) || 0);

      // Existing artwork (edit mode — file already on server)
      if (rc.artworkPath) setArtFiles({ type: "existing", path: rc.artworkPath });
      else if (PPS.existingArtwork && PPS.existingArtwork.path) {
        setArtFiles({ type: "existing", path: PPS.existingArtwork.path });
      }

      // Per-page art transforms — restore so reorder reproduces the customer's
      // exact proof-modal choices. Artwork fidelity is business-critical.
      if (rc.pageTransforms && typeof rc.pageTransforms === "object") {
        setPageTransforms(rc.pageTransforms);
      }
      if (rc.artDims && typeof rc.artDims === "object") {
        setArtDims(rc.artDims);

      console.warn("PPS: Failed to parse reorder config", e);

  }, []);

  const isCustom=sizeMode==="custom";
  // Sync sizeLabel with sizeMode toggle
  const lastPreset=useRef("5.5×8.5 (Opens to 8.5×11)");
  const handleSizeMode=(mode)=>{
    setSizeMode(mode);
    if(mode==="custom"){
      if(sizeLabel!=="Custom Size") lastPreset.current=sizeLabel;
      setSizeLabel("Custom Size");
    } else {
      setSizeLabel(lastPreset.current);
    }
  };
  // Keep lastPreset in sync when user changes the dropdown
  const handleSizeLabel=(v)=>{setSizeLabel(v);if(v!=="Custom Size")lastPreset.current=v;};
  const csOK=sets.every(s=>s.pages<=24);

  const shipZip=shipAddr.zip||"";
  // ── Destination completeness ────────────────────────────────────────────────
  // Everything the job cannot ship without. Until 2026-08-02 this gate was the state
  // alone in the modern draft and did not exist at all in the other eight, so an order
  // could be placed with a ZIP and no street: enough to price transit, not enough to

  const _destMissing = [];
  if (!String(shipAddr.street1 || "").trim()) _destMissing.push("street address");
  if (!String(shipAddr.city || "").trim())    _destMissing.push("city");
  if (!String(shipState || "").trim())        _destMissing.push("state");
  if (!String(shipAddr.zip || "").trim())     _destMissing.push("ZIP code");
  const missingDest = _destMissing.length > 0;
  // Name what is missing rather than repeat one generic warning: someone who has filled
  // three of the four fields needs to know which one is still empty.
  const missingDestMsg = !missingDest ? ""
    : _destMissing.length >= 4 ? "Shipping info required prior to placing order"
    : "Shipping address incomplete \u2014 add " + (_destMissing.length === 1 ? _destMissing[0]

  // Send them to the field rather than leaving them to hunt for it. Opens the section

  const focusShipping = () => {
    if (!document.querySelector('[autocomplete="shipping address-line1"]')) {
