// PRIORITY PRINT SERVICE — Auto-Imposition Tool v1
// Vector-preserving sheetwise step-and-repeat imposition in the browser.
// Engine design per docs/IMPOSITION_TOOL_BRIEF.md — the four historical
// failure modes and their fixes are tagged (a)(b)(c)(d) below.
const { useState, useEffect, useMemo, useRef } = React;
const PL = window.PDFLib;
const CFG = window.PPS_IMPOSE_CFG || null; // injected by pps-imposition.php in wp-admin

// ═══════════════════════════════════════════════════════════════
// LAYOUT SPEC — mirrors the calculators' pricing imposition EXACTLY.
// CRITICAL INVARIANT (brief §2): copies-per-sheet placed here must equal
// what the customer was priced on. flatGrid/flatImp/stickerImp are copied
// verbatim from the calculator HTML files — do not "fix" the thresholds.
// ═══════════════════════════════════════════════════════════════
const PT = 72, BLEED = 0.125, EPS = 1e-6;

const SHEETS = {
  "13x19":   { key:"13x19",   label:"13×19",              long:19,   short:13, usableLong:18.5, usableShort:12.5 },
  "13x27.5": { key:"13x27.5", label:"13×27.5 (oversize)", long:27.5, short:13, usableLong:27,   usableShort:12.5 },
  "12x18":   { key:"12x18",   label:"12×18 crack-n-peel", long:18,   short:12, usableLong:17.5, usableShort:11.5 },
};

// Every stock sheet images to 0.25″ inside its edge; a custom parent sheet
// takes the same default unless the operator knows their press does otherwise.
const SHEET_MARGIN = 0.25;
const SHEET_MAX = 60;
function customSheet(a, b, margin) {
  const L = Math.max(a, b), S = Math.min(a, b);
  const m = isFinite(margin) ? Math.max(0, margin) : SHEET_MARGIN;
  const t = n => (Math.round(n * 1000) / 1000);
  // key carries the dimensions so the slug and IMPOSED_ filename stay
  // traceable — "custom17x11", not a bare "custom" that loses the size.
  return { key: `custom${t(L)}x${t(S)}`, label: `${t(L)}×${t(S)} custom`, long: L, short: S,
           usableLong: L - 2 * m, usableShort: S - 2 * m, custom: true, margin: m };
}
// Operator override of the parent sheet. Returns null for "auto" (the product's
// own press sheet). NOTE this changes only the PHYSICAL sheet — the priced imp
// is still whatever the calculator quoted, so any resulting difference is
// surfaced by the usual mismatch machinery rather than silently absorbed.
function sheetOverrideOf(spec) {
  const k = spec && spec.sheet;
  if (!k || k === "auto") return null;
  if (k !== "custom") return SHEETS[k] || null;
  const L = +spec.sheetLong, S = +spec.sheetShort;
  if (!(L >= 3 && S >= 3)) throw new Error("Custom parent sheet needs both dimensions (minimum 3″).");
  if (L > SHEET_MAX || S > SHEET_MAX) throw new Error(`Custom parent sheet is capped at ${SHEET_MAX}″.`);
  const m = spec.sheetMargin === "" || spec.sheetMargin == null ? SHEET_MARGIN : +spec.sheetMargin;
  if (!(m >= 0)) throw new Error("Imageable margin must be 0″ or more.");
  if (2 * m >= Math.min(L, S)) throw new Error(`A ${m}″ imageable margin leaves no printable area on a ${L}×${S}″ sheet.`);
  return customSheet(L, S, m);
}

const CALC_TYPES = [
  { val:"brochure",      label:"Brochure / Flat" },
  { val:"postcard",      label:"Postcard" },
  { val:"letterhead",    label:"Letterhead" },
  { val:"greeting-card", label:"Greeting Card" },
  { val:"sticker",       label:"Sticker (12×18 crack-n-peel)" },
  { val:"saddle",        label:"Saddle Stitch Booklet (signatures)" },
  { val:"perfect-bound", label:"Perfect Bound (cover + guts, 2 files)" },
];
const FLAT_CALCS = ["brochure","postcard","letterhead","greeting-card"];
const UNSUPPORTED_BOOKLETS = ["coupon"]; // saddle + perfect bound supported; coupon needs its own pagination (v2)
// Perfect bound images as TWO separate press jobs, so it is split into two
// internal calc types and each is run through the ordinary flat pipeline —
// which is where bleed synthesis, duplex, marks, slug, OC preservation and the
// preflight already live. Neither half has a priced imposition: the calculator
// prices the book, not a sheet layout, so both place the best physical fit and
// say so rather than pretending to a parity that was never computed.
const PB_CALCS = ["pb-cover", "pb-guts"];
// 12×18 crack-n-peel sticker sheet: single source for both the priced count
// (stickerImp) and the placed grid (computeLayout) — they must never drift.
const STICKER = { L: 17.75, S: 11.75, pitch: 0.25 };

// Verbatim port of calcBrochureImp / calcPostcardImp / calcLetterheadImp /
// calcGreetingImp (identical JS in all four calculators).
function flatGrid(w, h, L) {
  const r1 = L / w;
  const across = r1 < 0.5 ? 0 : r1 < 1 ? 0.5 : r1 < 1.48 ? 1 : r1 < 3 ? 2 : r1 < 4 ? 3 : r1 < 5 ? 4 : r1 < 6 ? 5 : r1 < 7 ? 6 : r1 < 8 ? 7 : 8;
  const r2 = 12.5 / h;
  const down = r2 < 1 ? 0 : r2 < 2 ? 1 : r2 < 3 ? 2 : r2 < 4 ? 3 : 4;
  return across * down;
}
function flatImp(longEdge, shortEdge, sheetLong) {
  const L = sheetLong || 18.5;
  return Math.max(flatGrid(longEdge, shortEdge, L), flatGrid(shortEdge, longEdge, L));
}
// Verbatim port of calcStickerImp (12×18 sheet, 0.25″ pitch, edge bleed into margins).
function stickerGrid(w, h) {
  return {
    a: Math.max(0, Math.floor(STICKER.L / (w + STICKER.pitch))),
    d: Math.max(0, Math.floor(STICKER.S / (h + STICKER.pitch))),
  };
}
function stickerImp(longEdge, shortEdge) {
  const g0 = stickerGrid(longEdge, shortEdge), g1 = stickerGrid(shortEdge, longEdge);
  return Math.max(g0.a * g0.d, g1.a * g1.d);
}

// ── Saddle stitch booklet spec (mirror of calc-preview-test.html) ──
// Preset table is authoritative for preset sizes (imp values don't always
// equal calcCustomImp — e.g. 6×4 is priced 8-up); customs fall back to the
// verbatim calcCustomImp port. bindEdge = page HEIGHT (spine is always the
// left, vertical edge in every preset: portrait, square, and landscape).
// Page dims are width×height as in the preset labels.
const SADDLE_PRESETS_FALLBACK = [
  { w:3.5,  h:5.5,  imp:8 }, { w:4,    h:6,   imp:8 }, { w:4.25, h:5.5,  imp:8 },
  { w:5,    h:7,    imp:4 }, { w:5.5,  h:8.5, imp:4 }, { w:6,    h:9,    imp:4 },
  { w:8.5,  h:11,   imp:2 }, { w:9,    h:12,  imp:2 },
  { w:4,    h:4,    imp:8 }, { w:5.5,  h:5.5, imp:6 }, { w:6,    h:6,    imp:6 },
  { w:8,    h:8,    imp:2 }, { w:9,    h:9,   imp:2 }, { w:12,   h:12,   imp:1 },
  { w:6,    h:4,    imp:8 }, { w:5.5,  h:4.25, imp:8 }, { w:8.5,  h:5.5, imp:4 },
  { w:9,    h:6,    imp:4 }, { w:11,   h:8.5, imp:1 }, { w:12,   h:9,    imp:1 },
];

// In wp-admin the PHP injects the LIVE saddle size_presets (the same
// wp_options config the calculator prices with), so an admin preset edit
// can never drift production away from pricing. The embedded fallback only
// applies standalone (GitHub Pages / local file).
function parseSaddlePresetGroups(groups) {
  const out = [];
  (groups || []).forEach(g => (g.items || []).forEach(it => {
    const m = String(it.label || "").match(/([\d.]+)\s*[×x]\s*([\d.]+)/);
    if (m && it.imp >= 1) out.push({ w: +m[1], h: +m[2], imp: +it.imp });
  }));
  return out;
}
const SADDLE_PRESETS = (CFG && CFG.sizePresets && parseSaddlePresetGroups(CFG.sizePresets).length)
  ? parseSaddlePresetGroups(CFG.sizePresets)
  : SADDLE_PRESETS_FALLBACK;

// Verbatim port of the saddle calculator's calcCustomImp. The trailing
// `r < 3 ? 2 : 2` / `r < 5 ? 4 : 4` tails look redundant but are kept
// byte-for-byte from the calculator — do NOT "simplify" them; parity with
// pricing is verified by tests/imposition/parity.mjs.
function bookletImp(longest, shortest, bindDir, sheetLong) {
  const L = sheetLong || 18.5;
  const sA = x => { const r = L / x; return r < .5 ? 0 : r < 1 ? .5 : r < 2 ? 1 : r < 3 ? 2 : r < 4 ? 3 : r < 5 ? 4 : 4; };
  const sB = x => { const r = 12.5 / x; return r < 2 ? 1 : r < 3 ? 2 : 2; };
  return bindDir === "short" ? sA(longest) * sB(shortest) : sA(shortest) * sB(longest);
}

// Page width×height → priced pages-per-13×19-side. Preset table first
// (authoritative), calcCustomImp for customs — same order as resolveSize.
function resolveSaddleImp(pw, ph) {
  const preset = SADDLE_PRESETS.find(p => Math.abs(p.w - pw) < 0.01 && Math.abs(p.h - ph) < 0.01);
  if (preset) return { imp: preset.imp, source: "preset" };
  const longest = Math.max(pw, ph), shortest = Math.min(pw, ph);
  const bindDir = ph < pw ? "short" : "long"; // spine = page height
  return { imp: bookletImp(longest, shortest, bindDir), source: "custom" };
}

// ── Physical layout: priced imp → deterministic cell geometry ──
// All cell rects are in INCHES, PDF coordinates (origin bottom-left, y-up),
// X along the sheet's long axis.
// Gutter policy (fix d — nothing arbitrary): prefer a full double-bleed
// gutter (0.25″), squeeze to 0.125″ then butt-cut 0 only when the priced
// count can't fit otherwise. Deterministic and reported.
const GUTTERS = [0.25, 0.125, 0];
// Sanity cap on an operator-dictated grid (a fat-fingered "90 across" would
// otherwise build tens of thousands of cells before failing to fit).
const MANUAL_GRID_MAX = 400;

// The press images only the usable area (18.5×12.5 on 13×19; 27×12.5 on
// 13×27.5; 17.5×11.5 on 12×18) — everything placed, including marks, must
// live inside this rect or it simply won't print.
function printableRect(sheet) {
  const mx = (sheet.long - sheet.usableLong) / 2, my = (sheet.short - sheet.usableShort) / 2;
  return { x0: mx, y0: my, x1: sheet.long - mx, y1: sheet.short - my };
}

// The full sheet edge (0,0)-(long,short). Used only when layout.fillSheet is
// set — small saddle books that gang across the whole sheet for guillotine
// cutting deliberately spill past the imageable area (see computeSaddleLayout).
function fullSheetRect(sheet) { return { x0: 0, y0: 0, x1: sheet.long, y1: sheet.short }; }

// The bound the block is placed/clamped within: printable image area normally,
// full sheet in fill mode.
function boundRect(layout) { return layout.fillSheet ? fullSheetRect(layout.sheet) : printableRect(layout.sheet); }

// Per-gap gutter arrays for a layout: explicit layout.colGaps/rowGaps when set
// (individual gutters), otherwise the uniform scalar layout.gutter filled in.
// Uniform fill reproduces the pre-array behavior exactly.
function gapArrays(layout) {
  const cg = layout.colGaps || Array(Math.max(0, layout.across - 1)).fill(layout.gutter || 0);
  const rg = layout.rowGaps || Array(Math.max(0, layout.down - 1)).fill(layout.gutter || 0);
  return { cg, rg };
}
function sum(a) { return a.reduce((x, y) => x + y, 0); }


function fits(n, dim, g, usable) { return n * dim + (n - 1) * g <= usable + EPS; }

// allowedRot: which grid orientations to consider — [false, true] normally,
// narrowed by the operator's grid-orientation override.
function bestGridForCount(target, pieceLong, pieceShort, sheet, gutters, allowedRot) {
  for (const g of (gutters || GUTTERS)) {
    const candidates = [];
    for (const rotated of (allowedRot || [false, true])) {
      const w = rotated ? pieceShort : pieceLong;
      const h = rotated ? pieceLong : pieceShort;
      const maxA = Math.floor((sheet.usableLong + g + EPS) / (w + g));
      const maxD = Math.floor((sheet.usableShort + g + EPS) / (h + g));
      for (let a = 1; a <= maxA; a++) {
        if (target % a) continue;
        const d = target / a;
        if (d <= maxD && fits(a, w, g, sheet.usableLong) && fits(d, h, g, sheet.usableShort)) {
          candidates.push({ a, d, rotated, g });
        }
      }
    }
    if (candidates.length) {
      // fewest rows (fewest horizontal cuts) first, then unrotated
      candidates.sort((p, q) => p.d - q.d || (p.rotated ? 1 : 0) - (q.rotated ? 1 : 0));
      return candidates[0];
    }
  }
  return null;
}

// Trim-block origin. Default JOGS the block 0.5″ against the sheet's
// lower-right corner (shop practice: the back mirrors across the short-edge
// flip, landing lower-LEFT — same physical corner, so the cutter jogs both
// sides against one registration corner). "center" and "custom" available.
// Always clamped so the TRIM stays inside the printable image area.
function blockOrigin(layout, offset, warnings) {
  const s = layout.sheet;
  const { cg, rg } = gapArrays(layout);
  const totalW = layout.across * layout.cellW + sum(cg);
  const totalH = layout.down * layout.cellH + sum(rg);
  const P = boundRect(layout);
  // fill-sheet layouts always centre on the full sheet (even outer margins).
  const mode = layout.fillSheet ? "center" : (offset && offset.mode) || "jog";
  let x, y;
  if (mode === "center") {
    x = (s.long - totalW) / 2; y = (s.short - totalH) / 2;
  } else {
    const right = mode === "custom" && isFinite(offset.right) ? Math.max(+offset.right, 0) : 0.5;
    const bottom = mode === "custom" && isFinite(offset.bottom) ? Math.max(+offset.bottom, 0) : 0.5;
    x = s.long - right - totalW;
    y = bottom;
  }
  const cx = Math.min(Math.max(x, P.x0), P.x1 - totalW);
  const cy = Math.min(Math.max(y, P.y0), P.y1 - totalH);
  if (mode !== "center" && (Math.abs(cx - x) > EPS || Math.abs(cy - y) > EPS)) {
    warnings.push(`Layout offset clamped to keep the trim inside the printable area (${s.usableLong}×${s.usableShort}″).`);
  }
  // In fill mode the spill past the imageable area is intentional (guillotine
  // cutting), so the "bleed falls outside" warning is suppressed.
  if (!layout.fillSheet) {
    const clipped = [];
    const b = layout.bleed;
    if (cx - b < P.x0 - EPS) clipped.push("left");
    if (cx + totalW + b > P.x1 + EPS) clipped.push("right");
    if (cy - b < P.y0 - EPS) clipped.push("bottom");
    if (cy + totalH + b > P.y1 + EPS) clipped.push("top");
    if (clipped.length) warnings.push(`Outer bleed falls outside the printable area on the ${clipped.join("/")} edge(s) and will not image — cuts there may show paper white.`);
  }
  return { x0: cx, y0: cy };
}

// Per-cell 180° gang patterns. Rows are indexed bottom-up (y-up grid), so
// "head-to-head" pairs rows (0,1), (2,3)… with heads meeting at the pair's
// shared cut; "foot-to-foot" is the phase-shifted complement. Each piece's
// BACK inherits its front rotation automatically, so patterned sheets still
// register through the duplex flip.
function patternRot(pattern, manual, col, row, across) {
  switch (pattern) {
    case "h2h":      return row % 2 ? 180 : 0;
    case "f2f":      return row % 2 ? 0 : 180;
    case "reversal": return col % 2 ? 180 : 0;
    case "revalt":   return (col + row) % 2 ? 180 : 0;
    case "manual":   return manual && +manual[row * across + col] === 180 ? 180 : 0;
    default:         return 0;
  }
}

function buildCells(layout, opts) {
  // Per-gap gutters: cumulative column/row offsets, and each interior clip
  // extends min(BLEED, thatGap/2) toward its neighbour (butt-cut when the gap
  // is 0); perimeter clip always gets full BLEED. Uniform gutters reproduce
  // the previous fixed-stride behaviour exactly.
  const w = layout.cellW, h = layout.cellH;
  const { cg, rg } = gapArrays(layout);
  const { x0, y0 } = blockOrigin(layout, opts && opts.offset, layout.warnings);
  const pattern = (opts && opts.pattern) || "straight";
  const manual = opts && opts.manualPattern;
  const b = layout.bleed;
  const colX = [0]; for (let c = 1; c < layout.across; c++) colX[c] = colX[c - 1] + w + cg[c - 1];
  const rowY = [0]; for (let r = 1; r < layout.down; r++) rowY[r] = rowY[r - 1] + h + rg[r - 1];
  const half = g => Math.min(b, g / 2);
  layout.cells = [];
  for (let row = 0; row < layout.down; row++) {
    for (let col = 0; col < layout.across; col++) {
      const x = x0 + colX[col], y = y0 + rowY[row];
      const left  = col === 0 ? b : half(cg[col - 1]);
      const right = col === layout.across - 1 ? b : half(cg[col]);
      const bot   = row === 0 ? b : half(rg[row - 1]);
      const top   = row === layout.down - 1 ? b : half(rg[row]);
      layout.cells.push({
        col, row,
        patRot: patternRot(pattern, manual, col, row, layout.across),
        trim: { x, y, w, h },
        clip: { x: x - left, y: y - bot, w: w + left + right, h: h + bot + top },
      });
    }
  }
}

// Max copies that physically fit, ignoring the priced count — used ONLY on
// explicit operator override when pricing over-promised (never silently).
function bestPhysicalGrid(pieceLong, pieceShort, sheet, gutters, allowedRot) {
  let best = null;
  for (const g of (gutters || GUTTERS)) {
    for (const rotated of (allowedRot || [false, true])) {
      const w = rotated ? pieceShort : pieceLong;
      const h = rotated ? pieceLong : pieceShort;
      const a = Math.floor((sheet.usableLong + g + EPS) / (w + g));
      const d = Math.floor((sheet.usableShort + g + EPS) / (h + g));
      if (a >= 1 && d >= 1 && (!best || a * d > best.a * best.d)) best = { a, d, rotated, g };
    }
  }
  return best;
}

// Manual grid: the operator dictates columns × rows outright (e.g. a 2×4
// coupon run 9 across × 3 down) instead of the count being derived from the
// priced imp. Tries each candidate sheet, then each allowed orientation, then
// the gutter ladder, and returns the first combination that physically fits —
// explicit per-gap gutters are used as-is when their length matches the grid.
// Never derives the count: it places exactly what was asked for, or fails and
// hands back the tightest near-miss so the caller can report the footprint.
function fitManualGrid(a, d, pieceLong, pieceShort, sheets, gutters, allowedRot, colGaps, rowGaps, fillSheet) {
  const cgOK = colGaps && colGaps.length === a - 1 ? colGaps : null;
  const rgOK = rowGaps && rowGaps.length === d - 1 ? rowGaps : null;
  let best = null;
  for (const sh of sheets) {
    const bw = fillSheet ? sh.long : sh.usableLong;
    const bh = fillSheet ? sh.short : sh.usableShort;
    for (const rotated of (allowedRot || [false, true])) {
      const w = rotated ? pieceShort : pieceLong, h = rotated ? pieceLong : pieceShort;
      for (const g of (gutters || GUTTERS)) {
        const cg = cgOK || Array(Math.max(0, a - 1)).fill(g);
        const rg = rgOK || Array(Math.max(0, d - 1)).fill(g);
        const W = a * w + sum(cg), H = d * h + sum(rg);
        const cand = { sheet: sh, grid: { a, d, rotated, g }, W, H, bw, bh };
        if (W <= bw + EPS && H <= bh + EPS) return { ok: cand };
        const over = q => Math.max(0, q.W - q.bw) + Math.max(0, q.H - q.bh);
        if (!best || over(cand) < over(best)) best = cand;
        if (cgOK && rgOK) break; // the gutter ladder changes nothing when both axes are explicit
      }
    }
  }
  return { ok: null, best };
}

function computeLayout(calc, trimA, trimB, opts) {
  if (calc === "saddle") return computeSaddleLayout(trimA, trimB, opts); // trimA = page WIDTH, trimB = page HEIGHT (not normalized — spine is the height edge)
  const pieceLong = Math.max(trimA, trimB), pieceShort = Math.min(trimA, trimB);
  const warnings = [];
  let mismatch = false;
  if (UNSUPPORTED_BOOKLETS.includes(calc)) {
    throw new Error("Perfect bound / coupon book imposition is not in v1 — flats, stickers, and saddle stitch booklets only.");
  }
  // Per-job bleed (default 0.125). The auto gutter ladder is bleed-derived:
  // full double bleed, single bleed, butt cut.
  const bleed = opts && isFinite(opts.bleed) && opts.bleed !== null ? Math.min(Math.max(+opts.bleed, 0), 0.5) : BLEED;
  if (Math.abs(bleed - BLEED) > EPS) warnings.push(`Bleed override: ${bleed}″ per side (default ${BLEED}″).`);
  const autoGutters = bleed > 0 ? [2 * bleed, bleed, 0] : [0];
  // Gutter override: a fixed value replaces the auto policy everywhere
  const gutters = opts && isFinite(opts.gutter) && opts.gutter !== null ? [Math.max(+opts.gutter, 0)] : autoGutters;
  // Grid-orientation override: "no" = pieces long-edge along the sheet's
  // long axis only; "yes" = rotated 90° only; anything else = auto.
  const allowedRot = opts && opts.forceRotated === "yes" ? [true]
                   : opts && opts.forceRotated === "no" ? [false] : [false, true];
  // ── Manual grid + per-gap gutters (operator dictates the layout) ──
  // Columns × rows set outright, and optionally each individual gutter, the
  // press sheet, and whether the block may run past the imageable area.
  // Pricing parity is NOT assumed here: the placed count is always reported
  // against the priced imp on the badge, in the warnings, and on the slug.
  const rawCol = opts && Array.isArray(opts.colGaps) ? opts.colGaps.map(v => Math.max(0, +v || 0)) : null;
  const rawRow = opts && Array.isArray(opts.rowGaps) ? opts.rowGaps.map(v => Math.max(0, +v || 0)) : null;
  const fillSheet = !!(opts && opts.fillSheet);
  const mgIn = opts && opts.manualGrid;
  const manual = mgIn && +mgIn.across >= 1 && +mgIn.down >= 1
    ? { a: Math.floor(+mgIn.across), d: Math.floor(+mgIn.down) } : null;
  if (manual && manual.a * manual.d > MANUAL_GRID_MAX)
    throw new Error(`Manual grid ${manual.a}×${manual.d} = ${manual.a * manual.d} pieces exceeds the ${MANUAL_GRID_MAX}-cell limit.`);

  // Priced imp + default press sheet per calc type (verbatim pricing ports).
  let sheet, priced, grid, efficient = false, manualGrid = false;
  if (calc === "sticker") {
    priced = stickerImp(pieceLong, pieceShort);
    if (priced < 1) throw new Error(`${pieceLong}×${pieceShort}″ does not fit the 12×18 sticker sheet`);
    sheet = SHEETS["12x18"];
  } else if (PB_CALCS.includes(calc)) {
    priced = 0;                       // sentinel: unpriced, best physical fit below
    sheet = SHEETS["13x19"];
  } else if (FLAT_CALCS.includes(calc)) {
    priced = flatImp(pieceLong, pieceShort);
    sheet = SHEETS["13x19"];
    if (priced < 1) { priced = flatImp(pieceLong, pieceShort, 27); sheet = SHEETS["13x27.5"]; } // calculators' two-sheet rule
    if (priced < 1) throw new Error(`${pieceLong}×${pieceShort}″ does not image on any press sheet`);
  } else {
    throw new Error(`Unknown calc type "${calc}"`);
  }

  // Operator's parent-sheet override replaces the product's press sheet. The
  // priced imp above is left alone, so a count that no longer fits surfaces
  // through the normal mismatch path instead of quietly changing.
  const ovSheet = (opts && opts.sheetOverride) || null;
  if (ovSheet) sheet = ovSheet;

  if (manual) {
    const cands = ovSheet ? [ovSheet]
                : opts && opts.manualSheet && SHEETS[opts.manualSheet] ? [SHEETS[opts.manualSheet]]
                : calc === "sticker" ? [SHEETS["12x18"]] : [SHEETS["13x19"], SHEETS["13x27.5"]];
    const res = fitManualGrid(manual.a, manual.d, pieceLong, pieceShort, cands, gutters, allowedRot, rawCol, rawRow, fillSheet);
    if (!res.ok) {
      const b = res.best;
      throw new Error(`Manual ${manual.a}×${manual.d} grid of ${pieceLong}×${pieceShort}″ needs ${b.W.toFixed(2)}×${b.H.toFixed(2)}″ but the ${b.sheet.label} ${fillSheet ? "sheet" : "printable area"} is ${b.bw}×${b.bh}″. Reduce columns/rows or gutters${fillSheet ? "" : ", or tick “fill full sheet” to use the whole sheet"}.`);
    }
    sheet = res.ok.sheet; grid = res.ok.grid; manualGrid = true;
    const placed = grid.a * grid.d;
    warnings.push(`Manual grid: ${grid.a} across × ${grid.d} down = ${placed}-up on ${sheet.label}${grid.rotated ? " (pieces rotated 90°)" : ""}${placed === Math.round(priced) ? "" : ` — pricing assumed ${priced}-up, so sheet count and cost per piece will differ`}.`);
    if (calc === "sticker") warnings.push(`Manual grid overrides the 12×18 crack-n-peel ${STICKER.pitch}″ pitch — confirm the liner/die matches before printing.`);
    if (!rawCol && !rawRow && grid.g < gutters[0] && gutters.length > 1) warnings.push(grid.g === 0
      ? "Butt-cut layout (no gutter) needed to fit the manual grid — adjacent pieces share cut lines, no inter-piece bleed."
      : `Gutter squeezed to ${grid.g}″ to fit the manual grid.`);
  } else if (!priced) {
    // Unpriced (perfect bound). Try the standard sheet, then the oversize one,
    // and take whatever fits best. Reported as an explicit best-fit so nobody
    // reads the count as a pricing figure.
    const cands = ovSheet ? [ovSheet] : [SHEETS["13x19"], SHEETS["13x27.5"]];
    let best = null;
    for (const sh of cands) {
      const g = bestPhysicalGrid(pieceLong, pieceShort, sh, gutters, allowedRot);
      if (g && (!best || g.a * g.d > best.g.a * best.g.d)) best = { sh, g };
      if (best && !opts.efficient) break;      // first sheet that holds anything wins
    }
    if (!best) throw new Error(`${pieceLong}×${pieceShort}″ does not fit on ${cands.map(c => c.label).join(" or ")} — check the trim size and spine.`);
    sheet = best.sh; grid = best.g;
    warnings.push(`${grid.a * grid.d}-up on ${sheet.label} (best physical fit — perfect bound has no priced imposition).`);
  } else if (calc === "sticker" && !ovSheet) {
    if (opts && isFinite(opts.gutter) && opts.gutter !== null && Math.abs(+opts.gutter - STICKER.pitch) > EPS) {
      warnings.push(`Sticker pitch is fixed at ${STICKER.pitch}″ by the 12×18 crack-n-peel spec — gutter override ignored.`);
    }
    const g0 = stickerGrid(pieceLong, pieceShort), g1 = stickerGrid(pieceShort, pieceLong);
    let rotated = g1.a * g1.d > g0.a * g0.d;
    if (opts && opts.forceRotated === "yes") rotated = true;
    else if (opts && opts.forceRotated === "no") rotated = false;
    const gg = rotated ? g1 : g0;
    if (gg.a * gg.d < priced) { mismatch = true; warnings.push(`MISMATCH: forced orientation fits ${gg.a * gg.d}-up but pricing assumed ${priced}-up.`); }
    if (gg.a * gg.d < 1) throw new Error("Forced orientation does not fit the sticker sheet.");
    grid = { a: gg.a, d: gg.d, rotated, g: STICKER.pitch };
  } else {
    if (calc === "sticker" && ovSheet) {
      warnings.push(`Parent sheet overridden to ${sheet.label} — the 12×18 crack-n-peel ${STICKER.pitch}″ pitch no longer applies; confirm the liner/die matches.`);
    }
    // Efficient mode: re-lay the piece on the oversize sheet (or on whatever
    // parent the operator forced) and let the multiple expand to fill it.
    // The pricing basis stays the product's own imp — this saves press passes.
    const effSheet = ovSheet || SHEETS["13x27.5"];
    if (opts && opts.efficient && priced >= 2 && (ovSheet || sheet.key === "13x19")) {
      sheet = effSheet;
      grid = bestPhysicalGrid(pieceLong, pieceShort, sheet, gutters, allowedRot);
      if (!grid) throw new Error(`${pieceLong}×${pieceShort}″ does not fit on ${sheet.label} with the selected gutter/orientation.`);
      efficient = true;
      warnings.push(`Efficient mode: ${grid.a * grid.d}-up on ${sheet.label} (priced ${priced}-up).`);
    } else {
      if (opts && opts.efficient) warnings.push(`Efficient mode applies to sizes imaging ≥2-up — ignored for this size.`);
      grid = bestGridForCount(Math.round(priced), pieceLong, pieceShort, sheet, gutters, allowedRot);
      if (!grid) {
        // Pricing promised more than physically fits — surface loudly, never
        // silently under- or over-place (brief §2). Placement below the priced
        // count happens only on explicit operator override, and is flagged in
        // the UI, the warnings, and the sheet's slug line.
        if (!(opts && opts.allowBestFit)) {
          throw new Error(`Priced imposition ${priced}-up of ${pieceLong}×${pieceShort}″ does not physically fit on ${sheet.label}${gutters.length === 1 ? ` with a ${gutters[0]}″ gutter` : ""}${allowedRot.length === 1 ? " in the forced orientation" : ""}. Pricing/production mismatch — enable "allow best physical fit" to place the maximum that fits (flagged), and review pricing for this size.`);
        }
        grid = bestPhysicalGrid(pieceLong, pieceShort, sheet, gutters, allowedRot);
        if (!grid) throw new Error(`${pieceLong}×${pieceShort}″ does not physically fit on ${sheet.label} at all.`);
        mismatch = true;
        warnings.push(`MISMATCH: placing ${grid.a * grid.d}-up but the customer was priced ${priced}-up — sheet count and margin will differ. Review pricing for this size.`);
      }
      if (grid.g < gutters[0] && gutters.length > 1) warnings.push(grid.g === 0
        ? `Butt-cut layout (no gutter) needed to honour the priced ${priced}-up — adjacent pieces share cut lines, no inter-piece bleed.`
        : `Gutter squeezed to ${grid.g}″ to honour the priced ${priced}-up.`);
    }
  }

  const cellW = grid.rotated ? pieceShort : pieceLong;
  const cellH = grid.rotated ? pieceLong : pieceShort;

  // ── Explicit per-gap gutters, validated against the final grid ──
  // Arrays sized to a different grid (the operator changed columns/rows after
  // editing gutters) fall back to the uniform gutter rather than mis-space.
  const colGaps = rawCol && rawCol.length === grid.a - 1 ? rawCol : null;
  const rowGaps = rawRow && rawRow.length === grid.d - 1 ? rawRow : null;
  if ((rawCol && rawCol.length && !colGaps) || (rawRow && rawRow.length && !rowGaps))
    warnings.push(`Custom gutters were set for a different grid — reset to the uniform ${grid.g}″ gutter for this ${grid.a}×${grid.d} layout.`);

  // Footprint must fit the physical sheet; past the imageable area is allowed
  // only as a deliberate full-sheet fill (guillotine cutting).
  const cgA = colGaps || Array(Math.max(0, grid.a - 1)).fill(grid.g);
  const rgA = rowGaps || Array(Math.max(0, grid.d - 1)).fill(grid.g);
  const totalW = grid.a * cellW + sum(cgA), totalH = grid.d * cellH + sum(rgA);
  if (totalW > sheet.long + EPS || totalH > sheet.short + EPS)
    throw new Error(`Gutters make the ${grid.a}×${grid.d} layout ${totalW.toFixed(2)}×${totalH.toFixed(2)}″ — larger than the ${sheet.label} sheet. Reduce gutters or pieces.`);
  if (!fillSheet && (totalW > sheet.usableLong + EPS || totalH > sheet.usableShort + EPS))
    warnings.push(`Block ${totalW.toFixed(2)}×${totalH.toFixed(2)}″ is larger than the printable area (${sheet.usableLong}×${sheet.usableShort}″) — the outer edges will not image. Tick “fill full sheet” only if this sheet is being guillotine-cut.`);

  const layout = {
    sheet, calc, pieceLong, pieceShort, bleed,
    across: grid.a, down: grid.d, rotated: grid.rotated, gutter: grid.g,
    colGaps, rowGaps, fillSheet, sheetForced: !!ovSheet,
    imp: grid.a * grid.d, pricedImp: priced || grid.a * grid.d, unpriced: !priced, mismatch, efficient, manualGrid, warnings,
    cellW, cellH,
  };
  buildCells(layout, opts);
  return layout;
}

// ── Saddle stitch layout: cells are reader SPREADS (2 pages joined at a
// vertical spine), impHalf spreads per sheet side = the priced pages/side ──
function computeSaddleLayout(pw, ph, opts) {
  if (!(pw >= 2 && ph >= 2)) throw new Error("Enter page width × height (min 2″)");
  const warnings = [];
  let mismatch = false;
  const bleed = opts && isFinite(opts.bleed) && opts.bleed !== null ? Math.min(Math.max(+opts.bleed, 0), 0.5) : BLEED;
  if (Math.abs(bleed - BLEED) > EPS) warnings.push(`Bleed override: ${bleed}″ per side (default ${BLEED}″).`);
  const { imp, source } = resolveSaddleImp(pw, ph);
  if (imp < 1) throw new Error(`${pw}×${ph}″ pages do not image on any press sheet (imp=${imp})`);
  const spreadW = 2 * pw, spreadH = ph; // spine vertical in spread space
  const spL = Math.max(spreadW, spreadH), spS = Math.min(spreadW, spreadH);
  let sheet, target, efficient = false;
  if (imp >= 2) {
    sheet = SHEETS["13x19"];
    target = Math.floor(imp / 2);
    if (imp % 2) { mismatch = true; warnings.push(`MISMATCH: priced ${imp} pages/side is odd — placing ${target} whole spread(s) (${target * 2} pages/side). Review pricing for this size.`); }
  } else {
    // imp:1 presets (12×12, 11×8.5 L, 12×9 L): the open spread only fits the
    // 13×27.5 oversize sheet, 1 spread per side — same page throughput the
    // pricing assumes (1 page per 13×19-side equivalent).
    sheet = SHEETS["13x27.5"];
    target = 1;
    warnings.push("Open spread requires the 13×27.5 oversize sheet (1 spread per side).");
  }
  // Parent-sheet override: physical sheet only, priced imp untouched.
  const ovSheet = (opts && opts.sheetOverride) || null;
  if (ovSheet) sheet = ovSheet;
  // Saddle spreads BUTT by default: signatures share one cut line and the
  // interior bleed is cropped at it (cell clips stop at the shared trim), so
  // bleed never manufactures a gutter the operator didn't ask for. The
  // Gutter override still spaces spreads out explicitly when wanted.
  const gutters = opts && isFinite(opts.gutter) && opts.gutter !== null ? [Math.max(+opts.gutter, 0)] : [0];
  let grid = null, colGaps = null, rowGaps = null, fillSheet = false;

  // ── Manual signature copies (operator dictates how many go on the sheet) ──
  // The saddle equivalent of the flats manual grid: instead of taking the
  // spread count from the priced imp table, the operator says "3 across × 1
  // down" and gets exactly that many identical signature copies per side.
  // Fewer press passes for the same book count; pricing parity is NOT assumed,
  // so the result is flagged against the priced imp exactly like a flat.
  let manualGrid = false;
  const mgIn = opts && opts.manualGrid;
  const manual = mgIn && +mgIn.across >= 1 && +mgIn.down >= 1
    ? { a: Math.floor(+mgIn.across), d: Math.floor(+mgIn.down) } : null;
  if (manual) {
    if (manual.a * manual.d > MANUAL_GRID_MAX)
      throw new Error(`Manual grid ${manual.a}×${manual.d} = ${manual.a * manual.d} signature copies exceeds the ${MANUAL_GRID_MAX}-cell limit.`);
    const cands = ovSheet ? [ovSheet] : [SHEETS["13x19"], SHEETS["13x27.5"]];
    const res = fitManualGrid(manual.a, manual.d, spL, spS, cands, gutters, [false, true],
                              opts && opts.saddleColGaps, opts && opts.saddleRowGaps, !!(opts && opts.saddleFillSheet));
    if (!res.ok) {
      const b = res.best;
      throw new Error(`Manual ${manual.a}×${manual.d} of a ${spreadW}×${spreadH}″ spread needs ${b.W.toFixed(2)}×${b.H.toFixed(2)}″ but the ${b.sheet.label} ${(opts && opts.saddleFillSheet) ? "sheet" : "printable area"} is ${b.bw}×${b.bh}″. Reduce copies or gutters${(opts && opts.saddleFillSheet) ? "" : ", or tick “fill full sheet”"}.`);
    }
    sheet = res.ok.sheet; grid = res.ok.grid; manualGrid = true;
    const c = grid.a * grid.d;
    warnings.push(`Manual signatures: ${grid.a} across × ${grid.d} down = ${c} cop${c === 1 ? "y" : "ies"}/side on ${sheet.label}${grid.rotated ? " (spreads rotated 90°)" : ""}${c === target ? "" : ` — pricing assumed ${target} per 13×19-side, so sheet count and cost per book will differ`}.`);
  }

  // ── Step and repeat (saddle): N identical copies of each signature per sheet ──
  // Pagination is untouched — the book is still imposed into signatures the
  // normal way; this only says how many copies of the SAME signature ride one
  // press sheet. Unlike the manual grid the operator gives a COUNT, not a
  // shape: the tool picks the arrangement that fits (fewest cuts first) and
  // promotes to the oversize sheet when the standard one cannot hold it.
  let stepRepeat = 0;
  const repN = opts && isFinite(+opts.sigRepeat) ? Math.floor(+opts.sigRepeat) : 0;
  if (!grid && repN >= 1) {
    if (repN > MANUAL_GRID_MAX)
      throw new Error(`Step and repeat ${repN} copies exceeds the ${MANUAL_GRID_MAX}-cell limit.`);
    const cands = ovSheet ? [ovSheet] : [SHEETS["13x19"], SHEETS["13x27.5"]];
    let hit = null;
    for (const sh of cands) {
      const g = bestGridForCount(repN, spL, spS, sh, gutters);
      if (g) { hit = { sheet: sh, grid: g }; break; }
    }
    if (!hit) {
      const room = cands.map(sh => { const b = bestPhysicalGrid(spL, spS, sh, gutters); return { sh, n: b ? b.a * b.d : 0 }; })
                        .reduce((x, y) => (y.n > x.n ? y : x));
      throw new Error(`Step and repeat ${repN}: ${repN} copies of a ${spreadW}×${spreadH}″ spread do not fit in a whole grid${room.n ? ` — ${room.sh.label} holds at most ${room.n}` : ""}. Lower the count, or use “set signature copies manually” for an uneven arrangement.`);
    }
    sheet = hit.sheet; grid = hit.grid; stepRepeat = repN; manualGrid = true;
    warnings.push(`Step and repeat: ${repN} identical cop${repN === 1 ? "y" : "ies"} of each signature per side — ${grid.a} across × ${grid.d} down on ${sheet.label}${grid.rotated ? " (spreads rotated 90°)" : ""}${repN === target ? "" : ` — pricing assumed ${target} per 13×19-side, so sheet count and cost per book will differ`}.`);
  }

  // Efficient mode — the oversize sheet, or whatever parent was forced.
  if (!grid && opts && opts.efficient) {
    const effSheet = ovSheet || SHEETS["13x27.5"];
    const effGrid = bestPhysicalGrid(spL, spS, effSheet, gutters);
    if (effGrid && effGrid.a * effGrid.d > target) {
      sheet = effSheet; grid = effGrid; efficient = true;
      const c = effGrid.a * effGrid.d;
      warnings.push(`Efficient mode: ${c} signature cop${c === 1 ? "y" : "ies"}/side on ${effSheet.label} (priced ${target} per 13×19-side).`);
    } else {
      warnings.push("Efficient 13×27.5 mode fits no additional signature copies for this booklet size — ignored.");
    }
  }
  if (!grid) grid = bestGridForCount(target, spL, spS, sheet, gutters);
  if (!grid) {
    if (!(opts && opts.allowBestFit)) {
      throw new Error(`${target} spread(s) of ${spreadW}×${spreadH}″ (pages ${pw}×${ph}″, priced ${imp}/side${source === "custom" ? ", custom size" : ""}) do not physically fit on ${sheet.label}${gutters.length === 1 ? ` with a ${gutters[0]}″ gutter` : ""}. Pricing/production mismatch — enable "allow best physical fit" to place fewer (flagged).`);
    }
    grid = bestPhysicalGrid(spL, spS, sheet, gutters);
    if (!grid) throw new Error(`A ${spreadW}×${spreadH}″ spread does not fit on ${sheet.label} at all.`);
    mismatch = true;
    warnings.push(`MISMATCH: placing ${grid.a * grid.d} spread(s)/side but pricing assumed ${target}. Review before printing.`);
  }

  const pieceLong = Math.max(spreadW, spreadH), pieceShort = Math.min(spreadW, spreadH);
  const cellW = grid.rotated ? pieceShort : pieceLong;
  const cellH = grid.rotated ? pieceLong : pieceShort;

  // ── Manual per-gap gutter override (from the signature-gutter editor) ──
  // Sized to the current across×down grid; replaces the rule/uniform gaps.
  // (saddle* names are the original opts; the generic colGaps/rowGaps/fillSheet
  // are the shared editor's — either is accepted so both callers work.)
  const mCol = opts && Array.isArray(opts.saddleColGaps) ? opts.saddleColGaps
             : opts && Array.isArray(opts.colGaps) ? opts.colGaps : null;
  const mRow = opts && Array.isArray(opts.saddleRowGaps) ? opts.saddleRowGaps
             : opts && Array.isArray(opts.rowGaps) ? opts.rowGaps : null;
  if (mCol && mCol.length === grid.a - 1) colGaps = mCol.map(v => Math.max(0, +v || 0));
  if (mRow && mRow.length === grid.d - 1) rowGaps = mRow.map(v => Math.max(0, +v || 0));
  const mFill = opts && opts.saddleFillSheet != null ? opts.saddleFillSheet
              : opts && opts.fillSheet != null ? opts.fillSheet : null;
  if (mFill != null) fillSheet = !!mFill;

  // Footprint must fit the physical sheet.
  const cgA = colGaps || Array(Math.max(0, grid.a - 1)).fill(grid.g);
  const rgA = rowGaps || Array(Math.max(0, grid.d - 1)).fill(grid.g);
  const totalW = grid.a * cellW + sum(cgA), totalH = grid.d * cellH + sum(rgA);
  if (totalW > sheet.long + EPS || totalH > sheet.short + EPS)
    throw new Error(`Gutters make the ${grid.a}×${grid.d} layout ${totalW.toFixed(2)}×${totalH.toFixed(2)}″ — larger than the ${sheet.label} sheet. Reduce gutters or copies.`);

  if (!colGaps && !rowGaps && grid.a * grid.d > 1) warnings.push(grid.g === 0
    ? "Spreads butt (default) — one cut line between signatures, interior bleed cropped at it. Set a Gutter to space them instead."
    : `${grid.g}″ gutter between spreads.`);

  const layout = {
    sheet, calc: "saddle", pieceLong, pieceShort, bleed,
    across: grid.a, down: grid.d, rotated: grid.rotated, gutter: grid.g,
    colGaps, rowGaps, fillSheet, sheetForced: !!ovSheet, manualGrid, stepRepeat,
    imp: grid.a * grid.d * 2,      // pages per sheet side actually placed
    pricedImp: imp,                 // pages per side the calculator priced
    mismatch, efficient, warnings,
    cellW, cellH,
    booklet: {
      pw, ph, spreadW, spreadH,
      spreadsPerSide: grid.a * grid.d,
      // spread runs along X unless the grid put its long axis vertical
      spreadAlongX: (spreadW >= spreadH) ? !grid.rotated : grid.rotated,
    },
  };
  buildCells(layout, { offset: opts && opts.offset }); // patterns don't apply to signature spreads
  return layout;
}

// ═══════════════════════════════════════════════════════════════
// PDF ENGINE (pdf-lib) — vector-preserving placement.
// (a) source pages are embedded as vector XObjects, never rasterized;
//     output boxes are set explicitly; preflight validates the result.
// ═══════════════════════════════════════════════════════════════

// Low-level page box reader — robust across pdf-lib versions.
function getPageBox(page, name) {
  try {
    let v = page.node.get(PL.PDFName.of(name));
    if (!v) return null;
    v = page.node.context.lookup(v);
    if (!v || typeof v.lookup !== "function" || (v.size ? v.size() : 0) !== 4) return null;
    const n = i => { const el = v.lookup(i); return el && typeof el.asNumber === "function" ? el.asNumber() : null; };
    const nums = [n(0), n(1), n(2), n(3)];
    if (nums.some(x => x === null || !isFinite(x))) return null;
    const [x0, y0, x1, y1] = nums;
    return { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
  } catch (e) { return null; }
}

// Map a rect through the page's /Rotate into displayed coordinates (fix b:
// never place a page whose /Rotate we haven't accounted for). Rects are
// media-origin-relative, y-up. W/H are the RAW media dims.
function displayRect(rect, rot, W, H) {
  const pts = [[rect.x, rect.y], [rect.x + rect.w, rect.y + rect.h]];
  const map = ([u, v]) => rot === 90 ? [v, W - u] : rot === 180 ? [W - u, H - v] : rot === 270 ? [H - v, u] : [u, v];
  const [p1, p2] = pts.map(map);
  return { x: Math.min(p1[0], p2[0]), y: Math.min(p1[1], p2[1]), w: Math.abs(p2[0] - p1[0]), h: Math.abs(p2[1] - p1[1]) };
}

// ── PDF threat inspection & sanitization ────────────────────────
// Malicious-PDF payloads live in the document catalog and annotations
// (JavaScript, auto-run actions, launch actions, embedded files, forms) —
// none of which survive the vector re-embed. inspectPdfThreats reports what
// a source file carries; sanitizePdf produces a 1:1 CLEAN copy (same pages,
// same size, content only) for files the shop must open even when
// imposition isn't possible. NOTE: annotations/form fields (including their
// visible appearance) do not carry into a sanitized copy.
function inspectPdfThreats(doc) {
  const flags = new Set();
  const ctx = doc.context;
  const look = (dict, name) => {
    try { const v = dict && dict.get(PL.PDFName.of(name)); return v ? ctx.lookup(v) : null; }
    catch (e) { return null; }
  };
  const cat = doc.catalog;
  const oa = look(cat, "OpenAction");
  if (oa && !(oa instanceof PL.PDFArray)) { // a plain array is a benign GoTo destination
    const s = oa instanceof PL.PDFDict ? oa.get(PL.PDFName.of("S")) : null;
    const sv = s ? s.toString().replace("/", "") : "unknown";
    flags.add(/JavaScript|Launch|SubmitForm|ImportData/i.test(sv) ? `auto-run ${sv} on open` : "auto-run action on open");
  }
  if (look(cat, "AA")) flags.add("document auto-actions");
  const names = look(cat, "Names");
  if (names) {
    if (look(names, "JavaScript")) flags.add("document JavaScript");
    if (look(names, "EmbeddedFiles")) flags.add("embedded file attachment(s)");
  }
  const af = look(cat, "AcroForm");
  if (af) flags.add(look(af, "XFA") ? "XFA form (scripted)" : "form fields");
  for (let i = 0; i < doc.getPageCount(); i++) {
    const node = doc.getPage(i).node;
    if (look(node, "AA")) flags.add(`page ${i + 1}: auto-actions`);
    const annots = look(node, "Annots");
    if (annots instanceof PL.PDFArray) {
      for (let j = 0; j < annots.size(); j++) {
        const an = ctx.lookup(annots.get(j));
        if (!(an instanceof PL.PDFDict)) continue;
        const st = an.get(PL.PDFName.of("Subtype"));
        if (st && /FileAttachment|RichMedia|Screen|Movie|Sound|3D/.test(st.toString())) flags.add(`page ${i + 1}: ${st.toString().slice(1)} annotation`);
        const a = look(an, "A");
        if (a instanceof PL.PDFDict) {
          const s = a.get(PL.PDFName.of("S"));
          if (s && /JavaScript|Launch|SubmitForm|ImportData/.test(s.toString())) flags.add(`page ${i + 1}: ${s.toString().replace("/", "")} link action`);
        }
        if (look(an, "AA")) flags.add(`page ${i + 1}: annotation auto-actions`);
      }
    }
  }
  return [...flags];
}

// Delete active-content keys from a loaded document IN PLACE. Done before any
// embedPdf so pdf-lib's object copier never even pulls the payload objects in
// (otherwise they linger as unreachable — inert, but visible to byte
// scanners). Page content streams + resources are untouched → vectors intact.
function stripActiveContent(doc) {
  const del = (dict, name) => { try { dict && dict.delete(PL.PDFName.of(name)); } catch (e) {} };
  const cat = doc.catalog;
  ["OpenAction", "AA", "AcroForm"].forEach(k => del(cat, k));
  try {
    const names = cat.get(PL.PDFName.of("Names"));
    const nd = names && doc.context.lookup(names);
    if (nd) { ["JavaScript", "EmbeddedFiles"].forEach(k => del(nd, k)); }
  } catch (e) {}
  for (let i = 0; i < doc.getPageCount(); i++) {
    const node = doc.getPage(i).node;
    ["Annots", "AA"].forEach(k => del(node, k));
  }
}

// 1:1 safety passthrough: every page re-embedded as a vector XObject into a
// fresh document — page count, size, display rotation, and Trim/Bleed boxes
// preserved; catalog/annotation payloads left behind.
async function sanitizePdf(bytes) {
  const src = await PL.PDFDocument.load(bytes, { ignoreEncryption: true });
  const n = src.getPageCount();
  if (n < 1) throw new Error("PDF has no pages");
  const threats = inspectPdfThreats(src);
  stripActiveContent(src);
  const out = await PL.PDFDocument.create();
  const embeds = await out.embedPdf(src, Array.from({ length: n }, (_, i) => i));
  // Carry the source's layer visibility onto the copy (see srcHiddenOCGRefs).
  // embedPdf is lazy — the copied XObjects only exist after flush(), so the
  // per-page hidden names are noted now and resolved against the copy later.
  const ocSrc = srcHiddenOCGRefs(src);
  const ocAcc = { all: new Map(), off: new Map() };
  const ocPending = ocSrc.any
    ? embeds.map((e, i) => ({ ref: e.ref, srcRes: pageResources(src.getPage(i).node), hidden: ocSrc.hidden }))
    : [];
  for (let i = 0; i < n; i++) {
    const sp = src.getPage(i);
    const mb = sp.getMediaBox();
    const rot = ((sp.getRotation().angle % 360) + 360) % 360;
    const p = out.addPage([mb.width, mb.height]);
    p.drawPage(embeds[i]);
    if (rot) p.setRotation(PL.degrees(rot));
    p.setMediaBox(0, 0, mb.width, mb.height);
    p.setCropBox(0, 0, mb.width, mb.height);
    const tb = getPageBox(sp, "TrimBox");
    if (tb) p.setTrimBox(tb.x - mb.x, tb.y - mb.y, tb.w, tb.h);
    const bb = getPageBox(sp, "BleedBox");
    if (bb) p.setBleedBox(bb.x - mb.x, bb.y - mb.y, bb.w, bb.h);
  }
  out.setTitle("CLEAN sanitized copy");
  out.setProducer("PPS Auto-Imposition Tool");
  out.setCreator("PPS Auto-Imposition Tool");
  if (ocPending.length) {
    await out.flush();
    collectPendingOC(out, ocPending, ocAcc);
    writeOCProperties(out, ocAcc);
  }
  return { bytes: await out.save({ useObjectStreams: false }), pages: n, threats };
}

const DIM_EPS = 0.02; // inches — dimension match tolerance (~1.4pt)

// Resolve where the finished piece lives on a source page + how it sits in a
// layout cell. Box priority (fix c): TrimBox → BleedBox−0.125″ → MediaBox
// heuristics. Scaling is always fit-to-trim (contain) — NEVER fill-crop.
function resolveSideArt(page, pieceLong, pieceShort, cellLandscape, bleed) {
  const B = isFinite(bleed) ? bleed : BLEED;
  const notes = [];
  const rot = ((page.getRotation().angle % 360) + 360) % 360;
  const mb = page.getMediaBox();
  const W = mb.width, H = mb.height;
  const rel = b => ({ x: b.x - mb.x, y: b.y - mb.y, w: b.w, h: b.h });

  let trimRaw = null;
  const tb = getPageBox(page, "TrimBox");
  if (tb && (Math.abs(tb.w - W) > 1 || Math.abs(tb.h - H) > 1)) {
    trimRaw = rel(tb); notes.push("art located by embedded TrimBox");
  }
  if (!trimRaw) {
    const bb = getPageBox(page, "BleedBox");
    if (bb && (Math.abs(bb.w - W) > 1 || Math.abs(bb.h - H) > 1)) {
      const r = rel(bb);
      trimRaw = { x: r.x + B * PT, y: r.y + B * PT, w: r.w - 2 * B * PT, h: r.h - 2 * B * PT };
      notes.push(`art located by embedded BleedBox − ${B}″ bleed`);
    }
  }
  const dispW = (rot % 180 ? H : W) / PT, dispH = (rot % 180 ? W : H) / PT;
  const aLong = Math.max(dispW, dispH), aShort = Math.min(dispW, dispH);
  if (!trimRaw) {
    if (Math.abs(aLong - (pieceLong + 2 * B)) < DIM_EPS && Math.abs(aShort - (pieceShort + 2 * B)) < DIM_EPS) {
      trimRaw = { x: B * PT, y: B * PT, w: W - 2 * B * PT, h: H - 2 * B * PT };
      notes.push(`page size = trim + ${2 * B}″ — treated as bleed-inclusive`);
    } else if (Math.abs(aLong - pieceLong) < DIM_EPS && Math.abs(aShort - pieceShort) < DIM_EPS) {
      trimRaw = { x: 0, y: 0, w: W, h: H };
      notes.push("page size = exact trim — NO BLEED in source file");
    } else {
      trimRaw = { x: 0, y: 0, w: W, h: H };
      notes.push(`page size ${aLong.toFixed(2)}×${aShort.toFixed(2)}″ matches neither trim nor trim+bleed — fit-to-trim scaled (content is never crop-filled)`);
    }
  }

  const trimDisp = displayRect(trimRaw, rot, W, H);
  // Cell rotation (fix b): rotate 90° ONLY when the art's own displayed
  // orientation differs from the cell's — never to squeeze art in.
  const artLandscape = trimDisp.w >= trimDisp.h;
  const cellRotate = artLandscape === cellLandscape ? 0 : 90;

  const effW = (cellRotate ? trimDisp.h : trimDisp.w) / PT;
  const effH = (cellRotate ? trimDisp.w : trimDisp.h) / PT;
  const cellW = cellLandscape ? pieceLong : pieceShort;
  const cellH = cellLandscape ? pieceShort : pieceLong;
  let scale = 1;
  if (Math.abs(effW - cellW) >= DIM_EPS || Math.abs(effH - cellH) >= DIM_EPS) {
    scale = Math.min(cellW / effW, cellH / effH); // contain — letterboxed, never cropped
    notes.push(`art trim ${effW.toFixed(2)}×${effH.toFixed(2)}″ ≠ spec trim ${cellW}×${cellH}″ — fit-to-trim scaled ×${scale.toFixed(4)}`);
  }
  const hasBleed = (W - trimRaw.w > 1) || (H - trimRaw.h > 1);
  if (!hasBleed) notes.push("no bleed available — cut lines may show paper white");
  // How far the art's own content runs past its trim, in PLACED inches — the
  // smallest of the four sides, so it is safe on every edge and needs no
  // rotation mapping (a min over all four is rotation-invariant). 0 for
  // no-bleed art. Used to work out what the pull-off-trim inset leaves behind.
  const ownBleed = Math.max(0, Math.min(
    trimRaw.x, W - trimRaw.x - trimRaw.w, trimRaw.y, H - trimRaw.y - trimRaw.h)) * scale / PT;

  return { page, rot, mediaW: W, mediaH: H, trimRaw, cellRotate, scale, hasBleed, ownBleed, notes,
           placedW: cellW, placedH: cellH };
}

// ---- add-bleed ink-edge detection -----------------------------------------
// Rasterize a source page (pdf.js, low DPI) and measure how far the actual
// ink stops short of each trim edge, in DISPLAY-space inches. A small
// shortfall (≤ SYNTH_MAXFIX) means the designer intended full bleed but the
// art fell shy — mirroring/scaling from the page edge would accentuate that
// white sliver, so the synth pre-scales past it. A LARGE margin is a design
// choice (white border, centered text page) and is left alone (gap → 0).
const SYNTH_MAXFIX = 0.1875; // in — biggest shortfall treated as "meant to bleed"
const SYNTH_MINGAP = 0.011;  // in — below raster resolution, treat as touching
const INK_DPI = 144, INK_LUM = 245;
async function detectInkGaps(pdfjsDoc, pnoZero, art) {
  const page = await pdfjsDoc.getPage(pnoZero + 1);
  const scale = INK_DPI / 72;
  const vp = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const td = displayRect(art.trimRaw, art.rot, art.mediaW, art.mediaH);
  const dispH = art.rot % 180 ? art.mediaW : art.mediaH;
  const x0 = Math.max(0, Math.floor(td.x * scale));
  const x1 = Math.min(canvas.width, Math.ceil((td.x + td.w) * scale));
  const r0 = Math.max(0, Math.floor((dispH - (td.y + td.h)) * scale));
  const r1 = Math.min(canvas.height, Math.ceil((dispH - td.y) * scale));
  if (x1 - x0 < 4 || r1 - r0 < 4) return null;
  const img = ctx.getImageData(x0, r0, x1 - x0, r1 - r0);
  const Wp = img.width, Hp = img.height, d = img.data;
  let minX = Wp, maxX = -1, minR = Hp, maxR = -1;
  for (let y = 0; y < Hp; y++) for (let x = 0; x < Wp; x++) {
    const i = (y * Wp + x) * 4;
    if (d[i] < INK_LUM || d[i + 1] < INK_LUM || d[i + 2] < INK_LUM) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minR) minR = y; if (y > maxR) maxR = y;
    }
  }
  if (maxX < 0) return null; // blank page — nothing to bleed
  const toIn = p => p / INK_DPI;
  // canvas rows grow downward: minR rows of white at the TOP edge
  return { left: toIn(minX), right: toIn(Wp - 1 - maxX), top: toIn(minR), bottom: toIn(Hp - 1 - maxR) };
}

// Detect text objects sitting close to each trim edge (raw page space).
// Mirror bleed would reflect a READABLE copy of such text into the bleed
// ring — the "auto" synth method switches those edges to streak bleed.
const TEXT_ZONE_PAD = 0.04; // in — beyond the bleed depth, catches descenders
const STREAK_EPS = 0.025;   // in — default sliver width stretched outward by streak bleed
const streakEpsOf = spec => Math.min(Math.max(+(spec && spec.streakEps) || STREAK_EPS, 0.005), 0.25);
async function detectTextNearEdges(pdfjsDoc, pnoZero, art, bleed) {
  const page = await pdfjsDoc.getPage(pnoZero + 1);
  const tc = await page.getTextContent();
  const v = page.view; // [x0,y0,x1,y1] media box, pts
  const T = art.trimRaw; // pts, relative to media origin, y-up
  const zone = (bleed + TEXT_ZONE_PAD) * PT;
  const near = { left: false, right: false, top: false, bottom: false };
  for (const it of tc.items || []) {
    if (!it.str || !it.str.trim() || !it.transform) continue;
    const tx = it.transform[4] - v[0], ty = it.transform[5] - v[1];
    const w = it.width || 0, h = it.height || Math.hypot(it.transform[1], it.transform[3]) || 0;
    const x0 = tx, x1 = tx + w, y0 = ty - 0.25 * h, y1 = ty + h; // pad baseline for descenders
    if (x1 < T.x || x0 > T.x + T.w || y1 < T.y || y0 > T.y + T.h) continue; // outside trim
    if (x0 < T.x + zone) near.left = true;
    if (x1 > T.x + T.w - zone) near.right = true;
    if (y0 < T.y + zone) near.bottom = true;
    if (y1 > T.y + T.h - zone) near.top = true;
  }
  return near;
}

// Synthesize bleed for no-bleed source art:
//   "mirror" — reflect the art's edge content outward past trim (classic
//              prepress mirror bleed; content at the cut line stays put).
//   "scale"  — enlarge the art just enough to cover the bleed box (content
//              grows ~2b/shortdim; safety margin shrinks by the same amount).
//   "streak" — stretch the outermost STREAK_EPS sliver of art outward to fill
//              the bleed (mirrored-stretch: continuous at the cut; any content
//              caught in the sliver smears into unreadable streaks).
//   "auto"   — mirror, except edges where text sits near trim get streak
//              (a mirror there would duplicate readable text).
// gaps (from detectInkGaps, display-space inches) make either mode "smart":
// fixable shortfalls fold into the scale factor so the synth never amplifies
// a white sliver at the cut. Only applies when the source page genuinely
// lacks bleed — files with real bleed are never touched.
// ── Pull art off the trim (safety inset) ────────────────────────────────────
// Customers routinely push text right up to the cut. This shrinks the placed
// art about the cell centre so every edge pulls INWARD by at least `inset`,
// moving that content away from the trim; the add-bleed synthesizer then fills
// the ring it opens — from the art's new edge out past the trim to the bleed
// box — so the cut still lands in ink. The two settings are one operation:
// the inset makes the room, the bleed fill makes up the difference.
//
// The scale is UNIFORM (never distort customer art), so a single factor cannot
// give the same inset on both axes. We solve for the SHORT axis and let the
// long axis pull in proportionally further — that way `inset` is a guaranteed
// minimum on every edge, which is the promise the operator needs.
const INSET_MAX = 0.5;
// Free scale on the placed art, up or down, independent of the bleed-coupled
// pull-off-trim inset (the two compose). Scaling DOWN opens the same kind of
// gap the inset does, so it feeds the same coverage maths and inherits the
// same protection against printing paper white inside the trim.
const ART_SCALE_MIN = 25, ART_SCALE_MAX = 400;
function artScaleOf(spec) {
  const v = +(spec && spec.artScale);
  if (!isFinite(v) || v === 100 || v <= 0) return 1;
  if (v < ART_SCALE_MIN || v > ART_SCALE_MAX)
    throw new Error(`Art scale ${v}% is outside the ${ART_SCALE_MIN}–${ART_SCALE_MAX}% range.`);
  return v / 100;
}
function insetOf(spec) {
  const v = +(spec && spec.artInset) || 0;
  if (!(v > 0)) return 0;
  const inset = Math.min(v, INSET_MAX);
  const modes = [spec.addBleed, ...Object.values(spec.addBleedPages || {})].filter(m => m && m !== "off");
  if (modes.includes("scale")) {
    throw new Error(`Pull-off-trim (${inset}″) and "Scale art up to bleed" are opposite operations — scale mode re-expands the art to the bleed box, undoing the inset. Choose Auto (text-safe), Mirror or Streak.`);
  }
  return inset;
}
function applyArtScale(art, userScale) {
  if (!(userScale > 0) || userScale === 1) return art;
  art.userScale = userScale;
  art.notes.push(`art scaled to ${(userScale * 100).toFixed(2)}% of the placed size (${userScale > 1 ? "content grows past the trim and is clipped" : "content pulls in from the trim — the bleed fill covers the gap"})`);
  return art;
}
function applyArtInset(art, inset) {
  if (!(inset > 0)) return art;
  const f = 1 - 2 * inset / Math.min(art.placedW, art.placedH);
  if (!(f > 0.5)) throw new Error(`Pull-off-trim ${inset}″ is too deep for a ${art.placedW}×${art.placedH}″ piece (it would shrink the art by more than half).`);
  art.insetF = f;
  art.insetDx = art.placedW * (1 - f) / 2;   // actual pull-in per edge, x
  art.insetDy = art.placedH * (1 - f) / 2;   // actual pull-in per edge, y
  art.notes.push(`pulled off trim by ${art.insetDx.toFixed(3)}″ across × ${art.insetDy.toFixed(3)}″ down (art scaled ×${f.toFixed(4)}) — content that was at the cut now sits that far inside it`);
  return art;
}

// Where the art's outer edge ends up relative to the trim, per axis, once every
// scale factor is in (fit-to-trim, shy-art pre-scale, inset). Positive = the art
// still covers that far PAST the trim; negative = it now stops that far INSIDE
// the trim and the fill must reach back in to meet it.
function finalizeArtCoverage(art, bleed) {
  const g = (art.synth ? (art.synthScale || 1) : 1) * (art.insetF || 1) * (art.userScale || 1);
  const ob = art.ownBleed || 0;
  art.covX = g * (art.placedW / 2 + ob) - art.placedW / 2;
  art.covY = g * (art.placedH / 2 + ob) - art.placedH / 2;
  const b = isFinite(bleed) ? bleed : BLEED;
  if (!art.synth) {
    // Nothing is filling the ring, so the art's own coverage has to carry it.
    if (art.covX < -EPS || art.covY < -EPS) {
      const why = (art.userScale && art.userScale < 1) ? (art.insetF ? "Pull-off-trim and the art scale leave" : "Scaling the art down leaves") : "Pull-off-trim leaves";
      throw new Error(`${why} the art ${Math.abs(Math.min(art.covX, art.covY)).toFixed(3)}″ short of the cut with no bleed fill set — that band would print as paper white INSIDE the trim. Set "Add bleed" to Auto (text-safe), Mirror or Streak.`);
    }
    if (art.covX < b - EPS || art.covY < b - EPS) {
      art.notes.push(`art covers only ${Math.min(art.covX, art.covY).toFixed(3)}″ past the trim (need ${b}″) — cut lines may show paper white`);
    }
  }
  return art;
}

// ---- bleed-ring ink detection ---------------------------------------------
// `hasBleed` above is purely GEOMETRIC — the page is bigger than the trim. It
// says nothing about whether that region contains any ink, and a file can very
// easily have a bleed allowance with nothing in it: the designer sets the
// document up at trim+bleed and then draws the art only to the trim. The tool
// used to call that "treated as bleed-inclusive" and say nothing more, so a job
// that will cut white on every edge looked completely clean (Chandler Center
// booklet, 2026-09-02: 8.25″ page, 8″ of art, a perfectly empty 0.125″ ring,
// and a cover designed to bleed on all four sides).
// Measures ink in the band between trim and page edge, per edge. Low DPI on
// purpose — this only answers "is there anything out here", and it runs on
// pages that are otherwise never rasterized.
const RING_DPI = 72, RING_MIN_INK = 0.01;   // <1% of the band inked = empty
async function detectBleedInk(pdfjsDoc, pnoZero, art) {
  const page = await pdfjsDoc.getPage(pnoZero + 1);
  const scale = RING_DPI / 72;
  const vp = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const td = displayRect(art.trimRaw, art.rot, art.mediaW, art.mediaH);
  const dispH = art.rot % 180 ? art.mediaW : art.mediaH;
  // trim rect in canvas pixels (y flipped)
  const tx0 = td.x * scale, tx1 = (td.x + td.w) * scale;
  const ty0 = (dispH - (td.y + td.h)) * scale, ty1 = (dispH - td.y) * scale;
  const W = canvas.width, H = canvas.height;
  const pad = Math.max(1, Math.round(0.012 * RING_DPI)); // skip the antialiased trim boundary
  const frac = (x0, y0, x1, y1) => {
    x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
    x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
    if (x1 - x0 < 1 || y1 - y0 < 1) return null;   // no band on this edge
    const d = ctx.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    let ink = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) {
      n++;
      if ((d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) < INK_LUM) ink++;
    }
    return n ? ink / n : null;
  };
  const edges = {
    left:   frac(0, ty0, tx0 - pad, ty1),
    right:  frac(tx1 + pad, ty0, W, ty1),
    top:    frac(tx0, 0, tx1, ty0 - pad),
    bottom: frac(tx0, ty1 + pad, tx1, H),
  };
  const present = {}, measured = [];
  for (const k of ["left", "right", "top", "bottom"]) {
    if (edges[k] === null) { present[k] = true; continue; }   // no band: nothing to judge
    measured.push(k);
    present[k] = edges[k] >= RING_MIN_INK;
  }
  const blank = measured.filter(k => !present[k]);
  return { edges, present, blank, empty: measured.length > 0 && blank.length === measured.length };
}

function applySynthBleed(art, mode, bleed, gaps, streakEps, inset) {
  // With an inset the ring must be filled even for art that HAS bleed: pulling
  // the art in drags its bleed in with it, so the coverage falls short.
  if (!mode || mode === "off" || (art.hasBleed && !art.bleedEmpty && !(inset > 0))) return art;
  art.streakEps = streakEps || STREAK_EPS;
  // Art whose edges are white for more than SYNTH_MAXFIX on ALL four sides is
  // a design choice (white border, centred form), not art that fell shy of the
  // cut. That must not drag the shy-art PRE-SCALE in — but it is no reason to
  // refuse the operator's explicit fill: mirroring a white edge yields white
  // bleed, which is exactly right. This used to return early and silently
  // veto the whole setting, which read as "the bleed control does nothing".
  // fix() below already yields 0 for any gap past SYNTH_MAXFIX, so the
  // pre-scale is suppressed without skipping the fill.
  const designMargins = gaps && [gaps.left, gaps.right, gaps.top, gaps.bottom].every(g => g > SYNTH_MAXFIX);
  art.synth = mode;
  art.synthB = isFinite(bleed) ? bleed : BLEED;
  const fix = g => (gaps && g > SYNTH_MINGAP && g <= SYNTH_MAXFIX) ? g : 0;
  // work in PLACED space: art.scale already maps the art's trim onto the cell
  const gs = gaps
    ? { left: fix(gaps.left) * art.scale, right: fix(gaps.right) * art.scale,
        top: fix(gaps.top) * art.scale, bottom: fix(gaps.bottom) * art.scale }
    : { left: 0, right: 0, top: 0, bottom: 0 };
  // display-orientation → placed-cell orientation (cellRotate swaps axes)
  const [gx1, gx2, gy1, gy2] = art.cellRotate ? [gs.top, gs.bottom, gs.left, gs.right]
                                              : [gs.left, gs.right, gs.top, gs.bottom];
  const hw = art.placedW / 2, hh = art.placedH / 2;
  // per edge: ink sits (h−g) from center and must reach h (mirror) or h+b
  // (scale) after ×f about the center → f = h/(h−g) or (h+b)/(h−g).
  const b = mode === "scale" ? art.synthB : 0;
  let f = 1;
  for (const [h, g] of [[hw, gx1], [hw, gx2], [hh, gy1], [hh, gy2]]) {
    if (mode === "scale" || g > 0) f = Math.max(f, (h + b) / (h - g));
  }
  art.synthScale = f;
  const short = Math.max(fix(gaps ? gaps.left : 0), fix(gaps ? gaps.right : 0), fix(gaps ? gaps.top : 0), fix(gaps ? gaps.bottom : 0));
  const last = art.notes.length - 1;
  if (art.notes[last] === "no bleed available — cut lines may show paper white") art.notes.pop();
  const tn = art.textNear;
  const streaked = mode === "auto" && tn ? ["left", "right", "top", "bottom"].filter(e => tn[e]) : [];
  art.notes.push((mode === "scale"
    ? `no bleed in source — art scaled up to cover ${art.synthB}″ bleed (trim-line content shifts outward by the same amount)`
    : mode === "streak" ? `no bleed in source — ${art.synthB}″ streak bleed synthesized (outermost ${art.streakEps}″ stretched outward)`
    : mode === "auto" ? `no bleed in source — ${art.synthB}″ bleed synthesized (mirror${streaked.length ? `; streak on ${streaked.join("/")} — text near trim, a mirror would duplicate it` : ", no text near trim"})`
    : `no bleed in source — ${art.synthB}″ mirrored-edge bleed synthesized`)
    + (short ? ` · art stopped ${short.toFixed(3)}″ shy of trim — pre-scaled ×${f.toFixed(4)} so ink reaches the cut` : "")
    + (designMargins ? " · edges are white for more than 3/16″ on all four sides, so the fill is white too — that is the file, not the setting" : ""));
  return art;
}

// ── Optional content (PDF layers) ───────────────────────────────────────────
// pdf-lib copies a page's marked content AND its OCG objects, but NOT the
// document catalog's /OCProperties — the dictionary that records which layers
// are switched OFF. Drop it and every layer defaults to visible, so a
// customer's HIDDEN layer prints. Caught on a real job (Nursing Form,
// 2026-08-25): an Illustrator "Layer 1" was off in the source and ghosted
// behind the live artwork on all four cells of the imposed sheet.
//
// The fix is to carry that configuration onto the output rather than to cut the
// content out: marked-content nesting and q/Q nesting are independently legal
// in PDF (this very file opens a `q` inside the hidden block and closes it
// after the EMC), so stripping the block by hand corrupts the graphics state.
// Resolve an object to something with .lookup(): a PDFDict is already one, a
// PDFStream keeps its dictionary at .dict. NOTE a PDFDict also has a `.dict`
// property — it is the internal Map, not a sub-dictionary — so the .lookup
// test has to come first or form XObjects silently read as empty.
function asDict(o) {
  if (o && typeof o.lookup === "function") return o;
  if (o && o.dict && typeof o.dict.lookup === "function") return o.dict;
  return null;
}
function srcHiddenOCGRefs(srcDoc) {
  const hidden = new Set();
  let any = false;
  try {
    const ocp = asDict(srcDoc.catalog.lookup(PL.PDFName.of("OCProperties")));
    if (!ocp) return { hidden, any };
    any = true;
    const cfg = asDict(ocp.lookup(PL.PDFName.of("D")));
    if (!cfg) return { hidden, any };
    const asRefs = v => (v && typeof v.asArray === "function" ? v.asArray() : []);
    for (const r of asRefs(cfg.lookup(PL.PDFName.of("OFF")))) hidden.add(String(r));
    // /BaseState /OFF inverts the sense: everything is off but the /ON list.
    const base = cfg.lookup(PL.PDFName.of("BaseState"));
    if (base && String(base) === "/OFF") {
      const on = new Set(asRefs(cfg.lookup(PL.PDFName.of("ON"))).map(String));
      for (const r of asRefs(ocp.lookup(PL.PDFName.of("OCGs")))) if (!on.has(String(r))) hidden.add(String(r));
    }
  } catch (e) { /* no optional content, or an unreadable config */ }
  return { hidden, any };
}
// A page's Resources, honouring INHERITANCE — /Resources may live on an
// ancestor Pages node rather than the page itself (legal and common), and a
// raw lookup on the leaf would miss it, silently disabling the whole mapping.
function pageResources(node) {
  try { if (typeof node.Resources === "function") { const r = asDict(node.Resources()); if (r) return r; } } catch (e) {}
  try { if (typeof node.getInheritableAttribute === "function") { const r = asDict(node.getInheritableAttribute(PL.PDFName.of("Resources"))); if (r) return r; } } catch (e) {}
  try { return asDict(node.lookup(PL.PDFName.of("Resources"))); } catch (e) { return null; }
}
// The OCG refs an /OC or /Properties entry stands for. A direct OCG entry is
// its own member; an OCMD (membership dict) carries its members in /OCGs — a
// single ref or an array of refs. Raw refs are collected, never resolved, so
// identity comparison against the catalog's OFF list works. Entries that are
// not refs (inline dicts, /VE-only OCMDs) yield [] = treated as visible.
function ocMembers(dict, key) {
  const raw = dict.get(key);
  if (!raw) return null;
  const isRef = r => r && r.objectNumber !== undefined;
  const res = asDict(dict.lookup(key));
  const inner = res && res.get ? res.get(PL.PDFName.of("OCGs")) : null;
  if (!inner) return isRef(raw) ? [raw] : [];
  const resolved = res.lookup(PL.PDFName.of("OCGs"));
  if (resolved && typeof resolved.asArray === "function") return resolved.asArray().filter(isRef);
  return isRef(inner) ? [inner] : [];
}
// Walk source and copy IN PARALLEL by resource name, mapping the source's
// hidden state (a set of raw OCG refs) onto the copied objects. Matching by
// ref identity within each resource dict — never by layer NAME — because
// names are per-namespace and routinely duplicated (the file that motivated
// all this has four OCGs called "Layer 1", two on and two off). Covers BDC
// marked content (/Properties), /OC sitting directly on image/form XObjects,
// OCMD membership dicts (AnyOn default: hidden iff every member is off), and
// nested XObjects with their own /Properties namespaces. A copy entry with no
// source counterpart stays visible — the safe default.
function ocWalk(srcRes, outRes, hiddenRefs, acc, depth) {
  if ((depth || 0) > 6) return;
  const S = asDict(srcRes), O = asDict(outRes);
  if (!O) return;
  const N = n => PL.PDFName.of(n);
  const hiddenBy = m => !!m && m.length > 0 && m.every(r => hiddenRefs.has(String(r)));
  try {
    const sp = S ? asDict(S.lookup(N("Properties"))) : null;
    const op = asDict(O.lookup(N("Properties")));
    if (op && op.keys) for (const k of op.keys()) {
      const outM = ocMembers(op, k) || [];
      const hid = sp ? hiddenBy(ocMembers(sp, k)) : false;
      for (const r of outM) { acc.all.set(String(r), r); if (hid) acc.off.set(String(r), r); }
    }
    const sx = S ? asDict(S.lookup(N("XObject"))) : null;
    const ox = asDict(O.lookup(N("XObject")));
    if (ox && ox.keys) for (const k of ox.keys()) {
      const oChild = asDict(ox.lookup(k));
      if (!oChild) continue;
      const sChild = sx ? asDict(sx.lookup(k)) : null;
      const outOC = ocMembers(oChild, N("OC")) || [];
      const hid = sChild ? hiddenBy(ocMembers(sChild, N("OC"))) : false;
      for (const r of outOC) { acc.all.set(String(r), r); if (hid) acc.off.set(String(r), r); }
      ocWalk(sChild ? sChild.lookup(N("Resources")) : null, oChild.lookup(N("Resources")), hiddenRefs, acc, (depth || 0) + 1);
    }
  } catch (e) {}
}
// Resolve one pending embed (recorded before flush; the copied XObject only
// exists in the context afterwards) and feed it through the parallel walk.
function collectPendingOC(outDoc, pending, acc) {
  for (const e of pending) {
    try {
      const xo = asDict(outDoc.context.lookup(e.ref));
      if (xo) ocWalk(e.srcRes, xo.lookup(PL.PDFName.of("Resources")), e.hidden, acc, 0);
    } catch (err) {}
  }
}
// Write the accumulated configuration onto the output catalog. Hidden groups
// also get /Usage /Print /PrintState /OFF so a RIP that reads usage rather than
// the default config still leaves them out.
function writeOCProperties(outDoc, acc) {
  if (!acc.all.size) return 0;
  const ctx = outDoc.context;
  const all = [...acc.all.values()];
  const off = [...acc.off.values()];
  const on = all.filter(r => !acc.off.has(String(r)));
  for (const r of off) {
    try {
      const g = ctx.lookup(r);
      if (g && g.set) g.set(PL.PDFName.of("Usage"), ctx.obj({ Print: { PrintState: PL.PDFName.of("OFF") },
                                                              View: { ViewState: PL.PDFName.of("OFF") } }));
    } catch (e) {}
  }
  outDoc.catalog.set(PL.PDFName.of("OCProperties"), ctx.obj({
    OCGs: ctx.obj(all),
    D: ctx.obj({ BaseState: PL.PDFName.of("ON"), OFF: ctx.obj(off), ON: ctx.obj(on) }),
  }));
  return off.length;
}

// Stamp the art with its trim centered on targetTrim (inches, y-up),
// hard-clipped to clipRect so neighbours can never overlap (fix c/d).
function placeArt(outPage, embedded, art, targetTrim, clipRect, extraRotate) {
  const drawRot = (((art.cellRotate + (extraRotate || 0) - art.rot) % 360) + 360) % 360; // CCW for pdf-lib degrees()
  let s = art.scale;
  if (art.synth) s *= art.synthScale || 1; // scale-to-bleed and/or shortfall pre-scale
  if (art.insetF) s *= art.insetF;         // pull-off-trim safety inset
  if (art.userScale) s *= art.userScale;   // operator's free scale
  const C = { x: (targetTrim.x + targetTrim.w / 2) * PT, y: (targetTrim.y + targetTrim.h / 2) * PT };
  const tc = { x: art.trimRaw.x + art.trimRaw.w / 2, y: art.trimRaw.y + art.trimRaw.h / 2 };
  // anchor = C − s·Rot(tc): drawPage maps raw (u,v) → anchor + s·Rot_ccw(u,v)
  const R = drawRot === 90 ? [-tc.y, tc.x] : drawRot === 180 ? [-tc.x, -tc.y] : drawRot === 270 ? [tc.y, -tc.x] : [tc.x, tc.y];
  const ax = C.x - s * R[0], ay = C.y - s * R[1];

  const cl = clipRect;
  outPage.pushOperators(
    PL.pushGraphicsState(),
    PL.moveTo(cl.x * PT, cl.y * PT),
    PL.lineTo((cl.x + cl.w) * PT, cl.y * PT),
    PL.lineTo((cl.x + cl.w) * PT, (cl.y + cl.h) * PT),
    PL.lineTo(cl.x * PT, (cl.y + cl.h) * PT),
    PL.closePath(),
    PL.clip(),
    PL.endPath(),
  );
  outPage.drawPage(embedded, { x: ax, y: ay, xScale: s, yScale: s, rotate: PL.degrees(drawRot) });
  outPage.pushOperators(PL.popGraphicsState());

  if (art.synth && art.synth !== "scale") {
    // Fill the bleed ring from the art's own edges. Per axis the transform is
    // a mirrored map about the trim edge with stretch factor k: k=1 is a true
    // mirror; k=b/STREAK_EPS stretches the outermost sliver into streaks
    // (text-safe — nothing readable survives the stretch). "auto" picks per
    // edge from detectTextNearEdges, mapped from raw page space through the
    // placed rotation. Each region is clipped to (region ∩ cell clip), so
    // interior butt cuts and the saddle spine stay untouched.
    const b = art.synthB, T = targetTrim;
    const xL = T.x, xR = T.x + T.w, yB = T.y, yT = T.y + T.h;
    // The art's outer edge sits covX/covY past the trim (negative once a
    // pull-off-trim inset has drawn it back inside). Reflect about THAT edge,
    // and widen the band to reach from it out to the bleed box — so with no
    // inset this is exactly the previous trim-edge mirror of width b.
    const cx = art.covX || 0, cy = art.covY || 0;
    const bx = b - cx, by = b - cy;                       // band width per axis
    const eL = xL - cx, eR = xR + cx, eB = yB - cy, eT = yT + cy; // art edges
    const eps = art.streakEps || STREAK_EPS;
    const Kx = bx / eps, Ky = by / eps;
    const cyc = ["left", "bottom", "right", "top"]; // CCW edge cycle
    const rawEdge = e => cyc[(((cyc.indexOf(e) - drawRot / 90) % 4) + 4) % 4];
    const streaky = e => art.synth === "streak" || (art.synth === "auto" && art.textNear && art.textNear[rawEdge(e)]);
    const kx = { left: streaky("left") ? Kx : 1, right: streaky("right") ? Kx : 1 };
    const ky = { bottom: streaky("bottom") ? Ky : 1, top: streaky("top") ? Ky : 1 };
    const mX = (E, k) => [-k, 0, 0, 1, E * (1 + k) * PT, 0];   // mirrored map about x=E
    const mY = (F, k) => [1, 0, 0, -k, 0, F * (1 + k) * PT];   // mirrored map about y=F
    const mXY = (E, F, k1, k2) => [-k1, 0, 0, -k2, E * (1 + k1) * PT, F * (1 + k2) * PT];
    const iw = eR - eL, ih = eT - eB;   // art's own span, for the side bands
    // SEAM overlap. The band and the placed art used to ABUT exactly on the
    // trim edge, and two abutting fills each antialias at the shared boundary:
    // neither covers those pixels fully, so the white underneath shows through
    // as a hairline right on the cut line. Measured at 600 DPI on the Chandler
    // cover: solid (22,73,156) lifting to (108,141,193) across ~0.005″.
    // ("scale" never showed it — it enlarges one continuous placement, so no
    // seam exists to leak through.)
    // Fix: overlap the band across the edge, and move the mirror AXIS inward by
    // the same amount so the overlap paints the art's own content instead of
    // white. Mirroring about eL+SEAM maps x=eL to eL+2·SEAM — real art, a few
    // thousandths in — where mirroring about eL would have mapped it to the
    // blank ring. Only the outermost SEAM of art goes unrepresented in the
    // bleed, which at 4 thou is far below any cutting tolerance.
    const SEAM = 0.004;                       // in
    const ox = bx > 0 ? SEAM : 0, oy = by > 0 ? SEAM : 0;
    const aL = eL + ox, aR = eR - ox, aB = eB + oy, aT = eT - oy;   // axes, nudged inward
    const regions = bx <= 0 && by <= 0 ? [] : [
      bx > 0 && { r: { x: eL - bx, y: eB - oy, w: bx + ox, h: ih + 2 * oy }, m: mX(aL, kx.left) },
      bx > 0 && { r: { x: eR - ox, y: eB - oy, w: bx + ox, h: ih + 2 * oy }, m: mX(aR, kx.right) },
      by > 0 && { r: { x: eL - ox, y: eB - by, w: iw + 2 * ox, h: by + oy }, m: mY(aB, ky.bottom) },
      by > 0 && { r: { x: eL - ox, y: eT - oy, w: iw + 2 * ox, h: by + oy }, m: mY(aT, ky.top) },
      bx > 0 && by > 0 && { r: { x: eL - bx, y: eB - by, w: bx + ox, h: by + oy }, m: mXY(aL, aB, kx.left, ky.bottom) },
      bx > 0 && by > 0 && { r: { x: eR - ox, y: eB - by, w: bx + ox, h: by + oy }, m: mXY(aR, aB, kx.right, ky.bottom) },
      bx > 0 && by > 0 && { r: { x: eL - bx, y: eT - oy, w: bx + ox, h: by + oy }, m: mXY(aL, aT, kx.left, ky.top) },
