      bx > 0 && by > 0 && { r: { x: eR - ox, y: eT - oy, w: bx + ox, h: by + oy }, m: mXY(aR, aT, kx.right, ky.top) },
    ].filter(Boolean);
    for (const { r, m } of regions) {
      const ix = Math.max(r.x, cl.x), iy = Math.max(r.y, cl.y);
      const ix2 = Math.min(r.x + r.w, cl.x + cl.w), iy2 = Math.min(r.y + r.h, cl.y + cl.h);
      if (ix2 - ix < 0.002 || iy2 - iy < 0.002) continue;
      outPage.pushOperators(
        PL.pushGraphicsState(),
        PL.moveTo(ix * PT, iy * PT),
        PL.lineTo(ix2 * PT, iy * PT),
        PL.lineTo(ix2 * PT, iy2 * PT),
        PL.lineTo(ix * PT, iy2 * PT),
        PL.closePath(),
        PL.clip(),
        PL.endPath(),
        PL.concatTransformationMatrix(m[0], m[1], m[2], m[3], m[4], m[5]),
      );
      outPage.drawPage(embedded, { x: ax, y: ay, xScale: s, yScale: s, rotate: PL.degrees(drawRot) });
      outPage.pushOperators(PL.popGraphicsState());
    }
  }
}

function placeInCell(outPage, embedded, art, cell, extraRotate) {
  placeArt(outPage, embedded, art, cell.trim, cell.clip, extraRotate);
}

// Mirror cell positions for the back side so front/back register after the
// press flips the sheet (fix b — the #1 duplex imposition bug). "long" =
// sheet turns about its long axis (rows mirror); "short" = about its short
// axis (columns mirror). PPS layouts are center-symmetric so this is
// currently an identity — kept exact for future gang/asymmetric runs.
function mirrorCells(cells, layout, sheetFlip) {
  return cells.map(c => ({
    col: c.col, row: c.row, patRot: c.patRot,
    trim: mirrorRect(c.trim, layout, sheetFlip),
    clip: mirrorRect(c.clip, layout, sheetFlip),
  }));
}

// ── Marks layer ──
// The press images ONLY the printable area (e.g. 18.5×12.5 on 13×19) — a
// mark in the sheet margin would never print. All marks therefore live
// INSIDE the printable rect, sized "as size allows": each mark ray stops at
// the printable boundary or the nearest piece's bleed (clip) box, and is
// omitted entirely when there's no room (e.g. between pieces at standard
// 0.25″ gutter, where bleed meets bleed).
const MARK_GAP = BLEED;  // marks start just beyond the bleed
const MARK_LEN = 0.22;   // target length, in
const MARK_MIN = 0.05;   // less room than this → omit

// Longest clear run from (x, y) heading (dx, dy). Obstacle edges count as
// BLOCKED (edge-inclusive, ±LINE_EPS): at butt cut the mark rays would
// otherwise ride exactly along the shared trim lines and draw across the
// pieces — a ray probing into or along any piece's clip box returns 0.
function freeRun(x, y, dx, dy, maxLen, P, obstacles) {
  const LE = 0.01; // edge tolerance, in
  let len = dx > 0 ? P.x1 - x : dx < 0 ? x - P.x0 : dy > 0 ? P.y1 - y : y - P.y0;
  len = Math.min(len, maxLen);
  const px = x + dx * 0.02, py = y + dy * 0.02; // probe just ahead of the start
  for (const o of obstacles) {
    if (px > o.x - LE && px < o.x + o.w + LE && py > o.y - LE && py < o.y + o.h + LE) return 0; // ray heads into/along a piece
    if (dx !== 0) {
      if (y < o.y - LE || y > o.y + o.h + LE) continue;
      const d = dx > 0 ? o.x - x : x - (o.x + o.w);
      if (d >= -EPS) len = Math.min(len, d - 0.02);
    } else {
      if (x < o.x - LE || x > o.x + o.w + LE) continue;
      const d = dy > 0 ? o.y - y : y - (o.y + o.h);
      if (d >= -EPS) len = Math.min(len, d - 0.02);
    }
  }
  return len;
}

function drawMarks(page, layout, cells) {
  const P = boundRect(layout);
  const obstacles = cells.map(c => c.clip);
  const black = PL.rgb(0, 0, 0);
  const gap = layout.bleed;
  const mark = (x, y, dx, dy) => {
    const len = freeRun(x, y, dx, dy, MARK_LEN, P, obstacles);
    if (len >= MARK_MIN) page.drawLine({
      start: { x: x * PT, y: y * PT }, end: { x: (x + dx * len) * PT, y: (y + dy * len) * PT },
      thickness: 0.5, color: black,
    });
  };
  for (const c of cells) {
    const t = c.trim;
    // horizontal extensions of the bottom/top trim lines…
    mark(t.x - gap, t.y, -1, 0);        mark(t.x + t.w + gap, t.y, 1, 0);
    mark(t.x - gap, t.y + t.h, -1, 0);  mark(t.x + t.w + gap, t.y + t.h, 1, 0);
    // …and vertical extensions of the left/right trim lines
    mark(t.x, t.y - gap, 0, -1);        mark(t.x, t.y + t.h + gap, 0, 1);
    mark(t.x + t.w, t.y - gap, 0, -1);  mark(t.x + t.w, t.y + t.h + gap, 0, 1);
  }
}

// Slug line — placed in the largest clear band INSIDE the printable area
// (with the default lower-right jog that's the strip above the block).
// Returns false when no band has room, so the caller can warn.
function drawSlug(page, layout, font, info, cells) {
  const P = boundRect(layout);
  const b = {
    x0: Math.min(...cells.map(c => c.clip.x)),
    y0: Math.min(...cells.map(c => c.clip.y)),
    x1: Math.max(...cells.map(c => c.clip.x + c.clip.w)),
    y1: Math.max(...cells.map(c => c.clip.y + c.clip.h)),
  };
  const bands = [
    { x: P.x0 + 0.03, y: b.y1 + 0.05, h: P.y1 - b.y1 - 0.1, w: P.x1 - P.x0 - 0.06 }, // above the block
    { x: P.x0 + 0.03, y: P.y0 + 0.03, h: b.y0 - P.y0 - 0.1, w: P.x1 - P.x0 - 0.06 }, // below the block
    { x: P.x0 + 0.03, y: P.y0 + 0.03, h: 0.12, w: b.x0 - P.x0 - 0.08 },              // left of the block
    { x: b.x1 + 0.05, y: P.y0 + 0.03, h: 0.12, w: P.x1 - b.x1 - 0.08 },              // right of the block
  ];
  const spot = bands.find(bd => bd.h >= 0.11 && bd.w >= 2.2);
  if (!spot) return false;
  // slug is set in standard Helvetica (WinAnsi) — ASCII only, no ″/× glyphs
  const parts = [
    "PPS IMPOSED", info.side,
    info.orderRef ? `Order ${info.orderRef}` : null,
    info.jobName ? String(info.jobName).replace(/[^\x20-\x7E]/g, "?") : null,
    layout.booklet ? `pages ${layout.booklet.pw}x${layout.booklet.ph}in` : `${layout.pieceLong}x${layout.pieceShort}in`,
    layout.mismatch ? `MISMATCH ${layout.imp}-up placed vs ${layout.pricedImp}-up priced` : `${layout.imp}-up on ${layout.sheet.key}`,
    layout.stepRepeat ? `STEP AND REPEAT ${layout.stepRepeat}x per sheet (${layout.across}x${layout.down}, priced ${layout.pricedImp}-up)`
      : layout.manualGrid ? `MANUAL GRID ${layout.across}x${layout.down} (priced ${layout.pricedImp}-up)` : null,
    layout.efficient ? `EFFICIENT 13x27.5 (priced ${layout.pricedImp}-up/13x19)`
      : layout.fillSheet ? `FILL ${layout.across}x${layout.down} full-sheet (priced ${layout.pricedImp}-up)` : null,
    (layout.colGaps || layout.rowGaps) ? "custom gutters"
      : layout.gutter !== 0.25 ? (layout.gutter === 0 ? "BUTT-CUT" : `gutter ${layout.gutter}in`) : null,
    Math.abs(layout.bleed - BLEED) > EPS ? `bleed ${layout.bleed}in` : null,
    info.artInset ? `PULLED OFF TRIM ${info.artInset}in` : null,
    (info.artScale && info.artScale !== 1) ? `ART ${(info.artScale * 100).toFixed(2)}%` : null,
    info.creep ? `CREEP ${info.creep}in total (this sig ${(info.creepAt || 0).toFixed(4)}in)` : null,
    info.qty ? `qty ${info.qty} = ${info.sheets} sheet${info.sheets === 1 ? "" : "s"}` : null,
    info.date,
  ].filter(Boolean);
  page.drawText(parts.join("  ·  "), {
    x: spot.x * PT, y: spot.y * PT, size: 6, font, color: PL.rgb(0, 0, 0),
    maxWidth: spot.w * PT,
  });
  return true;
}

// ═══════════════════════════════════════════════════════════════
// SADDLE STITCH — printer-spread signature imposition
// ═══════════════════════════════════════════════════════════════
// Classic saddle pagination: pad to a multiple of 4; signature sheet k
// (0 = outermost = cover) carries pages [P−2k | 2k+1] on the outside and
// [2k+2 | P−2k−1] on the inside; folded and nested they read in order.
function mate(p) { return p % 2 ? p + 1 : p - 1; } // leaf-mate: back of page 1 is 2, etc.

function mirrorRect(r, layout, flip) {
  const W = layout.sheet.long, H = layout.sheet.short;
  return flip === "short" ? { x: W - r.x - r.w, y: r.y, w: r.w, h: r.h }
                          : { x: r.x, y: H - r.y - r.h, w: r.w, h: r.h };
}

// Split each spread cell into two page slots. Spine gets NO bleed — the two
// pages meet exactly at the fold; outer edges keep the cell's bleed clip.
// When the grid rotated the spread (90° CCW), the spread-left page lands in
// the bottom half of the cell.
// ── Creep / shingling compensation ───────────────────────────────────────────
// Folded signatures nest, so the inner leaves push outward and get trimmed
// narrower than the cover unless the content is shifted back toward the spine.
// `creep` is the TOTAL shift applied to the innermost signature; the outermost
// (the cover, k=0) gets none and the rest are spread linearly between them —
// the standard shingling ramp, and the one Fiery states the same way.
//
// The TRIM does not move: the guillotine still cuts in the same place. Only the
// placed content slides spine-ward, which opens a sliver at the outer edge that
// the art's bleed covers — so a no-bleed file wants Add bleed on as well, and
// says so.
const CREEP_MAX = 0.5;
function creepOf(spec) {
  const v = +(spec && spec.creep) || 0;
  if (!(v > 0)) return 0;
  if (v > CREEP_MAX) throw new Error(`Creep ${v}″ is beyond the ${CREEP_MAX}″ limit — check the value is a total, not per-signature.`);
  return v;
}
// Shift for signature k of S, 0 = outermost.
function creepShift(creep, k, S) { return (!(creep > 0) || S < 2) ? 0 : creep * k / (S - 1); }
// Slide a half-page rect toward the spine by d. `half` is which side of the
// spread the page sits on; spreadAlongX says whether the spine runs vertically.
function creepRect(rect, half, d, alongX) {
  if (!(d > 0)) return rect;
  const sign = half === "left" ? 1 : -1;   // left page moves +, right page moves −
  return alongX ? { ...rect, x: rect.x + sign * d } : { ...rect, y: rect.y + sign * d };
}

function bookletSlots(layout) {
  const slots = [];
  for (const cell of layout.cells) {
    const t = cell.trim, cl = cell.clip;
    if (layout.booklet.spreadAlongX) {
      const cx = t.x + t.w / 2;
      slots.push(
        { half: "left",  rect: { x: t.x, y: t.y, w: t.w / 2, h: t.h }, clip: { x: cl.x, y: cl.y, w: cx - cl.x, h: cl.h } },
        { half: "right", rect: { x: cx,  y: t.y, w: t.w / 2, h: t.h }, clip: { x: cx,   y: cl.y, w: cl.x + cl.w - cx, h: cl.h } },
      );
    } else {
      const cy = t.y + t.h / 2;
      slots.push(
        { half: "left",  rect: { x: t.x, y: t.y, w: t.w, h: t.h / 2 }, clip: { x: cl.x, y: cl.y, w: cl.w, h: cy - cl.y } },
        { half: "right", rect: { x: t.x, y: cy,  w: t.w, h: t.h / 2 }, clip: { x: cl.x, y: cy,   w: cl.w, h: cl.y + cl.h - cy } },
      );
    }
  }
  return slots;
}

// Dashed fold guides at each spine position — same printable-area rule as
// the crop marks: they extend from just outside the spread's bleed box into
// whatever clear space exists.
function drawFoldMarks(page, layout, cells) {
  const P = boundRect(layout);
  const obstacles = cells.map(c => c.clip);
  const mark = (x, y, dx, dy) => {
    const len = freeRun(x, y, dx, dy, MARK_LEN, P, obstacles);
    if (len >= MARK_MIN) page.drawLine({
      start: { x: x * PT, y: y * PT }, end: { x: (x + dx * len) * PT, y: (y + dy * len) * PT },
      thickness: 0.5, color: PL.rgb(0, 0, 0), dashArray: [2, 2],
    });
  };
  for (const c of cells) {
    if (layout.booklet.spreadAlongX) {
      const x = c.trim.x + c.trim.w / 2;
      mark(x, c.clip.y - 0.02, 0, -1);
      mark(x, c.clip.y + c.clip.h + 0.02, 0, 1);
    } else {
      const y = c.trim.y + c.trim.h / 2;
      mark(c.clip.x - 0.02, y, -1, 0);
      mark(c.clip.x + c.clip.w + 0.02, y, 1, 0);
    }
  }
}

// Marks are three independent switches now: crop/trim marks, saddle fold
// guides, and the slug line. `marks` stays the master for older specs — an
// explicit false still silences everything unless a switch is turned back on.
function marksOf(spec) {
  const base = spec.marks !== false;
  const on = (v, d) => (v == null ? d : v !== false);
  return { showMarks: base, showFold: on(spec.foldMarks, base), showSlug: on(spec.slug, base) };
}

async function imposeSaddle(artBytes, spec, layout) {
  const warnings = [...layout.warnings];
  const bk = layout.booklet;
  const src = await PL.PDFDocument.load(artBytes, { ignoreEncryption: true });
  stripActiveContent(src);
  const n = src.getPageCount();
  if (n < 3) throw new Error(`Booklet artwork must be a multi-page PDF in reading order — got ${n} page(s)`);
  // ── Page ORIENTATION must match the artwork ───────────────────────────────
  // Saddle stitch folds on the HEIGHT edge, so 5.5×8.5 and 8.5×5.5 are
  // different products, not the same size entered two ways. The drop-time
  // trim check normalises to long/short and is therefore blind to a swap:
  // entering the landscape pair builds a landscape signature (1 across × 2
  // down instead of 2 across × 1) and rotates every page 90° into it, and
  // nothing in the tool said a word. On a 36pp job that is 450 sheets printed
  // sideways. Check it here, where the real page size is known, so every
  // entry path is covered — including the wp-admin order queue, where the
  // spec is authoritative and no autodetect ever runs.
  try {
    const det = detectTrim(src, layout.bleed);
    const sq = d => Math.abs(d.w - d.h) <= 0.03;
    const specPortrait = bk.ph > bk.pw, srcPortrait = det.h > det.w;
    if (!sq(det) && Math.abs(bk.pw - bk.ph) > 0.03 && specPortrait !== srcPortrait) {
      throw new Error(
        `Page orientation mismatch: the artwork's pages are ${det.w}×${det.h}″ (${srcPortrait ? "portrait" : "landscape"}) but the spec says ${bk.pw}×${bk.ph}″ (${specPortrait ? "portrait" : "landscape"}). ` +
        `Saddle stitch folds on the height edge, so this would build a ${specPortrait ? "portrait" : "landscape"} signature and turn every page 90°. ` +
        `Set Page width ${det.w}″ and Page height ${det.h}″ — or supply artwork that really is ${specPortrait ? "portrait" : "landscape"}.`);
    }
  } catch (e) {
    if (/orientation mismatch/.test(e.message)) throw e;   // detection itself is best-effort
  }

  const P = Math.ceil(n / 4) * 4;
  if (P !== n) warnings.push(`page count ${n} padded to ${P} — ${P - n} blank page(s) at the back of the book`);
  const S = P / 4;

  const out = await PL.PDFDocument.create();
  const font = await out.embedFont(PL.StandardFonts.Helvetica);
  const embeds = await out.embedPdf(src, Array.from({ length: n }, (_, i) => i));
  const ocSrc = srcHiddenOCGRefs(src);
  const ocAcc = { all: new Map(), off: new Map() };
  const ocPending = ocSrc.any
    ? embeds.map((e, i) => ({ ref: e.ref, srcRes: pageResources(src.getPage(i).node), hidden: ocSrc.hidden }))
    : [];

  // Resolve every page once (trim location, orientation, fit) in SPREAD
  // space — each slot is pw×ph regardless of how the grid rotated the spread.
  const slotLandscape = bk.pw >= bk.ph;
  const abPages = spec.addBleedPages || {};
  const abMode = i => {
    const m = abPages[i + 1] != null ? abPages[i + 1] : spec.addBleed;
    return m && m !== "off" ? m : null;
  };
  const inset = insetOf(spec);
  const userScale = artScaleOf(spec);
  const creep = creepOf(spec);
  // These live HERE, not up beside the signature count where they read better:
  // this block used to sit above, before `const creep` was assigned. Babel
  // Standalone rewrites const to var, so the read silently returned undefined
  // and the tool reported "no creep compensation set" on every job — including
  // jobs that had creep and were being shifted correctly. A compiled build
  // (no const→var) would have thrown a ReferenceError instead. Keep any use of
  // creep below its declaration.
  if (creep > 0 && S >= 2) warnings.push(`Creep: content shifted spine-ward from 0″ on the cover to ${creep}″ on the innermost signature (${(creep / (S - 1)).toFixed(4)}″ per step over ${S} signatures). Cut lines unchanged; the outer sliver this opens is covered by the art's bleed.`);
  else if (creep > 0) warnings.push("Creep set but this book is a single signature — nothing nests, so no shift applied.");
  else if (S >= 8) warnings.push(`${S} nested sheets and no creep compensation set — check inner-page margins on thick stock, or set a creep total.`);
  const { showMarks, showFold, showSlug } = marksOf(spec);
  let inkDoc = null;
  const arts = [];
  const artCache = new Map(); // pages with identical geometry share one resolution
  for (let i = 0; i < n; i++) {
    const p = src.getPage(i);
    const mb = p.getMediaBox();
    const abm = abMode(i);
    // per-page synth (mode or ink gaps) breaks geometry sharing — key by page
    const key = abm ? `p${i}`
      : `${p.getRotation().angle}|${mb.x},${mb.y},${mb.width},${mb.height}|${JSON.stringify(getPageBox(p, "TrimBox"))}|${JSON.stringify(getPageBox(p, "BleedBox"))}`;
    let art = artCache.get(key);
    if (!art) {
      art = resolveSideArt(p, Math.max(bk.pw, bk.ph), Math.min(bk.pw, bk.ph), slotLandscape, layout.bleed);
      applyArtScale(art, userScale);
      applyArtInset(art, inset);
      // A bleed ALLOWANCE is not bleed. Measure the ring whenever the page
      // claims one — every page when synthesis is on, else page 1, which is
      // enough to warn (building at bleed size and not extending the art is a
      // document-wide authoring mistake, not a per-page one).
      if (art.hasBleed && (abm || i === 0) && !art.ringChecked) {
        art.ringChecked = true;
        try {
          if (!inkDoc) inkDoc = await pdfjsLib.getDocument({ data: artBytes.slice(0) }).promise;
          const ring = await detectBleedInk(inkDoc, i, art);
          if (ring && ring.empty) {
            art.bleedEmpty = true;
            // ownBleed is GEOMETRIC — it reports the allowance as coverage, so
            // covX/covY come out at the full bleed and the synth band computes
            // to zero width, drawing nothing. The ink really stops at the trim,
            // so say so: coverage 0, band = the whole bleed, mirrored about the
            // trim edge. Without this the tool reports "synthesized" and emits
            // byte-identical output.
            art.ownBleed = 0;
            art.notes.push(`page is bleed-sized but the bleed area is EMPTY — the art stops at the cut line, so every edge will cut paper white. Set "Add bleed" to Auto, Mirror or Scale to fill it, or supply art extended past the trim.`);
          } else if (ring && ring.blank.length) {
            art.bleedEmptyEdges = ring.blank;
            art.notes.push(`bleed is missing on the ${ring.blank.join("/")} edge(s) — art stops at the cut line there`);
          }
        } catch (e) { /* best-effort: never block an impose on the probe */ }
      }
      if (abm && (!art.hasBleed || art.bleedEmpty || inset > 0)) {
        let gaps = null;
        try {
          if (!inkDoc) inkDoc = await pdfjsLib.getDocument({ data: artBytes.slice(0) }).promise;
          if (spec.addBleedSmart !== false) gaps = await detectInkGaps(inkDoc, i, art);
        } catch (e) { warnings.push(`add-bleed ink detection failed on page ${i + 1} (${e.message}) — synthesized from the page edge instead`); }
        if (abm === "auto") {
          // the inset widens the band that gets reflected, so text further in
          // than the bleed alone can still be duplicated — widen the search.
          try { art.textNear = await detectTextNearEdges(inkDoc, i, art, layout.bleed + inset); }
          catch (e) {
            art.textNear = { left: true, right: true, top: true, bottom: true };
            warnings.push(`text detection failed on page ${i + 1} (${e.message}) — streak bleed used on all edges`);
          }
        }
        applySynthBleed(art, abm, layout.bleed, gaps, streakEpsOf(spec), inset);
      }
      finalizeArtCoverage(art, layout.bleed);
      artCache.set(key, art);
    }
    arts.push(art);
  }
  arts[0].notes.forEach(nt => warnings.push("page 1: " + nt));
  const scaled = arts.filter(a => a.scale !== 1).length;
  if (scaled) warnings.push(`${scaled} of ${n} pages required fit-to-trim scaling`);
  const synCount = {};
  arts.forEach(a => { if (a.synth) synCount[a.synth] = (synCount[a.synth] || 0) + 1; });
  const synTotal = Object.values(synCount).reduce((s, v) => s + v, 0);
  const synPre = arts.filter(a => a.synth && a.synth !== "scale" && a.synthScale > 1.0001).length;
  if (synTotal) warnings.push(`add-bleed synthesized on ${synTotal} of ${n} pages (${Object.entries(synCount).map(([m, c]) => `${c} ${m}`).join(", ")}${synPre ? `; ${synPre} pre-scaled — art stopped shy of trim` : ""})`);

  const spreadRot = bk.spreadAlongX ? 0 : 90;
  const flip = spec.sheetFlip || "short"; // Fiery short-edge feed is the shop default
  // Tumble rule: the back needs 180° when the press flip axis is
  // perpendicular to the placed pages' head-to-foot axis.
  const headVertical = spreadRot % 180 === 0;
  const tumble = flip === "short" ? !headVertical : headVertical;

  const frontSlots = bookletSlots(layout);
  const qty = spec.qty || 0;
  const dateStr = new Date().toISOString().slice(0, 10);
  const W = layout.sheet.long * PT, H = layout.sheet.short * PT;
  const pageLabels = [];

  // ── Which signature goes in which cell ────────────────────────────────────
  // Two genuinely different press forms, and the difference is the whole point
  // of the step-and-repeat switch:
  //
  //   GANG (default) — consecutive signatures ride the sheet side by side.
  //     A 36pp book is 9 signatures; 2-up that is 5 forms: [1,2] [3,4] [5,6]
  //     [7,8] [9,·]. Cut the sheet apart and each stack is a different section
  //     of the SAME book, so one sheet through the press = one book's worth of
  //     those signatures. This is "impose the pages into signatures, then the
  //     signatures onto sheets".
  //   REPEAT — one signature fills every cell, so a sheet yields C copies of
  //     that one section and the book is built by collating across forms.
  //     Fewer sheets when the run is long; chosen with the step-and-repeat
  //     toggle (or by asking for a copy count).
  //
  // Everything downstream — page count, sheet count, slug, labels, preflight —
  // follows from `forms`, so neither mode is a special case anywhere else.
  const C = bk.spreadsPerSide;
  // How the signatures are dealt into the cells. `sigRepeat` (a copy count)
  // implies step and repeat; otherwise the operator picks the order outright.
  const order = layout.stepRepeat ? "repeat" : (spec.sigOrder || "repeat");
  const repeatMode = order === "repeat";
  const forms = [];
  // A book with fewer signatures than the sheet has cells would otherwise run
  // every impression half empty. When the cells divide evenly among the
  // signatures we tile them instead (2 sigs in 4 cells → 1,2,1,2), which keeps
  // every signature's quantity equal — the thing a wrap-around must never
  // break. Uneven cases fall through to normal ganging and warn.
  const tile = !repeatMode && S < C && C % S === 0 ? C / S : 0;
  const nForms = Math.ceil(S / C);
  if (repeatMode) {
    for (let k = 0; k < S; k++) forms.push(Array(C).fill(k));
  } else if (tile) {
    forms.push(Array.from({ length: C }, (_, c) => c % S));
  } else if (order === "cutstack") {
    // Cut and stack: the signature list is dealt DOWN the columns, so after
    // one cut the right-hand lift drops straight under the left-hand lift and
    // the pile is already in order 1…S. Column c of form f holds f + c·F.
    for (let f = 0; f < nForms; f++)
      forms.push(Array.from({ length: C }, (_, c) => f + c * nForms).filter(k => k < S));
  } else {
    for (let f = 0; f < nForms; f++)
      forms.push(Array.from({ length: C }, (_, c) => f * C + c).filter(k => k < S));
  }
  const F = forms.length;
  const perSheet = repeatMode ? C : (tile ? tile : 1);   // copies of each placed signature per sheet
  const sheetsPerForm = qty ? Math.ceil(qty / perSheet) : null;
  const totalSheets = sheetsPerForm ? sheetsPerForm * F : null;
  if (repeatMode) {
    warnings.push(`Step and repeat: each signature fills all ${C} cells — ${F} form${F === 1 ? "" : "s"}, one per signature${qty ? `, ${sheetsPerForm} sheets each (${totalSheets} total for ${qty})` : ""}.`);
  } else {
    if (tile) warnings.push(`Only ${S} signature${S === 1 ? "" : "s"} for ${C} cells — each is repeated ${tile}× per sheet so the sheet runs full and every signature keeps the same quantity.`);
    else if (C > 1 && order === "cutstack") warnings.push(`Cut and stack: ${F} form${F === 1 ? "" : "s"} (${forms.map(fm => fm.map(k => k + 1).join(" | ")).join(", ")}). Cut the pile between the columns and drop each lift under the one to its left — the stack is then in signature order 1–${S}.`);
    else if (C > 1) warnings.push(`Ganged ${C} consecutive signatures per sheet — ${F} form${F === 1 ? "" : "s"} (${forms.map(fm => fm.map(k => k + 1).join("+")).join(", ")}). One sheet through the press = one book's worth of those signatures.`);
    const leftover = tile ? 0 : (C - (S % C)) % C;
    if (leftover) {
      const repSheets = qty ? Math.ceil(qty / C) * S : null;
      warnings.push(`${S} signatures do not fill ${C} cells evenly — the last form carries ${S % C} and leaves ${leftover} cell(s) blank${repSheets && totalSheets ? `, so this runs ${totalSheets} sheets where step and repeat would run ${repSheets}` : ""}. Tick “step and repeat” if you would rather fill every cell with one signature.`);
    }
  }

  for (let f = 0; f < F; f++) {
    const sigs = forms[f];
    for (const inner of [false, true]) {
      const page = out.addPage([W, H]);
      const cells = inner ? mirrorCells(layout.cells, layout, flip) : layout.cells;
      frontSlots.forEach((slot, si) => {
        const k = sigs[Math.floor(si / 2)];                 // two slots per cell
        if (k === undefined) return;                        // unfilled cell in the last ganged form
        const outside = { left: P - 2 * k, right: 2 * k + 1 };
        const frontPno = slot.half === "left" ? outside.left : outside.right;
        const pno = inner ? mate(frontPno) : frontPno;      // leaf-mate backs the same physical region
        if (pno > n) return;                                // padded blank — cell stays empty, never filled
        // creep: slide the content spine-ward for THIS cell's signature depth
        // (ganged cells sit at different depths on one sheet). The clip is
        // deliberately NOT moved — it marks where this page may print, and the
        // cut lines have not changed.
        const crept = creepRect(slot.rect, slot.half, creepShift(creep, k, S), !!bk.spreadAlongX);
        const rect = inner ? mirrorRect(crept, layout, flip) : crept;
        const clip = inner ? mirrorRect(slot.clip, layout, flip) : slot.clip;
        placeArt(page, embeds[pno - 1], arts[pno - 1], rect, clip, spreadRot + (inner && tumble ? 180 : 0));
      });
      // The label names the mode, because the modes differ only in what is in
      // the cells and the operator has to be able to tell them apart in the
      // preview strip. Step and repeat keeps the plain "SIG k/S" wording the
      // tool has always used — it is one signature per form — with the copy
      // count appended; the multi-signature modes lead with the form number.
      const label = repeatMode
        ? `SIG ${sigs[0] + 1}/${S}${C > 1 ? ` REPEATED ${C}-UP` : ""} ${inner ? "INSIDE" : "OUTSIDE"}${sigs[0] === 0 ? " (COVER)" : ""}`
        : `FORM ${f + 1}/${F} ${sigs.length === 1 ? `SIG ${sigs[0] + 1}/${S}` : `SIGS ${sigs.map(k => k + 1).join(order === "cutstack" ? " | " : "+")}/${S}`}`
          + ` ${inner ? "INSIDE" : "OUTSIDE"}${sigs.includes(0) ? " (COVER)" : ""}`;
      pageLabels.push(label);
      if (showMarks) drawMarks(page, layout, cells);
      if (showFold) drawFoldMarks(page, layout, cells);
      if (showSlug) {
        const placed = drawSlug(page, layout, font, {
          side: label + (sheetsPerForm ? ` · run ${sheetsPerForm} sheets` : ""),
          orderRef: spec.orderRef, jobName: spec.jobName, artInset: inset || 0,
          artScale: userScale, creep, creepAt: creepShift(creep, sigs[sigs.length - 1], S),
          qty, sheets: totalSheets, date: dateStr,
        }, cells);
        if (!placed && f === 0 && !inner) warnings.push("no clear space inside the printable area for the slug line — omitted");
      }
      page.setMediaBox(0, 0, W, H); page.setCropBox(0, 0, W, H);
      page.setBleedBox(0, 0, W, H); page.setTrimBox(0, 0, W, H);
    }
  }

  if (ocPending.length) {
    await out.flush();   // materialise the copied XObjects before reading them
    collectPendingOC(out, ocPending, ocAcc);
  }
  const ocHidden = writeOCProperties(out, ocAcc);
  if (ocHidden) warnings.push(`source has ${ocHidden} HIDDEN layer(s) — kept hidden on the imposed sheet (they are switched off in the output too, and marked do-not-print). Flatten the layers in the source if your RIP ignores optional content.`);
  out.setTitle(`IMPOSED ${spec.jobName || spec.orderRef || "booklet"} — ${P}pg saddle, ${S} signature(s) on ${F} form(s), ${bk.spreadsPerSide} spread(s)/side ${repeatMode ? "step-and-repeat" : "ganged"} on ${layout.sheet.label}`);
  out.setProducer("PPS Auto-Imposition Tool");
  out.setCreator("PPS Auto-Imposition Tool");
  const bytes = await out.save({ useObjectStreams: false });

  // Preflight
  const check = await PL.PDFDocument.load(bytes);
  const issues = [];
  if (check.getPageCount() !== 2 * F) issues.push(`page count ${check.getPageCount()} ≠ ${2 * F} form sides`);
  // Every page of the book must appear exactly once across the forms — the
  // guard that a ganging or step-and-repeat mistake cannot silently drop or
  // duplicate a section.
  const seen = new Array(P + 1).fill(0);
  for (const fm of forms) for (const k of fm) for (const pg of [P - 2 * k, 2 * k + 1, mate(P - 2 * k), mate(2 * k + 1)]) seen[pg]++;
  const want = repeatMode ? C : (tile || 1);
  const wrong = [];
  for (let pg = 1; pg <= P; pg++) if (seen[pg] !== want) wrong.push(`${pg}×${seen[pg]}`);
  if (wrong.length) issues.push(`page coverage wrong (expected ${want} placement(s) each): ${wrong.slice(0, 8).join(", ")}${wrong.length > 8 ? "…" : ""}`);
  check.getPages().forEach((p, i) => {
    const m = p.getMediaBox();
    if (Math.abs(m.width - layout.sheet.long * PT) > 0.5 || Math.abs(m.height - layout.sheet.short * PT) > 0.5)
      issues.push(`sheet ${i + 1} MediaBox ${(m.width / PT).toFixed(2)}×${(m.height / PT).toFixed(2)}″ ≠ ${layout.sheet.long}×${layout.sheet.short}″`);
    if (!getPageBox(p, "TrimBox")) issues.push(`sheet ${i + 1} missing TrimBox`);
    if (!getPageBox(p, "BleedBox")) issues.push(`sheet ${i + 1} missing BleedBox`);
    if (i === 0) { const th = inspectPdfThreats(check); if (th.length) issues.push(`output carries active content: ${th.join("; ")}`); }
  });
  if (!layout.mismatch && !layout.efficient && !layout.fillSheet && !layout.manualGrid && layout.pricedImp >= 2 && layout.imp !== layout.pricedImp)
    issues.push(`placed ${layout.imp} pages/side ≠ priced ${layout.pricedImp}`);
  // imp:1 sizes intentionally run 1 spread/side on 13×27.5 — still pin that
  // down, unless the operator forced a different parent sheet (their call,
  // and the spread-count expectation still holds).
  if (!layout.mismatch && !layout.manualGrid && layout.pricedImp < 2 && !(bk.spreadsPerSide === 1 && (layout.sheet.key === "13x27.5" || layout.sheetForced)))
    issues.push(`imp:1 size expected 1 spread/side on 13×27.5, got ${bk.spreadsPerSide} on ${layout.sheet.key}`);
  if (issues.length) throw new Error("Preflight FAILED: " + issues.join("; "));

  return {
    bytes, layout, warnings, sheets: totalSheets, pageLabels,
    sideReports: [{ side: "BOOKLET", pages: n, padded: P, signatures: S, forms: F, sigMode: order,
      formPlan: forms.map(fm => fm.map(k => k + 1)), spreadsPerSide: bk.spreadsPerSide, tumble, srcRotPages: arts.filter(a => a.rot).length }],
  };
}

// ── Main entry: impose artwork bytes onto press sheets ──
// spec: { calc, trimLong, trimShort, sides, qty, sheetFlip, backRotate,
//         jobName, orderRef, marks }
// artBytes: front (+back on page 2) PDF. backBytes: optional separate back PDF.
function layoutOpts(spec) {
  return {
    allowBestFit: !!spec.allowBestFit,
    efficient: !!spec.efficient,
    gutter: isFinite(spec.gutter) && spec.gutter !== null && spec.gutter !== "" ? +spec.gutter : null,
    offset: { mode: spec.offsetMode || "jog", right: +spec.offsetRight || 0.5, bottom: +spec.offsetBottom || 0.5 },
    pattern: spec.pattern || "straight",
    manualPattern: spec.manualPattern || null,
    forceRotated: spec.forceRotated || "auto",
    bleed: isFinite(spec.bleed) && spec.bleed !== null && spec.bleed !== "" ? +spec.bleed : null,
    // Saddle signature gutters: manual per-gap overrides + full-sheet flag.
    saddleColGaps: Array.isArray(spec.saddleColGaps) ? spec.saddleColGaps : null,
    saddleRowGaps: Array.isArray(spec.saddleRowGaps) ? spec.saddleRowGaps : null,
    saddleFillSheet: spec.saddleFillSheet == null ? null : !!spec.saddleFillSheet,
    // Manual grid (flats/stickers): operator-set columns × rows, optional press
    // sheet, plus the shared per-gap gutter arrays / full-sheet flag.
    manualGrid: isFinite(+spec.gridAcross) && +spec.gridAcross >= 1 && isFinite(+spec.gridDown) && +spec.gridDown >= 1
      ? { across: +spec.gridAcross, down: +spec.gridDown } : null,
    manualSheet: spec.gridSheet || null,
    // Step and repeat (saddle): copies of the SAME signature per sheet. The
    // manual grid wins when both are set — it is the more specific instruction.
    sigRepeat: isFinite(+spec.sigRepeat) && +spec.sigRepeat >= 1 ? Math.floor(+spec.sigRepeat) : null,
    // Parent-sheet override (throws on an unusable custom size).
    sheetOverride: sheetOverrideOf(spec),
    colGaps: Array.isArray(spec.colGaps) ? spec.colGaps : null,
    rowGaps: Array.isArray(spec.rowGaps) ? spec.rowGaps : null,
    fillSheet: spec.fillSheet == null ? null : !!spec.fillSheet,
  };
}

// ── Raster artwork ──────────────────────────────────────────────────────────
// The storefront accepts jpg/png/tiff, the engine only ever spoke PDF, and the
// gap was invisible: a customer's JPG reached Drive fine and then simply did
// not appear as artwork (order 87045). Rather than teach step-and-repeat about
// bitmaps — the imp functions are verbatim ports of the calculators' and must
// stay that way — a raster is wrapped into a single-page PDF here, at the
// boundary. Everything downstream, including the pdf.js ink detection, then
// genuinely receives a PDF and behaves identically.
//
// Physical size comes from pixels at 300 DPI, the same assumption the
// calculators use to size a raster upload, so the imposed sheet matches the
// proof the customer approved rather than inventing a second convention.
const PPS_RASTER_DPI = 300;
function ppsSniff(bytes) {
  const b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  if (b.length > 4 && b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return "pdf";
  if (b.length > 3 && b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return "jpg";
  if (b.length > 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return "png";
  if (b.length > 4 && ((b[0] === 0x49 && b[1] === 0x49 && b[2] === 0x2A) || (b[0] === 0x4D && b[1] === 0x4D && b[3] === 0x2A))) return "tiff";
  return "unknown";
}
async function ppsToPdfBytes(bytes, label) {
  if (!bytes) return bytes;
  const kind = ppsSniff(bytes);
  if (kind === "pdf") return bytes;
  if (kind === "tiff") {
    throw new Error("The " + label + " artwork is a TIFF, which cannot be imposed directly. "
      + "Save it as PDF, JPEG or PNG and re-upload it to the order folder.");
  }
  if (kind !== "jpg" && kind !== "png") {
    throw new Error("The " + label + " artwork is not a PDF, JPEG or PNG and cannot be imposed.");
  }
  const doc = await PL.PDFDocument.create();
  const img = kind === "jpg" ? await doc.embedJpg(bytes) : await doc.embedPng(bytes);
  const wPt = (img.width / PPS_RASTER_DPI) * 72;
  const hPt = (img.height / PPS_RASTER_DPI) * 72;
  const page = doc.addPage([wPt, hPt]);
  page.drawImage(img, { x: 0, y: 0, width: wPt, height: hPt });
  return await doc.save();
}

// ═══════════════════════════════════════════════════════════════
// PERFECT BOUND — two press jobs from one order
// ═══════════════════════════════════════════════════════════════
// A perfect-bound book is not one imposition. The COVER is a single flat piece
// (back | spine | front) on cover stock, and the GUTS are a book block on text
// stock — different paper, different press run, different cutting. So the tool
// emits two files and images each as its own job.
//
// Artwork arrives one of two ways, and both are supported because both are in
// use: the calculator's own template pair (a cover file already flat with the
// spine allowance in it, plus a guts file), or a single reading-order PDF the
// way a saddle job arrives, from which the cover faces are lifted and the flat
// cover is BUILT around the spine.
//
// Spine width is operator-entered. It is a physical property of the actual book
// block — caliper varies by lot and the press room measures it — and a wrong
// spine ruins every cover printed. `calcSpineInches()` in calc-perfect-bound.html
// is the estimate the customer was quoted from; it is a starting point, not a
// substitute for measuring.

function pbSpineOf(spec) {
  const v = +(spec && spec.spine);
  if (!isFinite(v) || v < 0) throw new Error("Perfect bound needs a spine width (inches). Measure the glued book block — the quoted estimate is a starting point, not a substitute.");
  if (v > 3) throw new Error(`Spine ${v}″ is beyond the 3″ limit — check the value is inches, not millimetres.`);
  return v;
}

// Build the flat cover from four trim-size faces lifted out of a reading-order
// file. Outside reads back|spine|front; the inside face is what you get after
// flipping the sheet, so its left panel is the INSIDE FRONT (page 2) and its
// right panel the inside back — get this backwards and the cover glues up with
// the inside faces transposed.
async function pbBuildCover(srcDoc, pw, ph, spine, bleed) {
  const n = srcDoc.getPageCount();
  const W = (2 * pw + spine) * PT, H = ph * PT;
  const out = await PL.PDFDocument.create();
  const idx = { front: 0, insideFront: 1, insideBack: n - 2, back: n - 1 };
  const want = [idx.back, idx.front, idx.insideFront, idx.insideBack].filter(i => i >= 0 && i < n);
  const emb = await out.embedPdf(srcDoc, want);
  const at = i => emb[want.indexOf(i)];
  const place = (page, srcIdx, x) => {
    const e = at(srcIdx);
    if (!e) return;
    // fit-to-panel, never crop — same rule the rest of the engine uses
    const sc = Math.min(pw * PT / e.width, ph * PT / e.height);
    page.drawPage(e, { x: x + (pw * PT - e.width * sc) / 2, y: (H - e.height * sc) / 2,
                       xScale: sc, yScale: sc });
  };
  const rightX = (pw + spine) * PT;
  const outside = out.addPage([W, H]);
  place(outside, idx.back, 0);
  place(outside, idx.front, rightX);
  const inside = out.addPage([W, H]);
  place(inside, idx.insideFront, 0);
  place(inside, idx.insideBack, rightX);
  for (const pg of [outside, inside]) {
    pg.setMediaBox(0, 0, W, H); pg.setCropBox(0, 0, W, H);
    pg.setTrimBox(0, 0, W, H); pg.setBleedBox(0, 0, W, H);
  }
  return await out.save({ useObjectStreams: false });
}

// Lift the interior pages (everything but the four cover faces) into their own
// document, so the guts run as an ordinary multipage flat job.
async function pbBuildGuts(srcDoc) {
  const n = srcDoc.getPageCount();
  const idx = [];
  for (let i = 2; i <= n - 3; i++) idx.push(i);
  if (!idx.length) throw new Error(`A reading-order perfect bound file needs more than its 4 cover faces — got ${n} page(s).`);
  const out = await PL.PDFDocument.create();
  const pages = await out.copyPages(srcDoc, idx);
  pages.forEach(pg => out.addPage(pg));
  return { bytes: await out.save({ useObjectStreams: false }), count: idx.length };
}

async function imposePerfectBound(artBytes, coverBytes, spec) {
  const pw = Math.max(+spec.trimLong || 0, +spec.trimShort || 0);
  const phh = Math.min(+spec.trimLong || 0, +spec.trimShort || 0);
  // Saddle convention: the two boxes are width × height and the spine sits on
  // the height edge. Perfect bound binds on the height edge too.
  const trimW = +spec.trimLong, trimH = +spec.trimShort;
  if (!(trimW >= 2 && trimH >= 2)) throw new Error("Enter page width × height (min 2″)");
  const spine = pbSpineOf(spec);
  const bleed = isFinite(spec.bleed) && spec.bleed !== null && spec.bleed !== "" ? +spec.bleed : BLEED;

  const src = await PL.PDFDocument.load(artBytes, { ignoreEncryption: true });
  stripActiveContent(src);
  let coverB, gutsB, gutsN, assembled = false;

  if (coverBytes) {
    // Template pair: the cover file is already the flat spread.
    coverB = coverBytes;
    const cdoc = await PL.PDFDocument.load(coverBytes, { ignoreEncryption: true });
    const c0 = cdoc.getPage(0);
    const cw = c0.getMediaBox().width / PT, expect = 2 * trimW + spine;
    if (Math.abs(cw - expect) > 0.26 && Math.abs(cw - (expect + 2 * bleed)) > 0.26) {
      throw new Error(`Cover file is ${cw.toFixed(3)}″ wide but a ${trimW}×${trimH}″ book with a ${spine}″ spine needs ${expect.toFixed(3)}″ (or ${(expect + 2 * bleed).toFixed(3)}″ with bleed). Check the spine width and the cover file.`);
    }
    const g = await pbBuildGuts_all(src);
    gutsB = g.bytes; gutsN = g.count;
  } else {
    // Single reading-order file, saddle-style: split it.
    coverB = await pbBuildCover(src, trimW, trimH, spine, bleed);
    const g = await pbBuildGuts(src);
    gutsB = g.bytes; gutsN = g.count;
    assembled = true;
  }

  const base = k => Object.assign({}, spec, {
    calc: k, multiMode: k === "pb-guts" ? (spec.multiMode || "gang") : "repeat",
    sides: 2, manualGrid: null, gridAcross: null, gridDown: null,
  });
  const coverSpec = Object.assign(base("pb-cover"), {
    trimLong: 2 * trimW + spine, trimShort: trimH,
    jobName: (spec.jobName || "book") + "_COVER",
  });
  const gutsSpec = Object.assign(base("pb-guts"), {
    trimLong: trimW, trimShort: trimH,
    jobName: (spec.jobName || "book") + "_GUTS",
  });

  const cover = await imposePdf(coverB, null, coverSpec);
  const guts  = await imposePdf(gutsB,  null, gutsSpec);

  const note = [];
  note.push(`Perfect bound split into two press jobs — cover ${(2 * trimW + spine).toFixed(3)}×${trimH}″ flat (${trimW}″ + ${spine}″ spine + ${trimW}″), guts ${gutsN} page(s) at ${trimW}×${trimH}″.`);
  if (assembled) note.push("Cover assembled from the reading-order file: outside = back|spine|front (pages last, 1); inside = inside-front|spine|inside-back (pages 2, second-to-last).");
  else note.push("Cover taken from the supplied cover file as-is (already flat with the spine allowance).");
  note.push("Spine is operator-entered — measure the glued book block; the quoted estimate assumes nominal caliper.");
  cover.warnings = note.concat(cover.warnings);
  guts.warnings  = note.concat(guts.warnings);

  return { parts: [
    { part: "cover", label: `Cover — ${(2 * trimW + spine).toFixed(3)}×${trimH}″ flat, ${spine}″ spine`, ...cover },
    { part: "guts",  label: `Guts — ${gutsN} pages at ${trimW}×${trimH}″`, ...guts },
  ] };
}

// Guts when a separate cover file was supplied: the main file IS the block.
async function pbBuildGuts_all(srcDoc) {
  const n = srcDoc.getPageCount();
  const out = await PL.PDFDocument.create();
  const pages = await out.copyPages(srcDoc, Array.from({ length: n }, (_, i) => i));
  pages.forEach(pg => out.addPage(pg));
  return { bytes: await out.save({ useObjectStreams: false }), count: n };
}

async function imposePdf(artBytes, backBytes, spec, gangFiles) {
  // Normalize before anything reads a page box, so every path below — flats,
  // stickers, saddle, gang, ink detection — sees a PDF and nothing else changes.
  artBytes = await ppsToPdfBytes(artBytes, "front");
  if (backBytes) backBytes = await ppsToPdfBytes(backBytes, "back");
  if (Array.isArray(gangFiles)) {
    for (const g of gangFiles) {
      if (g && g.bytes) g.bytes = await ppsToPdfBytes(g.bytes, g.name || "gang");
    }
  }
  // Gang combo: ≥2 uploaded design files share one sheet (same trim), each
  // taking a share of the cells. Ignores multiMode; qty = press sheets.
  const gang = Array.isArray(gangFiles) && gangFiles.filter(g => g && g.bytes).length >= 2
    ? gangFiles.filter(g => g && g.bytes) : null;
  if (spec.calc === "perfect-bound") {
    if (gang) throw new Error("Gang combo is for flats/stickers — a perfect bound book is one document");
    return imposePerfectBound(artBytes, backBytes, spec);
  }
  const layout = computeLayout(spec.calc, spec.trimLong, spec.trimShort, layoutOpts(spec));
  if (spec.calc === "saddle") {
    if (gang) throw new Error("Gang combo is for flats/stickers — a saddle booklet is one document");
    return imposeSaddle(artBytes, spec, layout);
  }
  const warnings = [...layout.warnings];

  const srcFront = await PL.PDFDocument.load(gang ? gang[0].bytes : artBytes, { ignoreEncryption: true });
  stripActiveContent(srcFront);
  const nF = srcFront.getPageCount();
  if (nF < 1) throw new Error("Artwork PDF has no pages");
  const sides = spec.sides === 2 ? 2 : 1;
  const mode = gang ? "combo" : ["gang", "stack", "each"].includes(spec.multiMode) ? spec.multiMode : "repeat";
  const backDoc = !gang && backBytes ? await PL.PDFDocument.load(backBytes, { ignoreEncryption: true }) : null;
  if (backDoc) stripActiveContent(backDoc);

  // add-bleed: per-page override map (1-based page keys, main file) falls
  // back to the job-level mode; back-file pages use the job-level mode.
  const abPages = spec.addBleedPages || {};
  const abMode = pno => {
    const m = abPages[pno + 1] != null ? abPages[pno + 1] : spec.addBleed;
    return m && m !== "off" ? m : null;
  };
  const inset = insetOf(spec);
  const userScale = artScaleOf(spec);
  const { showMarks, showSlug } = marksOf(spec);
  // Optional-content accumulator: one config for the whole output, fed by every
  // source document that gets embedded (gang combos bring several).
  const ocAcc = { all: new Map(), off: new Map() };
  const ocPending = [];
  const ocCache = new Map();
  const ocSrcFor = doc => { if (!ocCache.has(doc)) ocCache.set(doc, srcHiddenOCGRefs(doc)); return ocCache.get(doc); };
  const inkDocs = {};
  async function inkDocFor(which) { // lazy pdf.js rasterizer per source file
    if (!inkDocs[which]) {
      const src = which === "F" ? (gang ? gang[0].bytes : artBytes) : which === "B" ? backBytes : gang[+which.slice(1)].bytes;
      inkDocs[which] = await pdfjsLib.getDocument({ data: src.slice(0) }).promise;
    }
    return inkDocs[which];
  }

  // ── Piece list: each piece = one finished item {front, back} page refs.
  // "repeat" = single-design step-and-repeat (page 1 [+2] only). "gang" /
  // "stack" treat a multipage COLLATED file as distinct pieces; 2-sided
  // without a separate back file reads pages front/back INTERLEAVED
  // (p1 = front of piece 1, p2 = its back, p3 = front of piece 2, …).
  const pieces = [];
  let gangAlloc = null;
  if (mode === "combo") {
    const docs = [srcFront];
    for (let i = 1; i < gang.length; i++) { const gd = await PL.PDFDocument.load(gang[i].bytes, { ignoreEncryption: true }); stripActiveContent(gd); docs.push(gd); }
    const total = layout.cells.length;
    const want = gang.map(g => (isFinite(+g.slots) && +g.slots > 0 ? Math.floor(+g.slots) : null));
    const explicit = want.reduce((s, v) => s + (v || 0), 0);
    if (explicit > total) throw new Error(`Gang slots add up to ${explicit} but the sheet only has ${total} cells (${layout.imp}-up)`);
    const autoIdx = want.map((v, i) => (v == null ? i : -1)).filter(i => i >= 0);
    const rem = total - explicit;
    autoIdx.forEach((fi, k) => { want[fi] = Math.floor(rem / autoIdx.length) + (k < rem % autoIdx.length ? 1 : 0); });
    gangAlloc = want;
    for (let i = 0; i < gang.length; i++) {
      const doc = docs[i], n = doc.getPageCount();
      if (!want[i]) { warnings.push(`"${gang[i].name}" got 0 cells — raise its slots or free cells from other files`); continue; }
      if (sides === 2 && n < 2) throw new Error(`"${gang[i].name}" is 1 page but the job is 2-sided — each gang design needs page 1 (front) + page 2 (back)`);
      if (n > sides) warnings.push(`"${gang[i].name}" has ${n} pages — gang combo uses page 1${sides === 2 ? "+2" : ""} only`);
      const back = sides === 2 ? { doc, pno: 1, gi: i } : null;
      for (let k = 0; k < want[i]; k++) pieces.push({ front: { doc, pno: 0, gi: i }, back });
    }
    const blanks = total - pieces.length;
    warnings.push(`GANG COMBO: ${gang.map((g, i) => `${g.name} ×${want[i]}`).join(" · ")}${blanks ? ` — ${blanks} cell(s) blank` : ""}. Qty = press sheets; each sheet yields those counts per design.`);
  } else if (mode === "repeat") {
    let back = null;
    if (sides === 2) {
      if (backDoc) back = { doc: backDoc, pno: 0 };
      else if (nF >= 2) back = { doc: srcFront, pno: 1 };
      else throw new Error("2-sided job but artwork has only 1 page — drop a back-side PDF or use a 2-page file");
    }
    pieces.push({ front: { doc: srcFront, pno: 0 }, back });
    if (nF > sides) warnings.push(`file has ${nF} pages but multi-page handling is "repeat single design" — only page 1${sides === 2 && !backDoc ? "+2" : ""} used. Choose gang or cut & stack if the pages are different pieces.`);
  } else if (backDoc) {
    const nB = backDoc.getPageCount();
    const M = Math.min(nF, nB);
    if (sides === 2 && nF !== nB) warnings.push(`front file has ${nF} pages, back file ${nB} — using the first ${M} piece(s)`);
    for (let i = 0; i < M; i++) pieces.push({ front: { doc: srcFront, pno: i }, back: sides === 2 ? { doc: backDoc, pno: i } : null });
  } else if (sides === 2) {
    if (nF < 2) throw new Error("2-sided collated job needs at least 2 pages (front/back interleaved)");
    if (nF % 2) warnings.push(`odd page count (${nF}) — the last piece's back will be blank`);
    for (let i = 0; i < Math.ceil(nF / 2); i++) pieces.push({ front: { doc: srcFront, pno: 2 * i }, back: 2 * i + 1 < nF ? { doc: srcFront, pno: 2 * i + 1 } : null });
  } else {
    for (let i = 0; i < nF; i++) pieces.push({ front: { doc: srcFront, pno: i }, back: null });
  }

  const imp = layout.imp;
  // sheets per collated set: gang/stack pack pieces into cells; "each" gives
  // every piece its own full step-and-repeat sheet (own run quantity).
  const D = mode === "repeat" || mode === "combo" ? 1 : mode === "each" ? pieces.length : Math.ceil(pieces.length / imp);
  if (mode === "each") {
    warnings.push(`${pieces.length} piece(s), one full ${imp}-up sheet each — print each sheet's own quantity.`);
  } else if (mode !== "repeat") {
    const blanks = D * imp - pieces.length;
    warnings.push(`${pieces.length} collated piece(s) ${mode === "gang" ? "ganged in page order" : "distributed cut-&-stack (piles collate after cutting)"} across ${D} sheet${D === 1 ? "" : "s"}${blanks ? ` — ${blanks} leftover cell(s) stay blank` : ""}.`);
  }

  const cellLandscape = layout.cellW >= layout.cellH;
  const out = await PL.PDFDocument.create();
  const font = await out.embedFont(PL.StandardFonts.Helvetica);
  // qty semantics: repeat → total pieces; gang/stack → copies per collated set
  const sheets = spec.qty
    ? (mode === "repeat" ? Math.ceil(spec.qty / imp)
      : mode === "combo" ? spec.qty
      : mode === "each" ? pieces.length * Math.ceil(spec.qty / imp)
      : spec.qty * D)
    : (mode === "repeat" || mode === "combo" ? null : D);
  const dateStr = new Date().toISOString().slice(0, 10);

  // Resolve + embed each DISTINCT source page once (fix a/d), shared across cells.
  const artCache = new Map(), embedCache = new Map();
  const keyOf = ref => ref.gi != null ? `G${ref.gi}#${ref.pno}` : (ref.doc === srcFront ? "F" : "B") + ref.pno;
  let scaledPages = 0;
  async function prepared(ref) {
    const key = keyOf(ref);
    if (!artCache.has(key)) {
      const art = resolveSideArt(ref.doc.getPage(ref.pno), layout.pieceLong, layout.pieceShort, cellLandscape, layout.bleed);
      const abm = ref.gi != null || ref.doc === backDoc
        ? (spec.addBleed && spec.addBleed !== "off" ? spec.addBleed : null) : abMode(ref.pno);
      applyArtScale(art, userScale);
      applyArtInset(art, inset);
      // Same bleed-ALLOWANCE-is-not-bleed probe as the booklet path.
      if (art.hasBleed && !art.ringChecked) {
        art.ringChecked = true;
        const w0 = ref.gi != null ? "G" + ref.gi : ref.doc === backDoc ? "B" : "F";
        try {
          const ring = await detectBleedInk(await inkDocFor(w0), ref.pno, art);
          if (ring && ring.empty) {
            art.bleedEmpty = true;
            // ownBleed is GEOMETRIC — it reports the allowance as coverage, so
            // covX/covY come out at the full bleed and the synth band computes
            // to zero width, drawing nothing. The ink really stops at the trim,
            // so say so: coverage 0, band = the whole bleed, mirrored about the
            // trim edge. Without this the tool reports "synthesized" and emits
            // byte-identical output.
            art.ownBleed = 0;
            art.notes.push(`page is bleed-sized but the bleed area is EMPTY — the art stops at the cut line, so every edge will cut paper white. Set "Add bleed" to Auto, Mirror or Scale to fill it, or supply art extended past the trim.`);
          } else if (ring && ring.blank.length) {
            art.bleedEmptyEdges = ring.blank;
            art.notes.push(`bleed is missing on the ${ring.blank.join("/")} edge(s) — art stops at the cut line there`);
          }
        } catch (e) { /* best-effort */ }
      }
      if (abm && (!art.hasBleed || art.bleedEmpty || inset > 0)) {
        const which = ref.gi != null ? "G" + ref.gi : ref.doc === backDoc ? "B" : "F";
        let gaps = null;
        if (spec.addBleedSmart !== false) {
          try { gaps = await detectInkGaps(await inkDocFor(which), ref.pno, art); }
          catch (e) { warnings.push(`add-bleed ink detection failed on ${keyOf(ref)} (${e.message}) — synthesized from the page edge instead`); }
        }
        if (abm === "auto") {
          // the inset widens the reflected band — look for text that far in too
          try { art.textNear = await detectTextNearEdges(await inkDocFor(which), ref.pno, art, layout.bleed + inset); }
          catch (e) { // can't prove the edges are text-free — streak everywhere
            art.textNear = { left: true, right: true, top: true, bottom: true };
            warnings.push(`text detection failed on ${keyOf(ref)} (${e.message}) — streak bleed used on all edges`);
          }
        }
        applySynthBleed(art, abm, layout.bleed, gaps, streakEpsOf(spec), inset);
      }
      finalizeArtCoverage(art, layout.bleed);
      if (ref.gi != null) art.notes.forEach(n => warnings.push(`${gang[ref.gi].name}${ref.pno ? " (back)" : ""}: ${n}`));
      else if (key === keyOf(pieces[0].front)) art.notes.forEach(n => warnings.push("front: " + n));
      else if (sides === 2 && pieces[0].back && key === keyOf(pieces[0].back)) art.notes.forEach(n => warnings.push("back: " + n));
      else if (art.scale !== 1) scaledPages++;
      const [embedded] = await out.embedPdf(ref.doc, [ref.pno]);
      // Layer visibility, per source document (gang files each bring their own).
      const ocSrc = ocSrcFor(ref.doc);
      if (ocSrc.any) ocPending.push({ ref: embedded.ref, srcRes: pageResources(ref.doc.getPage(ref.pno).node), hidden: ocSrc.hidden });
      artCache.set(key, art); embedCache.set(key, embedded);
    }
    return { art: artCache.get(key), embedded: embedCache.get(key) };
  }

  // Reading order for piece assignment: top row first, left → right
  const reading = [...layout.cells].sort((a, b) => b.row - a.row || a.col - b.col);
  const flip = spec.sheetFlip || "short";
  const mirroredAll = mirrorCells(layout.cells, layout, flip);
  const mirrorOf = new Map(layout.cells.map((c, i) => [c, mirroredAll[i]]));

  // gang fills sheet-by-sheet in page order; stack deals pile-by-pile so the
  // cut piles, stacked in reading order, yield the collated sequence.
  const pieceAt = (s, slot) => {
    if (mode === "repeat") return pieces[0];
    if (mode === "combo") return slot < pieces.length ? pieces[slot] : null; // contiguous blocks per file, reading order
    if (mode === "each") return pieces[s];
    const idx = mode === "gang" ? s * imp + slot : slot * D + s;
    return idx < pieces.length ? pieces[idx] : null;
  };

  const pageLabels = [];
  let slugWarned = false, tumbleNoted = false;
  for (let s = 0; s < D; s++) {
    for (const sideIdx of (sides === 2 ? [0, 1] : [0])) {
      const page = out.addPage([layout.sheet.long * PT, layout.sheet.short * PT]);
      const cellsForMarks = sideIdx === 0 ? layout.cells : mirroredAll;
      for (let slot = 0; slot < reading.length; slot++) {
        const piece = pieceAt(s, slot);
        if (!piece) continue;                       // leftover cell stays deterministically empty
        const ref = sideIdx === 0 ? piece.front : piece.back;
        if (!ref) continue;                         // blank back (odd interleave)
        const { art, embedded } = await prepared(ref);
        const frontCell = reading[slot];
        const cell = sideIdx === 0 ? frontCell : mirrorOf.get(frontCell);
        // Back tumble: 180° whenever the press flip axis is perpendicular to
        // the placed art's head axis — proven by physical duplex simulation.
        let extraRot = 0;
        if (sideIdx === 1) {
          const headVertical = art.cellRotate % 180 === 0;
          const autoTumble = flip === "short" ? !headVertical : headVertical;
          const bmode = spec.backRotate === 0 || spec.backRotate === 180 ? spec.backRotate : "auto";
          extraRot = bmode === "auto" ? (autoTumble ? 180 : 0) : bmode;
          if (extraRot && !tumbleNoted) { tumbleNoted = true; warnings.push(`back rotated 180° (${bmode === "auto" ? "auto — registers with front under " + flip + "-edge flip" : "manual tumble"})`); }
        }
        placeInCell(page, embedded, art, cell, extraRot + (frontCell.patRot || 0));
      }
      const label = (sideIdx === 0 ? "FRONT" : "BACK") + (D > 1 ? ` ${s + 1}/${D}` : "") + (mode === "combo" ? " · GANG COMBO" : mode === "gang" ? " · GANG" : mode === "stack" ? " · CUT&STACK" : mode === "each" ? ` · PIECE ${s + 1}` : "");
      pageLabels.push(label);
      if (showMarks) drawMarks(page, layout, cellsForMarks);
      if (showSlug) {
        const placed = drawSlug(page, layout, font, {
          side: label, orderRef: spec.orderRef, jobName: spec.jobName, artInset: inset || 0, artScale: userScale,
          qty: spec.qty, sheets, date: dateStr,
        }, cellsForMarks);
        if (!placed && !slugWarned) { slugWarned = true; warnings.push("no clear space inside the printable area for the slug line — omitted"); }
      }
      // Explicit page boxes (fix a)
      const w = layout.sheet.long * PT, h = layout.sheet.short * PT;
      page.setMediaBox(0, 0, w, h); page.setCropBox(0, 0, w, h);
      page.setBleedBox(0, 0, w, h); page.setTrimBox(0, 0, w, h);
    }
  }
  if (scaledPages) warnings.push(`${scaledPages} additional page(s) required fit-to-trim scaling`);

  const sideReports = [];
  const f0 = artCache.get(keyOf(pieces[0].front));
  if (f0) sideReports.push({ side: "FRONT", rot: f0.rot, cellRotate: f0.cellRotate, scale: f0.scale, hasBleed: f0.hasBleed, synth: f0.synth });
  if (sides === 2 && pieces[0].back) {
    const b0 = artCache.get(keyOf(pieces[0].back));
    if (b0) sideReports.push({ side: "BACK", rot: b0.rot, cellRotate: b0.cellRotate, scale: b0.scale, hasBleed: b0.hasBleed, synth: b0.synth });
  }
  if (mode === "combo") sideReports.push({ side: "COMBO", pieces: pieces.length, sheetsPerSet: 1, modeName: "gang combo", alloc: gang.map((g, i) => `${g.name} ×${gangAlloc[i]}`).join(" · ") });
  else if (mode !== "repeat") sideReports.push({ side: "COLLATED", pieces: pieces.length, sheetsPerSet: D, modeName: mode });

  if (ocPending.length) {
    await out.flush();   // materialise the copied XObjects before reading them
    collectPendingOC(out, ocPending, ocAcc);
  }
  const ocHidden = writeOCProperties(out, ocAcc);
  if (ocHidden) warnings.push(`source has ${ocHidden} HIDDEN layer(s) — kept hidden on the imposed sheet (they are switched off in the output too, and marked do-not-print). Flatten the layers in the source if your RIP ignores optional content.`);
  out.setTitle(`IMPOSED ${spec.jobName || spec.orderRef || "job"} — ${layout.imp}-up on ${layout.sheet.label}`);
  out.setProducer("PPS Auto-Imposition Tool");
  out.setCreator("PPS Auto-Imposition Tool");
  const bytes = await out.save({ useObjectStreams: false });

  // ── Preflight (fix a): reload and validate before anything ships ──
  const check = await PL.PDFDocument.load(bytes);
  const issues = [];
  if (check.getPageCount() !== D * sides) issues.push(`page count ${check.getPageCount()} ≠ ${D * sides} sheet sides`);
  check.getPages().forEach((p, i) => {
    const m = p.getMediaBox();
    if (Math.abs(m.width - layout.sheet.long * PT) > 0.5 || Math.abs(m.height - layout.sheet.short * PT) > 0.5)
      issues.push(`sheet ${i + 1} MediaBox ${(m.width / PT).toFixed(2)}×${(m.height / PT).toFixed(2)}″ ≠ ${layout.sheet.long}×${layout.sheet.short}″`);
    if (!getPageBox(p, "TrimBox")) issues.push(`sheet ${i + 1} missing TrimBox`);
    if (!getPageBox(p, "BleedBox")) issues.push(`sheet ${i + 1} missing BleedBox`);
    if (i === 0) { const th = inspectPdfThreats(check); if (th.length) issues.push(`output carries active content: ${th.join("; ")}`); }
  });
  if (!layout.mismatch && !layout.efficient && !layout.manualGrid && !layout.unpriced && layout.imp !== Math.round(layout.pricedImp)) issues.push(`placed ${layout.imp}-up ≠ priced ${layout.pricedImp}-up`);
  if (issues.length) throw new Error("Preflight FAILED: " + issues.join("; "));

  return { bytes, layout, warnings, sheets, sideReports, pageLabels, pieces: pieces.length, sheetsPerSet: D };
}

// ── Manifest parser: autofill spec from a *_manipulation_manifest.txt ──
function parseManifest(text) {
  const out = {};
  const trim = text.match(/Trim size:\s*([\d.]+)\s*[″"]?\s*[×x]\s*([\d.]+)/);
  if (trim) {
    out.rawW = +trim[1]; out.rawH = +trim[2]; // manifest order is width × height
    out.trimLong = Math.max(+trim[1], +trim[2]); out.trimShort = Math.min(+trim[1], +trim[2]);
  }
  if (/Booklet Specifications/i.test(text)) out.calc = "saddle";
  else if (/Brochure Specifications/i.test(text)) out.calc = "brochure";
  const sides = text.match(/Sides uploaded:\s*(.+)/);
  if (sides) out.sides = sides[1].includes("+") ? 2 : 1;
  const fname = text.match(/Filename:\s*(.+)/);
  if (fname) out.jobName = fname[1].trim();
  return out;
}

// Detect the finished trim size from a PDF's first page. An explicit
// TrimBox wins; otherwise decide whether the media size is bleed-inclusive
// by checking which interpretation lands on a "rounder" size (production
// trims are usually halves; quarter-inch values score lower). /Rotate is
// honoured so the detected size matches the displayed orientation.
const r16 = v => Math.round(v * 16) / 16;
function detectTrim(doc, bleed) {
  const page = doc.getPage(0);
  const rotSwap = (((page.getRotation().angle % 360) + 360) % 360) % 180 !== 0;
  const dims = (w, h) => rotSwap ? { w: h / PT, h: w / PT } : { w: w / PT, h: h / PT };
  const mb = page.getMediaBox();
  const tb = getPageBox(page, "TrimBox");
  if (tb && (Math.abs(tb.w - mb.width) > 1 || Math.abs(tb.h - mb.height) > 1)) {
    const d = dims(tb.w, tb.h);
    return { w: r16(d.w), h: r16(d.h), method: "embedded TrimBox" };
  }
  const b = isFinite(bleed) ? +bleed : BLEED;
  const media = dims(mb.width, mb.height);
  const inset = { w: media.w - 2 * b, h: media.h - 2 * b };
  const nice = v => Math.abs(v * 2 - Math.round(v * 2)) < 0.02 ? 2 : Math.abs(v * 4 - Math.round(v * 4)) < 0.02 ? 1 : 0;
  if (b > 0 && inset.w >= 1 && inset.h >= 1 && nice(inset.w) + nice(inset.h) > nice(media.w) + nice(media.h)) {
    return { w: r16(inset.w), h: r16(inset.h), method: `media size − ${2 * b}″ bleed` };
  }
  return { w: r16(media.w), h: r16(media.h), method: "exact media size (no bleed detected)" };
}

function sanitizeName(s) { return String(s || "").replace(/[^\w.\-]+/g, "_").replace(/_+/g, "_").slice(0, 60); }

function imposedFilename(spec, layout) {
  const bits = ["IMPOSED"];
  // Order-<id>-i<item> lets the admin queue mark IMPOSED per line item, not
  // per order — keep in sync with pps_impose_is_output_name() in PHP.
  if (spec.orderRef) bits.push("Order-" + sanitizeName(spec.orderRef) + (spec.itemRef ? "-i" + sanitizeName(spec.itemRef) : ""));
  if (spec.jobName) bits.push(sanitizeName(spec.jobName).replace(/\.pdf$/i, ""));
  if (layout.booklet) bits.push(`${layout.booklet.pw}x${layout.booklet.ph}`, "saddle", `${layout.booklet.spreadsPerSide}spread`, layout.sheet.key);
  else bits.push(`${layout.pieceLong}x${layout.pieceShort}`, `${layout.imp}up`, layout.sheet.key);
  return bits.join("_") + ".pdf";
}

// Engine surface for headless tests / console debugging
window.__ppsImpose = { imposePdf, computeLayout, flatImp, stickerImp, parseManifest, imposedFilename, detectTrim, inspectPdfThreats, sanitizePdf };

function useDebounced(value, ms) {
  const [v, setV] = useState(value);
  useEffect(() => { const t = setTimeout(() => setV(value), ms); return () => clearTimeout(t); }, [value, ms]);
  return v;
}

function Field({ label, children, style }) {
  return <div style={{ marginBottom: 12, ...style }}><span className="lbl">{label}</span>{children}</div>;
}

function DropZone({ label, sub, accept, onFiles, fileName }) {
  const [over, setOver] = useState(false);
  const inputRef = useRef(null);
  const handle = files => { if (files && files.length) onFiles(Array.from(files)); };
  return (
    <div className={"imp-drop" + (over ? " over" : "")}
      onClick={() => inputRef.current && inputRef.current.click()}
      onDragOver={e => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={e => { e.preventDefault(); setOver(false); handle(e.dataTransfer.files); }}>
      <input ref={inputRef} type="file" accept={accept} multiple style={{ display: "none" }}
        onChange={e => { handle(e.target.files); e.target.value = ""; }} />
      <div style={{ fontSize: 14, fontWeight: 700, color: fileName ? "#4ade80" : "#e8eaf0" }}>
        {fileName || label}
      </div>
      <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.4)", marginTop: 4 }}>{sub}</div>
    </div>
  );
}

// SVG schematic of the layout — instant feedback before the PDF preview lands
function LayoutSchematic({ layout }) {
  if (!layout) return null;
  const s = layout.sheet, scale = 320 / s.long;
  const W = s.long * scale, H = s.short * scale;
  return (
    <svg width={W} height={H} style={{ display: "block", background: "#fff", borderRadius: 4 }}>
      <rect x={0} y={0} width={W} height={H} fill="#fff" stroke="#999" />
      <rect x={(s.long - s.usableLong) / 2 * scale} y={(s.short - s.usableShort) / 2 * scale}
        width={s.usableLong * scale} height={s.usableShort * scale} fill="none" stroke="#ddd" strokeDasharray="4 3" />
      {layout.cells.map((c, i) => (
        <g key={i}>
          <rect x={c.clip.x * scale} y={(s.short - c.clip.y - c.clip.h) * scale}
            width={c.clip.w * scale} height={c.clip.h * scale} fill="rgba(233,30,140,.07)" />
          <rect x={c.trim.x * scale} y={(s.short - c.trim.y - c.trim.h) * scale}
            width={c.trim.w * scale} height={c.trim.h * scale} fill="rgba(233,30,140,.16)" stroke="#e91e8c" strokeWidth="1" />
          {!layout.booklet && (() => {
            const cx = (c.trim.x + c.trim.w / 2) * scale;
            const cy = (s.short - c.trim.y - c.trim.h / 2) * scale;
            const r = Math.min(5, c.trim.w * scale / 4);
            const up = !c.patRot;
            return <path d={up ? `M ${cx} ${cy - r} L ${cx - r} ${cy + r} L ${cx + r} ${cy + r} Z`
                               : `M ${cx} ${cy + r} L ${cx - r} ${cy - r} L ${cx + r} ${cy - r} Z`} fill="rgba(233,30,140,.6)" />;
          })()}
          {layout.booklet && (layout.booklet.spreadAlongX
            ? <line x1={(c.trim.x + c.trim.w / 2) * scale} y1={(s.short - c.trim.y - c.trim.h) * scale}
                x2={(c.trim.x + c.trim.w / 2) * scale} y2={(s.short - c.trim.y) * scale}
                stroke="#e91e8c" strokeWidth="1" strokeDasharray="4 3" />
            : <line x1={c.trim.x * scale} y1={(s.short - c.trim.y - c.trim.h / 2) * scale}
                x2={(c.trim.x + c.trim.w) * scale} y2={(s.short - c.trim.y - c.trim.h / 2) * scale}
                stroke="#e91e8c" strokeWidth="1" strokeDasharray="4 3" />)}
        </g>
      ))}
    </svg>
  );
}

function PdfPreview({ bytes, labels }) {
  const holderRef = useRef(null);
  useEffect(() => {
    if (!bytes || !holderRef.current) return;
    let cancelled = false;
    const holder = holderRef.current;
    holder.innerHTML = "";
    (async () => {
      try {
        const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
        const maxRender = 8;
        if (pdf.numPages > maxRender) {
          const note = document.createElement("div");
          note.style.cssText = "font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px";
          note.textContent = `Previewing the first ${maxRender} of ${pdf.numPages} sheet sides — the downloaded PDF contains all of them.`;
          holder.appendChild(note);
        }
        for (let i = 1; i <= Math.min(pdf.numPages, maxRender) && !cancelled; i++) {
          const page = await pdf.getPage(i);
          const vp0 = page.getViewport({ scale: 1 });
          const scale = Math.min(760 / vp0.width, 2);
          const vp = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          canvas.width = vp.width; canvas.height = vp.height;
          canvas.style.cssText = "width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);margin-bottom:10px";
          const cap = document.createElement("div");
          cap.style.cssText = "font-size:11px;color:rgba(255,255,255,.45);margin:0 0 4px 2px;font-weight:700;letter-spacing:.5px";
          cap.textContent = (labels && labels[i - 1]) || (i === 1 ? "SHEET SIDE 1 — FRONT" : "SHEET SIDE 2 — BACK");
          if (!cancelled) { holder.appendChild(cap); holder.appendChild(canvas); }
          await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        }
      } catch (e) { holder.innerHTML = '<div style="color:#f87171;font-size:12px">Preview render failed: ' + e.message + '</div>'; }
    })();
    return () => { cancelled = true; };
  }, [bytes]);
  return <div ref={holderRef} />;
}

function dlBytes(bytes, name) {
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ── WP-admin queue (only rendered when PPS_IMPOSE_CFG is injected) ──
function ajax(action, params, opts) {
  const fd = new FormData();
  fd.append("action", action);
  fd.append("nonce", CFG.nonce);
  Object.entries(params || {}).forEach(([k, v]) => fd.append(k, v));
  return fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin", ...(opts || {}) });
}

// Surface the endpoint's real reason on failure: try the JSON error message
// first (wp_send_json_error), fall back to the HTTP status.
async function ajaxFail(r, what) {
  let msg = "";
  try { const j = await r.json(); msg = (j && j.data && j.data.message) || ""; } catch (e) { /* not JSON */ }
  return new Error(`${what} failed (HTTP ${r.status}${msg ? ": " + msg : ""})`);
}

// Row → engine spec: single source for both the per-row Impose flow and the
// bulk "Impose all pending" path. For saddle, width×height (spine = height)
// is recovered from size_label, falling back to bind_dir orientation.
function specFromRow(row) {
  let w = row.long_edge, h = row.short_edge;
  if (row.calc === "saddle") {
    const m = String(row.size_label || "").match(/([\d.]+)\s*[×x]\s*([\d.]+)/);
    if (m) { w = +m[1]; h = +m[2]; }
    else if (row.bind_dir !== "short") { w = row.short_edge; h = row.long_edge; }
  }
  return {
    calc: row.calc, trimLong: w, trimShort: h,
    sides: row.sides || 1, qty: row.qty || 0,
    sheetFlip: "short", backRotate: "auto",
    jobName: row.job_name || row.product || "",
    orderRef: String(row.order_id), itemRef: String(row.item_id || ""),
    marks: true, allowBestFit: false,
  };
}

function rowPending(r) {
  return !r.imposed && r.files_listed && r.calc && r.long_edge && r.short_edge
    && r.art_file_id && !UNSUPPORTED_BOOKLETS.includes(r.calc);
}

function OrderQueue({ rows, err, onLoad, busyId, onStatus, onHide, rowBusy }) {
  const STATUSES = (CFG && CFG.orderStatuses) || {};
  if (err) return <div style={{ color: "#f87171", fontSize: 13 }}>Order list failed: {err}</div>;
  if (!rows) return <div style={{ color: "rgba(255,255,255,.4)", fontSize: 13 }}>Loading orders…</div>;
  if (!rows.length) return <div style={{ color: "rgba(255,255,255,.4)", fontSize: 13 }}>No recent orders with Drive artwork found.</div>;
  return (
    <table className="imp-q">
      <thead><tr><th>Order</th><th>Job</th><th>Spec</th><th>Artwork</th><th>Imposition</th><th>Order status</th><th></th></tr></thead>
      <tbody>
        {rows.map(r => {
          const key = r.order_id + ":" + r.item_id;
          const specOk = r.calc && r.long_edge && r.short_edge;
          const artOk = !!(r.art_file_id);
          const bookish = UNSUPPORTED_BOOKLETS.includes(r.calc);
          const driveErr = !r.files_listed; // Drive listing failed ≠ empty folder
          const orderBusy = rowBusy === String(r.order_id);
          return (
            <tr key={key}>
              <td><a href={r.folder_url} target="_blank" rel="noreferrer" style={{ color: "#7ab8ff" }}>#{r.order_id}</a></td>
              <td style={{ maxWidth: 180, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.job_name || r.product || "—"}</td>
              <td style={{ fontSize: 12 }}>{r.calc || "?"} · {r.long_edge}×{r.short_edge}″ · {r.calc === "saddle" ? "booklet" : r.sides === 2 ? "2-sided" : "1-sided"} · qty {r.qty}</td>
              <td style={{ fontSize: 12 }}>{artOk ? r.art_file_name : <span style={{ color: "#f87171" }}>{driveErr ? "Drive list failed" : "none found"}</span>}</td>
              <td>{driveErr ? <span className="imp-badge err">DRIVE ERROR</span>
                : r.imposed ? <span className="imp-badge ok">IMPOSED</span>
                : bookish ? <span className="imp-badge warn">{r.calc.toUpperCase()} — v2</span>
                : !specOk ? <span className="imp-badge warn">NO SPEC</span>
                : !artOk ? <span className="imp-badge err">NO ART</span>
                : <span className="imp-badge warn">PENDING</span>}
                {r.hidden && <span className="imp-badge" style={{ marginLeft: 5, background: "#3a3f4a" }}>HIDDEN</span>}</td>
              {/* Order status is a property of the ORDER, so the control repeats
                  on every line item of a multi-item order and changing it from
                  any of them updates them all. */}
              <td>
                <select value={"wc-" + r.status} disabled={orderBusy}
                        style={{ fontSize: 12, padding: "3px 4px", maxWidth: 150 }}
                        onChange={e => onStatus(r, e.target.value.replace(/^wc-/, ""))}>
                  {Object.entries(STATUSES).map(([k, label]) => <option key={k} value={k}>{label}</option>)}
                  {!STATUSES["wc-" + r.status] && <option value={"wc-" + r.status}>{r.status_label || r.status}</option>}
                </select>
              </td>
              <td style={{ whiteSpace: "nowrap" }}>{specOk && artOk && !bookish &&
                <button className="imp-btn sec" style={{ padding: "6px 12px", fontSize: 12 }}
                  disabled={busyId === key} onClick={() => onLoad(r)}>
                  {busyId === key ? "Working…" : r.imposed ? "Re-impose" : "Impose"}
                </button>}
                <button className="imp-btn sec" title={r.hidden ? "Put this order back on the queue" : "Park this order — visibility only, nothing about the order changes"}
                  style={{ padding: "6px 9px", fontSize: 12, marginLeft: 6 }}
                  disabled={orderBusy} onClick={() => onHide(r, !r.hidden)}>
                  {orderBusy ? "…" : r.hidden ? "Unhide" : "Hide"}
                </button></td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}
