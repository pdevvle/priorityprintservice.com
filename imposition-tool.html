  const [multiMode, setMultiMode] = useState("repeat");    // multipage flat files: repeat | gang | stack
  const isSaddle = calc === "saddle";
  const isPB = calc === "perfect-bound";   // two press jobs, so no single live layout
  const isBound = isBoundCalc(calc);       // size boxes are width × height; orientation is part of the spec
  const isBook = isBookCalc(calc);         // one reading-order document, always duplex, qty = books
  const [art, setArt] = useState(null);      // { bytes, name, pageCount }
  // Trim as MEASURED off the dropped file, kept in the file's own orientation.
  // Saddle reads the two size boxes as width × height (the spine is the height
  // edge); every other calc reads them as long × short. So the same numbers
  // mean different things per calc, and dropping a file before choosing the
  // product left a portrait booklet described as landscape — silently, because
  // the long/short pair is identical either way. Re-orient on every switch.
  const [detTrim, setDetTrim] = useState(null);
  const [backArt, setBackArt] = useState(null);
  const [result, setResult] = useState(null); // { bytes, layout, warnings, sheets, filename }
  const [busy, setBusy] = useState(false);
  const [queueBusy, setQueueBusy] = useState(null);
  const [refreshKey, setRefreshKey] = useState(0);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [uploadState, setUploadState] = useState({});     // per output filename: "uploading" | "done" | "failed: …"
  const [activeOrder, setActiveOrder] = useState(null);   // queue row currently loaded
  const [rows, setRows] = useState(null);                  // admin queue rows (WP mode)
  const [queueErr, setQueueErr] = useState("");
  const [bulkState, setBulkState] = useState(null);        // { done, total, current, failures[] }
  const [showHidden, setShowHidden] = useState(false);     // widen the queue to completed + parked orders
  const [rowBusy, setRowBusy] = useState("");              // order id whose status/hide call is in flight
  // Row-action failures get their OWN slot. queueErr replaces the whole table
  // (it means "the list could not load"), so reporting a failed status change
  // through it wiped the queue the operator was working from.
  const [actionErr, setActionErr] = useState("");
  const [refOpen, setRefOpen] = useState(false);           // metadata reference panel
  // 1.33 layout: which accordion sections are open, the sheet viewport, and
  // the two specialty features.
  const [secOpen, setSecOpen] = useState({ general: true, layout: true, product: true, bleed: false, specialty: false, marks: false });
  const toggleSec = k => setSecOpen(o => ({ ...o, [k]: !o[k] }));
  const [queueOpen, setQueueOpen] = useState(true);
  const [zoom, setZoom] = useState(null);                  // px per inch; null = fit two sheets
  const [rulers, setRulers] = useState(true);
  const [viewPart, setViewPart] = useState(0);             // perfect bound: which part the viewport shows
  const [greyPagesTxt, setGreyPagesTxt] = useState("");    // force greyscale on these source pages
  const [splitSpreads, setSplitSpreads] = useState(false); // cut 2-page reader spreads into single pages
  const [slipOn, setSlipOn] = useState(false);
  const [slipWhen, setSlipWhen] = useState("before");
  const [slipSheets, setSlipSheets] = useState("");
  const [slipDesign, setSlipDesign] = useState("K");       // C | M | Y | K | custom
  const [slipCustom, setSlipCustom] = useState(null);      // { bytes, name }
  const genSeq = useRef(0);

  // Fetch the order queue (WP mode only)
  useEffect(() => {
    if (!CFG) return;
    let dead = false;
    setQueueErr("");
    ajax("pps_impose_list", { ...(refreshKey > 0 ? { refresh: 1 } : {}), ...(showHidden ? { show_hidden: 1 } : {}) })
      .then(async r => { if (!r.ok) throw await ajaxFail(r, "order list"); return r.json(); })
      .then(j => {
        if (dead) return;
        if (!j.success) throw new Error((j.data && j.data.message) || "list failed");
        setRows(j.data.items);
      })
      .catch(e => !dead && setQueueErr(e.message));
    return () => { dead = true; };
  }, [refreshKey, showHidden]);

  // ── Order status / visibility, straight from the queue ────────────────────
  // Both act on the ORDER, so every row sharing that order_id updates. A row
  // that leaves the work list (completed, or parked) is dropped from the view
  // unless "show completed & hidden" is on — the queue is a work list, and a
  // finished job staying on it is how things get imposed twice.
  const applyToOrder = (orderId, fn) =>
    setRows(rs => (rs || []).map(r => (r.order_id === orderId ? fn(r) : r)));
  const dropOrder = orderId =>
    setRows(rs => (rs || []).filter(r => r.order_id !== orderId));

  async function setOrderStatus(row, status) {
    if (status === row.status) return;
    const label = (CFG.orderStatuses || {})["wc-" + status] || status;
    if (!window.confirm(
      `Move order #${row.order_id} to "${label}"?\n\n` +
      `This changes the order's status and is recorded in the order notes. ` +
      `It is SILENT — no customer email is sent, and nothing else hooked on the ` +
      `status transition runs. Use the order screen if the customer should be emailed.`)) return;
    setRowBusy(String(row.order_id));
    try {
      const r = await ajax("pps_impose_set_status", { order_id: row.order_id, status });
      if (!r.ok) throw await ajaxFail(r, "status change");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "status change failed");
      const d = j.data;
      if (d.done && !showHidden) { dropOrder(row.order_id); setNotice(`Order #${row.order_id} → ${d.label}. Off the queue.`); }
      else { applyToOrder(row.order_id, r2 => ({ ...r2, status: d.status, status_label: d.label })); setNotice(`Order #${row.order_id} → ${d.label}.`); }
      setActionErr("");
    } catch (e) { setActionErr(`Order #${row.order_id}: ${e.message}`); }
    finally { setRowBusy(""); }
  }

  async function setOrderHidden(row, hidden) {
    setRowBusy(String(row.order_id));
    try {
      const r = await ajax("pps_impose_set_hidden", { order_id: row.order_id, hidden: hidden ? 1 : 0 });
      if (!r.ok) throw await ajaxFail(r, hidden ? "hide" : "unhide");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "hide failed");
      if (hidden && !showHidden) { dropOrder(row.order_id); setNotice(`Order #${row.order_id} hidden. Tick “show completed & hidden” to bring it back.`); }
      else { applyToOrder(row.order_id, r2 => ({ ...r2, hidden })); }
      setActionErr("");
    } catch (e) { setActionErr(`Order #${row.order_id}: ${e.message}`); }
    finally { setRowBusy(""); }
  }

  useEffect(() => {
    if (!detTrim || activeOrder) return;
    // Bound products read the boxes as width × height (the spine is the height
    // edge); everything else reads them as long × short. Normalising a bound
    // job to long/short is what silently turned a 5.5×8.5 book into an 8.5×5.5
    // one — the saddle trap of v1.21, which perfect bound inherited when it
    // arrived in v1.27 because this line only tested isSaddle. It now tests the
    // property (isBound) so the next bound product cannot repeat it.
    if (isBound) { setTrimLong(detTrim.w); setTrimShort(detTrim.h); }
    else { setTrimLong(Math.max(detTrim.w, detTrim.h)); setTrimShort(Math.min(detTrim.w, detTrim.h)); }
  }, [isBound, detTrim, activeOrder]);

  const spec = useMemo(() => ({
    calc, trimLong: +trimLong || 0, trimShort: +trimShort || 0,
    sides: isBook ? 2 : +sides, qty: +qty || 0, sheetFlip,
    backRotate: backRotate === "auto" ? "auto" : +backRotate,
    jobName, orderRef, itemRef, marks, foldMarks, slug: slugOn, allowBestFit,
    sheet: sheetSel, sheetLong: +sheetLong || 0, sheetShort: +sheetShort || 0, sheetMargin: +sheetMargin,
    efficient, gutter: gutterMode === "auto" ? null : +gutterMode,
    offsetMode, offsetRight: +offsetRight, offsetBottom: +offsetBottom,
    pattern, manualPattern: pattern === "manual" ? manualPattern : null, forceRotated,
    bleed: +bleedIn, multiMode: isBook ? null : multiMode, addBleed, addBleedSmart, streakEps: +streakEps, artInset: +artInset || 0, artScale: +artScale || 100, creep: +creep || 0,
    addBleedPages: Object.keys(addBleedPages).length ? addBleedPages : null,
    saddleColGaps: gapCols, saddleRowGaps: gapRows, saddleFillSheet: gapFill,
    colGaps: gapCols, rowGaps: gapRows, fillSheet: gapFill,
    gridAcross: gridOn ? +gridAcross || 0 : null,
    gridDown: gridOn ? +gridDown || 0 : null,
    gridSheet: !isSaddle && gridOn && gridSheet !== "auto" ? gridSheet : null,
    sigRepeat: isSaddle && repOn && !gridOn ? +repN || 0 : null,
    sigOrder: isSaddle ? sigOrder : null,
    spine: isPB ? +spine || 0 : null,
    pbPart: isPB ? pbPart : null,
    pbGutsOrder: isPB ? pbGutsOrder : null,
    greyPages: greyPagesTxt.trim() || null,
    splitSpreads,
    slip: slipOn ? { on: true, when: slipWhen, sheets: slipSheets, design: slipDesign,
                     customBytes: slipCustom && slipCustom.bytes, customName: slipCustom && slipCustom.name } : null,
    // Per-half layout controls. Shaped for the engine (pbPartOverrides), which
    // ignores anything null, so a half the operator never touched behaves
    // exactly as it did before these controls existed.
    pbGrid: isPB ? { cover: pbGridSpec(pbGrids.cover), guts: pbGridSpec(pbGrids.guts) } : null,
  }), [calc, trimLong, trimShort, sides, qty, sheetFlip, backRotate, jobName, orderRef, itemRef, marks, foldMarks, slugOn, allowBestFit,
       sheetSel, sheetLong, sheetShort, sheetMargin,
       efficient, gutterMode, offsetMode, offsetRight, offsetBottom, pattern, manualPattern, forceRotated, bleedIn, multiMode, addBleed, addBleedSmart, streakEps, artInset, artScale, creep, addBleedPages,
       gapCols, gapRows, gapFill, isSaddle, isBook, gridOn, gridAcross, gridDown, gridSheet, repOn, repN, sigOrder, spine, isPB, pbPart, pbGutsOrder, pbGrids, greyPagesTxt, splitSpreads, slipOn, slipWhen, slipSheets, slipDesign, slipCustom]);
  const debSpec = useDebounced(spec, 450);

  // Live layout (no artwork needed) — schematic + parity badge
  const layoutInfo = useMemo(() => {
    try {
      if (!(debSpec.trimLong >= 2 && debSpec.trimShort >= 2)) return { error: "Enter trim size (min 2″)" };
      // Perfect bound has no single layout — it images as two press jobs on
      // different stock, so it gets two. Both are computed here from the spec
      // alone (no artwork), which is what lets the grid/gutter panel show live
      // block-vs-sheet feedback for each half before a file is ever dropped.
      // A half that refuses keeps its error beside it rather than blanking the
      // panel: the control that caused it must stay reachable to undo.
      if (debSpec.calc === "perfect-bound") {
        const sp = +debSpec.spine;
        if (debSpec.pbPart !== "guts") {          // the spine only affects the cover
          if (!isFinite(sp) || sp <= 0) return { error: "Enter the spine width (inches) — measure the glued book block." };
          if (sp > 3) return { error: `Spine ${sp}″ is beyond the 3″ limit — check the value is inches, not millimetres.` };
        }
        const piece = pbPieces(debSpec.trimLong, debSpec.trimShort, debSpec.pbPart === "guts" ? 0 : sp);
        const half = (part, calcKey) => {
          const sub = Object.assign({}, debSpec, {
            calc: calcKey, trimLong: piece[part].long, trimShort: piece[part].short,
            manualGrid: null, gridAcross: null, gridDown: null, gridSheet: null,
            colGaps: null, rowGaps: null, fillSheet: null,
          }, pbPartOverrides(debSpec, part));
          try {
            return { layout: computeLayout(calcKey, sub.trimLong, sub.trimShort, layoutOpts(sub)) };
          } catch (e) { return { error: e.message }; }
        };
        return {
          pb: true,
          pbLayouts: {
            cover: debSpec.pbPart === "guts" ? null : half("cover", "pb-cover"),
            guts:  debSpec.pbPart === "cover" ? null : half("guts", "pb-guts"),
          },
        };
      }
      return { layout: computeLayout(debSpec.calc, debSpec.trimLong, debSpec.trimShort, layoutOpts(debSpec)) };
    } catch (e) { return { error: e.message }; }
  }, [debSpec]);

  // Auto-regenerate the imposed PDF when spec or art changes
  useEffect(() => {
    const ganging = gangFiles.length >= 2;
    if ((!art && !ganging) || (!layoutInfo.layout && !layoutInfo.pb)) { setResult(null); return; }
    const seq = ++genSeq.current;
    setBusy(true); setError(""); setUploadState({});
    imposePdf(art ? art.bytes : null, (debSpec.calc === "perfect-bound" || debSpec.sides === 2) ? (backArt && backArt.bytes) : null, debSpec,
              ganging ? gangFiles.map(g => ({ bytes: g.bytes, name: g.name, slots: g.slots === "" ? null : +g.slots })) : null)
      .then(res => {
        if (seq !== genSeq.current) return;
        // An approval mismatch travels on the filename so the flag survives
        // into the Drive folder and the press room, not just this screen.
        const unappr = art && art.approval && art.approval.state === "mismatch";
        const flagIt = n => unappr ? n.replace(/\.pdf$/i, "_UNAPPROVED.pdf") : n;
        // Perfect bound returns two parts, each with its own layout and its own
        // filename — the COVER and GUTS suffixes keep them apart in the order's
        // Drive folder and in the queue's IMPOSED detection.
        if (res.parts) {
          res.parts.forEach(pt => {
            pt.filename = flagIt(imposedFilename({ ...debSpec, jobName: (debSpec.jobName || "book") + "_" + pt.part.toUpperCase() }, pt.layout));
          });
        } else {
          res.filename = flagIt(imposedFilename(debSpec, res.layout));
        }
        setResult(res);
      })
      .catch(e => { if (seq === genSeq.current) { setResult(null); setError(e.message); } })
      .finally(() => { if (seq === genSeq.current) setBusy(false); });
  }, [art, backArt, gangFiles, debSpec, layoutInfo.layout ? 1 : 0]);

  const makeCleanCopy = async () => {
    if (!art) return;
    setCleanBusy(true); setError("");
    try {
      const res = await sanitizePdf(art.bytes);
      dlBytes(res.bytes, "CLEAN_" + art.name.replace(/\.pdf$/i, "") + ".pdf");
      setNotice(res.threats.length
        ? `CLEAN copy downloaded — stripped: ${res.threats.join("; ")}`
        : "CLEAN copy downloaded — no active content found; sanitized anyway.");
    } catch (e) { setError("Sanitize failed: " + e.message); }
    setCleanBusy(false);
  };

  const sendCleanToDrive = async () => {
    if (!art || !activeOrder || !CFG) return;
    setCleanBusy(true); setError("");
    try {
      const res = await sanitizePdf(art.bytes);
      const base = art.name.replace(/\.pdf$/i, "").replace(/[^\w.-]+/g, "_").slice(0, 80);
      const fname = `CLEAN_Order-${activeOrder.order_id}${activeOrder.item_id ? "-i" + activeOrder.item_id : ""}_${base}.pdf`;
      const fd = new FormData();
      fd.append("action", "pps_impose_upload");
      fd.append("nonce", CFG.nonce);
      fd.append("order_id", activeOrder.order_id);
      fd.append("filename", fname);
      fd.append("file", new Blob([res.bytes], { type: "application/pdf" }), fname);
      const r = await fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin" });
      if (!r.ok) throw await ajaxFail(r, "upload");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "upload failed");
      setNotice(`CLEAN copy filed to order #${activeOrder.order_id}'s Drive folder as ${fname}` +
                (res.threats.length ? ` — stripped: ${res.threats.join("; ")}` : " — no active content found."));
    } catch (e) { setError("CLEAN upload failed: " + e.message); }
    setCleanBusy(false);
  };

  const addGangFiles = async files => {
    const added = [];
    for (const f of files) {
      if (!/\.pdf$/i.test(f.name)) { setError(`"${f.name}" is not a PDF`); continue; }
      const bytes = new Uint8Array(await f.arrayBuffer());
      let pageCount = 0;
      try { pageCount = (await loadPdf(bytes, f.name)).getPageCount(); }
      catch (e) { setError(`"${f.name}" could not be parsed as a PDF: ` + e.message); continue; }
      added.push({ bytes, name: f.name, pageCount, slots: "" });
    }
    if (added.length) setGangFiles(prev => [...prev, ...added]);
  };

  const onFiles = async (files, slot) => {
    setError("");
    for (const f of files) {
      if (/\.txt$/i.test(f.name)) {
        const t = await f.text();
        const m = parseManifest(t);
        // Bound products keep width × height as-is (spine = height edge);
        // flats normalise. A booklet manifest that does not name its binding
        // is still a bound product, so its orientation is kept either way.
        const bound = m.calc ? isBoundCalc(m.calc) : (m.book || isBoundCalc(calc));
        if (m.trimLong) {
          if (bound) { setTrimLong(m.rawW); setTrimShort(m.rawH); }
          else { setTrimLong(m.trimLong); setTrimShort(m.trimShort); }
        }
        if (m.calc) setCalc(m.calc);
        if (m.sides) setSides(m.sides);
        if (m.jobName && !jobName) setJobName(m.jobName);
        setNotice(m.book && !m.calc && !isBookCalc(calc)
          ? `Manifest ${f.name} is for a bound product but does not say which binding — choose Saddle stitch or Perfect bound; the page size has been kept as width × height.`
          : "Spec autofilled from manifest: " + f.name);
        continue;
      }
      if (!/\.pdf$/i.test(f.name)) { setError(`"${f.name}" is not a PDF — the imposition input must be the print-ready or raw PDF.`); continue; }
      const bytes = new Uint8Array(await f.arrayBuffer());
      let pageCount = 0, det = null, threats = [];
      try {
        const doc = await loadPdf(bytes, f.name);
        pageCount = doc.getPageCount();
        try { det = detectTrim(doc, +bleedIn); } catch (e2) { /* detection is best-effort */ }
        try { threats = inspectPdfThreats(doc); } catch (e3) { threats = ["threat inspection failed — treat with care"]; }
      }
      catch (e) { setError(`"${f.name}" could not be parsed as a PDF: ` + e.message); continue; }
      // A manual drop while a hash-bound order is active goes through the same
      // approval check as a queue load — otherwise dragging in any file was a
      // silent bypass that still produced a clean output filename.
      const appr = slot === "back" ? null
        : await approvalState(bytes, activeOrder && activeOrder.proof_hash);
      if (slot === "back") setBackArt({ bytes, name: f.name, pageCount, threats });
      else {
        setArt({ bytes, name: f.name, pageCount, threats, approval: appr });
        const aNote = approvalNote(appr, f.name, activeOrder && activeOrder.order_id);
        if (aNote) setNotice(aNote);
        setDetTrim(det ? { w: det.w, h: det.h } : null);
        setAddBleedPages({}); // per-page overrides belong to the previous file
        if (!jobName) setJobName(f.name.replace(/\.pdf$/i, ""));
        if (det) {
          const specL = Math.max(+trimLong || 0, +trimShort || 0), specS = Math.min(+trimLong || 0, +trimShort || 0);
          const detL = Math.max(det.w, det.h), detS = Math.min(det.w, det.h);
          const differs = Math.abs(detL - specL) > 0.03 || Math.abs(detS - specS) > 0.03;
          // For saddle the ORIENTATION is part of the spec — the spine sits on
          // the height edge — and a swap has the same long/short pair, so
          // `differs` cannot see it. Check it separately or a landscape entry
          // sails through and every page prints sideways.
          const flipped = isBound && !differs
            && Math.abs(det.w - det.h) > 0.03
            && ((+trimShort > +trimLong) !== (det.h > det.w));
          if (activeOrder) {
            // order spec is authoritative — but flag a measurement conflict loudly
            if (differs) setNotice(aNote + `⚠ "${f.name}" measures ${det.w}×${det.h}″ (${det.method}) but the order spec is ${specL}×${specS}″ — check that this is the right file/spec before printing.`);
            else if (flipped) setNotice(aNote + `⚠ "${f.name}" is ${det.w}×${det.h}″ (${det.h > det.w ? "portrait" : "landscape"}) but the order spec reads ${trimLong}×${trimShort}″ — this product binds on the height edge, so imposing as-is would turn every page 90°. Swap the page width/height before printing.`);
          } else {
            if (isBound) { setTrimLong(det.w); setTrimShort(det.h); }   // bound: width × height
            else { setTrimLong(detL); setTrimShort(detS); }
            setNotice(`Trim auto-detected: ${det.w}×${det.h}″ (${det.method}).` + (pageCount > (sides === 2 ? 2 : 1) && !isBook ? ` File has ${pageCount} pages — set "Multi-page file" to gang or cut & stack if they're different pieces.` : ""));
          }
        }
        // A 2-page file usually means front+back — switch, but say so, since
        // page 2 could also be notes/a proof sheet the operator must exclude.
        if (pageCount >= 2 && sides === 1 && !isBook) {
          setSides(2);
          setNotice(aNote + `"${f.name}" has ${pageCount} pages — switched to 2-sided (page 1 = front, page 2 = back). Set Sides back to 1 if page 2 isn't the back.`);
        }
      }
    }
  };

  // ── WP queue: load an order row, fetch its artwork, impose ──
  const loadOrder = async (row) => {
    const key = row.order_id + ":" + row.item_id;
    setQueueBusy(key); setError(""); setNotice(""); setUploadState({});
    try {
      const s = specFromRow(row);
      setItemRef(s.itemRef); setCalc(s.calc);
      setTrimLong(s.trimLong); setTrimShort(s.trimShort);
      setSides(s.sides); setQty(s.qty);
      setJobName(s.jobName); setOrderRef(s.orderRef);
      setActiveOrder(row);
      const r = await ajax("pps_impose_download", { file_id: row.art_file_id });
      if (!r.ok) throw await ajaxFail(r, "artwork download");
      const bytes = new Uint8Array(await r.arrayBuffer());
      // Approval binding — checked before anything is staged so the operator
      // sees the verdict on the same screen as the artwork. Advisory only: a
      // mismatch still loads, it just travels flagged.
      const appr = await approvalState(bytes, row.proof_hash);
      const doc = await loadPdf(bytes, row.art_file_name || "artwork");
      const pageCount = doc.getPageCount();
      let threats = [];
      try { threats = inspectPdfThreats(doc); } catch (e3) { threats = ["threat inspection failed — treat with care"]; }
      setArt({ bytes, name: row.art_file_name, pageCount, threats, approval: appr });
      setAddBleedPages({});
      setBackArt(null);
      let note = `Loaded order #${row.order_id} artwork (${row.art_file_name}, ${pageCount} page${pageCount === 1 ? "" : "s"}). Review the preview, then Send to Drive.`;
      if (appr.state === "verified") note = `✓ Approval hash verified — byte-for-byte the file the customer approved. ` + note;
      else note = approvalNote(appr, row.art_file_name, row.order_id) + note;
      try {
        const det = detectTrim(doc, +bleedIn);
        const specL = Math.max(s.trimLong, s.trimShort), specS = Math.min(s.trimLong, s.trimShort);
        if (Math.abs(Math.max(det.w, det.h) - specL) > 0.03 || Math.abs(Math.min(det.w, det.h) - specS) > 0.03) {
          note = `⚠ Artwork measures ${det.w}×${det.h}″ (${det.method}) but order #${row.order_id} is specced ${specL}×${specS}″ — verify before printing. ` + note;
        }
      } catch (e2) { /* best-effort */ }
      setNotice(note);
    } catch (e) { setError(e.message); }
    finally { setQueueBusy(null); }
  };

  // The upload goes through admin-ajax as a normal form POST, so PHP's
  // post_max_size / upload_max_filesize apply. Past them PHP drops the whole
  // POST — nonce included — and the endpoint answers "Unauthorized", which is
  // the wrong diagnosis. PHP tells the tool its limit (CFG.maxUpload); check
  // here and say the real reason.
  const overUploadLimit = bytes => CFG && CFG.maxUpload > 0 && bytes.length > CFG.maxUpload
    ? `${(bytes.length / 1048576).toFixed(1)} MB is over the server's ${(CFG.maxUpload / 1048576).toFixed(0)} MB upload limit (PHP upload_max_filesize / post_max_size). Download it and file it to Drive by hand, or raise the limit in the hosting panel.`
    : null;
  const sendToDrive = async (res) => {
    const over = overUploadLimit(res.bytes);
    if (over) { setUploadState(u => ({ ...u, [res.filename]: "failed: " + over })); setError(over); return; }
    if (!res || !activeOrder) return;
    const mark = v => setUploadState(u => ({ ...u, [res.filename]: v }));
    mark("uploading");
    try {
      const fd = new FormData();
      fd.append("action", "pps_impose_upload");
      fd.append("nonce", CFG.nonce);
      fd.append("order_id", activeOrder.order_id);
      fd.append("filename", res.filename);
      fd.append("file", new Blob([res.bytes], { type: "application/pdf" }), res.filename);
      const r = await fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin" });
      if (!r.ok) throw await ajaxFail(r, "upload");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "upload failed");
      mark("done");
      setNotice(`Imposed PDF filed to the order #${activeOrder.order_id} Drive folder as ${res.filename}.`);
      setRefreshKey(k => k + 1);
    } catch (e) { mark("failed: " + e.message); }
  };

  // Bulk: impose + file every pending row, sequentially, headless (does not
  // touch the form). Each row uses the exact spec the per-row flow would.
  const imposeAll = async () => {
    const pending = (rows || []).filter(rowPending);
    if (!pending.length) return;
    setBulkState({ done: 0, total: pending.length, current: "", failures: [] });
    const failures = [];
    const advisories = [];   // imposed, but the operator must be told (approval mismatches)
    for (let i = 0; i < pending.length; i++) {
      const row = pending[i];
      const label = `#${row.order_id} ${row.job_name || row.product || ""}`.trim();
      setBulkState({ done: i, total: pending.length, current: label, failures });
      try {
        const s = specFromRow(row);
        const r = await ajax("pps_impose_download", { file_id: row.art_file_id });
        if (!r.ok) throw await ajaxFail(r, "artwork download");
        const bytes = new Uint8Array(await r.arrayBuffer());
        // Bulk imposes a mismatched file like any other, but never quietly:
        // the output carries UNAPPROVED and the row is listed in the summary
        // so a headless run can't bury an unapproved file in the Drive folder.
        const appr = await approvalState(bytes, row.proof_hash);
        if (appr.state === "mismatch") {
          advisories.push(`${label}: APPROVAL MISMATCH — imposed and filed as UNAPPROVED (${appr.got.slice(0, 12)}… vs approved ${appr.want.slice(0, 12)}…).`);
        } else if (appr.state === "unverifiable") {
          advisories.push(`${label}: carries an approval hash but this page cannot verify it (no crypto.subtle — is wp-admin on HTTPS?).`);
        }
        const res = await imposePdf(bytes, null, s);
        let filename = imposedFilename(s, res.layout);
        if (appr.state === "mismatch") filename = filename.replace(/\.pdf$/i, "_UNAPPROVED.pdf");
        const fd = new FormData();
        fd.append("action", "pps_impose_upload");
        fd.append("nonce", CFG.nonce);
        fd.append("order_id", row.order_id);
        fd.append("filename", filename);
        fd.append("file", new Blob([res.bytes], { type: "application/pdf" }), filename);
        const up = await fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin" });
        if (!up.ok) throw await ajaxFail(up, "upload");
        const j = await up.json();
        if (!j.success) throw new Error((j.data && j.data.message) || "upload failed");
      } catch (e) {
        failures.push(`${label}: ${e.message}`);
      }
    }
    setBulkState({ done: pending.length, total: pending.length, current: "", failures });
    setNotice(`Bulk impose finished: ${pending.length - failures.length}/${pending.length} filed to Drive.`
      + (advisories.length ? ` ⚠ ${advisories.length} need${advisories.length === 1 ? "s" : ""} attention:\n` + advisories.join("\n") : "")
      + (failures.length ? " Failures listed below." : ""));
    setError(failures.join("\n"));
    setRefreshKey(k => k + 1);
  };

  const pendingCount = (rows || []).filter(rowPending).length;

  const lay = layoutInfo.layout;
  const parityOk = lay && !lay.mismatch && !lay.efficient && !lay.fillSheet && !lay.manualGrid && (lay.booklet
    ? (lay.pricedImp < 2 || lay.imp === lay.pricedImp)   // imp:1 presets legitimately move to the 27.5 sheet
    : lay.imp === Math.round(lay.pricedImp));

  const partsOut = result ? (result.parts || [result]) : [];
  const viewIdx = Math.min(viewPart, Math.max(0, partsOut.length - 1));
  const viewRes = partsOut[viewIdx] || null;
  const viewLay = viewRes ? viewRes.layout
    : isPB && layoutInfo.pbLayouts ? ((layoutInfo.pbLayouts[viewIdx === 1 ? "guts" : "cover"] || layoutInfo.pbLayouts.cover || layoutInfo.pbLayouts.guts || {}).layout || null)
    : lay;
  const parityBadge = lay ? (lay.booklet
    ? (lay.stepRepeat ? <span className={"imp-badge " + (lay.imp === Math.round(lay.pricedImp) ? "ok" : "warn")}>STEP &amp; REPEAT {lay.stepRepeat}× — PRICED {lay.pricedImp} PAGES/SIDE</span>
      : lay.manualGrid ? <span className={"imp-badge " + (lay.imp === Math.round(lay.pricedImp) ? "ok" : "warn")}>MANUAL {lay.booklet.spreadsPerSide}/SIDE — PRICED {lay.pricedImp} PAGES/SIDE</span>
      : lay.efficient ? <span className="imp-badge ok">13×27.5 EFFICIENT — PRICED {lay.pricedImp}/SIDE</span>
      : lay.fillSheet ? <span className="imp-badge warn">FULL-SHEET FILL — PAST IMAGEABLE AREA</span>
      : <span className={"imp-badge " + (parityOk ? "ok" : "err")}>{parityOk ? "MATCHES PRICED IMP" : `MISMATCH — PRICED ${lay.pricedImp}/SIDE`}</span>)
    : (lay.manualGrid ? <span className={"imp-badge " + (lay.imp === Math.round(lay.pricedImp) ? "ok" : "warn")}>MANUAL GRID {lay.across}×{lay.down} — PRICED {lay.pricedImp}-UP</span>
      : lay.efficient ? <span className={"imp-badge " + (lay.imp >= lay.pricedImp ? "ok" : "warn")}>13×27.5 EFFICIENT — PRICED {lay.pricedImp}-UP/13×19</span>
      : <span className={"imp-badge " + (parityOk ? "ok" : "err")}>{parityOk ? "MATCHES PRICED IMP" : `MISMATCH — PRICED ${lay.pricedImp}-UP`}</span>)) : null;
  const sheetSummary = lay ? (lay.booklet
    ? `${lay.sheet.label} · spreads ${lay.across} × ${lay.down}${lay.rotated ? " (rot)" : ""} = ${lay.booklet.spreadsPerSide}/side · gutter ${lay.gutter}″`
    : `${lay.sheet.label} · grid ${lay.across} × ${lay.down}${lay.rotated ? " (rot)" : ""} = ${lay.imp}-up · gutter ${lay.gutter}″${spec.qty > 0 ? ` · ${Math.ceil(spec.qty / lay.imp)} sheets` : ""}`) : "";
  const showProduct = isPB || !isSaddle;
  const fitCount = 2;

  return (
    <div className="imp-app">
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 10, flexWrap: "wrap" }}>
        <h1 style={{ fontSize: 18, margin: 0 }}>🖨️ PPS Imposition Tool</h1>
        <span style={{ fontSize: 12, color: "rgba(255,255,255,.4)" }}>
          vector-preserving sheetwise step-and-repeat · {CFG ? "connected to WooCommerce + Google Drive" : "standalone mode (drag & drop)"}
        </span>
        <button className="imp-btn sec" style={{ padding: "4px 11px", fontSize: 12, marginLeft: "auto" }}
                onClick={() => setRefOpen(v => !v)} aria-expanded={refOpen}>
          {refOpen ? "− " : "+ "}Order metadata reference
        </button>
      </div>
      {refOpen && <MetaRef onClose={() => setRefOpen(false)} />}

      <div className="imp-shell">
        {/* ══ LEFT — imposition controls (accordion) ══ */}
        <aside className="imp-side">
          <div className="imp-side-h">
            <span>Imposition controls</span>
            <span style={{ fontSize: 11, color: "rgba(255,255,255,.4)", fontWeight: 400 }}>
              <button type="button" className="imp-btn sec" style={{ padding: "2px 8px", fontSize: 11 }}
                      onClick={() => setSecOpen({ general: true, layout: true, product: true, bleed: true, specialty: true, marks: true })}>all</button>{" "}
              <button type="button" className="imp-btn sec" style={{ padding: "2px 8px", fontSize: 11 }}
                      onClick={() => setSecOpen({ general: false, layout: false, product: false, bleed: false, specialty: false, marks: false })}>none</button>
            </span>
          </div>

          <Acc id="general" title="General settings" open={secOpen.general} onToggle={() => toggleSec("general")}>
            <Field label="Product layout type">
              <select value={calc} onChange={e => setCalc(e.target.value)}>
                {CALC_TYPES.map(c => <option key={c.val} value={c.val}>{c.label}</option>)}
              </select>
            </Field>
            <div style={{ display: "flex", gap: 10 }}>
              <Field label={isBound ? "Finished size — page width (in)" : "Finished size — long (in)"} style={{ flex: 1 }}>
                <input type="number" step="0.125" min="2" value={trimLong} onChange={e => setTrimLong(e.target.value)} />
              </Field>
              <Field label={isBound ? "Page height (in) — spine edge" : "Short (in)"} style={{ flex: 1 }}>
                <input type="number" step="0.125" min="2" value={trimShort} onChange={e => setTrimShort(e.target.value)} />
              </Field>
            </div>
            <Field label="Sheet size">
              <select value={sheetSel} onChange={e => setSheetSel(e.target.value)}>
                <option value="auto">Auto — the product's own press sheet</option>
                <option value="13x19">13×19</option>
                <option value="13x27.5">13×27.5 (oversize)</option>
                <option value="12x18">12×18 crack-n-peel</option>
                <option value="custom">Custom size…</option>
              </select>
              {sheetSel === "custom" && (
                <div style={{ display: "flex", gap: 8, alignItems: "flex-end", marginTop: 6, flexWrap: "wrap" }}>
                  <div>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,.45)", marginBottom: 3 }}>Sheet long (in)</div>
                    <input type="number" step="0.25" min="3" max="60" value={sheetLong} style={{ width: 84 }}
                           onChange={e => setSheetLong(e.target.value)} />
                  </div>
                  <span style={{ paddingBottom: 6, color: "rgba(255,255,255,.4)" }}>×</span>
                  <div>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,.45)", marginBottom: 3 }}>Sheet short (in)</div>
                    <input type="number" step="0.25" min="3" max="60" value={sheetShort} style={{ width: 84 }}
                           onChange={e => setSheetShort(e.target.value)} />
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,.45)", marginBottom: 3 }}>Imageable margin (in)</div>
                    <input type="number" step="0.0625" min="0" value={sheetMargin} style={{ width: 96 }}
                           onChange={e => setSheetMargin(e.target.value)} />
                  </div>
                  <div style={{ fontSize: 12, paddingBottom: 6, color: "rgba(255,255,255,.55)" }}>
                    prints {(Math.max(+sheetLong || 0, +sheetShort || 0) - 2 * (+sheetMargin || 0)).toFixed(2)}×
                    {(Math.min(+sheetLong || 0, +sheetShort || 0) - 2 * (+sheetMargin || 0)).toFixed(2)}″
                  </div>
                </div>
              )}
              {sheetSel !== "auto" && (
                <div style={{ fontSize: 11, color: "rgba(255,255,255,.4)", marginTop: 3 }}>
                  Changes the physical sheet only — the priced imp stays what the calculator quoted, so a count that
                  no longer fits is flagged rather than silently changed. Marks and slug follow the new imageable area.
                </div>
              )}
            </Field>

            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <Field label="Duplexed sheets" style={{ flex: "0 0 150px" }}>
                <label style={{ fontSize: 13, display: "flex", gap: 7, alignItems: "center", cursor: isBook ? "default" : "pointer", padding: "8px 0" }}>
                  <input type="checkbox" checked={isBook ? true : sides === 2} disabled={isBook} style={{ width: "auto" }}
                         onChange={e => setSides(e.target.checked ? 2 : 1)} />
                  {isBook ? "always (book)" : sides === 2 ? "2-sided" : "1-sided"}
                </label>
              </Field>
              <Field label={isBook ? "Quantity (books)" : gangFiles.length >= 2 ? "Quantity (press sheets)" : multiMode === "each" ? "Quantity (per piece)" : multiMode !== "repeat" ? "Quantity (per collated set)" : "Quantity"} style={{ flex: 1 }}>
                <input type="number" min="0" value={qty} onChange={e => setQty(e.target.value)} />
              </Field>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Field label="Name" style={{ flex: 1 }}>
                <input type="text" value={jobName} onChange={e => setJobName(e.target.value)} placeholder="job name — filename + slug" />
              </Field>
              <Field label="Order #" style={{ flex: "0 0 90px" }}>
                <input type="text" value={orderRef} onChange={e => setOrderRef(e.target.value)} />
              </Field>
            </div>
          </Acc>

          <Acc id="layout" title="Layout settings" open={secOpen.layout} onToggle={() => toggleSec("layout")}
               badge={lay && lay.manualGrid ? <span className="imp-badge warn" style={{ marginLeft: 8 }}>MANUAL</span> : null}>
            <div style={{ display: "flex", gap: 10 }}>
              <Field label="Layout position offset" style={{ flex: 1 }}>
                <select value={offsetMode} onChange={e => setOffsetMode(e.target.value)}>
                  <option value="jog">Jog lower-right 0.5″ (back: lower-left)</option>
                  <option value="center">Centered</option>
                  <option value="custom">Custom offset…</option>
                </select>
              </Field>
              <Field label="Gutter" style={{ flex: "0 0 110px" }}>
                <select value={gutterMode} onChange={e => setGutterMode(e.target.value)}>
                  <option value="auto">{isSaddle ? "Butt (default)" : "Auto"}</option>
                  <option value="0">0″ (butt)</option>
                  <option value="0.125">0.125″</option>
                  <option value="0.25">0.25″</option>
                  <option value="0.375">0.375″</option>
                  <option value="0.5">0.5″</option>
                </select>
              </Field>
            </div>
            {offsetMode === "custom" && (
              <div style={{ display: "flex", gap: 10 }}>
                <Field label="From right edge (in)" style={{ flex: 1 }}>
                  <input type="number" step="0.125" min="0" value={offsetRight} onChange={e => setOffsetRight(e.target.value)} />
                </Field>
                <Field label="From bottom edge (in)" style={{ flex: 1 }}>
                  <input type="number" step="0.125" min="0" value={offsetBottom} onChange={e => setOffsetBottom(e.target.value)} />
                </Field>
              </div>
            )}
            {!isSaddle && (
              <div style={{ display: "flex", gap: 10 }}>
                <Field label="Piece pattern" style={{ flex: 1 }}>
                  <select value={pattern} onChange={e => setPattern(e.target.value)}>
                    <option value="straight">Straight (all same)</option>
                    <option value="h2h">Head-to-head (row pairs)</option>
                    <option value="f2f">Foot-to-foot (row pairs)</option>
                    <option value="reversal">Reversal (alt. columns 180°)</option>
                    <option value="revalt">Reversal alternate (checkerboard)</option>
                    <option value="manual">Manual (tap cells)…</option>
                  </select>
                </Field>
                <Field label="Grid orientation" style={{ flex: "0 0 140px" }}>
                  <select value={forceRotated} onChange={e => setForceRotated(e.target.value)}>
                    <option value="auto">Auto</option>
                    <option value="no">Force unrotated</option>
                    <option value="yes">Force rotated 90°</option>
                  </select>
                </Field>
              </div>
            )}
            {!isSaddle && pattern === "manual" && lay && (
              <div style={{ marginBottom: 12 }}>
                <span className="lbl">Manual pattern — tap a cell to flip it 180° (top row shown first)</span>
                {Array.from({ length: lay.down }).map((_, rr) => {
                  const row = lay.down - 1 - rr; // grid rows are bottom-up
                  return (
                    <div key={rr} style={{ display: "flex", gap: 4, marginBottom: 4 }}>
                      {Array.from({ length: lay.across }).map((_, col) => {
                        const idx = row * lay.across + col;
                        const flipped = +manualPattern[idx] === 180;
                        return (
                          <button key={col} type="button" className="imp-btn sec"
                            style={{ width: 34, height: 30, padding: 0, fontSize: 14, background: flipped ? "rgba(233,30,140,.25)" : undefined }}
                            onClick={() => setManualPattern(p => { const n = [...p]; n[idx] = flipped ? 0 : 180; return n; })}>
                            {flipped ? "\u2193" : "\u2191"}
                          </button>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            )}

            {(spec.sides === 2 || isBook) && (
              <div style={{ display: "flex", gap: 10 }}>
                <Field label="Press flips sheet on" style={{ flex: 1 }}>
                  <select value={sheetFlip} onChange={e => setSheetFlip(e.target.value)}>
                    <option value="short">Short edge (default — Fiery SEF)</option>
                    <option value="long">Long edge</option>
                  </select>
                </Field>
                {!isSaddle && (
                  <Field label="Back rotation" style={{ flex: 1 }}>
                    <select value={backRotate} onChange={e => setBackRotate(e.target.value)}>
                      <option value="auto">Auto (register with front)</option>
                      <option value="0">Force none</option>
                      <option value="180">Force 180° (tumble)</option>
                    </select>
                  </Field>
                )}
              </div>
            )}
            {(FLAT_CALCS.includes(calc) || isSaddle) && (
              <label style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "center", cursor: "pointer", marginBottom: 8 }}>
                <input type="checkbox" checked={efficient} onChange={e => setEfficient(e.target.checked)} style={{ width: "auto" }} />
                <span>Lay out on 13×27.5 (efficient mode) <span style={{ color: "rgba(255,255,255,.4)" }}>— {isSaddle ? "more signature copies per sheet" : "multiple expands to fill the 27″ axis"}</span></span>
              </label>
            )}
            <label style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "center", cursor: "pointer", marginBottom: 10 }}>
              <input type="checkbox" checked={allowBestFit} onChange={e => setAllowBestFit(e.target.checked)} style={{ width: "auto" }} />
              <span>Allow best physical fit if the priced imp can't be placed <span style={{ color: "rgba(255,255,255,.4)" }}>(mismatch is flagged on sheet + slug)</span></span>
            </label>
            {(() => {
              // Perfect bound edits ONE HALF at a time. The cover and the book
              // block are different pieces on different stock, so they each
              // carry their own grid, gutters and sheet; `part` is only which
              // of the two this panel is currently pointed at.
              const pbParts = isPB && layoutInfo.pbLayouts
                ? ["cover", "guts"].filter(p => layoutInfo.pbLayouts[p]) : [];
              const part = isPB ? (pbParts.includes(pbGridPart) ? pbGridPart : pbParts[0]) : null;
              const half = part ? layoutInfo.pbLayouts[part] : null;
              // The layout this panel describes: the PB half, or the single job.
              const panelLay = isPB ? (half && half.layout) : lay;
              const show = isPB ? !!part
                : (lay ? (isSaddle ? !!lay.booklet : true)
                       : (isSaddle || FLAT_CALCS.includes(calc) || calc === "sticker"));
              if (!show) return null;
              // One accessor pair over two storage shapes, so the panel below is
              // written once. Everything else in it reads G / setG / panelLay.
              const G = isPB ? pbGrids[part]
                : { on: gridOn, across: gridAcross, down: gridDown, sheet: gridSheet,
                    cols: gapCols, rows: gapRows, fill: gapFill };
              const setG = isPB
                ? (patch => setPbGrids(p => ({ ...p, [part]: { ...p[part], ...patch } })))
                : (patch => {
                    if ("on" in patch) setGridOn(patch.on);
                    if ("across" in patch) setGridAcross(patch.across);
                    if ("down" in patch) setGridDown(patch.down);
                    if ("sheet" in patch) setGridSheet(patch.sheet);
                    if ("cols" in patch) setGapCols(patch.cols);
                    if ("rows" in patch) setGapRows(patch.rows);
                    if ("fill" in patch) setGapFill(patch.fill);
                  });
              const ok = !!panelLay;
              const nc = ok ? Math.max(0, panelLay.across - 1) : 0;
              const nr = ok ? Math.max(0, panelLay.down - 1) : 0;
              const uni = ok ? (panelLay.gutter || 0) : 0;
              const effCol = (G.cols && G.cols.length === nc) ? G.cols : ((ok && panelLay.colGaps) || Array(nc).fill(uni));
              const effRow = (G.rows && G.rows.length === nr) ? G.rows : ((ok && panelLay.rowGaps) || Array(nr).fill(uni));
              const setCol = (i, v) => { const a = effCol.slice(); a[i] = v === "" ? 0 : +v; setG({ cols: a }); };
              const setRow = (i, v) => { const a = effRow.slice(); a[i] = v === "" ? 0 : +v; setG({ rows: a }); };
              const custom = G.cols || G.rows || G.fill != null;
              const tw = ok ? panelLay.across * panelLay.cellW + effCol.reduce((x, y) => x + y, 0) : 0;
              const th = ok ? panelLay.down * panelLay.cellH + effRow.reduce((x, y) => x + y, 0) : 0;
              const over = ok && (tw > panelLay.sheet.long + 1e-6 || th > panelLay.sheet.short + 1e-6);
              // Changing the grid invalidates gap arrays sized to the old one.
              const setAcross = v => setG({ across: v, cols: null });
              const setDown = v => setG({ down: v, rows: null });
              const manualCount = (Math.floor(+G.across) || 0) * (Math.floor(+G.down) || 0);
              return (
                <div style={{ border: "1px solid rgba(255,255,255,.12)", borderRadius: 8, padding: "10px 12px", marginBottom: 8, background: "rgba(255,255,255,.02)" }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                    <span className="lbl" style={{ margin: 0 }}>{isSaddle ? "Signatures per sheet, creep & gutters" : "Manual grid & gutters"}</span>
                    <span style={{ fontSize: 11, color: over ? "#f87171" : "rgba(255,255,255,.4)" }}>
                      {ok ? `block ${tw.toFixed(2)}×${th.toFixed(2)}″ / sheet ${panelLay.sheet.long}×${panelLay.sheet.short}″${over ? " — OVERFLOW" : ""}`
                          : "layout refused — adjust or reset below"}
                    </span>
                  </div>
                  {isPB && (
                    <div style={{ marginBottom: 9 }}>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {pbParts.map(p => {
                          const on = p === part;
                          const pl = layoutInfo.pbLayouts[p] && layoutInfo.pbLayouts[p].layout;
                          const g = pbGrids[p];
                          return (
                            <button key={p} type="button" className="imp-btn sec"
                                    style={{ padding: "4px 12px", fontSize: 12, borderColor: on ? "#4ea1ff" : undefined, color: on ? "#4ea1ff" : undefined, fontWeight: on ? 700 : 400 }}
                                    onClick={() => setPbGridPart(p)}>
                              {p === "cover" ? "Cover" : "Guts"}
                              <span style={{ color: "rgba(255,255,255,.4)", fontWeight: 400 }}>
                                {" "}{pl ? `${pl.across}×${pl.down}` : "—"}{g.on ? " manual" : ""}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                      <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.4)", marginTop: 5 }}>
                        {part === "cover"
                          ? `Editing the COVER — one flat ${panelLay ? `${panelLay.pieceLong.toFixed(3)}×${panelLay.pieceShort}″` : "back|spine|front"} piece on cover stock.`
                          : `Editing the GUTS — the book block${panelLay ? `, ${panelLay.pieceLong}×${panelLay.pieceShort}″ pages` : ""} on text stock.`}
                        {" "}Each half keeps its own grid, gutters and press sheet; neither inherits the other's.
                      </div>
                      {half && half.error && (
                        <div style={{ fontSize: 12, color: "#f87171", marginTop: 5 }}>{half.error}</div>
                      )}
                    </div>
                  )}
                  {(
                    <div style={{ marginBottom: 8 }}>
                      <label style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "center", cursor: "pointer" }}>

                            { v: "gang", t: "Gang in order", d: "consecutive signatures side by side — 1+2, 3+4, 5+6, 7+8, 9. One sheet through the press is one book's worth of those signatures." },

                            <label key={o.v} style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "flex-start", cursor: "pointer", marginBottom: 4 }}>

                                       onChange={e => { setRepN(e.target.value); setGapCols(null); setGapRows(null); }} />
                              </div>}
                              <div style={{ fontSize: 12, paddingBottom: 6, color: "rgba(255,255,255,.55)" }}>
                                {ok ? <>{panelLay.across} × {panelLay.down} on <b>{panelLay.sheet.label}</b></> : null}
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                  {isSaddle && (

                    {(!ok || G.on || (!isPB && repOn)) && (

                              style={{ padding: "3px 10px", fontSize: 12, borderColor: ok ? undefined : "#f87171", color: ok ? undefined : "#f87171" }}
                              onClick={() => { if (!isPB) setRepOn(false); setG({ on: false, sheet: "auto", cols: null, rows: null, fill: null }); }}>

                </div>

          </Acc>

          <Acc id="product" title={isPB ? "Perfect bound — two press jobs" : "Product settings"} open={secOpen.product} onToggle={() => toggleSec("product")}>
            <label style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "flex-start", cursor: "pointer", marginBottom: 10 }}>
              <input type="checkbox" checked={splitSpreads} onChange={e => setSplitSpreads(e.target.checked)} style={{ width: "auto", marginTop: 3 }} />
              <span>Split 2-page spreads into single pages <span style={{ color: "rgba(255,255,255,.4)" }}>— for a file exported as reader spreads (page 1 alone, then 2|3, 4|5 …). Each spread-sized page is cut at its centre line. Bound products refuse a spreads file until this is ticked.</span></span>
            </label>
            {showProduct && (<div>
            {!isBook && art && art.pageCount > (spec.sides === 2 && !backArt ? 2 : 1) && (
              <div style={{ marginTop: 10 }}>
                <Field label={`Multi-page file (${art.pageCount} pages)`}>
                  <select value={multiMode} onChange={e => setMultiMode(e.target.value)}>

                    <option value="gang">Gang pages in order (different pieces per sheet)</option>
                    <option value="stack">Cut &amp; stack (piles collate after cutting)</option>
                    <option value="each">Repeat each page (full sheet per piece)</option>
                  </select>
                </Field>

                  </div>
                )}
              </div>
            )}
            {isPB && (

                <span className="lbl">Perfect bound — two press jobs</span>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,.5)", marginBottom: 9 }}>
                  A perfect-bound book images as two press jobs on different stock. Emit both, or just the half you need —
                  a guts reprint needs no spine and no cover file. With a single reading-order PDF the cover is built from
                  pages 1, 2 and the last two; or drop the guts here and the template cover file below.
                </div>
                <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 10 }}>
                  {[["both","Cover + guts"],["guts","Guts only"],["cover","Cover only"]].map(([v,t]) => (
                    <label key={v} style={{ fontSize: 13, display: "flex", gap: 6, alignItems: "center", cursor: "pointer" }}>
                      <input type="radio" name="pps-pbpart" checked={pbPart === v} style={{ width: "auto" }}
                             onChange={() => setPbPart(v)} />
                      {t}
                    </label>
                  ))}
                </div>
                {pbPart !== "cover" && (
                  <div style={{ marginBottom: 10, paddingBottom: 9, borderBottom: "1px dashed rgba(255,255,255,.12)" }}>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,.45)", marginBottom: 5 }}>
                      Leaves onto the sheet — what goes in each cell of the GUTS (pagination into leaves is the same in all three; each leaf is a front/back pair)
                    </div>
                    {[
                      { v: "gang",     t: "Gang in order",   d: "consecutive leaves side by side — a 4-up sheet carries pages 1,3,5,7 on the front and 2,4,6,8 on the back. One sheet through the press is one book's worth of those leaves; quantity = books." },
                      { v: "repeat",   t: "Step and repeat", d: "every cell is the SAME leaf, stepped across the sheet. One form per leaf; the run divides by the number of cells. Cut, then collate the lifts into books." },
                      { v: "cutstack", t: "Cut and stack",   d: "the leaf list runs DOWN the piles — 18 leaves 4-up gives 1|6|11|16 on sheet 1. Cut the pile once, drop each lift under the one before it, and the block is already in order." },
                    ].map(o => (
                      <label key={o.v} style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "flex-start", cursor: "pointer", marginBottom: 4 }}>
                        <input type="radio" name="pps-pbgutsorder" checked={pbGutsOrder === o.v} style={{ width: "auto", marginTop: 3 }}
                               onChange={() => setPbGutsOrder(o.v)} />
                        <span><b style={{ fontWeight: 600 }}>{o.t}</b> <span style={{ color: "rgba(255,255,255,.4)" }}>— {o.d}</span></span>
                      </label>

                  </div>

                  <div style={{ display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap" }}>
                    <Field label="Spine width (in)" style={{ flex: "0 0 130px" }}>
                      <input type="number" step="0.0625" min="0" max="3" value={spine} onChange={e => setSpine(e.target.value)} />
                    </Field>
                    <div style={{ fontSize: 12, color: "rgba(255,255,255,.55)", paddingBottom: 8 }}>
                      flat cover = <b>{(2 * (+trimLong || 0) + (+spine || 0)).toFixed(3)}</b> × {(+trimShort || 0).toFixed(3)}″
                      <span style={{ color: "rgba(255,255,255,.38)" }}> — measure the glued block; the quote assumes nominal caliper</span>
                    </div>
                  </div>
                )}
                {pbPart !== "guts" && <div style={{ marginTop: 4 }}>
                  <DropZone label="Drop COVER PDF (optional)" sub="already flat with the spine — the calculator's cover template. Leave empty for a single reading-order file."
                    accept=".pdf" onFiles={f => onFiles(f, "back")} fileName={backArt && backArt.name} />
                </div>}
              </div>
            )}
            {!isPB && spec.sides === 2 && art && (art.pageCount < 2 || multiMode !== "repeat") && (
              <div style={{ marginTop: 10 }}>
                <DropZone label="Drop BACK side PDF" sub={multiMode !== "repeat" ? "optional — separate collated back file (page i backs piece i)" : "2-sided job but the front file has one page"}
                  accept=".pdf" onFiles={f => onFiles(f, "back")} fileName={backArt && backArt.name} />
              </div>

            {!isSaddle && (
              <div style={{ marginTop: 12, borderTop: "1px solid rgba(255,255,255,.1)", paddingTop: 10 }}>

                    {gangFiles.length >= 2 && (
                      <div style={{ fontSize: 11, color: "rgba(255,255,255,.45)" }}>

                        <button type="button" className="imp-btn sec" style={{ marginLeft: 8, padding: "2px 8px" }} onClick={() => setGangFiles([])}>clear gang</button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            </div>)}
          </Acc>

          <Acc id="bleed" title="Bleed settings" open={secOpen.bleed} onToggle={() => toggleSec("bleed")}
               badge={addBleed !== "off" ? <span className="imp-badge ok" style={{ marginLeft: 8 }}>{addBleed.toUpperCase()}</span> : null}>
            <Field label="Bleed (in)" style={{ maxWidth: 140 }}>
              <input type="number" step="0.0625" min="0" max="0.5" value={bleedIn} onChange={e => setBleedIn(e.target.value)} />
            </Field>
            <Field label="Add bleed (files with none)">
              <select value={addBleed} onChange={e => setAddBleed(e.target.value)}
                      style={addBleed === "off" && !Object.keys(addBleedPages).length && result && (result.warnings || []).some(w => /no bleed/i.test(w))
                             ? { outline: "2px solid #e91e63" } : undefined}>
                <option value="off">Off — use file as-is</option>
                <option value="auto">Auto (text-safe) — mirror, streak where text is near trim</option>
                <option value="mirror">Mirror edges outward (content at trim stays put)</option>
                <option value="scale">Scale art up to bleed (shrinks safety margin)</option>
                <option value="streak">Streak edges (stretch edge sliver — nothing readable)</option>
              </select>
              {addBleed === "off" && !Object.keys(addBleedPages).length && result && (result.warnings || []).some(w => /no bleed/i.test(w)) && (
                <div style={{ fontSize: 11, color: "#e91e63", marginTop: 3 }}>
                  This file has no bleed — cut lines may show paper white. Auto is the safe default fix: it mirrors
                  clean edges and streaks edges with nearby text. Scale suits photo collages and faces
                  (a mirror would visibly reflect people at the edges).
                </div>
              )}
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, marginTop: 8, flexWrap: "wrap" }}>
                <b style={{ fontWeight: 600 }}>Scale art:</b>
                <input type="number" step="1" min="25" max="400" value={artScale} style={{ width: 74 }}
                       onChange={e => setArtScale(e.target.value)} />
                <span>% of placed size</span>
                {+artScale !== 100 && (
                  <span style={{ color: "rgba(255,255,255,.5)" }}>
                    — {+artScale > 100 ? "grows past the trim (clipped to the cell)" : "pulls in from the trim; needs a bleed fill to cover the gap"}
                  </span>
                )}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, marginTop: 6, flexWrap: "wrap" }}>
                <b style={{ fontWeight: 600 }}>Pull art off trim:</b>
                <input type="number" step="0.03125" min="0" max="0.5" value={artInset}
                       style={{ width: 70, outline: +artInset > 0 && addBleed === "scale" ? "2px solid #e91e63" : undefined }}
                       onChange={e => setArtInset(e.target.value)} />
                ″ minimum on every edge
                {+artInset > 0 && (() => {
                  const W = Math.max(+trimLong || 0, +trimShort || 0), H = Math.min(+trimLong || 0, +trimShort || 0);
                  if (!(H > 0)) return null;
                  const f = 1 - 2 * (+artInset) / H;
                  return (
                    <span style={{ color: f > 0.5 ? "rgba(255,255,255,.5)" : "#f87171" }}>
                      — art ×{f.toFixed(4)} ({(100 - f * 100).toFixed(2)}% smaller): pulls in {(W * (1 - f) / 2).toFixed(3)}″ across, {(H * (1 - f) / 2).toFixed(3)}″ down;
                      fill band becomes {((W * (1 - f) / 2) + (+bleedIn || 0)).toFixed(3)}″
                    </span>
                  );
                })()}
              </div>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,.4)", marginTop: 2 }}>

                bleed fill above covers the gap it opens — out from the art's new edge to past the cut. Scale is
                uniform (art is never distorted), so the value is a guaranteed <i>minimum</i>: the long edge pulls
                in proportionally further. Needs a fill mode — Auto, Mirror or Streak, not Scale.
              </div>
              {+artInset > 0 && addBleed === "scale" && (
                <div style={{ fontSize: 11, color: "#e91e63", marginTop: 2 }}>
                  “Scale art up to bleed” re-expands the art to the bleed box, undoing the pull-off. Use Auto, Mirror or Streak.
                </div>
              )}
              {+artInset > 0 && addBleed === "off" && (
                <div style={{ fontSize: 11, color: "#e91e63", marginTop: 2 }}>
                  With Add bleed off, the gap the pull-off opens would print as paper white inside the trim. Set a fill mode.
                </div>
              )}
              <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, marginTop: 6, cursor: "pointer" }}>
                <input type="checkbox" checked={addBleedSmart} onChange={e => setAddBleedSmart(e.target.checked)} />
                Smart edge detect — if the art stops just short of trim (≤3/16″), pre-scale so the synthesized
                bleed never amplifies the white sliver; big white margins are respected as design.
              </label>
              {(["auto", "streak"].includes(addBleed) || Object.values(addBleedPages).some(v => v === "auto" || v === "streak")) && (
                <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, marginTop: 4 }}>
                  Streak sampler: outermost
                  <input type="number" step="0.005" min="0.005" max="0.25" value={streakEps}
                         style={{ width: 64 }} onChange={e => setStreakEps(e.target.value)} />
                  ″ of art stretched into the bleed (smaller = purer edge color, larger = softer smear)
                </div>
              )}
              {art && art.pageCount > 1 && gangFiles.length < 2 && (addBleed !== "off" || Object.keys(addBleedPages).length > 0
                || (result && (result.warnings || []).some(w => /no bleed/i.test(w)))) && (
                <div style={{ marginTop: 6 }}>
                  <div style={{ fontSize: 11, color: "#777", marginBottom: 3 }}>

                    : s.side === "COLLATED"
                    ? <div key={i}>Collated: {s.pieces} piece{s.pieces === 1 ? "" : "s"} · {s.modeName === "gang" ? "ganged in order" : s.modeName === "stack" ? "cut & stack" : "one full sheet per piece"} · {s.sheetsPerSet} sheet{s.sheetsPerSet === 1 ? "" : "s"}{s.modeName === "each" ? " total" : " per set"}</div>
                    : <div key={i}>{s.side}: {s.rot ? `source /Rotate ${s.rot}° normalized · ` : ""}cell rotation {s.cellRotate}° · scale ×{typeof s.scale === "number" ? s.scale.toFixed(3) : "?"} · {s.hasBleed ? "bleed present" : s.synth ? `bleed synthesized (${s.synth})` : "no bleed"}</div>)}
                </div>
              )}

                </div>
              ))}
              {!art && !busy && !result && (
                <div style={{ color: "rgba(255,255,255,.45)", fontSize: 13, lineHeight: 1.7 }}>
                  Drop an artwork PDF (or load an order) to generate the imposed press sheets. The engine places source pages as vector
                  XObjects, locates art by TrimBox, fits to trim without cropping, hard-clips every cell, and step-and-repeats the exact
                  count the customer was priced on.
                </div>
              )}
            </div>
          </details>
        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div style={{ maxWidth: 720, margin: "60px auto", padding: 20 }} className="imp-card">
          <div style={{ fontSize: 15, fontWeight: 700, color: "#f87171", marginBottom: 8 }}>The tool hit a rendering error</div>
          <div style={{ fontSize: 12.5, color: "rgba(255,255,255,.6)", whiteSpace: "pre-wrap", marginBottom: 12 }}>{String(this.state.err && this.state.err.message || this.state.err)}</div>
          <button className="imp-btn" onClick={() => location.reload()}>Reload the tool</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("pps-impose-root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
