<script type="text/babel">
// PRIORITY PRINT SERVICE — Auto-Imposition Tool v1
// Vector-preserving sheetwise step-and-repeat imposition in the browser.
// Engine design per docs/IMPOSITION_TOOL_BRIEF.md — the four historical
// failure modes and their fixes are tagged (a)(b)(c)(d) below.
const { useState, useEffect, useMemo, useRef } = React;
const PL = window.PDFLib;
const CFG = window.PPS_IMPOSE_CFG || null; // injected by pps-imposition.php in wp-admin

// ═══════════════════════════════════════════════════════════════
// LAYOUT SPEC — mirrors the calculators' pricing imposition EXACTLY.
// CRITICAL INVARIANT (brief §2): copies-per-sheet placed here must equal
// what the customer was priced on. flatGrid/flatImp/stickerImp are copied
// verbatim from the calculator HTML files — do not "fix" the thresholds.
// ═══════════════════════════════════════════════════════════════
const PT = 72, BLEED = 0.125, EPS = 1e-6;

const SHEETS = {
  "13x19":   { key:"13x19",   label:"13×19",              long:19,   short:13, usableLong:18.5, usableShort:12.5 },
  "13x27.5": { key:"13x27.5", label:"13×27.5 (oversize)", long:27.5, short:13, usableLong:27,   usableShort:12.5 },
  "12x18":   { key:"12x18",   label:"12×18 crack-n-peel", long:18,   short:12, usableLong:17.5, usableShort:11.5 },
};

const CALC_TYPES = [
  { val:"brochure",      label:"Brochure / Flat" },
  { val:"postcard",      label:"Postcard" },
  { val:"letterhead",    label:"Letterhead" },
  { val:"greeting-card", label:"Greeting Card" },
  { val:"sticker",       label:"Sticker (12×18 crack-n-peel)" },
  { val:"saddle",        label:"Saddle Stitch Booklet (signatures)" },
];
const FLAT_CALCS = ["brochure","postcard","letterhead","greeting-card"];
const UNSUPPORTED_BOOKLETS = ["perfect-bound","coupon"]; // saddle is supported; these need their own pagination (v2)
// 12×18 crack-n-peel sticker sheet: single source for both the priced count
// (stickerImp) and the placed grid (computeLayout) — they must never drift.
const STICKER = { L: 17.75, S: 11.75, pitch: 0.25 };

// Verbatim port of calcBrochureImp / calcPostcardImp / calcLetterheadImp /
// calcGreetingImp (identical JS in all four calculators).
function flatGrid(w, h, L) {
  const r1 = L / w;
  const across = r1 < 0.5 ? 0 : r1 < 1 ? 0.5 : r1 < 1.48 ? 1 : r1 < 3 ? 2 : r1 < 4 ? 3 : r1 < 5 ? 4 : r1 < 6 ? 5 : r1 < 7 ? 6 : r1 < 8 ? 7 : 8;
  const r2 = 12.5 / h;
  const down = r2 < 1 ? 0 : r2 < 2 ? 1 : r2 < 3 ? 2 : r2 < 4 ? 3 : 4;
  return across * down;
}
function flatImp(longEdge, shortEdge, sheetLong) {
  const L = sheetLong || 18.5;
  return Math.max(flatGrid(longEdge, shortEdge, L), flatGrid(shortEdge, longEdge, L));
}
// Verbatim port of calcStickerImp (12×18 sheet, 0.25″ pitch, edge bleed into margins).
function stickerGrid(w, h) {
  return {
    a: Math.max(0, Math.floor(STICKER.L / (w + STICKER.pitch))),
    d: Math.max(0, Math.floor(STICKER.S / (h + STICKER.pitch))),
  };
}
function stickerImp(longEdge, shortEdge) {
  const g0 = stickerGrid(longEdge, shortEdge), g1 = stickerGrid(shortEdge, longEdge);
  return Math.max(g0.a * g0.d, g1.a * g1.d);
}

// ── Saddle stitch booklet spec (mirror of calc-preview-test.html) ──
// Preset table is authoritative for preset sizes (imp values don't always
// equal calcCustomImp — e.g. 6×4 is priced 8-up); customs fall back to the
// verbatim calcCustomImp port. bindEdge = page HEIGHT (spine is always the
// left, vertical edge in every preset: portrait, square, and landscape).
// Page dims are width×height as in the preset labels.
const SADDLE_PRESETS_FALLBACK = [
  { w:3.5,  h:5.5,  imp:8 }, { w:4,    h:6,   imp:8 }, { w:4.25, h:5.5,  imp:8 },
  { w:5,    h:7,    imp:4 }, { w:5.5,  h:8.5, imp:4 }, { w:6,    h:9,    imp:4 },
  { w:8.5,  h:11,   imp:2 }, { w:9,    h:12,  imp:2 },
  { w:4,    h:4,    imp:8 }, { w:5.5,  h:5.5, imp:6 }, { w:6,    h:6,    imp:6 },
  { w:8,    h:8,    imp:2 }, { w:9,    h:9,   imp:2 }, { w:12,   h:12,   imp:1 },
  { w:6,    h:4,    imp:8 }, { w:5.5,  h:4.25, imp:8 }, { w:8.5,  h:5.5, imp:4 },
  { w:9,    h:6,    imp:4 }, { w:11,   h:8.5, imp:1 }, { w:12,   h:9,    imp:1 },
];

// In wp-admin the PHP injects the LIVE saddle size_presets (the same
// wp_options config the calculator prices with), so an admin preset edit
// can never drift production away from pricing. The embedded fallback only
// applies standalone (GitHub Pages / local file).
function parseSaddlePresetGroups(groups) {
  const out = [];
  (groups || []).forEach(g => (g.items || []).forEach(it => {
    const m = String(it.label || "").match(/([\d.]+)\s*[×x]\s*([\d.]+)/);
    if (m && it.imp >= 1) out.push({ w: +m[1], h: +m[2], imp: +it.imp });
  }));
  return out;
}
const SADDLE_PRESETS = (CFG && CFG.sizePresets && parseSaddlePresetGroups(CFG.sizePresets).length)
  ? parseSaddlePresetGroups(CFG.sizePresets)
  : SADDLE_PRESETS_FALLBACK;

// Verbatim port of the saddle calculator's calcCustomImp. The trailing
// `r < 3 ? 2 : 2` / `r < 5 ? 4 : 4` tails look redundant but are kept
// byte-for-byte from the calculator — do NOT "simplify" them; parity with
// pricing is verified by tests/imposition/parity.mjs.
function bookletImp(longest, shortest, bindDir, sheetLong) {
  const L = sheetLong || 18.5;
  const sA = x => { const r = L / x; return r < .5 ? 0 : r < 1 ? .5 : r < 2 ? 1 : r < 3 ? 2 : r < 4 ? 3 : r < 5 ? 4 : 4; };
  const sB = x => { const r = 12.5 / x; return r < 2 ? 1 : r < 3 ? 2 : 2; };
  return bindDir === "short" ? sA(longest) * sB(shortest) : sA(shortest) * sB(longest);
}

// Page width×height → priced pages-per-13×19-side. Preset table first
// (authoritative), calcCustomImp for customs — same order as resolveSize.
function resolveSaddleImp(pw, ph) {
  const preset = SADDLE_PRESETS.find(p => Math.abs(p.w - pw) < 0.01 && Math.abs(p.h - ph) < 0.01);
  if (preset) return { imp: preset.imp, source: "preset" };
  const longest = Math.max(pw, ph), shortest = Math.min(pw, ph);
  const bindDir = ph < pw ? "short" : "long"; // spine = page height
  return { imp: bookletImp(longest, shortest, bindDir), source: "custom" };
}

// ── Physical layout: priced imp → deterministic cell geometry ──
// All cell rects are in INCHES, PDF coordinates (origin bottom-left, y-up),
// X along the sheet's long axis.
// Gutter policy (fix d — nothing arbitrary): prefer a full double-bleed
// gutter (0.25″), squeeze to 0.125″ then butt-cut 0 only when the priced
// count can't fit otherwise. Deterministic and reported.
const GUTTERS = [0.25, 0.125, 0];

// The press images only the usable area (18.5×12.5 on 13×19; 27×12.5 on
// 13×27.5; 17.5×11.5 on 12×18) — everything placed, including marks, must
// live inside this rect or it simply won't print.
function printableRect(sheet) {
  const mx = (sheet.long - sheet.usableLong) / 2, my = (sheet.short - sheet.usableShort) / 2;
  return { x0: mx, y0: my, x1: sheet.long - mx, y1: sheet.short - my };
}

function fits(n, dim, g, usable) { return n * dim + (n - 1) * g <= usable + EPS; }

// allowedRot: which grid orientations to consider — [false, true] normally,
// narrowed by the operator's grid-orientation override.
function bestGridForCount(target, pieceLong, pieceShort, sheet, gutters, allowedRot) {
  for (const g of (gutters || GUTTERS)) {
    const candidates = [];
    for (const rotated of (allowedRot || [false, true])) {
      const w = rotated ? pieceShort : pieceLong;
      const h = rotated ? pieceLong : pieceShort;
      const maxA = Math.floor((sheet.usableLong + g + EPS) / (w + g));
      const maxD = Math.floor((sheet.usableShort + g + EPS) / (h + g));
      for (let a = 1; a <= maxA; a++) {
        if (target % a) continue;
        const d = target / a;
        if (d <= maxD && fits(a, w, g, sheet.usableLong) && fits(d, h, g, sheet.usableShort)) {
          candidates.push({ a, d, rotated, g });
        }
      }
    }
    if (candidates.length) {
      // fewest rows (fewest horizontal cuts) first, then unrotated
      candidates.sort((p, q) => p.d - q.d || (p.rotated ? 1 : 0) - (q.rotated ? 1 : 0));
      return candidates[0];
    }
  }
  return null;
}

// Trim-block origin. Default JOGS the block 0.5″ against the sheet's
// lower-right corner (shop practice: the back mirrors across the short-edge
// flip, landing lower-LEFT — same physical corner, so the cutter jogs both
// sides against one registration corner). "center" and "custom" available.
// Always clamped so the TRIM stays inside the printable image area.
function blockOrigin(layout, offset, warnings) {
  const s = layout.sheet;
  const totalW = layout.across * layout.cellW + (layout.across - 1) * layout.gutter;
  const totalH = layout.down * layout.cellH + (layout.down - 1) * layout.gutter;
  const P = printableRect(s);
  const mode = (offset && offset.mode) || "jog";
  let x, y;
  if (mode === "center") {
    x = (s.long - totalW) / 2; y = (s.short - totalH) / 2;
  } else {
    const right = mode === "custom" && isFinite(offset.right) ? Math.max(+offset.right, 0) : 0.5;
    const bottom = mode === "custom" && isFinite(offset.bottom) ? Math.max(+offset.bottom, 0) : 0.5;
    x = s.long - right - totalW;
    y = bottom;
  }
  const cx = Math.min(Math.max(x, P.x0), P.x1 - totalW);
  const cy = Math.min(Math.max(y, P.y0), P.y1 - totalH);
  if (mode !== "center" && (Math.abs(cx - x) > EPS || Math.abs(cy - y) > EPS)) {
    warnings.push(`Layout offset clamped to keep the trim inside the printable area (${s.usableLong}×${s.usableShort}″).`);
  }
  const clipped = [];
  const b = layout.bleed;
  if (cx - b < P.x0 - EPS) clipped.push("left");
  if (cx + totalW + b > P.x1 + EPS) clipped.push("right");
  if (cy - b < P.y0 - EPS) clipped.push("bottom");
  if (cy + totalH + b > P.y1 + EPS) clipped.push("top");
  if (clipped.length) warnings.push(`Outer bleed falls outside the printable area on the ${clipped.join("/")} edge(s) and will not image — cuts there may show paper white.`);
  return { x0: cx, y0: cy };
}

// Per-cell 180° gang patterns. Rows are indexed bottom-up (y-up grid), so
// "head-to-head" pairs rows (0,1), (2,3)… with heads meeting at the pair's
// shared cut; "foot-to-foot" is the phase-shifted complement. Each piece's
// BACK inherits its front rotation automatically, so patterned sheets still
// register through the duplex flip.
function patternRot(pattern, manual, col, row, across) {
  switch (pattern) {
    case "h2h":      return row % 2 ? 180 : 0;
    case "f2f":      return row % 2 ? 0 : 180;
    case "reversal": return col % 2 ? 180 : 0;
    case "revalt":   return (col + row) % 2 ? 180 : 0;
    case "manual":   return manual && +manual[row * across + col] === 180 ? 180 : 0;
    default:         return 0;
  }
}

function buildCells(layout, opts) {
  // Interior clip extends min(BLEED, gutter/2) toward a neighbour (butt-cut
  // when gutter=0); perimeter clip always gets full BLEED.
  const s = layout.sheet, w = layout.cellW, h = layout.cellH, g = layout.gutter;
  const { x0, y0 } = blockOrigin(layout, opts && opts.offset, layout.warnings);
  const pattern = (opts && opts.pattern) || "straight";
  const manual = opts && opts.manualPattern;
  const b = layout.bleed;
  const inner = Math.min(b, g / 2);
  layout.cells = [];
  for (let row = 0; row < layout.down; row++) {
    for (let col = 0; col < layout.across; col++) {
      const x = x0 + col * (w + g), y = y0 + row * (h + g);
      layout.cells.push({
        col, row,
        patRot: patternRot(pattern, manual, col, row, layout.across),
        trim: { x, y, w, h },
        clip: {
          x: x - (col === 0 ? b : inner),
          y: y - (row === 0 ? b : inner),
          w: w + (col === 0 ? b : inner) + (col === layout.across - 1 ? b : inner),
          h: h + (row === 0 ? b : inner) + (row === layout.down - 1 ? b : inner),
        },
      });
    }
  }
}

// Max copies that physically fit, ignoring the priced count — used ONLY on
// explicit operator override when pricing over-promised (never silently).
function bestPhysicalGrid(pieceLong, pieceShort, sheet, gutters, allowedRot) {
  let best = null;
  for (const g of (gutters || GUTTERS)) {
    for (const rotated of (allowedRot || [false, true])) {
      const w = rotated ? pieceShort : pieceLong;
      const h = rotated ? pieceLong : pieceShort;
      const a = Math.floor((sheet.usableLong + g + EPS) / (w + g));
      const d = Math.floor((sheet.usableShort + g + EPS) / (h + g));
      if (a >= 1 && d >= 1 && (!best || a * d > best.a * best.d)) best = { a, d, rotated, g };
    }
  }
  return best;
}

function computeLayout(calc, trimA, trimB, opts) {
  if (calc === "saddle") return computeSaddleLayout(trimA, trimB, opts); // trimA = page WIDTH, trimB = page HEIGHT (not normalized — spine is the height edge)
  const pieceLong = Math.max(trimA, trimB), pieceShort = Math.min(trimA, trimB);
  const warnings = [];
  let mismatch = false;
  if (UNSUPPORTED_BOOKLETS.includes(calc)) {
    throw new Error("Perfect bound / coupon book imposition is not in v1 — flats, stickers, and saddle stitch booklets only.");
  }
  // Per-job bleed (default 0.125). The auto gutter ladder is bleed-derived:
  // full double bleed, single bleed, butt cut.
  const bleed = opts && isFinite(opts.bleed) && opts.bleed !== null ? Math.min(Math.max(+opts.bleed, 0), 0.5) : BLEED;
  if (Math.abs(bleed - BLEED) > EPS) warnings.push(`Bleed override: ${bleed}″ per side (default ${BLEED}″).`);
  const autoGutters = bleed > 0 ? [2 * bleed, bleed, 0] : [0];
  // Gutter override: a fixed value replaces the auto policy everywhere
  const gutters = opts && isFinite(opts.gutter) && opts.gutter !== null ? [Math.max(+opts.gutter, 0)] : autoGutters;
  // Grid-orientation override: "no" = pieces long-edge along the sheet's
  // long axis only; "yes" = rotated 90° only; anything else = auto.
  const allowedRot = opts && opts.forceRotated === "yes" ? [true]
                   : opts && opts.forceRotated === "no" ? [false] : [false, true];
  let sheet, priced, grid, efficient = false;
  if (calc === "sticker") {
    priced = stickerImp(pieceLong, pieceShort);
    if (priced < 1) throw new Error(`${pieceLong}×${pieceShort}″ does not fit the 12×18 sticker sheet`);
    sheet = SHEETS["12x18"];
    if (opts && isFinite(opts.gutter) && opts.gutter !== null && Math.abs(+opts.gutter - STICKER.pitch) > EPS) {
      warnings.push(`Sticker pitch is fixed at ${STICKER.pitch}″ by the 12×18 crack-n-peel spec — gutter override ignored.`);
    }
    const g0 = stickerGrid(pieceLong, pieceShort), g1 = stickerGrid(pieceShort, pieceLong);
    let rotated = g1.a * g1.d > g0.a * g0.d;
    if (opts && opts.forceRotated === "yes") rotated = true;
    else if (opts && opts.forceRotated === "no") rotated = false;
    const gg = rotated ? g1 : g0;
    if (gg.a * gg.d < priced) { mismatch = true; warnings.push(`MISMATCH: forced orientation fits ${gg.a * gg.d}-up but pricing assumed ${priced}-up.`); }
    if (gg.a * gg.d < 1) throw new Error("Forced orientation does not fit the sticker sheet.");
    grid = { a: gg.a, d: gg.d, rotated, g: STICKER.pitch };
  } else if (FLAT_CALCS.includes(calc)) {
    priced = flatImp(pieceLong, pieceShort);
    sheet = SHEETS["13x19"];
    if (priced < 1) { priced = flatImp(pieceLong, pieceShort, 27); sheet = SHEETS["13x27.5"]; } // calculators' two-sheet rule
    if (priced < 1) throw new Error(`${pieceLong}×${pieceShort}″ does not image on any press sheet`);
    if (opts && opts.efficient && sheet.key === "13x19" && priced >= 2) {
      // Efficient mode: same piece laid out on the 13×27.5 sheet, the
      // multiple expanding to whatever physically fits the 27″ usable axis.
      // Pricing basis stays the 13×19 imp — this is a press-pass saver.
      sheet = SHEETS["13x27.5"];
      grid = bestPhysicalGrid(pieceLong, pieceShort, sheet, gutters, allowedRot);
      if (!grid) throw new Error(`${pieceLong}×${pieceShort}″ does not fit on 13×27.5 with the selected gutter/orientation.`);
      efficient = true;
      warnings.push(`Efficient mode: ${grid.a * grid.d}-up on 13×27.5 (priced ${priced}-up per 13×19).`);
    } else {
      if (opts && opts.efficient) warnings.push("Efficient 13×27.5 mode applies to sizes imaging ≥2-up on 13×19 — ignored for this size.");
      grid = bestGridForCount(Math.round(priced), pieceLong, pieceShort, sheet, gutters, allowedRot);
      if (!grid) {
        // Pricing promised more than physically fits — surface loudly, never
        // silently under- or over-place (brief §2). Placement below the priced
        // count happens only on explicit operator override, and is flagged in
        // the UI, the warnings, and the sheet's slug line.
        if (!(opts && opts.allowBestFit)) {
          throw new Error(`Priced imposition ${priced}-up of ${pieceLong}×${pieceShort}″ does not physically fit on ${sheet.label}${gutters.length === 1 ? ` with a ${gutters[0]}″ gutter` : ""}${allowedRot.length === 1 ? " in the forced orientation" : ""}. Pricing/production mismatch — enable "allow best physical fit" to place the maximum that fits (flagged), and review pricing for this size.`);
        }
        grid = bestPhysicalGrid(pieceLong, pieceShort, sheet, gutters, allowedRot);
        if (!grid) throw new Error(`${pieceLong}×${pieceShort}″ does not physically fit on ${sheet.label} at all.`);
        mismatch = true;
        warnings.push(`MISMATCH: placing ${grid.a * grid.d}-up but the customer was priced ${priced}-up — sheet count and margin will differ. Review pricing for this size.`);
      }
      if (grid.g < gutters[0] && gutters.length > 1) warnings.push(grid.g === 0
        ? `Butt-cut layout (no gutter) needed to honour the priced ${priced}-up — adjacent pieces share cut lines, no inter-piece bleed.`
        : `Gutter squeezed to ${grid.g}″ to honour the priced ${priced}-up.`);
    }
  } else {
    throw new Error(`Unknown calc type "${calc}"`);
  }
  const layout = {
    sheet, calc, pieceLong, pieceShort, bleed,
    across: grid.a, down: grid.d, rotated: grid.rotated, gutter: grid.g,
    imp: grid.a * grid.d, pricedImp: priced, mismatch, efficient, warnings,
    cellW: grid.rotated ? pieceShort : pieceLong,
    cellH: grid.rotated ? pieceLong : pieceShort,
  };
  buildCells(layout, opts);
  return layout;
}

// ── Saddle stitch layout: cells are reader SPREADS (2 pages joined at a
// vertical spine), impHalf spreads per sheet side = the priced pages/side ──
function computeSaddleLayout(pw, ph, opts) {
  if (!(pw >= 2 && ph >= 2)) throw new Error("Enter page width × height (min 2″)");
  const warnings = [];
  let mismatch = false;
  const bleed = opts && isFinite(opts.bleed) && opts.bleed !== null ? Math.min(Math.max(+opts.bleed, 0), 0.5) : BLEED;
  if (Math.abs(bleed - BLEED) > EPS) warnings.push(`Bleed override: ${bleed}″ per side (default ${BLEED}″).`);
  const { imp, source } = resolveSaddleImp(pw, ph);
  if (imp < 1) throw new Error(`${pw}×${ph}″ pages do not image on any press sheet (imp=${imp})`);
  const spreadW = 2 * pw, spreadH = ph; // spine vertical in spread space
  let sheet, target;
  if (imp >= 2) {
    sheet = SHEETS["13x19"];
    target = Math.floor(imp / 2);
    if (imp % 2) { mismatch = true; warnings.push(`MISMATCH: priced ${imp} pages/side is odd — placing ${target} whole spread(s) (${target * 2} pages/side). Review pricing for this size.`); }
  } else {
    // imp:1 presets (12×12, 11×8.5 L, 12×9 L): the open spread only fits the
    // 13×27.5 oversize sheet, 1 spread per side — same page throughput the
    // pricing assumes (1 page per 13×19-side equivalent).
    sheet = SHEETS["13x27.5"];
    target = 1;
    warnings.push("Open spread requires the 13×27.5 oversize sheet (1 spread per side).");
  }
  // Saddle spreads BUTT by default: signatures share one cut line and the
  // interior bleed is cropped at it (cell clips stop at the shared trim), so
  // bleed never manufactures a gutter the operator didn't ask for. The
  // Gutter override still spaces spreads out explicitly when wanted.
  const gutters = opts && isFinite(opts.gutter) && opts.gutter !== null ? [Math.max(+opts.gutter, 0)] : [0];
  let grid = bestGridForCount(target, Math.max(spreadW, spreadH), Math.min(spreadW, spreadH), sheet, gutters);
  if (!grid) {
    if (!(opts && opts.allowBestFit)) {
      throw new Error(`${target} spread(s) of ${spreadW}×${spreadH}″ (pages ${pw}×${ph}″, priced ${imp}/side${source === "custom" ? ", custom size" : ""}) do not physically fit on ${sheet.label}${gutters.length === 1 ? ` with a ${gutters[0]}″ gutter` : ""}. Pricing/production mismatch — enable "allow best physical fit" to place fewer (flagged).`);
    }
    grid = bestPhysicalGrid(Math.max(spreadW, spreadH), Math.min(spreadW, spreadH), sheet, gutters);
    if (!grid) throw new Error(`A ${spreadW}×${spreadH}″ spread does not fit on ${sheet.label} at all.`);
    mismatch = true;
    warnings.push(`MISMATCH: placing ${grid.a * grid.d} spread(s)/side but pricing assumed ${target}. Review before printing.`);
  }
  if (grid.a * grid.d > 1) warnings.push(grid.g === 0
    ? "Spreads butt (default) — one cut line between signatures, interior bleed cropped at it. Set a Gutter to space them instead."
    : `${grid.g}″ gutter between spreads.`);
  const pieceLong = Math.max(spreadW, spreadH), pieceShort = Math.min(spreadW, spreadH);
  const layout = {
    sheet, calc: "saddle", pieceLong, pieceShort, bleed,
    across: grid.a, down: grid.d, rotated: grid.rotated, gutter: grid.g,
    imp: grid.a * grid.d * 2,      // pages per sheet side actually placed
    pricedImp: imp,                 // pages per side the calculator priced
    mismatch, warnings,
    cellW: grid.rotated ? pieceShort : pieceLong,
    cellH: grid.rotated ? pieceLong : pieceShort,
    booklet: {
      pw, ph, spreadW, spreadH,
      spreadsPerSide: grid.a * grid.d,
      // spread runs along X unless the grid put its long axis vertical
      spreadAlongX: (spreadW >= spreadH) ? !grid.rotated : grid.rotated,
    },
  };
  buildCells(layout, { offset: opts && opts.offset }); // patterns don't apply to signature spreads
  return layout;
}

// ═══════════════════════════════════════════════════════════════
// PDF ENGINE (pdf-lib) — vector-preserving placement.
// (a) source pages are embedded as vector XObjects, never rasterized;
//     output boxes are set explicitly; preflight validates the result.
// ═══════════════════════════════════════════════════════════════

// Low-level page box reader — robust across pdf-lib versions.
function getPageBox(page, name) {
  try {
    let v = page.node.get(PL.PDFName.of(name));
    if (!v) return null;
    v = page.node.context.lookup(v);
    if (!v || typeof v.lookup !== "function" || (v.size ? v.size() : 0) !== 4) return null;
    const n = i => { const el = v.lookup(i); return el && typeof el.asNumber === "function" ? el.asNumber() : null; };
    const nums = [n(0), n(1), n(2), n(3)];
    if (nums.some(x => x === null || !isFinite(x))) return null;
    const [x0, y0, x1, y1] = nums;
    return { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
  } catch (e) { return null; }
}

// Map a rect through the page's /Rotate into displayed coordinates (fix b:
// never place a page whose /Rotate we haven't accounted for). Rects are
// media-origin-relative, y-up. W/H are the RAW media dims.
function displayRect(rect, rot, W, H) {
  const pts = [[rect.x, rect.y], [rect.x + rect.w, rect.y + rect.h]];
  const map = ([u, v]) => rot === 90 ? [v, W - u] : rot === 180 ? [W - u, H - v] : rot === 270 ? [H - v, u] : [u, v];
  const [p1, p2] = pts.map(map);
  return { x: Math.min(p1[0], p2[0]), y: Math.min(p1[1], p2[1]), w: Math.abs(p2[0] - p1[0]), h: Math.abs(p2[1] - p1[1]) };
}

const DIM_EPS = 0.02; // inches — dimension match tolerance (~1.4pt)

// Resolve where the finished piece lives on a source page + how it sits in a
// layout cell. Box priority (fix c): TrimBox → BleedBox−0.125″ → MediaBox
// heuristics. Scaling is always fit-to-trim (contain) — NEVER fill-crop.
function resolveSideArt(page, pieceLong, pieceShort, cellLandscape, bleed) {
  const B = isFinite(bleed) ? bleed : BLEED;
  const notes = [];
  const rot = ((page.getRotation().angle % 360) + 360) % 360;
  const mb = page.getMediaBox();
  const W = mb.width, H = mb.height;
  const rel = b => ({ x: b.x - mb.x, y: b.y - mb.y, w: b.w, h: b.h });

  let trimRaw = null;
  const tb = getPageBox(page, "TrimBox");
  if (tb && (Math.abs(tb.w - W) > 1 || Math.abs(tb.h - H) > 1)) {
    trimRaw = rel(tb); notes.push("art located by embedded TrimBox");
  }
  if (!trimRaw) {
    const bb = getPageBox(page, "BleedBox");
    if (bb && (Math.abs(bb.w - W) > 1 || Math.abs(bb.h - H) > 1)) {
      const r = rel(bb);
      trimRaw = { x: r.x + B * PT, y: r.y + B * PT, w: r.w - 2 * B * PT, h: r.h - 2 * B * PT };
      notes.push(`art located by embedded BleedBox − ${B}″ bleed`);
    }
  }
  const dispW = (rot % 180 ? H : W) / PT, dispH = (rot % 180 ? W : H) / PT;
  const aLong = Math.max(dispW, dispH), aShort = Math.min(dispW, dispH);
  if (!trimRaw) {
    if (Math.abs(aLong - (pieceLong + 2 * B)) < DIM_EPS && Math.abs(aShort - (pieceShort + 2 * B)) < DIM_EPS) {
      trimRaw = { x: B * PT, y: B * PT, w: W - 2 * B * PT, h: H - 2 * B * PT };
      notes.push(`page size = trim + ${2 * B}″ — treated as bleed-inclusive`);
    } else if (Math.abs(aLong - pieceLong) < DIM_EPS && Math.abs(aShort - pieceShort) < DIM_EPS) {
      trimRaw = { x: 0, y: 0, w: W, h: H };
      notes.push("page size = exact trim — NO BLEED in source file");
    } else {
      trimRaw = { x: 0, y: 0, w: W, h: H };
      notes.push(`page size ${aLong.toFixed(2)}×${aShort.toFixed(2)}″ matches neither trim nor trim+bleed — fit-to-trim scaled (content is never crop-filled)`);
    }
  }

  const trimDisp = displayRect(trimRaw, rot, W, H);
  // Cell rotation (fix b): rotate 90° ONLY when the art's own displayed
  // orientation differs from the cell's — never to squeeze art in.
  const artLandscape = trimDisp.w >= trimDisp.h;
  const cellRotate = artLandscape === cellLandscape ? 0 : 90;

  const effW = (cellRotate ? trimDisp.h : trimDisp.w) / PT;
  const effH = (cellRotate ? trimDisp.w : trimDisp.h) / PT;
  const cellW = cellLandscape ? pieceLong : pieceShort;
  const cellH = cellLandscape ? pieceShort : pieceLong;
  let scale = 1;
  if (Math.abs(effW - cellW) >= DIM_EPS || Math.abs(effH - cellH) >= DIM_EPS) {
    scale = Math.min(cellW / effW, cellH / effH); // contain — letterboxed, never cropped
    notes.push(`art trim ${effW.toFixed(2)}×${effH.toFixed(2)}″ ≠ spec trim ${cellW}×${cellH}″ — fit-to-trim scaled ×${scale.toFixed(4)}`);
  }
  const hasBleed = (W - trimRaw.w > 1) || (H - trimRaw.h > 1);
  if (!hasBleed) notes.push("no bleed available — cut lines may show paper white");

  return { page, rot, mediaW: W, mediaH: H, trimRaw, cellRotate, scale, hasBleed, notes,
           placedW: cellW, placedH: cellH };
}

// ---- add-bleed ink-edge detection -----------------------------------------
// Rasterize a source page (pdf.js, low DPI) and measure how far the actual
// ink stops short of each trim edge, in DISPLAY-space inches. A small
// shortfall (≤ SYNTH_MAXFIX) means the designer intended full bleed but the
// art fell shy — mirroring/scaling from the page edge would accentuate that
// white sliver, so the synth pre-scales past it. A LARGE margin is a design
// choice (white border, centered text page) and is left alone (gap → 0).
const SYNTH_MAXFIX = 0.1875; // in — biggest shortfall treated as "meant to bleed"
const SYNTH_MINGAP = 0.011;  // in — below raster resolution, treat as touching
const INK_DPI = 144, INK_LUM = 245;
async function detectInkGaps(pdfjsDoc, pnoZero, art) {
  const page = await pdfjsDoc.getPage(pnoZero + 1);
  const scale = INK_DPI / 72;
  const vp = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const td = displayRect(art.trimRaw, art.rot, art.mediaW, art.mediaH);
  const dispH = art.rot % 180 ? art.mediaW : art.mediaH;
  const x0 = Math.max(0, Math.floor(td.x * scale));
  const x1 = Math.min(canvas.width, Math.ceil((td.x + td.w) * scale));
  const r0 = Math.max(0, Math.floor((dispH - (td.y + td.h)) * scale));
  const r1 = Math.min(canvas.height, Math.ceil((dispH - td.y) * scale));
  if (x1 - x0 < 4 || r1 - r0 < 4) return null;
  const img = ctx.getImageData(x0, r0, x1 - x0, r1 - r0);
  const Wp = img.width, Hp = img.height, d = img.data;
  let minX = Wp, maxX = -1, minR = Hp, maxR = -1;
  for (let y = 0; y < Hp; y++) for (let x = 0; x < Wp; x++) {
    const i = (y * Wp + x) * 4;
    if (d[i] < INK_LUM || d[i + 1] < INK_LUM || d[i + 2] < INK_LUM) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minR) minR = y; if (y > maxR) maxR = y;
    }
  }
  if (maxX < 0) return null; // blank page — nothing to bleed
  const toIn = p => p / INK_DPI;
  // canvas rows grow downward: minR rows of white at the TOP edge
  return { left: toIn(minX), right: toIn(Wp - 1 - maxX), top: toIn(minR), bottom: toIn(Hp - 1 - maxR) };
}

// Detect text objects sitting close to each trim edge (raw page space).
// Mirror bleed would reflect a READABLE copy of such text into the bleed
// ring — the "auto" synth method switches those edges to streak bleed.
const TEXT_ZONE_PAD = 0.04; // in — beyond the bleed depth, catches descenders
const STREAK_EPS = 0.025;   // in — sliver width stretched outward by streak bleed
async function detectTextNearEdges(pdfjsDoc, pnoZero, art, bleed) {
  const page = await pdfjsDoc.getPage(pnoZero + 1);
  const tc = await page.getTextContent();
  const v = page.view; // [x0,y0,x1,y1] media box, pts
  const T = art.trimRaw; // pts, relative to media origin, y-up
  const zone = (bleed + TEXT_ZONE_PAD) * PT;
  const near = { left: false, right: false, top: false, bottom: false };
  for (const it of tc.items || []) {
    if (!it.str || !it.str.trim() || !it.transform) continue;
    const tx = it.transform[4] - v[0], ty = it.transform[5] - v[1];
    const w = it.width || 0, h = it.height || Math.hypot(it.transform[1], it.transform[3]) || 0;
    const x0 = tx, x1 = tx + w, y0 = ty - 0.25 * h, y1 = ty + h; // pad baseline for descenders
    if (x1 < T.x || x0 > T.x + T.w || y1 < T.y || y0 > T.y + T.h) continue; // outside trim
    if (x0 < T.x + zone) near.left = true;
    if (x1 > T.x + T.w - zone) near.right = true;
    if (y0 < T.y + zone) near.bottom = true;
    if (y1 > T.y + T.h - zone) near.top = true;
  }
  return near;
}

// Synthesize bleed for no-bleed source art:
//   "mirror" — reflect the art's edge content outward past trim (classic
//              prepress mirror bleed; content at the cut line stays put).
//   "scale"  — enlarge the art just enough to cover the bleed box (content
//              grows ~2b/shortdim; safety margin shrinks by the same amount).
//   "streak" — stretch the outermost STREAK_EPS sliver of art outward to fill
//              the bleed (mirrored-stretch: continuous at the cut; any content
//              caught in the sliver smears into unreadable streaks).
//   "auto"   — mirror, except edges where text sits near trim get streak
//              (a mirror there would duplicate readable text).
// gaps (from detectInkGaps, display-space inches) make either mode "smart":
// fixable shortfalls fold into the scale factor so the synth never amplifies
// a white sliver at the cut. Only applies when the source page genuinely
// lacks bleed — files with real bleed are never touched.
function applySynthBleed(art, mode, bleed, gaps) {
  if (!mode || mode === "off" || art.hasBleed) return art;
  if (gaps && [gaps.left, gaps.right, gaps.top, gaps.bottom].every(g => g > SYNTH_MAXFIX)) {
    art.notes.push("edges are white by design (no ink near trim) — bleed synthesis skipped");
    return art;
  }
  art.synth = mode;
  art.synthB = isFinite(bleed) ? bleed : BLEED;
  const fix = g => (gaps && g > SYNTH_MINGAP && g <= SYNTH_MAXFIX) ? g : 0;
  // work in PLACED space: art.scale already maps the art's trim onto the cell
  const gs = gaps
    ? { left: fix(gaps.left) * art.scale, right: fix(gaps.right) * art.scale,
        top: fix(gaps.top) * art.scale, bottom: fix(gaps.bottom) * art.scale }
    : { left: 0, right: 0, top: 0, bottom: 0 };
  // display-orientation → placed-cell orientation (cellRotate swaps axes)
  const [gx1, gx2, gy1, gy2] = art.cellRotate ? [gs.top, gs.bottom, gs.left, gs.right]
                                              : [gs.left, gs.right, gs.top, gs.bottom];
  const hw = art.placedW / 2, hh = art.placedH / 2;
  // per edge: ink sits (h−g) from center and must reach h (mirror) or h+b
  // (scale) after ×f about the center → f = h/(h−g) or (h+b)/(h−g).
  const b = mode === "scale" ? art.synthB : 0;
  let f = 1;
  for (const [h, g] of [[hw, gx1], [hw, gx2], [hh, gy1], [hh, gy2]]) {
    if (mode === "scale" || g > 0) f = Math.max(f, (h + b) / (h - g));
  }
  art.synthScale = f;
  const short = Math.max(fix(gaps ? gaps.left : 0), fix(gaps ? gaps.right : 0), fix(gaps ? gaps.top : 0), fix(gaps ? gaps.bottom : 0));
  const last = art.notes.length - 1;
  if (art.notes[last] === "no bleed available — cut lines may show paper white") art.notes.pop();
  const tn = art.textNear;
  const streaked = mode === "auto" && tn ? ["left", "right", "top", "bottom"].filter(e => tn[e]) : [];
  art.notes.push((mode === "scale"
    ? `no bleed in source — art scaled up to cover ${art.synthB}″ bleed (trim-line content shifts outward by the same amount)`
    : mode === "streak" ? `no bleed in source — ${art.synthB}″ streak bleed synthesized (edge sliver stretched outward)`
    : mode === "auto" ? `no bleed in source — ${art.synthB}″ bleed synthesized (mirror${streaked.length ? `; streak on ${streaked.join("/")} — text near trim, a mirror would duplicate it` : ", no text near trim"})`
    : `no bleed in source — ${art.synthB}″ mirrored-edge bleed synthesized`)
    + (short ? ` · art stopped ${short.toFixed(3)}″ shy of trim — pre-scaled ×${f.toFixed(4)} so ink reaches the cut` : ""));
  return art;
}

// Stamp the art with its trim centered on targetTrim (inches, y-up),
// hard-clipped to clipRect so neighbours can never overlap (fix c/d).
function placeArt(outPage, embedded, art, targetTrim, clipRect, extraRotate) {
  const drawRot = (((art.cellRotate + (extraRotate || 0) - art.rot) % 360) + 360) % 360; // CCW for pdf-lib degrees()
  let s = art.scale;
  if (art.synth) s *= art.synthScale || 1; // scale-to-bleed and/or shortfall pre-scale
  const C = { x: (targetTrim.x + targetTrim.w / 2) * PT, y: (targetTrim.y + targetTrim.h / 2) * PT };
  const tc = { x: art.trimRaw.x + art.trimRaw.w / 2, y: art.trimRaw.y + art.trimRaw.h / 2 };
  // anchor = C − s·Rot(tc): drawPage maps raw (u,v) → anchor + s·Rot_ccw(u,v)
  const R = drawRot === 90 ? [-tc.y, tc.x] : drawRot === 180 ? [-tc.x, -tc.y] : drawRot === 270 ? [tc.y, -tc.x] : [tc.x, tc.y];
  const ax = C.x - s * R[0], ay = C.y - s * R[1];

  const cl = clipRect;
  outPage.pushOperators(
    PL.pushGraphicsState(),
    PL.moveTo(cl.x * PT, cl.y * PT),
    PL.lineTo((cl.x + cl.w) * PT, cl.y * PT),
    PL.lineTo((cl.x + cl.w) * PT, (cl.y + cl.h) * PT),
    PL.lineTo(cl.x * PT, (cl.y + cl.h) * PT),
    PL.closePath(),
    PL.clip(),
    PL.endPath(),
  );
  outPage.drawPage(embedded, { x: ax, y: ay, xScale: s, yScale: s, rotate: PL.degrees(drawRot) });
  outPage.pushOperators(PL.popGraphicsState());

  if (art.synth && art.synth !== "scale") {
    // Fill the bleed ring from the art's own edges. Per axis the transform is
    // a mirrored map about the trim edge with stretch factor k: k=1 is a true
    // mirror; k=b/STREAK_EPS stretches the outermost sliver into streaks
    // (text-safe — nothing readable survives the stretch). "auto" picks per
    // edge from detectTextNearEdges, mapped from raw page space through the
    // placed rotation. Each region is clipped to (region ∩ cell clip), so
    // interior butt cuts and the saddle spine stay untouched.
    const b = art.synthB, T = targetTrim;
    const xL = T.x, xR = T.x + T.w, yB = T.y, yT = T.y + T.h;
    const K = b / STREAK_EPS;
    const cyc = ["left", "bottom", "right", "top"]; // CCW edge cycle
    const rawEdge = e => cyc[(((cyc.indexOf(e) - drawRot / 90) % 4) + 4) % 4];
    const streaky = e => art.synth === "streak" || (art.synth === "auto" && art.textNear && art.textNear[rawEdge(e)]);
    const kx = { left: streaky("left") ? K : 1, right: streaky("right") ? K : 1 };
    const ky = { bottom: streaky("bottom") ? K : 1, top: streaky("top") ? K : 1 };
    const mX = (E, k) => [-k, 0, 0, 1, E * (1 + k) * PT, 0];   // mirrored map about x=E
    const mY = (F, k) => [1, 0, 0, -k, 0, F * (1 + k) * PT];   // mirrored map about y=F
    const mXY = (E, F, k1, k2) => [-k1, 0, 0, -k2, E * (1 + k1) * PT, F * (1 + k2) * PT];
    const regions = [
      { r: { x: xL - b, y: yB, w: b, h: T.h }, m: mX(xL, kx.left) },
      { r: { x: xR, y: yB, w: b, h: T.h }, m: mX(xR, kx.right) },
      { r: { x: xL, y: yB - b, w: T.w, h: b }, m: mY(yB, ky.bottom) },
      { r: { x: xL, y: yT, w: T.w, h: b }, m: mY(yT, ky.top) },
      { r: { x: xL - b, y: yB - b, w: b, h: b }, m: mXY(xL, yB, kx.left, ky.bottom) },
      { r: { x: xR, y: yB - b, w: b, h: b }, m: mXY(xR, yB, kx.right, ky.bottom) },
      { r: { x: xL - b, y: yT, w: b, h: b }, m: mXY(xL, yT, kx.left, ky.top) },
      { r: { x: xR, y: yT, w: b, h: b }, m: mXY(xR, yT, kx.right, ky.top) },
    ];
    for (const { r, m } of regions) {
      const ix = Math.max(r.x, cl.x), iy = Math.max(r.y, cl.y);
      const ix2 = Math.min(r.x + r.w, cl.x + cl.w), iy2 = Math.min(r.y + r.h, cl.y + cl.h);
      if (ix2 - ix < 0.002 || iy2 - iy < 0.002) continue;
      outPage.pushOperators(
        PL.pushGraphicsState(),
        PL.moveTo(ix * PT, iy * PT),
        PL.lineTo(ix2 * PT, iy * PT),
        PL.lineTo(ix2 * PT, iy2 * PT),
        PL.lineTo(ix * PT, iy2 * PT),
        PL.closePath(),
        PL.clip(),
        PL.endPath(),
        PL.concatTransformationMatrix(m[0], m[1], m[2], m[3], m[4], m[5]),
      );
      outPage.drawPage(embedded, { x: ax, y: ay, xScale: s, yScale: s, rotate: PL.degrees(drawRot) });
      outPage.pushOperators(PL.popGraphicsState());
    }
  }
}

function placeInCell(outPage, embedded, art, cell, extraRotate) {
  placeArt(outPage, embedded, art, cell.trim, cell.clip, extraRotate);
}

// Mirror cell positions for the back side so front/back register after the
// press flips the sheet (fix b — the #1 duplex imposition bug). "long" =
// sheet turns about its long axis (rows mirror); "short" = about its short
// axis (columns mirror). PPS layouts are center-symmetric so this is
// currently an identity — kept exact for future gang/asymmetric runs.
function mirrorCells(cells, layout, sheetFlip) {
  return cells.map(c => ({
    col: c.col, row: c.row, patRot: c.patRot,
    trim: mirrorRect(c.trim, layout, sheetFlip),
    clip: mirrorRect(c.clip, layout, sheetFlip),
  }));
}

// ── Marks layer ──
// The press images ONLY the printable area (e.g. 18.5×12.5 on 13×19) — a
// mark in the sheet margin would never print. All marks therefore live
// INSIDE the printable rect, sized "as size allows": each mark ray stops at
// the printable boundary or the nearest piece's bleed (clip) box, and is
// omitted entirely when there's no room (e.g. between pieces at standard
// 0.25″ gutter, where bleed meets bleed).
const MARK_GAP = BLEED;  // marks start just beyond the bleed
const MARK_LEN = 0.22;   // target length, in
const MARK_MIN = 0.05;   // less room than this → omit

// Longest clear run from (x, y) heading (dx, dy). Obstacle edges count as
// BLOCKED (edge-inclusive, ±LINE_EPS): at butt cut the mark rays would
// otherwise ride exactly along the shared trim lines and draw across the
// pieces — a ray probing into or along any piece's clip box returns 0.
function freeRun(x, y, dx, dy, maxLen, P, obstacles) {
  const LE = 0.01; // edge tolerance, in
  let len = dx > 0 ? P.x1 - x : dx < 0 ? x - P.x0 : dy > 0 ? P.y1 - y : y - P.y0;
  len = Math.min(len, maxLen);
  const px = x + dx * 0.02, py = y + dy * 0.02; // probe just ahead of the start
  for (const o of obstacles) {
    if (px > o.x - LE && px < o.x + o.w + LE && py > o.y - LE && py < o.y + o.h + LE) return 0; // ray heads into/along a piece
    if (dx !== 0) {
      if (y < o.y - LE || y > o.y + o.h + LE) continue;
      const d = dx > 0 ? o.x - x : x - (o.x + o.w);
      if (d >= -EPS) len = Math.min(len, d - 0.02);
    } else {
      if (x < o.x - LE || x > o.x + o.w + LE) continue;
      const d = dy > 0 ? o.y - y : y - (o.y + o.h);
      if (d >= -EPS) len = Math.min(len, d - 0.02);
    }
  }
  return len;
}

function drawMarks(page, layout, cells) {
  const P = printableRect(layout.sheet);
  const obstacles = cells.map(c => c.clip);
  const black = PL.rgb(0, 0, 0);
  const gap = layout.bleed;
  const mark = (x, y, dx, dy) => {
    const len = freeRun(x, y, dx, dy, MARK_LEN, P, obstacles);
    if (len >= MARK_MIN) page.drawLine({
      start: { x: x * PT, y: y * PT }, end: { x: (x + dx * len) * PT, y: (y + dy * len) * PT },
      thickness: 0.5, color: black,
    });
  };
  for (const c of cells) {
    const t = c.trim;
    // horizontal extensions of the bottom/top trim lines…
    mark(t.x - gap, t.y, -1, 0);        mark(t.x + t.w + gap, t.y, 1, 0);
    mark(t.x - gap, t.y + t.h, -1, 0);  mark(t.x + t.w + gap, t.y + t.h, 1, 0);
    // …and vertical extensions of the left/right trim lines
    mark(t.x, t.y - gap, 0, -1);        mark(t.x, t.y + t.h + gap, 0, 1);
    mark(t.x + t.w, t.y - gap, 0, -1);  mark(t.x + t.w, t.y + t.h + gap, 0, 1);
  }
}

// Slug line — placed in the largest clear band INSIDE the printable area
// (with the default lower-right jog that's the strip above the block).
// Returns false when no band has room, so the caller can warn.
function drawSlug(page, layout, font, info, cells) {
  const P = printableRect(layout.sheet);
  const b = {
    x0: Math.min(...cells.map(c => c.clip.x)),
    y0: Math.min(...cells.map(c => c.clip.y)),
    x1: Math.max(...cells.map(c => c.clip.x + c.clip.w)),
    y1: Math.max(...cells.map(c => c.clip.y + c.clip.h)),
  };
  const bands = [
    { x: P.x0 + 0.03, y: b.y1 + 0.05, h: P.y1 - b.y1 - 0.1, w: P.x1 - P.x0 - 0.06 }, // above the block
    { x: P.x0 + 0.03, y: P.y0 + 0.03, h: b.y0 - P.y0 - 0.1, w: P.x1 - P.x0 - 0.06 }, // below the block
    { x: P.x0 + 0.03, y: P.y0 + 0.03, h: 0.12, w: b.x0 - P.x0 - 0.08 },              // left of the block
    { x: b.x1 + 0.05, y: P.y0 + 0.03, h: 0.12, w: P.x1 - b.x1 - 0.08 },              // right of the block
  ];
  const spot = bands.find(bd => bd.h >= 0.11 && bd.w >= 2.2);
  if (!spot) return false;
  // slug is set in standard Helvetica (WinAnsi) — ASCII only, no ″/× glyphs
  const parts = [
    "PPS IMPOSED", info.side,
    info.orderRef ? `Order ${info.orderRef}` : null,
    info.jobName ? String(info.jobName).replace(/[^\x20-\x7E]/g, "?") : null,
    layout.booklet ? `pages ${layout.booklet.pw}x${layout.booklet.ph}in` : `${layout.pieceLong}x${layout.pieceShort}in`,
    layout.mismatch ? `MISMATCH ${layout.imp}-up placed vs ${layout.pricedImp}-up priced` : `${layout.imp}-up on ${layout.sheet.key}`,
    layout.efficient ? `EFFICIENT 13x27.5 (priced ${layout.pricedImp}-up/13x19)` : null,
    layout.gutter !== 0.25 ? (layout.gutter === 0 ? "BUTT-CUT" : `gutter ${layout.gutter}in`) : null,
    Math.abs(layout.bleed - BLEED) > EPS ? `bleed ${layout.bleed}in` : null,
    info.qty ? `qty ${info.qty} = ${info.sheets} sheet${info.sheets === 1 ? "" : "s"}` : null,
    info.date,
  ].filter(Boolean);
  page.drawText(parts.join("  ·  "), {
    x: spot.x * PT, y: spot.y * PT, size: 6, font, color: PL.rgb(0, 0, 0),
    maxWidth: spot.w * PT,
  });
  return true;
}

// ═══════════════════════════════════════════════════════════════
// SADDLE STITCH — printer-spread signature imposition
// ═══════════════════════════════════════════════════════════════
// Classic saddle pagination: pad to a multiple of 4; signature sheet k
// (0 = outermost = cover) carries pages [P−2k | 2k+1] on the outside and
// [2k+2 | P−2k−1] on the inside; folded and nested they read in order.
function mate(p) { return p % 2 ? p + 1 : p - 1; } // leaf-mate: back of page 1 is 2, etc.

function mirrorRect(r, layout, flip) {
  const W = layout.sheet.long, H = layout.sheet.short;
  return flip === "short" ? { x: W - r.x - r.w, y: r.y, w: r.w, h: r.h }
                          : { x: r.x, y: H - r.y - r.h, w: r.w, h: r.h };
}

// Split each spread cell into two page slots. Spine gets NO bleed — the two
// pages meet exactly at the fold; outer edges keep the cell's bleed clip.
// When the grid rotated the spread (90° CCW), the spread-left page lands in
// the bottom half of the cell.
function bookletSlots(layout) {
  const slots = [];
  for (const cell of layout.cells) {
    const t = cell.trim, cl = cell.clip;
    if (layout.booklet.spreadAlongX) {
      const cx = t.x + t.w / 2;
      slots.push(
        { half: "left",  rect: { x: t.x, y: t.y, w: t.w / 2, h: t.h }, clip: { x: cl.x, y: cl.y, w: cx - cl.x, h: cl.h } },
        { half: "right", rect: { x: cx,  y: t.y, w: t.w / 2, h: t.h }, clip: { x: cx,   y: cl.y, w: cl.x + cl.w - cx, h: cl.h } },
      );
    } else {
      const cy = t.y + t.h / 2;
      slots.push(
        { half: "left",  rect: { x: t.x, y: t.y, w: t.w, h: t.h / 2 }, clip: { x: cl.x, y: cl.y, w: cl.w, h: cy - cl.y } },
        { half: "right", rect: { x: t.x, y: cy,  w: t.w, h: t.h / 2 }, clip: { x: cl.x, y: cy,   w: cl.w, h: cl.y + cl.h - cy } },
      );
    }
  }
  return slots;
}

// Dashed fold guides at each spine position — same printable-area rule as
// the crop marks: they extend from just outside the spread's bleed box into
// whatever clear space exists.
function drawFoldMarks(page, layout, cells) {
  const P = printableRect(layout.sheet);
  const obstacles = cells.map(c => c.clip);
  const mark = (x, y, dx, dy) => {
    const len = freeRun(x, y, dx, dy, MARK_LEN, P, obstacles);
    if (len >= MARK_MIN) page.drawLine({
      start: { x: x * PT, y: y * PT }, end: { x: (x + dx * len) * PT, y: (y + dy * len) * PT },
      thickness: 0.5, color: PL.rgb(0, 0, 0), dashArray: [2, 2],
    });
  };
  for (const c of cells) {
    if (layout.booklet.spreadAlongX) {
      const x = c.trim.x + c.trim.w / 2;
      mark(x, c.clip.y - 0.02, 0, -1);
      mark(x, c.clip.y + c.clip.h + 0.02, 0, 1);
    } else {
      const y = c.trim.y + c.trim.h / 2;
      mark(c.clip.x - 0.02, y, -1, 0);
      mark(c.clip.x + c.clip.w + 0.02, y, 1, 0);
    }
  }
}

async function imposeSaddle(artBytes, spec, layout) {
  const warnings = [...layout.warnings];
  const bk = layout.booklet;
  const src = await PL.PDFDocument.load(artBytes, { ignoreEncryption: true });
  const n = src.getPageCount();
  if (n < 3) throw new Error(`Booklet artwork must be a multi-page PDF in reading order — got ${n} page(s)`);
  const P = Math.ceil(n / 4) * 4;
  if (P !== n) warnings.push(`page count ${n} padded to ${P} — ${P - n} blank page(s) at the back of the book`);
  const S = P / 4;
  if (S >= 8) warnings.push(`${S} nested sheets — v1 applies no creep/shingling compensation; check inner-page margins on thick stock`);

  const out = await PL.PDFDocument.create();
  const font = await out.embedFont(PL.StandardFonts.Helvetica);
  const embeds = await out.embedPdf(src, Array.from({ length: n }, (_, i) => i));

  // Resolve every page once (trim location, orientation, fit) in SPREAD
  // space — each slot is pw×ph regardless of how the grid rotated the spread.
  const slotLandscape = bk.pw >= bk.ph;
  const abPages = spec.addBleedPages || {};
  const abMode = i => {
    const m = abPages[i + 1] != null ? abPages[i + 1] : spec.addBleed;
    return m && m !== "off" ? m : null;
  };
  let inkDoc = null;
  const arts = [];
  const artCache = new Map(); // pages with identical geometry share one resolution
  for (let i = 0; i < n; i++) {
    const p = src.getPage(i);
    const mb = p.getMediaBox();
    const abm = abMode(i);
    // per-page synth (mode or ink gaps) breaks geometry sharing — key by page
    const key = abm ? `p${i}`
      : `${p.getRotation().angle}|${mb.x},${mb.y},${mb.width},${mb.height}|${JSON.stringify(getPageBox(p, "TrimBox"))}|${JSON.stringify(getPageBox(p, "BleedBox"))}`;
    let art = artCache.get(key);
    if (!art) {
      art = resolveSideArt(p, Math.max(bk.pw, bk.ph), Math.min(bk.pw, bk.ph), slotLandscape, layout.bleed);
      if (abm && !art.hasBleed) {
        let gaps = null;
        try {
          if (!inkDoc) inkDoc = await pdfjsLib.getDocument({ data: artBytes.slice(0) }).promise;
          if (spec.addBleedSmart !== false) gaps = await detectInkGaps(inkDoc, i, art);
        } catch (e) { warnings.push(`add-bleed ink detection failed on page ${i + 1} (${e.message}) — synthesized from the page edge instead`); }
        if (abm === "auto") {
          try { art.textNear = await detectTextNearEdges(inkDoc, i, art, layout.bleed); }
          catch (e) {
            art.textNear = { left: true, right: true, top: true, bottom: true };
            warnings.push(`text detection failed on page ${i + 1} (${e.message}) — streak bleed used on all edges`);
          }
        }
        applySynthBleed(art, abm, layout.bleed, gaps);
      }
      artCache.set(key, art);
    }
    arts.push(art);
  }
  arts[0].notes.forEach(nt => warnings.push("page 1: " + nt));
  const scaled = arts.filter(a => a.scale !== 1).length;
  if (scaled) warnings.push(`${scaled} of ${n} pages required fit-to-trim scaling`);
  const synCount = {};
  arts.forEach(a => { if (a.synth) synCount[a.synth] = (synCount[a.synth] || 0) + 1; });
  const synTotal = Object.values(synCount).reduce((s, v) => s + v, 0);
  const synPre = arts.filter(a => a.synth && a.synth !== "scale" && a.synthScale > 1.0001).length;
  if (synTotal) warnings.push(`add-bleed synthesized on ${synTotal} of ${n} pages (${Object.entries(synCount).map(([m, c]) => `${c} ${m}`).join(", ")}${synPre ? `; ${synPre} pre-scaled — art stopped shy of trim` : ""})`);

  const spreadRot = bk.spreadAlongX ? 0 : 90;
  const flip = spec.sheetFlip || "short"; // Fiery short-edge feed is the shop default
  // Tumble rule: the back needs 180° when the press flip axis is
  // perpendicular to the placed pages' head-to-foot axis.
  const headVertical = spreadRot % 180 === 0;
  const tumble = flip === "short" ? !headVertical : headVertical;

  const frontSlots = bookletSlots(layout);
  const qty = spec.qty || 0;
  const sheetsPerSig = qty ? Math.ceil(qty / bk.spreadsPerSide) : null;
  const totalSheets = sheetsPerSig ? sheetsPerSig * S : null;
  const dateStr = new Date().toISOString().slice(0, 10);
  const W = layout.sheet.long * PT, H = layout.sheet.short * PT;
  const pageLabels = [];

  for (let k = 0; k < S; k++) {
    const outside = { left: P - 2 * k, right: 2 * k + 1 };
    for (const inner of [false, true]) {
      const page = out.addPage([W, H]);
      const cells = inner ? mirrorCells(layout.cells, layout, flip) : layout.cells;
      for (const slot of frontSlots) {
        const frontPno = slot.half === "left" ? outside.left : outside.right;
        const pno = inner ? mate(frontPno) : frontPno;      // leaf-mate backs the same physical region
        if (pno > n) continue;                              // padded blank — cell stays empty, never filled
        const rect = inner ? mirrorRect(slot.rect, layout, flip) : slot.rect;
        const clip = inner ? mirrorRect(slot.clip, layout, flip) : slot.clip;
        placeArt(page, embeds[pno - 1], arts[pno - 1], rect, clip, spreadRot + (inner && tumble ? 180 : 0));
      }
      const label = `SIG ${k + 1}/${S} ${inner ? "INSIDE" : "OUTSIDE"}${k === 0 ? " (COVER)" : ""}`;
      pageLabels.push(label);
      if (spec.marks !== false) {
        drawMarks(page, layout, cells);
        drawFoldMarks(page, layout, cells);
        const placed = drawSlug(page, layout, font, {
          side: label + (sheetsPerSig ? ` · run ${sheetsPerSig} sheets` : ""),
          orderRef: spec.orderRef, jobName: spec.jobName,
          qty, sheets: totalSheets, date: dateStr,
        }, cells);
        if (!placed && k === 0 && !inner) warnings.push("no clear space inside the printable area for the slug line — omitted");
      }
      page.setMediaBox(0, 0, W, H); page.setCropBox(0, 0, W, H);
      page.setBleedBox(0, 0, W, H); page.setTrimBox(0, 0, W, H);
    }
  }

  out.setTitle(`IMPOSED ${spec.jobName || spec.orderRef || "booklet"} — ${P}pg saddle, ${bk.spreadsPerSide} spread(s)/side on ${layout.sheet.label}`);
  out.setProducer("PPS Auto-Imposition Tool");
  out.setCreator("PPS Auto-Imposition Tool");
  const bytes = await out.save({ useObjectStreams: false });

  // Preflight
  const check = await PL.PDFDocument.load(bytes);
  const issues = [];
  if (check.getPageCount() !== 2 * S) issues.push(`page count ${check.getPageCount()} ≠ ${2 * S} signature sides`);
  check.getPages().forEach((p, i) => {
    const m = p.getMediaBox();
    if (Math.abs(m.width - layout.sheet.long * PT) > 0.5 || Math.abs(m.height - layout.sheet.short * PT) > 0.5)
      issues.push(`sheet ${i + 1} MediaBox ${(m.width / PT).toFixed(2)}×${(m.height / PT).toFixed(2)}″ ≠ ${layout.sheet.long}×${layout.sheet.short}″`);
    if (!getPageBox(p, "TrimBox")) issues.push(`sheet ${i + 1} missing TrimBox`);
    if (!getPageBox(p, "BleedBox")) issues.push(`sheet ${i + 1} missing BleedBox`);
  });
  if (!layout.mismatch && layout.pricedImp >= 2 && layout.imp !== layout.pricedImp)
    issues.push(`placed ${layout.imp} pages/side ≠ priced ${layout.pricedImp}`);
  // imp:1 sizes intentionally run 1 spread/side on 13×27.5 — still pin that down
  if (!layout.mismatch && layout.pricedImp < 2 && !(bk.spreadsPerSide === 1 && layout.sheet.key === "13x27.5"))
    issues.push(`imp:1 size expected 1 spread/side on 13×27.5, got ${bk.spreadsPerSide} on ${layout.sheet.key}`);
  if (issues.length) throw new Error("Preflight FAILED: " + issues.join("; "));

  return {
    bytes, layout, warnings, sheets: totalSheets, pageLabels,
    sideReports: [{ side: "BOOKLET", pages: n, padded: P, signatures: S, spreadsPerSide: bk.spreadsPerSide, tumble, srcRotPages: arts.filter(a => a.rot).length }],
  };
}

// ── Main entry: impose artwork bytes onto press sheets ──
// spec: { calc, trimLong, trimShort, sides, qty, sheetFlip, backRotate,
//         jobName, orderRef, marks }
// artBytes: front (+back on page 2) PDF. backBytes: optional separate back PDF.
function layoutOpts(spec) {
  return {
    allowBestFit: !!spec.allowBestFit,
    efficient: !!spec.efficient,
    gutter: isFinite(spec.gutter) && spec.gutter !== null && spec.gutter !== "" ? +spec.gutter : null,
    offset: { mode: spec.offsetMode || "jog", right: +spec.offsetRight || 0.5, bottom: +spec.offsetBottom || 0.5 },
    pattern: spec.pattern || "straight",
    manualPattern: spec.manualPattern || null,
    forceRotated: spec.forceRotated || "auto",
    bleed: isFinite(spec.bleed) && spec.bleed !== null && spec.bleed !== "" ? +spec.bleed : null,
  };
}

async function imposePdf(artBytes, backBytes, spec) {
  const layout = computeLayout(spec.calc, spec.trimLong, spec.trimShort, layoutOpts(spec));
  if (spec.calc === "saddle") return imposeSaddle(artBytes, spec, layout);
  const warnings = [...layout.warnings];

  const srcFront = await PL.PDFDocument.load(artBytes, { ignoreEncryption: true });
  const nF = srcFront.getPageCount();
  if (nF < 1) throw new Error("Artwork PDF has no pages");
  const sides = spec.sides === 2 ? 2 : 1;
  const mode = ["gang", "stack", "each"].includes(spec.multiMode) ? spec.multiMode : "repeat";
  const backDoc = backBytes ? await PL.PDFDocument.load(backBytes, { ignoreEncryption: true }) : null;

  // add-bleed: per-page override map (1-based page keys, main file) falls
  // back to the job-level mode; back-file pages use the job-level mode.
  const abPages = spec.addBleedPages || {};
  const abMode = pno => {
    const m = abPages[pno + 1] != null ? abPages[pno + 1] : spec.addBleed;
    return m && m !== "off" ? m : null;
  };
  const inkDocs = {};
  async function inkDocFor(which) { // lazy pdf.js rasterizer per source file
    if (!inkDocs[which]) inkDocs[which] = await pdfjsLib.getDocument({ data: (which === "F" ? artBytes : backBytes).slice(0) }).promise;
    return inkDocs[which];
  }

  // ── Piece list: each piece = one finished item {front, back} page refs.
  // "repeat" = single-design step-and-repeat (page 1 [+2] only). "gang" /
  // "stack" treat a multipage COLLATED file as distinct pieces; 2-sided
  // without a separate back file reads pages front/back INTERLEAVED
  // (p1 = front of piece 1, p2 = its back, p3 = front of piece 2, …).
  const pieces = [];
  if (mode === "repeat") {
    let back = null;
    if (sides === 2) {
      if (backDoc) back = { doc: backDoc, pno: 0 };
      else if (nF >= 2) back = { doc: srcFront, pno: 1 };
      else throw new Error("2-sided job but artwork has only 1 page — drop a back-side PDF or use a 2-page file");
    }
    pieces.push({ front: { doc: srcFront, pno: 0 }, back });
    if (nF > sides) warnings.push(`file has ${nF} pages but multi-page handling is "repeat single design" — only page 1${sides === 2 && !backDoc ? "+2" : ""} used. Choose gang or cut & stack if the pages are different pieces.`);
  } else if (backDoc) {
    const nB = backDoc.getPageCount();
    const M = Math.min(nF, nB);
    if (sides === 2 && nF !== nB) warnings.push(`front file has ${nF} pages, back file ${nB} — using the first ${M} piece(s)`);
    for (let i = 0; i < M; i++) pieces.push({ front: { doc: srcFront, pno: i }, back: sides === 2 ? { doc: backDoc, pno: i } : null });
  } else if (sides === 2) {
    if (nF < 2) throw new Error("2-sided collated job needs at least 2 pages (front/back interleaved)");
    if (nF % 2) warnings.push(`odd page count (${nF}) — the last piece's back will be blank`);
    for (let i = 0; i < Math.ceil(nF / 2); i++) pieces.push({ front: { doc: srcFront, pno: 2 * i }, back: 2 * i + 1 < nF ? { doc: srcFront, pno: 2 * i + 1 } : null });
  } else {
    for (let i = 0; i < nF; i++) pieces.push({ front: { doc: srcFront, pno: i }, back: null });
  }

  const imp = layout.imp;
  // sheets per collated set: gang/stack pack pieces into cells; "each" gives
  // every piece its own full step-and-repeat sheet (own run quantity).
  const D = mode === "repeat" ? 1 : mode === "each" ? pieces.length : Math.ceil(pieces.length / imp);
  if (mode === "each") {
    warnings.push(`${pieces.length} piece(s), one full ${imp}-up sheet each — print each sheet's own quantity.`);
  } else if (mode !== "repeat") {
    const blanks = D * imp - pieces.length;
    warnings.push(`${pieces.length} collated piece(s) ${mode === "gang" ? "ganged in page order" : "distributed cut-&-stack (piles collate after cutting)"} across ${D} sheet${D === 1 ? "" : "s"}${blanks ? ` — ${blanks} leftover cell(s) stay blank` : ""}.`);
  }

  const cellLandscape = layout.cellW >= layout.cellH;
  const out = await PL.PDFDocument.create();
  const font = await out.embedFont(PL.StandardFonts.Helvetica);
  // qty semantics: repeat → total pieces; gang/stack → copies per collated set
  const sheets = spec.qty
    ? (mode === "repeat" ? Math.ceil(spec.qty / imp)
      : mode === "each" ? pieces.length * Math.ceil(spec.qty / imp)
      : spec.qty * D)
    : (mode === "repeat" ? null : D);
  const dateStr = new Date().toISOString().slice(0, 10);

  // Resolve + embed each DISTINCT source page once (fix a/d), shared across cells.
  const artCache = new Map(), embedCache = new Map();
  const keyOf = ref => (ref.doc === srcFront ? "F" : "B") + ref.pno;
  let scaledPages = 0;
  async function prepared(ref) {
    const key = keyOf(ref);
    if (!artCache.has(key)) {
      const art = resolveSideArt(ref.doc.getPage(ref.pno), layout.pieceLong, layout.pieceShort, cellLandscape, layout.bleed);
      const abm = ref.doc === backDoc ? (spec.addBleed && spec.addBleed !== "off" ? spec.addBleed : null) : abMode(ref.pno);
      if (abm && !art.hasBleed) {
        const which = ref.doc === backDoc ? "B" : "F";
        let gaps = null;
        if (spec.addBleedSmart !== false) {
          try { gaps = await detectInkGaps(await inkDocFor(which), ref.pno, art); }
          catch (e) { warnings.push(`add-bleed ink detection failed on ${keyOf(ref)} (${e.message}) — synthesized from the page edge instead`); }
        }
        if (abm === "auto") {
          try { art.textNear = await detectTextNearEdges(await inkDocFor(which), ref.pno, art, layout.bleed); }
          catch (e) { // can't prove the edges are text-free — streak everywhere
            art.textNear = { left: true, right: true, top: true, bottom: true };
            warnings.push(`text detection failed on ${keyOf(ref)} (${e.message}) — streak bleed used on all edges`);
          }
        }
        applySynthBleed(art, abm, layout.bleed, gaps);
      }
      if (key === keyOf(pieces[0].front)) art.notes.forEach(n => warnings.push("front: " + n));
      else if (sides === 2 && pieces[0].back && key === keyOf(pieces[0].back)) art.notes.forEach(n => warnings.push("back: " + n));
      else if (art.scale !== 1) scaledPages++;
      const [embedded] = await out.embedPdf(ref.doc, [ref.pno]);
      artCache.set(key, art); embedCache.set(key, embedded);
    }
    return { art: artCache.get(key), embedded: embedCache.get(key) };
  }

  // Reading order for piece assignment: top row first, left → right
  const reading = [...layout.cells].sort((a, b) => b.row - a.row || a.col - b.col);
  const flip = spec.sheetFlip || "short";
  const mirroredAll = mirrorCells(layout.cells, layout, flip);
  const mirrorOf = new Map(layout.cells.map((c, i) => [c, mirroredAll[i]]));

  // gang fills sheet-by-sheet in page order; stack deals pile-by-pile so the
  // cut piles, stacked in reading order, yield the collated sequence.
  const pieceAt = (s, slot) => {
    if (mode === "repeat") return pieces[0];
    if (mode === "each") return pieces[s];
    const idx = mode === "gang" ? s * imp + slot : slot * D + s;
    return idx < pieces.length ? pieces[idx] : null;
  };

  const pageLabels = [];
  let slugWarned = false, tumbleNoted = false;
  for (let s = 0; s < D; s++) {
    for (const sideIdx of (sides === 2 ? [0, 1] : [0])) {
      const page = out.addPage([layout.sheet.long * PT, layout.sheet.short * PT]);
      const cellsForMarks = sideIdx === 0 ? layout.cells : mirroredAll;
      for (let slot = 0; slot < reading.length; slot++) {
        const piece = pieceAt(s, slot);
        if (!piece) continue;                       // leftover cell stays deterministically empty
        const ref = sideIdx === 0 ? piece.front : piece.back;
        if (!ref) continue;                         // blank back (odd interleave)
        const { art, embedded } = await prepared(ref);
        const frontCell = reading[slot];
        const cell = sideIdx === 0 ? frontCell : mirrorOf.get(frontCell);
        // Back tumble: 180° whenever the press flip axis is perpendicular to
        // the placed art's head axis — proven by physical duplex simulation.
        let extraRot = 0;
        if (sideIdx === 1) {
          const headVertical = art.cellRotate % 180 === 0;
          const autoTumble = flip === "short" ? !headVertical : headVertical;
          const bmode = spec.backRotate === 0 || spec.backRotate === 180 ? spec.backRotate : "auto";
          extraRot = bmode === "auto" ? (autoTumble ? 180 : 0) : bmode;
          if (extraRot && !tumbleNoted) { tumbleNoted = true; warnings.push(`back rotated 180° (${bmode === "auto" ? "auto — registers with front under " + flip + "-edge flip" : "manual tumble"})`); }
        }
        placeInCell(page, embedded, art, cell, extraRot + (frontCell.patRot || 0));
      }
      const label = (sideIdx === 0 ? "FRONT" : "BACK") + (D > 1 ? ` ${s + 1}/${D}` : "") + (mode === "gang" ? " · GANG" : mode === "stack" ? " · CUT&STACK" : mode === "each" ? ` · PIECE ${s + 1}` : "");
      pageLabels.push(label);
      if (spec.marks !== false) {
        drawMarks(page, layout, cellsForMarks);
        const placed = drawSlug(page, layout, font, {
          side: label, orderRef: spec.orderRef, jobName: spec.jobName,
          qty: spec.qty, sheets, date: dateStr,
        }, cellsForMarks);
        if (!placed && !slugWarned) { slugWarned = true; warnings.push("no clear space inside the printable area for the slug line — omitted"); }
      }
      // Explicit page boxes (fix a)
      const w = layout.sheet.long * PT, h = layout.sheet.short * PT;
      page.setMediaBox(0, 0, w, h); page.setCropBox(0, 0, w, h);
      page.setBleedBox(0, 0, w, h); page.setTrimBox(0, 0, w, h);
    }
  }
  if (scaledPages) warnings.push(`${scaledPages} additional page(s) required fit-to-trim scaling`);

  const sideReports = [];
  const f0 = artCache.get(keyOf(pieces[0].front));
  if (f0) sideReports.push({ side: "FRONT", rot: f0.rot, cellRotate: f0.cellRotate, scale: f0.scale, hasBleed: f0.hasBleed, synth: f0.synth });
  if (sides === 2 && pieces[0].back) {
    const b0 = artCache.get(keyOf(pieces[0].back));
    if (b0) sideReports.push({ side: "BACK", rot: b0.rot, cellRotate: b0.cellRotate, scale: b0.scale, hasBleed: b0.hasBleed, synth: b0.synth });
  }
  if (mode !== "repeat") sideReports.push({ side: "COLLATED", pieces: pieces.length, sheetsPerSet: D, modeName: mode });

  out.setTitle(`IMPOSED ${spec.jobName || spec.orderRef || "job"} — ${layout.imp}-up on ${layout.sheet.label}`);
  out.setProducer("PPS Auto-Imposition Tool");
  out.setCreator("PPS Auto-Imposition Tool");
  const bytes = await out.save({ useObjectStreams: false });

  // ── Preflight (fix a): reload and validate before anything ships ──
  const check = await PL.PDFDocument.load(bytes);
  const issues = [];
  if (check.getPageCount() !== D * sides) issues.push(`page count ${check.getPageCount()} ≠ ${D * sides} sheet sides`);
  check.getPages().forEach((p, i) => {
    const m = p.getMediaBox();
    if (Math.abs(m.width - layout.sheet.long * PT) > 0.5 || Math.abs(m.height - layout.sheet.short * PT) > 0.5)
      issues.push(`sheet ${i + 1} MediaBox ${(m.width / PT).toFixed(2)}×${(m.height / PT).toFixed(2)}″ ≠ ${layout.sheet.long}×${layout.sheet.short}″`);
    if (!getPageBox(p, "TrimBox")) issues.push(`sheet ${i + 1} missing TrimBox`);
    if (!getPageBox(p, "BleedBox")) issues.push(`sheet ${i + 1} missing BleedBox`);
  });
  if (!layout.mismatch && !layout.efficient && layout.imp !== Math.round(layout.pricedImp)) issues.push(`placed ${layout.imp}-up ≠ priced ${layout.pricedImp}-up`);
  if (issues.length) throw new Error("Preflight FAILED: " + issues.join("; "));

  return { bytes, layout, warnings, sheets, sideReports, pageLabels, pieces: pieces.length, sheetsPerSet: D };
}

// ── Manifest parser: autofill spec from a *_manipulation_manifest.txt ──
function parseManifest(text) {
  const out = {};
  const trim = text.match(/Trim size:\s*([\d.]+)\s*[″"]?\s*[×x]\s*([\d.]+)/);
  if (trim) {
    out.rawW = +trim[1]; out.rawH = +trim[2]; // manifest order is width × height
    out.trimLong = Math.max(+trim[1], +trim[2]); out.trimShort = Math.min(+trim[1], +trim[2]);
  }
  if (/Booklet Specifications/i.test(text)) out.calc = "saddle";
  else if (/Brochure Specifications/i.test(text)) out.calc = "brochure";
  const sides = text.match(/Sides uploaded:\s*(.+)/);
  if (sides) out.sides = sides[1].includes("+") ? 2 : 1;
  const fname = text.match(/Filename:\s*(.+)/);
  if (fname) out.jobName = fname[1].trim();
  return out;
}

// Detect the finished trim size from a PDF's first page. An explicit
// TrimBox wins; otherwise decide whether the media size is bleed-inclusive
// by checking which interpretation lands on a "rounder" size (production
// trims are usually halves; quarter-inch values score lower). /Rotate is
// honoured so the detected size matches the displayed orientation.
const r16 = v => Math.round(v * 16) / 16;
function detectTrim(doc, bleed) {
  const page = doc.getPage(0);
  const rotSwap = (((page.getRotation().angle % 360) + 360) % 360) % 180 !== 0;
  const dims = (w, h) => rotSwap ? { w: h / PT, h: w / PT } : { w: w / PT, h: h / PT };
  const mb = page.getMediaBox();
  const tb = getPageBox(page, "TrimBox");
  if (tb && (Math.abs(tb.w - mb.width) > 1 || Math.abs(tb.h - mb.height) > 1)) {
    const d = dims(tb.w, tb.h);
    return { w: r16(d.w), h: r16(d.h), method: "embedded TrimBox" };
  }
  const b = isFinite(bleed) ? +bleed : BLEED;
  const media = dims(mb.width, mb.height);
  const inset = { w: media.w - 2 * b, h: media.h - 2 * b };
  const nice = v => Math.abs(v * 2 - Math.round(v * 2)) < 0.02 ? 2 : Math.abs(v * 4 - Math.round(v * 4)) < 0.02 ? 1 : 0;
  if (b > 0 && inset.w >= 1 && inset.h >= 1 && nice(inset.w) + nice(inset.h) > nice(media.w) + nice(media.h)) {
    return { w: r16(inset.w), h: r16(inset.h), method: `media size − ${2 * b}″ bleed` };
  }
  return { w: r16(media.w), h: r16(media.h), method: "exact media size (no bleed detected)" };
}

function sanitizeName(s) { return String(s || "").replace(/[^\w.\-]+/g, "_").replace(/_+/g, "_").slice(0, 60); }

function imposedFilename(spec, layout) {
  const bits = ["IMPOSED"];
  // Order-<id>-i<item> lets the admin queue mark IMPOSED per line item, not
  // per order — keep in sync with pps_impose_is_output_name() in PHP.
  if (spec.orderRef) bits.push("Order-" + sanitizeName(spec.orderRef) + (spec.itemRef ? "-i" + sanitizeName(spec.itemRef) : ""));
  if (spec.jobName) bits.push(sanitizeName(spec.jobName).replace(/\.pdf$/i, ""));
  if (layout.booklet) bits.push(`${layout.booklet.pw}x${layout.booklet.ph}`, "saddle", `${layout.booklet.spreadsPerSide}spread`, layout.sheet.key);
  else bits.push(`${layout.pieceLong}x${layout.pieceShort}`, `${layout.imp}up`, layout.sheet.key);
  return bits.join("_") + ".pdf";
}

// Engine surface for headless tests / console debugging
window.__ppsImpose = { imposePdf, computeLayout, flatImp, stickerImp, parseManifest, imposedFilename, detectTrim };
