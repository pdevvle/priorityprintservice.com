function App() {
  const [calc, setCalc] = useState("brochure");
  const [trimLong, setTrimLong] = useState(11);
  const [trimShort, setTrimShort] = useState(8.5);
  const [sides, setSides] = useState(1);
  const [qty, setQty] = useState(500);
  const [sheetFlip, setSheetFlip] = useState("short"); // Fiery presses feed 13" sheets short-edge first — duplex flips on the short edge
  const [backRotate, setBackRotate] = useState("auto");
  const [jobName, setJobName] = useState("");
  const [orderRef, setOrderRef] = useState("");
  const [itemRef, setItemRef] = useState(""); // order item id — tags the output filename so per-item IMPOSED detection works
  const [marks, setMarks] = useState(true);          // crop / trim marks
  const [foldMarks, setFoldMarks] = useState(true);  // saddle fold guides
  const [slugOn, setSlugOn] = useState(true);        // slug line
  const [sheetSel, setSheetSel] = useState("auto");  // parent sheet override
  const [sheetLong, setSheetLong] = useState(19);
  const [sheetShort, setSheetShort] = useState(13);
  const [sheetMargin, setSheetMargin] = useState(0.25);
  const [allowBestFit, setAllowBestFit] = useState(false);
  const [efficient, setEfficient] = useState(false);      // lay out on 13×27.5, multiple expands
  const [gutterMode, setGutterMode] = useState("auto");   // "auto" | fixed inches
  // Shared per-gap gutter editor (saddle signatures + flat/sticker grids).
  const [gapCols, setGapCols] = useState(null);           // manual column gaps (in), null = uniform/butt
  const [gapRows, setGapRows] = useState(null);           // manual row gaps (in), null = uniform/butt
  const [gapFill, setGapFill] = useState(null);           // manually place past the imageable area
  // Manual grid (flats/stickers): operator-set columns × rows + press sheet.
  const [gridOn, setGridOn] = useState(false);
  const [gridAcross, setGridAcross] = useState(1);
  const [gridDown, setGridDown] = useState(1);
  const [gridSheet, setGridSheet] = useState("auto");
  // Step and repeat (saddle): duplicate each signature N× on the press sheet.
  const [repOn, setRepOn] = useState(false);
  const [sigOrder, setSigOrder] = useState("repeat");  // repeat | gang | cutstack
  const [repN, setRepN] = useState(2);
  const [offsetMode, setOffsetMode] = useState("jog");    // jog lower-right 0.5″ | center | custom
  const [offsetRight, setOffsetRight] = useState(0.5);
  const [offsetBottom, setOffsetBottom] = useState(0.5);
  const [pattern, setPattern] = useState("straight");     // per-cell 180° gang pattern
  const [manualPattern, setManualPattern] = useState([]); // row-major 0/180 per cell (rows bottom-up)
  const [forceRotated, setForceRotated] = useState("auto");
  const [bleedIn, setBleedIn] = useState(0.125);           // per-job bleed override
  const [addBleed, setAddBleed] = useState("off");         // synthesize bleed for no-bleed files: off | mirror | scale
  const [addBleedSmart, setAddBleedSmart] = useState(true); // raster-detect art that stops shy of trim
  const [artScale, setArtScale] = useState(100);         // free scale on placed art, %
  const [creep, setCreep] = useState(0);
  const [spine, setSpine] = useState(0.25);      // perfect bound spine width, in                 // saddle shingling total, in
  const [artInset, setArtInset] = useState(0);            // pull art off the trim (in), fill makes up the difference
  const [streakEps, setStreakEps] = useState(0.025);       // streak sampler: outermost sliver width stretched into the bleed
  const [gangFiles, setGangFiles] = useState([]);          // manual gang combo: [{bytes,name,pageCount,slots}]
  const [cleanBusy, setCleanBusy] = useState(false);       // sanitize-only passthrough in flight
  const [addBleedPages, setAddBleedPages] = useState({});  // per-page mode overrides {1-based page: mode}
  const [multiMode, setMultiMode] = useState("repeat");    // multipage flat files: repeat | gang | stack
  const isSaddle = calc === "saddle";
  const isPB = calc === "perfect-bound";   // two press jobs, so no single live layout
  const [art, setArt] = useState(null);      // { bytes, name, pageCount }
  // Trim as MEASURED off the dropped file, kept in the file's own orientation.
  // Saddle reads the two size boxes as width × height (the spine is the height
  // edge); every other calc reads them as long × short. So the same numbers
  // mean different things per calc, and dropping a file before choosing the
  // product left a portrait booklet described as landscape — silently, because
  // the long/short pair is identical either way. Re-orient on every switch.
  const [detTrim, setDetTrim] = useState(null);
  const [backArt, setBackArt] = useState(null);
  const [result, setResult] = useState(null); // { bytes, layout, warnings, sheets, filename }
  const [busy, setBusy] = useState(false);
  const [queueBusy, setQueueBusy] = useState(null);
  const [refreshKey, setRefreshKey] = useState(0);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [uploadState, setUploadState] = useState({});     // per output filename: "uploading" | "done" | "failed: …"
  const [activeOrder, setActiveOrder] = useState(null);   // queue row currently loaded
  const [rows, setRows] = useState(null);                  // admin queue rows (WP mode)
  const [queueErr, setQueueErr] = useState("");
  const [bulkState, setBulkState] = useState(null);        // { done, total, current, failures[] }
  const [showHidden, setShowHidden] = useState(false);     // widen the queue to completed + parked orders
  const [rowBusy, setRowBusy] = useState("");              // order id whose status/hide call is in flight
  // Row-action failures get their OWN slot. queueErr replaces the whole table
  // (it means "the list could not load"), so reporting a failed status change
  // through it wiped the queue the operator was working from.
  const [actionErr, setActionErr] = useState("");
  const [refOpen, setRefOpen] = useState(false);           // metadata reference panel
  const genSeq = useRef(0);

  // Fetch the order queue (WP mode only)
  useEffect(() => {
    if (!CFG) return;
    let dead = false;
    setQueueErr("");
    ajax("pps_impose_list", { ...(refreshKey > 0 ? { refresh: 1 } : {}), ...(showHidden ? { show_hidden: 1 } : {}) })
      .then(async r => { if (!r.ok) throw await ajaxFail(r, "order list"); return r.json(); })
      .then(j => {
        if (dead) return;
        if (!j.success) throw new Error((j.data && j.data.message) || "list failed");
        setRows(j.data.items);
      })
      .catch(e => !dead && setQueueErr(e.message));
    return () => { dead = true; };
  }, [refreshKey, showHidden]);

  // ── Order status / visibility, straight from the queue ────────────────────
  // Both act on the ORDER, so every row sharing that order_id updates. A row
  // that leaves the work list (completed, or parked) is dropped from the view
  // unless "show completed & hidden" is on — the queue is a work list, and a
  // finished job staying on it is how things get imposed twice.
  const applyToOrder = (orderId, fn) =>
    setRows(rs => (rs || []).map(r => (r.order_id === orderId ? fn(r) : r)));
  const dropOrder = orderId =>
    setRows(rs => (rs || []).filter(r => r.order_id !== orderId));

  async function setOrderStatus(row, status) {
    if (status === row.status) return;
    const label = (CFG.orderStatuses || {})["wc-" + status] || status;
    if (!window.confirm(
      `Move order #${row.order_id} to "${label}"?\n\n` +
      `This is a real WooCommerce status change: it is recorded on the order and ` +
      `WooCommerce will send whatever customer email that status triggers.`)) return;
    setRowBusy(String(row.order_id));
    try {
      const r = await ajax("pps_impose_set_status", { order_id: row.order_id, status });
      if (!r.ok) throw await ajaxFail(r, "status change");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "status change failed");
      const d = j.data;
      if (d.done && !showHidden) { dropOrder(row.order_id); setNotice(`Order #${row.order_id} → ${d.label}. Off the queue.`); }
      else { applyToOrder(row.order_id, r2 => ({ ...r2, status: d.status, status_label: d.label })); setNotice(`Order #${row.order_id} → ${d.label}.`); }
      setActionErr("");
    } catch (e) { setActionErr(`Order #${row.order_id}: ${e.message}`); }
    finally { setRowBusy(""); }
  }

  async function setOrderHidden(row, hidden) {
    setRowBusy(String(row.order_id));
    try {
      const r = await ajax("pps_impose_set_hidden", { order_id: row.order_id, hidden: hidden ? 1 : 0 });
      if (!r.ok) throw await ajaxFail(r, hidden ? "hide" : "unhide");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "hide failed");
      if (hidden && !showHidden) { dropOrder(row.order_id); setNotice(`Order #${row.order_id} hidden. Tick “show completed & hidden” to bring it back.`); }
      else { applyToOrder(row.order_id, r2 => ({ ...r2, hidden })); }
      setActionErr("");
    } catch (e) { setActionErr(`Order #${row.order_id}: ${e.message}`); }
    finally { setRowBusy(""); }
  }

  useEffect(() => {
    if (!detTrim || activeOrder) return;
    if (isSaddle) { setTrimLong(detTrim.w); setTrimShort(detTrim.h); }   // width × height
    else { setTrimLong(Math.max(detTrim.w, detTrim.h)); setTrimShort(Math.min(detTrim.w, detTrim.h)); }
  }, [isSaddle, detTrim, activeOrder]);

  const spec = useMemo(() => ({
    calc, trimLong: +trimLong || 0, trimShort: +trimShort || 0,
    sides: +sides, qty: +qty || 0, sheetFlip,
    backRotate: backRotate === "auto" ? "auto" : +backRotate,
    jobName, orderRef, itemRef, marks, foldMarks, slug: slugOn, allowBestFit,
    sheet: sheetSel, sheetLong: +sheetLong || 0, sheetShort: +sheetShort || 0, sheetMargin: +sheetMargin,
    efficient, gutter: gutterMode === "auto" ? null : +gutterMode,
    offsetMode, offsetRight: +offsetRight, offsetBottom: +offsetBottom,
    pattern, manualPattern: pattern === "manual" ? manualPattern : null, forceRotated,
    bleed: +bleedIn, multiMode, addBleed, addBleedSmart, streakEps: +streakEps, artInset: +artInset || 0, artScale: +artScale || 100, creep: +creep || 0,
    addBleedPages: Object.keys(addBleedPages).length ? addBleedPages : null,
    saddleColGaps: gapCols, saddleRowGaps: gapRows, saddleFillSheet: gapFill,
    colGaps: gapCols, rowGaps: gapRows, fillSheet: gapFill,
    gridAcross: gridOn ? +gridAcross || 0 : null,
    gridDown: gridOn ? +gridDown || 0 : null,
    gridSheet: !isSaddle && gridOn && gridSheet !== "auto" ? gridSheet : null,
    sigRepeat: isSaddle && repOn && !gridOn ? +repN || 0 : null,
    sigOrder: isSaddle ? sigOrder : null,
    spine: isPB ? +spine || 0 : null,
  }), [calc, trimLong, trimShort, sides, qty, sheetFlip, backRotate, jobName, orderRef, itemRef, marks, foldMarks, slugOn, allowBestFit,
       sheetSel, sheetLong, sheetShort, sheetMargin,
       efficient, gutterMode, offsetMode, offsetRight, offsetBottom, pattern, manualPattern, forceRotated, bleedIn, multiMode, addBleed, addBleedSmart, streakEps, artInset, artScale, creep, addBleedPages,
       gapCols, gapRows, gapFill, isSaddle, gridOn, gridAcross, gridDown, gridSheet, repOn, repN, sigOrder, spine, isPB]);
  const debSpec = useDebounced(spec, 450);

  // Live layout (no artwork needed) — schematic + parity badge
  const layoutInfo = useMemo(() => {
    try {
      if (!(debSpec.trimLong >= 2 && debSpec.trimShort >= 2)) return { error: "Enter trim size (min 2″)" };
      // Perfect bound has no single layout to preview — it images as two press
      // jobs on different stock. The per-part cards below carry each layout.
      if (debSpec.calc === "perfect-bound") {
        const sp = +debSpec.spine;
        if (!isFinite(sp) || sp <= 0) return { error: "Enter the spine width (inches) — measure the glued book block." };
        if (sp > 3) return { error: `Spine ${sp}″ is beyond the 3″ limit — check the value is inches, not millimetres.` };
        return { pb: true };
      }
      return { layout: computeLayout(debSpec.calc, debSpec.trimLong, debSpec.trimShort, layoutOpts(debSpec)) };
    } catch (e) { return { error: e.message }; }
  }, [debSpec]);

  // Auto-regenerate the imposed PDF when spec or art changes
  useEffect(() => {
    const ganging = gangFiles.length >= 2;
    if ((!art && !ganging) || (!layoutInfo.layout && !layoutInfo.pb)) { setResult(null); return; }
    const seq = ++genSeq.current;
    setBusy(true); setError(""); setUploadState({});
    imposePdf(art ? art.bytes : null, (debSpec.calc === "perfect-bound" || debSpec.sides === 2) ? (backArt && backArt.bytes) : null, debSpec,
              ganging ? gangFiles.map(g => ({ bytes: g.bytes, name: g.name, slots: g.slots === "" ? null : +g.slots })) : null)
      .then(res => {
        if (seq !== genSeq.current) return;
        // Perfect bound returns two parts, each with its own layout and its own
        // filename — the COVER and GUTS suffixes keep them apart in the order's
        // Drive folder and in the queue's IMPOSED detection.
        if (res.parts) {
          res.parts.forEach(pt => {
            pt.filename = imposedFilename({ ...debSpec, jobName: (debSpec.jobName || "book") + "_" + pt.part.toUpperCase() }, pt.layout);
          });
        } else {
          res.filename = imposedFilename(debSpec, res.layout);
        }
        setResult(res);
      })
      .catch(e => { if (seq === genSeq.current) { setResult(null); setError(e.message); } })
      .finally(() => { if (seq === genSeq.current) setBusy(false); });
  }, [art, backArt, gangFiles, debSpec, layoutInfo.layout ? 1 : 0]);

  const makeCleanCopy = async () => {
    if (!art) return;
    setCleanBusy(true); setError("");
    try {
      const res = await sanitizePdf(art.bytes);
      dlBytes(res.bytes, "CLEAN_" + art.name.replace(/\.pdf$/i, "") + ".pdf");
      setNotice(res.threats.length
        ? `CLEAN copy downloaded — stripped: ${res.threats.join("; ")}`
        : "CLEAN copy downloaded — no active content found; sanitized anyway.");
    } catch (e) { setError("Sanitize failed: " + e.message); }
    setCleanBusy(false);
  };

  const sendCleanToDrive = async () => {
    if (!art || !activeOrder || !CFG) return;
    setCleanBusy(true); setError("");
    try {
      const res = await sanitizePdf(art.bytes);
      const base = art.name.replace(/\.pdf$/i, "").replace(/[^\w.-]+/g, "_").slice(0, 80);
      const fname = `CLEAN_Order-${activeOrder.order_id}${activeOrder.item_id ? "-i" + activeOrder.item_id : ""}_${base}.pdf`;
      const fd = new FormData();
      fd.append("action", "pps_impose_upload");
      fd.append("nonce", CFG.nonce);
      fd.append("order_id", activeOrder.order_id);
      fd.append("filename", fname);
      fd.append("file", new Blob([res.bytes], { type: "application/pdf" }), fname);
      const r = await fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin" });
      if (!r.ok) throw await ajaxFail(r, "upload");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "upload failed");
      setNotice(`CLEAN copy filed to order #${activeOrder.order_id}'s Drive folder as ${fname}` +
                (res.threats.length ? ` — stripped: ${res.threats.join("; ")}` : " — no active content found."));
    } catch (e) { setError("CLEAN upload failed: " + e.message); }
    setCleanBusy(false);
  };

  const addGangFiles = async files => {
    const added = [];
    for (const f of files) {
      if (!/\.pdf$/i.test(f.name)) { setError(`"${f.name}" is not a PDF`); continue; }
      const bytes = new Uint8Array(await f.arrayBuffer());
      let pageCount = 0;
      try { pageCount = (await PL.PDFDocument.load(bytes, { ignoreEncryption: true })).getPageCount(); }
      catch (e) { setError(`"${f.name}" could not be parsed as a PDF: ` + e.message); continue; }
      added.push({ bytes, name: f.name, pageCount, slots: "" });
    }
    if (added.length) setGangFiles(prev => [...prev, ...added]);
  };

  const onFiles = async (files, slot) => {
    setError("");
    for (const f of files) {
      if (/\.txt$/i.test(f.name)) {
        const t = await f.text();
        const m = parseManifest(t);
        // saddle keeps width×height as-is (spine = height edge); flats normalize
        if (m.trimLong) {
          if (m.calc === "saddle") { setTrimLong(m.rawW); setTrimShort(m.rawH); }
          else { setTrimLong(m.trimLong); setTrimShort(m.trimShort); }
        }
        if (m.calc) setCalc(m.calc);
        if (m.sides) setSides(m.sides);
        if (m.jobName && !jobName) setJobName(m.jobName);
        setNotice("Spec autofilled from manifest: " + f.name);
        continue;
      }
      if (!/\.pdf$/i.test(f.name)) { setError(`"${f.name}" is not a PDF — the imposition input must be the print-ready or raw PDF.`); continue; }
      const bytes = new Uint8Array(await f.arrayBuffer());
      let pageCount = 0, det = null, threats = [];
      try {
        const doc = await PL.PDFDocument.load(bytes, { ignoreEncryption: true });
        pageCount = doc.getPageCount();
        try { det = detectTrim(doc, +bleedIn); } catch (e2) { /* detection is best-effort */ }
        try { threats = inspectPdfThreats(doc); } catch (e3) { threats = ["threat inspection failed — treat with care"]; }
      }
      catch (e) { setError(`"${f.name}" could not be parsed as a PDF: ` + e.message); continue; }
      if (slot === "back") setBackArt({ bytes, name: f.name, pageCount, threats });
      else {
        setArt({ bytes, name: f.name, pageCount, threats });
        setDetTrim(det ? { w: det.w, h: det.h } : null);
        setAddBleedPages({}); // per-page overrides belong to the previous file
        if (!jobName) setJobName(f.name.replace(/\.pdf$/i, ""));
        if (det) {
          const specL = Math.max(+trimLong || 0, +trimShort || 0), specS = Math.min(+trimLong || 0, +trimShort || 0);
          const detL = Math.max(det.w, det.h), detS = Math.min(det.w, det.h);
          const differs = Math.abs(detL - specL) > 0.03 || Math.abs(detS - specS) > 0.03;
          // For saddle the ORIENTATION is part of the spec — the spine sits on
          // the height edge — and a swap has the same long/short pair, so
          // `differs` cannot see it. Check it separately or a landscape entry
          // sails through and every page prints sideways.
          const flipped = isSaddle && !differs
            && Math.abs(det.w - det.h) > 0.03
            && ((+trimShort > +trimLong) !== (det.h > det.w));
          if (activeOrder) {
            // order spec is authoritative — but flag a measurement conflict loudly
            if (differs) setNotice(`⚠ "${f.name}" measures ${det.w}×${det.h}″ (${det.method}) but the order spec is ${specL}×${specS}″ — check that this is the right file/spec before printing.`);
            else if (flipped) setNotice(`⚠ "${f.name}" is ${det.w}×${det.h}″ (${det.h > det.w ? "portrait" : "landscape"}) but the order spec reads ${trimLong}×${trimShort}″ — saddle folds on the height edge, so imposing as-is would turn every page 90°. Swap the page width/height before printing.`);
          } else {
            if (isSaddle) { setTrimLong(det.w); setTrimShort(det.h); }
            else { setTrimLong(detL); setTrimShort(detS); }
            setNotice(`Trim auto-detected: ${det.w}×${det.h}″ (${det.method}).` + (pageCount > (sides === 2 ? 2 : 1) && !isSaddle ? ` File has ${pageCount} pages — set "Multi-page file" to gang or cut & stack if they're different pieces.` : ""));
          }
        }
        // A 2-page file usually means front+back — switch, but say so, since
        // page 2 could also be notes/a proof sheet the operator must exclude.
        if (pageCount >= 2 && sides === 1 && !isSaddle) {
          setSides(2);
          setNotice(`"${f.name}" has ${pageCount} pages — switched to 2-sided (page 1 = front, page 2 = back). Set Sides back to 1 if page 2 isn't the back.`);
        }
      }
    }
  };

  // ── WP queue: load an order row, fetch its artwork, impose ──
  const loadOrder = async (row) => {
    const key = row.order_id + ":" + row.item_id;
    setQueueBusy(key); setError(""); setNotice(""); setUploadState({});
    try {
      const s = specFromRow(row);
      setItemRef(s.itemRef); setCalc(s.calc);
      setTrimLong(s.trimLong); setTrimShort(s.trimShort);
      setSides(s.sides); setQty(s.qty);
      setJobName(s.jobName); setOrderRef(s.orderRef);
      setActiveOrder(row);
      const r = await ajax("pps_impose_download", { file_id: row.art_file_id });
      if (!r.ok) throw await ajaxFail(r, "artwork download");
      const bytes = new Uint8Array(await r.arrayBuffer());
      const doc = await PL.PDFDocument.load(bytes, { ignoreEncryption: true });
      const pageCount = doc.getPageCount();
      let threats = [];
      try { threats = inspectPdfThreats(doc); } catch (e3) { threats = ["threat inspection failed — treat with care"]; }
      setArt({ bytes, name: row.art_file_name, pageCount, threats });
      setAddBleedPages({});
      setBackArt(null);
      let note = `Loaded order #${row.order_id} artwork (${row.art_file_name}, ${pageCount} page${pageCount === 1 ? "" : "s"}). Review the preview, then Send to Drive.`;
      try {
        const det = detectTrim(doc, +bleedIn);
        const specL = Math.max(s.trimLong, s.trimShort), specS = Math.min(s.trimLong, s.trimShort);
        if (Math.abs(Math.max(det.w, det.h) - specL) > 0.03 || Math.abs(Math.min(det.w, det.h) - specS) > 0.03) {
          note = `⚠ Artwork measures ${det.w}×${det.h}″ (${det.method}) but order #${row.order_id} is specced ${specL}×${specS}″ — verify before printing. ` + note;
        }
      } catch (e2) { /* best-effort */ }
      setNotice(note);
    } catch (e) { setError(e.message); }
    finally { setQueueBusy(null); }
  };

  const sendToDrive = async (res) => {
    if (!res || !activeOrder) return;
    const mark = v => setUploadState(u => ({ ...u, [res.filename]: v }));
    mark("uploading");
    try {
      const fd = new FormData();
      fd.append("action", "pps_impose_upload");
      fd.append("nonce", CFG.nonce);
      fd.append("order_id", activeOrder.order_id);
      fd.append("filename", res.filename);
      fd.append("file", new Blob([res.bytes], { type: "application/pdf" }), res.filename);
      const r = await fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin" });
      if (!r.ok) throw await ajaxFail(r, "upload");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "upload failed");
      mark("done");
      setNotice(`Imposed PDF filed to the order #${activeOrder.order_id} Drive folder as ${res.filename}.`);
      setRefreshKey(k => k + 1);
    } catch (e) { mark("failed: " + e.message); }
  };

  // Bulk: impose + file every pending row, sequentially, headless (does not
  // touch the form). Each row uses the exact spec the per-row flow would.
  const imposeAll = async () => {
    const pending = (rows || []).filter(rowPending);
    if (!pending.length) return;
    setBulkState({ done: 0, total: pending.length, current: "", failures: [] });
    const failures = [];
    for (let i = 0; i < pending.length; i++) {
      const row = pending[i];
      const label = `#${row.order_id} ${row.job_name || row.product || ""}`.trim();
      setBulkState({ done: i, total: pending.length, current: label, failures });
      try {
        const s = specFromRow(row);
        const r = await ajax("pps_impose_download", { file_id: row.art_file_id });
        if (!r.ok) throw await ajaxFail(r, "artwork download");
        const bytes = new Uint8Array(await r.arrayBuffer());
        const res = await imposePdf(bytes, null, s);
        const filename = imposedFilename(s, res.layout);
        const fd = new FormData();
        fd.append("action", "pps_impose_upload");
        fd.append("nonce", CFG.nonce);
        fd.append("order_id", row.order_id);
        fd.append("filename", filename);
        fd.append("file", new Blob([res.bytes], { type: "application/pdf" }), filename);
        const up = await fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin" });
        if (!up.ok) throw await ajaxFail(up, "upload");
        const j = await up.json();
        if (!j.success) throw new Error((j.data && j.data.message) || "upload failed");
      } catch (e) {
        failures.push(`${label}: ${e.message}`);
      }
    }
    setBulkState({ done: pending.length, total: pending.length, current: "", failures });
    setNotice(`Bulk impose finished: ${pending.length - failures.length}/${pending.length} filed to Drive.`
      + (failures.length ? " Failures listed below." : ""));
    setError(failures.join("\n"));
    setRefreshKey(k => k + 1);
  };

  const pendingCount = (rows || []).filter(rowPending).length;

  const lay = layoutInfo.layout;
  const parityOk = lay && !lay.mismatch && !lay.efficient && !lay.fillSheet && !lay.manualGrid && (lay.booklet
    ? (lay.pricedImp < 2 || lay.imp === lay.pricedImp)   // imp:1 presets legitimately move to the 27.5 sheet
    : lay.imp === Math.round(lay.pricedImp));

  return (
    <div style={{ maxWidth: 1220, margin: "0 auto", padding: "18px 16px 60px" }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 16, flexWrap: "wrap" }}>
        <h1 style={{ fontSize: 20, margin: 0 }}>🖨️ PPS Imposition Tool</h1>
        <span style={{ fontSize: 12, color: "rgba(255,255,255,.4)" }}>
          vector-preserving sheetwise step-and-repeat · {CFG ? "connected to WooCommerce + Google Drive" : "standalone mode (drag & drop)"}
        </span>
        <button className="imp-btn sec" style={{ padding: "4px 11px", fontSize: 12, marginLeft: "auto" }}
                onClick={() => setRefOpen(v => !v)} aria-expanded={refOpen}>
          {refOpen ? "− " : "+ "}Order metadata reference
        </button>
      </div>

      {refOpen && <MetaRef onClose={() => setRefOpen(false)} />}

      {CFG && CFG.gdrive === false && (
        <div className="imp-card" style={{ marginBottom: 16, borderColor: "rgba(239,68,68,.4)" }}>
          <div style={{ fontSize: 13, color: "#f87171" }}>
            Google Drive is not connected — connect it under <b>PPS Calculators → Google Drive</b>. The order queue, artwork downloads, and uploads will fail until then.
          </div>
        </div>
      )}
      {CFG && (
        <div className="imp-card" style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 10, flexWrap: "wrap" }}>
            <span className="lbl" style={{ marginBottom: 0 }}>
              {showHidden ? "All recent orders with artwork on Drive" : "Orders still to impose"}
            </span>
            <span style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <label style={{ fontSize: 12, display: "flex", gap: 6, alignItems: "center", cursor: "pointer", color: "rgba(255,255,255,.6)" }}
                     title="Completed orders and orders you have hidden drop off the work list. Tick this to see them and put them back.">
                <input type="checkbox" checked={showHidden} style={{ width: "auto" }}
                       onChange={e => setShowHidden(e.target.checked)} />
                show completed &amp; hidden
              </label>
              {pendingCount > 0 && (
                <button className="imp-btn" style={{ padding: "5px 12px", fontSize: 12 }}
                  disabled={!!bulkState && bulkState.done < bulkState.total} onClick={imposeAll}>
                  {bulkState && bulkState.done < bulkState.total
                    ? `Imposing ${bulkState.done + 1}/${bulkState.total}… ${bulkState.current}`
                    : `⚡ Impose all pending (${pendingCount})`}
                </button>
              )}
              <button className="imp-btn sec" style={{ padding: "5px 12px", fontSize: 12 }} onClick={() => setRefreshKey(k => k + 1)}>Refresh</button>
            </span>
          </div>
          {actionErr && (
            <div style={{ color: "#f87171", fontSize: 12.5, marginBottom: 7, display: "flex", gap: 10, alignItems: "center" }}>
              <span>{actionErr}</span>
              <button className="imp-btn sec" style={{ padding: "2px 8px", fontSize: 11 }} onClick={() => setActionErr("")}>dismiss</button>
            </div>
          )}
          <OrderQueue rows={rows} err={queueErr} onLoad={loadOrder} busyId={queueBusy}
                      onStatus={setOrderStatus} onHide={setOrderHidden} rowBusy={rowBusy} />
        </div>
      )}

      <div className="imp-cols" style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
        {/* ── Left: job setup ── */}
        <div style={{ flex: "0 0 340px", minWidth: 300 }}>
          <div className="imp-card" style={{ marginBottom: 14 }}>
            <span className="lbl">Artwork</span>
            <DropZone label="Drop artwork PDF here"
              sub={isSaddle ? "multi-page PDF, pages in reading order (cover = page 1) · padded to a multiple of 4 · drop the manifest .txt to autofill"
                            : "print-ready or raw PDF · page 1 = front, page 2 = back · drop the manifest .txt to autofill the spec"}
              accept=".pdf,.txt" onFiles={f => onFiles(f, "front")} fileName={art && `${art.name} (${art.pageCount}p)`} />
            {art && art.threats && art.threats.length > 0 && (
              <div style={{ marginTop: 8, padding: "8px 10px", borderRadius: 6, background: "rgba(233,30,60,.12)", border: "1px solid rgba(233,30,60,.5)", fontSize: 12 }}>
                <b style={{ color: "#ff5f7a" }}>⚠ ACTIVE CONTENT in this file:</b> {art.threats.join(" · ")}
                <div style={{ color: "rgba(255,255,255,.55)", marginTop: 3 }}>
                  The imposed output strips all of it. Avoid opening the original in a PDF viewer — use the CLEAN copy.
                </div>
              </div>
            )}
            {backArt && backArt.threats && backArt.threats.length > 0 && (
              <div style={{ marginTop: 6, fontSize: 12, color: "#ff5f7a" }}>⚠ Back file active content: {backArt.threats.join(" · ")}</div>
            )}
            {art && (
              <div style={{ marginTop: 8 }}>
                <button type="button" className="imp-btn sec" disabled={cleanBusy} onClick={makeCleanCopy}>
                  {cleanBusy ? "Sanitizing…" : "⬇ CLEAN 1:1 copy (sanitized)"}
                </button>
                {CFG && activeOrder && (
                  <button type="button" className="imp-btn sec" style={{ marginLeft: 8 }} disabled={cleanBusy} onClick={sendCleanToDrive}>
                    🧼 File CLEAN copy to order's Drive folder
                  </button>
                )}
                <div style={{ fontSize: 11, color: "rgba(255,255,255,.4)", marginTop: 3 }}>
                  Keeps every page's artwork 1:1 (any size, any product — works even when imposition refuses) but strips
                  scripts, auto-run actions, attachments, and form fields. Note: form fields/annotations lose their visible
                  appearance too.
                </div>
              </div>
            )}
            {!isSaddle && art && art.pageCount > (spec.sides === 2 && !backArt ? 2 : 1) && (
              <div style={{ marginTop: 10 }}>
                <Field label={`Multi-page file (${art.pageCount} pages)`}>
                  <select value={multiMode} onChange={e => setMultiMode(e.target.value)}>
                    <option value="repeat">Repeat single design (page 1{spec.sides === 2 ? "+2" : ""} only)</option>
                    <option value="gang">Gang pages in order (different pieces per sheet)</option>
                    <option value="stack">Cut &amp; stack (piles collate after cutting)</option>
                    <option value="each">Repeat each page (full sheet per piece)</option>
                  </select>
                </Field>
                {spec.sides === 2 && multiMode !== "repeat" && !backArt && (
                  <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.45)", marginTop: -6, marginBottom: 8 }}>
                    2-sided collated: pages read front/back interleaved (p1=front of piece 1, p2=its back, …) — or drop a separate back file below.
                  </div>
                )}
              </div>
            )}
            {isPB && (
              <div className="imp-card" style={{ marginTop: 10, marginBottom: 4, background: "rgba(255,255,255,.03)" }}>
                <span className="lbl">Perfect bound — two press jobs</span>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,.5)", marginBottom: 9 }}>
                  Imposes a <b>cover</b> (flat, back | spine | front, on cover stock) and the <b>guts</b> (book block, text stock)
                  as two separate files. Drop a single reading-order PDF and the cover is built from pages 1, 2 and the last two;
                  or drop the guts here and the template cover file below.
                </div>
                <div style={{ display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap" }}>
                  <Field label="Spine width (in)" style={{ flex: "0 0 130px" }}>
                    <input type="number" step="0.0625" min="0" max="3" value={spine} onChange={e => setSpine(e.target.value)} />
                  </Field>
                  <div style={{ fontSize: 12, color: "rgba(255,255,255,.55)", paddingBottom: 8 }}>
                    flat cover = <b>{(2 * (+trimLong || 0) + (+spine || 0)).toFixed(3)}</b> × {(+trimShort || 0).toFixed(3)}″
                    <span style={{ color: "rgba(255,255,255,.38)" }}> — measure the glued block; the quote assumes nominal caliper</span>
                  </div>
                </div>
                <div style={{ marginTop: 4 }}>
                  <DropZone label="Drop COVER PDF (optional)" sub="already flat with the spine — the calculator's cover template. Leave empty for a single reading-order file."
                    accept=".pdf" onFiles={f => onFiles(f, "back")} fileName={backArt && backArt.name} />
                </div>
              </div>
            )}
            {!isPB && spec.sides === 2 && art && (art.pageCount < 2 || multiMode !== "repeat") && (
              <div style={{ marginTop: 10 }}>
                <DropZone label="Drop BACK side PDF" sub={multiMode !== "repeat" ? "optional — separate collated back file (page i backs piece i)" : "2-sided job but the front file has one page"}
                  accept=".pdf" onFiles={f => onFiles(f, "back")} fileName={backArt && backArt.name} />
              </div>
            )}
            {!isSaddle && (
              <div style={{ marginTop: 12, borderTop: "1px solid rgba(255,255,255,.1)", paddingTop: 10 }}>
                <span className="lbl">Gang combo — multiple designs on one sheet</span>
                <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.45)", marginBottom: 6 }}>
                  Add 2+ same-trim PDFs and each takes a share of the {lay ? `${lay.cells.length} cells` : "cells"} — blank slots = split evenly,
                  or set counts per file. Each design uses its page 1{spec.sides === 2 ? " + page 2 (back)" : ""}.
                  Qty = press sheets. Pieces fill contiguous blocks in reading order for clean cutting.
                </div>
                <input type="file" multiple accept=".pdf" onChange={e => { addGangFiles(Array.from(e.target.files || [])); e.target.value = ""; }} />
                {gangFiles.length > 0 && (
                  <div style={{ marginTop: 6 }}>
                    {gangFiles.map((g, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, marginBottom: 4 }}>
                        <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{g.name} ({g.pageCount}p)</span>
                        <input type="number" min="1" placeholder="auto" value={g.slots} style={{ width: 58 }}
                               title="cells for this design (blank = even split)"
                               onChange={e => setGangFiles(prev => prev.map((x, j) => j === i ? { ...x, slots: e.target.value } : x))} />
                        <button type="button" className="imp-btn sec" style={{ padding: "2px 8px" }}
                                onClick={() => setGangFiles(prev => prev.filter((_, j) => j !== i))}>✕</button>
                      </div>
                    ))}
                    {gangFiles.length === 1 && <div style={{ fontSize: 11, color: "#e91e63" }}>Add at least one more file to gang — with one file use the normal drop zone.</div>}

                              <div style={{ fontSize: 12, paddingBottom: 6, color: "rgba(255,255,255,.55)" }}>
                                {ok ? <>{lay.across} × {lay.down} on <b>{lay.sheet.label}</b></> : null}
                              </div>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                  {isSaddle && (
                    <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12.5, marginBottom: 9, flexWrap: "wrap" }}>
                      <b style={{ fontWeight: 600 }}>Creep (total):</b>
                      <input type="number" step="0.0078125" min="0" max="0.5" value={creep} style={{ width: 88 }}
                             onChange={e => setCreep(e.target.value)} />
                      <span>″ at the innermost signature</span>
                      {+creep > 0 && (
                        <span style={{ color: "rgba(255,255,255,.5)" }}>
                          — cover 0″, stepping spine-ward to {(+creep).toFixed(4)}″; cut lines unchanged
                        </span>
                      )}
                    </div>
                  )}
                  <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.4)", marginBottom: 7 }}>
                    {isSaddle
                      ? "Set the gutter between each signature column/row independently. Turn on “fill full sheet” to allow gutters that push the layout past the imageable area (guillotine cutting)."
                      : "Set the gutter between each column/row independently. Turn on “fill full sheet” to allow a block that runs past the imageable area (guillotine cutting) — it centres on the sheet instead of jogging."}
                  </div>
                  {(nc > 0 || nr > 0) ? (
                    <div style={{ display: "flex", gap: 18, flexWrap: "wrap", alignItems: "flex-start" }}>
                      {nc > 0 && (
                        <div>
                          <div style={{ fontSize: 11, color: "rgba(255,255,255,.45)", marginBottom: 3 }}>Column gaps (between {isSaddle ? "spreads" : "columns"}, in)</div>
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                            {effCol.map((g, i) => (
                              <input key={i} type="number" step="0.0625" min="0" value={g} style={{ width: 62, fontSize: 12 }}
                                     onChange={e => setCol(i, e.target.value)} />
                            ))}
                          </div>
                        </div>
                      )}
                      {nr > 0 && (
                        <div>
                          <div style={{ fontSize: 11, color: "rgba(255,255,255,.45)", marginBottom: 3 }}>Row gaps (between rows, in)</div>
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                            {effRow.map((g, i) => (
                              <input key={i} type="number" step="0.0625" min="0" value={g} style={{ width: 62, fontSize: 12 }}
                                     onChange={e => setRow(i, e.target.value)} />
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.4)" }}>
                      {isSaddle
                        ? "Single spread per side — no inter-signature gutters to set. Raise copies (efficient mode) to gang more."
                        : "Single piece per sheet — no gutters to set. Raise columns/rows above to gang more."}
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 8 }}>
                    <label style={{ fontSize: 12, display: "flex", gap: 6, alignItems: "center", cursor: "pointer" }}>
                      <input type="checkbox" checked={gapFill == null ? !!(ok && lay.fillSheet) : gapFill}
                             onChange={e => setGapFill(e.target.checked)} style={{ width: "auto" }} />
                      Fill full sheet <span style={{ color: "rgba(255,255,255,.4)" }}>(place past the imageable area)</span>
                    </label>
                    {custom && (
                      <button type="button" className="imp-btn sec" style={{ padding: "3px 10px", fontSize: 12 }}
                              onClick={() => { setGapCols(null); setGapRows(null); setGapFill(null); }}>Reset gutters</button>
                    )}
                    {(!ok || gridOn || repOn) && (
                      <button type="button" className="imp-btn sec"
                              style={{ padding: "3px 10px", fontSize: 12, borderColor: ok ? undefined : "#f87171", color: ok ? undefined : "#f87171" }}
                              onClick={() => { setGridOn(false); setRepOn(false); setGapCols(null); setGapRows(null); setGapFill(null); }}>
                        Back to automatic
                      </button>
                    )}
                  </div>
                </div>
              );
            })()}
            <div style={{ display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap", fontSize: 13 }}>
              <label style={{ display: "flex", gap: 6, alignItems: "center", cursor: "pointer" }}>
                <input type="checkbox" checked={marks} onChange={e => setMarks(e.target.checked)} style={{ width: "auto" }} />
                Crop / trim marks
              </label>
              {isSaddle && (
                <label style={{ display: "flex", gap: 6, alignItems: "center", cursor: "pointer" }}>
                  <input type="checkbox" checked={foldMarks} onChange={e => setFoldMarks(e.target.checked)} style={{ width: "auto" }} />
                  Fold guides
                </label>
              )}
              <label style={{ display: "flex", gap: 6, alignItems: "center", cursor: "pointer" }}>
                <input type="checkbox" checked={slugOn} onChange={e => setSlugOn(e.target.checked)} style={{ width: "auto" }} />
                Slug line
              </label>
              <span style={{ fontSize: 11, color: "rgba(255,255,255,.4)" }}>
                independent — all drawn inside the printable area, as space allows
              </span>
            </div>
            <label style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "center", cursor: "pointer", marginTop: 8 }}>
              <input type="checkbox" checked={allowBestFit} onChange={e => setAllowBestFit(e.target.checked)} style={{ width: "auto" }} />
              <span>Allow best physical fit if the priced imp can't be placed <span style={{ color: "rgba(255,255,255,.4)" }}>(mismatch is flagged on sheet + slug)</span></span>
            </label>
          </div>
        </div>

        {/* ── Right: layout + preview + output ── */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="imp-card" style={{ marginBottom: 14 }}>
            <span className="lbl">Computed layout (mirrors calculator pricing)</span>
            {layoutInfo.error && <div style={{ color: "#f87171", fontSize: 13, lineHeight: 1.5 }}>{layoutInfo.error}</div>}
            {layoutInfo.pb && (
              <div style={{ fontSize: 13, color: "rgba(255,255,255,.6)", lineHeight: 1.6 }}>
                Perfect bound images as <b>two press jobs</b> on different stock — a flat cover
                (<b>{(2 * (+trimLong || 0) + (+spine || 0)).toFixed(3)} × {(+trimShort || 0).toFixed(3)}″</b>,
                back | {(+spine || 0).toFixed(3)}″ spine | front) and the book block
                (<b>{(+trimLong || 0).toFixed(3)} × {(+trimShort || 0).toFixed(3)}″</b>).
                Each layout is shown on its own card below once the artwork is loaded.
              </div>
            )}
            {lay && (
              <div style={{ display: "flex", gap: 18, alignItems: "flex-start", flexWrap: "wrap" }}>
                <LayoutSchematic layout={lay} />
                <div style={{ fontSize: 13, lineHeight: 1.9, minWidth: 220 }}>
                  <div>Press sheet: <b>{lay.sheet.label}</b></div>
                  {lay.booklet ? (
                    <div>Spreads: <b>{lay.across} × {lay.down}{lay.rotated ? " (rotated 90°)" : ""}</b> = <b>{lay.booklet.spreadsPerSide}/side</b> ({lay.imp} pages/side){" "}
                      {lay.stepRepeat
                        ? <span className={"imp-badge " + (lay.imp === Math.round(lay.pricedImp) ? "ok" : "warn")}>STEP &amp; REPEAT {lay.stepRepeat}× PER SHEET — PRICED {lay.pricedImp} PAGES/SIDE</span>
                        : lay.manualGrid
                        ? <span className={"imp-badge " + (lay.imp === Math.round(lay.pricedImp) ? "ok" : "warn")}>MANUAL {lay.booklet.spreadsPerSide}/SIDE — PRICED {lay.pricedImp} PAGES/SIDE</span>
                        : lay.efficient
                        ? <span className="imp-badge ok">13×27.5 EFFICIENT — PRICED {lay.pricedImp}/SIDE</span>
                        : lay.fillSheet
                        ? <span className="imp-badge warn">FULL-SHEET FILL {lay.across}×{lay.down} — PAST IMAGEABLE AREA</span>
                        : <span className={"imp-badge " + (parityOk ? "ok" : "err")}>{parityOk ? "MATCHES PRICED IMP" : `MISMATCH — PRICED ${lay.pricedImp}/SIDE`}</span>}
                    </div>
                  ) : (
                    <div>Grid: <b>{lay.across} × {lay.down}{lay.rotated ? " (rotated 90°)" : ""}</b> = <b>{lay.imp}-up</b>{" "}
                      {lay.manualGrid
                        ? <span className={"imp-badge " + (lay.imp === Math.round(lay.pricedImp) ? "ok" : "warn")}>MANUAL GRID {lay.across}×{lay.down} — PRICED {lay.pricedImp}-UP</span>
                        : lay.efficient
                        ? <span className={"imp-badge " + (lay.imp >= lay.pricedImp ? "ok" : "warn")}>13×27.5 EFFICIENT — PRICED {lay.pricedImp}-UP/13×19</span>
                        : <span className={"imp-badge " + (parityOk ? "ok" : "err")}>{parityOk ? "MATCHES PRICED IMP" : `MISMATCH — PRICED ${lay.pricedImp}-UP`}</span>}
                      {lay.fillSheet && <span className="imp-badge warn" style={{ marginLeft: 6 }}>FULL-SHEET FILL — PAST IMAGEABLE AREA</span>}
                    </div>
                  )}
                  <div>Gutter: <b>{lay.gutter}″</b>{lay.gutter === 0 ? " (butt-cut)" : ""}</div>
                  {lay.booklet && <div style={{ fontSize: 12, color: "rgba(255,255,255,.55)" }}>Spread {lay.booklet.spreadW}×{lay.booklet.spreadH}″ · spine gets no bleed · signatures fold + nest, outermost = cover</div>}
                  {spec.qty > 0 && !lay.booklet && <div>Sheets: <b>{Math.ceil(spec.qty / lay.imp)}</b> ({spec.qty} ÷ {lay.imp})</div>}
                  {spec.qty > 0 && lay.booklet && (lay.stepRepeat
                    ? <div>Step and repeat: every cell is one signature — <b>{Math.ceil(spec.qty / lay.booklet.spreadsPerSide)}</b> sheets per signature, one form per signature</div>
                    : <div>Ganged: <b>{lay.booklet.spreadsPerSide}</b> consecutive signature{lay.booklet.spreadsPerSide === 1 ? "" : "s"} per sheet — <b>{spec.qty}</b> sheets per form, forms = signatures ÷ {lay.booklet.spreadsPerSide} (rounded up). Exact counts appear in the report once artwork is loaded.</div>)}
                  {lay.warnings.map((w, i) => <div key={i} style={{ color: "#fbbf24", fontSize: 12 }}>⚠ {w}</div>)}
                </div>
              </div>
            )}
          </div>

          {(notice || error) && (
            <div className="imp-card" style={{ marginBottom: 14, borderColor: error ? "rgba(239,68,68,.4)" : "rgba(34,197,94,.3)" }}>
              <div style={{ fontSize: 13, color: error ? "#f87171" : "#4ade80", lineHeight: 1.5, whiteSpace: "pre-line" }}>{error || notice}</div>
            </div>
          )}

          {/* Perfect bound emits TWO press jobs (cover + guts), so the result
              area renders one card per part. Every other calc yields one, and
              takes the same path with a single-element list. */}
          {(result ? (result.parts || [result]) : []).map((res, pi) => (
            <div key={res.part || pi}>
            {res.part && (
              <div style={{ display: "flex", alignItems: "baseline", gap: 10, margin: "2px 0 6px" }}>
                <span className="lbl" style={{ margin: 0, color: "#7ab8ff" }}>
                  {res.part === "cover" ? "① Cover" : "② Guts"}
                </span>
                <span style={{ fontSize: 12, color: "rgba(255,255,255,.5)" }}>{res.label}</span>
              </div>
            )}
            <div className="imp-card" style={{ marginBottom: 14 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
                <button className="imp-btn" onClick={() => dlBytes(res.bytes, res.filename)}>⬇ Download {res.filename}</button>
                {CFG && activeOrder && (
                  <button className="imp-btn" disabled={uploadState[res.filename] === "uploading" || uploadState[res.filename] === "done"} onClick={() => sendToDrive(res)}>
                    {uploadState[res.filename] === "uploading" ? "Uploading…" : uploadState[res.filename] === "done" ? "✓ Filed to Drive" : "📁 Send to order's Drive folder"}
                  </button>
                )}
                <span style={{ fontSize: 12, color: "rgba(255,255,255,.45)" }}>
                  {(res.bytes.length / 1048576).toFixed(2)} MB · preflight passed
                </span>
                {String(uploadState[res.filename] || "").startsWith("failed") && <span style={{ color: "#f87171", fontSize: 12 }}>{uploadState[res.filename]}</span>}
              </div>
              {res.warnings.length > 0 && (
                <div style={{ marginBottom: 10 }}>
                  {res.warnings.map((w, i) => <div key={i} style={{ color: "#fbbf24", fontSize: 12, lineHeight: 1.6 }}>⚠ {w}</div>)}
                </div>
              )}
              {res.sideReports && (
                <div style={{ marginBottom: 10, fontSize: 11.5, color: "rgba(255,255,255,.45)", lineHeight: 1.7 }}>
                  {res.sideReports.map((s, i) => s.side === "BOOKLET"
                    ? <div key={i}>Booklet: {s.pages} pages{s.padded !== s.pages ? ` (padded to ${s.padded})` : ""} · {s.signatures} signatures on {s.forms} form{s.forms === 1 ? "" : "s"} ({s.sigMode === "repeat" ? "step and repeat" : "ganged"}: {s.formPlan.map(fm => fm.join("+")).join(", ")}) · {s.spreadsPerSide} spread{s.spreadsPerSide === 1 ? "" : "s"}/side · back {s.tumble ? "tumbled 180°" : "upright"}{s.srcRotPages ? ` · ${s.srcRotPages} source pages carried /Rotate (normalized)` : ""}</div>
                    : s.side === "COMBO"
                    ? <div key={i}>Gang combo: {s.alloc} — one sheet design, qty = press sheets</div>
                    : s.side === "COLLATED"
                    ? <div key={i}>Collated: {s.pieces} piece{s.pieces === 1 ? "" : "s"} · {s.modeName === "gang" ? "ganged in order" : s.modeName === "stack" ? "cut & stack" : "one full sheet per piece"} · {s.sheetsPerSet} sheet{s.sheetsPerSet === 1 ? "" : "s"}{s.modeName === "each" ? " total" : " per set"}</div>
                    : <div key={i}>{s.side}: {s.rot ? `source /Rotate ${s.rot}° normalized · ` : ""}cell rotation {s.cellRotate}° · scale ×{typeof s.scale === "number" ? s.scale.toFixed(3) : "?"} · {s.hasBleed ? "bleed present" : s.synth ? `bleed synthesized (${s.synth})` : "no bleed"}</div>)}
                </div>
              )}
              <PdfPreview bytes={res.bytes} labels={res.pageLabels} />
            </div>
            </div>
          ))}
          {busy && <div style={{ color: "rgba(255,255,255,.5)", fontSize: 13 }}>Imposing…</div>}
          {!art && !busy && !result && (
            <div className="imp-card" style={{ color: "rgba(255,255,255,.45)", fontSize: 13, lineHeight: 1.7 }}>
              Drop an artwork PDF to generate the imposed press sheet.
              The engine places source pages as vector XObjects (never rasterized),
              locates art by TrimBox, fits to trim without cropping, hard-clips
              every cell, and step-and-repeats the exact count the customer was priced on.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div style={{ maxWidth: 720, margin: "60px auto", padding: 20 }} className="imp-card">
          <div style={{ fontSize: 15, fontWeight: 700, color: "#f87171", marginBottom: 8 }}>The tool hit a rendering error</div>
          <div style={{ fontSize: 12.5, color: "rgba(255,255,255,.6)", whiteSpace: "pre-wrap", marginBottom: 12 }}>{String(this.state.err && this.state.err.message || this.state.err)}</div>
          <button className="imp-btn" onClick={() => location.reload()}>Reload the tool</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("pps-impose-root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
