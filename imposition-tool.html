function useDebounced(value, ms) {
  const [v, setV] = useState(value);
  useEffect(() => { const t = setTimeout(() => setV(value), ms); return () => clearTimeout(t); }, [value, ms]);
  return v;
}

function Field({ label, children, style }) {
  return <div style={{ marginBottom: 12, ...style }}><span className="lbl">{label}</span>{children}</div>;
}

function DropZone({ label, sub, accept, onFiles, fileName }) {
  const [over, setOver] = useState(false);
  const inputRef = useRef(null);
  const handle = files => { if (files && files.length) onFiles(Array.from(files)); };
  return (
    <div className={"imp-drop" + (over ? " over" : "")}
      onClick={() => inputRef.current && inputRef.current.click()}
      onDragOver={e => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={e => { e.preventDefault(); setOver(false); handle(e.dataTransfer.files); }}>
      <input ref={inputRef} type="file" accept={accept} multiple style={{ display: "none" }}
        onChange={e => { handle(e.target.files); e.target.value = ""; }} />
      <div style={{ fontSize: 14, fontWeight: 700, color: fileName ? "#4ade80" : "#e8eaf0" }}>
        {fileName || label}
      </div>
      <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.4)", marginTop: 4 }}>{sub}</div>
    </div>
  );
}

// SVG schematic of the layout — instant feedback before the PDF preview lands
function LayoutSchematic({ layout }) {
  if (!layout) return null;
  const s = layout.sheet, scale = 320 / s.long;
  const W = s.long * scale, H = s.short * scale;
  return (
    <svg width={W} height={H} style={{ display: "block", background: "#fff", borderRadius: 4 }}>
      <rect x={0} y={0} width={W} height={H} fill="#fff" stroke="#999" />
      <rect x={(s.long - s.usableLong) / 2 * scale} y={(s.short - s.usableShort) / 2 * scale}
        width={s.usableLong * scale} height={s.usableShort * scale} fill="none" stroke="#ddd" strokeDasharray="4 3" />
      {layout.cells.map((c, i) => (
        <g key={i}>
          <rect x={c.clip.x * scale} y={(s.short - c.clip.y - c.clip.h) * scale}
            width={c.clip.w * scale} height={c.clip.h * scale} fill="rgba(233,30,140,.07)" />
          <rect x={c.trim.x * scale} y={(s.short - c.trim.y - c.trim.h) * scale}
            width={c.trim.w * scale} height={c.trim.h * scale} fill="rgba(233,30,140,.16)" stroke="#e91e8c" strokeWidth="1" />
          {layout.booklet && (layout.booklet.spreadAlongX
            ? <line x1={(c.trim.x + c.trim.w / 2) * scale} y1={(s.short - c.trim.y - c.trim.h) * scale}
                x2={(c.trim.x + c.trim.w / 2) * scale} y2={(s.short - c.trim.y) * scale}
                stroke="#e91e8c" strokeWidth="1" strokeDasharray="4 3" />
            : <line x1={c.trim.x * scale} y1={(s.short - c.trim.y - c.trim.h / 2) * scale}
                x2={(c.trim.x + c.trim.w) * scale} y2={(s.short - c.trim.y - c.trim.h / 2) * scale}
                stroke="#e91e8c" strokeWidth="1" strokeDasharray="4 3" />)}
        </g>
      ))}
    </svg>
  );
}

function PdfPreview({ bytes, labels }) {
  const holderRef = useRef(null);
  useEffect(() => {
    if (!bytes || !holderRef.current) return;
    let cancelled = false;
    const holder = holderRef.current;
    holder.innerHTML = "";
    (async () => {
      try {
        const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
        const maxRender = 8;
        if (pdf.numPages > maxRender) {
          const note = document.createElement("div");
          note.style.cssText = "font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px";
          note.textContent = `Previewing the first ${maxRender} of ${pdf.numPages} sheet sides — the downloaded PDF contains all of them.`;
          holder.appendChild(note);
        }
        for (let i = 1; i <= Math.min(pdf.numPages, maxRender) && !cancelled; i++) {
          const page = await pdf.getPage(i);
          const vp0 = page.getViewport({ scale: 1 });
          const scale = Math.min(760 / vp0.width, 2);
          const vp = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          canvas.width = vp.width; canvas.height = vp.height;
          canvas.style.cssText = "width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);margin-bottom:10px";
          const cap = document.createElement("div");
          cap.style.cssText = "font-size:11px;color:rgba(255,255,255,.45);margin:0 0 4px 2px;font-weight:700;letter-spacing:.5px";
          cap.textContent = (labels && labels[i - 1]) || (i === 1 ? "SHEET SIDE 1 — FRONT" : "SHEET SIDE 2 — BACK");
          if (!cancelled) { holder.appendChild(cap); holder.appendChild(canvas); }
          await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        }
      } catch (e) { holder.innerHTML = '<div style="color:#f87171;font-size:12px">Preview render failed: ' + e.message + '</div>'; }
    })();
    return () => { cancelled = true; };
  }, [bytes]);
  return <div ref={holderRef} />;
}

function dlBytes(bytes, name) {
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ── WP-admin queue (only rendered when PPS_IMPOSE_CFG is injected) ──
function ajax(action, params, opts) {
  const fd = new FormData();
  fd.append("action", action);
  fd.append("nonce", CFG.nonce);
  Object.entries(params || {}).forEach(([k, v]) => fd.append(k, v));
  return fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin", ...(opts || {}) });
}

// Surface the endpoint's real reason on failure: try the JSON error message
// first (wp_send_json_error), fall back to the HTTP status.
async function ajaxFail(r, what) {
  let msg = "";
  try { const j = await r.json(); msg = (j && j.data && j.data.message) || ""; } catch (e) { /* not JSON */ }
  return new Error(`${what} failed (HTTP ${r.status}${msg ? ": " + msg : ""})`);
}

// Row → engine spec: single source for both the per-row Impose flow and the
// bulk "Impose all pending" path. For saddle, width×height (spine = height)
// is recovered from size_label, falling back to bind_dir orientation.
function specFromRow(row) {
  let w = row.long_edge, h = row.short_edge;
  if (row.calc === "saddle") {
    const m = String(row.size_label || "").match(/([\d.]+)\s*[×x]\s*([\d.]+)/);
    if (m) { w = +m[1]; h = +m[2]; }
    else if (row.bind_dir !== "short") { w = row.short_edge; h = row.long_edge; }
  }
  return {
    calc: row.calc, trimLong: w, trimShort: h,
    sides: row.sides || 1, qty: row.qty || 0,
    sheetFlip: "short", backRotate: "auto",
    jobName: row.job_name || row.product || "",
    orderRef: String(row.order_id), itemRef: String(row.item_id || ""),
    marks: true, allowBestFit: false,
  };
}

function rowPending(r) {
  return !r.imposed && r.files_listed && r.calc && r.long_edge && r.short_edge
    && r.art_file_id && !UNSUPPORTED_BOOKLETS.includes(r.calc);
}

function OrderQueue({ rows, err, onLoad, busyId }) {
  if (err) return <div style={{ color: "#f87171", fontSize: 13 }}>Order list failed: {err}</div>;
  if (!rows) return <div style={{ color: "rgba(255,255,255,.4)", fontSize: 13 }}>Loading orders…</div>;
  if (!rows.length) return <div style={{ color: "rgba(255,255,255,.4)", fontSize: 13 }}>No recent orders with Drive artwork found.</div>;
  return (
    <table className="imp-q">
      <thead><tr><th>Order</th><th>Job</th><th>Spec</th><th>Artwork</th><th>Status</th><th></th></tr></thead>
      <tbody>
        {rows.map(r => {
          const key = r.order_id + ":" + r.item_id;
          const specOk = r.calc && r.long_edge && r.short_edge;
          const artOk = !!(r.art_file_id);
          const bookish = UNSUPPORTED_BOOKLETS.includes(r.calc);
          const driveErr = !r.files_listed; // Drive listing failed ≠ empty folder
          return (
            <tr key={key}>
              <td><a href={r.folder_url} target="_blank" rel="noreferrer" style={{ color: "#7ab8ff" }}>#{r.order_id}</a></td>
              <td style={{ maxWidth: 180, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.job_name || r.product || "—"}</td>
              <td style={{ fontSize: 12 }}>{r.calc || "?"} · {r.long_edge}×{r.short_edge}″ · {r.calc === "saddle" ? "booklet" : r.sides === 2 ? "2-sided" : "1-sided"} · qty {r.qty}</td>
              <td style={{ fontSize: 12 }}>{artOk ? r.art_file_name : <span style={{ color: "#f87171" }}>{driveErr ? "Drive list failed" : "none found"}</span>}</td>
              <td>{driveErr ? <span className="imp-badge err">DRIVE ERROR</span>
                : r.imposed ? <span className="imp-badge ok">IMPOSED</span>
                : bookish ? <span className="imp-badge warn">{r.calc.toUpperCase()} — v2</span>
                : !specOk ? <span className="imp-badge warn">NO SPEC</span>
                : !artOk ? <span className="imp-badge err">NO ART</span>
                : <span className="imp-badge warn">PENDING</span>}</td>
              <td>{specOk && artOk && !bookish &&
                <button className="imp-btn sec" style={{ padding: "6px 12px", fontSize: 12 }}
                  disabled={busyId === key} onClick={() => onLoad(r)}>
                  {busyId === key ? "Working…" : r.imposed ? "Re-impose" : "Impose"}
                </button>}</td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function App() {
  const [calc, setCalc] = useState("brochure");
  const [trimLong, setTrimLong] = useState(11);
  const [trimShort, setTrimShort] = useState(8.5);
  const [sides, setSides] = useState(1);
  const [qty, setQty] = useState(500);
  const [sheetFlip, setSheetFlip] = useState("short"); // Fiery presses feed 13" sheets short-edge first — duplex flips on the short edge
  const [backRotate, setBackRotate] = useState("auto");
  const [jobName, setJobName] = useState("");
  const [orderRef, setOrderRef] = useState("");
  const [itemRef, setItemRef] = useState(""); // order item id — tags the output filename so per-item IMPOSED detection works
  const [marks, setMarks] = useState(true);
  const [allowBestFit, setAllowBestFit] = useState(false);
  const [efficient, setEfficient] = useState(false);      // lay out on 13×27.5, multiple expands
  const [gutterMode, setGutterMode] = useState("auto");   // "auto" | fixed inches
  const [offsetMode, setOffsetMode] = useState("jog");    // jog lower-right 0.5″ | center | custom
  const [offsetRight, setOffsetRight] = useState(0.5);
  const [offsetBottom, setOffsetBottom] = useState(0.5);
  const isSaddle = calc === "saddle";
  const [art, setArt] = useState(null);      // { bytes, name, pageCount }
  const [backArt, setBackArt] = useState(null);
  const [result, setResult] = useState(null); // { bytes, layout, warnings, sheets, filename }
  const [busy, setBusy] = useState(false);
  const [queueBusy, setQueueBusy] = useState(null);
  const [refreshKey, setRefreshKey] = useState(0);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [uploadState, setUploadState] = useState("");     // "", "uploading", "done", "failed: …"
  const [activeOrder, setActiveOrder] = useState(null);   // queue row currently loaded
  const [rows, setRows] = useState(null);                  // admin queue rows (WP mode)
  const [queueErr, setQueueErr] = useState("");
  const [bulkState, setBulkState] = useState(null);        // { done, total, current, failures[] }
  const genSeq = useRef(0);

  // Fetch the order queue (WP mode only)
  useEffect(() => {
    if (!CFG) return;
    let dead = false;
    setQueueErr("");
    ajax("pps_impose_list", refreshKey > 0 ? { refresh: 1 } : {})
      .then(async r => { if (!r.ok) throw await ajaxFail(r, "order list"); return r.json(); })
      .then(j => {
        if (dead) return;
        if (!j.success) throw new Error((j.data && j.data.message) || "list failed");
        setRows(j.data.items);
      })
      .catch(e => !dead && setQueueErr(e.message));
    return () => { dead = true; };
  }, [refreshKey]);

  const spec = useMemo(() => ({
    calc, trimLong: +trimLong || 0, trimShort: +trimShort || 0,
    sides: +sides, qty: +qty || 0, sheetFlip,
    backRotate: backRotate === "auto" ? "auto" : +backRotate,
    jobName, orderRef, itemRef, marks, allowBestFit,
    efficient, gutter: gutterMode === "auto" ? null : +gutterMode,
    offsetMode, offsetRight: +offsetRight, offsetBottom: +offsetBottom,
  }), [calc, trimLong, trimShort, sides, qty, sheetFlip, backRotate, jobName, orderRef, itemRef, marks, allowBestFit,
       efficient, gutterMode, offsetMode, offsetRight, offsetBottom]);
  const debSpec = useDebounced(spec, 450);

  // Live layout (no artwork needed) — schematic + parity badge
  const layoutInfo = useMemo(() => {
    try {
      if (!(debSpec.trimLong >= 2 && debSpec.trimShort >= 2)) return { error: "Enter trim size (min 2″)" };
      return { layout: computeLayout(debSpec.calc, debSpec.trimLong, debSpec.trimShort, layoutOpts(debSpec)) };
    } catch (e) { return { error: e.message }; }
  }, [debSpec]);

  // Auto-regenerate the imposed PDF when spec or art changes
  useEffect(() => {
    if (!art || !layoutInfo.layout) { setResult(null); return; }
    const seq = ++genSeq.current;
    setBusy(true); setError(""); setUploadState("");
    imposePdf(art.bytes, debSpec.sides === 2 ? (backArt && backArt.bytes) : null, debSpec)
      .then(res => {
        if (seq !== genSeq.current) return;
        res.filename = imposedFilename(debSpec, res.layout);
        setResult(res);
      })
      .catch(e => { if (seq === genSeq.current) { setResult(null); setError(e.message); } })
      .finally(() => { if (seq === genSeq.current) setBusy(false); });
  }, [art, backArt, debSpec, layoutInfo.layout ? 1 : 0]);

  const onFiles = async (files, slot) => {
    setError("");
    for (const f of files) {
      if (/\.txt$/i.test(f.name)) {
        const t = await f.text();
        const m = parseManifest(t);
        // saddle keeps width×height as-is (spine = height edge); flats normalize
        if (m.trimLong) {
          if (m.calc === "saddle") { setTrimLong(m.rawW); setTrimShort(m.rawH); }
          else { setTrimLong(m.trimLong); setTrimShort(m.trimShort); }
        }
        if (m.calc) setCalc(m.calc);
        if (m.sides) setSides(m.sides);
        if (m.jobName && !jobName) setJobName(m.jobName);
        setNotice("Spec autofilled from manifest: " + f.name);
        continue;
      }
      if (!/\.pdf$/i.test(f.name)) { setError(`"${f.name}" is not a PDF — the imposition input must be the print-ready or raw PDF.`); continue; }
      const bytes = new Uint8Array(await f.arrayBuffer());
      let pageCount = 0;
      try { pageCount = (await PL.PDFDocument.load(bytes, { ignoreEncryption: true })).getPageCount(); }
      catch (e) { setError(`"${f.name}" could not be parsed as a PDF: ` + e.message); continue; }
      if (slot === "back") setBackArt({ bytes, name: f.name, pageCount });
      else {
        setArt({ bytes, name: f.name, pageCount });
        if (!jobName) setJobName(f.name.replace(/\.pdf$/i, ""));
        // A 2-page file usually means front+back — switch, but say so, since
        // page 2 could also be notes/a proof sheet the operator must exclude.
        if (pageCount >= 2 && sides === 1 && !isSaddle) {
          setSides(2);
          setNotice(`"${f.name}" has ${pageCount} pages — switched to 2-sided (page 1 = front, page 2 = back). Set Sides back to 1 if page 2 isn't the back.`);
        }
      }
    }
  };

  // ── WP queue: load an order row, fetch its artwork, impose ──
  const loadOrder = async (row) => {
    const key = row.order_id + ":" + row.item_id;
    setQueueBusy(key); setError(""); setNotice(""); setUploadState("");
    try {
      const s = specFromRow(row);
      setItemRef(s.itemRef); setCalc(s.calc);
      setTrimLong(s.trimLong); setTrimShort(s.trimShort);
      setSides(s.sides); setQty(s.qty);
      setJobName(s.jobName); setOrderRef(s.orderRef);
      setActiveOrder(row);
      const r = await ajax("pps_impose_download", { file_id: row.art_file_id });
      if (!r.ok) throw await ajaxFail(r, "artwork download");
      const bytes = new Uint8Array(await r.arrayBuffer());
      const pageCount = (await PL.PDFDocument.load(bytes, { ignoreEncryption: true })).getPageCount();
      setArt({ bytes, name: row.art_file_name, pageCount });
      setBackArt(null);
      setNotice(`Loaded order #${row.order_id} artwork (${row.art_file_name}, ${pageCount} page${pageCount === 1 ? "" : "s"}). Review the preview, then Send to Drive.`);
    } catch (e) { setError(e.message); }
    finally { setQueueBusy(null); }
  };

  const sendToDrive = async () => {
    if (!result || !activeOrder) return;
    setUploadState("uploading");
    try {
      const fd = new FormData();
      fd.append("action", "pps_impose_upload");
      fd.append("nonce", CFG.nonce);
      fd.append("order_id", activeOrder.order_id);
      fd.append("filename", result.filename);
      fd.append("file", new Blob([result.bytes], { type: "application/pdf" }), result.filename);
      const r = await fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin" });
      if (!r.ok) throw await ajaxFail(r, "upload");
      const j = await r.json();
      if (!j.success) throw new Error((j.data && j.data.message) || "upload failed");
      setUploadState("done");
      setNotice(`Imposed PDF filed to the order #${activeOrder.order_id} Drive folder as ${result.filename}.`);
      setRefreshKey(k => k + 1);
    } catch (e) { setUploadState("failed: " + e.message); }
  };

  // Bulk: impose + file every pending row, sequentially, headless (does not
  // touch the form). Each row uses the exact spec the per-row flow would.
  const imposeAll = async () => {
    const pending = (rows || []).filter(rowPending);
    if (!pending.length) return;
    setBulkState({ done: 0, total: pending.length, current: "", failures: [] });
    const failures = [];
    for (let i = 0; i < pending.length; i++) {
      const row = pending[i];
      const label = `#${row.order_id} ${row.job_name || row.product || ""}`.trim();
      setBulkState({ done: i, total: pending.length, current: label, failures });
      try {
        const s = specFromRow(row);
        const r = await ajax("pps_impose_download", { file_id: row.art_file_id });
        if (!r.ok) throw await ajaxFail(r, "artwork download");
        const bytes = new Uint8Array(await r.arrayBuffer());
        const res = await imposePdf(bytes, null, s);
        const filename = imposedFilename(s, res.layout);
        const fd = new FormData();
        fd.append("action", "pps_impose_upload");
        fd.append("nonce", CFG.nonce);
        fd.append("order_id", row.order_id);
        fd.append("filename", filename);
        fd.append("file", new Blob([res.bytes], { type: "application/pdf" }), filename);
        const up = await fetch(CFG.ajaxUrl, { method: "POST", body: fd, credentials: "same-origin" });
        if (!up.ok) throw await ajaxFail(up, "upload");
        const j = await up.json();
        if (!j.success) throw new Error((j.data && j.data.message) || "upload failed");
      } catch (e) {
        failures.push(`${label}: ${e.message}`);
      }
    }
    setBulkState({ done: pending.length, total: pending.length, current: "", failures });
    setNotice(`Bulk impose finished: ${pending.length - failures.length}/${pending.length} filed to Drive.`
      + (failures.length ? " Failures listed below." : ""));
    setError(failures.join("\n"));
    setRefreshKey(k => k + 1);
  };

  const pendingCount = (rows || []).filter(rowPending).length;

  const lay = layoutInfo.layout;
  const parityOk = lay && !lay.mismatch && !lay.efficient && (lay.booklet
    ? (lay.pricedImp < 2 || lay.imp === lay.pricedImp)   // imp:1 presets legitimately move to the 27.5 sheet
    : lay.imp === Math.round(lay.pricedImp));

  return (
    <div style={{ maxWidth: 1220, margin: "0 auto", padding: "18px 16px 60px" }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 16 }}>
        <h1 style={{ fontSize: 20, margin: 0 }}>🖨️ PPS Imposition Tool</h1>
        <span style={{ fontSize: 12, color: "rgba(255,255,255,.4)" }}>
          vector-preserving sheetwise step-and-repeat · {CFG ? "connected to WooCommerce + Google Drive" : "standalone mode (drag & drop)"}
        </span>
      </div>

      {CFG && CFG.gdrive === false && (
        <div className="imp-card" style={{ marginBottom: 16, borderColor: "rgba(239,68,68,.4)" }}>
          <div style={{ fontSize: 13, color: "#f87171" }}>
            Google Drive is not connected — connect it under <b>PPS Calculators → Google Drive</b>. The order queue, artwork downloads, and uploads will fail until then.
          </div>
        </div>
      )}
      {CFG && (
        <div className="imp-card" style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 10, flexWrap: "wrap" }}>
            <span className="lbl" style={{ marginBottom: 0 }}>Recent orders with artwork on Drive</span>
            <span style={{ display: "flex", gap: 8 }}>
              {pendingCount > 0 && (
                <button className="imp-btn" style={{ padding: "5px 12px", fontSize: 12 }}
                  disabled={!!bulkState && bulkState.done < bulkState.total} onClick={imposeAll}>
                  {bulkState && bulkState.done < bulkState.total
                    ? `Imposing ${bulkState.done + 1}/${bulkState.total}… ${bulkState.current}`
                    : `⚡ Impose all pending (${pendingCount})`}
                </button>
              )}
              <button className="imp-btn sec" style={{ padding: "5px 12px", fontSize: 12 }} onClick={() => setRefreshKey(k => k + 1)}>Refresh</button>
            </span>
          </div>
          <OrderQueue rows={rows} err={queueErr} onLoad={loadOrder} busyId={queueBusy} />
        </div>
      )}

      <div className="imp-cols" style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
        {/* ── Left: job setup ── */}
        <div style={{ flex: "0 0 340px", minWidth: 300 }}>
          <div className="imp-card" style={{ marginBottom: 14 }}>
            <span className="lbl">Artwork</span>
            <DropZone label="Drop artwork PDF here"
              sub={isSaddle ? "multi-page PDF, pages in reading order (cover = page 1) · padded to a multiple of 4 · drop the manifest .txt to autofill"
                            : "print-ready or raw PDF · page 1 = front, page 2 = back · drop the manifest .txt to autofill the spec"}
              accept=".pdf,.txt" onFiles={f => onFiles(f, "front")} fileName={art && `${art.name} (${art.pageCount}p)`} />
            {spec.sides === 2 && art && art.pageCount < 2 && (
              <div style={{ marginTop: 10 }}>
                <DropZone label="Drop BACK side PDF" sub="2-sided job but the front file has one page"
                  accept=".pdf" onFiles={f => onFiles(f, "back")} fileName={backArt && backArt.name} />
              </div>
            )}
          </div>

          <div className="imp-card">
            <Field label="Product / calculator">
              <select value={calc} onChange={e => setCalc(e.target.value)}>
                {CALC_TYPES.map(c => <option key={c.val} value={c.val}>{c.label}</option>)}
              </select>
            </Field>
            <div style={{ display: "flex", gap: 10 }}>
              <Field label={isSaddle ? "Page width (in)" : "Trim long (in)"} style={{ flex: 1 }}>
                <input type="number" step="0.125" min="2" value={trimLong} onChange={e => setTrimLong(e.target.value)} />
              </Field>
              <Field label={isSaddle ? "Page height (in) — spine edge" : "Trim short (in)"} style={{ flex: 1 }}>
                <input type="number" step="0.125" min="2" value={trimShort} onChange={e => setTrimShort(e.target.value)} />
              </Field>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              {!isSaddle && (
                <Field label="Sides" style={{ flex: 1 }}>
                  <select value={sides} onChange={e => setSides(+e.target.value)}>
                    <option value={1}>1 — single-sided</option>
                    <option value={2}>2 — double-sided</option>
                  </select>
                </Field>
              )}
              <Field label={isSaddle ? "Quantity (books)" : "Quantity"} style={{ flex: 1 }}>
                <input type="number" min="0" value={qty} onChange={e => setQty(e.target.value)} />
              </Field>
            </div>
            {(spec.sides === 2 || isSaddle) && (
              <div style={{ display: "flex", gap: 10 }}>
                <Field label="Press flips sheet on" style={{ flex: 1 }}>
                  <select value={sheetFlip} onChange={e => setSheetFlip(e.target.value)}>
                    <option value="short">Short edge (default — Fiery SEF)</option>
                    <option value="long">Long edge</option>
                  </select>
                </Field>
                {!isSaddle && (
                  <Field label="Back rotation" style={{ flex: 1 }}>
                    <select value={backRotate} onChange={e => setBackRotate(e.target.value)}>
                      <option value="auto">Auto (register with front)</option>
                      <option value="0">Force none</option>
                      <option value="180">Force 180° (tumble)</option>
                    </select>
                  </Field>
                )}
              </div>
            )}
            <div style={{ display: "flex", gap: 10 }}>
              <Field label="Job name" style={{ flex: 1 }}>
                <input type="text" value={jobName} onChange={e => setJobName(e.target.value)} placeholder="slug line" />
              </Field>
              <Field label="Order #" style={{ flex: "0 0 90px" }}>
                <input type="text" value={orderRef} onChange={e => setOrderRef(e.target.value)} />
              </Field>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <Field label="Layout position" style={{ flex: 1 }}>
                <select value={offsetMode} onChange={e => setOffsetMode(e.target.value)}>
                  <option value="jog">Jog lower-right 0.5″ (back: lower-left)</option>
                  <option value="center">Centered</option>
                  <option value="custom">Custom offset…</option>
                </select>
              </Field>
              <Field label="Gutter" style={{ flex: "0 0 110px" }}>
                <select value={gutterMode} onChange={e => setGutterMode(e.target.value)}>
                  <option value="auto">Auto</option>
                  <option value="0">0″ (butt)</option>
                  <option value="0.125">0.125″</option>
                  <option value="0.25">0.25″</option>
                  <option value="0.375">0.375″</option>
                  <option value="0.5">0.5″</option>
                </select>
              </Field>
            </div>
            {offsetMode === "custom" && (
              <div style={{ display: "flex", gap: 10 }}>
                <Field label="From right edge (in)" style={{ flex: 1 }}>
                  <input type="number" step="0.125" min="0" value={offsetRight} onChange={e => setOffsetRight(e.target.value)} />
                </Field>
                <Field label="From bottom edge (in)" style={{ flex: 1 }}>
                  <input type="number" step="0.125" min="0" value={offsetBottom} onChange={e => setOffsetBottom(e.target.value)} />
                </Field>
              </div>
            )}
            {FLAT_CALCS.includes(calc) && (
              <label style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "center", cursor: "pointer", marginBottom: 8 }}>
                <input type="checkbox" checked={efficient} onChange={e => setEfficient(e.target.checked)} style={{ width: "auto" }} />
                <span>Lay out on 13×27.5 (efficient mode) <span style={{ color: "rgba(255,255,255,.4)" }}>— multiple expands to fill the 27″ axis</span></span>
              </label>
            )}
            <label style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "center", cursor: "pointer" }}>
              <input type="checkbox" checked={marks} onChange={e => setMarks(e.target.checked)} style={{ width: "auto" }} />
              Crop marks + slug (inside printable area, as space allows)
            </label>
            <label style={{ fontSize: 13, display: "flex", gap: 8, alignItems: "center", cursor: "pointer", marginTop: 8 }}>
              <input type="checkbox" checked={allowBestFit} onChange={e => setAllowBestFit(e.target.checked)} style={{ width: "auto" }} />
              <span>Allow best physical fit if the priced imp can't be placed <span style={{ color: "rgba(255,255,255,.4)" }}>(mismatch is flagged on sheet + slug)</span></span>
            </label>
          </div>
        </div>

        {/* ── Right: layout + preview + output ── */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="imp-card" style={{ marginBottom: 14 }}>
            <span className="lbl">Computed layout (mirrors calculator pricing)</span>
            {layoutInfo.error && <div style={{ color: "#f87171", fontSize: 13, lineHeight: 1.5 }}>{layoutInfo.error}</div>}
            {lay && (
              <div style={{ display: "flex", gap: 18, alignItems: "flex-start", flexWrap: "wrap" }}>
                <LayoutSchematic layout={lay} />
                <div style={{ fontSize: 13, lineHeight: 1.9, minWidth: 220 }}>
                  <div>Press sheet: <b>{lay.sheet.label}</b></div>
                  {lay.booklet ? (
                    <div>Spreads: <b>{lay.across} × {lay.down}{lay.rotated ? " (rotated 90°)" : ""}</b> = <b>{lay.booklet.spreadsPerSide}/side</b> ({lay.imp} pages/side){" "}
                      <span className={"imp-badge " + (parityOk ? "ok" : "err")}>{parityOk ? "MATCHES PRICED IMP" : `MISMATCH — PRICED ${lay.pricedImp}/SIDE`}</span>
                    </div>
                  ) : (
                    <div>Grid: <b>{lay.across} × {lay.down}{lay.rotated ? " (rotated 90°)" : ""}</b> = <b>{lay.imp}-up</b>{" "}
                      {lay.efficient
                        ? <span className={"imp-badge " + (lay.imp >= lay.pricedImp ? "ok" : "warn")}>13×27.5 EFFICIENT — PRICED {lay.pricedImp}-UP/13×19</span>
                        : <span className={"imp-badge " + (parityOk ? "ok" : "err")}>{parityOk ? "MATCHES PRICED IMP" : `MISMATCH — PRICED ${lay.pricedImp}-UP`}</span>}
                    </div>
                  )}
                  <div>Gutter: <b>{lay.gutter}″</b>{lay.gutter === 0 ? " (butt-cut)" : ""}</div>
                  {lay.booklet && <div style={{ fontSize: 12, color: "rgba(255,255,255,.55)" }}>Spread {lay.booklet.spreadW}×{lay.booklet.spreadH}″ · spine gets no bleed · signatures fold + nest, outermost = cover</div>}
                  {spec.qty > 0 && !lay.booklet && <div>Sheets: <b>{Math.ceil(spec.qty / lay.imp)}</b> ({spec.qty} ÷ {lay.imp})</div>}
                  {spec.qty > 0 && lay.booklet && <div>Sheets per signature: <b>{Math.ceil(spec.qty / lay.booklet.spreadsPerSide)}</b> × number of signatures (from page count)</div>}
                  {lay.warnings.map((w, i) => <div key={i} style={{ color: "#fbbf24", fontSize: 12 }}>⚠ {w}</div>)}
                </div>
              </div>
            )}
          </div>

          {(notice || error) && (
            <div className="imp-card" style={{ marginBottom: 14, borderColor: error ? "rgba(239,68,68,.4)" : "rgba(34,197,94,.3)" }}>
              <div style={{ fontSize: 13, color: error ? "#f87171" : "#4ade80", lineHeight: 1.5, whiteSpace: "pre-line" }}>{error || notice}</div>
            </div>
          )}

          {result && (
            <div className="imp-card" style={{ marginBottom: 14 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
                <button className="imp-btn" onClick={() => dlBytes(result.bytes, result.filename)}>⬇ Download {result.filename}</button>
                {CFG && activeOrder && (
                  <button className="imp-btn" disabled={uploadState === "uploading" || uploadState === "done"} onClick={sendToDrive}>
                    {uploadState === "uploading" ? "Uploading…" : uploadState === "done" ? "✓ Filed to Drive" : "📁 Send to order's Drive folder"}
                  </button>
                )}
                <span style={{ fontSize: 12, color: "rgba(255,255,255,.45)" }}>
                  {(result.bytes.length / 1048576).toFixed(2)} MB · preflight passed
                </span>
                {uploadState.startsWith("failed") && <span style={{ color: "#f87171", fontSize: 12 }}>{uploadState}</span>}
              </div>
              {result.warnings.length > 0 && (
                <div style={{ marginBottom: 10 }}>
                  {result.warnings.map((w, i) => <div key={i} style={{ color: "#fbbf24", fontSize: 12, lineHeight: 1.6 }}>⚠ {w}</div>)}
                </div>
              )}
              {result.sideReports && (
                <div style={{ marginBottom: 10, fontSize: 11.5, color: "rgba(255,255,255,.45)", lineHeight: 1.7 }}>
                  {result.sideReports.map((s, i) => s.side === "BOOKLET"
                    ? <div key={i}>Booklet: {s.pages} pages{s.padded !== s.pages ? ` (padded to ${s.padded})` : ""} · {s.signatures} signatures · {s.spreadsPerSide} spread{s.spreadsPerSide === 1 ? "" : "s"}/side · back {s.tumble ? "tumbled 180°" : "upright"}{s.srcRotPages ? ` · ${s.srcRotPages} source pages carried /Rotate (normalized)` : ""}</div>
                    : <div key={i}>{s.side}: {s.rot ? `source /Rotate ${s.rot}° normalized · ` : ""}cell rotation {s.cellRotate}° · scale ×{s.scale.toFixed(3)} · {s.hasBleed ? "bleed present" : "no bleed"}</div>)}
                </div>
              )}
              <PdfPreview bytes={result.bytes} labels={result.pageLabels} />
            </div>
          )}
          {busy && <div style={{ color: "rgba(255,255,255,.5)", fontSize: 13 }}>Imposing…</div>}
          {!art && !busy && !result && (
            <div className="imp-card" style={{ color: "rgba(255,255,255,.45)", fontSize: 13, lineHeight: 1.7 }}>
              Drop an artwork PDF to generate the imposed press sheet.
              The engine places source pages as vector XObjects (never rasterized),
              locates art by TrimBox, fits to trim without cropping, hard-clips
              every cell, and step-and-repeats the exact count the customer was priced on.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("pps-impose-root")).render(<App />);
</script>
</body>
</html>
