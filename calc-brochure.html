  return true;
}
const DNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MNAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ═══════════════════════════════════════════════════════════════
// IMPOSITION CALCULATION
// ═══════════════════════════════════════════════════════════════
function calcBrochureImp(longEdge, shortEdge) {
  const r1 = 18.5 / longEdge;
  const across = r1 < 0.5 ? 0 : r1 < 1 ? 0.5 : r1 < 1.48 ? 1 : r1 < 3 ? 2 : r1 < 4 ? 3 : r1 < 5 ? 4 : r1 < 6 ? 5 : r1 < 7 ? 6 : r1 < 8 ? 7 : 8;
  const r2 = 12.5 / shortEdge;
  const down = r2 < 2 ? 1 : r2 < 3 ? 2 : r2 < 4 ? 3 : 4;
  return across * down;
}

// ═══════════════════════════════════════════════════════════════
// PRICING ENGINE
// ═══════════════════════════════════════════════════════════════
function calculate(c) {
  const errors = [];
  let imp, longE, shortE;
  if (c.sizeMode === "preset") {
    const preset = SIZE_PRESETS.find(s => s.label === c.sizeLabel);
    if (!preset) return { error: ["Select a size"] };
    imp = preset.imp; longE = preset.long; shortE = preset.short;
  } else {
    longE = Math.max(c.longEdge, c.shortEdge);
    shortE = Math.min(c.longEdge, c.shortEdge);
    if (longE < 2 || shortE < 2) return { error: ["Minimum dimension is 2 inches"] };
    if (longE > 27 || shortE > 12.5) return { error: ["Maximum size: 27×12.5 inches flat"] };
    imp = calcBrochureImp(longE, shortE);
    if (imp <= 0) return { error: ["Size too large for press sheet"] };
  }

  const qty = c.qty;
  if (qty < 1) return { error: ["Enter quantity"] };
  const fold = FOLD_TYPES.find(f => f.val === c.foldType) || FOLD_TYPES[0];
  const panels = fold.panels;
  const pressSheets = qty / imp;
  const paper = c.paper;
  const sides = c.sides;

  // Folded dimension validation
  if (panels > 1) {
    const foldDim = c.foldDir === "short" ? shortE : longE;
    const panelSize = foldDim / panels;
    if (panelSize < 2) errors.push(`Folded panel too small (${panelSize.toFixed(1)}"). Min 2" per panel.`);
    if (c.foldDir === "short" && longE > 13) errors.push("Long edge exceeds 13\" folder throat when folding short side.");
  }
  if (errors.length) return { error: errors };

  // Markup
  const dL = 0.7 * Math.log(pressSheets) + 0.5412;
  const mk = Math.max(PCF.backend_maximummarkup - dL, PCF.backend_minimummarkup);

  // Approximate thickness
  const approxThickness = (paper.price / 10) * qty;

  const P = {};

  // Paper
  P.paper = (paper.price * pressSheets) * mk;

  // Printing — front has markup on BW base, back does not
  if (c.frontColor === "color") {
    P.frontPrint = ((PCF.printing_black_cost * pressSheets) * mk) + (PCF.printing_fullcolor_cost * pressSheets);
  } else {
    P.frontPrint = (PCF.printing_black_cost * pressSheets) * mk;
  }
  P.backPrint = 0;
  if (sides === 2) {
    if (c.backColor === "color") {
      P.backPrint = (PCF.printing_black_cost * pressSheets) + (PCF.printing_fullcolor_cost * pressSheets);
    } else {
      P.backPrint = PCF.printing_black_cost * pressSheets;
    }
  }

  // Press labor
  P.press = (pressSheets / PCF.press_printsperhour) * PCF.labor_press_hr;

  // Cutting labor
  P.cutting = ((((approxThickness / PCF.cutter_stackheight_inches) * imp) / PCF.cutter_cyclesperhour) * PCF.labor_cutting_hr) + PCF.cutterbasefee;

  // Folding labor
  P.folding = fold.val !== "flat" ? ((qty / PCF.bindery_morgana_impressionperhour) * PCF.labor_bindery_hr) + (PCF.labor_bindery_hr / 3) : 0;

  // Vivid
  P.vivid = c.vivid ? Math.ceil(P.press) : 0;

  // Coating
  const coat = COATINGS.find(x => x.val === c.coating) || COATINGS[0];
  P.coat = 0;
  if (coat.val > 0 && paper.coatable) {
    const cs = c.coatSides || 1;
    P.coat = PCF.labor_bindery_hr + Math.ceil(((pressSheets * coat.price * cs) * mk) + ((pressSheets / PCF.uvcoaterimpressionsperhour) * PCF.labor_bindery_hr));
  }

  // Bundling
  const bund = BUNDLING.find(x => x.val === c.bundling) || BUNDLING[0];
  P.bundle = (bund.val > 0 && qty >= 100) ? Math.ceil(((qty / bund.price) * mk) * (PCF.labor_bindery_hr / PCF.bundlesperhour) + 7) : 0;

  // Perforation
  const perf = PERF_OPTS.find(x => x.val === c.perforation) || PERF_OPTS[0];
  P.perforation = 0;
  if (perf.val > 0) {
    P.perforation = Math.ceil(((((qty * perf.price) / PCF.speed_gwperhr) * PCF.labor_gw_hour) * mk) + PCF.labor_gw_setup);
  }

  // Round cornering (flat only)
  const rc = CORNERS.find(x => x.val === c.roundCorner) || CORNERS[0];
  P.rc = 0;
  if (rc.val > 0 && fold.val === "flat") {
    P.rc = Math.floor(((approxThickness / rc.price) / PCF.roundcornerperhour) * PCF.labor_bindery_hr) + (PCF.labor_bindery_hr / 2);
  }

  // Difficult fold surcharges (stack)
  const foldLabor = (qty / PCF.bindery_morgana_impressionperhour) * PCF.labor_bindery_hr;
  // Tier 1: accordion4/roll4/dgate4, OR small sizes (long<9) with 3+ panel folds
  const tier1Folds = ["accordion4","roll4","dgate4"];
  const smallSizeFold = longE < 9 && fold.val !== "flat" && fold.val !== "bifold";
  const smallPresetFold = ["5.5×8.5","6×9"].some(s => c.sizeLabel?.startsWith(s)) && fold.val !== "flat" && fold.val !== "bifold";
  P.diffFold1 = (tier1Folds.includes(fold.val) || smallSizeFold || smallPresetFold) ? foldLabor + (PCF.labor_bindery_hr / 2) : 0;
  // Tier 2: Roll fold specifically (stacks with tier 1)
  P.diffFold2 = fold.val === "roll4" ? foldLabor : 0;
  // Tier 3: narrow sheets (short < 5") with any fold
  P.diffFold3 = (fold.val !== "flat" && shortE < 5) ? foldLabor : 0;

  // Minimum base cost
  P.baseCost = (fold.val !== "flat" || qty <= 250) ? PCF.labor_bindery_hr : 0;

  // Artwork
  const art = ART_OPTS.find(x => x.val === c.artwork) || ART_OPTS[0];
  const artWork = art.val >= 2;
  const ndc = art.val >= 4 ? ((art.price * sides) * PCF.art_newdesignmodifier) + 15 : 0;
  const aec = (art.val >= 2 && art.val < 4) ? art.price : 0;
  P.artwork = ndc + aec;

  // Bleed
  const bld = BLEED_OPTS.find(x => x.val === c.bleed) || BLEED_OPTS[0];
  P.bleed = (!artWork && bld.val > 0) ? Math.max(bld.price * sides, PCF.bleed_minimum) : 0;

  // Proofing
  P.proof = 0;
  if (c.proof > 0) {
    const sf = (PCF.sheetsforlowcosthardcopyproof / pressSheets) > 1 ? 1 : (1500 / pressSheets);
    P.proof = (c.proof >= 3 ? PCF.proof_hardcopy_cost : PCF.proof_digital_cost) * sf;
  }

  // Non-inventory surcharge
  P.nonInv = INV_VALS.includes(paper.val) ? 0 : PCF.non_inventory_fee;

  // Easy discounts
  const isEasySize = SIZE_PRESETS.some(s => s.label === c.sizeLabel);
  const isEasyFold = ["flat","bifold","trifold","z3"].includes(fold.val);
  const costSummary = P.paper + P.frontPrint + P.backPrint + P.cutting + P.folding + P.perforation + P.rc;
  P.discEasyFlat = (fold.val === "flat" && isEasySize) ? -Math.min(costSummary * PCF.easydiscount_factor, PCF.easydiscount_max / 10) : 0;
  P.discEasy = (fold.val !== "flat" && isEasyFold && isEasySize) ? -Math.min(P.press + P.cutting + P.folding, PCF.easydiscount_max / 10) : 0;

  // BW discount
  const allBW = c.frontColor === "bw" && (sides === 1 || c.backColor === "bw");
  P.discBW = allBW ? -(P.press * 0.3) : 0;

  // Cardstock discount — specific cardstock values only
  const csDiscVals = [0.01, 0.02, 0.03, 1.01, 1.02, 2.021, 2.022, 2.023, 2.024, 2.025, 2.01, 3.03, 3.01, 3.04, 3.02];
  P.cardstockDisc = csDiscVals.includes(paper.val) ? -(0.04 * pressSheets) : 0;

  const total = Object.values(P).reduce((s, v) => s + v, 0);

  // Turnaround
  const paperDays = Math.floor(paper.val || 0);
  const vividDays = c.vivid ? Math.floor(pressSheets / 2500) : 0;
  const coatDays = (coat.val > 0 && paper.coatable) ? Math.ceil(pressSheets / (coat.val / (c.coatSides || 1))) : 0;
  const bundleDays = (bund.val > 0 && qty >= 100) ? Math.floor(approxThickness / bund.val) : 0;
  const perfDays = (perf.val > 0) ? Math.ceil(pressSheets / perf.val) : 0;
  const rcDays = (rc.val > 0 && fold.val === "flat") ? Math.floor(Math.min(pressSheets / rc.val, PCF.addon_roundcornermaxdays)) : 0;
  const artDays = art.val >= 4 ? Math.ceil(art.val) : 0;
  const proofDays = c.proof >= 3 ? Math.ceil(paperDays + 3.01) : 0;
  const baseDays = Math.floor(pressSheets / PCF.sheetsturnaround);
  const days = Math.max(PCF.minimum_turnaround_days, baseDays + paperDays + vividDays + coatDays + bundleDays + perfDays + rcDays + artDays + proofDays);

  // Shipping & Rush
  const transitDays = getTransitDays(c.shipState, c.shipZip);
  const productionBizDays = days;
  const bufferedProdDays = productionBizDays * 2;
  const freeDeliveryBizDays = bufferedProdDays + transitDays;
  const earliestBizDays = productionBizDays + 1;
  const shopToday = getShopToday();
  const freeDeliveryDate = addBusinessDays(shopToday, freeDeliveryBizDays);
  const earliestDate = addBusinessDays(shopToday, earliestBizDays);

  let rushMultiplier = 1, rushCost = 0, bizDaysToDate = freeDeliveryBizDays, needByValid = false, tooSoon = false, needByPast = false;
  if (c.needByDate) {
    const nbd = new Date(c.needByDate + "T00:00:00");
    if (nbd <= shopToday) { needByPast = true; }
    else {
      bizDaysToDate = businessDaysBetween(shopToday, nbd);
      needByValid = true;
      if (bizDaysToDate < earliestBizDays) { tooSoon = true; }
      else if (bizDaysToDate < freeDeliveryBizDays) {
        rushMultiplier = freeDeliveryBizDays / bizDaysToDate;
        rushCost = Math.max(0, (total * rushMultiplier) - total);
      }
    }
  }
  const grandTotal = total + rushCost;
  const effectiveDeliveryBiz = (needByValid && !tooSoon) ? bizDaysToDate : freeDeliveryBizDays;
  const effectiveTransit = Math.min(transitDays, Math.max(1, effectiveDeliveryBiz - productionBizDays));
  const prodStartBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit - productionBizDays);
  const productionStartDate = addBusinessDays(shopToday, prodStartBiz);
  const mustShipBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit);
  const mustShipDate = addBusinessDays(shopToday, mustShipBiz);

  // Cost breakdown
  const bd = [
    {l:"Paper",v:P.paper,g:"mat"},{l:"Front Print",v:P.frontPrint,g:"mat"},{l:"Back Print",v:P.backPrint,g:"mat"},
    {l:"Press",v:P.press,g:"lab"},{l:"Cutting",v:P.cutting,g:"lab"},{l:"Folding",v:P.folding,g:"lab"},
    {l:"Vivid Print",v:P.vivid,g:"add"},{l:"UV Coating",v:P.coat,g:"add"},{l:"Bundling",v:P.bundle,g:"add"},
    {l:"Perforation",v:P.perforation,g:"add"},{l:"Round Cornering",v:P.rc,g:"add"},
    {l:"Fold Surcharge 1",v:P.diffFold1,g:"fee"},{l:"Fold Surcharge 2",v:P.diffFold2,g:"fee"},{l:"Fold Surcharge 3",v:P.diffFold3,g:"fee"},
    {l:"Base Cost",v:P.baseCost,g:"fee"},{l:"Non-Inventory",v:P.nonInv,g:"fee"},
    {l:"Artwork",v:P.artwork,g:"art"},{l:"Bleed",v:P.bleed,g:"art"},{l:"Proofing",v:P.proof,g:"art"},
    {l:"BW Discount",v:P.discBW,g:"disc"},{l:"Easy Discount (Flat)",v:P.discEasyFlat,g:"disc"},{l:"Easy Discount",v:P.discEasy,g:"disc"},{l:"Cardstock Disc",v:P.cardstockDisc,g:"disc"},
  ].filter(r => Math.abs(r.v) > 0.005);

  const gC={mat:CK.cyan,lab:CK.key,add:CK.yellow,art:CK.magenta,fee:"#c25050",disc:CK.cyan};
  const gL={mat:"Materials & Ink",lab:"Production Labor",add:"Addons",art:"Artwork & Proofing",fee:"Fees & Surcharges",disc:"Discounts"};
  const grouped=Object.entries(gL).map(([k,label])=>({label,val:bd.filter(r=>r.g===k).reduce((s,r)=>s+r.v,0),c:gC[k]})).filter(g=>Math.abs(g.val)>0.005);

  const perUnit = qty > 0 ? grandTotal / qty : 0;

  return {
    total: Math.round(grandTotal * 100) / 100, baseTotal: Math.round(total * 100) / 100,
    perUnit: Math.round(perUnit * 100) / 100, days, qty: qty, bd, grouped,
    imp, mk, fold, panels, pressSheets, longE, shortE, approxThickness,
    coatOK: paper.coatable, q100: qty >= 100,
    shipping: {
      transitDays, effectiveTransit, freeDeliveryBizDays, freeDeliveryDate: fmtDate(freeDeliveryDate), freeDeliveryYMD: toYMD(freeDeliveryDate),
      earliestBizDays, earliestDate: fmtDate(earliestDate), shopToday: fmtDate(shopToday),
      bizDaysToDate, rushMultiplier, rushCost: Math.round(rushCost * 100) / 100,
      needByValid, needByPast, tooSoon, productionBizDays, bufferedProdDays,
      productionStartDate: fmtDate(productionStartDate), productionStartYMD: toYMD(productionStartDate),
      mustShipDate: fmtDate(mustShipDate), mustShipYMD: toYMD(mustShipDate),
    },
    debug: { pressSheets, imp, qty, mk, dL, approxThickness, fold: fold.label, panels, longE, shortE, paperDays, baseDays, days, P },
  };
}

// DOWNLOADABLE BROCHURE TEMPLATE (jsPDF)
// ═══════════════════════════════════════════════════════════════

function drawDashedLine(pdf, x1, y1, x2, y2, dashLen, gapLen) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len === 0) return;
  var ux = dx / len, uy = dy / len;
  var pos = 0, drawing = true;
  while (pos < len) {
    var segLen = drawing ? dashLen : gapLen;
    if (pos + segLen > len) segLen = len - pos;
    if (drawing) pdf.line(x1 + ux * pos, y1 + uy * pos, x1 + ux * (pos + segLen), y1 + uy * (pos + segLen));
    pos += segLen; drawing = !drawing;
  }
}
function drawDashedRect(pdf, x, y, w, h, dashLen, gapLen) {
  drawDashedLine(pdf, x, y, x + w, y, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y, x + w, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y + h, x, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x, y + h, x, y, dashLen, gapLen);
}

function generateBrochureTemplate(longE, shortE, foldType, panels, foldDir, sizeLabel) {
  try {
    if (!window.jspdf) { alert("PDF library not loaded. Please refresh."); return; }
    const { jsPDF } = window.jspdf;
    const bleed = 0.125, safety = 0.125;
    const trimW = longE, trimH = shortE;
    const docW = trimW + bleed * 2;
    const docH = trimH + bleed * 2;
    const pdf = new jsPDF({ orientation: docW > docH ? "l" : "p", unit: "in", format: [docW, docH] });

    for (let pg = 0; pg < 2; pg++) {
      if (pg > 0) pdf.addPage([docW, docH], docW > docH ? "l" : "p");
      const label = pg === 0 ? "Front / Outside" : "Back / Inside";

      // Light grey bleed zone background
      pdf.setFillColor(240, 240, 240);
      pdf.rect(0, 0, docW, docH, "F");

      // White trim area
      pdf.setFillColor(255, 255, 255);
      pdf.rect(bleed, bleed, trimW, trimH, "F");

      // Bleed line — red solid at document edge
      pdf.setDrawColor(229, 62, 62);
      pdf.setLineWidth(0.012);
      pdf.rect(0.006, 0.006, docW - 0.012, docH - 0.012, "S");

      // Trim line — black dashed
      pdf.setDrawColor(30, 30, 30);
      pdf.setLineWidth(0.01);
      drawDashedRect(pdf, bleed, bleed, trimW, trimH, 0.08, 0.05);

      // Safety line — green dashed
      pdf.setDrawColor(56, 161, 105);
      pdf.setLineWidth(0.008);
      drawDashedRect(pdf, bleed + safety, bleed + safety, trimW - safety * 2, trimH - safety * 2, 0.05, 0.03);

      // Fold lines — orange dashed
      if (panels > 1) {
        pdf.setDrawColor(245, 166, 35);
        pdf.setLineWidth(0.01);
        const foldingLong = foldDir === "long";
        for (let i = 1; i < panels; i++) {
          const frac = i / panels;
          if (foldingLong) {
            const x = bleed + trimW * frac;
            drawDashedLine(pdf, x, bleed + 0.1, x, bleed + trimH - 0.1, 0.08, 0.04);
            pdf.setFontSize(6); pdf.setTextColor(245, 166, 35);
            pdf.text("FOLD " + i, x + 0.04, bleed + 0.25);
          } else {
            const y = bleed + trimH * frac;
            drawDashedLine(pdf, bleed + 0.1, y, bleed + trimW - 0.1, y, 0.08, 0.04);
            pdf.setFontSize(6); pdf.setTextColor(245, 166, 35);
            pdf.text("FOLD " + i, bleed + 0.15, y - 0.04);
          }
        }
      }

      // Text watermark — tiled "PriorityPrintService.com"
      var tileSize = Math.min(trimW * 0.2, 1.2);
      var tileStep = tileSize * 1.6;
      var safeL = bleed + safety, safeT = bleed + safety;
      var safeW = trimW - safety * 2, safeH = trimH - safety * 2;
      var cols = Math.floor(safeW / tileStep), rows = Math.floor(safeH / tileStep);
      var gridW = cols * tileStep, gridH = rows * tileStep;
      var offX = safeL + (safeW - gridW) / 2, offY = safeT + (safeH - gridH) / 2;
      pdf.setFontSize(tileSize * 3.5);
      pdf.setTextColor(230, 230, 230);
      for (var row = 0; row < rows; row++) {
        for (var col = 0; col < cols; col++) {
          pdf.text("PriorityPrintService.com", offX + col * tileStep + tileStep / 2, offY + row * tileStep + tileStep / 2, { align: "center" });
        }
      }

      // Page label
      var cx = docW / 2;
      pdf.setFontSize(10); pdf.setTextColor(170, 170, 170);
      pdf.text(label, cx, docH / 2 - 0.1, { align: "center" });

      // Dimensions
      pdf.setFontSize(7); pdf.setTextColor(190, 190, 190);
      pdf.text("Trim: " + trimW + '" \u00d7 ' + trimH + '"  |  With bleeds: ' + docW.toFixed(3) + '" \u00d7 ' + docH.toFixed(3) + '"', cx, docH / 2 + 0.12, { align: "center" });
      if (panels > 1) {
        var foldDim = foldDir === "long" ? trimW : trimH;
        var staticDim = foldDir === "long" ? trimH : trimW;
        pdf.text("Folded: " + staticDim.toFixed(1) + '" \u00d7 ' + (foldDim / panels).toFixed(1) + '"  (' + panels + ' panels)', cx, docH / 2 + 0.3, { align: "center" });
      }

      // URL
      pdf.setFontSize(7); pdf.setTextColor(150, 150, 150);
      pdf.text("priorityprintservice.com", cx, docH - bleed - 0.08, { align: "center" });

      // Legend on first page
      if (pg === 0) {
        var lx = bleed + safety + 0.1;
        var ly = docH - bleed - 0.42;
        pdf.setFontSize(6);
        pdf.setTextColor(229, 62, 62);
        pdf.text("\u2014 Bleed (extend backgrounds to this edge)", lx, ly - 0.24);
        pdf.setTextColor(30, 30, 30);
        pdf.text("- - Trim (cut line)", lx, ly - 0.16);
        pdf.setTextColor(56, 161, 105);
        pdf.text("- - Safety (keep text inside)", lx, ly - 0.08);
        if (panels > 1) { pdf.setTextColor(245, 166, 35); pdf.text("- - Fold lines", lx, ly); }
      }
    }

    var safeName = (sizeLabel || (longE + "x" + shortE)).replace(/[^a-zA-Z0-9._-]/g, "_");
    var foldName = foldType === "flat" ? "flat" : foldType;
    pdf.save("PPS_Brochure_Template_" + safeName + "_" + foldName + ".pdf");
  } catch (e) {
    console.error("Template generation failed:", e);
    alert("Template generation failed: " + e.message);
  }
}

// 3D FOLD SIMULATION
// ═══════════════════════════════════════════════════════════════
function FoldPreview({ longEdge, shortEdge, foldType, panels, foldDir }) {
  const [foldAngle, setFoldAngle] = useState(0);
  const foldingLong = foldDir === "long";
  const foldDim = foldingLong ? longEdge : shortEdge;
  const staticDim = foldingLong ? shortEdge : longEdge;
  const panelW = foldDim / panels;

  const maxPx = 500;
  const scale = Math.min(maxPx / foldDim, maxPx / staticDim) * 0.8;
  const pw = panelW * scale;
  const ph = staticDim * scale;
  const totalW = pw * panels;

  const colors = ["#e3f2fd","#bbdefb","#90caf9","#64b5f6","#42a5f5"];

  // Build nested panel chain — each panel is child of previous for proper 3D folding
  function buildPanels(idx) {
    if (idx >= panels) return null;
    const angle = idx === 0 ? 0 : (() => {
      const a = foldAngle;
      if (foldType === "z3" || foldType === "accordion4") return idx % 2 === 1 ? a : -a;
      if (foldType === "gate3") return idx === 2 ? -a : a;
      if (foldType === "dgate4") return (idx === 1 || idx === 3) ? (idx <= 1 ? a : -a) : a;
      if (foldType === "dparallel4") return idx % 2 === 1 ? a : -a;
      return a; // bifold, trifold, roll4: all fold same direction
    })();

    return (
      <div style={{
        width: pw, height: ph, position: idx === 0 ? "relative" : "absolute",
        left: idx === 0 ? 0 : pw, top: 0,
        transformOrigin: "left center",
        transform: idx === 0 ? "none" : `rotateY(${angle}deg)`,
        transformStyle: "preserve-3d",
        transition: "transform 0.3s ease",
      }}>
        {/* Front face */}
        <div style={{
          position: "absolute", inset: 0,
          background: colors[idx % colors.length],
          border: "1px solid rgba(0,0,0,0.15)",
          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
          fontSize: 11, color: "rgba(0,0,0,0.5)", fontWeight: 600,
          backfaceVisibility: "hidden", borderRadius: 2,
        }}>
          <div>Panel {idx + 1}</div>
          <div style={{ fontSize: 9, fontWeight: 400, marginTop: 2 }}>{panelW.toFixed(1)}" × {staticDim.toFixed(1)}"</div>
        </div>
        {/* Back face */}
        <div style={{
          position: "absolute", inset: 0,
          background: `${colors[idx % colors.length]}88`,
          border: "1px dashed rgba(0,0,0,0.2)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 10, color: "rgba(0,0,0,0.3)",
          backfaceVisibility: "hidden", borderRadius: 2,
          transform: "rotateY(180deg)",
        }}>Back {idx + 1}</div>
        {buildPanels(idx + 1)}
      </div>
    );
  }

  if (panels <= 1) {
    return (
      <div style={{ textAlign: "center", padding: 20 }}>
        <div style={{ display: "inline-block", width: totalW, height: ph, background: colors[0], border: "1px solid rgba(0,0,0,0.15)", borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, color: "rgba(0,0,0,0.4)" }}>
          Flat Sheet — {longEdge}" × {shortEdge}"
        </div>
      </div>
    );
  }

  return (
    <div style={{ padding: 20 }}>
      <div className="fold-viewport" style={{ height: ph + 40, margin: "0 auto", maxWidth: 600 }}>
        <div style={{ transformStyle: "preserve-3d", transform: `rotateX(-5deg) rotateY(${-foldAngle * 0.1}deg)` }}>
          {buildPanels(0)}
        </div>
      </div>
      <div style={{ textAlign: "center", marginTop: 12 }}>
        <input type="range" min={0} max={170} value={foldAngle} onChange={e => setFoldAngle(Number(e.target.value))} style={{ width: 220, accentColor: CK.cyan }} />
        <div style={{ fontSize: 11, color: CC.mid, marginTop: 4 }}>{foldAngle === 0 ? "Flat (open)" : foldAngle >= 170 ? "Fully Folded" : `Fold: ${foldAngle}°`}</div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// FOLD LINE OVERLAY (for proof/template view)
// ═══════════════════════════════════════════════════════════════
function FoldLines({ panels, foldDir }) {
  if (panels <= 1) return null;
  const foldingLong = foldDir === "long";
  return Array.from({ length: panels - 1 }, (_, i) => {
    const pct = ((i + 1) / panels) * 100;
    return (
      <div key={i} style={{
        position: "absolute",
        left: foldingLong ? `${pct}%` : 0,
        top: foldingLong ? 0 : `${pct}%`,
        width: foldingLong ? 0 : "100%",
        height: foldingLong ? "100%" : 0,
        borderLeft: foldingLong ? "2px dashed #f59e0b" : "none",
        borderTop: !foldingLong ? "2px dashed #f59e0b" : "none",
        zIndex: 2, pointerEvents: "none",
      }}>
        <span style={{
          position: "absolute",
          top: foldingLong ? 8 : -14,
          left: foldingLong ? -30 : 8,
          fontSize: 8, color: "#f59e0b", fontWeight: 700,
          transform: foldingLong ? "rotate(-90deg)" : "none",
          whiteSpace: "nowrap",
        }}>Fold {i + 1}</span>
      </div>
    );
  });
}

// ═══════════════════════════════════════════════════════════════
// SHEET PREVIEW — Upload + Proof for single-sheet products (brochures, flat printing)
// ═══════════════════════════════════════════════════════════════

function SheetPreview({ longEdge, shortEdge, foldType, foldDir, panels, onArtwork }) {
  const mob = useIsMobile();
  const [frontArt, setFrontArt] = useState(null); // {dataUrl, file, dims:{w,h}}
  const [backArt, setBackArt] = useState(null);
  const [side, setSide] = useState("front"); // "front" | "back"
  const [proofOpen, setProofOpen] = useState(false);
  const [previewOpen, setPreviewOpen] = useState(false);
  const [previewAngle, setPreviewAngle] = useState(0);
  const [approved, setApproved] = useState(false);
  const [dropHover, setDropHover] = useState(false);
  const [loading, setLoading] = useState(false);
  const [fileName, setFileName] = useState("");
  const fileRef = useRef(null);
  const frontInputRef = useRef(null);
  const backInputRef = useRef(null);
  const rawFileRef = useRef(null);

  const BLEED = 0.125;
  const bleedW = longEdge + BLEED * 2;
  const bleedH = shortEdge + BLEED * 2;
  const bleedPctX = (BLEED / bleedW) * 100;
  const bleedPctY = (BLEED / bleedH) * 100;
  const safetyPctX = ((BLEED + 0.125) / bleedW) * 100;
  const safetyPctY = ((BLEED + 0.125) / bleedH) * 100;

  async function processFile(fileList) {
    if (!fileList || !fileList.length) return;
    const file = fileList[0];
    setLoading(true);
    setFileName(file.name);
    rawFileRef.current = file;

    try {
      if (file.type === "application/pdf") {
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const renderPage = async (num) => {
          const pg = await pdf.getPage(num);
          const vp = pg.getViewport({ scale: 2 });
          const c = document.createElement("canvas");
          c.width = vp.width; c.height = vp.height;
          await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
          const [x0, y0, x1, y1] = pg.view;
          return { dataUrl: c.toDataURL("image/jpeg", 0.85), dims: { w: (x1 - x0) / 72, h: (y1 - y0) / 72 } };
        };
        const front = await renderPage(1);
        setFrontArt({ ...front, file });
        if (pdf.numPages >= 2) {
          const back = await renderPage(2);
          setBackArt({ ...back, file });
        }
      } else {
        const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
        if (!dataUrl) return;
        const dims = await new Promise((res) => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth / 300, h: img.naturalHeight / 300 }); img.onerror = () => res({ w: 0, h: 0 }); img.src = dataUrl; });
        setFrontArt({ dataUrl, file, dims });
      }
      setApproved(false);
      if (onArtwork) onArtwork({ type: "files", list: [file] });
    } catch (e) { console.error("File processing failed:", e); }
    setLoading(false);
  }

  function handleClear() {
    setFrontArt(null); setBackArt(null); setFileName(""); setApproved(false);
    rawFileRef.current = null;
    if (onArtwork) onArtwork({ type: "none" });
  }

  const hasArt = !!frontArt;
  const currentArt = side === "front" ? frontArt : backArt;

  // Fold line positions as percentages
  const foldLines = [];
  if (panels > 1) {
    const foldingLong = foldDir === "long";
    for (let i = 1; i < panels; i++) {
      const pct = (i / panels) * 100;
      foldLines.push({ pct, vertical: foldingLong });
    }
  }

  return (
    <div>
      {/* Upload area */}
      {!hasArt ? (
        <div
          onDragOver={e => { e.preventDefault(); setDropHover(true); }}
          onDragLeave={() => setDropHover(false)}
          onDrop={e => { e.preventDefault(); setDropHover(false); processFile(e.dataTransfer.files); }}
          onClick={() => fileRef.current?.click()}
          style={{
            padding: mob ? "24px 16px" : "32px 20px", borderRadius: 8,
            border: `2px dashed ${dropHover ? CK.cyan : CC.border}`,
            background: dropHover ? CK.cyanLight : "#fafafa",
            cursor: "pointer", textAlign: "center", transition: "all .15s",
          }}>
          <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.tiff,.tif" onChange={e => processFile(e.target.files)} style={{ display: "none" }} />
          <div style={{ fontSize: 28, marginBottom: 6 }}>📄</div>
          <div style={{ fontSize: 13, fontWeight: 600, color: CC.dark }}>
            {loading ? "Processing..." : "Drop your artwork here or click to upload"}
          </div>
          <div style={{ fontSize: 11, color: CC.light, marginTop: 4 }}>
            PDF (page 1 = front, page 2 = back) or JPG/PNG for front side
          </div>
        </div>
      ) : (
        <div>
          {/* File info + actions */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0" }}>
            <div style={{ fontSize: 12, color: CC.mid }}>
              <strong>{fileName}</strong>
              {frontArt?.dims && <span style={{ color: CC.light, marginLeft: 6 }}>{frontArt.dims.w.toFixed(1)}" × {frontArt.dims.h.toFixed(1)}"</span>}
            </div>
            <button type="button" onClick={handleClear} style={{
              padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
              border: `1px solid ${CC.border}`, background: "#fff", color: CC.light,
            }}>Remove uploads</button>
          </div>

          {/* Proof / Preview pill selector — matches saddle stitch */}
          <div style={{ display: "flex", borderRadius: 6, overflow: "hidden", border: `1px solid ${CC.border}`, boxShadow: "0 1px 3px rgba(0,0,0,.06)", marginBottom: 8 }}>
            <button type="button" onClick={() => setProofOpen(true)} style={{
              flex: 1, padding: "11px 10px", fontSize: 13, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              background: "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)", color: "#555",
              borderRight: `1px solid ${CC.border}`,
            }}>
              🔍 Proof {!approved && <span style={{ fontSize: 9, fontWeight: 700, background: "#fee2e2", color: "#dc2626", padding: "1px 6px", borderRadius: 4 }}>required</span>}
            </button>
            <button type="button" onClick={() => { setPreviewOpen(true); setPreviewAngle(0); }} style={{
              flex: 1, padding: "11px 10px", fontSize: 13, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              background: "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)", color: "#555",
            }}>
              📖 Preview
            </button>
          </div>

          {/* Individual side upload slots */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
            {[{s:"front",label:"Front / Outside",art:frontArt,setArt:setFrontArt,inputRef:frontInputRef},{s:"back",label:"Back / Inside",art:backArt,setArt:setBackArt,inputRef:backInputRef}].map(({s,label,art,setArt,inputRef}) => {
              const handleSlotFile = async (file) => {
                if (!file) return;
                const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
                if (!dataUrl) return;
                const dims = await new Promise(res => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth / 300, h: img.naturalHeight / 300 }); img.onerror = () => res({ w: 0, h: 0 }); img.src = dataUrl; });
                setArt({ dataUrl, file, dims });
                setApproved(false);
              };
              return (
                <div key={s} style={{ position: "relative" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".5px", color: CC.mid, marginBottom: 4 }}>
                    {label}
                  </div>
                  {art ? (
                    <div style={{ position: "relative", borderRadius: 6, overflow: "hidden", border: `2px solid ${CC.border}`, cursor: "pointer" }}
                      onClick={() => { setSide(s); setProofOpen(true); }}>
                      <img src={art.dataUrl} style={{ width: "100%", display: "block", aspectRatio: `${longEdge}/${shortEdge}`, objectFit: "cover" }} />
                      <div style={{ position: "absolute", top: 4, right: 4, display: "flex", gap: 3 }}>
                        <button type="button" onClick={e => { e.stopPropagation(); inputRef.current?.click(); }} style={{
                          width: 22, height: 22, borderRadius: 4, border: "none", background: "rgba(0,0,0,.6)", color: "#fff", fontSize: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                        }} title="Replace">↻</button>
                        <button type="button" onClick={e => { e.stopPropagation(); setArt(null); setApproved(false); }} style={{
                          width: 22, height: 22, borderRadius: 4, border: "none", background: "rgba(0,0,0,.6)", color: "#fff", fontSize: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                        }} title="Remove">✕</button>
                      </div>
                    </div>
                  ) : (
                    <div
                      onDragOver={e => e.preventDefault()}
                      onDrop={e => { e.preventDefault(); const f = e.dataTransfer.files?.[0]; if (f) handleSlotFile(f); }}
                      onClick={() => inputRef.current?.click()}
                      style={{
                        aspectRatio: `${longEdge}/${shortEdge}`, borderRadius: 6,
                        border: `2px dashed ${CC.border}`, background: "#fafafa",
                        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                        cursor: "pointer", transition: "all .15s",
                      }}>
                      <div style={{ fontSize: 20, marginBottom: 2 }}>+</div>
                      <div style={{ fontSize: 10, color: CC.light }}>Drop or click</div>
                    </div>
                  )}
                  <input ref={inputRef} type="file" accept=".jpg,.jpeg,.png,.tiff,.tif" onChange={e => { const f = e.target.files?.[0]; if (f) handleSlotFile(f); e.target.value = ""; }} style={{ display: "none" }} />
                </div>
              );
            })}
          </div>

          {/* Approval status */}
          {approved ? (
            <div style={{ marginTop: 8, padding: "6px 12px", background: "#f0fdf4", border: "1px solid #86efac", borderRadius: 5, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: "#166534" }}>✓ Artwork Approved</span>
              <button type="button" onClick={() => setApproved(false)} style={{ fontSize: 10, fontWeight: 600, border: "1px solid #86efac", background: "#fff", color: "#16a34a", borderRadius: 4, padding: "2px 8px", cursor: "pointer", fontFamily: "inherit" }}>Review</button>
            </div>
          ) : (
            <div style={{ marginTop: 8, padding: "6px 12px", background: "#fef2f2", border: "1px solid #f5cccc", borderRadius: 5, fontSize: 11, color: "#dc2626" }}>
              Open the proof view to review and approve your artwork
            </div>
          )}
        </div>
      )}

      {/* Proof Modal */}
      {proofOpen && currentArt && (
        <div style={{ position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,0,0,.85)", display: "flex", flexDirection: "column" }}>
          {/* Header */}
          <div style={{ padding: "12px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid rgba(255,255,255,.1)" }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>Artwork Proof — {side === "front" ? "Front / Outside" : "Back / Inside"}</div>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,.4)" }}>{longEdge}" × {shortEdge}" flat{panels > 1 ? ` · ${panels} panels (${foldType})` : ""}</div>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              {backArt && (
                <div style={{ display: "flex", borderRadius: 4, overflow: "hidden", border: "1px solid rgba(255,255,255,.2)" }}>
                  <button type="button" onClick={() => setSide("front")} style={{ padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: side === "front" ? CK.cyan : "rgba(255,255,255,.06)", color: side === "front" ? "#fff" : "rgba(255,255,255,.5)" }}>Front</button>
                  <button type="button" onClick={() => setSide("back")} style={{ padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: side === "back" ? CK.cyan : "rgba(255,255,255,.06)", color: side === "back" ? "#fff" : "rgba(255,255,255,.5)" }}>Back</button>
                </div>
              )}
              <button type="button" onClick={() => { setApproved(true); setProofOpen(false); }} style={{
                padding: "5px 14px", fontSize: 11, fontWeight: 700, border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                background: "linear-gradient(135deg, #22c55e 0%, #16a34a 100%)", color: "#fff",
              }}>✓ Approve</button>
              <button type="button" onClick={() => setProofOpen(false)} style={{ background: "none", border: "1px solid rgba(255,255,255,.15)", color: "rgba(255,255,255,.5)", width: 32, height: 32, borderRadius: 8, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
            </div>
          </div>

          {/* Proof view — bleed-inclusive container like saddle stitch */}
          <div style={{ flex: 1, overflow: "auto", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
            <div style={{ position: "relative", maxWidth: 800, width: "100%", aspectRatio: `${bleedW}/${bleedH}`, background: "#1a1d23", borderRadius: 4, overflow: "hidden" }}>
              {/* Art in trim area — inset from bleed container */}
              <div style={{ position: "absolute", top: `${bleedPctY}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, bottom: `${bleedPctY}%`, overflow: "hidden" }}>
                <img src={currentArt.dataUrl} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
              </div>

              {/* Bleed guide (red dashed) — at container edge */}
              <div style={{ position: "absolute", inset: 0, border: "2.5px dashed #ef4444", pointerEvents: "none", zIndex: 1, opacity: 0.8 }} />
              {/* Trim guide (white/light dashed) — inset by bleed */}
              <div style={{ position: "absolute", top: `${bleedPctY}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, bottom: `${bleedPctY}%`, border: "2.5px dashed #e2e8f0", pointerEvents: "none", zIndex: 1 }} />
              {/* Safety guide (green dashed) — further inset */}
              <div style={{ position: "absolute", top: `${safetyPctY}%`, left: `${safetyPctX}%`, right: `${safetyPctX}%`, bottom: `${safetyPctY}%`, border: "2.5px dashed #38a169", pointerEvents: "none", zIndex: 1 }} />

              {/* Fold lines (orange dashed) */}
              {foldLines.map((fl, i) => (
                <div key={i} style={{
                  position: "absolute", pointerEvents: "none", zIndex: 2,
                  ...(fl.vertical
                    ? { left: `${bleedPctX + (100 - bleedPctX * 2) * fl.pct / 100}%`, top: `${bleedPctY}%`, bottom: `${bleedPctY}%`, width: 0, borderLeft: "2.5px dashed #f59e0b" }
                    : { top: `${bleedPctY + (100 - bleedPctY * 2) * fl.pct / 100}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, height: 0, borderTop: "2.5px dashed #f59e0b" }
                  ),
                }}>
                  <span style={{
                    position: "absolute", fontSize: 9, fontWeight: 700, color: "#f59e0b",
                    background: "rgba(0,0,0,.5)", padding: "1px 4px", borderRadius: 2,
                    ...(fl.vertical ? { top: 8, left: 4 } : { left: 8, top: 2 }),
                  }}>Fold {i + 1}</span>
                </div>
              ))}

              {/* Trim shadow overlay — darkens the bleed zone around the art */}
              <div style={{ position: "absolute", top: `${bleedPctY}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, bottom: `${bleedPctY}%`, boxShadow: "0 0 0 200px rgba(0,0,0,0.15)", pointerEvents: "none", zIndex: 0 }} />

              {/* Legend */}
              <div style={{ position: "absolute", bottom: 8, left: 8, display: "flex", gap: 10, fontSize: 9, zIndex: 3, background: "rgba(0,0,0,.6)", padding: "3px 8px", borderRadius: 3 }}>
                <span style={{ color: "#ef4444", fontWeight: 600 }}>— Bleed</span>
                <span style={{ color: "#e2e8f0", fontWeight: 600 }}>- - Trim</span>
                <span style={{ color: "#38a169", fontWeight: 600 }}>- - Safety</span>
                {foldLines.length > 0 && <span style={{ color: "#f59e0b", fontWeight: 600 }}>- - Fold</span>}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 3D Preview Modal */}
      {previewOpen && frontArt && (
        <div style={{ position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,0,0,.9)", display: "flex", flexDirection: "column" }}>
          {/* Header */}
          <div style={{ padding: "12px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid rgba(255,255,255,.1)" }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>Book Preview</div>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,.4)" }}>
                {longEdge}" × {shortEdge}" {panels > 1 ? `· ${panels} panels · ${foldType}` : "flat"}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              {backArt && (
                <div style={{ display: "flex", borderRadius: 4, overflow: "hidden", border: "1px solid rgba(255,255,255,.2)" }}>
                  <button type="button" onClick={() => setSide("front")} style={{ padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: side === "front" ? CK.cyan : "rgba(255,255,255,.06)", color: side === "front" ? "#fff" : "rgba(255,255,255,.5)" }}>Front</button>
                  <button type="button" onClick={() => setSide("back")} style={{ padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: side === "back" ? CK.cyan : "rgba(255,255,255,.06)", color: side === "back" ? "#fff" : "rgba(255,255,255,.5)" }}>Back</button>
                </div>
              )}
              <button type="button" onClick={() => setPreviewOpen(false)} style={{ background: "none", border: "1px solid rgba(255,255,255,.15)", color: "rgba(255,255,255,.5)", width: 32, height: 32, borderRadius: 8, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
            </div>
          </div>

          {/* 3D fold viewport */}
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20 }}>
            {panels > 1 ? (() => {
              const artSrc = (side === "front" ? frontArt : backArt)?.dataUrl;
              const foldingLong = foldDir === "long";
              const totalW = foldingLong ? 500 : 500 * (shortEdge / longEdge);
              const totalH = foldingLong ? 500 * (shortEdge / longEdge) : 500;
              const pw = foldingLong ? totalW / panels : totalW;
              const ph = foldingLong ? totalH : totalH / panels;
              const angle = previewAngle;

              function getFoldDir(type, idx) {
                if (type === "bifold") return 1;
                if (type === "trifold" || type === "roll4") return 1;
                if (type === "z3" || type === "accordion4") return idx % 2 === 0 ? 1 : -1;
                if (type === "gate3") return idx === 0 ? 1 : -1;
                if (type === "dgate4") return (idx === 0 || idx === 2) ? 1 : -1;
                if (type === "dparallel4") return idx % 2 === 0 ? 1 : -1;
                return 1;
              }

              function buildPanels(idx) {
                if (idx >= panels) return null;
                const dir = idx === 0 ? 0 : getFoldDir(foldType, idx - 1);
                const bgPos = foldingLong
                  ? `${-(idx * pw)}px 0px` : `0px ${-(idx * ph)}px`;
                const bgSize = foldingLong
                  ? `${totalW}px ${totalH}px` : `${totalW}px ${totalH}px`;

                return (
                  <div style={{
                    width: pw, height: ph,
                    transformOrigin: foldingLong ? "left center" : "center top",
                    transform: idx === 0 ? "none" : (foldingLong
                      ? `rotateY(${dir * angle}deg)`
                      : `rotateX(${-dir * angle}deg)`),
                    transition: "transform .3s",
                    position: "relative",
                    transformStyle: "preserve-3d",
                  }}>
                    {/* Panel face */}
                    <div style={{
                      width: "100%", height: "100%",
                      position: "absolute", inset: 0,
                      backgroundImage: artSrc ? `url(${artSrc})` : "none",
                      backgroundPosition: bgPos,
                      backgroundSize: bgSize,
                      backgroundColor: artSrc ? "transparent" : `hsl(${210 + idx * 30}, 30%, ${92 - idx * 3}%)`,
                      border: "1px solid rgba(255,255,255,.15)",
                      borderRadius: 2,
                      backfaceVisibility: "hidden",
                      display: "flex", alignItems: "center", justifyContent: "center",
                    }}>
                      {!artSrc && <span style={{ fontSize: 11, color: "rgba(255,255,255,.3)", fontWeight: 600 }}>Panel {idx + 1}</span>}
                    </div>
                    {/* Next panel nested for proper fold chaining */}
                    {buildPanels(idx + 1)}
                  </div>
                );
              }

              return (
                <div style={{ perspective: 1200 }}>
                  <div style={{
                    transformStyle: "preserve-3d",
                    transform: `rotateX(-5deg) rotateY(${panels > 2 && angle > 90 ? -15 : 0}deg)`,
                    transition: "transform .3s",
                  }}>
                    {buildPanels(0)}
                  </div>
                </div>
              );
            })() : (
              /* Flat — just show the artwork */
              <div style={{ maxWidth: 600, width: "100%", position: "relative" }}>
                <img src={(side === "front" ? frontArt : backArt)?.dataUrl || frontArt.dataUrl} style={{ width: "100%", display: "block", borderRadius: 4, border: "1px solid rgba(255,255,255,.15)" }} />
                <div style={{ position: "absolute", bottom: 8, left: 8, fontSize: 10, fontWeight: 600, color: "#fff", background: "rgba(0,0,0,.5)", padding: "2px 8px", borderRadius: 3 }}>
                  {side === "front" ? "Front / Outside" : "Back / Inside"}
                </div>
              </div>
            )}

            {/* Fold angle slider */}
            {panels > 1 && (
              <div style={{ marginTop: 20, textAlign: "center" }}>
                <input type="range" min={0} max={180} value={previewAngle} onChange={e => setPreviewAngle(Number(e.target.value))}
                  style={{ width: 240, accentColor: CK.cyan }} />
                <div style={{ fontSize: 11, color: "rgba(255,255,255,.4)", marginTop: 4 }}>
                  {previewAngle === 0 ? "Flat (unfolded)" : previewAngle === 180 ? "Fully folded" : `${previewAngle}°`}
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function Panel({ result, compact }) {

      </div>

        {[["Per Unit", "$" + r.perUnit.toFixed(2)], ["Qty", r.qty.toLocaleString()], ["Days", r.days + " biz"]].map(([l, v], i) => (
          <div key={i} style={{ flex: 1, padding: "11px 8px", textAlign: "center", borderRight: i < 2 ? `1px solid ${CC.border}` : "none" }}>
            <div style={{ fontSize: 9.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: CC.light, marginBottom: 1 }}>{l}</div>
            <div style={{ fontSize: 14.5, fontWeight: 700, color: CC.dark }}>{v}</div>
          </div>
        ))}

          </div>
        ))}
      </div>}
    </div>
  );
}

function App() {

  const [op, setOp] = useState({ s1: true, s2: true, s3: false, s4: false, s5: false });
  const tog = k => setOp(p => ({ ...p, [k]: !p[k] }));
