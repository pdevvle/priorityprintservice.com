  const errors = [];
  let imp, longE, shortE;
  if (c.sizeMode === "preset") {
    const preset = SIZE_PRESETS.find(s => s.label === c.sizeLabel);
    if (!preset) return { error: ["Select a size"] };
    imp = preset.imp; longE = preset.long; shortE = preset.short;
  } else {
    longE = Math.max(c.longEdge, c.shortEdge);
    shortE = Math.min(c.longEdge, c.shortEdge);
    if (longE < 2 || shortE < 2) return { error: ["Minimum dimension is 2 inches"] };
    if (longE > 27 || shortE > 12.5) return { error: ["Maximum size: 27×12.5 inches flat"] };
    imp = calcBrochureImp(longE, shortE);
    if (imp <= 0) return { error: ["Size too large for press sheet"] };
  }

  const qty = c.qty;
  if (qty < 1) return { error: ["Enter quantity"] };
  const fold = FOLD_TYPES.find(f => f.val === c.foldType) || FOLD_TYPES[0];
  const panels = fold.panels;
  const pressSheets = qty / imp;
  const paper = c.paper;
  const sides = c.sides;

  // Folded dimension validation
  if (panels > 1) {
    const foldDim = c.foldDir === "short" ? shortE : longE;
    const panelSize = foldDim / panels;
    if (panelSize < 2) errors.push(`Folded panel too small (${panelSize.toFixed(1)}"). Min 2" per panel.`);
    if (c.foldDir === "short" && longE > 13) errors.push("Long edge exceeds 13\" folder throat when folding short side.");
  }
  if (errors.length) return { error: errors };

  // Markup
  const dL = 0.7 * Math.log(pressSheets) + 0.5412;
  const mk = Math.max(PCF.backend_maximummarkup - dL, PCF.backend_minimummarkup);

  // Approximate thickness
  const approxThickness = (paper.price / 10) * qty;

  const P = {};

  // Paper
  P.paper = (paper.price * pressSheets) * mk;

  // Printing — front has markup on BW base, back does not
  if (c.frontColor === "color") {
    P.frontPrint = ((PCF.printing_black_cost * pressSheets) * mk) + (PCF.printing_fullcolor_cost * pressSheets);
  } else {
    P.frontPrint = (PCF.printing_black_cost * pressSheets) * mk;
  }
  P.backPrint = 0;
  if (sides === 2) {
    if (c.backColor === "color") {
      P.backPrint = (PCF.printing_black_cost * pressSheets) + (PCF.printing_fullcolor_cost * pressSheets);
    } else {
      P.backPrint = PCF.printing_black_cost * pressSheets;
    }
  }

  // Press labor
  P.press = (pressSheets / PCF.press_printsperhour) * PCF.labor_press_hr;

  // Cutting labor
  P.cutting = ((((approxThickness / PCF.cutter_stackheight_inches) * imp) / PCF.cutter_cyclesperhour) * PCF.labor_cutting_hr) + PCF.cutterbasefee;

  // Folding labor
  P.folding = fold.val !== "flat" ? ((qty / PCF.bindery_morgana_impressionperhour) * PCF.labor_bindery_hr) + (PCF.labor_bindery_hr / 3) : 0;

  // Vivid
  P.vivid = c.vivid ? Math.ceil(P.press) : 0;

  // Coating
  const coat = COATINGS.find(x => x.val === c.coating) || COATINGS[0];
  P.coat = 0;
  if (coat.val > 0 && paper.coatable) {
    const cs = c.coatSides || 1;
    P.coat = PCF.labor_bindery_hr + Math.ceil(((pressSheets * coat.price * cs) * mk) + ((pressSheets / PCF.uvcoaterimpressionsperhour) * PCF.labor_bindery_hr));
  }

  // Bundling
  const bund = BUNDLING.find(x => x.val === c.bundling) || BUNDLING[0];
  P.bundle = (bund.val > 0 && qty >= 100) ? Math.ceil(((qty / bund.price) * mk) * (PCF.labor_bindery_hr / PCF.bundlesperhour) + 7) : 0;

  // Perforation
  const perf = PERF_OPTS.find(x => x.val === c.perforation) || PERF_OPTS[0];
  P.perforation = 0;
  if (perf.val > 0) {
    P.perforation = Math.ceil(((((qty * perf.price) / PCF.speed_gwperhr) * PCF.labor_gw_hour) * mk) + PCF.labor_gw_setup);
  }

  // Round cornering (flat only)
  const rc = CORNERS.find(x => x.val === c.roundCorner) || CORNERS[0];
  P.rc = 0;
  if (rc.val > 0 && fold.val === "flat") {
    P.rc = Math.floor(((approxThickness / rc.price) / PCF.roundcornerperhour) * PCF.labor_bindery_hr) + (PCF.labor_bindery_hr / 2);
  }

  // Difficult fold surcharges
  const foldLabor = (qty / PCF.bindery_morgana_impressionperhour) * PCF.labor_bindery_hr;
  P.diffFold1 = (panels === 4 || (longE < 9 && fold.val !== "flat" && fold.val !== "bifold")) ? foldLabor + (PCF.labor_bindery_hr / 2) : 0;
  P.diffFold2 = fold.val === "roll4" ? foldLabor : 0;
  P.diffFold3 = (fold.val !== "flat" && (c.foldDir === "short" || shortE < 5)) ? foldLabor : 0;

  // Minimum base cost
  P.baseCost = (fold.val !== "flat" || qty <= 250) ? PCF.labor_bindery_hr : 0;

  // Artwork
  const art = ART_OPTS.find(x => x.val === c.artwork) || ART_OPTS[0];
  const artWork = art.val >= 2;
  const ndc = art.val >= 4 ? ((art.price * sides) * PCF.art_newdesignmodifier) + 15 : 0;
  const aec = (art.val >= 2 && art.val < 4) ? art.price : 0;
  P.artwork = ndc + aec;

  // Bleed
  const bld = BLEED_OPTS.find(x => x.val === c.bleed) || BLEED_OPTS[0];
  P.bleed = (!artWork && bld.val > 0) ? Math.max(bld.price * sides, PCF.bleed_minimum) : 0;

  // Proofing
  P.proof = 0;
  if (c.proof > 0) {
    const sf = (PCF.sheetsforlowcosthardcopyproof / pressSheets) > 1 ? 1 : (1500 / pressSheets);
    P.proof = (c.proof >= 3 ? PCF.proof_hardcopy_cost : PCF.proof_digital_cost) * sf;
  }

  // Non-inventory surcharge
  P.nonInv = INV_VALS.includes(paper.val) ? 0 : PCF.non_inventory_fee;

  // Easy discounts
  const isEasySize = SIZE_PRESETS.some(s => s.label === c.sizeLabel);
  const isEasyFold = ["flat","bifold","trifold","z3"].includes(fold.val);
  const costSummary = P.paper + P.frontPrint + P.backPrint + P.cutting + P.folding + P.perforation + P.rc;
  P.discEasyFlat = (fold.val === "flat" && isEasySize) ? -Math.min(costSummary * PCF.easydiscount_factor, PCF.easydiscount_max / 10) : 0;
  P.discEasy = (fold.val !== "flat" && isEasyFold && isEasySize) ? -Math.min(P.press + P.cutting + P.folding, PCF.easydiscount_max / 10) : 0;

  // BW discount
  const allBW = c.frontColor === "bw" && (sides === 1 || c.backColor === "bw");
  P.discBW = allBW ? -(P.press * 0.3) : 0;

  // Cardstock discount
  P.cardstockDisc = PAPERS_CS.some(p => p.val === paper.val) ? -(0.04 * pressSheets) : 0;

  const total = Object.values(P).reduce((s, v) => s + v, 0);

  // Turnaround
  const paperDays = Math.floor(paper.val || 0);
  const vividDays = c.vivid ? Math.floor(pressSheets / 2500) : 0;
  const coatDays = (coat.val > 0 && paper.coatable) ? Math.ceil(pressSheets / (coat.val / (c.coatSides || 1))) : 0;
  const bundleDays = (bund.val > 0 && qty >= 100) ? Math.floor(approxThickness / bund.val) : 0;
  const perfDays = (perf.val > 0) ? Math.ceil(pressSheets / perf.val) : 0;
  const rcDays = (rc.val > 0 && fold.val === "flat") ? Math.floor(Math.min(pressSheets / rc.val, PCF.addon_roundcornermaxdays)) : 0;
  const artDays = art.val >= 4 ? Math.ceil(art.val) : 0;
  const proofDays = c.proof >= 3 ? Math.ceil(paperDays + 3.01) : 0;
  const baseDays = Math.floor(pressSheets / PCF.sheetsturnaround);
  const days = Math.max(PCF.minimum_turnaround_days, baseDays + paperDays + vividDays + coatDays + bundleDays + perfDays + rcDays + artDays + proofDays);

  // Shipping & Rush
  const transitDays = getTransitDays(c.shipState, c.shipZip);
  const productionBizDays = days;
  const bufferedProdDays = productionBizDays * 2;
  const freeDeliveryBizDays = bufferedProdDays + transitDays;
  const earliestBizDays = productionBizDays + 1;
  const shopToday = getShopToday();
  const freeDeliveryDate = addBusinessDays(shopToday, freeDeliveryBizDays);
  const earliestDate = addBusinessDays(shopToday, earliestBizDays);

  let rushMultiplier = 1, rushCost = 0, bizDaysToDate = freeDeliveryBizDays, needByValid = false, tooSoon = false, needByPast = false;
  if (c.needByDate) {
    const nbd = new Date(c.needByDate + "T00:00:00");
    if (nbd <= shopToday) { needByPast = true; }
    else {
      bizDaysToDate = businessDaysBetween(shopToday, nbd);
      needByValid = true;
      if (bizDaysToDate < earliestBizDays) { tooSoon = true; }
      else if (bizDaysToDate < freeDeliveryBizDays) {
        rushMultiplier = freeDeliveryBizDays / bizDaysToDate;
        rushCost = Math.max(0, (total * rushMultiplier) - total);
      }
    }
  }
  const grandTotal = total + rushCost;
  const effectiveDeliveryBiz = (needByValid && !tooSoon) ? bizDaysToDate : freeDeliveryBizDays;
  const effectiveTransit = Math.min(transitDays, Math.max(1, effectiveDeliveryBiz - productionBizDays));
  const prodStartBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit - productionBizDays);
  const productionStartDate = addBusinessDays(shopToday, prodStartBiz);
  const mustShipBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit);
  const mustShipDate = addBusinessDays(shopToday, mustShipBiz);

  // Cost breakdown
  const bd = [
    {l:"Paper",v:P.paper,g:"mat"},{l:"Front Print",v:P.frontPrint,g:"mat"},{l:"Back Print",v:P.backPrint,g:"mat"},
    {l:"Press",v:P.press,g:"lab"},{l:"Cutting",v:P.cutting,g:"lab"},{l:"Folding",v:P.folding,g:"lab"},
    {l:"Vivid Print",v:P.vivid,g:"add"},{l:"UV Coating",v:P.coat,g:"add"},{l:"Bundling",v:P.bundle,g:"add"},
    {l:"Perforation",v:P.perforation,g:"add"},{l:"Round Cornering",v:P.rc,g:"add"},
    {l:"Fold Surcharge 1",v:P.diffFold1,g:"fee"},{l:"Fold Surcharge 2",v:P.diffFold2,g:"fee"},{l:"Fold Surcharge 3",v:P.diffFold3,g:"fee"},
    {l:"Base Cost",v:P.baseCost,g:"fee"},{l:"Non-Inventory",v:P.nonInv,g:"fee"},
    {l:"Artwork",v:P.artwork,g:"art"},{l:"Bleed",v:P.bleed,g:"art"},{l:"Proofing",v:P.proof,g:"art"},
    {l:"BW Discount",v:P.discBW,g:"disc"},{l:"Easy Discount (Flat)",v:P.discEasyFlat,g:"disc"},{l:"Easy Discount",v:P.discEasy,g:"disc"},{l:"Cardstock Disc",v:P.cardstockDisc,g:"disc"},
  ].filter(r => Math.abs(r.v) > 0.005);

  const gC={mat:CK.cyan,lab:CK.key,add:CK.yellow,art:CK.magenta,fee:"#c25050",disc:CK.cyan};
  const gL={mat:"Materials & Ink",lab:"Production Labor",add:"Addons",art:"Artwork & Proofing",fee:"Fees & Surcharges",disc:"Discounts"};
  const grouped=Object.entries(gL).map(([k,label])=>({label,val:bd.filter(r=>r.g===k).reduce((s,r)=>s+r.v,0),c:gC[k]})).filter(g=>Math.abs(g.val)>0.005);

  const perUnit = qty > 0 ? grandTotal / qty : 0;

  return {
    total: Math.round(grandTotal * 100) / 100, baseTotal: Math.round(total * 100) / 100,
    perUnit: Math.round(perUnit * 100) / 100, days, qty: qty, bd, grouped,
    imp, mk, fold, panels, pressSheets, longE, shortE, approxThickness,
    coatOK: paper.coatable, q100: qty >= 100,
    shipping: {
      transitDays, effectiveTransit, freeDeliveryBizDays, freeDeliveryDate: fmtDate(freeDeliveryDate), freeDeliveryYMD: toYMD(freeDeliveryDate),
      earliestBizDays, earliestDate: fmtDate(earliestDate), shopToday: fmtDate(shopToday),
      bizDaysToDate, rushMultiplier, rushCost: Math.round(rushCost * 100) / 100,
      needByValid, needByPast, tooSoon, productionBizDays, bufferedProdDays,
      productionStartDate: fmtDate(productionStartDate), productionStartYMD: toYMD(productionStartDate),
      mustShipDate: fmtDate(mustShipDate), mustShipYMD: toYMD(mustShipDate),
    },
    debug: { pressSheets, imp, qty, mk, dL, approxThickness, fold: fold.label, panels, longE, shortE, paperDays, baseDays, days, P },
  };
}

// ═══════════════════════════════════════════════════════════════
// 3D FOLD SIMULATION
// ═══════════════════════════════════════════════════════════════
function FoldPreview({ longEdge, shortEdge, foldType, panels, foldDir }) {
  const [foldAngle, setFoldAngle] = useState(0);
  const foldingLong = foldDir === "long";
  const foldDim = foldingLong ? longEdge : shortEdge;
  const staticDim = foldingLong ? shortEdge : longEdge;
  const panelW = foldDim / panels;

  const maxPx = 500;
  const scale = Math.min(maxPx / foldDim, maxPx / staticDim) * 0.8;
  const pw = panelW * scale;
  const ph = staticDim * scale;
  const totalW = pw * panels;

  const colors = ["#e3f2fd","#bbdefb","#90caf9","#64b5f6","#42a5f5"];

  // Build nested panel chain — each panel is child of previous for proper 3D folding
  function buildPanels(idx) {
    if (idx >= panels) return null;
    const angle = idx === 0 ? 0 : (() => {
      const a = foldAngle;
      if (foldType === "z3" || foldType === "accordion4") return idx % 2 === 1 ? a : -a;
      if (foldType === "gate3") return idx === 2 ? -a : a;
      if (foldType === "dgate4") return (idx === 1 || idx === 3) ? (idx <= 1 ? a : -a) : a;
      if (foldType === "dparallel4") return idx % 2 === 1 ? a : -a;
      return a; // bifold, trifold, roll4: all fold same direction
    })();

    return (
      <div style={{
        width: pw, height: ph, position: idx === 0 ? "relative" : "absolute",
        left: idx === 0 ? 0 : pw, top: 0,
        transformOrigin: "left center",
        transform: idx === 0 ? "none" : `rotateY(${angle}deg)`,
        transformStyle: "preserve-3d",
        transition: "transform 0.3s ease",
      }}>
        {/* Front face */}
        <div style={{
          position: "absolute", inset: 0,
          background: colors[idx % colors.length],
          border: "1px solid rgba(0,0,0,0.15)",
          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
          fontSize: 11, color: "rgba(0,0,0,0.5)", fontWeight: 600,
          backfaceVisibility: "hidden", borderRadius: 2,
        }}>
          <div>Panel {idx + 1}</div>
          <div style={{ fontSize: 9, fontWeight: 400, marginTop: 2 }}>{panelW.toFixed(1)}" × {staticDim.toFixed(1)}"</div>
        </div>
        {/* Back face */}
        <div style={{
          position: "absolute", inset: 0,
          background: `${colors[idx % colors.length]}88`,
          border: "1px dashed rgba(0,0,0,0.2)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 10, color: "rgba(0,0,0,0.3)",
          backfaceVisibility: "hidden", borderRadius: 2,
          transform: "rotateY(180deg)",
        }}>Back {idx + 1}</div>
        {buildPanels(idx + 1)}
      </div>
    );
  }

  if (panels <= 1) {
    return (
      <div style={{ textAlign: "center", padding: 20 }}>
        <div style={{ display: "inline-block", width: totalW, height: ph, background: colors[0], border: "1px solid rgba(0,0,0,0.15)", borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, color: "rgba(0,0,0,0.4)" }}>
          Flat Sheet — {longEdge}" × {shortEdge}"
        </div>
      </div>
    );
  }

  return (
    <div style={{ padding: 20 }}>
      <div className="fold-viewport" style={{ height: ph + 40, margin: "0 auto", maxWidth: 600 }}>
        <div style={{ transformStyle: "preserve-3d", transform: `rotateX(-5deg) rotateY(${-foldAngle * 0.1}deg)` }}>
          {buildPanels(0)}
        </div>
      </div>
      <div style={{ textAlign: "center", marginTop: 12 }}>
        <input type="range" min={0} max={170} value={foldAngle} onChange={e => setFoldAngle(Number(e.target.value))} style={{ width: 220, accentColor: CK.cyan }} />
        <div style={{ fontSize: 11, color: CC.mid, marginTop: 4 }}>{foldAngle === 0 ? "Flat (open)" : foldAngle >= 170 ? "Fully Folded" : `Fold: ${foldAngle}°`}</div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// FOLD LINE OVERLAY (for proof/template view)
// ═══════════════════════════════════════════════════════════════
function FoldLines({ panels, foldDir }) {
  if (panels <= 1) return null;
  const foldingLong = foldDir === "long";
  return Array.from({ length: panels - 1 }, (_, i) => {
    const pct = ((i + 1) / panels) * 100;
    return (
      <div key={i} style={{
        position: "absolute",
        left: foldingLong ? `${pct}%` : 0,
        top: foldingLong ? 0 : `${pct}%`,
        width: foldingLong ? 0 : "100%",
        height: foldingLong ? "100%" : 0,
        borderLeft: foldingLong ? "2px dashed #f59e0b" : "none",
        borderTop: !foldingLong ? "2px dashed #f59e0b" : "none",
        zIndex: 2, pointerEvents: "none",
      }}>
        <span style={{
          position: "absolute",
          top: foldingLong ? 8 : -14,
          left: foldingLong ? -30 : 8,
          fontSize: 8, color: "#f59e0b", fontWeight: 700,
          transform: foldingLong ? "rotate(-90deg)" : "none",
          whiteSpace: "nowrap",
        }}>Fold {i + 1}</span>
      </div>
    );
  });
}

      </div>
      <div style={{ display: "flex", borderBottom: `1px solid ${CC.border}` }}>
        {[["Per Unit", "$" + r.perUnit.toFixed(2)], ["Qty", r.qty.toLocaleString()], ["Days", r.days + " biz"]].map(([l, v], i) => (
          <div key={i} style={{ flex: 1, padding: "11px 8px", textAlign: "center", borderRight: i < 2 ? `1px solid ${CC.border}` : "none" }}>
            <div style={{ fontSize: 9.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: CC.light, marginBottom: 1 }}>{l}</div>
            <div style={{ fontSize: 14.5, fontWeight: 700, color: CC.dark }}>{v}</div>
          </div>
        ))}
      </div>
      {sh.freeDeliveryDate && <div style={{ padding: "8px 18px", background: "#fafafa", fontSize: 11, color: CC.mid }}>
        Free delivery est: <strong>{sh.freeDeliveryDate}</strong> ({sh.freeDeliveryBizDays} biz days)
      </div>}
      {r.grouped.length > 0 && <div style={{ padding: "10px 18px" }}>
        {r.grouped.map((g, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", fontSize: 12 }}>
            <span style={{ color: g.c, fontWeight: 500 }}>{g.label}</span>
            <span style={{ fontWeight: 600, color: g.val < 0 ? "#16a34a" : CC.dark }}>{g.val < 0 ? "-" : ""}${Math.abs(g.val).toFixed(2)}</span>
          </div>
        ))}
      </div>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const mob = useIsMobile();
  const [op, setOp] = useState({ s1: true, s2: true, s3: false, s4: false, s5: false });
  const tog = k => setOp(p => ({ ...p, [k]: !p[k] }));
  const [showDebug, setShowDebug] = useState(false);

  // State
  const [qty, setQty] = useState(250);
  const [sizeMode, setSizeMode] = useState("preset");
  const [sizeLabel, setSizeLabel] = useState("8.5×11");
  const [longEdge, setLongEdge] = useState(11);
  const [shortEdge, setShortEdge] = useState(8.5);
  const [foldType, setFoldType] = useState("flat");
  const [foldDir, setFoldDir] = useState("long");
  const [frontColor, setFrontColor] = useState("color");
  const [backColor, setBackColor] = useState("color");
  const [sides, setSides] = useState(2);
  const [paperType, setPaperType] = useState("noncardstock");
  const [paper, setPaper] = useState(PAPERS_NC[2] || PAPERS_NC[0]);
  const [vivid, setVivid] = useState(false);
  const [coating, setCoating] = useState(0);
  const [coatSides, setCoatSides] = useState(1);
  const [bundling, setBundling] = useState(0);
  const [perforation, setPerforation] = useState(0);
  const [roundCorner, setRoundCorner] = useState(0);
  const [artwork, setArtwork] = useState(0.01);
  const [bleed, setBleed] = useState(0);
  const [proof, setProof] = useState(0);
  const [shipState, setShipState] = useState("AZ");
  const [shipAddr, setShipAddr] = useState({ name: "", company: "", street1: "", street2: "", city: "", zip: "" });
  const [needByDate, setNeedByDate] = useState("");

  const shipZip = shipAddr.zip || "";
  const fold = FOLD_TYPES.find(f => f.val === foldType) || FOLD_TYPES[0];

  const result = useMemo(() => calculate({
    qty, sizeMode, sizeLabel, longEdge, shortEdge,
    foldType, foldDir, frontColor, backColor, sides,
    paper, vivid, coating, coatSides, bundling, perforation, roundCorner,
    artwork, bleed, proof, shipState, shipZip, needByDate,
  }), [qty, sizeMode, sizeLabel, longEdge, shortEdge, foldType, foldDir, frontColor, backColor, sides, paper, vivid, coating, coatSides, bundling, perforation, roundCorner, artwork, bleed, proof, shipState, shipZip, needByDate]);

  const r = result || {};
  const r2 = { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 };
  const r3 = { display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 };
  const pList = paperType === "cardstock" ? PAPERS_CS : PAPERS_NC;
  const preset = SIZE_PRESETS.find(s => s.label === sizeLabel);
  const dimLong = sizeMode === "preset" ? (preset?.long || 11) : longEdge;
  const dimShort = sizeMode === "preset" ? (preset?.short || 8.5) : shortEdge;

  return (
    <div style={{ minHeight: "100vh", background: CC.bg, fontFamily: "'Segoe UI','Helvetica Neue',Arial,sans-serif", color: CC.dark }}>
      <style>{`@media(max-width:700px){.pps-sec-hdr{padding:12px 14px!important;font-size:13px!important}.pps-sec-body{padding:12px 14px!important}}`}</style>

      <div style={{ maxWidth: 1180, margin: "0 auto", padding: mob ? "10px" : "20px 24px", display: "flex", gap: 20, alignItems: mob ? "stretch" : "flex-start", flexDirection: mob ? "column" : "row" }}>
        <div style={{ flex: 1, minWidth: 0 }}>

          {/* SECTION 1: Size, Qty, Fold */}
          <Sec title="Size, Quantity & Fold" open={op.s1} onToggle={() => tog("s1")}>
            <TxtNum label="Quantity" value={qty} onChange={v => setQty(Math.max(1, Math.round(v)))} min={1} />
            <div style={ST.hr} />
            <Pil label="Size" value={sizeMode} onChange={setSizeMode} options={[{ t: "Preset Sizes", v: "preset" }, { t: "Custom Size", v: "custom" }]} />
            {sizeMode === "preset"
              ? <Sel label="Flat/Unfolded Size" value={sizeLabel} onChange={setSizeLabel}>{SIZE_PRESETS.map(s => <option key={s.label} value={s.label}>{s.label}</option>)}</Sel>
              : <div style={r2}>
                  <TxtNum label="Long Edge (in)" value={longEdge} onChange={setLongEdge} min={2} max={27} />
                  <TxtNum label="Short Edge (in)" value={shortEdge} onChange={setShortEdge} min={2} max={12.5} />
                </div>
            }
            <div style={ST.hr} />
            <Sel label="Fold Type" value={foldType} onChange={setFoldType}>
              {FOLD_TYPES.map(f => <option key={f.val} value={f.val}>{f.label}</option>)}
            </Sel>
            {fold.panels > 1 && sizeMode === "custom" && (
              <Pil label="Fold Direction" value={foldDir} onChange={setFoldDir} options={[
                { t: `Fold Long Side (${dimLong}")`, v: "long" },
                { t: `Fold Short Side (${dimShort}")`, v: "short" },
              ]} />
            )}
            {fold.panels > 1 && (
              <div style={{ marginTop: 8, padding: "8px 12px", background: CK.cyanLight, borderRadius: 5, fontSize: 11, color: CC.mid }}>
                Folded size: <strong>{(dimShort).toFixed(1)}" × {((foldDir === "long" ? dimLong : dimShort) / fold.panels).toFixed(1)}"</strong> ({fold.panels} panels)
              </div>
            )}
          </Sec>

          {/* SECTION 2: Printing & Paper */}
          <Sec title="Printing & Paper" open={op.s2} onToggle={() => tog("s2")}>
            <Pil label="Sides Printed" value={sides} onChange={v => setSides(Number(v))} options={[{ t: "Both Sides", v: 2 }, { t: "Front Only", v: 1 }]} />
            <div style={{ ...r2, marginTop: 10 }}>
              <Pil label="Front Color" value={frontColor} onChange={setFrontColor} options={[
                { t: "Full Color", v: "color", onStyle: { background: "conic-gradient(from 45deg, #00aeef 0deg, #ec008c 90deg, #fff200 180deg, #231f20 270deg, #00aeef 360deg)", color: "#fff", fontWeight: 600, textShadow: "0 1px 4px rgba(0,0,0,.5)" } },
                { t: "Greyscale", v: "bw", onStyle: { background: "linear-gradient(135deg, #888 0%, #444 50%, #999 100%)", color: "#fff", fontWeight: 600 } }
              ]} />
              {sides === 2 && <Pil label="Back Color" value={backColor} onChange={setBackColor} options={[
                { t: "Full Color", v: "color", onStyle: { background: "conic-gradient(from 45deg, #00aeef 0deg, #ec008c 90deg, #fff200 180deg, #231f20 270deg, #00aeef 360deg)", color: "#fff", fontWeight: 600, textShadow: "0 1px 4px rgba(0,0,0,.5)" } },
                { t: "Greyscale", v: "bw", onStyle: { background: "linear-gradient(135deg, #888 0%, #444 50%, #999 100%)", color: "#fff", fontWeight: 600 } }
              ]} />}
            </div>
            <div style={ST.hr} />
            <Pil label="Paper Type" value={paperType} onChange={v => { setPaperType(v); const pool = v === "cardstock" ? PAPERS_CS : PAPERS_NC; setPaper(pool[2] || pool[0]); }} options={[{ t: "Text Weight", v: "noncardstock" }, { t: "Cardstock", v: "cardstock" }]} />
            <Sel label="Select Paper" value={paper.val} onChange={v => { const f = ALL_PAPERS.find(p => String(p.val) === v); if (f) { setPaper(f); setPaperType(f.type); } }}>
              {PAPERS_NC.map(p => <option key={p.val} value={p.val}>{p.label}</option>)}
              <optgroup label="Cardstock">{PAPERS_CS.map(p => <option key={p.val} value={p.val}>{p.label}</option>)}</optgroup>
            </Sel>
          </Sec>

          {/* SECTION 3: Addons */}
          <Sec title="Finishing & Addons" open={op.s3} onToggle={() => tog("s3")}>
            <Pil label="Print Quality" value={vivid} onChange={v => setVivid(v === true || v === "true")} options={[{ t: "Standard", v: false }, { t: "Enhanced Vivid", v: true }]} />
            <div style={ST.hr} />
            <Sel label="Additional Coating" value={coating} onChange={v => setCoating(Number(v))}>
              {COATINGS.map(o => <option key={o.val} value={o.val}>{o.label}{!paper.coatable && o.val > 0 ? " (not available for this paper)" : ""}</option>)}
            </Sel>
            {coating > 0 && paper.coatable && (
              <Pil label="Sides to Coat" value={coatSides} onChange={v => setCoatSides(Number(v))} options={COAT_SIDES.map(o => ({ t: o.label, v: o.val }))} />
            )}
            <div style={ST.hr} />
            <Sel label="Bundling" value={bundling} onChange={v => setBundling(Number(v))}>
              {BUNDLING.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
            </Sel>
            <Sel label="Perforation" value={perforation} onChange={v => setPerforation(Number(v))}>
              {PERF_OPTS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
            </Sel>
            {foldType === "flat" && (
              <Sel label="Round Cornering" value={roundCorner} onChange={v => setRoundCorner(Number(v))}>
                {CORNERS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
              </Sel>
            )}
          </Sec>

          {/* SECTION 4: Artwork */}
          <Sec title="Artwork & Proofing" open={op.s4} onToggle={() => tog("s4")}>
            <Sel label="Artwork & Design" value={artwork} onChange={v => setArtwork(Number(v))}>
              {ART_OPTS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
            </Sel>
            <Sel label="Bleed Options" value={bleed} onChange={v => setBleed(Number(v))}>
              {BLEED_OPTS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
            </Sel>
            <Sel label="Proof Options" value={proof} onChange={v => setProof(Number(v))}>
              <option value={0}>Approve artwork yourself</option>
              <option value={0.01}>Professional Digital Proof</option>
              <option value={3.01}>Hardcopy Proof</option>
            </Sel>
          </Sec>

          {/* SECTION 5: Shipping */}
          <Sec title="Shipping & Delivery" open={op.s5} onToggle={() => tog("s5")}>
            <div style={r2}>
              <Sel label="State" value={shipState} onChange={setShipState}>
                {US_STATES.map(st => <option key={st} value={st}>{st}</option>)}
              </Sel>
              <div style={ST.f}><label style={ST.lbl}>ZIP Code</label><input type="text" value={shipAddr.zip} onChange={e => setShipAddr(p => ({ ...p, zip: e.target.value.replace(/[^\d-]/g, "").slice(0, 10) }))} placeholder="ZIP" maxLength={10} style={ST.inp} /></div>
            </div>
            <div style={ST.f}><label style={ST.lbl}>Need by Date</label><input type="date" value={needByDate} onChange={e => setNeedByDate(e.target.value)} style={ST.inp} /></div>
            {r.shipping && <div style={{ marginTop: 10, padding: "8px 12px", background: CK.cyanLight, borderRadius: 5, fontSize: 11, color: CC.mid }}>
              Free delivery est: <strong>{r.shipping.freeDeliveryDate}</strong> ({r.shipping.freeDeliveryBizDays} biz days)
              {r.shipping.rushCost > 0 && <div style={{ color: CK.rush, fontWeight: 600, marginTop: 4 }}>Rush: +${r.shipping.rushCost.toFixed(2)} ({r.shipping.rushMultiplier.toFixed(2)}×)</div>}
              {r.shipping.needByPast && <div style={{ color: "#dc2626", marginTop: 4 }}>Date has passed — select a future date</div>}
              {r.shipping.tooSoon && <div style={{ color: "#dc2626", marginTop: 4 }}>Cannot deliver by this date</div>}
            </div>}
          </Sec>

          {/* 3D Fold Preview */}
          {fold.panels > 1 && (
            <div style={{ ...ST.pnl, marginBottom: 10 }}>
              <div style={{ ...ST.secHdr, cursor: "default" }}>3D Fold Preview — {fold.label}</div>
              <FoldPreview longEdge={dimLong} shortEdge={dimShort} foldType={foldType} panels={fold.panels} foldDir={foldDir} />
            </div>
          )}

          {/* Flat Sheet Preview with Fold Lines */}
          <div style={{ ...ST.pnl, marginBottom: 10 }}>
            <div style={{ ...ST.secHdr, cursor: "default" }}>Template Preview — {dimLong}" × {dimShort}" {fold.panels > 1 ? `(${fold.panels} panels)` : "flat"}</div>
            <div style={{ padding: 20 }}>
              <div style={{ position: "relative", margin: "0 auto", maxWidth: 500, aspectRatio: `${dimLong}/${dimShort}`, background: "#f0f4f8", border: "2px solid #cbd5e1", borderRadius: 4 }}>
                {/* Bleed guide */}
                <div style={{ position: "absolute", inset: 0, border: "1.5px dashed #ef4444", borderRadius: 2, pointerEvents: "none" }} />
                {/* Trim guide */}
                <div style={{ position: "absolute", top: "1.5%", left: "1.5%", right: "1.5%", bottom: "1.5%", border: "1.5px dashed #1e293b", borderRadius: 2, pointerEvents: "none" }} />
                {/* Safety guide */}
                <div style={{ position: "absolute", top: "3%", left: "3%", right: "3%", bottom: "3%", border: "1.5px dashed #38a169", borderRadius: 2, pointerEvents: "none" }} />
                {/* Fold lines */}
                <FoldLines panels={fold.panels} foldDir={foldDir} />
                {/* Center label */}
                <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", color: CC.light, fontSize: 12 }}>
                  <div style={{ fontWeight: 600 }}>{dimLong}" × {dimShort}"</div>
                  {fold.panels > 1 && <div style={{ fontSize: 10, marginTop: 2 }}>{fold.panels} panels — folded: {(dimShort).toFixed(1)}" × {((foldDir === "long" ? dimLong : dimShort) / fold.panels).toFixed(1)}"</div>}
                </div>
                {/* Legend */}
                <div style={{ position: "absolute", bottom: 4, left: 8, fontSize: 8, display: "flex", gap: 8 }}>
                  <span style={{ color: "#ef4444" }}>— Bleed</span>
                  <span style={{ color: "#1e293b" }}>- - Trim</span>
                  <span style={{ color: "#38a169" }}>- - Safety</span>
                  {fold.panels > 1 && <span style={{ color: "#f59e0b" }}>- - Fold</span>}
                </div>
              </div>
            </div>
          </div>

        </div>

        {/* Desktop sidebar */}
        {!mob && <div style={{ width: 320, flexShrink: 0, position: "sticky", top: 18 }}>
          <Panel result={result} />
          <button type="button" onClick={() => setShowDebug(p => !p)} style={{ width: "100%", marginTop: 8, padding: "6px", borderRadius: 4, border: `1px solid ${showDebug ? "#555" : "#ddd"}`, background: showDebug ? "#1a1a1a" : "#fafafa", color: showDebug ? "#888" : "#bbb", fontSize: 10, fontWeight: 600, letterSpacing: ".5px", textTransform: "uppercase", cursor: "pointer", fontFamily: "inherit" }}>
            {showDebug ? "▼ Hide" : "▶ Show"} Debug Panel
          </button>
          {showDebug && r.debug && (
            <div style={{ ...ST.pnl, marginTop: 10, padding: 14, fontSize: 11 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: CC.mid }}>Debug</div>
              {Object.entries(r.debug).map(([k, v]) => (
                k !== "P" ? <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "2px 0" }}>
                  <span style={{ color: CC.light }}>{k}</span>
                  <span style={{ fontFamily: "monospace", color: CK.cyan }}>{typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(4)) : String(v)}</span>
                </div> : null
              ))}
              {r.debug.P && <details style={{ marginTop: 8 }}><summary style={{ cursor: "pointer", fontWeight: 600, color: CC.mid }}>Line Items</summary>
                {Object.entries(r.debug.P).filter(([, v]) => Math.abs(v) > 0.005).map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "2px 0" }}>
                    <span style={{ color: CC.light }}>{k}</span>
                    <span style={{ fontFamily: "monospace", color: v < 0 ? "#16a34a" : CK.cyan }}>${v.toFixed(2)}</span>
                  </div>
                ))}
              </details>}
            </div>
          )}
        </div>}
      </div>

      {/* Mobile bottom bar */}
      {mob && <>
        {showDebug && r.debug && <div style={{ position: "fixed", bottom: 76, left: 0, right: 0, zIndex: 39, maxHeight: "60vh", overflowY: "auto", background: CC.white, borderTop: `1px solid ${CC.border}`, boxShadow: "0 -4px 16px rgba(0,0,0,.12)", padding: "10px" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: CC.mid, marginBottom: 6 }}>DEBUG</div>
          {Object.entries(r.debug).filter(([k]) => k !== "P").map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 10, padding: "1px 0" }}>
              <span style={{ color: CC.light }}>{k}</span>
              <span style={{ fontFamily: "monospace", color: CK.cyan }}>{typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(3)) : String(v)}</span>
            </div>
          ))}
        </div>}
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 40, background: CC.white, borderTop: `1px solid ${CC.border}`, boxShadow: "0 -4px 16px rgba(0,0,0,.08)", padding: "8px 10px", paddingBottom: "max(8px, env(safe-area-inset-bottom))" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => setShowDebug(p => !p)}>
              <Panel result={result} compact />
              <div style={{ fontSize: 8, textAlign: "center", color: showDebug ? CK.cyan : CC.light, marginTop: 2, letterSpacing: ".5px", textTransform: "uppercase", fontWeight: 600 }}>{showDebug ? "▼ Hide Debug" : "▲ Debug"}</div>
            </div>
            <button type="button" style={{ flexShrink: 0, padding: "12px 18px", borderRadius: 6, border: "none", background: result?.error ? CC.light : CK.cyan, color: "#fff", fontSize: 14, fontWeight: 700, cursor: result?.error ? "default" : "pointer", fontFamily: "inherit", opacity: result?.error ? .5 : 1 }} disabled={!!result?.error}>Add to Order</button>
          </div>
        </div>
      </>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// STYLES
// ═══════════════════════════════════════════════════════════════
const ST = {
  f: { marginTop: 10 },
  lbl: { display: "block", fontSize: 13, fontWeight: 600, color: CC.mid, marginBottom: 5 },
  sel: { width: "100%", padding: "10px 32px 10px 12px", borderRadius: 6, border: `1px solid ${CC.border}`, background: "linear-gradient(180deg, #fff 0%, #f9f9fa 100%)", fontSize: 15, color: CC.dark, fontFamily: "inherit", appearance: "none", cursor: "pointer", outline: "none" },
  selA: { position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", color: CC.light, pointerEvents: "none" },
  inp: { width: "100%", padding: "10px 12px", borderRadius: 6, border: `1px solid ${CC.border}`, background: "linear-gradient(180deg, #fff 0%, #f9f9fa 100%)", fontSize: 15, color: CC.dark, fontFamily: "inherit", outline: "none", boxSizing: "border-box" },
  pills: { display: "flex", borderRadius: 6, border: `1px solid ${CC.border}`, overflow: "hidden" },
  pill: { flex: 1, padding: "9px 10px", fontSize: 14, fontWeight: 500, fontFamily: "inherit", border: "none", borderRight: `1px solid ${CC.border}`, background: `linear-gradient(180deg, #fff 0%, #f7f7f8 100%)`, color: "#555", cursor: "pointer", transition: "all .15s", display: "flex", alignItems: "center", justifyContent: "center" },
  pillOn: { background: `linear-gradient(135deg, ${CK.cyan} 0%, #0070e6 40%, #3d9cff 50%, #0070e6 60%, #005cc8 100%)`, color: "#fff", fontWeight: 600 },
  pnl: { background: CC.white, borderRadius: 8, border: `1px solid ${CC.border}`, overflow: "hidden" },
  secHdr: { padding: "12px 18px", fontWeight: 600, fontSize: 14, color: CC.dark, borderBottom: `1px solid ${CC.border}`, background: "#fafafa" },
  secBody: { padding: "14px 18px" },
  hr: { height: 1, background: CC.border, margin: "12px 0" },
  err: { color: "#dc2626", fontSize: 12, marginTop: 4 },
};

ReactDOM.createRoot(document.getElementById("pps-calculator-root")).render(<App />);
</script>
</body>
</html>
