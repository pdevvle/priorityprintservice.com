    // could not explain why the plate differs from the file it names.
    const fmtPos = (t) => {
      const x = t.posX ?? 50, y = t.posY ?? 50;
      return ( x === 50 && y === 50 ) ? "centered" : `${Math.round(x)}% across, ${Math.round(y)}% down (0 = left/top)`;
    };
    const samePos = pageSources.every(p => (p.tx.posX ?? 50) === (pageSources[0].tx.posX ?? 50)
                                        && (p.tx.posY ?? 50) === (pageSources[0].tx.posY ?? 50));
    const txSummaryPos = samePos ? fmtPos(pageSources[0].tx) : "mixed (see Per-Side Detail)";

    const manifestLines = [
      "ARTWORK MANIPULATION MANIFEST",
      "=" .repeat(50),
      `Generated: ${new Date().toISOString()}`,
      "",
      "── Source File ──",
      `Filename: ${fileName || "unknown"}`,
      `Sides uploaded: ${pageSources.map(p => p.label).join(" + ")}`,
      "",
      "── Brochure Specifications ──",
      `Trim size: ${longEdge}″ × ${shortEdge}″`,
      `Bleed-inclusive size: ${bleedW}″ × ${bleedH}″`,
      `Bleed margin: ${BLEED}″ per side`,
      `Fold: ${foldType}, ${panels} panels (${foldDir} edge)`,
      `Fold lines: ${foldLines.length}`,
      "",
      "── Customer Transforms (summary) ──",
      `Fit mode: ${txSummaryFit}`,
      `Rotation: ${txSummaryRot}`,
      `Scale: ${txSummaryScale}`,
      `Framing: ${txSummaryPos}`,
      "",
      "── Deliverables ──",
      `1. Raw file: ${fileName || "original upload"} (unmodified customer upload)`,
      `2. Print-ready PDF: ${totalPages} side(s) at ${DPI} DPI, ${bleedW}″ × ${bleedH}″, JPEG quality 0.95`,
      `3. Screen previews: ${previewBlobs.filter(b => b).length} side images at 150 DPI, JPEG quality 0.85 (fold lines rendered on previews only)`,
      `4. This manifest`,
      "",
      "── Per-Side Detail ──",
    ];
    pageSources.forEach((p, i) => {
      const dimsStr = p.ed ? `${p.ed.wIn}″ × ${p.ed.hIn}″ post-rotation` : "N/A";
      manifestLines.push(`  ${i + 1}: ${p.label}`);
      manifestLines.push(`    fit=${p.tx.fitMode} rotate=${p.tx.rotateSteps * 90}° scale=${p.tx.artScale}%  [${dimsStr}]`);
    });
    manifestLines.push("", "── Notes ──");
    if (noTransforms) manifestLines.push("No customer transforms were applied on either side.");

    const manifestBlob = new Blob([manifestLines.join("\n")], { type: "text/plain" });

    const previewHtmlBlob = buildPreviewHtml();
    return { printReadyBlob, previewBlobs, manifestBlob, previewHtmlBlob, skippedGeneration: false };
  }

  // Perf line positions — perfDir "length" crosses longEdge (vertical when foldDir=long)
  const perfVertical = perfDir === "length" ? (foldDir === "long") : (foldDir !== "long");
  const perfLines = (perfCount > 0 && perfPositions)
    ? perfPositions.slice(0, perfCount).map((pct, i) => ({ pct, vertical: perfVertical, index: i }))
    : [];

  // Perf constraint: 1" from edge, 1" between perfs, snap to 1/8"
  function clampPerfInches(inches, idx, trimDim, positions) {
    var minIn = 1, maxIn = trimDim - 1;
    // 1" away from the other perf line
    for (var j = 0; j < positions.length; j++) {
      if (j === idx) continue;
      var otherIn = positions[j] / 100 * trimDim;
      if (inches < otherIn) maxIn = Math.min(maxIn, otherIn - 1);
      else minIn = Math.max(minIn, otherIn + 1);
    }
    var snapped = Math.round(Math.max(minIn, Math.min(maxIn, inches)) * 8) / 8;
    return Math.max(minIn, Math.min(maxIn, snapped));
  }

  // Drag handler for perf lines
  function handlePerfDrag(e) {
    if (draggingPerf === null || !proofContainerRef.current) return;
    var pl = perfLines[draggingPerf];
    if (!pl) return;
    var rect = proofContainerRef.current.getBoundingClientRect();
    var trimDim = pl.vertical ? longEdge : shortEdge;
    var bPct = pl.vertical ? bleedPctX : bleedPctY;
    var trimSpan = 100 - bPct * 2;
    var mouseRel = pl.vertical
      ? ((e.clientX - rect.left) / rect.width * 100)
      : ((e.clientY - rect.top) / rect.height * 100);
    var rawInches = (mouseRel - bPct) / trimSpan * trimDim;
    var clamped = clampPerfInches(rawInches, draggingPerf, trimDim, perfPositions);
    var updated = perfPositions.slice();
    updated[draggingPerf] = Math.round(clamped / trimDim * 1000) / 10;
    onPerfPositions(updated);
  }

  // Commit typed perf value
  function commitPerfEdit(idx) {
    var v = parseFloat(editPerfVal);
    if (isNaN(v)) { setEditingPerf(null); return; }
    var trimDim = perfVertical ? longEdge : shortEdge;
    var clamped = clampPerfInches(v, idx, trimDim, perfPositions);
    var updated = perfPositions.slice();
    updated[idx] = Math.round(clamped / trimDim * 1000) / 10;
    onPerfPositions(updated);
    setEditingPerf(null);
  }

  // Scale order size to match uploaded art dimensions
  function handleMatchSize() {
    if (!effectiveDims || !onSizeOverride) return;
    var artW = effectiveDims.w, artH = effectiveDims.h;
    if (!artW || !artH) return;
    if (!confirm("This will change your brochure size to match the uploaded artwork dimensions. Continue?")) return;
    var input = prompt(
      "Artwork is " + artW.toFixed(2) + "\u2033 \u00d7 " + artH.toFixed(2) + "\u2033.\n\n" +
      "How much of this size is bleed (per side)?\n\n" +
      "Enter 0 if artwork has no bleeds.\n" +
      "Standard print bleed is 0.125\u2033.",
      "0.125"
    );
    if (input === null) return;
    var bleedVal = parseFloat(input);
    if (isNaN(bleedVal) || bleedVal < 0 || bleedVal >= Math.min(artW, artH) / 2) {
      alert("Invalid bleed value.");
      return;
    }
    var trimW = artW - bleedVal * 2;
    var trimH = artH - bleedVal * 2;
    onSizeOverride(trimW, trimH);
  }

  // Panel labels for current fold type + side, respecting flip
  const panelCfg = PANEL_LABELS[foldType];
  const panelLabels = useMemo(() => {
    if (!panelCfg || panels <= 1) return [];
    const labels = [...(side === "front" ? panelCfg.front : panelCfg.back)];
    if (foldFlipped) labels.reverse();
    return labels;
  }, [foldType, panels, side, foldFlipped]);

  return (
    <div>
      {/* Upload area */}
      {!hasArt ? (
        <div
          onDragOver={e => { e.preventDefault(); setDropHover(true); }}
          onDragLeave={() => setDropHover(false)}
          onDrop={e => { e.preventDefault(); setDropHover(false); processFile(e.dataTransfer.files); }}
          onClick={() => fileRef.current?.click()}
          style={{
            padding: mob ? "24px 16px" : "32px 20px", borderRadius: 8,
            border: `2px dashed ${dropHover ? CK.cyan : CC.border}`,
            background: dropHover ? CC.tint : CC.track,
            cursor: "pointer", textAlign: "center", transition: "all .15s",
          }}>
          <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.tiff,.tif" onChange={e => processFile(e.target.files)} style={{ display: "none" }} />
          <div style={{ fontSize: 28, marginBottom: 6 }}>📄</div>
          <div style={{ fontSize: 13, fontWeight: 600, color: CC.dark }}>
            {loading ? "Processing..." : "Drop your artwork here or click to upload"}
          </div>
          <div style={{ fontSize: 11, color: CC.light, marginTop: 4 }}>
            PDF, JPG, PNG or TIFF · up to 200 MB — PDF: page 1 = front, page 2 = back (swappable after upload)
          </div>
        </div>
      ) : (
        <div>
          {/* File info + actions */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0" }}>
            <div style={{ fontSize: 12, color: CC.mid }}>
              <strong>{fileName}</strong>
              {frontArt?.dims && <span style={{ color: CC.light, marginLeft: 6 }}>{frontArt.dims.w.toFixed(1)}" × {frontArt.dims.h.toFixed(1)}"</span>}
            </div>
            <div style={{ display: "flex", gap: 6 }}>
            {frontArt && backArt && (
              <button type="button" onClick={handleSwapSides} title="Swap which page is the outside" style={{
                padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                border: `1px solid ${CC.border}`, background: "#fff", color: CC.mid,
              }}>⇄ Swap front/back</button>
            )}
            <button type="button" onClick={handleClear} style={{
              padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
              border: `1px solid ${CC.border}`, background: "#fff", color: CC.light,
            }}>Remove uploads</button>
          </div>
          </div>

          {/* Proof button + info — gentle red box when proof not yet approved */}
          <div style={{
            display: "flex", alignItems: "center", gap: 10, marginBottom: 10,
            padding: approved ? 0 : "10px 12px",
            background: approved ? "transparent" : "#fef2f2",
            border: approved ? "none" : "1px solid #fecaca",
            borderRadius: 6,
          }}>
            <button type="button" onClick={() => setProofOpen(true)} style={{
              padding: "10px 18px", fontSize: 13, fontWeight: 700, borderRadius: 6, cursor: "pointer", fontFamily: "inherit",
              display: "flex", alignItems: "center", gap: 6, flexShrink: 0,
              background: approved ? "linear-gradient(135deg, #22c55e 0%, #16a34a 100%)" : "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)",
              color: approved ? "#fff" : "#555", boxShadow: "0 1px 3px rgba(0,0,0,.08)",
              border: `1px solid ${approved ? "#16a34a" : CC.border}`,
            }}>
              {approved ? "✓ Proof Approved" : "🔍 Proof"} {!approved && <span style={{ fontSize: 9, fontWeight: 700, background: "#fee2e2", color: "#dc2626", padding: "1px 6px", borderRadius: 4 }}>required</span>}
              {debug && <span title="Proof debug mode is on (?debug=1)." style={{ marginLeft: 8, fontSize: 9, fontWeight: 700, background: "rgba(251,191,36,.18)", color: "#fbbf24", padding: "2px 8px", borderRadius: 4, letterSpacing: ".06em", textTransform: "uppercase", border: "1px solid rgba(251,191,36,.4)" }}>🔧 Debug</span>}
            </button>
            <div style={{ fontSize: 11, color: approved ? CC.light : "#b91c1c", lineHeight: 1.4 }}>Open proof to review bleed, trim, safety{panels > 1 ? ", fold lines" : ""} and approve artwork</div>
          </div>

          {/* Fold selection + 3D Preview */}
          <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
            <div style={{ flex: 1 }}>
              <Sel label={<Tip k="fold_type">Fold Type</Tip>} value={foldType} onChange={onFoldChange}>
                {availableFoldTypes(longEdge, shortEdge, paperIsCardstock).map(f => <option key={f.val} value={f.val}>{f.label}</option>)}
              </Sel>
            </div>
            {panels > 1 && (
              <button type="button" onClick={() => { setPreviewOpen(true); setPreviewAngle(0); }} style={{
                padding: "10px 16px", fontSize: 12, fontWeight: 600, borderRadius: 6, cursor: "pointer", fontFamily: "inherit",
                border: `1px solid ${CC.border}`, background: "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)", color: "#555",
                display: "flex", alignItems: "center", gap: 5, whiteSpace: "nowrap",
              }}>📖 Preview Folds</button>
            )}
          </div>
          {panels > 1 && sizeMode === "custom" && (
            <Pil label={<Tip k="fold_direction">Fold Direction</Tip>} value={foldDir} onChange={onFoldDirChange} options={[
              { t: `Fold Long Side (${Math.max(longEdge, shortEdge)}")`, v: "long" },
              { t: `Fold Short Side (${Math.min(longEdge, shortEdge)}")`, v: "short" },
            ]} />
          )}
          {panels > 1 && (() => {
            const foldDim2 = foldDir === "long" ? longEdge : shortEdge;
            const staticDim2 = foldDir === "long" ? shortEdge : longEdge;
            const panelSize2 = foldDim2 / panels;
            const tooSmall2 = panelSize2 < 2;
            const throatExceeded2 = foldDir === "short" && longEdge > 13;
            return <>
              <div style={{ marginTop: 8, padding: "8px 12px", background: tooSmall2 || throatExceeded2 ? "#fef2f2" : CC.tint, borderRadius: 9, fontSize: 11, color: tooSmall2 || throatExceeded2 ? "#b91c1c" : CC.mid, border: tooSmall2 || throatExceeded2 ? "1px solid #f5cccc" : "none" }}>
                Folded size: <strong>{fmtInch(staticDim2)}" × {fmtInch(panelSize2)}"</strong> ({panels} panels)
                {tooSmall2 && <span style={{marginLeft:8,fontWeight:700}}>— Panel too small (min 2")</span>}
                {throatExceeded2 && <span style={{marginLeft:8,fontWeight:700}}>— Cannot fold, unfolded edge exceeds 13 inches</span>}
              </div>
              {sizeMode !== "custom" && <p style={{fontSize:10,color:CC.light,margin:"4px 0 0"}}>All folds assume the longest edge is being folded. Use custom size to fold the short edge.</p>}
            </>;
          })()}

          {/* Individual side upload slots */}
          <div style={{ display: "grid", gridTemplateColumns: sides === 1 ? "1fr" : "1fr 1fr", gap: 8, marginTop: 8 }}>
            {[{s:"front",label:fLabel,art:frontArt,setArt:setFrontArt,inputRef:frontInputRef},...(sides === 2 ? [{s:"back",label:bLabel,art:backArt,setArt:setBackArt,inputRef:backInputRef}] : [])].map(({s,label,art,setArt,inputRef}) => {
              const handleSlotFile = async (file) => {
                if (!file) return;
                try {
                  if (file.type === "application/pdf") {
                    const buf = await file.arrayBuffer();
                    await window.__ppsPdfJs;
                    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
                    window.PPS_PDF_RISKS[s] = await window.ppsAnalyzePdfRisks(pdf);
                    const pg = await pdf.getPage(1);
                    const vp = pg.getViewport({ scale: 2 });
                    const c = document.createElement("canvas");
                    c.width = vp.width; c.height = vp.height;
                    await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
                    const [x0, y0, x1, y1] = pg.view;
                    setArt({ dataUrl: c.toDataURL("image/jpeg", 0.85), file, dims: { w: (x1 - x0) / 72, h: (y1 - y0) / 72 } });
                    setApproved(false);
                    return;
                  }
                  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
                  if (!dataUrl) return;
                  const dims = await new Promise(res => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth / 300, h: img.naturalHeight / 300 }); img.onerror = () => res({ w: 0, h: 0 }); img.src = dataUrl; });
                  setArt({ dataUrl, file, dims });
                  setApproved(false);
                } catch (e) { console.error("Slot file processing failed:", e); }
              };
              return (
                <div key={s} style={{ position: "relative" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".5px", color: CC.mid, marginBottom: 4 }}>
                    {label}
                  </div>
                  {art ? (
                    <div style={{ position: "relative", borderRadius: 6, overflow: "hidden", border: `2px solid ${CC.border}`, cursor: "pointer" }}
                      onClick={() => { setSide(s); setProofOpen(true); }}>
                      <img src={art.dataUrl} style={{ width: "100%", display: "block", aspectRatio: `${longEdge}/${shortEdge}`, objectFit: "cover" }} />
                      <div style={{ position: "absolute", top: 4, right: 4, display: "flex", gap: 3 }}>
                        <button type="button" onClick={e => { e.stopPropagation(); inputRef.current?.click(); }} style={{
                          width: 22, height: 22, borderRadius: 4, border: "none", background: "rgba(0,0,0,.6)", color: "#fff", fontSize: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                        }} title="Replace">↻</button>
                        <button type="button" onClick={e => { e.stopPropagation(); setArt(null); setApproved(false); }} style={{
                          width: 22, height: 22, borderRadius: 4, border: "none", background: "rgba(0,0,0,.6)", color: "#fff", fontSize: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                        }} title="Remove">✕</button>
                      </div>
                    </div>
                  ) : (
                    <div
                      onDragOver={e => e.preventDefault()}
                      onDrop={e => { e.preventDefault(); const f = e.dataTransfer.files?.[0]; if (f) handleSlotFile(f); }}
                      onClick={() => inputRef.current?.click()}
                      style={{
                        aspectRatio: `${longEdge}/${shortEdge}`, borderRadius: 6,
                        border: `2px dashed ${CC.border}`, background: "#f8fafc",
                        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                        cursor: "pointer", transition: "all .15s",
                      }}>
                      <div style={{ fontSize: 20, marginBottom: 2 }}>+</div>
                      <div style={{ fontSize: 10, color: CC.light }}>Drop or click</div>
                    </div>
                  )}
                  <input ref={inputRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.tiff,.tif" onChange={e => { const f = e.target.files?.[0]; if (f) handleSlotFile(f); e.target.value = ""; }} style={{ display: "none" }} />
                </div>
              );
            })}
          </div>

          {/* Approval status */}
          {approved ? (
            <div style={{ marginTop: 8, padding: "6px 12px", background: "#f0fdf4", border: "1px solid #86efac", borderRadius: 5, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: "#166534" }}>✓ Artwork Approved</span>
              <button type="button" onClick={() => setApproved(false)} style={{ fontSize: 10, fontWeight: 600, border: "1px solid #86efac", background: "#fff", color: "#16a34a", borderRadius: 4, padding: "2px 8px", cursor: "pointer", fontFamily: "inherit" }}>Review</button>
            </div>
          ) : (
            <div style={{ marginTop: 8, padding: "6px 12px", background: "#fef2f2", border: "1px solid #f5cccc", borderRadius: 5, fontSize: 11, color: "#dc2626" }}>
              Open the proof view to review and approve your artwork
            </div>
          )}
        </div>
      )}

      {/* Proof Modal — portalled: a transformed WordPress ancestor would trap
          position:fixed in its stacking context. The dark full-bleed surface is
          deliberate — it is an art-review stage, like the fold viewport. */}
      {proofOpen && currentArt && (<Float>
        <div style={{ position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,0,0,.94)", display: "flex", flexDirection: "column" }}>
          {/* Header */}
          <div style={{ padding: "12px 20px", borderBottom: "1px solid rgba(255,255,255,.1)", background: "#12151a", position: "relative", zIndex: 2, flexShrink: 0 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "8px 12px" }}>
              <div style={{ minWidth: 0, flex: "1 1 190px" }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>Artwork Proof — {side === "front" ? fLabel : bLabel}</div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,.58)" }}>{longEdge}" × {shortEdge}" flat{panels > 1 ? ` · ${panels} panels (${foldType})` : ""}
                  {effectiveDims && effectiveDims.w > 0 && effectiveDims.h > 0
                    ? <span style={{ marginLeft: 8, color: "rgba(255,255,255,.75)" }}>
                        · your file: {(+effectiveDims.w).toFixed(2)}" × {(+effectiveDims.h).toFixed(2)}" (shown at actual size)
                      </span>
                    : <span style={{ marginLeft: 8, color: "#fbbf24", fontWeight: 600 }}>
                        · couldn't read this file's size — it is being shown fitted to the sheet, not at actual size. Check it before approving.
                      </span>}</div>
                {window.ppsPdfRisks().length > 0 && <div style={{ fontSize: 11, color: "#fbbf24", fontWeight: 600, marginTop: 3, maxWidth: 520 }}>⚠ Uses {window.ppsPdfRisks().join(", ")} — effects a browser preview can render imperfectly. If anything differs from the file you exported, contact us before approving.</div>}
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", justifyContent: "flex-end", rowGap: 6, marginLeft: "auto" }}>
                {canFlip && (
                  <button type="button" onClick={() => setFoldFlipped(f => !f)} style={{
                    padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "1px solid rgba(255,255,255,.2)",
                    borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                    background: foldFlipped ? "#f59e0b" : "rgba(255,255,255,.06)",
                    color: foldFlipped ? "#000" : "rgba(255,255,255,.5)",
                  }}>Flip Fold</button>
                )}
                {backArt && (
                  <div style={{ display: "flex", borderRadius: 4, overflow: "hidden", border: "1px solid rgba(255,255,255,.2)" }}>
                    <button type="button" onClick={() => setSide("front")} style={{ padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: side === "front" ? CK.cyan : "rgba(255,255,255,.06)", color: side === "front" ? "#fff" : "rgba(255,255,255,.5)" }}>Front</button>
                    <button type="button" onClick={() => setSide("back")} style={{ padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: side === "back" ? CK.cyan : "rgba(255,255,255,.06)", color: side === "back" ? "#fff" : "rgba(255,255,255,.5)" }}>Back</button>
                  </div>
                )}
                <button type="button" disabled={generatingPdf} onClick={async () => {
                  if (approved) { setProofOpen(false); return; }
                  setGeneratingPdf(true);
                  setGenProgress({ step: "starting", page: 0, totalPages: (backArt ? 2 : 1) });
                  try {
                    const pkg = await generateApprovalPackage();
                    if (!pkg || !pkg.manifestBlob) throw new Error("Package generation returned empty result");
                    setApprovalPkg(pkg);
                    setApproved(true);
                    if (onArtwork) {
                      const baseName = (fileName || "artwork").replace(/\.[^.]+$/, "");
                      const files = [];
                      // Every pristine original the customer gave us, byte-identical.
                      // rawFileRef only remembers the last file the main drop zone
                      // processed: art uploaded through the per-side slots never set it,
                      // so a front+back order could reach production with one side's
                      // source file missing — or, slot-only, with no original at all.
                      const _seenOrig = new Set();
                      const _pushOrig = (f) => {
                        if (!f) return;
                        const k = f.name + "|" + f.size;
                        if (_seenOrig.has(k)) return;
                        _seenOrig.add(k); files.push(f);
                      };
                      _pushOrig(rawFileRef.current);
                      _pushOrig(frontArt && frontArt.file);
                      _pushOrig(backArt && backArt.file);
                      if (pkg.printReadyBlob) files.push(new File([pkg.printReadyBlob], baseName + "_print-ready.pdf", { type: "application/pdf" }));
                      const sideNames = ["front", "back"];
                      pkg.previewBlobs.forEach((b, i) => {
                        if (b) files.push(new File([b], `${baseName}_preview_${sideNames[i] || ("side_" + (i+1))}.jpg`, { type: "image/jpeg" }));
                      });
                      if (pkg.previewHtmlBlob) files.push(new File([pkg.previewHtmlBlob], baseName + "_preview.html", { type: "text/html" }));
                      files.push(new File([pkg.manifestBlob], baseName + "_manipulation_manifest.txt", { type: "text/plain" }));
                      onArtwork({ type: "files", list: files, approved: true });
                    }
                  } catch (err) {
                    console.error("Approval package generation failed:", err);
                    alert("Failed to generate print-ready package: " + (err.message || err)
                      + "\n\nApproval is what releases the job to production, so we can't take the "
                      + "order until this succeeds. Try again, or send us the file and we'll proof it "
                      + "for you.");
                  } finally {
                    setGeneratingPdf(false);
                    setGenProgress(null);
                  }
                }} className={approved ? "bp-approved" : generatingPdf ? "bp-approve" : "bp-approve nudge"} style={{
                  padding: !approved ? "9px 22px" : "5px 14px",
                  fontSize: !approved ? 13 : 11,
                  fontWeight: 800, borderRadius: 9, cursor: approved ? "default" : generatingPdf ? "wait" : "pointer", fontFamily: "inherit", letterSpacing: ".04em", textTransform: "uppercase",
                  border: "none",

                  maxWidth: "none", maxHeight: "none",
                  position: "absolute",
                  left: `${(100 - nativeW * mult * 100) * (posX / 100)}%`,
                  top: `${(100 - nativeH * mult * 100) * (posY / 100)}%`,
                  display: "block",
                });
                return (
                  <div style={{ position: "absolute", left: lensX, top: lensY, width: lensSize, height: lensSize, borderRadius: "50%", overflow: "hidden", border: "2px solid rgba(255,255,255,.8)", boxShadow: "0 4px 20px rgba(0,0,0,.6)", pointerEvents: "none", zIndex: 10 }}>
                    {/* Bleed-zoomed proof viewport — mirrors the main proof container at zoom× scale, offset so the cursor point lands at the lens centre */}
                    <div className="bp-checker" style={{ position: "absolute", left: bgX, top: bgY, width: magPos.cw * zoom, height: magPos.ch * zoom, overflow: "hidden" }}>
                      <img src={imgSrc} style={{
                        filter: grayFilter,
                        ...(fitMode === "crop" ? cropStyle(1)
                          : fitMode === "scale" ? cropStyle(artScale / 100)
                          : fitMode === "stretch" ? { display: "block", width: "100%", height: "100%", objectFit: "fill", position: "absolute", inset: 0 }
                          : { display: "block", width: "100%", height: "100%", objectFit: fitMode === "contain" ? "contain" : "cover", objectPosition: `${posX}% ${posY}%` }
                        )
                      }} />
                      {showGuides && <>
                        {/* Bleed — red dashed at container edge */}
                        <div style={{ position: "absolute", inset: 0, border: "1px dashed #ef4444", boxSizing: "border-box", pointerEvents: "none" }} />
                        {/* Trim — white dashed, inset by bleed */}
                        <div style={{ position: "absolute", top: `${bleedPctY}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, bottom: `${bleedPctY}%`, border: "1px dashed rgba(255,255,255,.85)", boxSizing: "border-box", pointerEvents: "none" }} />
                        {/* Safety — green dashed, further inset */}
                        <div style={{ position: "absolute", top: `${safetyPctY}%`, left: `${safetyPctX}%`, right: `${safetyPctX}%`, bottom: `${safetyPctY}%`, border: "1px dashed #38a169", boxSizing: "border-box", pointerEvents: "none" }} />
                        {/* Fold lines — orange solid, positioned relative to the trim window (same math as main proof view) */}
                        {foldLines.map((fl, i) => (
                          <div key={i} style={{
                            position: "absolute", pointerEvents: "none",
                            ...(fl.vertical
                              ? { left: `${bleedPctX + (100 - bleedPctX * 2) * fl.pct / 100}%`, top: `${bleedPctY}%`, bottom: `${bleedPctY}%`, width: 1, background: "#f97316" }
                              : { top: `${bleedPctY + (100 - bleedPctY * 2) * fl.pct / 100}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, height: 1, background: "#f97316" }
                            ),
                          }} />
                        ))}
                      </>}
                    </div>
                    {/* Crosshair — anchored to lens centre */}
                    <div style={{ position: "absolute", top: 0, left: lensSize / 2, width: 1, height: lensSize, background: "rgba(255,255,255,.3)" }} />
                    <div style={{ position: "absolute", left: 0, top: lensSize / 2, width: lensSize, height: 1, background: "rgba(255,255,255,.3)" }} />
                  </div>
                );
              })()}

              {/* Trim shadow overlay — darkens the bleed zone around the art */}
              <div style={{ position: "absolute", top: `${bleedPctY}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, bottom: `${bleedPctY}%`, boxShadow: "0 0 0 200px rgba(0,0,0,0.15)", pointerEvents: "none", zIndex: 0 }} />

              {/* Legend */}
              <div style={{ position: "absolute", bottom: 8, left: 8, display: "flex", gap: 10, fontSize: 9, zIndex: 3, background: "rgba(0,0,0,.6)", padding: "3px 8px", borderRadius: 3 }}>
                <span style={{ color: "#ef4444", fontWeight: 600 }}>— Bleed</span>
                <span style={{ color: "#e2e8f0", fontWeight: 600 }}>- - Trim</span>
                <span style={{ color: "#38a169", fontWeight: 600 }}>- - Safety</span>
                {foldLines.length > 0 && <span style={{ color: "#f59e0b", fontWeight: 600 }}>— Fold</span>}
                {perfLines.length > 0 && <span style={{ color: "#8b5cf6", fontWeight: 600 }}>- - Perf (drag)</span>}
              </div>
            </div>
          </div>
          </div>
          </div>
        </div>
      </Float>)}

      {/* Preview Modal — matches booklet previewer style. Portalled like the proof
          modal; the dark stage is the 3D fold renderer's own surface. */}
      {previewOpen && (<Float>
        <div style={{ position: "fixed", inset: 0, zIndex: 9999, display: "flex", flexDirection: "column", backgroundColor: "#1a1d23", background: "linear-gradient(135deg,#1a1d23,#2a2e36)" }}>
          {/* Header bar */}
          <div style={{ padding: "10px 16px", background: "rgba(0,0,0,.3)", borderBottom: "1px solid rgba(255,255,255,.06)", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexShrink: 0 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>Fold Preview</div>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,.58)" }}>
                {longEdge}" × {shortEdge}" {panels > 1 ? `· ${panels} panels` : "flat"}
                {frontArt && !backArt && <span style={{ color: "#f59e0b", marginLeft: 6 }}>(back side blank)</span>}
              </div>
            </div>
            <button type="button" onClick={() => setPreviewOpen(false)} style={{ background: "#262b33", border: "1px solid #454c58", color: "#e2e6ec", WebkitAppearance: "none", appearance: "none", width: 32, height: 32, borderRadius: 8, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>✕</button>
          </div>

          {(() => {
            const foldKey = FOLD_KEY_MAP[foldType];
            const foldCfg = foldKey ? FOLDS_3D[foldKey] : null;

            // Flat — show front/back artwork centered
            if (!foldCfg) return (
              <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
                <div style={{ maxWidth: 500, width: "100%", textAlign: "center" }}>
                  {frontArt && <img src={frontArt.dataUrl} style={{ width: "100%", borderRadius: 6, border: "1px solid rgba(255,255,255,.1)", boxShadow: "0 8px 32px rgba(0,0,0,.4)" }} />}
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,.35)", marginTop: 10 }}>
                    {longEdge}" × {shortEdge}" flat · {side === "front" ? fLabel : bLabel}
                  </div>
                  {backArt && (
                    <div style={{ display: "flex", gap: 6, justifyContent: "center", marginTop: 10 }}>
                      <button type="button" onClick={() => setSide("front")} style={{ padding: "5px 14px", fontSize: 11, fontWeight: 600, border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", background: side === "front" ? CK.cyan : "rgba(255,255,255,.08)", color: side === "front" ? "#000" : "rgba(255,255,255,.5)" }}>Front</button>
                      <button type="button" onClick={() => setSide("back")} style={{ padding: "5px 14px", fontSize: 11, fontWeight: 600, border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", background: side === "back" ? CK.cyan : "rgba(255,255,255,.08)", color: side === "back" ? "#000" : "rgba(255,255,255,.5)" }}>Back</button>
                    </div>
                  )}
                </div>
              </div>
            );

            // Folded — 3D renderer with view buttons
            return (
              <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
                {/* View step buttons */}
                <div style={{ display: "flex", gap: 6, justifyContent: "center", padding: "10px 12px", flexWrap: "wrap", flexShrink: 0 }}>
                  {foldCfg.views.map((v, i) => (
                    <button key={i} type="button" onClick={() => setPreviewAngle(i)} style={{
                      padding: "7px 13px", borderRadius: 6, cursor: "pointer", fontFamily: "inherit", fontSize: 11, fontWeight: 600,
                      letterSpacing: ".03em", transition: "all .3s",
                      // Opaque colors and no native appearance: these buttons live in a
                      // portal outside #pps-calculator-wrap, so the calculator's scoped
                      // resets never reach them — translucent whites composited over
                      // whatever the host page provides is how they rendered
                      // white-on-white in production.
                      WebkitAppearance: "none", appearance: "none",
                      background: previewAngle === i ? CK.cyan : "#262b33",
                      border: `1px solid ${previewAngle === i ? CK.cyan : "#454c58"}`,
                      color: previewAngle === i ? "#000" : "#e2e6ec",
                      boxShadow: previewAngle === i ? "0 2px 12px rgba(0,174,239,.25)" : "none",
                    }}>{v.label}</button>
                  ))}
                </div>
                {/* 3D viewport — centered */}
                <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 10px", overflow: "hidden" }}>
                  <div style={{ width: "100%", maxWidth: 700, margin: "0 auto" }}>
                    <FoldRenderer
                      foldKey={foldKey}
                      crossFold={foldType === "trifold_xbifold"}
                      frontSrc={trimmedFrontUrl || frontArt?.dataUrl}
                      backSrc={trimmedBackUrl || backArt?.dataUrl}
                      frontDims={trimmedFrontUrl ? { w: longEdge, h: shortEdge } : frontArt?.dims}
                      backDims={trimmedBackUrl ? { w: longEdge, h: shortEdge } : backArt?.dims}
                      longEdge={longEdge}
                      shortEdge={shortEdge}
                      viewIdx={previewAngle}
                      foldDir={foldDir}
                      flipped={foldFlipped}
                      frontGray={frontColor === "bw"}
                      backGray={backColor === "bw"}
                    />
                  </div>
                </div>
                {/* Footer info */}
                <div style={{ textAlign: "center", fontSize: 10, color: "rgba(255,255,255,.3)", padding: "8px 0 14px", borderTop: "1px solid rgba(255,255,255,.06)" }}>
                  {longEdge}" × {shortEdge}" · {foldCfg.views[previewAngle]?.label || ""}
                </div>
              </div>
            );
          })()}
        </div>
      </Float>)}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// UI COMPONENTS
// ═══════════════════════════════════════════════════════════════
function Panel({ result, compact, debugUnlocked, expanded, onToggleExpand, coupon, totalRef }) {
  if (!result) return compact ? null : <div style={ST.pnl}><p style={{ color: CC.light, textAlign: "center", fontSize: 14, margin: 0, padding: "40px 20px" }}>Configure your brochure to see pricing</p></div>;
  if (result.error?.length > 0) return compact ? null : <div style={ST.pnl}><div style={{ padding: 20 }}>{result.error.map((e, i) => <p key={i} style={{ color: CC.red, fontSize: 13, margin: "0 0 8px" }}>{e}</p>)}</div></div>;
  const { total, baseTotal, perUnit, days, qty: tQ, bd, grouped, shipping: sh, saleActive, saleAmount, saleLabel, totalWithoutSale } = result;
  const hasRush = sh && sh.rushCost > 0;
  // Before a destination is entered the free-ground date is a guess on a guess —
  // 2× production buffer plus a placeholder transit — and it read a week later than
  // the job actually needs. Until the address is known, quote production + 1 transit
  // day (which is also what AZ ground is), then switch to the real committed date.
  const _dest = !sh || sh.hasDest;
  const availRange = sh ? (_dest ? (sh.earliestBizDays === sh.freeDeliveryBizDays ? `${sh.earliestBizDays}` : `${sh.earliestBizDays}–${sh.freeDeliveryBizDays}`) : `${sh.earliestBizDays}`) : String(days);
  // Availability reads as a single date: the rush need-by date when rush is applied,
  // else the free-delivery date — or the production+1 placeholder pre-address.
  // A date the customer picked is an instruction, not an estimate, so it wins the
  // availability display. sh.needByFmt is non-null exactly when a picked date is
  // valid and not too soon; compared against the free date, not merely checked for
  // existence, because a date that DIFFERS from the free one is the customer
  // actually asking for something.
  const requestedDate = sh && sh.needByFmt && sh.needByFmt !== sh.freeDeliveryDate
    ? sh.needByFmt : null;
  const deliveryDate = sh ? (requestedDate || (!_dest ? sh.earliestDate : ((hasRush && sh.needByFmt) ? sh.needByFmt : sh.freeDeliveryDate))) : null;
  // A discount code reduces what the customer pays but never the quoted line price —
  // WooCommerce applies it at cart level. So show it as a deduction FROM the total
  // rather than by rewriting the total, which is also how the order will read.
  const _cpn = coupon && coupon.discount > 0 ? coupon : null;
  const _cpnAmt = _cpn ? Math.min(_cpn.discount, total) : 0;
  const _afterCpn = Math.max(0, Math.round((total - _cpnAmt) * 100) / 100);
  // Per unit moves with the code too — derived from what they actually pay.
  const _cpnUnit = (_cpn && tQ > 0) ? Math.max(0, _afterCpn / tQ) : null;
  const ti = result.ti || {};
  const _factors = [];
  if (ti.paper > 0) _factors.push("paper lead time");
  if (ti.vivid > 0) _factors.push("vivid printing");
  if (ti.coating > 0) _factors.push("coating");
  if (ti.bundling > 0) _factors.push("bundling");
  if (ti.roundCorner > 0) _factors.push("round corners");
  if (ti.perforation > 0) _factors.push("perforation");
  if (ti.artDesign > 0 || ti.artEdits > 0) _factors.push("artwork");
  if (ti.proof > 0) _factors.push("proofing");
  const _extraDays = Object.values(ti).reduce((s, v) => s + (v || 0), 0);
  const _hasExtra = _extraDays >= 1 && _factors.length > 0;

  if (compact) {
    const moneyC = Math.max(0, total).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const [dC, cC] = moneyC.split(".");
    return (
      <div>
        {/* Collapsed, this strip shares a narrow row with the Add to Order button —
            three stat columns beside the price truncated the delivery date. Price and
            the disclosure sit on one line; the delivery date gets the strip's full
            width on a second. $/ea + Qty move into the expanded sheet. */}
        <div onClick={onToggleExpand} style={{ background: hasRush ? CK.rush : CK.cyan, borderRadius: expanded ? "6px 6px 0 0" : 6, padding: "8px 14px", color: hasRush ? "#333" : "#fff", cursor: "pointer", WebkitTapHighlightColor: "transparent" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ lineHeight: 1, display: "flex", alignItems: "baseline", gap: 6 }}>
                {saleActive && <span style={{ fontSize: 13, opacity: .6, textDecoration: "line-through", fontWeight: 600 }}>${totalWithoutSale.toFixed(2)}</span>}
                <span style={{ fontSize: 22, fontWeight: 800 }}>${dC}</span>
                <span style={{ fontSize: 13, fontWeight: 600, opacity: .7, marginLeft: 1 }}>.{cC}</span>
              </div>
              {saleActive && <div style={{ fontSize: 9, fontWeight: 700, marginTop: 1, letterSpacing: ".5px", textTransform: "uppercase" }}>{saleLabel} · Save ${saleAmount.toFixed(2)}</div>}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, flexShrink: 0 }}>
              <span style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: ".5px", textTransform: "uppercase", opacity: .75 }}>{expanded ? "Hide" : "Details"}</span>
              <span style={{ fontSize: 10, opacity: .6, transition: "transform .2s", display: "inline-block", transform: expanded ? "rotate(180deg)" : "none" }}>▼</span>
            </div>
          </div>
          <div style={{ fontSize: 10.5, fontWeight: 600, opacity: .9, marginTop: 3, letterSpacing: ".2px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {requestedDate ? "Delivery by" : "As soon as"} {deliveryDate || availRange + " days"}
          </div>
          {_cpn && <div style={{ fontSize: 10.5, fontWeight: 700, marginTop: 2, letterSpacing: ".2px", whiteSpace: "nowrap" }}>
            {_cpn.code} −${_cpnAmt.toFixed(2)} · you pay ${_afterCpn.toFixed(2)}
          </div>}
        </div>
        {expanded && <div style={{ background: CC.white, borderRadius: "0 0 6px 6px", border: `1px solid ${CC.border}`, borderTop: "none", maxHeight: "40vh", overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
          {/* Same stat row desktop shows under its price card, at full width. */}
          <div style={{ display: "flex", borderBottom: `1px solid ${CC.border}` }}>
            {[["$/ea", "$" + Math.max(0, perUnit).toFixed(2), _cpnUnit != null ? "$" + _cpnUnit.toFixed(2) : null], ["Qty", tQ.toLocaleString(), null], [requestedDate ? "Delivery by" : "As soon as", deliveryDate || availRange + " days", null]].map(([l, v, net], i) => (
              <div key={i} style={{ flex: 1, padding: "9px 6px", textAlign: "center", borderLeft: i ? `1px solid ${CC.border}` : "none", background: (i === 2 && _hasExtra) ? "#fffbeb" : "transparent" }}>
                <div style={{ fontSize: 8.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: (i === 2 && _hasExtra) ? "#92400e" : CC.light }}>{l}</div>
                {net
                  ? <><div style={{ fontSize: 9.5, fontWeight: 600, color: CC.light, textDecoration: "line-through", lineHeight: 1.1, marginTop: 1 }}>{v}</div>
                      <div style={{ fontSize: 12.5, fontWeight: 700, color: CK.cyan, lineHeight: 1.15 }}>{net}</div></>
                  : <div style={{ fontSize: 12.5, fontWeight: 700, color: (i === 2 && _hasExtra) ? "#b45309" : CC.dark, marginTop: 1 }}>{v}</div>}
              </div>
            ))}
          </div>
          {_hasExtra && <div style={{ padding: "5px 14px", borderBottom: `1px solid ${CC.border}`, background: "#fffbeb" }}>
            <div style={{ fontSize: 10.5, color: "#92400e", lineHeight: 1.4 }}>+{Math.round(_extraDays)} day{Math.round(_extraDays) !== 1 ? "s" : ""} due to {_factors.join(", ")}</div>
          </div>}
          {/* Cost breakdown is internal. Desktop keeps it behind the %3414 unlock;
              mobile rendered it to every customer, which exposed per-line costs. */}
          {debugUnlocked && <div style={{ padding: "6px 12px" }}>{bd.map((r, i) => (<div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "2.5px 0" }}>
            <span style={{ fontSize: 11, color: CC.light }}>{r.l}</span>
            <span style={{ fontSize: 11, fontWeight: 600, color: r.v < 0 ? CK.cyan : CC.mid }}>{r.v < 0 ? "−" : ""}${Math.abs(r.v).toFixed(2)}</span>
          </div>))}</div>}
        </div>}
      </div>
    );
  }

  const moneyD = Math.max(0, total).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const [dD, cD] = moneyD.split(".");
  const eyeCol = hasRush ? "rgba(51,51,51,.8)" : "rgba(255,255,255,.85)";
  return (
    <div style={{ ...ST.pnl, pointerEvents: "none" }}>
      {/* Sentinel for the condensed-total bar. Anchored at the TOP of the card so it
          leaves the viewport when the total does. */}
      <div ref={totalRef} style={{ height: 1, marginBottom: -1 }} aria-hidden="true"/>
      {/* Ink price card, not brand cyan: cyan is reserved for the CTA and active
          states so the Add to Order button stays the loudest thing in the rail.
          Rush keeps its own color — that's a state signal, not decoration. */}
      <div style={{ padding: "22px 20px 18px", background: hasRush ? `linear-gradient(135deg, ${CK.rush} 0%, ${CK.rush}dd 100%)` : CC.heroBg, color: hasRush ? "#333" : "#fff", pointerEvents: "none" }}>
        <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "1.5px", color: eyeCol, marginBottom: 6 }}>{hasRush ? "Rush · Grand Total" : "Grand Total"}</div>
        <div style={{ lineHeight: 1, display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
          {saleActive && <span style={{ fontSize: 18, opacity: .55, textDecoration: "line-through", fontWeight: 700, letterSpacing: "-.5px" }}>${totalWithoutSale.toFixed(2)}</span>}
          <span style={{ fontSize: 38, fontWeight: 800, letterSpacing: "-1.5px" }}>${dD}</span>
          <span style={{ fontSize: 22, fontWeight: 700, opacity: .7, letterSpacing: "-0.5px", marginLeft: -9 }}>.{cD}</span>
          {saleActive && <span style={{ display: "inline-block", background: CK.magenta, color: "#fff", fontSize: 11, fontWeight: 800, letterSpacing: ".5px", padding: "3px 8px", borderRadius: 4, textTransform: "uppercase" }}>{saleLabel} · Save ${saleAmount.toFixed(2)}</span>}
        </div>
        <div style={{fontSize:10,fontWeight:600,opacity:.62,marginTop:5,lineHeight:1.35}}>Includes all applicable taxes, fees, and shipping.*</div>
        {_cpn && (
          <div style={{ marginTop: 10, paddingTop: 9, borderTop: `1px solid ${hasRush ? "rgba(0,0,0,.15)" : "rgba(255,255,255,.18)"}` }}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10, fontSize: 12.5, fontWeight: 700 }}>
              <span style={{ textTransform: "uppercase", letterSpacing: ".5px", opacity: .85 }}>{_cpn.code} · {_cpn.label}</span>
              <span>−${_cpnAmt.toFixed(2)}</span>
            </div>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10, marginTop: 6 }}>
              <span style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "1px", opacity: .8 }}>You pay</span>
              <span style={{ fontSize: 24, fontWeight: 800, letterSpacing: "-.7px" }}>${_afterCpn.toFixed(2)}</span>
            </div>
            <div style={{ fontSize: 10, opacity: .62, marginTop: 3, lineHeight: 1.35 }}>Applied at checkout{_cpn.free_shipping ? " · includes free shipping" : ""}</div>
          </div>
        )}
        {hasRush && <div style={{ fontSize: 13.5, fontWeight: 800, marginTop: 6, letterSpacing: ".2px" }}>Delivery by {sh.needByFmt}</div>}
        {hasRush && debugUnlocked && <div style={{ fontSize: 12, opacity: .75, marginTop: 4 }}>Base ${baseTotal.toFixed(2)} + Rush ${sh.rushCost.toFixed(2)} ({sh.rushMultiplier.toFixed(2)}×)</div>}
      </div>
      <div style={{ display: "flex", borderBottom: `1px solid ${CC.border}` }}>
        {[["Per Unit", "$" + Math.max(0, perUnit).toFixed(2), _cpnUnit != null ? "$" + _cpnUnit.toFixed(2) : null], ["Qty", tQ.toLocaleString(), null]].map(([l, v, net], i) => (
          <div key={i} style={{ flex: 1, padding: "11px 8px", textAlign: "center", borderRight: `1px solid ${CC.border}` }}>
            <div style={{ fontSize: 9.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: CC.light, marginBottom: 1 }}>{l}</div>
            {net
              ? <><div style={{ fontSize: 10.5, fontWeight: 600, color: CC.light, textDecoration: "line-through", lineHeight: 1.1 }}>{v}</div>
                  <div style={{ fontSize: 14.5, fontWeight: 700, color: CK.cyan, lineHeight: 1.15 }}>{net}</div></>
              : <div style={{ fontSize: 14.5, fontWeight: 700, color: CC.dark }}>{v}</div>}
          </div>
        ))}
        <div style={{ flex: 1, padding: "11px 8px", textAlign: "center", background: _hasExtra ? "#fffbeb" : "transparent", transition: "background .3s" }}>
          <div style={{ fontSize: 9.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: _hasExtra ? "#92400e" : CC.light, marginBottom: 1 }}>{requestedDate ? "Delivery by" : "As soon as"}</div>
          <div style={{ fontSize: 13.5, fontWeight: 700, color: _hasExtra ? "#b45309" : CC.dark }}>{deliveryDate || availRange + " days"}</div>
        </div>
      </div>
      {_hasExtra && <div style={{ padding: "5px 18px", borderBottom: `1px solid ${CC.border}`, background: "#fffbeb" }}>
        <div style={{ fontSize: 10.5, color: "#92400e", lineHeight: 1.4 }}>* +{Math.round(_extraDays)} day{Math.round(_extraDays) !== 1 ? "s" : ""} due to {_factors.join(", ")}</div>
      </div>}

function TxtNum({label,value,onChange,min=1,max=99999}){
  const[raw,setRaw]=useState(String(value));
  const[note,setNote]=useState(null);
  // What we last handed the parent. The parent may normalise it — Quantity rounds, for
  // instance — and when its normalised result happens to equal the value it already
  // held, a [value]-keyed effect never fires and the box goes on showing "11.4" while
  // the quote says 11. Reconciling on every render instead means the field always ends
  // up displaying the number actually being priced. It does not fight mid-typing:
  // "10." parses to 10, the parent stores 10, and pushed===value so nothing snaps.
  const pushed=useRef(null);
  useEffect(()=>setRaw(String(value)),[value]);
  useEffect(()=>{
    if(pushed.current!==null && value!==pushed.current){ setRaw(String(value)); pushed.current=value; }
  });
  const commit=v=>{ pushed.current=v; onChange(v); };
  return <div style={ST.f}>{label&&<label style={ST.lbl}>{label}</label>}
    <input type="text" inputMode="decimal" value={raw}
      onChange={e=>{setRaw(e.target.value);setNote(null);const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=min&&v<=max)commit(v)}}
      onBlur={()=>{
        const typed=parseFloat(raw);
        let v=typed; if(isNaN(v))v=min;
        v=Math.min(max,Math.max(min,v));
        // Rewriting someone's number without telling them is how a typed dimension
        // silently becomes something else. Say what happened and why.
        setNote(!isNaN(typed)&&typed!==v ? `Adjusted to ${v} — allowed range is ${min}–${max}` : null);
        commit(v); setRaw(String(v));
      }} style={ST.inp}/>
    {note&&<div style={{fontSize:11,color:"#b45309",marginTop:4,lineHeight:1.35}}>{note}</div>}
  </div>;
}

        <div style={{ position: "fixed", ...(mob ? { bottom: "var(--pps-bottombar, 0px)", left: 0, right: 0, borderRadius: "16px 16px 0 0", maxHeight: "calc(80vh - var(--pps-bottombar, 0px))" } : { top: "50%", left: "50%", transform: "translate(-50%, -50%)", borderRadius: 12, maxHeight: "80vh", width: "min(420px, 90vw)" }), background: dark ? "#1a1d23" : "#fff", border: `1px solid ${dark ? "rgba(255,255,255,.1)" : CC.border}`, boxShadow: "0 16px 48px rgba(0,0,0,.25)", zIndex: 100000, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
          <div style={{ padding: "14px 18px 10px", borderBottom: `1px solid ${dark ? "rgba(255,255,255,.08)" : CC.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: dark ? "#1a1d23" : "#fff", zIndex: 1 }}>
            <span style={{ fontWeight: 700, fontSize: 14, color: dark ? "#fff" : CC.dark }}>{editing ? "Edit Tooltip" : (resolvedTitle || "Info")}</span>
            <span style={{ display:"flex", gap:8, alignItems:"center" }}>
              {editOn && !editing && <button type="button" onClick={startEdit} title="Edit this tooltip" style={{ background:"none", border:`1px solid ${CK.cyan}44`, color:CK.cyan, fontSize:11, fontWeight:700, cursor:"pointer", padding:"2px 8px", borderRadius:4, fontFamily:"inherit" }}>✎ Edit</button>}
              <button type="button" onClick={() => { setOpen(false); setEditing(false); }} style={{ background: "none", border: "none", fontSize: 18, color: dark ? "rgba(255,255,255,.4)" : CC.light, cursor: "pointer", padding: "0 4px" }}>✕</button>
            </span>
          </div>
          <div style={{ padding: "12px 18px 18px" }}>
            {editing ? <>
              <label style={{ fontSize:11, fontWeight:700, color:CC.mid, display:"block", marginBottom:4 }}>Title</label>
              <input type="text" value={eT} onChange={e=>setET(e.target.value)} style={{ width:"100%", padding:"7px 9px", fontSize:13, border:`1px solid ${CC.border}`, borderRadius:5, fontFamily:"inherit", marginBottom:10, boxSizing:"border-box" }} />
              <label style={{ fontSize:11, fontWeight:700, color:CC.mid, display:"block", marginBottom:4 }}>Text</label>
              <textarea value={eC} onChange={e=>setEC(e.target.value)} rows={5} style={{ width:"100%", padding:"7px 9px", fontSize:13, lineHeight:1.5, border:`1px solid ${CC.border}`, borderRadius:5, fontFamily:"inherit", resize:"vertical", boxSizing:"border-box" }} />
              <div style={{ display:"flex", gap:8, marginTop:12, flexWrap:"wrap", alignItems:"center" }}>
                <button type="button" onClick={saveEdit} style={{ padding:"7px 14px", fontSize:12, fontWeight:700, border:"none", borderRadius:6, cursor:"pointer", background:CK.cyan, color:"#fff", fontFamily:"inherit" }}>Save</button>
                <button type="button" onClick={()=>setEditing(false)} style={{ padding:"7px 14px", fontSize:12, fontWeight:600, border:`1px solid ${CC.border}`, borderRadius:6, cursor:"pointer", background:"#fff", color:CC.mid, fontFamily:"inherit" }}>Cancel</button>
                <button type="button" onClick={copyTipJSON} title="Copy all edited tooltips as JSON for the admin Tooltips tab" style={{ padding:"7px 14px", fontSize:12, fontWeight:600, border:`1px solid ${CC.border}`, borderRadius:6, cursor:"pointer", background:"#fff", color:CC.mid, fontFamily:"inherit", marginLeft:"auto" }}>{copied?"Copied ✓":"Copy JSON"}</button>
              </div>
              <p style={{ fontSize:10, color:CC.light, margin:"10px 0 0" }}>Saved to this browser only. Use “Copy JSON” and paste into the admin Tooltips tab for a permanent, site-wide change.</p>
            </> : blocks.map((b, i) => {
              if (b.type === "text") return <p key={i} style={{ fontSize: 13, lineHeight: 1.6, color: dark ? "rgba(255,255,255,.7)" : CC.mid, margin: i === 0 ? 0 : "10px 0 0" }}>{b.value}</p>;
              if (b.type === "image") return <img key={i} src={b.src} alt={b.alt || ""} loading="lazy" style={{ width: "100%", borderRadius: 6, marginTop: i === 0 ? 0 : 10, border: `1px solid ${dark ? "rgba(255,255,255,.1)" : CC.border}` }} />;
              if (b.type === "video") return <div key={i} style={{ marginTop: i === 0 ? 0 : 10, borderRadius: 6, overflow: "hidden" }}><video src={b.src} controls playsInline preload="metadata" style={{ width: "100%", display: "block" }} poster={b.poster} /></div>;
              if (b.type === "youtube") return <div key={i} style={{ marginTop: i === 0 ? 0 : 10, borderRadius: 6, overflow: "hidden", position: "relative", paddingBottom: "56.25%", height: 0 }}><iframe src={b.src} title={b.alt || "Video"} allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", border: "none" }} /></div>;
              return null;
            })}
          </div>
        </div>
      </Float>}
    </span>
  );
}

function buildSummary(config, result) {
  const lines = [];
  const r = result;
  const sh = r.shipping || {};

  // Size + fold + quantity
  const sizeStr = config.sizeMode === "custom"
    ? `${config.longEdge}×${config.shortEdge}" custom`
    : config.sizeLabel;
  const foldName = (FOLD_TYPES.find(f => f.val === config.foldType) || { label: config.foldType }).label;
  lines.push(`${config.qty.toLocaleString()} × ${sizeStr} · ${foldName}` + (config.jobName ? ` "${config.jobName}"` : ""));

  // Paper + print
  const cName = c => c === "bw" ? "Black & White" : "Full Color";
  lines.push(`Paper: ${config.paper.label}`);
  const sideStr = config.sides === 2
    ? `Front: ${cName(config.frontColor)} · Back: ${cName(config.backColor)}`
    : `Single-sided · ${cName(config.frontColor)}`;
  lines.push(sideStr);
  if (config.vivid) lines.push("Enhanced Vivid Print");

  // Finishing — only when selected
  if (config.coating > 0) {
    const ct = COATINGS.find(o => o.val === config.coating);
    if (ct) lines.push(`Coating: ${ct.label}` + (config.coatSides === 2 ? " (both sides)" : ""));
  }
  if (config.bundling > 0) {
    const b = BUNDLING.find(o => o.val === config.bundling);
    if (b) lines.push(`Bundling: ${b.label}`);
  }
  if (config.perforation > 0) {
    const p = PERF_OPTS.find(o => o.val === config.perforation);
    if (p) lines.push(`Perforation: ${p.label} (${config.perfDir})`);
  }
  if (config.roundCorner > 0) {
    const rc = CORNERS.find(o => o.val === config.roundCorner);
    if (rc) lines.push(`Round Corner: ${rc.label}`);
  }

  // Artwork
  const art = ART_OPTS.find(x => x.val === config.artwork);
  if (art) lines.push(art.label);
  if (config.bleed > 0) {
    const b = BLEED_OPTS.find(x => x.val === config.bleed);
    if (b) lines.push(b.label);
  }
  if (config.proof > 0) lines.push(config.proof >= 3 ? "Hardcopy Proof" : "Digital Proof");

  // Delivery
  if (config.needByDate && sh.rushCost > 0) {
    lines.push(`Rush: ${sh.bizDaysToDate} business days`);
  } else {
    lines.push(`Standard delivery: ${sh.freeDeliveryBizDays} business days`);
  }
  lines.push(`Ship to: ${config.shipState}${config.shipAddr?.zip ? " " + config.shipAddr.zip : ""}`);

  return lines.join("\n");
}

function buildMetadata(config, result) {
  const sh = result.shipping || {};
  return JSON.stringify({
    // Calc identification
    calcType: "brochure",
    calcLabel: "Brochure / Flat Print",
    // Customer selections
    jobName: config.jobName || "",
    qty: config.qty,
    sizeMode: config.sizeMode,
    sizeLabel: config.sizeLabel,
    longEdge: config.longEdge,
    shortEdge: config.shortEdge,
    foldType: config.foldType,
    foldDir: config.foldDir,
    frontColor: config.frontColor,
    backColor: config.backColor,
    sides: config.sides,
    paper: config.paper,
    vivid: config.vivid,
    coating: config.coating,
    coatSides: config.coatSides,
    bundling: config.bundling,
    perforation: config.perforation,
    perfDir: config.perfDir,
    perfPositions: config.perfPositions,
    roundCorner: config.roundCorner,
    artwork: config.artwork,
    bleed: config.bleed,
    proof: config.proof,
    proofAddrSame: config.proofAddrSame,
    proofAddr: config.proofAddr || {},
    canvaLink: config.canvaLink || "",
    canvaInstructions: config.canvaInstructions || "",
    shipState: config.shipState,
    shipZip: config.shipAddr?.zip || "",
    shipAddr: config.shipAddr || {},
    needByDate: config.needByDate,
    // Shipping — durations, not absolute dates
    // Physical shipment estimate. WooCommerce has nowhere to carry this on a virtual
    // line item, so it travels in the metadata blob and the plugin lifts it onto the
    // order — a fulfilment tool that imports the order needs a weight and a parcel
    // count, not just an address.
    estWeightLb: sh.estWeightLb,
    estCartons: sh.estCartons,
    transitDays: sh.transitDays,
    productionBizDays: sh.productionBizDays,
    requestedBizDays: sh.bizDaysToDate || sh.freeDeliveryBizDays,
    freeDeliveryBizDays: sh.freeDeliveryBizDays,
    rushMultiplier: sh.rushMultiplier,
    rushCost: sh.rushCost,
    productionStartDate: sh.productionStartYMD,
    mustShipByDate: sh.mustShipYMD,
    estimatedDeliveryDate: quotedDeliveryYMD(config.needByDate, sh),
    // Computed results
    total: result.total,
    baseTotal: result.baseTotal,
    perUnit: result.perUnit,
    totalQty: result.qty,
    days: result.days,
    debug: result.debug,
  });
}

// Upload a FormData via XHR with progress callback — returns parsed JSON response
function uploadWithProgress(url, formData, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.withCredentials = true;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      // The status code used to be ignored. admin-ajax answers a rejected nonce
      // with HTTP 403 and a bare "-1", and a POST larger than PHP's
      // post_max_size never reaches our handler at all — PHP discards $_POST,
      // so the nonce check fails and returns that same "-1". Both JSON.parse
      // cleanly to a number, so the caller read `.data` off it, found nothing,
      // and told the customer "Unknown error". Classify them instead.
      let body = null, parsed = true;
      try { body = JSON.parse(xhr.responseText); } catch (e) { parsed = false; }
      if (xhr.status === 413) {
        resolve({ success: false, data: "PPS_TOO_LARGE", ppsCode: "size" });
      } else if (body === -1 || body === 0 || xhr.status === 403) {
        resolve({ success: false, data: "PPS_STALE_NONCE", ppsCode: "nonce" });
      } else if (!parsed) {
        reject(new Error("Invalid server response (HTTP " + xhr.status + ")"));
      } else if (xhr.status < 200 || xhr.status >= 300) {
        reject(new Error("Server error (HTTP " + xhr.status + ")"));
      } else {
        resolve(body);
      }
    };
    xhr.onerror = () => reject(new Error("Network error during upload"));
    xhr.send(formData);
  });
}

async function submitToWooCommerce(total, summary, metadata, rushCost, artFiles, onProgress, couponCode) {
  const PPS = window.PPS_CONFIG || {};
  // Cached product pages can outlive the WordPress nonce tick (~12h), and the
  // nonces ride inside that cached HTML. Refresh just before submit so an aged
  // page still checks out; on any failure keep the baked values.
  if (PPS.ajaxUrl) {
    try {
      const _nroot = (PPS.ajaxUrl || "").replace(/wp-admin\/admin-ajax\.php.*$/, "");
      const _nr = await fetch((_nroot || "/") + "wp-json/pps/v1/nonces", { credentials: "same-origin" });
      if (_nr.ok) { const _nj = await _nr.json(); if (_nj && _nj.cart) { PPS.cartNonce = _nj.cart; if (_nj.upload) PPS.uploadNonce = _nj.upload; } }
    } catch (_e) {}
  }

  // ── Standalone mode: download artwork + order summary as a zip-like package ──
  if (!PPS.ajaxUrl) {
    console.warn("PPS: Standalone mode — triggering local download.");
    const lines = [
      "PPS Order Summary", "=".repeat(40), "",
      `Total: $${total.toFixed(2)}`, `Rush: $${rushCost.toFixed(2)}`, "",
      "Summary:", summary, "",
      "Metadata:", metadata, "",
      `Artwork: ${artFiles.type === "files" ? artFiles.list.map(f => f.name).join(", ") : artFiles.type === "existing" ? artFiles.path : "none"}`, ""
    ];
    const blob = new Blob([lines.join("\n")], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pps_order_summary.txt";
    a.click();
    URL.revokeObjectURL(a.href);
    if (artFiles.type === "files") {
      for (const file of artFiles.list) {
        const url = URL.createObjectURL(file);
        const dl = document.createElement("a");
        dl.href = url;
        dl.download = file.name;
        dl.click();
        URL.revokeObjectURL(url);
      }
    }
    alert(`Standalone mode: downloaded order summary${artFiles.type === "files" ? " + " + artFiles.list.length + " artwork file(s)" : ""}.`);
    return;
  }

  // ── Server mode ──
  let artworkPath = "";
  const uploadedFiles = [];

  if (artFiles.type === "files") {
    const total_files = artFiles.list.length;
    for (let fi = 0; fi < total_files; fi++) {
      const file = artFiles.list[fi];
      // The first file is the customer's raw artwork — required, becomes the
      // order's artwork reference. Later entries are supplementary deliverables
      // (front + back sheets, etc.); failures on them are logged but don't
      // block checkout.
      const isPrimary = fi === 0;
      try {
        // Refuse a file the server physically cannot accept, naming the real
        // limit, rather than letting PHP drop the POST and reporting nothing.
        const _mb = (n) => (n / 1048576).toFixed(1) + "MB";
        if (PPS.maxUpload && file.size > PPS.maxUpload) {
          if (isPrimary) {
            alert("That file is " + _mb(file.size) + ", and this site accepts up to " + _mb(PPS.maxUpload) + " per upload.\n\nPlease compress the PDF, or send it to us and we'll attach it to your order.");
            return;
          }
          try { console.warn(`[PPS calc] Skipping supplementary deliverable "${file.name}" — ${_mb(file.size)} exceeds the ${_mb(PPS.maxUpload)} server limit.`); } catch (e) {}
          continue;
        }
        const sendOnce = () => {
          const fd = new FormData();
          fd.append("action", "pps_upload_artwork");
          fd.append("nonce", PPS.uploadNonce);
          fd.append("artwork", file, file.name);
          return uploadWithProgress(PPS.ajaxUrl, fd, (pct) => {
            if (onProgress) onProgress({ phase: "upload", fileIdx: fi, fileCount: total_files, fileName: file.name, pct });
          });
        };
        if (onProgress) onProgress({ phase: "upload", fileIdx: fi, fileCount: total_files, fileName: file.name, pct: 0 });
        let data = await sendOnce();
        // A rejected nonce is recoverable: the page was simply open longer than
        // the nonce tick, or served from a cache older than it. Mint a fresh one
        // and send again before bothering the customer.
        if (data && data.ppsCode === "nonce") {
          try {
            const _nroot = (PPS.ajaxUrl || "").replace(/wp-admin\/admin-ajax\.php.*$/, "");
            const _nr = await fetch((_nroot || "/") + "wp-json/pps/v1/nonces", { credentials: "same-origin", cache: "no-store" });
            if (_nr.ok) {
              const _nj = await _nr.json();
              if (_nj && _nj.upload) { PPS.uploadNonce = _nj.upload; data = await sendOnce(); }
            }
          } catch (_e) {}
        }
        if (data.success && data.data && data.data.path) {
          if (!artworkPath) artworkPath = data.data.path;
          uploadedFiles.push({ path: data.data.path, name: file.name });
        } else {
          let reason = (data && data.data) || "the server gave no reason (HTTP " + (data && data.ppsCode ? data.ppsCode : "unknown") + ")";
          if (reason === "PPS_STALE_NONCE") reason = "this page was open longer than the session allows, and refreshing it did not help. Please reload the page and try again.";
          else if (reason === "PPS_TOO_LARGE") reason = "the file is larger than this site accepts in a single upload. Please compress the PDF, or send it to us and we'll attach it.";
          if (isPrimary) {
            alert("Artwork upload failed: " + reason + "\nPlease try again.");
            return;
          }
          try { console.warn(`[PPS calc] Skipping supplementary deliverable "${file.name}" — upload rejected: ${reason}`); } catch (e) {}
        }
      } catch (err) {
        if (isPrimary) {
          alert("Artwork upload error: " + err.message + "\nPlease try again.");
          return;
        }
        try { console.warn(`[PPS calc] Skipping supplementary deliverable "${file.name}" — upload error: ${err.message}`); } catch (e) {}
      }
    }
    if (!artworkPath) {
      alert("Artwork upload failed: the artwork file could not be uploaded.\nPlease try again.");
      return;
    }
    if (onProgress) onProgress({ phase: "cart", pct: 100 });
  } else if (artFiles.type === "existing") {
    artworkPath = artFiles.path;
  }

  // Add to cart
  try {
    const fd = new FormData();
    fd.append("action", "pps_add_to_cart");
    fd.append("nonce", PPS.cartNonce);
    fd.append("product_id", PPS.productId);
    const _pstr = total.toFixed(2);
    fd.append("pps_price", _pstr);
    // Payload integrity — both are revalidated server-side in pps_ajax_add_to_cart
    // and neither participates in pricing.
    fd.append("pps_tier", "retail");
    fd.append("pps_lock", (function(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h.toString(36);})(_pstr + "|" + PPS.productId));
    fd.append("pps_rush", rushCost.toFixed(2));
    fd.append("pps_summary", summary);
    fd.append("pps_metadata", metadata);
    const parsed = JSON.parse(metadata);
    fd.append("pps_biz_days", String(parsed.requestedBizDays || parsed.freeDeliveryBizDays || 5));
    if (artworkPath) fd.append("pps_artwork_path", artworkPath);
    // Woo validates and applies the code for real at cart level; this only carries it.
    if (couponCode) fd.append("pps_coupon", couponCode);
    if (uploadedFiles.length) fd.append("pps_artwork_files", JSON.stringify(uploadedFiles));

    const resp = await fetch(PPS.ajaxUrl, { method: "POST", credentials: "same-origin", body: fd });
    const data = await resp.json();
    if (data.success) {
      window.location.href = PPS.cartUrl;
    } else {
      alert("Error: " + (data.data || "Could not add to cart."));
    }
  } catch (err) {
    alert("Network error: " + err.message);
  }
}

// ═══════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const mob = useIsMobile();
  const [op, setOp] = useState({ s1: true, s2: true, s3: false, s4: false, s5: false });
  // Proof-debug mode — see calc-perfect-bound.html for the canonical comment
  const proofDebug = useMemo(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      if (p.get("debug") === "1") return true;
      if (typeof localStorage !== "undefined" && localStorage.getItem("pps_debug") === "1") return true;
    } catch {}
    return false;
  }, []);
  // The mobile bar is fixed to the bottom of the viewport, so anything else that docks
  // there — the tooltip sheet today, anything added later — has to know how tall it is
  // or it lands on top of the price and the Add to Order button. Published as a CSS
  // variable on <html> so a portalled overlay can read it without being handed a prop.
  // Its height changes with the shipping warning and the expanded panel, hence the
  // ResizeObserver rather than a one-off measurement.
  const bottomBarRef = useRef(null);
  useEffect(() => {
    const root = document.documentElement;
    if (!mob) { root.style.setProperty("--pps-bottombar", "0px"); return; }
    const set = () => root.style.setProperty("--pps-bottombar",
      (bottomBarRef.current ? bottomBarRef.current.offsetHeight : 0) + "px");
    set();
    let ro = null;
    if (window.ResizeObserver && bottomBarRef.current) {
      ro = new ResizeObserver(set); ro.observe(bottomBarRef.current);
    }
    window.addEventListener("resize", set);
    return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", set);
                   root.style.setProperty("--pps-bottombar", "0px"); };
  }, [mob]);
  // Theme. Persisted per browser like the focus-mode preference; falls back to the
  // OS setting on first visit so a dark-mode user isn't flashed a white page.
  const[theme,setTheme]=useState(()=>{
    try{
      const v=localStorage.getItem("pps_theme");
      if(v==="dark"||v==="light")return v;
      return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    }catch(e){return "light";}
  });
  const[themeTick,setThemeTick]=useState(0);
  useEffect(()=>{
    pps_applyTheme(theme);
    try{localStorage.setItem("pps_theme",theme);}catch(e){}
    // CC/ST are mutated in place, so nothing re-renders on its own — bump a counter
    // to repaint the tree with the new palette.
    setThemeTick(t=>t+1);
  },[theme]);
  const[setOpen,setSetOpen]=useState(false);
  useEffect(()=>{
    if(!setOpen)return;
    const onDoc=e=>{ if(!e.target.closest||!e.target.closest("[data-pps-settings]")) setSetOpen(false); };
    const onKey=e=>{ if(e.key==="Escape") setSetOpen(false); };
    document.addEventListener("mousedown",onDoc);
    document.addEventListener("keydown",onKey);
    return()=>{document.removeEventListener("mousedown",onDoc);document.removeEventListener("keydown",onKey);};
  },[setOpen]);
  // "One section at a time" — on by default: opening a section collapses the rest so
  // the customer is only looking at one topic. Preference is remembered per browser,
  // because someone who prefers seeing everything at once will want that every visit.
  const[soloSec,setSoloSec]=useState(()=>{
    try{const v=localStorage.getItem("pps_solo_sections");return v===null?true:v==="1";}catch(e){return true;}
  });
  useEffect(()=>{try{localStorage.setItem("pps_solo_sections",soloSec?"1":"0");}catch(e){}},[soloSec]);
  // Turning it on mid-session collapses down to whichever section is already open
  // (the first one), rather than leaving several open and contradicting the setting.
  useEffect(()=>{
    if(!soloSec)return;
    setOp(p=>{
      const openKeys=Object.keys(p).filter(k=>p[k]);
      if(openKeys.length<=1)return p;
      const next={};for(const k in p)next[k]=false;next[openKeys[0]]=true;return next;
    });
  },[soloSec]);
  const tog=k=>setOp(p=>{
    const opening=!p[k];
    if(soloSec&&opening){const next={};for(const key in p)next[key]=false;next[k]=true;return next;}
    return {...p,[k]:!p[k]};
  });
  // A fixed modal inside a collapsed keepMounted section's display:none subtree needs
  // the owning section expanded first — expand, then fire (next render if the ref
  // isn't attached yet).
  const[pendingPreview,setPendingPreview]=useState(false);
  const openPreview=()=>{
    setOp(p=>{
      if(p.s4)return p;
      if(soloSec){const n={};for(const k in p)n[k]=false;n.s4=true;return n;}
      return {...p,s4:true};
    });
    if(openPreviewModalRef.current){openPreviewModalRef.current();return;}
    setPendingPreview(true);
  };
  useEffect(()=>{
    if(!pendingPreview)return;
    if(openPreviewModalRef.current){openPreviewModalRef.current();setPendingPreview(false);}
  });
