// Sanitize src for innerHTML injection — only allow data: URIs
function safeSrc(src) { return src && src.startsWith("data:") ? src : ""; }

// Panel face builder — maps artwork onto front/back of each panel
// Wrap image in a positioned div — crops to trim area like the proof modal
// rW/rH = rendered image size in px (mapped 1:1 to physical inches), centered in iW×iH
function foldImgWrap(src, iW, iH, ml, mt, rW, rH) {
  if (!src) return "";
  var imgStyle;
  if (rW && rH) {
    // Crop mode: render at physical-inch scale, centered, overflow clipped
    var ox = (iW - rW) / 2, oy = (iH - rH) / 2;
    imgStyle = "width:" + rW.toFixed(1) + "px;height:" + rH.toFixed(1) + "px;position:absolute;left:" + ox.toFixed(1) + "px;top:" + oy.toFixed(1) + "px;display:block";
  } else {
    imgStyle = "width:100%;height:100%;object-fit:contain;display:block";
  }
  return '<div style="width:' + iW + 'px;height:' + iH + 'px;margin-left:' + ml + 'px;margin-top:' + mt + 'px;position:relative;overflow:hidden"><img src="' + safeSrc(src) + '" style="' + imgStyle + '"></div>';
}

function foldMkF(idx, n, pw, ph, iW, iH, isP, frontSrc, backSrc, swap, fRW, fRH, bRW, bRH) {
  const bi = n - 1 - idx;
  const fS = swap ? backSrc : frontSrc, bS = swap ? frontSrc : backSrc;
  const frw = swap ? bRW : fRW, frh = swap ? bRH : fRH, brw = swap ? fRW : bRW, brh = swap ? fRH : bRH;
  let fml=0, fmt=0, bml=0, bmt=0;
  if (isP) { fmt = -ph*idx; bmt = -ph*bi; } else { fml = -pw*idx; bml = -pw*bi; }
  return `<div class="fold-face ff" style="width:${pw}px;height:${ph}px;background:#fff">${foldImgWrap(fS,iW,iH,fml,fmt,frw,frh)}</div><div class="fold-face fb" style="width:${pw}px;height:${ph}px;background:#fff">${foldImgWrap(bS,iW,iH,bml,bmt,brw,brh)}</div>`;
}

// Gate face builder — source divided into quarters
function foldMkFGate(startQ, spanQ, qw, qh, iW, iH, isP, totalQ, frontSrc, backSrc, fRW, fRH, bRW, bRH) {
  const bStartQ = totalQ - startQ - spanQ;
  const pw = isP ? qw : qw*spanQ, ph = isP ? qh*spanQ : qh;
  const fml = isP ? 0 : -qw*startQ, fmt = isP ? -qh*startQ : 0;
  const bml = isP ? 0 : -qw*bStartQ, bmt = isP ? -qh*bStartQ : 0;
  return `<div class="fold-face ff" style="width:${pw}px;height:${ph}px;background:#fff">${foldImgWrap(frontSrc,iW,iH,fml,fmt,fRW,fRH)}</div><div class="fold-face fb" style="width:${pw}px;height:${ph}px;background:#fff">${foldImgWrap(backSrc,iW,iH,bml,bmt,bRW,bRH)}</div>`;
}

// Recursive nested builder (accordion, half, roll)
function foldBuildNest(idx, n, pw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH, swap) {
  const last = idx === n-1;
  let h = `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">`;
  h += foldMkF(idx, n, pw, ph, iW, iH, isP, fSrc, bSrc, !!swap, fRW, fRH, bRW, bRH);
  if (!last) {
    const hp = isP ? `left:0;top:${ph}px;` : `left:${pw}px;top:0;`;
    const og = isP ? "center top" : "left center";
    h += `<div class="fold-hinge" id="fh${idx+1}" style="${hp}width:${pw}px;height:${ph}px;transform-origin:${og}">`;
    h += foldBuildNest(idx+1, n, pw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH, swap);
    h += `</div>`;
  }
  h += `</div>`; return h;
}

// Double parallel fold builder — "bifold of a bifold".
// Physical: 4 panels [P1|P2|P3|P4]. Fold 1 brings right half (P3+P4) onto
// left half (P1+P2) around x=2pw. Fold 2 brings right half of the post-fold-1
// stack (P2 on bottom + P3 on top, at x=[pw,2pw]) onto the left half (P1 + P4).
// Key insight: after fold 1, P4 is at x=[0,pw] stacked on P1, and P3 is at
// x=[pw,2pw] stacked on P2. Fold 2 should rotate P2+P3 (now at [pw,2pw]) but
// NOT P4 (at [0,pw]). So P4 cannot be inside the same hinge tree as P3 during
// fold 2 — they need separate fold-1 hinges at the root level.
//
// DOM:
//   root
//   ├─ P1 wrap (at x=0)
//   ├─ fh2 (fold-2 hinge at x=pw, transform-origin:left center)
//   │   ├─ P2 wrap (at local x=0 inside fh2 → world x=pw)
//   │   └─ fh1a (fold-1 hinge for P3 at fh2 local x=pw → world x=2pw)
//   │       └─ P3 wrap
//   └─ fh1b (fold-1 hinge for P4 at root x=2pw, SIBLING of fh2)
//       └─ P4 wrap (at fh1b local x=pw → world x=3pw initially)
//
// fh1a and fh1b rotate together (both by the "fold 1" angle).
// fh2 rotates by the "fold 2" angle.
function foldBuildDParallel(pw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH, swap) {
  const mkP = (idx) => `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(idx, 4, pw, ph, iW, iH, isP, fSrc, bSrc, !!swap, fRW, fRH, bRW, bRH)}</div>`;
  let h = "";
  // Panel 0 (P1) at root
  h += mkP(0);
  // fh2 (fold-2 hinge) at x=pw, contains P2 + fh1a (for P3)
  h += `<div class="fold-hinge" id="fh2" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:left center">`;
  h += mkP(1); // P2 at local x=0
  // fh1a (fold-1 hinge for P3) at fh2 local x=pw → world x=2pw
  h += `<div class="fold-hinge" id="fh1a" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:left center">`;
  h += mkP(2); // P3 at local x=0
  h += `</div>`; // close fh1a
  h += `</div>`; // close fh2
  // fh1b (fold-1 hinge for P4) at root x=2pw, SIBLING of fh2
  h += `<div class="fold-hinge" id="fh1b" style="left:${2*pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:left center">`;
  // P4 wrap at fh1b local x=pw → world x=3pw initially
  h += `<div class="fold-panel-wrap" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px">${foldMkF(3, 4, pw, ph, iW, iH, isP, fSrc, bSrc, !!swap, fRW, fRH, bRW, bRH)}</div>`;
  h += `</div>`; // close fh1b
  return h;
}

// Tri-fold builder (center base, left/right hinges)
function foldBuildTri(pw, ph, iW, iH, isP, n, fSrc, bSrc, fRW, fRH, bRW, bRH) {
  let h = "";
  if (isP) {
    h += `<div class="fold-panel-wrap" style="left:0;top:${ph}px;width:${pw}px;height:${ph}px">`;
    h += foldMkF(1,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH);
    h += `<div class="fold-hinge" id="fhL" style="left:0;top:${-ph}px;width:${pw}px;height:${ph}px;transform-origin:center bottom"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(0,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `<div class="fold-hinge" id="fhR" style="left:0;top:${ph}px;width:${pw}px;height:${ph}px;transform-origin:center top"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(2,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `</div>`;
  } else {
    h += `<div class="fold-panel-wrap" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px">`;
    h += foldMkF(1,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH);
    h += `<div class="fold-hinge" id="fhL" style="left:${-pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:right center"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(0,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `<div class="fold-hinge" id="fhR" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:left center"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(2,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `</div>`;
  }
  return h;
}

// Gate fold builder (25%+50%+25%)
function foldBuildGate(qw, qh, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH) {
  let h = "";
  if (isP) {
    const cH = qh*2;
    h += `<div class="fold-hinge" id="fhGL" style="left:0;top:0;width:${qw}px;height:${qh}px;transform-origin:center bottom">${foldMkFGate(0,1,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-panel-wrap" style="left:0;top:${qh}px;width:${qw}px;height:${cH}px">${foldMkFGate(1,2,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhGR" style="left:0;top:${qh+cH}px;width:${qw}px;height:${qh}px;transform-origin:center top">${foldMkFGate(3,1,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
  } else {
    const cW = qw*2;
    h += `<div class="fold-hinge" id="fhGL" style="left:0;top:0;width:${qw}px;height:${qh}px;transform-origin:right center">${foldMkFGate(0,1,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-panel-wrap" style="left:${qw}px;top:0;width:${cW}px;height:${qh}px">${foldMkFGate(1,2,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhGR" style="left:${qw+cW}px;top:0;width:${qw}px;height:${qh}px;transform-origin:left center">${foldMkFGate(3,1,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
  }
  return h;
}

// Double gate builder (4 equal panels, flaps fold in, center folds over)
function foldBuildDGate(pw, ph, iW, iH, isP, n, fSrc, bSrc, fRW, fRH, bRW, bRH) {
  let h = "";
  if (isP) {
    h += `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph*2}px">`;
    h += `<div class="fold-panel-wrap" style="left:0;top:${ph}px;width:${pw}px;height:${ph}px">${foldMkF(1,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhL" style="left:0;top:0;width:${pw}px;height:${ph}px;transform-origin:center bottom"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(0,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `<div class="fold-hinge" id="fhCtr" style="left:0;top:${ph*2}px;width:${pw}px;height:${ph*2}px;transform-origin:center top">`;
    h += `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(2,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhR" style="left:0;top:${ph}px;width:${pw}px;height:${ph}px;transform-origin:center top"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(3,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `</div></div>`;
  } else {
    h += `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw*2}px;height:${ph}px">`;
    h += `<div class="fold-panel-wrap" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px">${foldMkF(1,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhL" style="left:0;top:0;width:${pw}px;height:${ph}px;transform-origin:right center"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(0,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `<div class="fold-hinge" id="fhCtr" style="left:${pw*2}px;top:0;width:${pw*2}px;height:${ph}px;transform-origin:left center">`;
    h += `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(2,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhR" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:left center"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(3,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `</div></div>`;
  }
  return h;
}

// Apply a view config to the scene DOM — sets all hinge transforms with anti-clipping translateZ
function foldApplyView(sceneEl, foldKey, viewIdx, dirSign) {
  const fold = FOLDS_3D[foldKey]; if (!fold) return;
  const view = fold.views[viewIdx]; if (!view) return;
  const s = dirSign || 1;
  const isP = false; // landscape for now (could be extended)
  let [rx, ry, tx, ty] = view.sc;
  if (s < 0) ry = -ry;

  sceneEl.style.transition = "transform 1.4s cubic-bezier(.4,0,.2,1)";
  sceneEl.style.transform = `scale(1) rotateX(${rx}deg) rotateY(${ry}deg) translateX(${tx}px) translateY(${ty}px)`;

  const $ = id => sceneEl.querySelector("#" + id);

  if (fold.mode === "trifold") {
    const [lA, rA] = view.f;
    const tzf = view.tzf_tf || [0, 0];
    const hL = $("fhL"), hR = $("fhR");
    const pw = hL ? parseInt(hL.style.width) || 0 : 0;
    if (hR) hR.style.transform = `${tzf[1]?`translateZ(${(tzf[1]*pw).toFixed(1)}px) `:""}rotateY(${rA*s}deg)`;
    if (hL) hL.style.transform = `${tzf[0]?`translateZ(${(tzf[0]*pw).toFixed(1)}px) `:""}rotateY(${lA*s}deg)`;
  } else if (fold.mode === "gate3") {
    const [lA, rA] = view.g;
    const gL = $("fhGL"), gR = $("fhGR");
    if (gL) gL.style.transform = `rotateY(${lA*s}deg)`;
    if (gR) gR.style.transform = `rotateY(${rA*s}deg)`;
  } else if (fold.mode === "dgate") {
    const [lA, rA, cA] = view.dg;
    const tzf = view.tzf || [0, 0, 0];
    const hL = $("fhL"), hR = $("fhR"), hC = $("fhCtr");
    const pw = hL ? parseInt(hL.style.width) || 0 : 0;
    if (hL) hL.style.transform = `${tzf[0]?`translateZ(${(tzf[0]*pw).toFixed(1)}px) `:""}rotateY(${lA*s}deg)`;
    if (hR) hR.style.transform = `${tzf[1]?`translateZ(${(tzf[1]*pw).toFixed(1)}px) `:""}rotateY(${rA*s}deg)`;
    if (hC) hC.style.transform = `${tzf[2]?`translateZ(${(tzf[2]*pw).toFixed(1)}px) `:""}rotateY(${cA*s}deg)`;
  } else if (fold.mode === "dparallel") {
    // view.f = [fold1angle, fold2angle]. fh1a + fh1b rotate together (fold 1),
    // fh2 rotates alone (fold 2). view.tzf = [tz1, tz2] for each pair.
    const [a1, a2] = view.f;
    const tzf = view.tzf || [0, 0];
    const fh1a = $("fh1a"), fh1b = $("fh1b"), fh2 = $("fh2");
    const pw = fh2 ? parseInt(fh2.style.width) || 0 : 0;
    const tz1 = tzf[0] ? `translateZ(${(tzf[0]*pw).toFixed(1)}px) ` : "";
    const tz2 = tzf[1] ? `translateZ(${(tzf[1]*pw).toFixed(1)}px) ` : "";
    if (fh1a) fh1a.style.transform = `${tz1}rotateY(${a1*s}deg)`;
    if (fh1b) fh1b.style.transform = `${tz1}rotateY(${a1*s}deg)`;
    if (fh2)  fh2.style.transform  = `${tz2}rotateY(${a2*s}deg)`;
  } else {
    // Nested mode (accordion, half, roll)
    const tzf = view.tzf;
    view.f.forEach((a, i) => {
      const h = $("fh" + (i + 1)); if (!h) return;
      let tz = "";
      if (tzf && tzf[i]) { const pw = parseInt(h.style.width) || 0; tz = `translateZ(${(tzf[i]*pw).toFixed(1)}px) `; }
      h.style.transform = `${tz}rotateY(${a*s}deg)`;
    });
  }
}

// React component that renders the 3D fold scene
function FoldRenderer({ foldKey, frontSrc, backSrc, frontDims, backDims, longEdge, shortEdge, viewIdx, foldDir, flipped, frontGray, backGray, crossFold }) {
  const sceneRef = useRef(null);
  const fold = FOLDS_3D[foldKey];

  const mob = useIsMobile();
  const isP = false; // landscape
  const maxDim = mob ? 260 : 400;
  const nPanels = fold ? (fold.mode === "gate3" ? 4 : fold.n) : 1;
  const pa = (longEdge / nPanels) / shortEdge;
  const pw = Math.round(Math.min(maxDim / nPanels, (mob ? window.innerWidth - 80 : 700) / nPanels));
  const ph = Math.round(pw / pa);
  const iW = pw * nPanels;
  const iH = ph;
  const qw = fold && fold.mode === "gate3" ? iW / 4 : pw;

  // Compute rendered image sizes — map art inches to trim pixels (1:1 physical scale)
  const scale = iW / longEdge;
  const fRW = frontDims ? frontDims.w * scale : null;
  const fRH = frontDims ? frontDims.h * scale : null;
  const bRW = backDims ? backDims.w * scale : null;
  const bRH = backDims ? backDims.h * scale : null;

  // Build scene HTML
  useEffect(() => {
    if (!sceneRef.current || !fold) return;
    const fSrc = frontSrc || null, bSrc = backSrc || null;
    let html = "";
    // Per-fold swap: swap=true means ff=back, fb=front (so the FOLDED outside
    // shows front art = "outside" = cover layout). Used for fold types where
    // the physical fold brings fronts together.
    const swap = !!fold.swap;
    if (fold.mode === "nested") {
      html = foldBuildNest(0, fold.n, pw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH, swap);
    }
    else if (fold.mode === "dparallel") html = foldBuildDParallel(pw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH, swap);
    else if (fold.mode === "trifold") html = foldBuildTri(pw, ph, iW, iH, isP, fold.n, fSrc, bSrc, fRW, fRH, bRW, bRH);
    else if (fold.mode === "gate3") html = foldBuildGate(qw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH);
    else if (fold.mode === "dgate") html = foldBuildDGate(pw, ph, iW, iH, isP, fold.n, fSrc, bSrc, fRW, fRH, bRW, bRH);
    sceneRef.current.innerHTML = html;
    // Apply greyscale filters — ff and fb may be swapped per fold
    var ffGray = swap ? backGray : frontGray;
    var fbGray = swap ? frontGray : backGray;
    sceneRef.current.querySelectorAll(".ff img").forEach(function(img) { img.style.filter = ffGray ? "grayscale(1)" : "none"; });
    sceneRef.current.querySelectorAll(".fb img").forEach(function(img) { img.style.filter = fbGray ? "grayscale(1)" : "none"; });
    setTimeout(() => { if (sceneRef.current) foldApplyView(sceneRef.current, foldKey, viewIdx || 0, flipped ? -1 : 1); }, 50);
  }, [frontSrc, backSrc, foldKey, pw, ph, flipped, frontGray, backGray, fRW, fRH, bRW, bRH]);

  // Apply view changes
  useEffect(() => {
    if (!sceneRef.current || !fold) return;
    foldApplyView(sceneRef.current, foldKey, viewIdx || 0, flipped ? -1 : 1);
  }, [viewIdx, foldDir, flipped]);

  if (!fold) return <div style={{ padding: 40, textAlign: "center", color: "rgba(255,255,255,.58)" }}>Flat — no fold preview</div>;

  return (
    <div className="fold-viewport" style={{ minHeight: mob ? 220 : 350, position: "relative" }}>
      <div ref={sceneRef} className="fold-scene"
        style={{ transformStyle: "preserve-3d", position: "relative", width: iW, height: iH }} />
      {crossFold && (
        <div style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 5 }}>
          {/* horizontal cross-fold crease */}
          <div style={{ position: "absolute", left: "8%", right: "8%", top: "50%", transform: "translateY(-50%)", borderTop: "2px dashed #f5a623" }} />
          {/* mid-line caption */}
          <span style={{ position: "absolute", left: "50%", top: "50%", transform: "translate(-50%,-50%)", fontSize: 10, fontWeight: 700, color: "#f5a623", background: "rgba(0,0,0,.55)", padding: "2px 7px", borderRadius: 3, whiteSpace: "nowrap" }}>↕ Cross fold → 8.5×5.5</span>
          {/* half labels */}
          <span style={{ position: "absolute", left: "50%", top: "calc(50% - 22px)", transform: "translate(-50%,-100%)", fontSize: 10, fontWeight: 700, color: "#f5a623", whiteSpace: "nowrap" }}>Final Folded Back</span>
          <span style={{ position: "absolute", left: "50%", top: "calc(50% + 22px)", transform: "translateX(-50%)", fontSize: 10, fontWeight: 700, color: "#f5a623", whiteSpace: "nowrap" }}>Final Folded Front</span>
        </div>
      )}
    </div>
  );
}


// Sidebar brochure preview — flat sheet mockup with subtle perspective tilt.
// Designed to mirror saddle stitch's SidebarBookPreview visual language: 190px viewport,
// CMYK eyebrow, OPEN chip, size/qty caption.
// ── Flat dimensioned "spec" drawing shown in the preview card before artwork is
//    uploaded. Charts width × height with dimension lines; for booklets, marks the
//    bind (spine) edge. Swapped for the 3D render as soon as art is added.
function DimSpec({ wIn, hIn, bindEdge, bindLabel }) {
  const VW = 320, VH = 190;
  const padL = 20, padT = 20, padR = 46, padB = 34;
  const availW = VW - padL - padR, availH = VH - padT - padB;
  const w = Math.max(0.1, Number(wIn) || 1), h = Math.max(0.1, Number(hIn) || 1);
  const scale = Math.min(availW / w, availH / h);
  const sw = w * scale, sh = h * scale;
  const x0 = padL + (availW - sw) / 2, y0 = padT + (availH - sh) / 2;
  const L = "#6fb2ff", T = "#eef4fb";
  const fmt = n => (Math.round((Number(n) || 0) * 100) / 100).toString();
  const dimYB = y0 + sh + 15, dimXR = x0 + sw + 16;
  const be = Number(bindEdge) || 0;
  const spineV = be > 0 && Math.abs(be - h) <= Math.abs(be - w);
  const spineH = be > 0 && !spineV;
  const ah = (x, y, d) =>
    d === "l" ? `M${x+5},${y-3} L${x},${y} L${x+5},${y+3}` :
    d === "r" ? `M${x-5},${y-3} L${x},${y} L${x-5},${y+3}` :
    d === "u" ? `M${x-3},${y+5} L${x},${y} L${x+3},${y+5}` :
                `M${x-3},${y-5} L${x},${y} L${x+3},${y-5}`;
  return (
    <svg width="100%" height="100%" viewBox={`0 0 ${VW} ${VH}`} preserveAspectRatio="xMidYMid meet" style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      <rect x={x0} y={y0} width={sw} height={sh} fill="#f4efe2" stroke="#cfd8e3" strokeWidth="1" rx="1.5" />
      <rect x={x0+6} y={y0+6} width={Math.max(0, sw-12)} height={Math.max(0, sh-12)} fill="none" stroke="rgba(20,28,40,.14)" strokeWidth="0.75" strokeDasharray="3 3" />
      {spineV && <g>
        <line x1={x0} y1={y0} x2={x0} y2={y0+sh} stroke="#6b7890" strokeWidth="3" />
        <text x={x0+10} y={y0+sh/2} fill="#8492a8" fontFamily="Segoe UI, sans-serif" fontSize="7.5" fontWeight="800" letterSpacing="2" textAnchor="middle" transform={`rotate(-90 ${x0+10} ${y0+sh/2})`}>SPINE</text>
      </g>}
      {spineH && <g>
        <line x1={x0} y1={y0} x2={x0+sw} y2={y0} stroke="#6b7890" strokeWidth="3" />
        <text x={x0+sw/2} y={y0+12} fill="#8492a8" fontFamily="Segoe UI, sans-serif" fontSize="7.5" fontWeight="800" letterSpacing="2" textAnchor="middle">SPINE</text>
      </g>}
      <line x1={x0} y1={y0+sh+3} x2={x0} y2={dimYB+3} stroke={L} strokeWidth="0.6" opacity="0.5" />
      <line x1={x0+sw} y1={y0+sh+3} x2={x0+sw} y2={dimYB+3} stroke={L} strokeWidth="0.6" opacity="0.5" />
      <line x1={x0} y1={dimYB} x2={x0+sw} y2={dimYB} stroke={L} strokeWidth="1.2" />
      <path d={ah(x0,dimYB,"l")} fill="none" stroke={L} strokeWidth="1.2" />
      <path d={ah(x0+sw,dimYB,"r")} fill="none" stroke={L} strokeWidth="1.2" />
      <text x={x0+sw/2} y={dimYB+13} fill={T} fontFamily="Segoe UI, sans-serif" fontSize="11" fontWeight="700" textAnchor="middle">{fmt(w)}″</text>
      <line x1={x0+sw+3} y1={y0} x2={dimXR+3} y2={y0} stroke={L} strokeWidth="0.6" opacity="0.5" />
      <line x1={x0+sw+3} y1={y0+sh} x2={dimXR+3} y2={y0+sh} stroke={L} strokeWidth="0.6" opacity="0.5" />
      <line x1={dimXR} y1={y0} x2={dimXR} y2={y0+sh} stroke={L} strokeWidth="1.2" />
      <path d={ah(dimXR,y0,"u")} fill="none" stroke={L} strokeWidth="1.2" />
      <path d={ah(dimXR,y0+sh,"d")} fill="none" stroke={L} strokeWidth="1.2" />
      <text x={dimXR+5} y={y0+sh/2+4} fill={T} fontFamily="Segoe UI, sans-serif" fontSize="11" fontWeight="700" textAnchor="start">{fmt(h)}″</text>
    </svg>
  );
}

function SidebarBrochurePreview({ longEdge, shortEdge, quantity, panels, foldType, frontArt, frontColor, sides, onOpenPreview }){
  const wIn = Number(longEdge) || 11;
  const hIn = Number(shortEdge) || 8.5;
  const maxDim = 150, longSide = Math.max(wIn, hIn), px = maxDim / longSide;
  const sheetW = wIn * px, sheetH = hIn * px;
  const inkColor = frontColor === "bw" ? "#2b2b2b" : CK.cyan;
  const placeholder = useMemo(() => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
<rect width="600" height="400" fill="#f7f3e8"/>
<rect x="40" y="50" width="120" height="4" fill="${inkColor}"/>
<text x="40" y="120" font-family="Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="-1">YOUR</text>
<text x="40" y="160" font-family="Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="-1">BROCHURE</text>
<g transform="translate(40,330)">
<circle cx="0" cy="0" r="6" fill="${CK.cyan}"/>
<circle cx="18" cy="0" r="6" fill="${CK.magenta}"/>
<circle cx="36" cy="0" r="6" fill="${CK.yellow}"/>
<circle cx="54" cy="0" r="6" fill="${CK.key}"/>
</g>
<text x="40" y="370" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#555" letter-spacing="2">PRIORITY PRINT</text>
</svg>`;
    return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
  }, [inkColor]);
  const hasArt = !!frontArt?.dataUrl;
  const imgSrc = frontArt?.dataUrl || placeholder;
  const grayFilter = frontColor === "bw" ? "grayscale(1)" : "none";
  const clickable = hasArt && typeof onOpenPreview === "function";
  return (
    <div style={{ borderRadius: 6, border: `1px solid ${CC.border}`, overflow: "hidden", background: CC.white, pointerEvents: "auto" }}>
      <div className="fold-viewport"
        role={clickable ? "button" : undefined} tabIndex={clickable ? 0 : undefined}
        onClick={clickable ? onOpenPreview : undefined}
        onKeyDown={clickable ? (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpenPreview(); } } : undefined}
        title={clickable ? "Open full preview" : undefined}
        style={{ height: 190, borderRadius: 0, border: "none", cursor: clickable ? "zoom-in" : "default", perspective: 1200 }}>
        {/* drop shadow — only under the 3D render */}
        {hasArt && <div style={{ position: "absolute", bottom: 22, width: "60%", height: 12, background: "radial-gradient(ellipse, rgba(0,0,0,.5), transparent 70%)", filter: "blur(6px)", pointerEvents: "none" }} />}
        {hasArt ? (
          /* Tilted sheet — gives it dimension without a full FoldRenderer */
          <div style={{ width: sheetW, height: sheetH, transform: "rotateX(-8deg) rotateY(22deg)", transformStyle: "preserve-3d", boxShadow: "0 12px 28px rgba(0,0,0,.4)", borderRadius: 2, overflow: "hidden", background: "#f7f3e8" }}>
            <img src={imgSrc} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", filter: grayFilter }} />
          </div>
        ) : (
          /* Flat dimensioned spec before upload */
          <DimSpec wIn={wIn} hIn={hIn} />
        )}
        {/* Top-left eyebrow */}
        <div style={{ position: "absolute", top: 10, left: 14, display: "flex", alignItems: "center", gap: 6, fontSize: 9, fontWeight: 700, color: "rgba(255,255,255,.65)", letterSpacing: ".12em", pointerEvents: "none" }}>
          <span>{hasArt ? "YOUR ARTWORK · LIVE" : "SIZE SPEC · LIVE"}</span>
        </div>
        {clickable && <div style={{ position: "absolute", top: 10, right: 12, fontSize: 9, fontWeight: 700, letterSpacing: ".1em", color: "rgba(255,255,255,.75)", background: "rgba(255,255,255,.08)", border: "1px solid rgba(255,255,255,.18)", padding: "3px 7px", borderRadius: 4, pointerEvents: "none" }}>OPEN ⤢</div>}
        {/* Bottom caption */}
        <div style={{ position: "absolute", bottom: 10, left: 14, right: 14, display: "flex", justifyContent: "space-between", fontSize: 9.5, fontWeight: 600, color: "rgba(255,255,255,.6)", textTransform: "uppercase", letterSpacing: ".08em", pointerEvents: "none" }}>
          <span>{wIn}×{hIn}″</span>
          <span>{panels}-panel · {(quantity || 0).toLocaleString()} qty</span>
        </div>
      </div>
    </div>
  );
}

function MobilePreviewBar(props){
  const {longEdge,shortEdge,quantity,panels,frontArt,onOpenPreview}=props;
  const hostRef = useRef(null);
  const [collapsed, setCollapsed] = useState(false);
  useEffect(() => {
    const el = hostRef.current;
    if (!el || typeof IntersectionObserver === "undefined") return;
    const obs = new IntersectionObserver(([entry]) => {
      setCollapsed(!entry.isIntersecting && entry.boundingClientRect.top < 0);
    }, { threshold: 0, rootMargin: "0px 0px 0px 0px" });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  const wIn = Number(longEdge) || 11, hIn = Number(shortEdge) || 8.5;
  const hasArt = !!frontArt?.dataUrl;
  const clickable = hasArt && typeof onOpenPreview === "function";
  return (
    <>
      <div ref={hostRef} style={{ margin: "6px 10px 10px" }}>
        <SidebarBrochurePreview {...props} />
      </div>
      <div role={clickable ? "button" : undefined} tabIndex={clickable ? 0 : undefined}
        onClick={clickable ? onOpenPreview : undefined}
        onKeyDown={clickable ? (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpenPreview(); } } : undefined}
        style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 45, transform: collapsed ? "translateY(0)" : "translateY(-110%)", transition: "transform .22s ease-out", background: "linear-gradient(135deg,#1a1d23,#2a2e36)", borderBottom: "1px solid rgba(255,255,255,.08)", boxShadow: "0 6px 18px rgba(0,0,0,.25)", padding: "7px 12px", display: "flex", alignItems: "center", gap: 10, cursor: clickable ? "pointer" : "default", color: "#fff" }}>
        <div style={{ width: 32, height: Math.max(24, Math.min(48, (32 * hIn) / wIn)), borderRadius: 3, overflow: "hidden", flexShrink: 0, background: "#2a2e36", boxShadow: "0 0 0 1px rgba(255,255,255,.12)" }}>
          {hasArt
            ? <img src={frontArt.dataUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
            : <div style={{ width: "100%", height: "100%", background: "linear-gradient(135deg,#e0edff,#f7f3e8)" }} />}
        </div>
        <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: 1 }}>
          <div style={{ fontSize: 8, fontWeight: 700, letterSpacing: ".12em", opacity: .6, textTransform: "uppercase" }}>{hasArt ? "Your Artwork" : "3D Preview"}</div>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: ".01em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{wIn}×{hIn}″ · {panels}-panel · {(quantity || 0).toLocaleString()} qty</div>
        </div>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// SHEET PREVIEW — Upload + Proof for single-sheet products (brochures, flat printing)
// ═══════════════════════════════════════════════════════════════

function SheetPreview({ longEdge, shortEdge, foldType, foldDir, panels, perfCount, perfDir, perfPositions, onPerfPositions, frontColor, backColor, sides, onSizeOverride, onFoldChange, onFoldDirChange, sizeMode, onArtwork, onCoverArt, openPreviewModalRef, debug, paperIsCardstock, staffUnlocked }) {
  const mob = useIsMobile();
  const hasIO = panels > 1 && foldType !== "z3";
  const fLabel = hasIO ? "Front / Outside" : "Front";
  const bLabel = hasIO ? "Back / Inside" : "Back";
  const [frontArt, setFrontArt] = useState(null); // {dataUrl, file, dims:{w,h}}
  const [backArt, setBackArt] = useState(null);
  useEffect(() => { if (sides === 1) { setBackArt(null); setSide("front"); } }, [sides]);
  // Push frontArt up to the parent so the sidebar preview can mirror it
  useEffect(() => { if (onCoverArt) onCoverArt(frontArt); }, [frontArt, onCoverArt]);
  // Expose imperative open-preview hook for the sidebar preview card
  useEffect(() => {
    if (!openPreviewModalRef) return;
    openPreviewModalRef.current = frontArt ? () => setPreviewOpen(true) : null;
    return () => { if (openPreviewModalRef) openPreviewModalRef.current = null; };
  }, [frontArt, openPreviewModalRef]);
  const [side, setSide] = useState("front"); // "front" | "back"
  const [foldFlipped, setFoldFlipped] = useState(false);
  const canFlip = panels > 1 && !["gate3","dgate4"].includes(foldType);
  // Reset flip when fold type changes
  const prevFoldType = useRef(foldType);
  if (prevFoldType.current !== foldType) { prevFoldType.current = foldType; if (foldFlipped) setFoldFlipped(false); }
  const [proofOpen, setProofOpen] = useState(false);
  const [previewOpen, setPreviewOpen] = useState(false);
  // Lock background page scroll while a modal (proof or 3D preview) is open.
  useEffect(() => {
    if (!proofOpen && !previewOpen) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [proofOpen, previewOpen]);
  const [previewAngle, setPreviewAngle] = useState(0);
  const [approved, setApproved] = useState(false);
  const [dropHover, setDropHover] = useState(false);
  const [loading, setLoading] = useState(false);
  const [fileName, setFileName] = useState("");
  // Per-side transforms — front/back each get their own fit/scale/rotate.
  // Proof modal edits getTx(side) via compat aliases below.
  const [pageTransforms, setPageTransforms] = useState({});
  const [draggingPerf, setDraggingPerf] = useState(null);
  const [editingPerf, setEditingPerf] = useState(null); // index of perf being edited via text input
  const [editPerfVal, setEditPerfVal] = useState("");
  const proofContainerRef = useRef(null);
  const fileRef = useRef(null);
  const frontInputRef = useRef(null);
  const backInputRef = useRef(null);
  const rawFileRef = useRef(null);
  const [approvalPkg, setApprovalPkg] = useState(null);
  const [generatingPdf, setGeneratingPdf] = useState(false);
  const [genProgress, setGenProgress] = useState(null);
  const [showMagnifier, setShowMagnifier] = useState(false);
  const [magPos, setMagPos] = useState(null);
  const [showGuides, setShowGuides] = useState(true); // toggle bleed/trim/safety/fold/perf overlays in proof
  const [hiResProof, setHiResProof] = useState(null);

  // Per-side transform helpers
  const DEFAULT_TX = { fitMode: "crop", artScale: 100, rotateSteps: 0, posX: 50, posY: 50 };

  // Where the art sits inside the sheet when it is bigger (or smaller) than the
  // trim. Percentages, read exactly as CSS object-position does: 50 is centered,
  // 0 is flush left/top, 100 is flush right/bottom. The proof preview sets
  // objectPosition from the same two numbers and the canvas renderers call this,
  // so what the customer frames is what the press gets — the two cannot drift.
  const artPos = (avail, drawn, pct) => {
    const n = Number(pct);
    const p = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 50;
    return (avail - drawn) * (p / 100);
  };
  const getTx = (idx) => pageTransforms[idx] || DEFAULT_TX;
  const [txHistory, setTxHistory] = useState([]);
  const pushTxHistory = (idx) => {
    const snap = { ...getTx(idx) };
    setTxHistory(h => {
      const next = [...h, { idx, prev: snap }];
      if (next.length > 30) next.shift();
      return next;
    });
  };
  const [vpScale, setVpScale] = useState(1);
  const [vpX, setVpX] = useState(0);
  const [vpY, setVpY] = useState(0);
  const [vpDragging, setVpDragging] = useState(false);
  const vpDragStart = useRef(null);
  const setTx = (idx, patch) => {
    setPageTransforms(p => {
      const cur = p[idx] || DEFAULT_TX;
      const resolved = {};
      for (const k in patch) resolved[k] = typeof patch[k] === "function" ? patch[k](cur[k]) : patch[k];
      return { ...p, [idx]: { ...cur, ...resolved } };
    });
  };
  const txHash = useMemo(() => JSON.stringify(pageTransforms), [pageTransforms]);

  // Compat aliases: proof-modal code reads/writes the CURRENT side's transform
  const currentTx = getTx(side);
  const fitMode = currentTx.fitMode;
  const artScale = currentTx.artScale;
  const rotateSteps = currentTx.rotateSteps;
  // ?? 50 rather than a plain default: a transform restored from a reorder or an
  // older saved config predates these fields and must still land dead centre.
  const posX = currentTx.posX ?? 50;
  const posY = currentTx.posY ?? 50;
  const setFitMode = (v) => { pushTxHistory(side); setTx(side, { fitMode: v }); };
  const setArtScale = (v) => { pushTxHistory(side); setTx(side, { artScale: v }); };
  const setRotateSteps = (v) => { pushTxHistory(side); setTx(side, { rotateSteps: v }); };
  // Drag streams dozens of updates a second; pushing each onto the undo stack
  // would make Undo useless. History is pushed once, on pointer-down.
  const setArtPosRaw = (x, y) => setTx(side, {
    posX: Math.max(0, Math.min(100, x)),
    posY: Math.max(0, Math.min(100, y)),
  });
  const artDrag = useRef(null);
  const setArtPos = (x, y) => { pushTxHistory(side); setTx(side, {
    posX: Math.max(0, Math.min(100, x)),
    posY: Math.max(0, Math.min(100, y)),
  }); };
  const undoTx = () => {
    setTxHistory(h => {
      if (!h.length) return h;
      const last = h[h.length - 1];
      setPageTransforms(p => ({ ...p, [last.idx]: last.prev }));
      if (last.idx !== side && typeof setSide === "function") {
        // side is a state setter in brochure
        try { setSide(last.idx); } catch (_) {}
      }
      return h.slice(0, -1);
    });
  };

  useEffect(() => { setVpScale(1); setVpX(0); setVpY(0); }, [side, proofOpen]);

  // Viewport zoom/pan helpers
  const VP_MIN = 0.10, VP_FIT = 1, VP_MAX = 5, VP_STEP = 0.25;
  const vpZoomBy = (delta) => setVpScale(s => {
    const next = Math.max(VP_MIN, Math.min(VP_MAX, Math.round((s + delta) * 100) / 100));
    if (next <= VP_FIT) { setVpX(0); setVpY(0); }
    return next;
  });
  const vpReset = () => { setVpScale(VP_FIT); setVpX(0); setVpY(0); };
  const vpOnWheel = (e) => {
    e.preventDefault();
    const r = e.currentTarget.getBoundingClientRect();
    const cx = (e.clientX - r.left) - r.width / 2;
    const cy = (e.clientY - r.top) - r.height / 2;
    setVpScale(prev => {
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const next = Math.max(VP_MIN, Math.min(VP_MAX, prev * factor));
      const ratio = next / prev;
      setVpX(x => next <= VP_FIT ? 0 : (x - cx) * ratio + cx);
      setVpY(y => next <= VP_FIT ? 0 : (y - cy) * ratio + cy);
      return next;
    });
  };
  const vpOnMouseDown = (e) => {
    if (vpScale <= VP_FIT || showMagnifier) return;
    vpDragStart.current = { x: e.clientX, y: e.clientY, vpX, vpY };
    setVpDragging(true);
  };
  const vpOnMouseMove = (e) => {
    if (!vpDragging || !vpDragStart.current) return;
    setVpX(vpDragStart.current.vpX + (e.clientX - vpDragStart.current.x));
    setVpY(vpDragStart.current.vpY + (e.clientY - vpDragStart.current.y));
  };
  const vpOnMouseUp = () => { setVpDragging(false); vpDragStart.current = null; };

  // Clear approval when ANY side's transform changes
  const prevTxHash = useRef(txHash);
  useEffect(() => {
    if (prevTxHash.current !== txHash) {
      if (approved) { setApproved(false); setApprovalPkg(null); }
      prevTxHash.current = txHash;
    }
  }, [txHash]);

  // Rotate a dataUrl image by N steps of 90° clockwise
  function rotateImageBySteps(dataUrl, steps) {
    if (steps <= 0) return Promise.resolve(dataUrl);
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const s = ((steps % 4) + 4) % 4;
        const swap = s % 2 === 1;
        const c = document.createElement("canvas");
        c.width = swap ? img.naturalHeight : img.naturalWidth;
        c.height = swap ? img.naturalWidth : img.naturalHeight;
        const ctx = c.getContext("2d");
        ctx.translate(c.width / 2, c.height / 2);
        ctx.rotate((s * Math.PI) / 2);
        ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  // Effective art dimensions after rotation
  const currentArtRaw = side === "front" ? frontArt : backArt;
  const effectiveDims = useMemo(() => {
    if (!currentArtRaw?.dims) return null;
    const d = currentArtRaw.dims;
    if (rotateSteps % 2 === 1) return { w: d.h, h: d.w };
    return d;
  }, [currentArtRaw, rotateSteps]);

  // Rotated art dataUrl
  const [rotatedUrl, setRotatedUrl] = useState(null);
  useEffect(() => {
    if (!currentArtRaw?.dataUrl) { setRotatedUrl(null); return; }
    if (rotateSteps === 0) { setRotatedUrl(currentArtRaw.dataUrl); return; }
    let canceled = false;
    rotateImageBySteps(currentArtRaw.dataUrl, rotateSteps).then(url => { if (!canceled) setRotatedUrl(url); });
    return () => { canceled = true; };
  }, [currentArtRaw?.dataUrl, rotateSteps]);

  // Trimmed front/back for 3D fold preview — per-side transforms applied, bleed cropped.
  // Fold preview shows FINISHED look; proof modal keeps the full bleed view with guides.
  const [trimmedFrontUrl, setTrimmedFrontUrl] = useState(null);
  const [trimmedBackUrl, setTrimmedBackUrl] = useState(null);
  useEffect(() => {
    let canceled = false;
    async function renderTrimmed(art, tx) {
      if (!art?.dataUrl) return null;
      const BLEED = 0.125;
      const bleedW = longEdge + BLEED * 2;
      const bleedH = shortEdge + BLEED * 2;
      const DPI = 200;
      const canvasW = Math.round(bleedW * DPI);
      const canvasH = Math.round(bleedH * DPI);
      const trimPxX = Math.round(BLEED * DPI);
      const trimPxY = Math.round(BLEED * DPI);
      const outW = canvasW - trimPxX * 2;
      const outH = canvasH - trimPxY * 2;

      // Source is already-uploaded art (no pdf re-render needed); apply rotation first
      const srcUrl = tx.rotateSteps > 0 ? await rotateImageBySteps(art.dataUrl, tx.rotateSteps) : art.dataUrl;
      const img = await new Promise(res => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => res(null);
        im.src = srcUrl;
      });
      if (!img) return null;

      const d = art.dims;
      const ed = (tx.rotateSteps % 2 === 1) ? { wIn: d.h, hIn: d.w } : { wIn: d.w, hIn: d.h };

      const c = document.createElement("canvas");
      c.width = canvasW; c.height = canvasH;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvasW, canvasH);
      const srcW = img.naturalWidth, srcH = img.naturalHeight;
      if (tx.fitMode === "stretch") {
        ctx.drawImage(img, 0, 0, canvasW, canvasH);
      } else if (tx.fitMode === "crop" || tx.fitMode === "scale") {
        const mult = tx.fitMode === "scale" ? tx.artScale / 100 : 1;
        const nativeW = (ed && ed.wIn > 0 ? ed.wIn / bleedW : 1) * mult;
        const nativeH = (ed && ed.hIn > 0 ? ed.hIn / bleedH : 1) * mult;
        const drawW = canvasW * nativeW, drawH = canvasH * nativeH;
        ctx.drawImage(img, artPos(canvasW, drawW, tx.posX), artPos(canvasH, drawH, tx.posY), drawW, drawH);
      } else if (tx.fitMode === "cover") {
        const sc = Math.max(canvasW / srcW, canvasH / srcH);
        ctx.drawImage(img, artPos(canvasW, srcW * sc, tx.posX), artPos(canvasH, srcH * sc, tx.posY), srcW * sc, srcH * sc);
      } else {
        const sc = Math.min(canvasW / srcW, canvasH / srcH);
        ctx.drawImage(img, artPos(canvasW, srcW * sc, tx.posX), artPos(canvasH, srcH * sc, tx.posY), srcW * sc, srcH * sc);
      }

      const tc = document.createElement("canvas");
      tc.width = outW; tc.height = outH;
      tc.getContext("2d").drawImage(c, trimPxX, trimPxY, outW, outH, 0, 0, outW, outH);
      return tc.toDataURL("image/jpeg", 0.85);
    }
    (async () => {
      const [f, b] = await Promise.all([
        renderTrimmed(frontArt, getTx("front")),
        renderTrimmed(backArt, getTx("back")),
      ]);
      if (canceled) return;
      setTrimmedFrontUrl(f);
      setTrimmedBackUrl(b);
    })();
    return () => { canceled = true; };
  }, [frontArt?.dataUrl, backArt?.dataUrl, longEdge, shortEdge, txHash]);

  // FitToggle component
  const FitToggle = () => (
    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
      <span style={{ fontSize: 10, fontWeight: 700, color: "rgba(255,255,255,.55)", letterSpacing: ".08em", textTransform: "uppercase", marginRight: 2 }}>Art:</span>
      <div style={{ display: "flex", borderRadius: 6, overflow: "hidden", border: "1px solid rgba(255,255,255,.12)" }}>
        {[{ v: "crop", l: "Crop" }, { v: "cover", l: "Fill" }, { v: "contain", l: "Fit" }, { v: "stretch", l: "Force Fill" }, { v: "scale", l: "Scale" }].map(o => (
          <button type="button" key={o.v} onClick={() => { setFitMode(o.v); if (o.v === "scale") setArtScale(100); }} title={o.v === "stretch" ? "Stretch art to fill the entire bleed area — distorts aspect ratio" : undefined} style={{
            padding: "6px 12px", fontSize: 10, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit",
            background: fitMode === o.v ? CK.cyan : "rgba(255,255,255,.06)",
            color: fitMode === o.v ? "#000" : "rgba(255,255,255,.5)",
          }}>{o.l}</button>
        ))}
        <button type="button" onClick={() => setRotateSteps(s => (s + 1) % 4)} style={{
          padding: "6px 12px", fontSize: 10, fontWeight: 600, border: "none", borderLeft: "1px solid rgba(255,255,255,.08)", cursor: "pointer", fontFamily: "inherit",
          background: rotateSteps > 0 ? CK.cyan : "rgba(255,255,255,.06)",
          color: rotateSteps > 0 ? "#000" : "rgba(255,255,255,.5)",
        }}>Rotate 90°{rotateSteps > 0 ? ` (${rotateSteps * 90}°)` : ""}</button>
        <button type="button" onClick={undoTx} disabled={txHistory.length === 0} title={txHistory.length ? `Undo last art change (${txHistory.length} step${txHistory.length === 1 ? "" : "s"} available)` : "No changes to undo"} style={{
          padding: "6px 12px", fontSize: 10, fontWeight: 600, border: "none", borderLeft: "1px solid rgba(255,255,255,.08)", cursor: txHistory.length ? "pointer" : "default", fontFamily: "inherit",
          background: "rgba(255,255,255,.06)",
          color: txHistory.length ? "rgba(255,255,255,.6)" : "rgba(255,255,255,.42)",
        }}>↶ Undo</button>
      </div>
      {(fitMode === "crop" || fitMode === "scale") && (
        (posX !== 50 || posY !== 50)
          ? <button type="button" onClick={() => setArtPos(50, 50)} style={{
              padding: "6px 10px", fontSize: 10, fontWeight: 600, borderRadius: 6, cursor: "pointer",
              fontFamily: "inherit", border: "1px solid rgba(255,255,255,.25)",
              background: "rgba(255,255,255,.10)", color: "rgba(255,255,255,.75)",
            }}>⌖ Re-center</button>
          : <span style={{ fontSize: 10, color: "rgba(255,255,255,.45)", fontStyle: "italic" }}>
              drag the artwork to reframe it
            </span>
      )}
      {fitMode === "scale" && (
        <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
          <div style={{ display: "flex", borderRadius: 6, overflow: "hidden", border: "1px solid rgba(255,255,255,.12)" }}>
            <button type="button" onClick={() => setArtScale(s => Math.max(10, s - 5))} style={{ padding: "6px 10px", fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: "rgba(255,255,255,.06)", color: "rgba(255,255,255,.5)" }}>−</button>
            <button type="button" onClick={() => setArtScale(s => Math.min(300, s + 5))} style={{ padding: "6px 10px", fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: "rgba(255,255,255,.06)", color: "rgba(255,255,255,.5)" }}>+</button>
          </div>
          <span style={{ fontSize: 10, fontWeight: 600, color: "rgba(255,255,255,.58)", minWidth: 32, textAlign: "center" }}>{artScale}%</span>
        </div>
      )}
    </div>
  );

  const BLEED = 0.125;
  const bleedW = longEdge + BLEED * 2;
  const bleedH = shortEdge + BLEED * 2;
  const bleedPctX = (BLEED / bleedW) * 100;
  const bleedPctY = (BLEED / bleedH) * 100;
  const safetyPctX = ((BLEED + 0.125) / bleedW) * 100;
  const safetyPctY = ((BLEED + 0.125) / bleedH) * 100;

  async function processFile(fileList) {
    const _big = Array.from(fileList || []).find(f => f && f.size > 209715200);
    if (_big) { alert('"' + _big.name + '" is ' + (_big.size/1048576).toFixed(0) + ' MB, over the 200 MB limit — please compress it or email your artwork.'); return; }
    if (!fileList || !fileList.length) return;
    const file = fileList[0];
    setLoading(true);
    setFileName(file.name);
    rawFileRef.current = file;

    try {
      if (file.type === "application/pdf") {
        const buf = await file.arrayBuffer();
        await window.__ppsPdfJs;
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        window.PPS_PDF_RISKS = {};
        // Runs before the page renders below, so those reuse the operator lists this builds.
        window.PPS_PDF_RISKS.doc = await window.ppsAnalyzePdfRisks(pdf);
        const renderPage = async (num) => {
          const pg = await pdf.getPage(num);
          const vp = pg.getViewport({ scale: 2 });
          const c = document.createElement("canvas");
          c.width = vp.width; c.height = vp.height;
          await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
          const [x0, y0, x1, y1] = pg.view;
          return { dataUrl: c.toDataURL("image/jpeg", 0.85), dims: { w: (x1 - x0) / 72, h: (y1 - y0) / 72 } };
        };
        const front = await renderPage(1);
        setFrontArt({ ...front, file });
        if (pdf.numPages >= 2) {
          const back = await renderPage(2);
          setBackArt({ ...back, file });
        }
      } else {
        const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
        if (!dataUrl) return;
        const dims = await new Promise((res) => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth / 300, h: img.naturalHeight / 300 }); img.onerror = () => res({ w: 0, h: 0 }); img.src = dataUrl; });
        setFrontArt({ dataUrl, file, dims });
      }
      setApproved(false);
      if (onArtwork) onArtwork({ type: "files", list: [file] });
    } catch (e) { console.error("File processing failed:", e); }
    setLoading(false);
  }

  // Swap which page is the outside. A 2-page PDF lands page 1 = front
  // (outside) by default — right for most exports, backwards for some. The
  // per-side transforms travel with their art or a front crop would land on
  // the back; approval resets because the proof changed; transform history is
  // cleared because its entries are keyed by side and Undo would cross over.
  function handleSwapSides() {
    if (!frontArt || !backArt) return;
    const f = frontArt, b = backArt;
    setFrontArt(b); setBackArt(f);
    setPageTransforms(p => ({ ...p, front: p.back || DEFAULT_TX, back: p.front || DEFAULT_TX }));
    setTxHistory([]);
    setApproved(false);
  }
  function handleClear() {
    setFrontArt(null); setBackArt(null); setFileName(""); setApproved(false);
    setPageTransforms({}); setTxHistory([]);
    rawFileRef.current = null;
    if (onArtwork) onArtwork({ type: "none" });
  }

  const hasArt = !!frontArt;
  const currentArt = side === "front" ? frontArt : backArt;

  // Fold line positions as percentages, with flap offset for nesting folds
  const foldLines = [];
  const foldDim = foldDir === "long" ? longEdge : shortEdge;
  const panelFracs = panels > 1 ? getFoldFracs(foldType, panels, foldDim) : [];
  if (panels > 1) {
    const foldingLong = foldDir === "long";
    for (const frac of panelFracs) {
      foldLines.push({ pct: frac * 100, vertical: foldingLong });
    }
  }

  // Standalone HTML preview — embeds the trimmed front + back face textures so the

</style></head><body><header><h1>Brochure Preview · ${sizeStr}</h1><div class="tagline">Priority Print Service · ${generated}</div></header>

<h1>Brochure Fold Preview</h1>
<div class="tagline">Priority Print Service · 3D Mockup</div>
<div class="meta"><strong>Fold:</strong> ${previewerKey} · <strong>Size:</strong> ${sizeStr} · <strong>Generated:</strong> ${generated}</div>
<div class="view-controls" id="viewControls"></div>
<div class="state-label" id="stateLabel"></div>
<div class="viewport" id="vp"><div class="scene" id="scene"></div><div class="drag-hint" id="dragHint">↔ Drag to rotate</div></div>
<div class="zoom-bar"><button class="zoom-btn" id="zo">−</button><input type="range" id="zoomSlider" min="20" max="250" value="100" step="5"><button class="zoom-btn" id="zi">+</button><span class="zoom-pct" id="zp">100%</span><button class="zoom-fit" id="zf">Fit</button></div>
<p class="info">Interactive 3D mockup · Use the view buttons to step through the fold</p>
<div class="credit">Generated by Priority Print Service</div>
<script>
const $=id=>document.getElementById(id);
const frontUrl="${front || ""}";
const backUrl="${back || front || ""}";
const detW=${detW},detH=${detH};
const foldDir="${dir}",ori="${ori}";
const fold=${foldJSON};
let cScale=1,userZoom=1,currentRX=0,currentRY=0;

function ds(){return foldDir==='left'?1:-1}
function es(){return cScale*userZoom}
function setZoom(z){userZoom=Math.max(0.2,Math.min(2.5,z));$('zoomSlider').value=Math.round(userZoom*100);$('zp').textContent=Math.round(userZoom*100)+'%';$('scene').style.transition='transform .4s ease';$('scene').style.transform=\`scale(\${es()}) rotateX(\${currentRX}deg) rotateY(\${currentRY}deg)\`}
$('zo').addEventListener('click',()=>setZoom(userZoom-0.1));
$('zi').addEventListener('click',()=>setZoom(userZoom+0.1));
$('zf').addEventListener('click',()=>setZoom(1));
$('zoomSlider').addEventListener('input',e=>setZoom(parseInt(e.target.value)/100));

function mkF(idx,n,pw,ph,iW,iH,isP,swap){
  const bi=n-1-idx;
  const fSrc=swap?backUrl:frontUrl,bSrc=swap?frontUrl:backUrl;
  let fml=0,fmt=0,bml=0,bmt=0;
  if(isP){fmt=-ph*idx;bmt=-ph*bi}else{fml=-pw*idx;bml=-pw*bi}
  return\`<div class="face f" style="width:\${pw}px;height:\${ph}px;"><img src="\${fSrc}" style="width:\${iW}px;height:\${iH}px;margin-left:\${fml}px;margin-top:\${fmt}px;"></div><div class="face b" style="width:\${pw}px;height:\${ph}px;"><img src="\${bSrc}" style="width:\${iW}px;height:\${iH}px;margin-left:\${bml}px;margin-top:\${bmt}px;"></div>\`;
}

function mkFGate(startQ,spanQ,qw,qh,iW,iH,isP,totalQ){
  const bStartQ=totalQ-startQ-spanQ;
  if(isP){
    const fmt=-qh*startQ,bmt=-qh*bStartQ;
    return\`<div class="face f" style="width:\${qw}px;height:\${qh*spanQ}px;"><img src="\${frontUrl}" style="width:\${iW}px;height:\${iH}px;margin-left:0;margin-top:\${fmt}px;"></div><div class="face b" style="width:\${qw}px;height:\${qh*spanQ}px;"><img src="\${backUrl}" style="width:\${iW}px;height:\${iH}px;margin-left:0;margin-top:\${bmt}px;"></div>\`;
  } else {
    const fml=-qw*startQ,bml=-qw*bStartQ;
    return\`<div class="face f" style="width:\${qw*spanQ}px;height:\${qh}px;"><img src="\${frontUrl}" style="width:\${iW}px;height:\${iH}px;margin-left:\${fml}px;margin-top:0;"></div><div class="face b" style="width:\${qw*spanQ}px;height:\${qh}px;"><img src="\${backUrl}" style="width:\${iW}px;height:\${iH}px;margin-left:\${bml}px;margin-top:0;"></div>\`;

}

function buildNest(idx,n,pw,ph,iW,iH,isP,swap){
  const last=idx===n-1;
  let h=\`<div class="panel-wrap" style="left:0;top:0;width:\${pw}px;height:\${ph}px;">\`;
  h+=mkF(idx,n,pw,ph,iW,iH,isP,!!swap);

    h+=\`<div class="hinge" id="hinge\${idx+1}" style="\${hp}width:\${pw}px;height:\${ph}px;transform-origin:\${og};">\`;
    h+=buildNest(idx+1,n,pw,ph,iW,iH,isP,swap);

function buildDParallel(scene,pw,ph,iW,iH,isP,swap){
  const mkP=(idx)=>\`<div class="panel-wrap" style="left:0;top:0;width:\${pw}px;height:\${ph}px;">\`+mkF(idx,4,pw,ph,iW,iH,isP,!!swap)+\`</div>\`;
  let h=mkP(0);
  h+=\`<div class="hinge" id="dpHinge2" style="left:\${pw}px;top:0;width:\${pw}px;height:\${ph}px;transform-origin:left center;">\`;
  h+=mkP(1);
  h+=\`<div class="hinge" id="dpHinge1a" style="left:\${pw}px;top:0;width:\${pw}px;height:\${ph}px;transform-origin:left center;">\`;
  h+=mkP(2);
  h+=\`</div></div>\`;
  h+=\`<div class="hinge" id="dpHinge1b" style="left:\${2*pw}px;top:0;width:\${pw}px;height:\${ph}px;transform-origin:left center;">\`;
  h+=\`<div class="panel-wrap" style="left:\${pw}px;top:0;width:\${pw}px;height:\${ph}px;">\`+mkF(3,4,pw,ph,iW,iH,isP,!!swap)+\`</div>\`;
  h+=\`</div>\`;
  scene.innerHTML=h;
}

function buildTriFold(scene,pw,ph,iW,iH,isP,n){
  let h='';
  if(isP){
    h+=\`<div class="panel-wrap" style="left:0;top:\${ph}px;width:\${pw}px;height:\${ph}px;">\`;
    h+=mkF(1,n,pw,ph,iW,iH,isP,true);
    h+=\`<div class="hinge" id="hingeL" style="left:0;top:\${-ph}px;width:\${pw}px;height:\${ph}px;transform-origin:center bottom;"><div class="panel-wrap" style="left:0;top:0;width:\${pw}px;height:\${ph}px;">\`;
    h+=mkF(0,n,pw,ph,iW,iH,isP,true);
    h+=\`</div></div>\`;
    h+=\`<div class="hinge" id="hingeR" style="left:0;top:\${ph}px;width:\${pw}px;height:\${ph}px;transform-origin:center top;"><div class="panel-wrap" style="left:0;top:0;width:\${pw}px;height:\${ph}px;">\`;
    h+=mkF(2,n,pw,ph,iW,iH,isP,true);
    h+=\`</div></div></div>\`;
  } else {
    h+=\`<div class="panel-wrap" style="left:\${pw}px;top:0;width:\${pw}px;height:\${ph}px;">\`;
    h+=mkF(1,n,pw,ph,iW,iH,isP,true);
    h+=\`<div class="hinge" id="hingeL" style="left:\${-pw}px;top:0;width:\${pw}px;height:\${ph}px;transform-origin:right center;"><div class="panel-wrap" style="left:0;top:0;width:\${pw}px;height:\${ph}px;">\`;
    h+=mkF(0,n,pw,ph,iW,iH,isP,true);
    h+=\`</div></div>\`;
    h+=\`<div class="hinge" id="hingeR" style="left:\${pw}px;top:0;width:\${pw}px;height:\${ph}px;transform-origin:left center;"><div class="panel-wrap" style="left:0;top:0;width:\${pw}px;height:\${ph}px;">\`;
    h+=mkF(2,n,pw,ph,iW,iH,isP,true);
    h+=\`</div></div></div>\`;
  }
  scene.innerHTML=h;
}

function buildGate3(scene,qw,qh,iW,iH,isP){
  let h='';
  if(isP){
    const cH=qh*2;
    h+=\`<div class="hinge" id="gateL" style="left:0;top:0;width:\${qw}px;height:\${qh}px;transform-origin:center bottom;">\`+mkFGate(0,1,qw,qh,iW,iH,isP,4)+\`</div>\`;
    h+=\`<div class="panel-wrap" style="left:0;top:\${qh}px;width:\${qw}px;height:\${cH}px;">\`+mkFGate(1,2,qw,qh,iW,iH,isP,4)+\`</div>\`;
    h+=\`<div class="hinge" id="gateR" style="left:0;top:\${qh+cH}px;width:\${qw}px;height:\${qh}px;transform-origin:center top;">\`+mkFGate(3,1,qw,qh,iW,iH,isP,4)+\`</div>\`;
  } else {
    const cW=qw*2;

  async function generateApprovalPackage() {
    const BLEED = 0.125;
    const SAFETY = 0.125;
    const bleedW = longEdge + BLEED * 2;
    const bleedH = shortEdge + BLEED * 2;
    const DPI = 300;
    const canvasW = Math.round(bleedW * DPI);

    }

    // Product-specific proof geometry — brochure: no spine, render fold lines instead
    const spineMode = "none";

    function drawGuides(ctx, w, h, pageIdx) {
      const trimX = (BLEED / bleedW) * w;

      ctx.setLineDash([6, 4]);

      ctx.strokeStyle = "#38a169";
      ctx.setLineDash([4, 4]);
