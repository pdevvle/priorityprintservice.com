/* pdf.js 4.x ships as ES modules only, so the classic-script global is gone. This
   loader dynamic-imports it at parse time -- the fetch is warm before anyone can pick a
   file -- and publishes it at window.pdfjsLib, the name every use site already resolves.
   Use sites await window.__ppsPdfJs first, so a slow network delays the first upload
   instead of breaking it.
   Why 4.x at all: 3.11.174 silently dropped an entire transparency group from a
   customer PDF -- the proof rendered without a block the press would print. 4.10.38 is
   pinned because it is the version verified against that file. The legacy build is
   deliberate: customers proof on phones whose Safari the modern build has dropped.
   Two mirrors, both exact npm layouts, full prefixes as literals so the offline test
   harness can string-replace them with vendored copies. */
(function () {
  var MIRRORS = [
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/",
    "https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/"
  ];
  function attempt(i) {
    if (i >= MIRRORS.length) return Promise.reject(new Error("pdf.js could not be loaded from any CDN"));
    return import(MIRRORS[i] + "pdf.min.mjs").then(function (m) {
      m.GlobalWorkerOptions.workerSrc = MIRRORS[i] + "pdf.worker.min.mjs";
      window.pdfjsLib = m;
      return m;
    }, function () { return attempt(i + 1); });
  }
  window.__ppsPdfJs = attempt(0);
  window.__ppsPdfJs.catch(function (e) { console.error("[pps]", e); });
})();

/* Preflight, not gatekeeping: names the constructs in an uploaded PDF that a browser
   preview is known to fumble -- pdf.js is a viewer, not a prepress RIP, and
   transparency is exactly where the two part company. Reads the operator lists the
   renderer builds anyway (they are cached and reused by the page renders that follow),
   so the scan costs almost nothing. Never throws: a preflight that can break an upload
   is worse than no preflight. Results accumulate in window.PPS_PDF_RISKS keyed by
   upload slot; the proof modal renders the union. */
window.PPS_PDF_RISKS = {};
window.ppsPdfRisks = function () {
  var o = window.PPS_PDF_RISKS, out = [], k, i, r;
  for (k in o) { r = o[k] || []; for (i = 0; i < r.length; i++) if (out.indexOf(r[i]) < 0) out.push(r[i]); }
  return out;
};
window.ppsAnalyzePdfRisks = async function (doc) {
  var risks = [];
  var add = function (x) { if (risks.indexOf(x) < 0) risks.push(x); };
  try {
    // Optional content (layers): pdf.js honours the file's saved visibility, so
    // a switched-off layer is invisible in every proof AND excluded from the
    // print-ready render -- consistent, but the customer may not know the
    // content exists at all (a stale Illustrator layer someone toggled off), and
    // any downstream engine that drops /OCProperties would print it. Surface it
    // so hiding the layer becomes a decision made while looking at the proof,
    // not a silent property of the file. Same never-throw posture as the rest.
    try {
      var occ = await doc.getOptionalContentConfig();
      var ogs = occ && occ.getGroups ? occ.getGroups() : null;
      if (ogs) {
        var offNames = [];
        for (var og in ogs) { if (ogs[og] && ogs[og].visible === false) offNames.push(String(ogs[og].name || og)); }
        if (offNames.length) add("hidden layers (switched off in the file \u2014 they will NOT print: " + offNames.slice(0, 3).join(", ") + (offNames.length > 3 ? ", \u2026" : "") + ")");
      }
    } catch (eoc) {}
    var OPS = window.pdfjsLib.OPS;
    var limit = Math.min(doc.numPages, 40);   // enough pages to decide; bounded on purpose
    for (var i = 1; i <= limit; i++) {
      var pg = await doc.getPage(i);
      var list = await pg.getOperatorList();
      for (var k = 0; k < list.fnArray.length; k++) {
        var f = list.fnArray[k], a = list.argsArray[k];
        if (f === OPS.beginGroup) add("transparency groups");
        else if (f === OPS.shadingFill) add("gradients");
        else if (f === OPS.setGState && a && Array.isArray(a[0])) {
          for (var e = 0; e < a[0].length; e++) {
            var ent = a[0][e]; if (!Array.isArray(ent)) continue;
            var key = ent[0], val = ent[1];
            if (key === "SMask" && val) add("soft masks");
            else if (key === "BM" && val && !/^(Normal|Compatible|source-over)$/i.test(String(val && val.name || val))) add("blend modes");
            else if ((key === "ca" || key === "CA") && val > 0 && val < 1) add("partial transparency");
          }
        } else if (f === OPS.setFont && a && typeof a[0] === "string") {
          try {
            var fnt = pg.commonObjs.get(a[0]);
            // The standard-14 faces are never embedded by design and substitute the
            // same way in every renderer; flagging them would banner every quick-tool
            // PDF and teach people to ignore the warning.
            if (fnt && fnt.missingFile && !/^(Helvetica|Times|Courier|Arial|Symbol|ZapfDingbats)/i.test(String(fnt.name || ""))) add("non-embedded fonts");
          } catch (e2) {}
        }
      }
      if (risks.length >= 4) break;
    }
  } catch (e3) {}
  return risks;
};

  dgate4:    { front: ["Left Flap","Left Center","Right Center","Right Flap"], back: ["Inside Left","Inside Left Center","Inside Right Center","Inside Right"] },

// Compute fold-line fractions accounting for flap offset (inner/tuck panels
// shortened by 1/32" so they nest cleanly). Z-folds and bifolds don't nest.
function getFoldFracs(foldType, panels, foldDim) {
  const NOMINAL = { gate3: [0.25, 0.50, 0.25] };
  const nomFracs = NOMINAL[foldType] || Array(panels).fill(1 / panels);
  const widths = nomFracs.map(f => f * foldDim);
  // Offset multipliers: negative = panel shortened, positive = panel widened; must sum to 0
  const OFF = 1 / 32;
  const OFFSETS = {
    trifold:    [-1, 0, 1],
    roll4:      [-2, -1, 0, 3],
    gate3:      [-1, 2, -1],
    dgate4:     [-1, 1, 1, -1],
    dparallel4: [-1, 1, 1, -1],
  };
  const off = OFFSETS[foldType];
  if (off) off.forEach((m, i) => { widths[i] += m * OFF; });
  const fracs = [];
  let cum = 0;
  for (let i = 0; i < panels - 1; i++) { cum += widths[i]; fracs.push(cum / foldDim); }
  return fracs;
}

    imp = calcBrochureImp(longE, shortE);
    if (imp <= 0) return { error: ["Size too large for press sheet"] };
  }

  // Two-sheet rule: a flat piece too big to image one-up on 13×19 (imp<1) runs on the
  // larger 13×27.5 press sheet — stocked only for select papers (non-stock pays the fee).
  let needsLargeSheet = false, pressSheet = "13x19";
  if (imp < 1) {
    needsLargeSheet = true;
    pressSheet = "13x27.5";
    // Oversized flats keep their sub-1 yield (e.g. 11×25.5 → 0.5) so size-related
    // costs scale up (~2× at imp 0.5). Only re-image on 13×27.5 when the piece
    // won't fit even 0.5-up on 13×19 (imp === 0), to keep pressSheets finite.
    if (imp === 0) imp = calcBrochureImp(longE, shortE, 27);
  }

  const qty = c.qty;
  if (qty < 1) return { error: ["Enter quantity"] };
  const fold = FOLD_TYPES.find(f => f.val === c.foldType) || FOLD_TYPES[0];
  const panels = fold.panels;
  const pressSheets = qty / imp;
  if (sheetsToDays(pressSheets) === null) return { error: ["This job exceeds our online ordering capacity. Please contact us for a custom quote."] };
  const paper = c.paper;
  const sides = c.sides;

  // Folded dimension validation
  if (panels > 1) {
    const foldDim = c.foldDir === "short" ? shortE : longE;
    const panelSize = foldDim / panels;
    if (panelSize < 2) errors.push(`Folded panel too small (${fmtInch(panelSize)}"). Min 2" per panel.`);
    if (c.foldDir === "short" && longE > 13) errors.push("Cannot fold, unfolded edge exceeds 13 inches.");
  }
  if (errors.length) return { error: errors };

  // Markup — custom sizes get a tiered bump based on how close they are to a preset
  //   Exact preset match:                1.00x
  //   Similar to preset (<=0.5" on both): 1.15x
  //   Flat, not similar to any preset:    1.25x
  //   Folded, not similar to any preset:  1.50x
  // ROLLBACK 2026-05-14: prior form was `dL = 1.85 * Math.log(pressSheets) - 0.5`
  // with min=3.5. Constant offset removed (was a hidden +0.5 to MAX); coef softened
  // to 1.75 so floor cross-point moves from ~560 to ~2500 press sheets; min dropped
  // to 1.5 to give big-volume orders a meaningful discount.
  const dL = PCF.backend_markup_coef_tS * Math.log(pressSheets);
  let sizeTierMult = 1;
  if (c.sizeMode === "custom") {
    const exactMatch = SIZE_PRESETS.some(s => s.long === longE && s.short === shortE);
    if (!exactMatch) {
      const similar = SIZE_PRESETS.some(s => Math.abs(s.long - longE) <= 0.5 && Math.abs(s.short - shortE) <= 0.5);
      if (similar) sizeTierMult = 1.15;
      else if (fold.val === "flat") sizeTierMult = 1.10;
      else sizeTierMult = 1.5;
    }
  }
  // High-yield markup bonus — holds back some of the natural materials savings
  // on small/high-yield sizes. Anchored to imp=2 as 100% baseline:
  //   imp=3 → +5%  (target: 70% of imp=2 materials)
  //   imp=4 → +20% (target: 60%)
  //   imp=6 → +50% (target: 50%)
  //   imp=8 → +60% (target: 40%)
  // Linear interpolation between anchors. Extrapolates +5% per +1 imp past 8.
  // Mirrors saddle-stitch booklet_8up_markup_bonus conceptually, but with a curve
  // since brochure has more imp tiers (presets 0.5, 1, 2, 4; custom up to ~32).
  function bro_yieldBonus(imp) {
    if (imp <= 2) return 0;
    const lerp = (x, x0, y0, x1, y1) => y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    if (imp <= 3) return lerp(imp, 2,    0,    3, 0.05);
    if (imp <= 4) return lerp(imp, 3, 0.05,    4, 0.20);
    if (imp <= 6) return lerp(imp, 4, 0.20,    6, 0.50);
    if (imp <= 8) return lerp(imp, 6, 0.50,    8, 0.60);
    return 0.60 + (imp - 8) * 0.05;
  }
  const mkBase = Math.max(PCF.backend_maximummarkup - dL, PCF.backend_minimummarkup);
  const mk = mkBase * (1 + bro_yieldBonus(imp)) * sizeTierMult;

  // Approximate thickness
  const approxThickness = (paper.price / 10) * qty;

  const P = {};

  // Paper
  P.paper = (paper.price * pressSheets) * mk;

  // Printing — markup applied uniformly to all printing costs
  if (c.frontColor === "color") {
    P.frontPrint = ((PCF.printing_black_cost + PCF.printing_fullcolor_cost) * pressSheets) * mk;
  } else {
    P.frontPrint = (PCF.printing_black_cost * pressSheets) * mk;
  }
  P.backPrint = 0;
  if (sides === 2) {
    if (c.backColor === "color") {
      P.backPrint = ((PCF.printing_black_cost + PCF.printing_fullcolor_cost) * pressSheets) * mk;
    } else {
      P.backPrint = (PCF.printing_black_cost * pressSheets) * mk;
    }
  }

  // Press labor
  P.press = (pressSheets / PCF.press_printsperhour) * PCF.labor_press_hr;

  // Cutting labor
  P.cutting = ((((approxThickness / PCF.cutter_stackheight_inches) * imp) / PCF.cutter_cyclesperhour) * PCF.labor_cutting_hr) + PCF.cutterbasefee;

  // Folding labor
  P.folding = fold.val !== "flat" ? ((qty / PCF.bindery_morgana_impressionperhour) * PCF.labor_bindery_hr) + (PCF.labor_bindery_hr / 3) : 0;

  // Vivid
  P.vivid = (c.vivid && paper.coatable) ? Math.ceil(P.press) : 0;

  // Coating
  const coat = COATINGS.find(x => x.val === c.coating) || COATINGS[0];
  P.coat = 0;
  if (coat.val > 0 && paper.coatable) {
    const csOpt = COAT_SIDES.find(o => o.val === c.coatSides) || COAT_SIDES[0];
    const cs = csOpt.mult;
    P.coat = PCF.labor_bindery_hr + Math.ceil(((pressSheets * coat.price * cs) * mk) + ((pressSheets / PCF.uvcoaterimpressionsperhour) * PCF.labor_bindery_hr));
  }

  // Bundling
  const bund = BUNDLING.find(x => x.val === c.bundling) || BUNDLING[0];
  P.bundle = (bund.val > 0 && qty >= 100) ? Math.ceil(((qty / bund.price) * mk) * (PCF.labor_bindery_hr / PCF.bundlesperhour) + 7) : 0;

  // Perforation — runtime is charged at 2x the base GW labor rate (specialty
  // operation) and marked up by mk. Setup is flat per-line. Each additional
  // perf line past the first costs 60% of a full line.
  const perf = PERF_OPTS.find(x => x.val === c.perforation) || PERF_OPTS[0];
  P.perforation = 0;
  if (perf.val > 0) {
    const perfRuntime = ((qty * perf.price) / PCF.speed_gwperhr) * (PCF.labor_gw_hour * 2) * mk;
    const perfPerLine = perfRuntime + PCF.labor_gw_setup;
    const perfLineMult = 1 + (perf.count - 1) * 0.6;
    P.perforation = Math.ceil(perfPerLine * perfLineMult);
  }

  // Round cornering (flat only)
  const rc = CORNERS.find(x => x.val === c.roundCorner) || CORNERS[0];
  P.rc = 0;
  if (rc.val > 0 && fold.val === "flat") {
    P.rc = ((approxThickness / rc.price) / PCF.roundcornerperhour) * PCF.labor_bindery_hr + (PCF.labor_bindery_hr / 2);
  }

  // Difficult fold surcharges (stack)
  const foldLabor = (qty / PCF.bindery_morgana_impressionperhour) * PCF.labor_bindery_hr;
  // Tier 1: accordion4/roll4/dgate4, OR small sizes (long<9) with 3+ panel folds
  const tier1Folds = ["accordion4","roll4","dgate4"];
  const smallSizeFold = longE < 9 && fold.val !== "flat" && fold.val !== "bifold";
  const smallPresetFold = ["5.5×8.5","6×9"].some(s => c.sizeLabel?.startsWith(s)) && fold.val !== "flat" && fold.val !== "bifold";
  P.diffFold1 = (tier1Folds.includes(fold.val) || smallSizeFold || smallPresetFold) ? foldLabor + (PCF.labor_bindery_hr / 2) : 0;
  // Tier 2: Roll fold specifically (stacks with tier 1)
  P.diffFold2 = fold.val === "roll4" ? foldLabor : 0;
  // Tier 3: narrow sheets (short < 5") with any fold, OR folding the short side
  P.diffFold3 = fold.val !== "flat" && (shortE < 5 || c.foldDir === "short") ? foldLabor : 0;
  // Compound right-angle fold: trifold + a cross-direction bifold is a second
  // bindery pass in a different orientation plus hand-work. Per spec, sum all
  // fold labor and multiply by 3 (each line ×3 → total ×3).
  if (fold.val === "trifold_xbifold") {
    P.folding *= 3; P.diffFold1 *= 3; P.diffFold2 *= 3; P.diffFold3 *= 3;
  }

  // Artwork — fees live in PCF (Production tab → Artwork group)
  const art = ART_OPTS.find(x => x.val === c.artwork) || ART_OPTS[0];
  const artWork = art.val >= 2;
  const ndc = art.val >= 4 ? ((PCF.art_design_rate * sides) * PCF.art_newdesignmodifier) + 15 : 0;
  const aec = (art.val >= 2 && art.val < 4) ? PCF.art_edit_rate : 0;
  const upc = (art.val > 0.03 && art.val < 1) ? PCF.art_canva_fee : 0; // val 0.04 = Canva
  P.artwork = ndc + aec + upc;

  // Bleed
  const bld = BLEED_OPTS.find(x => x.val === c.bleed) || BLEED_OPTS[0];
  P.bleed = (!artWork && bld.val > 0) ? Math.max(bld.price * sides, PCF.bleed_minimum) : 0;

  // Proofing
  P.proof = 0;
  if (c.proof > 0) {
    const sf = (PCF.sheetsforlowcosthardcopyproof / pressSheets) > 1 ? 1 : (1500 / pressSheets);
    P.proof = (c.proof >= 3 ? PCF.proof_hardcopy_cost : PCF.proof_digital_cost) * sf;
  }

  // Non-inventory surcharge. Oversized flats (needsLargeSheet) must run on 13×27.5,
  // stocked only for LARGE_SHEET_VALS papers; everything else there pays the fee.
  P.nonInv = (needsLargeSheet ? LARGE_SHEET_VALS.includes(paper.val) : INV_VALS.includes(paper.val)) ? 0 : PCF.non_inventory_fee;

  // Flat base rate per order
  P.baseRate = PCF.backend_base_rate;

  // Easy discounts — preset OR custom dims matching standard sizes
  const stdLongs = [8.5, 9, 11, 14, 17];
  const stdShorts = [5.5, 6, 8.5, 11];
  const isEasySize = SIZE_PRESETS.some(s => s.label === c.sizeLabel && s.easy)
    || (c.sizeMode === "custom" && stdLongs.includes(longE) && stdShorts.includes(shortE));
  const isEasyFold = ["flat","bifold","trifold","z3"].includes(fold.val);
  const costSummary = P.paper + P.frontPrint + P.backPrint + P.cutting + P.folding + P.perforation + P.rc;
  // Easy Discount stacks on top of the flat discount when both apply.
  // Per the source pricing model, flat items get BOTH discEasyFlat and discEasy
  // (folding labor is 0 for flat, so the formula reduces to press + cutting only).
  P.discEasyFlat = (fold.val === "flat" && isEasySize) ? -Math.min(costSummary * PCF.easydiscount_factor, PCF.easydiscount_max / 10) : 0;
  P.discEasy = (isEasyFold && isEasySize) ? -Math.min(P.press + P.cutting + P.folding, PCF.easydiscount_max / 10) : 0;

  // BW discount
  const allBW = c.frontColor === "bw" && (sides === 1 || c.backColor === "bw");
  P.discBW = allBW ? -(P.press * 0.3) : 0;

  // Cardstock discount — specific cardstock values only
  const csDiscVals = [0.01, 0.02, 0.03, 1.01, 1.02, 2.021, 2.022, 2.023, 2.024, 2.025, 2.01, 3.03, 3.01, 3.04, 3.02];
  P.cardstockDisc = csDiscVals.includes(paper.val) ? -(0.04 * pressSheets) : 0;

  // Sale discount applies last, on the post-discount subtotal. Excludes shipping/rush.
  const subBeforeSale = Object.values(P).reduce((s, v) => s + v, 0);
  P.discSale = (PCF.sale_discount_pct > 0) ? -Math.round(subBeforeSale * PCF.sale_discount_pct * 100) / 100 : 0;

  const total = Object.values(P).reduce((s, v) => s + v, 0);

  // Turnaround
  const paperDays = paper.days != null ? paper.days : Math.floor(paper.val || 0);
  const vividDays = c.vivid ? Math.floor(pressSheets / 2500) : 0;
  const coatDaysMult = (COAT_SIDES.find(o => o.val === c.coatSides) || COAT_SIDES[0]).daysMult;
  const coatDays = (coat.val > 0 && paper.coatable) ? Math.ceil(pressSheets / (coat.val / coatDaysMult)) : 0;
  const bundleDays = (bund.val > 0 && qty >= 100) ? Math.floor(approxThickness / bund.val) : 0;
  const perfDays = (perf.val > 0) ? Math.ceil(pressSheets / perf.val) : 0;
  const rcDays = (rc.val > 0 && fold.val === "flat") ? Math.floor(Math.min(pressSheets / rc.val, PCF.addon_roundcornermaxdays)) : 0;
  const artDays = art.val >= 4 ? Math.ceil(art.val) : 0;
  const proofDays = c.proof >= 3 ? Math.ceil(paperDays + 3.01) : 0;
  const baseDays = sheetsToDays(pressSheets);
  const days = Math.max(PCF.minimum_turnaround_days, baseDays + paperDays + vividDays + coatDays + bundleDays + perfDays + rcDays + artDays + proofDays);

  // Turnaround impact per option (for UI badges)
  const ti = {
    paper: paperDays,
    vivid: vividDays,
    coating: coatDays,
    bundling: bundleDays,
    perforation: perfDays,
    roundCorner: rcDays,
    artDesign: artDays,
    artEdits: (art.val >= 2 && art.val < 4) ? 1 : 0,
    proof: proofDays,
  };

  // Shipping & Rush
  const transitDays = getTransitDays(c.shipState, c.shipZip);
  // Do we know where this is going? A ZIP is what the zone map and the live UPS lookup
  // both key on, so a dated promise needs one; state alone is a coarse guess dressed up
  // as a delivery date. Clearing the ZIP used to leave the previous date on screen
  // unchanged, because the state fallback quietly produced the same number.
  const _hasDest = !!(c.shipState && String(c.shipState).trim())
    && String(c.shipZip || "").replace(/[^0-9]/g, "").length >= 3;
  // Internal shipping-weight estimate (owner rule 2026-07-19): a 45 lb carton
  // holds 900 text-weight or 400 cardstock 13x19 press sheets. Debug/ops only.
  const _cartonLb=PCF.ship_carton_lb||45;
  const _shFac=(typeof pressSheet!=="undefined"&&pressSheet==="13x27.5")?(27.5/19):1; // area scaling: oversize sheets vs 13x19
  const _perCarton=(paper&&paper.type==="cardstock")?(PCF.ship_card_sheets_per_carton||400):(PCF.ship_text_sheets_per_carton||900);
  const _physSheets=(typeof pressSheet!=="undefined"&&pressSheet==="13x27.5")?pressSheets*Math.min(imp,1):pressSheets; // imp<1 = oversized-premium pricing; physical is 1-up on 13x27.5
  const estWeightLb=Math.round(_physSheets*(_cartonLb/_perCarton)*_shFac*10)/10;
  const estCartons=Math.max(1,Math.ceil(estWeightLb/_cartonLb));
  const productionBizDays = days;
  const bufferedProdDays = productionBizDays * 2;
  const freeDeliveryBizDays = bufferedProdDays + transitDays;
  const earliestBizDays = productionBizDays + 1;
  const shopToday = getShopToday();
  const freeDeliveryDate = addBusinessDays(shopToday, freeDeliveryBizDays);
  const earliestDate = addBusinessDays(shopToday, earliestBizDays);

  let rushMultiplier = 1, rushCost = 0, bizDaysToDate = freeDeliveryBizDays, needByValid = false, tooSoon = false, needByPast = false;
  if (c.needByDate) {
    const nbd = new Date(c.needByDate + "T00:00:00");
    if (nbd <= shopToday) { needByPast = true; }
    else {
      bizDaysToDate = businessDaysBetween(shopToday, nbd);
      needByValid = true;
      if (bizDaysToDate < earliestBizDays) { tooSoon = true; }
      else if (bizDaysToDate < freeDeliveryBizDays) {
        rushMultiplier = freeDeliveryBizDays / bizDaysToDate;
        rushCost = Math.max(0, (total * rushMultiplier) - total);
      }
    }
  }
  const grandTotal = total + rushCost;
  const effectiveDeliveryBiz = (needByValid && !tooSoon) ? bizDaysToDate : freeDeliveryBizDays;
  const effectiveTransit = Math.min(transitDays, Math.max(1, effectiveDeliveryBiz - productionBizDays));
  const prodStartBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit - productionBizDays);
  const productionStartDate = addBusinessDays(shopToday, prodStartBiz);
  const mustShipBiz = Math.max(0, effectiveDeliveryBiz - effectiveTransit);
  const mustShipDate = addBusinessDays(shopToday, mustShipBiz);

  // Cost breakdown
  const bd = [
    {l:"Paper",v:P.paper,g:"mat"},{l:"Front Print",v:P.frontPrint,g:"mat"},{l:"Back Print",v:P.backPrint,g:"mat"},
    {l:"Press",v:P.press,g:"lab"},{l:"Cutting",v:P.cutting,g:"lab"},{l:"Folding",v:P.folding,g:"lab"},
    {l:"Vivid Print",v:P.vivid,g:"add"},{l:"UV Coating",v:P.coat,g:"add"},{l:"Bundling",v:P.bundle,g:"add"},
    {l:"Perforation",v:P.perforation,g:"add"},{l:"Round Cornering",v:P.rc,g:"add"},
    {l:"Fold Surcharge 1",v:P.diffFold1,g:"fee"},{l:"Fold Surcharge 2",v:P.diffFold2,g:"fee"},{l:"Fold Surcharge 3",v:P.diffFold3,g:"fee"},
    {l:"Base Rate",v:P.baseRate,g:"fee"},{l:"Non-Inventory",v:P.nonInv,g:"fee"},
    {l:"Artwork",v:P.artwork,g:"art"},{l:"Bleed",v:P.bleed,g:"art"},{l:"Proofing",v:P.proof,g:"art"},
    {l:"BW Discount",v:P.discBW,g:"disc"},{l:"Easy Discount (Flat)",v:P.discEasyFlat,g:"disc"},{l:"Easy Discount",v:P.discEasy,g:"disc"},{l:"Cardstock Disc",v:P.cardstockDisc,g:"disc"},
    {l:(PCF.sale_label||"Sale"),v:P.discSale,g:"disc"},
  ].filter(r => Math.abs(r.v) > 0.005);

  const gC={mat:CK.cyan,lab:CK.key,add:CK.yellow,art:CK.magenta,fee:"#c25050",disc:CK.cyan};
  const gL={mat:"Materials & Ink",lab:"Production Labor",add:"Addons",art:"Artwork & Proofing",fee:"Fees & Surcharges",disc:"Discounts"};
  const grouped=Object.entries(gL).map(([k,label])=>({label,val:bd.filter(r=>r.g===k).reduce((s,r)=>s+r.v,0),c:gC[k]})).filter(g=>Math.abs(g.val)>0.005);

  const perUnit = qty > 0 ? grandTotal / qty : 0;

  const saleActive = P.discSale < -0.005;
  const saleAmount = saleActive ? Math.round(-P.discSale * 100) / 100 : 0;
  const totalWithoutSale = Math.round((grandTotal - P.discSale) * 100) / 100;
  return {
    total: Math.round(grandTotal * 100) / 100, baseTotal: Math.round(total * 100) / 100,
    perUnit: Math.round(perUnit * 100) / 100, days, qty: qty, bd, grouped,
    imp, mk, fold, panels, pressSheets, longE, shortE, approxThickness,
    coatOK: paper.coatable, vividOK: paper.coatable, q100: qty >= 100, ti,
    saleActive, saleAmount, saleLabel: (PCF.sale_label || "Sale"), totalWithoutSale,
    shipping: {
      hasDest: _hasDest,
      estWeightLb, estCartons,
      transitDays, effectiveTransit, freeDeliveryBizDays, freeDeliveryDate: fmtDate(freeDeliveryDate), freeDeliveryYMD: toYMD(freeDeliveryDate),
      earliestBizDays, earliestDate: fmtDate(earliestDate), earliestYMD: toYMD(earliestDate), shopToday: fmtDate(shopToday),
      bizDaysToDate, rushMultiplier, rushCost: Math.round(rushCost * 100) / 100,
      needByValid, needByPast, tooSoon, productionBizDays, bufferedProdDays,
      productionStartDate: fmtDate(productionStartDate), productionStartYMD: toYMD(productionStartDate),
      mustShipDate: fmtDate(mustShipDate), mustShipYMD: toYMD(mustShipDate),
      needByFmt: (needByValid && !tooSoon && c.needByDate) ? fmtDate(new Date(c.needByDate + "T00:00:00")) : null,
    },
    debug: { pressSheets, imp, qty, mk, dL, approxThickness, fold: fold.label, panels, longE, shortE, paperDays, baseDays, days, P },
  };
}

// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// DOWNLOADABLE BROCHURE TEMPLATE (jsPDF)
// ═══════════════════════════════════════════════════════════════

function drawDashedLine(pdf, x1, y1, x2, y2, dashLen, gapLen) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len === 0) return;
  var ux = dx / len, uy = dy / len;
  var pos = 0, drawing = true;
  while (pos < len) {
    var segLen = drawing ? dashLen : gapLen;
    if (pos + segLen > len) segLen = len - pos;
    if (drawing) pdf.line(x1 + ux * pos, y1 + uy * pos, x1 + ux * (pos + segLen), y1 + uy * (pos + segLen));
    pos += segLen; drawing = !drawing;
  }
}
function drawDashedRect(pdf, x, y, w, h, dashLen, gapLen) {
  drawDashedLine(pdf, x, y, x + w, y, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y, x + w, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y + h, x, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x, y + h, x, y, dashLen, gapLen);
}

function generateBrochureTemplate(longE, shortE, foldType, panels, foldDir, sizeLabel, perfCount, perfDir, perfPositions) {
  try {
    if (!window.jspdf) { alert("PDF library not loaded. Please refresh."); return; }
    const { jsPDF } = window.jspdf;
    const bleed = 0.125, safety = 0.125;
    const trimW = longE, trimH = shortE;
    const docW = trimW + bleed * 2;
    const docH = trimH + bleed * 2;
    const pdf = new jsPDF({ orientation: docW > docH ? "l" : "p", unit: "in", format: [docW, docH] });

    for (let pg = 0; pg < 2; pg++) {
      if (pg > 0) pdf.addPage([docW, docH], docW > docH ? "l" : "p");
      const label = pg === 0 ? "Front / Outside" : "Back / Inside";

      // Light grey bleed zone background
      pdf.setFillColor(240, 240, 240);
      pdf.rect(0, 0, docW, docH, "F");

      // White trim area
      pdf.setFillColor(255, 255, 255);
      pdf.rect(bleed, bleed, trimW, trimH, "F");

      // Bleed line — red solid at document edge
      pdf.setDrawColor(229, 62, 62);
      pdf.setLineWidth(0.012);
      pdf.rect(0.006, 0.006, docW - 0.012, docH - 0.012, "S");

      // Trim line — black dashed
      pdf.setDrawColor(30, 30, 30);
      pdf.setLineWidth(0.01);
      drawDashedRect(pdf, bleed, bleed, trimW, trimH, 0.08, 0.05);

      // Safety line — green dashed
      pdf.setDrawColor(56, 161, 105);
      pdf.setLineWidth(0.008);
      drawDashedRect(pdf, bleed + safety, bleed + safety, trimW - safety * 2, trimH - safety * 2, 0.05, 0.03);

      // Fold lines — orange solid (thin), with flap offset for nesting folds
      if (panels > 1) {
        pdf.setDrawColor(245, 166, 35);
        pdf.setLineWidth(0.01);
        const foldingLong = foldDir === "long";
        const tplFoldDim = foldingLong ? trimW : trimH;
        const tplFracs = getFoldFracs(foldType, panels, tplFoldDim);
        for (let i = 0; i < tplFracs.length; i++) {
          const frac = tplFracs[i];
          if (foldingLong) {
            const x = bleed + trimW * frac;
            pdf.line(x, bleed + 0.1, x, bleed + trimH - 0.1);
            pdf.setFontSize(6); pdf.setTextColor(245, 166, 35);
            pdf.text("FOLD " + (i + 1), x + 0.04, bleed + 0.25);
          } else {
            const y = bleed + trimH * frac;
            pdf.line(bleed + 0.1, y, bleed + trimW - 0.1, y);
            pdf.setFontSize(6); pdf.setTextColor(245, 166, 35);
            pdf.text("FOLD " + (i + 1), bleed + 0.15, y - 0.04);
          }
        }
      }

      // Cross-fold crease — compound right-angle fold only. After the trifold
      // (vertical creases above), a bifold runs across the short edge → a
      // horizontal crease at mid-height. Drawn dashed to read as a second pass.
      if (foldType === "trifold_xbifold") {
        pdf.setDrawColor(245, 166, 35);
        pdf.setLineWidth(0.01);
        const ymid = bleed + trimH / 2;
        drawDashedLine(pdf, bleed + 0.1, ymid, bleed + trimW - 0.1, ymid, 0.06, 0.04);
        pdf.setFontSize(6); pdf.setTextColor(245, 166, 35);
        pdf.text("CROSS FOLD", bleed + trimW - 1.0, ymid - 0.05);
      }

      // Perf lines (purple dashed)
      if (perfCount > 0 && perfPositions) {
        pdf.setDrawColor(139, 92, 246);
        pdf.setLineWidth(0.01);
        const perfVertical2 = perfDir === "length" ? (foldDir === "long") : (foldDir !== "long");
        for (let i = 0; i < Math.min(perfCount, perfPositions.length); i++) {
          const frac = perfPositions[i] / 100;
          if (perfVertical2) {
            const x = bleed + trimW * frac;
            drawDashedLine(pdf, x, bleed + 0.1, x, bleed + trimH - 0.1, 0.08, 0.04);
            pdf.setFontSize(6); pdf.setTextColor(139, 92, 246);
            pdf.text("PERF " + (i + 1), x + 0.04, bleed + trimH - 0.15);
          } else {
            const y = bleed + trimH * frac;
            drawDashedLine(pdf, bleed + 0.1, y, bleed + trimW - 0.1, y, 0.08, 0.04);
            pdf.setFontSize(6); pdf.setTextColor(139, 92, 246);
            pdf.text("PERF " + (i + 1), bleed + 0.15, y - 0.04);
          }
        }
      }

      // Panel labels
      const panelCfg = PANEL_LABELS[foldType];
      if (panelCfg && panels > 1) {
        const labels = pg === 0 ? panelCfg.front : panelCfg.back;
        const foldingLong2 = foldDir === "long";
        const tplFoldDim2 = foldingLong2 ? trimW : trimH;
        const tplEdges = [0, ...getFoldFracs(foldType, panels, tplFoldDim2), 1];
        const tplCenters = Array.from({length: panels}, (_, i) => (tplEdges[i] + tplEdges[i + 1]) / 2);
        pdf.setFontSize(8); pdf.setTextColor(180, 140, 60);
        for (let p = 0; p < labels.length; p++) {
          const cx = foldingLong2
            ? bleed + trimW * tplCenters[p]
            : bleed + trimW / 2;
          const cy = foldingLong2
            ? bleed + trimH / 2 + 0.15
            : bleed + trimH * tplCenters[p];
          pdf.text(labels[p], cx, cy, { align: "center" });
        }
      }

      // Text watermark — tiled "PriorityPrintService.com"
      var tileSize = Math.min(trimW * 0.2, 1.2);
      var tileStep = tileSize * 1.6;
      var safeL = bleed + safety, safeT = bleed + safety;
      var safeW = trimW - safety * 2, safeH = trimH - safety * 2;
      var cols = Math.floor(safeW / tileStep), rows = Math.floor(safeH / tileStep);
      var gridW = cols * tileStep, gridH = rows * tileStep;
      var offX = safeL + (safeW - gridW) / 2, offY = safeT + (safeH - gridH) / 2;
      pdf.setFontSize(tileSize * 3.5);
      pdf.setTextColor(230, 230, 230);
      for (var row = 0; row < rows; row++) {
        for (var col = 0; col < cols; col++) {
          pdf.text("PriorityPrintService.com", offX + col * tileStep + tileStep / 2, offY + row * tileStep + tileStep / 2, { align: "center" });
        }
      }

      // Page label
      var cx = docW / 2;
      pdf.setFontSize(10); pdf.setTextColor(170, 170, 170);
      pdf.text(label, cx, docH / 2 - 0.1, { align: "center" });

      // Dimensions
      pdf.setFontSize(7); pdf.setTextColor(190, 190, 190);
      pdf.text("Trim: " + trimW + '" \u00d7 ' + trimH + '"  |  With bleeds: ' + docW.toFixed(3) + '" \u00d7 ' + docH.toFixed(3) + '"', cx, docH / 2 + 0.12, { align: "center" });
      if (panels > 1) {
        var foldDim = foldDir === "long" ? trimW : trimH;
        var staticDim = foldDir === "long" ? trimH : trimW;
        pdf.text("Folded: " + fmtInch(staticDim) + '" \u00d7 ' + fmtInch(foldDim / panels) + '"  (' + panels + ' panels)', cx, docH / 2 + 0.3, { align: "center" });
      }

      // URL
      pdf.setFontSize(7); pdf.setTextColor(150, 150, 150);
      pdf.text("priorityprintservice.com", cx, docH - bleed - 0.08, { align: "center" });

      // Legend on first page
      if (pg === 0) {
        var lx = bleed + safety + 0.1;
        var ly = docH - bleed - 0.42;
        pdf.setFontSize(6);
        pdf.setTextColor(229, 62, 62);
        pdf.text("\u2014 Bleed (extend backgrounds to this edge)", lx, ly - 0.24);
        pdf.setTextColor(30, 30, 30);
        pdf.text("- - Trim (cut line)", lx, ly - 0.16);
        pdf.setTextColor(56, 161, 105);
        pdf.text("- - Safety (keep text inside)", lx, ly - 0.08);
        if (panels > 1) { pdf.setTextColor(245, 166, 35); pdf.text("\u2014 Fold lines", lx, ly); }
        if (perfCount > 0) { pdf.setTextColor(139, 92, 246); pdf.text("- - Perf lines", lx, ly + 0.08); }
      }
    }

    var safeName = (sizeLabel || (longE + "x" + shortE)).replace(/[^a-zA-Z0-9._-]/g, "_");
    var foldName = foldType === "flat" ? "flat" : foldType;
    pdf.save("PPS_Brochure_Template_" + safeName + "_" + foldName + ".pdf");
  } catch (e) {
    console.error("Template generation failed:", e);
    alert("Template generation failed: " + e.message);
  }
}
