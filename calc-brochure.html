  const [sizeMode, setSizeMode] = useState("preset");
  const [sizeLabel, setSizeLabel] = useState("8.5×11");
  const [longEdge, setLongEdge] = useState(11);
  const [shortEdge, setShortEdge] = useState(8.5);
  const [foldType, setFoldType] = useState("flat");
  const [foldDir, setFoldDir] = useState("long");
  const [frontColor, setFrontColor] = useState("color");
  const [backColor, setBackColor] = useState("color");
  const [sides, setSides] = useState(2);
  const [paperType, setPaperType] = useState("noncardstock");
  const [paper, setPaper] = useState(PAPERS_NC[2] || PAPERS_NC[0]);
  const [vivid, setVivid] = useState(false);
  const [coating, setCoating] = useState(0);
  const [coatSides, setCoatSides] = useState(1);
  const [bundling, setBundling] = useState(0);
  const [perforation, setPerforation] = useState(0);
  const [roundCorner, setRoundCorner] = useState(0);
  const [artwork, setArtwork] = useState(0.01);
  const [artEditPages, setArtEditPages] = useState(0);
  const [bleed, setBleed] = useState(0);
  const [proof, setProof] = useState(0);
  const [proofAddrSame, setProofAddrSame] = useState(true);
  const [proofAddr, setProofAddr] = useState({name:"",street:"",city:"",state:"",zip:""});
  const [canvaLink, setCanvaLink] = useState("");
  const [canvaInstructions, setCanvaInstructions] = useState("");
  const [referenceFiles, setReferenceFiles] = useState([]);
  const [shipState, setShipState] = useState("AZ");
  const [shipAddr, setShipAddr] = useState({ name: "", company: "", street1: "", street2: "", city: "", zip: "" });
  const [needByDate, setNeedByDate] = useState("");

  const shipZip = shipAddr.zip || "";
  const fold = FOLD_TYPES.find(f => f.val === foldType) || FOLD_TYPES[0];

  const result = useMemo(() => calculate({
    qty, sizeMode, sizeLabel, longEdge, shortEdge,
    foldType, foldDir, frontColor, backColor, sides,
    paper, vivid, coating, coatSides, bundling, perforation, roundCorner,
    artwork, bleed, proof, shipState, shipZip, needByDate,
  }), [qty, sizeMode, sizeLabel, longEdge, shortEdge, foldType, foldDir, frontColor, backColor, sides, paper, vivid, coating, coatSides, bundling, perforation, roundCorner, artwork, bleed, proof, shipState, shipZip, needByDate]);

  const r = result || {};

  // Quantity projection table
  const projections = useMemo(() => {
    if (!result || result.error) return null;
    const baseConfig = {
      qty, sizeMode, sizeLabel, longEdge, shortEdge,
      foldType, foldDir, frontColor, backColor, sides,
      paper, vivid, coating, coatSides, bundling, perforation, roundCorner,
      artwork, bleed, proof, shipState, shipZip,
    };
    const breakpoints = [25,50,100,250,500,1000,2500,5000].filter(q => q !== qty);
    const qtys = [...breakpoints, qty].sort((a,b) => a - b);
    return qtys.map(q => {
      const projNeedBy = (result.shipping?.rushCost > 0) ? needByDate : null;
      const pr = calculate({...baseConfig, qty: q, needByDate: projNeedBy});
      if (!pr || pr.error) return {qty: q, total: null, perUnit: null, current: q === qty};
      return {qty: q, total: pr.total, perUnit: pr.perUnit, current: q === qty};
    });
  }, [result, qty, sizeMode, sizeLabel, longEdge, shortEdge, foldType, foldDir, frontColor, backColor, sides, paper, vivid, coating, coatSides, bundling, perforation, roundCorner, artwork, bleed, proof, shipState, shipZip, needByDate]);

  const r2 = { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 };
  const r3 = { display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 };
  const pList = paperType === "cardstock" ? PAPERS_CS : PAPERS_NC;
  const preset = SIZE_PRESETS.find(s => s.label === sizeLabel);
  const dimLong = sizeMode === "preset" ? (preset?.long || 11) : longEdge;
  const dimShort = sizeMode === "preset" ? (preset?.short || 8.5) : shortEdge;

  return (
    <div style={{ minHeight: "100vh", background: CC.bg, fontFamily: "'Segoe UI','Helvetica Neue',Arial,sans-serif", color: CC.dark }}>
      <style>{`@media(max-width:700px){.pps-sec-hdr{padding:12px 14px!important;font-size:13px!important}.pps-sec-body{padding:12px 14px!important}}`}</style>

      <div style={{ maxWidth: 1180, margin: "0 auto", padding: mob ? "10px" : "20px 24px", display: "flex", gap: 20, alignItems: mob ? "stretch" : "flex-start", flexDirection: mob ? "column" : "row" }}>
        <div style={{ flex: 1, minWidth: 0 }}>

          {/* SECTION 1: Size, Qty, Fold */}
          <Sec title="Size, Quantity & Fold" open={op.s1} onToggle={() => tog("s1")}>
            <TxtNum label="Quantity" value={qty} onChange={v => setQty(Math.max(1, Math.round(v)))} min={1} />
            <div style={ST.hr} />
            <Pil label="Size" value={sizeMode} onChange={setSizeMode} options={[{ t: "Preset Sizes", v: "preset" }, { t: "Custom Size", v: "custom" }]} />
            {sizeMode === "preset"
              ? <Sel label="Flat/Unfolded Size" value={sizeLabel} onChange={setSizeLabel}>{SIZE_PRESETS.map(s => <option key={s.label} value={s.label}>{s.label}</option>)}</Sel>
              : <div style={r2}>
                  <TxtNum label="Long Edge (in)" value={longEdge} onChange={setLongEdge} min={2} max={27} />
                  <TxtNum label="Short Edge (in)" value={shortEdge} onChange={setShortEdge} min={2} max={12.5} />
                </div>
            }
            <div style={ST.hr} />
            <Sel label="Fold Type" value={foldType} onChange={setFoldType}>
              {FOLD_TYPES.map(f => <option key={f.val} value={f.val}>{f.label}</option>)}
            </Sel>
            {fold.panels > 1 && sizeMode === "custom" && (
              <Pil label="Fold Direction" value={foldDir} onChange={setFoldDir} options={[
                { t: `Fold Long Side (${dimLong}")`, v: "long" },
                { t: `Fold Short Side (${dimShort}")`, v: "short" },
              ]} />
            )}
            {fold.panels > 1 && (() => {
              const foldDim = foldDir === "long" ? dimLong : dimShort;
              const staticDim = foldDir === "long" ? dimShort : dimLong;
              const panelSize = foldDim / fold.panels;
              const tooSmall = panelSize < 2;
              const throatExceeded = foldDir === "short" && dimLong > 13;
              return <>
                <div style={{ marginTop: 8, padding: "8px 12px", background: tooSmall || throatExceeded ? "#fef2f2" : CK.cyanLight, borderRadius: 5, fontSize: 11, color: tooSmall || throatExceeded ? "#dc2626" : CC.mid, border: tooSmall || throatExceeded ? "1px solid #f5cccc" : "none" }}>
                  Folded size: <strong>{staticDim.toFixed(1)}" × {panelSize.toFixed(1)}"</strong> ({fold.panels} panels)
                  {tooSmall && <span style={{marginLeft:8,fontWeight:700}}>— Panel too small (min 2")</span>}
                  {throatExceeded && <span style={{marginLeft:8,fontWeight:700}}>— Exceeds 13" folder throat</span>}
                </div>
                {sizeMode !== "custom" && <p style={{fontSize:10,color:CC.light,margin:"4px 0 0"}}>All folds assume the longest edge is being folded. Use custom size to fold the short edge.</p>}
              </>;
            })()}
          </Sec>

          {/* SECTION 2: Printing & Paper */}
          <Sec title="Printing & Paper" open={op.s2} onToggle={() => tog("s2")}>
            <Pil label="Sides Printed" value={sides} onChange={v => setSides(Number(v))} options={[{ t: "Both Sides", v: 2 }, { t: "Front Only", v: 1 }]} />
            <div style={{ ...r2, marginTop: 10 }}>
              <Pil label="Front Color" value={frontColor} onChange={setFrontColor} options={[
                { t: "Full Color", v: "color", onStyle: { background: "conic-gradient(from 45deg, #00aeef 0deg, #ec008c 90deg, #fff200 180deg, #231f20 270deg, #00aeef 360deg)", color: "#fff", fontWeight: 600, textShadow: "0 1px 4px rgba(0,0,0,.5)" } },
                { t: "Greyscale", v: "bw", onStyle: { background: "linear-gradient(135deg, #888 0%, #444 50%, #999 100%)", color: "#fff", fontWeight: 600 } }
              ]} />
              {sides === 2 && <Pil label="Back Color" value={backColor} onChange={setBackColor} options={[
                { t: "Full Color", v: "color", onStyle: { background: "conic-gradient(from 45deg, #00aeef 0deg, #ec008c 90deg, #fff200 180deg, #231f20 270deg, #00aeef 360deg)", color: "#fff", fontWeight: 600, textShadow: "0 1px 4px rgba(0,0,0,.5)" } },
                { t: "Greyscale", v: "bw", onStyle: { background: "linear-gradient(135deg, #888 0%, #444 50%, #999 100%)", color: "#fff", fontWeight: 600 } }
              ]} />}
            </div>
            <div style={ST.hr} />
            <Pil label="Paper Type" value={paperType} onChange={v => { setPaperType(v); const pool = v === "cardstock" ? PAPERS_CS : PAPERS_NC; setPaper(pool[2] || pool[0]); }} options={[{ t: "Text Weight", v: "noncardstock" }, { t: "Cardstock", v: "cardstock" }]} />
            <Sel label="Select Paper" value={paper.val} onChange={v => { const f = ALL_PAPERS.find(p => String(p.val) === v); if (f) { setPaper(f); setPaperType(f.type); } }}>
              {PAPERS_NC.map(p => <option key={p.val} value={p.val}>{p.label}</option>)}
              <optgroup label="Cardstock">{PAPERS_CS.map(p => <option key={p.val} value={p.val}>{p.label}</option>)}</optgroup>
            </Sel>
          </Sec>

          {/* SECTION 3: Addons */}
          <Sec title="Finishing & Addons" open={op.s3} onToggle={() => tog("s3")}>
            <Pil label="Print Quality" value={vivid} onChange={v => setVivid(v === true || v === "true")} options={[{ t: "Standard", v: false }, { t: "Enhanced Vivid", v: true }]} />
            <div style={ST.hr} />
            {paper.coatable ? (
              <>
                <Sel label="Additional Coating" value={coating} onChange={v => setCoating(Number(v))}>
                  {COATINGS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
                </Sel>
                {coating > 0 && (
                  <>
                    <Pil label="Sides to Coat" value={coatSides} onChange={v => setCoatSides(Number(v))} options={
                      paper.val === 1.01
                        ? [{ t: "Front Only", v: 1 }]
                        : COAT_SIDES.map(o => ({ t: o.label, v: o.val }))
                    } />
                    {paper.val === 1.01 && coatSides !== 1 && <p style={ST.err}>14pt C1S can only be coated on the front side.</p>}
                  </>
                )}
              </>
            ) : (
              <div style={{...ST.f, opacity: 0.4}}><label style={ST.lbl}>Additional Coating</label><div style={{padding:"8px 12px",borderRadius:6,border:`1px solid ${CC.border}`,background:"#f5f5f5",fontSize:13,color:CC.light}}>Not available for this paper type</div></div>
            )}
            <div style={ST.hr} />
            <Sel label="Bundling" value={bundling} onChange={v => setBundling(Number(v))}>
              {BUNDLING.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
            </Sel>
            {(() => {
              const perfDisabled = !["5.5×8.5","6×9","8.5×11","8.5×14"].some(s => sizeLabel?.startsWith(s)) && sizeMode !== "custom";
              return <Sel label="Perforation" value={perforation} onChange={v => setPerforation(Number(v))} disabled={perfDisabled} note={perfDisabled ? "Perforation not available for this size" : undefined}>
                {PERF_OPTS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
              </Sel>;
            })()}
            {foldType === "flat" && (
              <Sel label="Round Cornering" value={roundCorner} onChange={v => setRoundCorner(Number(v))}>
                {CORNERS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
              </Sel>
            )}
          </Sec>

          {/* SECTION 4: Artwork & Proofing */}
          <Sec title="Artwork & Proofing" open={op.s4} onToggle={()=>tog("s4")}>

            <Sel label="Artwork & Design" badge={<TurnBadge days={(r.ti?.artDesign||0)+(r.ti?.artEdits||0)}/>} value={artwork} onChange={v=>{setArtwork(Number(v)); if(Number(v)===0.04) setProof(proof===0?0.01:proof);}}>{ART_OPTS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>

            {artwork>=2&&artwork<4&&<TxtNum label="Pages Needing Edits" value={artEditPages} onChange={setArtEditPages} min={0}/>}

            {artwork>=2 && (
              <div style={{marginTop:8,padding:"12px 14px",borderRadius:6,background:"#f8f8fa",border:`1px solid ${CC.border}`}}>
                <div style={{fontSize:12,fontWeight:700,color:CC.dark,marginBottom:4}}>📎 Upload Reference Files (optional)</div>
                <div style={{fontSize:11,color:CC.mid,marginBottom:8,lineHeight:1.4}}>
                  {artwork>=4 ? "Attach any reference materials, logos, content, or inspiration for your new design."
                    : "Attach your artwork files or references for the pages needing edits."}
                </div>
                <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px",borderRadius:6,border:`2px dashed ${CC.border}`,cursor:"pointer",background:"#fff",fontSize:12,fontWeight:600,color:CC.mid}}>
                  <span>Choose Files</span>
                  <input type="file" multiple accept=".pdf,.ai,.psd,.tif,.tiff,.jpg,.jpeg,.png,.doc,.docx,.zip" onChange={e=>{
                    const files=Array.from(e.target.files||[]);
                    if(files.length) setReferenceFiles(prev=>[...prev,...files.map(f=>({name:f.name,size:f.size,file:f}))]);
                    e.target.value="";
                  }} style={{display:"none"}}/>
                </label>
                {referenceFiles.length>0&&(
                  <div style={{marginTop:6,display:"flex",flexDirection:"column",gap:3}}>
                    {referenceFiles.map((f,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:CC.mid,padding:"4px 8px",background:"#fff",borderRadius:4,border:`1px solid ${CC.border}`}}>
                        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</span>
                        <span style={{fontSize:10,color:CC.light,flexShrink:0}}>{(f.size/1024).toFixed(0)} KB</span>
                        <button type="button" onClick={()=>setReferenceFiles(prev=>prev.filter((_,j)=>j!==i))} style={{border:"none",background:"none",cursor:"pointer",color:CC.light,fontSize:12,padding:"0 2px"}}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {artwork===0.01 && (
              <div style={{marginTop:8}}>
                <SheetPreview
                  longEdge={dimLong} shortEdge={dimShort}
                  foldType={foldType} foldDir={foldDir} panels={fold.panels}
                  onArtwork={(a) => {/* artFiles state if needed */}}
                />
              </div>
            )}

            {artwork===0.02 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:6,fontSize:12,color:CC.dark,lineHeight:1.6}}>
                <div style={{fontWeight:700,marginBottom:4}}>📧 Email Your Artwork</div>
                <div>Send your artwork or a link to your files to:</div>
                <div style={{fontWeight:700,color:CC.primary,fontSize:14,margin:"6px 0"}}>office@priorityprintservice.com</div>
                <div style={{fontSize:11,color:CC.mid}}>Include your order number in the subject line.</div>
              </div>
            )}

            {artwork===0.03 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:6,fontSize:12,color:"#166534",lineHeight:1.6}}>
                <div style={{fontWeight:700,marginBottom:4}}>✓ Artwork Previously Provided</div>
                <div style={{fontSize:11,color:CC.mid}}>We'll proceed with the files on hand. Contact us if you need to make changes.</div>
              </div>
            )}

            {artwork===0.04 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#fefce8",border:"1px solid #fde68a",borderRadius:6}}>
                <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#854d0e"}}>🎨 Canva Design</div>
                <div style={{fontSize:11,color:CC.mid,marginBottom:8,lineHeight:1.5}}>
                  Share an <strong>editor link</strong> to your Canva design so we can download print-ready files.
                </div>
                <label style={{fontSize:11,fontWeight:600,color:CC.dark,display:"block",marginBottom:3}}>Canva Editor Link</label>
                <input type="text" value={canvaLink} onChange={e=>setCanvaLink(e.target.value)} placeholder="https://www.canva.com/design/..." style={{...ST.inp,fontSize:13,marginBottom:8}}/>
                <label style={{fontSize:11,fontWeight:600,color:CC.dark,display:"block",marginBottom:3}}>Special Instructions (optional)</label>
                <textarea value={canvaInstructions} onChange={e=>setCanvaInstructions(e.target.value)} placeholder="Any notes about your design..." rows={3} style={{...ST.inp,fontSize:13,resize:"vertical",fontFamily:"inherit"}}/>
                <div style={{fontSize:10,color:"#b45309",marginTop:6}}>* Canva designs require a digital or hardcopy proof before printing.</div>
              </div>
            )}

            {/* Template download */}
            <div style={{marginTop:10,padding:"10px 14px",background:"#f8f9fa",borderRadius:6,border:`1px solid ${CC.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:CC.dark}}>Artwork Template</div>
                <div style={{fontSize:10,color:CC.light,marginTop:1}}>
                  {dimLong}" × {dimShort}" {fold.panels > 1 ? `· ${fold.panels} panels` : "flat"} · Bleed, trim, safety{fold.panels > 1 ? ", fold lines" : ""}
                </div>
              </div>
              <button type="button" onClick={() => generateBrochureTemplate(dimLong, dimShort, foldType, fold.panels, foldDir, sizeLabel)} style={{
                padding: "6px 14px", fontSize: 11, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                border: `1px solid ${CK.cyan}`, background: CK.cyanLight, color: CK.cyan, whiteSpace: "nowrap",
              }}>📐 Download Template</button>
            </div>

            <div style={{marginTop:10}}/>
            <Sel label="Proofing" badge={<TurnBadge days={r.ti?.proof}/>} value={proof} onChange={v=>setProof(Number(v))}>
              {artwork===0.01 && <option value={0}>Proof & Approve Online (included)</option>}
              {artwork!==0.01 && artwork!==0.04 && <option value={0}>No Proof Needed</option>}
              <option value={0.01}>{`Manual Digital Proof ($${PCF.proof_digital_cost})`}</option>
              <option value={3.01}>{`Hardcopy Proof ($${PCF.proof_hardcopy_cost})`}</option>
            </Sel>
            {proof>=3 && (
              <div style={{marginTop:8,padding:"10px 12px",borderRadius:6,background:"#fefce8",border:"1px solid #fde68a"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#854d0e",marginBottom:6}}>📮 Proof Shipping Address</div>
                <div style={{display:"flex",gap:8,marginBottom:6}}>
                  {[{v:true,l:"Same as shipping address"},{v:false,l:"Different address"}].map(o=>(
                    <button type="button" key={String(o.v)} onClick={()=>setProofAddrSame(o.v)} style={{
                      flex:1,padding:"6px 8px",fontSize:11,fontWeight:600,borderRadius:4,cursor:"pointer",fontFamily:"inherit",
                      border:`1px solid ${proofAddrSame===o.v?"#d97706":"#fde68a"}`,
                      background:proofAddrSame===o.v?"#fef3c7":"#fff",
                      color:proofAddrSame===o.v?"#854d0e":CC.mid,
                    }}>{o.l}</button>
                  ))}
                </div>
                {!proofAddrSame && (
                  <div style={{display:"grid",gap:6}}>
                    <input type="text" value={proofAddr.name} onChange={e=>setProofAddr(p=>({...p,name:e.target.value}))} placeholder="Full Name" style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>
                    <input type="text" value={proofAddr.street} onChange={e=>setProofAddr(p=>({...p,street:e.target.value}))} placeholder="Street Address" style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 80px 80px",gap:6}}>
                      <input type="text" value={proofAddr.city} onChange={e=>setProofAddr(p=>({...p,city:e.target.value}))} placeholder="City" style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>
                      <input type="text" value={proofAddr.state} onChange={e=>setProofAddr(p=>({...p,state:e.target.value}))} placeholder="State" maxLength={2} style={{...ST.inp,fontSize:12,padding:"7px 10px",textTransform:"uppercase"}}/>
                      <input type="text" value={proofAddr.zip} onChange={e=>setProofAddr(p=>({...p,zip:e.target.value}))} placeholder="ZIP" maxLength={10} style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>
                    </div>
                  </div>
                )}
              </div>
            )}
          </Sec>

          {/* SECTION 5: Shipping & Delivery */}
          <Sec title="Shipping & Delivery" open={op.s5} onToggle={()=>tog("s5")} badge={r.shipping?.rushCost>0?`+$${r.shipping.rushCost.toFixed(0)} rush`:null}>
            <div style={{fontSize:11,fontWeight:600,color:CC.mid,textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>Shipping Address</div>
            <div style={r2}>
              <div style={ST.f}><label style={ST.lbl}>Full Name</label><input type="text" value={shipAddr.name} onChange={e=>setShipAddr(p=>({...p,name:e.target.value}))} placeholder="Full Name" style={ST.inp}/></div>
              <div style={ST.f}><label style={ST.lbl}>Company <span style={{fontWeight:400,color:CC.light}}>(optional)</span></label><input type="text" value={shipAddr.company} onChange={e=>setShipAddr(p=>({...p,company:e.target.value}))} placeholder="Company" style={ST.inp}/></div>
            </div>
            <div style={{...ST.f,marginTop:6}}><label style={ST.lbl}>Street Address</label><input type="text" value={shipAddr.street1} onChange={e=>setShipAddr(p=>({...p,street1:e.target.value}))} placeholder="Street address" style={ST.inp}/></div>
            <div style={{...ST.f,marginTop:6}}><label style={ST.lbl}>Address Line 2 <span style={{fontWeight:400,color:CC.light}}>(optional)</span></label><input type="text" value={shipAddr.street2} onChange={e=>setShipAddr(p=>({...p,street2:e.target.value}))} placeholder="Apt, suite, unit, etc." style={ST.inp}/></div>
            <div style={{...r3,marginTop:6}}>
              <div style={ST.f}><label style={ST.lbl}>City</label><input type="text" value={shipAddr.city} onChange={e=>setShipAddr(p=>({...p,city:e.target.value}))} placeholder="City" style={ST.inp}/></div>
              <Sel label="State" value={shipState} onChange={setShipState}>
                {US_STATES.map(st=><option key={st} value={st}>{st}</option>)}
              </Sel>
              <div style={ST.f}><label style={ST.lbl}>ZIP Code</label><input type="text" value={shipAddr.zip} onChange={e=>setShipAddr(p=>({...p,zip:e.target.value.replace(/[^\d-]/g,"").slice(0,10)}))} placeholder="ZIP" maxLength={10} style={ST.inp}/></div>
            </div>

            {r.shipping&&<>
              <div style={{marginTop:10,padding:mob?"8px 10px":"10px 14px",background:CK.cyanLight,borderRadius:5,border:`1px solid ${CK.cyan}33`}}>
                <div style={{fontSize:10.5,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",color:CK.cyan,marginBottom:2}}>Free Delivery Estimate</div>
                <div style={{fontSize:mob?14:15,fontWeight:700,color:CC.dark}}>{r.shipping.freeDeliveryDate}</div>
                <div style={{fontSize:mob?10.5:11,color:CC.mid,marginTop:2}}>{r.shipping.freeDeliveryBizDays} business days</div>
                <div style={{marginTop:6,paddingTop:6,borderTop:"1px solid #b3dff044",display:"flex",flexWrap:"wrap",gap:"2px 16px",fontSize:10.5}}>
                  <span style={{color:CC.mid}}><span style={{fontWeight:600}}>Production starts:</span> {r.shipping.productionStartDate}</span>
                  <span style={{color:CC.mid}}><span style={{fontWeight:600}}>Must ship by:</span> {r.shipping.mustShipDate}</span>
                  <span style={{color: r.shipping.effectiveTransit < r.shipping.transitDays ? "#f59e0b" : CC.light}}>
                    ({r.shipping.effectiveTransit}d {r.shipping.effectiveTransit < r.shipping.transitDays ? "overnight" : "ground"} transit)
                  </span>
                </div>
                <div style={{fontSize:mob?9:10,color:CC.light,marginTop:4,paddingTop:4,borderTop:"1px solid #b3dff044"}}>
                  {mob?<>{r.shipping.earliestDate} earliest</>:<>Earliest possible: <strong style={{color:CC.mid}}>{r.shipping.earliestDate}</strong> ({r.shipping.earliestBizDays} biz days) · Shop: {r.shipping.pastCutoff}</>}
                </div>
              </div>

              <div style={ST.f}>
                <label style={ST.lbl}>Need It Sooner? Pick a Date</label>
                <DatePicker value={needByDate} onChange={setNeedByDate}
                  earliestDate={r.shipping.earliestYMD} freeDate={r.shipping.freeDeliveryYMD}/>
                {needByDate&&r.shipping.needByPast&&<p style={ST.err}>This date has passed — please select a future date</p>}
                {needByDate&&!r.shipping.needByValid&&!r.shipping.needByPast&&<p style={ST.err}>Date must be in the future</p>}
              </div>

              {r.shipping.needByValid&&!r.shipping.tooSoon&&r.shipping.rushMultiplier>1&&(
                <div style={{marginTop:10,padding:"10px 14px",background:CK.rushLight,borderRadius:5,border:`1px solid ${CK.rush}55`}}>
                  <div style={{display:"flex",flexDirection:mob?"column":"row",justifyContent:"space-between",alignItems:mob?"flex-start":"baseline",gap:mob?6:0}}>
                    <div>
                      <div style={{fontSize:10.5,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",color:"#6b8f2b",marginBottom:2}}>Rush Surcharge</div>
                      <div style={{fontSize:11,color:CC.mid}}>{r.shipping.bizDaysToDate} business days vs {r.shipping.freeDeliveryBizDays} free — {r.shipping.rushMultiplier.toFixed(2)}×</div>
                    </div>
                    <div style={{fontSize:mob?22:18,fontWeight:800,color:"#6b8f2b"}}>+${r.shipping.rushCost.toFixed(2)}</div>
                  </div>
                </div>
              )}
              {r.shipping.needByValid&&!r.shipping.tooSoon&&r.shipping.rushMultiplier<=1&&(
                <div style={{marginTop:10,padding:"8px 14px",background:"#e8f5e3",borderRadius:5,border:"1px solid #b5d8a8"}}>
                  <span style={{fontSize:12,color:"#3a7124",fontWeight:600}}>✓ No rush needed — your date is within free delivery window</span>
                </div>
              )}
            </>}
          </Sec>

          {/* 3D Fold Preview */}
          {fold.panels > 1 && (
            <div style={{ ...ST.pnl, marginBottom: 10 }}>
              <div style={{ ...ST.secHdr, cursor: "default" }}>3D Fold Preview — {fold.label}</div>
              <FoldPreview longEdge={dimLong} shortEdge={dimShort} foldType={foldType} panels={fold.panels} foldDir={foldDir} />
            </div>
          )}


        </div>

        {/* Desktop sidebar */}
        {!mob && <div style={{ width: 320, flexShrink: 0, position: "sticky", top: 18 }}>
          <Panel result={result} />
          {projections && <div style={{...ST.pnl,marginTop:10,overflow:"hidden"}}>
            <div style={{padding:"10px 18px",background:"#fafafa",borderBottom:`1px solid ${CC.border}`}}>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:CC.light}}>Quantity Pricing</div>
            </div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
              <thead>
                <tr style={{borderBottom:`1px solid ${CC.border}`}}>
                  <th style={{padding:"7px 18px",textAlign:"left",fontSize:10,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Qty</th>
                  <th style={{padding:"7px 10px",textAlign:"right",fontSize:10,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Unit</th>
                  <th style={{padding:"7px 18px",textAlign:"right",fontSize:10,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Total</th>
                </tr>
              </thead>
              <tbody>
                {projections.map((p,i) => p.total !== null && (
                  <tr key={i} style={{borderBottom:`1px solid ${CC.border}22`,background:p.current?"#f0f9ff":"transparent",cursor:p.current?"default":"pointer"}}
                    onClick={() => {if(!p.current) setQty(p.qty)}}>
                    <td style={{padding:"6px 18px",fontWeight:p.current?700:400,color:p.current?CK.cyan:CC.dark}}>
                      {p.qty.toLocaleString()}{p.current&&<span style={{fontSize:9,color:CK.cyan,marginLeft:4}}>●</span>}
                    </td>
                    <td style={{padding:"6px 10px",textAlign:"right",color:CC.mid,fontWeight:500}}>${p.perUnit.toFixed(2)}</td>
                    <td style={{padding:"6px 18px",textAlign:"right",fontWeight:p.current?700:500,color:p.current?CK.cyan:CC.dark}}>${p.total.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>}
          <button type="button" onClick={() => setShowDebug(p => !p)} style={{ width: "100%", marginTop: 8, padding: "6px", borderRadius: 4, border: `1px solid ${showDebug ? "#555" : "#ddd"}`, background: showDebug ? "#1a1a1a" : "#fafafa", color: showDebug ? "#888" : "#bbb", fontSize: 10, fontWeight: 600, letterSpacing: ".5px", textTransform: "uppercase", cursor: "pointer", fontFamily: "inherit" }}>
            {showDebug ? "▼ Hide" : "▶ Show"} Debug Panel
          </button>
          {showDebug && r.debug && (
            <div style={{ ...ST.pnl, marginTop: 10, padding: 14, fontSize: 11 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: CC.mid }}>Debug</div>
              {Object.entries(r.debug).map(([k, v]) => (
                k !== "P" ? <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "2px 0" }}>
                  <span style={{ color: CC.light }}>{k}</span>
                  <span style={{ fontFamily: "monospace", color: CK.cyan }}>{typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(4)) : String(v)}</span>
                </div> : null
              ))}
              {r.debug.P && <details style={{ marginTop: 8 }}><summary style={{ cursor: "pointer", fontWeight: 600, color: CC.mid }}>Line Items</summary>
                {Object.entries(r.debug.P).filter(([, v]) => Math.abs(v) > 0.005).map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "2px 0" }}>
                    <span style={{ color: CC.light }}>{k}</span>
                    <span style={{ fontFamily: "monospace", color: v < 0 ? "#16a34a" : CK.cyan }}>${v.toFixed(2)}</span>
                  </div>
                ))}
              </details>}
            </div>
          )}
        </div>}
      </div>

      {/* Mobile bottom bar */}
      {mob && <>
        {showDebug && r.debug && <div style={{ position: "fixed", bottom: 76, left: 0, right: 0, zIndex: 39, maxHeight: "60vh", overflowY: "auto", background: CC.white, borderTop: `1px solid ${CC.border}`, boxShadow: "0 -4px 16px rgba(0,0,0,.12)", padding: "10px" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: CC.mid, marginBottom: 6 }}>DEBUG</div>
          {Object.entries(r.debug).filter(([k]) => k !== "P").map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 10, padding: "1px 0" }}>
              <span style={{ color: CC.light }}>{k}</span>
              <span style={{ fontFamily: "monospace", color: CK.cyan }}>{typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(3)) : String(v)}</span>
            </div>
          ))}
        </div>}
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 40, background: CC.white, borderTop: `1px solid ${CC.border}`, boxShadow: "0 -4px 16px rgba(0,0,0,.08)", padding: "8px 10px", paddingBottom: "max(8px, env(safe-area-inset-bottom))" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => setShowDebug(p => !p)}>
              <Panel result={result} compact />
              <div style={{ fontSize: 8, textAlign: "center", color: showDebug ? CK.cyan : CC.light, marginTop: 2, letterSpacing: ".5px", textTransform: "uppercase", fontWeight: 600 }}>{showDebug ? "▼ Hide Debug" : "▲ Debug"}</div>
            </div>
            <button type="button" style={{ flexShrink: 0, padding: "12px 18px", borderRadius: 6, border: "none", background: result?.error ? CC.light : CK.cyan, color: "#fff", fontSize: 14, fontWeight: 700, cursor: result?.error ? "default" : "pointer", fontFamily: "inherit", opacity: result?.error ? .5 : 1 }} disabled={!!result?.error}>Add to Order</button>
          </div>
        </div>
      </>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// STYLES
// ═══════════════════════════════════════════════════════════════
const ST = {
  f:{marginTop:10},
  lbl:{display:"block",fontSize:13,fontWeight:600,color:CC.mid,marginBottom:5},
  sel:{width:"100%",padding:"10px 32px 10px 12px",borderRadius:6,border:`1px solid ${CC.border}`,background:"linear-gradient(180deg, #fff 0%, #f9f9fa 100%)",fontSize:15,color:CC.dark,fontFamily:"inherit",appearance:"none",cursor:"pointer",outline:"none",boxShadow:"0 1px 3px rgba(0,0,0,.04)"},
  selA:{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:CC.light,pointerEvents:"none"},
  inp:{width:"100%",padding:"10px 12px",borderRadius:6,border:`1px solid ${CC.border}`,background:"linear-gradient(180deg, #fff 0%, #f9f9fa 100%)",fontSize:15,color:CC.dark,fontFamily:"inherit",outline:"none",boxSizing:"border-box",boxShadow:"0 1px 3px rgba(0,0,0,.04)"},
  pills:{display:"flex",borderRadius:6,border:`1px solid ${CC.border}`,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.06)"},
  pill:{flex:1,padding:"9px 10px",fontSize:14,fontWeight:500,fontFamily:"inherit",border:"none",borderRight:`1px solid ${CC.border}`,background:`linear-gradient(180deg, #fff 0%, #f7f7f8 100%)`,color:"#555",cursor:"pointer",transition:"all .15s",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"inset 0 1px 0 rgba(255,255,255,.8), inset 0 -1px 0 rgba(0,0,0,.04)"},
  pillOn:{background:`linear-gradient(135deg, ${CK.cyan} 0%, #0070e6 40%, #3d9cff 50%, #0070e6 60%, #005cc8 100%)`,color:"#fff",fontWeight:600,boxShadow:"inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(0,0,0,.15), 0 1px 3px rgba(0,126,255,.2)"},
  row2:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12},
  row3:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12},
  hr:{height:1,background:"#eee",margin:"14px 0 4px"},
  note:{fontSize:12,color:CC.light,margin:"4px 0 0"},
  err:{color:"#dc2626",fontSize:13,margin:"8px 0 0",padding:"8px 10px",background:"#fef2f2",borderRadius:4,border:"1px solid #f5cccc"},
  card:{background:CC.white,borderRadius:6,border:`1px solid ${CC.border}`,overflow:"hidden",marginBottom:10},
  cardH:{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 18px",background:"#fafafa",border:"none",borderBottom:"1px solid #eee",cursor:"pointer",fontFamily:"inherit",fontSize:15},
  pnl:{background:CC.white,borderRadius:6,border:`1px solid ${CC.border}`,overflow:"hidden"},
};

ReactDOM.createRoot(document.getElementById("pps-calculator-root")).render(<App />);
</script>
</body>
</html>
