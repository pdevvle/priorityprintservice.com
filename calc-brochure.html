  // Callback ref, not useRef: the sentinel lives inside Panel, which early-returns
  // before rendering it while the quote is still resolving. A plain ref plus a
  // run-once effect therefore observed nothing and the bar never appeared. A state
  // setter as the ref re-runs the effect the moment the node actually attaches.
  const[totalEl,setTotalEl]=useState(null);
  const[miniBar,setMiniBar]=useState(null); // null | {left,width}
  useEffect(()=>{
    if(mob) { setMiniBar(null); return; }
    const el=totalEl; if(!el||typeof IntersectionObserver==="undefined") return;
    const place=()=>{ const r=railRef.current&&railRef.current.getBoundingClientRect();
      setMiniBar(r?{left:Math.round(r.left),width:Math.round(r.width)}:null); };
    // Show the floating bar only once the price card has been scrolled PAST
    // (top < 0) - not merely because it is still below the fold on load.
    const io=new IntersectionObserver(([e])=>{ if(e.isIntersecting || e.boundingClientRect.top >= 0) setMiniBar(null); else place(); },{threshold:0});
    io.observe(el);
    const onResize=()=>{ setMiniBar(v=>v?(railRef.current?{left:Math.round(railRef.current.getBoundingClientRect().left),width:Math.round(railRef.current.getBoundingClientRect().width)}:v):v); };
    window.addEventListener("resize",onResize);
    return ()=>{ io.disconnect(); window.removeEventListener("resize",onResize); };
  },[mob,totalEl]);

  // Collapsed-header summaries. Built from the SAME option labels the controls use,
  // so a closed section reports exactly the wording the customer picked rather than a
  // paraphrase that could drift out of sync with the dropdowns.
  const secSummary=(()=>{
    const lbl=(arr,v)=>{const o=arr.find(x=>x.val===v);return o?o.label:null;};
    const jn=(jobName||"").trim();
    const sizeStr=sizeMode==="custom"?`${longEdge}×${shortEdge}"`:sizeLabel;
    const foldLbl=(FOLD_TYPES.find(f=>f.val===foldType)||{}).label;
    const cName=c=>c==="bw"?"Greyscale":"Full Color";
    const fin=[
      vivid&&"Enhanced Vivid Print",
      coating>0&&lbl(COATINGS,coating),
      bundling>0&&lbl(BUNDLING,bundling),
      perforation>0&&lbl(PERF_OPTS,perforation),
      roundCorner>0&&lbl(CORNERS,roundCorner),
    ].filter(Boolean);
    const sh=result?.shipping;
    const proofLbl=proof>=3?"Hardcopy Proof":proof>0?"Manual Digital Proof":(artwork===0.01?"Proof & Approve Online":"No Proof Needed");
    return {
      // Job name leads the chips — it is what identifies the job at a glance, and on
      // mobile only the first chip survives the cap. The unlock code is deliberately
      // not echoed back as a chip; it is a code, not a name.
      s1:[jn&&jn!=="%3414"?jn:null,qty.toLocaleString()+" qty",sizeStr,foldType!=="flat"?foldLbl:null].filter(Boolean),
      s2:[cName(frontColor)+(sides===2?" / "+cName(backColor):" · front only"),paper.label],
      s3:fin.length?fin:["No finishing added"],
      s4:[lbl(ART_OPTS,artwork),proofLbl].filter(Boolean),
      // Destination, then the date the customer actually gets. Rushed jobs show the
      // requested need-by date; otherwise the free-delivery date. Same expression the
      // price panel uses, so the chip can never disagree with it.
      s5:shipState
        ? [shipState+(shipZip?(" "+shipZip):"")]
            .concat(sh ? [((sh.rushCost>0 && sh.needByFmt) ? sh.needByFmt : sh.freeDeliveryDate)] : [])
            .filter(Boolean)
        : ["Add a destination"],
    };
  })();

  // Shared by the desktop rail and the mobile flow — one definition so the two
  // renders cannot drift (same reason discountField is a function, not a component).
  const qtyTable=()=>projections && <div style={{...ST.pnl,overflow:"hidden"}}>
    <div style={{padding:"10px 18px",background:"#fafafa",borderBottom:`1px solid ${CC.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
      <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:CC.light,minWidth:0,flex:"1 1 auto",lineHeight:1.5}}>Quantity Pricing
        {(parseFloat(tableAdjPct)||0)!==0&&<span style={{marginLeft:6,color:CK.magenta,letterSpacing:".3px"}}>{(parseFloat(tableAdjPct)>0?"+":"")+parseFloat(tableAdjPct)}% applied</span>}
        {couponActive&&<span style={{marginLeft:6,color:CK.cyan,letterSpacing:".3px",whiteSpace:"nowrap"}}>{coupon.code} applied</span>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0,marginLeft:"auto"}}>
        {debugUnlocked&&(
          <span title="Debug only — marks this table up or down. Does NOT change the order price." style={{display:"inline-flex",alignItems:"center",gap:3}}>
            <span style={{fontSize:9,fontWeight:700,color:CC.light,textTransform:"uppercase",letterSpacing:".4px"}}>Adjust Table</span>
            <input type="text" inputMode="decimal" value={tableAdjPct} onChange={e=>setTableAdjPct(e.target.value)} placeholder="0"
              style={{width:46,padding:"2px 5px",fontSize:11,textAlign:"right",border:`1px solid ${(parseFloat(tableAdjPct)||0)!==0?CK.magenta:CC.border}`,borderRadius:4,fontFamily:"inherit",color:CC.dark,background:"#fff",outline:"none"}}/>
            <span style={{fontSize:10,color:CC.light,fontWeight:600}}>%</span>
          </span>
        )}
        <button type="button" onClick={copyProjections} title="Copy pricing table" style={{background:"none",border:"none",cursor:"pointer",padding:"2px 6px",fontSize:11,color:projCopied?"#16a34a":CC.light,fontFamily:"inherit",fontWeight:600,transition:"color .2s",letterSpacing:".3px"}}>{projCopied?"✓ Copied":"Copy"}</button>
      </div>
    </div>
    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
      <thead>
        <tr style={{borderBottom:`1px solid ${CC.border}`}}>
          <th style={{padding:"7px 18px",textAlign:"left",fontSize:10,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Qty</th>
          <th style={{padding:"7px 10px",textAlign:"right",fontSize:10,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Unit</th>
          <th style={{padding:"7px 18px",textAlign:"right",fontSize:10,fontWeight:600,color:CC.light,textTransform:"uppercase",letterSpacing:".5px"}}>Total</th>
        </tr>
      </thead>
      <tbody>
        {(()=>{
          // Collapsed, the table is a window centered on the selected quantity —
          // two rows either side, held at five rows even when the selection sits
          // at one end, so the neighbours a customer wants to compare are the
          // ones on screen. Expanded shows every tier.
          const rows=projections.filter(p=>p.total!==null);
          const ci=Math.max(0,rows.findIndex(p=>p.current));
          const WIN=2;
          let lo=Math.max(0,ci-WIN), hi=Math.min(rows.length-1,ci+WIN);
          while(hi-lo<WIN*2 && (lo>0||hi<rows.length-1)){ if(lo>0)lo--; else hi++; }
          const shown=projOpen?rows:rows.slice(lo,hi+1);
          // With a code applied every tier is re-priced through the same netOf()
          // the price card uses. The list price stays visible, struck through, so
          // the table still shows what the job costs as well as what they pay.
          const money=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
          return shown.map((p,i)=>{
            const nT=couponActive?netOf(p.total):null;
            const nU=nT!=null&&p.qty>0?nT/p.qty:null;
            return (
            <tr key={p.qty} style={{borderBottom:`1px solid ${CC.border}22`,background:p.current?CC.rowHi:"transparent",cursor:p.current?"default":"pointer"}}
              onClick={() => {if(!p.current) setQty(p.qty)}}>
              <td style={{padding:"6px 18px",fontWeight:p.current?700:400,color:p.current?CK.cyan:CC.dark}}>
                {p.qty.toLocaleString()}{p.current&&<span style={{fontSize:9,color:CK.cyan,marginLeft:4}}>●</span>}
              </td>
              <td style={{padding:"6px 10px",textAlign:"right",color:CC.mid,fontWeight:500}}>
                {nU!=null
                  ? <><div style={{fontSize:10,color:CC.light,textDecoration:"line-through",lineHeight:1.15}}>${p.perUnit.toFixed(2)}</div>
                      <div style={{color:CK.cyan,fontWeight:600,lineHeight:1.2}}>${nU.toFixed(2)}</div></>
                  : <>${p.perUnit.toFixed(2)}</>}
              </td>
              <td style={{padding:"6px 18px",textAlign:"right",fontWeight:p.current?700:500,color:p.current?CK.cyan:CC.dark}}>
                {nT!=null
                  ? <><div style={{fontSize:10,color:CC.light,textDecoration:"line-through",fontWeight:500,lineHeight:1.15}}>${money(p.total)}</div>
                      <div style={{color:CK.cyan,fontWeight:p.current?700:600,lineHeight:1.2}}>${money(nT)}</div></>
                  : <>${money(p.total)}</>}
              </td>
            </tr>
            );
          });
        })()}
      </tbody>
    </table>
    {(()=>{
      const n=projections.filter(p=>p.total!==null).length;
      if(n<=5) return null;
      return <button type="button" onClick={()=>setProjOpen(v=>!v)}
        style={{width:"100%",padding:"9px 10px",border:"none",borderTop:`1px solid ${CC.border}`,
          background:CC.track,color:CK.cyan,fontSize:12,fontWeight:500,letterSpacing:".01em",
          cursor:"pointer",fontFamily:"inherit"}}>
        {projOpen?"Show fewer ▴":"Show more ▾"}
      </button>;
    })()}
  </div>;

  const r2 = mob ? { display: "grid", gridTemplateColumns: "1fr", gap: 8 } : ST.row2;
  const r3 = ST.row3;
  const preset = SIZE_PRESETS.find(s => s.label === sizeLabel);
  // calculate() normalises with Math.max/min, so anything that DESCRIBES the sheet
  // has to as well. Without it, entering Long=4 / Short=12 left the fold buttons
  // reading "Fold Long Side (4\")" and "Fold Short Side (12\")" — the UI
  // contradicting itself while the engine quietly folded the 12" edge.
  const _rawLong = sizeMode === "preset" ? (preset?.long || 11) : longEdge;
  const _rawShort = sizeMode === "preset" ? (preset?.short || 8.5) : shortEdge;
  const dimLong = Math.max(_rawLong, _rawShort);
  const dimShort = Math.min(_rawLong, _rawShort);

  // Guard: the compound right-angle fold is only valid for 11×25.5 non-cardstock.
  // If size/material changes away from that while it's selected, fall back to trifold.
  useEffect(() => {
    if (foldType === "trifold_xbifold") {
      const ok = Math.abs(dimLong - 25.5) < 0.05 && Math.abs(dimShort - 11) < 0.05 && paper.type !== "cardstock";
      if (!ok) { setFoldType("trifold"); return; }
      // Compound fold is inherently a long-edge trifold; force foldDir so the
      // panel-size validation and template orientation stay correct.
      if (foldDir !== "long") setFoldDir("long");
    }
  }, [foldType, foldDir, dimLong, dimShort, paper]);

  useEffect(() => { if (!paper.coatable) setVivid(false); }, [paper]);

  // Perf count + constraint logic
  // The perf crosses one dimension: "length" → longEdge, "width" → shortEdge
  const perfCrossDim = perfDir === "length" ? dimLong : dimShort;
  // Max perfs: need 1" from each edge + 1" between each pair → n perfs need (n+1)" min
  const maxPerfs = Math.max(0, Math.floor(perfCrossDim - 1)); // e.g. 2" → 1 perf, 4" → 2 perfs
  const perfIdx = PERF_OPTS.findIndex(x => x.val === perforation);
  const perfOpt = perfIdx >= 0 ? PERF_OPTS[perfIdx] : PERF_OPTS[0];
  const rawPerfCount = perfOpt.count != null ? perfOpt.count : perfIdx;
  const perfCount = Math.min(rawPerfCount, maxPerfs);
  // Auto-downgrade if dimension too small for selected count
  if (rawPerfCount > maxPerfs && perforation !== 0) {
    var downgraded = PERF_OPTS.find(x => (x.count != null ? x.count : PERF_OPTS.indexOf(x)) === maxPerfs);
    if (downgraded && downgraded.val !== perforation) setPerforation(downgraded.val);
  }
  const perfDefaults = (n) => n === 2 ? [33.3, 66.7] : [50];
  if (dimShort > 14 && perfDir !== "length") setPerfDir("length");
  const prevPerfKey = useRef(`${perfCount}-${perfDir}`);
  if (prevPerfKey.current !== `${perfCount}-${perfDir}`) {
    prevPerfKey.current = `${perfCount}-${perfDir}`;
    setPerfPositions(perfDefaults(perfCount));
  }

  // Z-folds (accordion) show both art sides on outside, so no inside/outside distinction
  const hasInsideOutside = fold.panels > 1 && foldType !== "z3";
  const frontLabel = hasInsideOutside ? "Front / Outside" : "Front";
  const backLabel = hasInsideOutside ? "Back / Inside" : "Back";

  const buildShareUrl = () => {
    const p = new URLSearchParams();
    p.set("qty", qty);
    p.set("sizemode", sizeMode);
    p.set("size", sizeLabel);
    if (sizeMode === "custom") { p.set("long", longEdge); p.set("short", shortEdge); }
    p.set("fold", foldType);
    p.set("folddir", foldDir);
    p.set("color", frontColor);
    p.set("backcolor", backColor);
    p.set("sides", sides);
    p.set("paperval", paper.val);
    p.set("vivid", vivid ? "true" : "false");
    p.set("coating", coating);
    p.set("coatsides", coatSides);
    p.set("bundling", bundling);
    p.set("perf", perforation);
    p.set("perfdir", perfDir);
    if (perfPositions.length && perfCount > 0) p.set("perfpos", perfPositions.slice(0, perfCount).join(","));
    p.set("corner", roundCorner);
    p.set("state", shipState);
    // Carry the quoted total so an admin pasting this link into a product's
    // PPS Defaults gets the price too. Display/"from" figure only — the
    // charged price is always recomputed at add-to-cart.
    if (result && !result.error?.length && result.total > 0) p.set("q", result.total.toFixed(2));
    const base = window.location.origin + window.location.pathname;
    const qs = p.toString();
    return qs ? base + "?" + qs : base;
  };

  const handleShareLink = () => {
    const url = buildShareUrl();
    navigator.clipboard.writeText(url).then(() => {
      setShareCopied(true);
      setTimeout(() => setShareCopied(false), 2000);
    }).catch(() => {
      prompt("Copy this link:", url);
    });
  };

  const handleAddToOrder = async () => {
    if (!result || result.error || submitting) return;
    if (missingDest) { openShipping(); return; }
    // Artwork must be approved before it can be ordered. Until now nothing
    // enforced this: `approved` lives inside the artwork component and the only
    // thing crossing to the parent was {type, list}, so an order placed without
    // ever opening the proof was indistinguishable from an approved one. It
    // also meant no approval package — no print-ready PDF, no preview, and no
    // manifest recording the customer's crop, scale or reframe — reached Drive,
    // leaving production with the raw upload and no record of what was agreed.
    // Orders 87042 and 87045 are both that shape.
    //
    // Only files awaiting approval are blocked: "existing" is artwork already
    // approved on a previous order (reorder), and "none" is a customer sending
    // art later, neither of which has a proof to approve here.
    // Gate applies ONLY to free online proofing (proof === 0), where the
    // customer's own on-screen approval is the sign-off. Manual digital and
    // hardcopy proofs are approved by STAFF after the order — gating those on
    // an Approve button that never renders made paid-proofing uploads
    // impossible to order.
    if (artFiles && artFiles.type === "files" && !artFiles.approved && proof === 0) {
      alert("Please approve your artwork proof before ordering.\n\n"
        + "Open the proof in Artwork & Proofing, check your artwork against the bleed, "
        + "trim and safety guides, then click APPROVE NOW.\n\n"
        + "This is what we print from, so we need your sign-off on it.");
      return;
    }
    setSubmitting(true);
    setUploadProgress(null);
    const config = {
      jobName, qty,
      sizeMode, sizeLabel, longEdge, shortEdge,
      foldType, foldDir, frontColor, backColor, sides,
      paper, vivid, coating, coatSides, bundling,
      perforation, perfDir, perfPositions, roundCorner,
      artwork, bleed, proof,
      proofAddrSame, proofAddr,
      canvaLink, canvaInstructions,
      shipState, shipAddr, needByDate,
    };
    const summary  = buildSummary(config, result);
    const metadata = buildMetadata(config, result);
    const rushCost = result.shipping?.rushCost || 0;
    await submitToWooCommerce(result.total, summary, metadata, rushCost, artFiles, setUploadProgress, coupon&&coupon.code?coupon.code:"");
    // If still here (standalone mode), re-enable
    setUploadProgress(null);
    setSubmitting(false);
  };

  const handleQuestionSubmit = async (e) => {
    e.preventDefault();
    if (qStatus === "sending" || qStatus === "sent") return;
    if (!qName.trim() || !qEmail.trim() || !qMessage.trim()) {
      setQStatus("error"); setQErrorMsg("Please fill in name, email, and your question."); return;
    }
    setQStatus("sending"); setQErrorMsg("");
    const PPS = window.PPS_CONFIG || {};
    const fd = new FormData();
    fd.append("action", "pps_quote_question");
    fd.append("nonce", PPS.cartNonce || "");
    fd.append("name", qName); fd.append("email", qEmail); fd.append("phone", qPhone);
    fd.append("message", qMessage); fd.append("hp", "");
    // Build a small inline summary — brochure doesn't have a buildSummary helper
    let summary = "";
    try {
      const lines = [];
      const sizeStr = sizeMode === "custom" ? `${longEdge}×${shortEdge} custom` : sizeLabel;
      lines.push(`${qty.toLocaleString()} × ${sizeStr}`);
      const foldName = (FOLD_TYPES.find(f => f.val === foldType) || {label: foldType}).label;
      lines.push(`Fold: ${foldName}`);
      lines.push(`Paper: ${paper.label}`);
      const cName = c => c === "bw" ? "Black & White" : "Full Color";
      lines.push(`Front: ${cName(frontColor)}` + (sides === 2 ? ` · Back: ${cName(backColor)}` : " · Single-sided"));
      if (vivid) lines.push("Enhanced Vivid Print");
      if (coating > 0) {
        const ct = COATINGS.find(o => o.val === coating);
        if (ct) lines.push(`Coating: ${ct.label}`);
      }
      if (bundling > 0) {
        const b = BUNDLING.find(o => o.val === bundling);
        if (b) lines.push(`Bundling: ${b.label}`);
      }
      if (perforation > 0) {
        const p = PERF_OPTS.find(o => o.val === perforation);
        if (p) lines.push(`Perforation: ${p.label}`);
      }
      if (roundCorner > 0) {
        const r = CORNERS.find(o => o.val === roundCorner);
        if (r) lines.push(`Round Corner: ${r.label}`);
      }
      lines.push(`Ship to: ${shipState}`);
      summary = lines.join("\n");
    } catch (_) {}
    fd.append("summary", summary);
    fd.append("total", String(result?.total || 0));
    fd.append("perUnit", String(result?.perUnit || 0));
    fd.append("qty", String(result?.qty || qty || 0));
    fd.append("days", String(result?.days || 0));
    fd.append("calcType", "brochure");
    fd.append("calcLabel", "Brochure / Flat Print");
    fd.append("presetSlug", PPS.presetSlug || "");
    fd.append("reorderUrl", buildShareUrl());
    try {
      const resp = await fetch(PPS.ajaxUrl || "/wp-admin/admin-ajax.php", { method: "POST", body: fd, credentials: "same-origin" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const j = await resp.json();
      if (j && j.success) { setQStatus("sent"); }
      else { setQStatus("error"); setQErrorMsg((j && j.data && j.data.message) || "Submission failed. Please try again."); }
    } catch (err) {
      setQStatus("error"); setQErrorMsg("Network error. Please try again.");
    }
  };

  const resetQuestionForm = () => {
    setQOpen(false);
    setTimeout(() => { setQName(""); setQEmail(""); setQPhone(""); setQMessage(""); setQStatus("idle"); setQErrorMsg(""); }, 200);
  };

  return (
    <div style={{ minHeight: "100vh", background: CC.bg, fontFamily: "var(--pps-sans)", color: CC.dark }}>
      <style>{`
                button:focus-visible,[role="button"]:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #1d6fe0 !important;outline-offset:2px;border-radius:3px;}
@media(max-width:700px){
          /* 60px, not 44, to match the pill toggle beside them — those escape this
             clamp because they carry no .pps-pill class, so a column of controls was
             reading as two different form systems. 44 is also only the bare iOS
             minimum for a tap target. tel/email added so the address form matches. */
          select,input[type="text"],input[type="number"],input[type="tel"],input[type="email"]{font-size:16px!important;padding:10px 12px!important;min-height:60px!important}
          .pps-sec-hdr{padding:12px 14px!important;font-size:13px!important}
          .pps-sec-body{padding:12px 14px!important}
          .pps-pill{padding:10px 6px!important;font-size:12px!important;min-height:44px!important}
          .pps-ship-box{font-size:10px!important}
        }
      `}</style>

      {/* Hero header — eyebrow + display + tagline */}
      <section style={{maxWidth:1180,margin:"0 auto",padding:mob?"18px 14px 6px":"34px 28px 18px"}}>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",flexWrap:"wrap",gap:mob?10:20}}>
          <div style={{flex:"1 1 320px",minWidth:0}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:CK.magenta}}>Configure · Brochure & Flat Print</div>
            <h1 style={{fontFamily:"var(--pps-display)",fontWeight:800,lineHeight:1,letterSpacing:"-0.02em",color:CC.dark,textTransform:"uppercase",margin:mob?"8px 0 0":"10px 0 0",maxWidth:720,fontSize:mob?28:44}}>
              Brochures & Flat<br/>
              <span style={{color:CK.cyan}}>Instant Quote</span>
            </h1>
          </div>
        </div>
      </section>

      {mob && <MobilePreviewBar longEdge={previewLong} shortEdge={previewShort} quantity={qty} panels={fold.panels} foldType={foldType} frontArt={coverArt} frontColor={frontColor} sides={sides} onOpenPreview={openPreview}/>}

      <div style={{ maxWidth: 1180, margin: "0 auto", padding: mob ? "0 10px 140px" : "0 24px 80px", display: "flex", gap: 20, alignItems: mob ? "stretch" : "flex-start", flexDirection: mob ? "column" : "row" }}>
        <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: mob ? 6 : 10, width: mob ? "100%" : undefined, paddingBottom: mob ? 80 : 0 }}>

          {/* Settings — preferences live behind a gear so they read as settings
              rather than as more configuration choices competing with the form. */}
          <div data-pps-settings style={{position:"relative",display:"flex",justifyContent:"flex-end",padding:mob?"2px 2px 0":"0 2px 2px"}}>
            <button type="button" onClick={()=>setSetOpen(o=>!o)} aria-haspopup="true" aria-expanded={setOpen} aria-label="Form settings"
              title="Form settings"
              style={{display:"inline-flex",alignItems:"center",gap:6,padding:"6px 10px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",
                fontSize:12,fontWeight:600,color:setOpen?CC.dark:CC.light,background:setOpen?CC.track:"transparent",
                border:`1px solid ${setOpen?CC.border:"transparent"}`,transition:"all .15s ease"}}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              Form settings
            </button>
            {setOpen&&(
              <div role="menu" style={{position:"absolute",top:"100%",right:0,marginTop:6,zIndex:60,minWidth:250,
                background:CC.white,border:`1px solid ${CC.border}`,borderRadius:12,
                boxShadow:"0 4px 6px rgba(16,24,40,.06), 0 12px 28px rgba(16,24,40,.14)",padding:6}}>
                {[
                  {k:"theme", label:"Dark mode", hint:"Easier on the eyes in low light.",
                   on:theme==="dark", set:()=>setTheme(t=>t==="dark"?"light":"dark")},
                  {k:"solo", label:"One section at a time", hint:"Opening a section collapses the others.",
                   on:soloSec, set:()=>setSoloSec(v=>!v)},
                ].map(o=>(
                  <button key={o.k} type="button" role="menuitemcheckbox" aria-checked={o.on} onClick={o.set}
                    style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"9px 10px",borderRadius:8,
                      border:"none",background:"transparent",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                    <span style={{flex:1,minWidth:0}}>
                      <span style={{display:"block",fontSize:13,fontWeight:600,color:CC.dark}}>{o.label}</span>
                      <span style={{display:"block",fontSize:11,color:CC.light,marginTop:1}}>{o.hint}</span>
                    </span>
                    <span style={{flex:"none",width:34,height:20,borderRadius:99,position:"relative",
                      background:o.on?CK.cyan:CC.border,
                      transition:"background .8s cubic-bezier(.4,0,.2,1) .25s"}}>
                      {/* Straight slide: a quarter-second beat after the click, then the knob
                          travels for .8s. Symmetric easing, no overshoot and no flip, so it
                          reads as the control moving rather than performing. The track color
                          runs on the same delay and duration so the two move as one. */}
                      <span style={{position:"absolute",top:2,left:o.on?16:2,width:16,height:16,borderRadius:99,
                        background:"#fff",boxShadow:"0 1px 2px rgba(16,24,40,.35)",
                        transition:"left .8s cubic-bezier(.4,0,.2,1) .25s"}}/>
                    </span>
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* SECTION 1: Size & Quantity */}
          <Sec step={1} summary={secSummary.s1} title={_DR.forceFold ? "Size & Quantity" : "Size, Quantity & Fold"} open={op.s1} onToggle={() => tog("s1")} badge={sizeMode === "custom" ? `${longEdge}×${shortEdge}"` : sizeLabel}
            headerField={
              /* Job Name lives in the header rather than the body: it names the whole
                 job, not the trim size, and it is the one field an operator scans for.
                 Styled as an editable title — chip typography, no chrome at rest —
                 so it reads as part of the heading instead of a form box wedged into
                 it. Width is fluid; a fixed width overflowed narrow phones. The 16px
                 mobile size is deliberate: anything smaller and iOS zooms on focus.
                 When the section collapses the value returns as a summary chip. */
              <input id="pps-job-name" className="pps-jobtitle" type="text" value={jobName}
                onChange={e=>setJobName(e.target.value)}
                placeholder="Job name/PO" aria-label="Job name or PO number"
                style={{...CHIP,width:"100%",minWidth:0,maxWidth:"none",display:"block",
                  padding:mob?"6px 12px":"6px 13px",fontSize:mob?16:12,
                  textAlign:"center",outline:"none",textOverflow:"ellipsis"}}/>
                  /* background + border live in .pps-jobtitle, not here: an inline
                     background would outrank the :hover and :focus rules. */
            }>
            <TxtNum label={<Tip k="quantity">Quantity</Tip>} value={qty} onChange={v => setQty(Math.max(1, Math.round(v)))} min={1} />
            {_DR.sizes
              ? <Sel label={_DR.forceFold ? "Size" : "Flat/Unfolded Size"} value={sizeLabel} onChange={setSizeLabel}>{_SIZES.filter(s => !s.square).map(s => <option key={s.label} value={s.label}>{s.label}</option>)}{_SIZES.some(s => s.square) && <optgroup label="Square">{_SIZES.filter(s => s.square).map(s => <option key={s.label} value={s.label}>{s.label}</option>)}</optgroup>}</Sel>
              : <div style={{ display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap" }}>
                  <div style={{ flex: "1 1 220px", minWidth: 0 }}>
                    {sizeMode === "preset"
                      ? <Sel label={_DR.forceFold ? "Size" : "Flat/Unfolded Size"} value={sizeLabel} onChange={setSizeLabel}>{_SIZES.filter(s => !s.square).map(s => <option key={s.label} value={s.label}>{s.label}</option>)}{_SIZES.some(s => s.square) && <optgroup label="Square">{_SIZES.filter(s => s.square).map(s => <option key={s.label} value={s.label}>{s.label}</option>)}</optgroup>}</Sel>
                      : <div style={r2}>
                          <TxtNum label={<Tip k="custom_long">Long Edge (in)</Tip>} value={longEdge} onChange={setLongEdge} min={2} max={27} />
                          <TxtNum label={<Tip k="custom_short">Short Edge (in)</Tip>} value={shortEdge} onChange={setShortEdge} min={2} max={12.5} />
                        </div>
                    }
                  </div>
                  <div style={{ flexShrink: 0 }}>
                    <Pil label={<Tip k="size_mode">Size Mode</Tip>} value={sizeMode} onChange={setSizeMode} options={[{ t: "Preset Sizes", v: "preset" }, { t: "Custom Size", v: "custom" }]} />
                  </div>
                </div>
            }
            {!_DR.forceFold && <>
            <div style={ST.hr} />
            <Sel label={<Tip k="fold_type">Fold Type</Tip>} value={foldType} onChange={setFoldType}>
              {availableFoldTypes(dimLong, dimShort, paper.type === "cardstock").map(f => <option key={f.val} value={f.val}>{f.label}</option>)}
            </Sel>
            {fold.panels > 1 && sizeMode === "custom" && (
              <Pil label={<Tip k="fold_direction">Fold Direction</Tip>} value={foldDir} onChange={setFoldDir} options={[
                { t: `Fold Long Side (${dimLong}")`, v: "long" },
                { t: `Fold Short Side (${dimShort}")`, v: "short" },
              ]} />
            )}
            {fold.panels > 1 && (() => {
              const foldDim = foldDir === "long" ? dimLong : dimShort;
              const staticDim = foldDir === "long" ? dimShort : dimLong;
              const panelSize = foldDim / fold.panels;
              const tooSmall = panelSize < 2;
              const throatExceeded = foldDir === "short" && dimLong > 13;
              return <>
                <div style={{ marginTop: 8, padding: "8px 12px", background: tooSmall || throatExceeded ? "#fef2f2" : CC.tint, borderRadius: 9, fontSize: 11, color: tooSmall || throatExceeded ? "#b91c1c" : CC.mid, border: tooSmall || throatExceeded ? "1px solid #f5cccc" : "none" }}>
                  Folded size: <strong>{fmtInch(staticDim)}" × {fmtInch(panelSize)}"</strong> ({fold.panels} panels)
                  {tooSmall && <span style={{marginLeft:8,fontWeight:700}}>— Panel too small (min 2")</span>}
                  {throatExceeded && <span style={{marginLeft:8,fontWeight:700}}>— Cannot fold, unfolded edge exceeds 13 inches</span>}
                </div>
                {sizeMode !== "custom" && <p style={{fontSize:10,color:CC.light,margin:"4px 0 0"}}>All folds assume the longest edge is being folded. Use custom size to fold the short edge.</p>}
                <p style={{fontSize:10,color:CC.light,margin:"4px 0 0"}}>You can preview the fold once artwork is uploaded.</p>
              </>;
            })()}
            </>}
          </Sec>

          {/* SECTION 2: Printing & Paper */}
          <Sec step={2} summary={secSummary.s2} title="Printing & Paper" open={op.s2} onToggle={() => tog("s2")}>
            <Pil label={<Tip k="sides">Sides Printed</Tip>} value={sides} onChange={v => setSides(Number(v))} options={[{ t: "Both Sides", v: 2 }, { t: "Front Only", v: 1 }]} />
            <div style={{ ...r2, marginTop: 10 }}>
              <Pil label={frontLabel + " Color"} value={frontColor} onChange={setFrontColor} options={[
                { t: "Full Color", v: "color", onStyle: { background: "linear-gradient(135deg, #00aeef 0%, #ec008c 55%, #fff200 100%)", color: "#fff", fontWeight: 600, textShadow: "0 1px 4px rgba(0,0,0,.5)" } },
                { t: "Greyscale", v: "bw", onStyle: { background: "linear-gradient(135deg, #888 0%, #444 50%, #999 100%)", color: "#fff", fontWeight: 600 } }
              ]} />
              {sides === 2 && <Pil label={backLabel + " Color"} value={backColor} onChange={setBackColor} options={[
                { t: "Full Color", v: "color", onStyle: { background: "linear-gradient(135deg, #00aeef 0%, #ec008c 55%, #fff200 100%)", color: "#fff", fontWeight: 600, textShadow: "0 1px 4px rgba(0,0,0,.5)" } },
                { t: "Greyscale", v: "bw", onStyle: { background: "linear-gradient(135deg, #888 0%, #444 50%, #999 100%)", color: "#fff", fontWeight: 600 } }
              ]} />}
            </div>
            <div style={ST.hr} />
            <Sel label={<Tip k="paper">Paper</Tip>} value={paper.val} onChange={v => { const f = ALL_PAPERS.find(p => String(p.val) === v); if (f) setPaper(f); }}>
              {PAPERS_NC.map(p => <option key={p.val} value={p.val}>{paperDot(p) + p.label + paperSpec(p)}</option>)}
              <optgroup label="Cardstock">{PAPERS_CS.map(p => <option key={p.val} value={p.val}>{paperDot(p) + p.label + paperSpec(p)}</option>)}</optgroup>
            </Sel>
            <PaperNote p={paper} pool={paper.type === "cardstock" ? "cs" : "nc"} legend />
          </Sec>

          {/* SECTION 3: Addons */}
          <Sec step={3} summary={secSummary.s3} title="Finishing & Addons" open={op.s3} onToggle={() => tog("s3")}>
            {!_DR.forceFold && <>
            <Sel label={<Tip k="fold_type">Fold Type</Tip>} value={foldType} onChange={setFoldType}>
              {availableFoldTypes(dimLong, dimShort, paper.type === "cardstock").map(f => <option key={f.val} value={f.val}>{f.label}</option>)}
            </Sel>
            <div style={ST.hr} />
            </>}
            {/* Hidden when unavailable rather than shown-disabled-with-explainer. */}
            {!_HA.vivid && (_AD.vivid !== false || vivid === true) && r.vividOK && <Pil label={<RichTip tipKey="vivid">Print Quality</RichTip>} value={vivid} onChange={v => setVivid(v === true || v === "true")} options={[{ t: "Standard", v: false }, { t: "Enhanced Vivid", v: true }]} />}
            {!_HA.vivid && (_AD.vivid !== false || vivid === true) && r.vividOK && <div style={ST.hr} />}
            {(_AD.coating !== false || coating > 0) && (paper.coatable ? (
              <>
                <Sel label={<RichTip tipKey="coating">Additional Coating</RichTip>} value={coating} onChange={v => setCoating(Number(v))}>
                  {COATINGS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
                </Sel>
                {coating > 0 && (
                  <>
                    <Pil label={<Tip k="coating_sides">Sides to Coat</Tip>} value={coatSides} onChange={v => setCoatSides(Number(v))} options={
                      paper.val === 1.01
                        ? [{ t: "Front Only", v: 1 }]
                        : COAT_SIDES.map(o => ({ t: o.label, v: o.val }))
                    } />
                    {paper.val === 1.01 && coatSides !== 1 && <p style={ST.err}>14pt C1S can only be coated on the front side.</p>}
                  </>
                )}
              </>
            ) : (
              <div style={{...ST.f, opacity: 0.4}}><label style={ST.lbl}><RichTip tipKey="coating">Additional Coating</RichTip></label><div style={{padding:"8px 12px",borderRadius:9,border:`1px solid ${CC.border}`,background:CC.track,fontSize:13,color:CC.light}}>Not available for this paper type</div></div>
            ))}
            {(_AD.coating !== false || coating > 0) && (!_HA.bundling || !_HA.perforation || !_HA.rc) && <div style={ST.hr} />}
            {!_HA.bundling && (_AD.bundling !== false || bundling > 0) && <Sel label={<RichTip tipKey="bundling">Bundling</RichTip>} value={bundling} onChange={v => setBundling(Number(v))}>
              {BUNDLING.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
            </Sel>}
            {!_HA.perforation && (_AD.perforation !== false || perforation > 0) && <Sel label={<RichTip tipKey="perforation">Perforation</RichTip>} value={perforation} onChange={v => setPerforation(Number(v))}
              note={dimShort > 14 && perfCount > 0 ? `14" throat — ${dimShort}" perf only` : (perfCount > 0 && perfCrossDim < 4 ? `${perfCrossDim}" too short for 2 perfs` : undefined)}>
              {PERF_OPTS.filter(o => {
                var c = o.count != null ? o.count : PERF_OPTS.indexOf(o);
                return c <= maxPerfs;
              }).map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
            </Sel>}
            {!_HA.perforation && (_AD.perforation !== false || perforation > 0) && perfCount > 0 && dimShort <= 14 && (
              <Pil label={<Tip k="perf_direction">Perf Direction</Tip>} value={perfDir} onChange={setPerfDir} options={[
                { t: `${dimShort}" perf`, v: "length" },
                { t: `${dimLong}" perf`, v: "width" },
              ]} />
            )}
            {!_HA.rc && (_AD.rc !== false || roundCorner > 0) && foldType === "flat" && (
              <Sel label={<RichTip tipKey="round_cornering">Round Cornering</RichTip>} value={roundCorner} onChange={v => setRoundCorner(Number(v))}>
                {CORNERS.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
              </Sel>
            )}
          </Sec>

          {/* SECTION 4: Artwork & Proofing */}
          {/* keepMounted: the uploader inside owns the extracted pages, the original
              File and the proof approval — unmounting on collapse would throw the
              upload away. */}
          <Sec step={4} summary={secSummary.s4} title="Artwork & Proofing" open={op.s4} onToggle={()=>tog("s4")} keepMounted>

            <Sel label={<Tip k="artwork_design">Artwork & Design</Tip>} badge={<TurnBadge days={(r.ti?.artDesign||0)+(r.ti?.artEdits||0)}/>} value={artwork} onChange={v=>{setArtwork(Number(v)); if(Number(v)===0.04) setProof(proof===0?0.01:proof);}}>{ART_OPTS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}</Sel>

            {artwork>=2&&artwork<4&&<TxtNum label={<Tip k="pages_edits">Pages Needing Edits</Tip>} value={artEditPages} onChange={setArtEditPages} min={0}/>}

            {artwork>=2 && (
              <div style={{marginTop:8,padding:"12px 14px",borderRadius:6,background:"#f8f8fa",border:`1px solid ${CC.border}`}}>
                <div style={{fontSize:12,fontWeight:700,color:CC.dark,marginBottom:4}}>📎 Upload Reference Files (optional)</div>
                <div style={{fontSize:11,color:CC.mid,marginBottom:8,lineHeight:1.4}}>
                  {artwork>=4 ? "Attach any reference materials, logos, content, or inspiration for your new design."
                    : "Attach your artwork files or references for the pages needing edits."}
                </div>
                <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px",borderRadius:6,border:`2px dashed ${CC.border}`,cursor:"pointer",background:"#fff",fontSize:12,fontWeight:600,color:CC.mid}}>
                  <span>Choose Files</span>
                  <input type="file" multiple accept=".pdf,.ai,.psd,.tif,.tiff,.jpg,.jpeg,.png,.doc,.docx,.zip" onChange={e=>{
                    const files=Array.from(e.target.files||[]);
                    if(files.length) setReferenceFiles(prev=>[...prev,...files.map(f=>({name:f.name,size:f.size,file:f}))]);
                    e.target.value="";
                  }} style={{display:"none"}}/>
                </label>
                {referenceFiles.length>0&&(
                  <div style={{marginTop:6,display:"flex",flexDirection:"column",gap:3}}>
                    {referenceFiles.map((f,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:CC.mid,padding:"4px 8px",background:"#fff",borderRadius:4,border:`1px solid ${CC.border}`}}>
                        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</span>
                        <span style={{fontSize:10,color:CC.light,flexShrink:0}}>{(f.size/1024).toFixed(0)} KB</span>
                        <button type="button" onClick={()=>setReferenceFiles(prev=>prev.filter((_,j)=>j!==i))} style={{border:"none",background:"none",cursor:"pointer",color:CC.light,fontSize:12,padding:"0 2px"}}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {artwork===0.01 && (
              <div style={{marginTop:8}}>
                <SheetPreview
                  longEdge={dimLong} shortEdge={dimShort}
                  paperIsCardstock={paper.type === "cardstock"}
                  foldType={foldType} foldDir={foldDir} panels={fold.panels}
                  perfCount={perfCount} perfDir={perfDir}
                  perfPositions={perfPositions} onPerfPositions={setPerfPositions}
                  frontColor={frontColor} backColor={backColor} sides={sides}
                  sizeMode={sizeMode}
                  onFoldChange={setFoldType} onFoldDirChange={setFoldDir}
                  onSizeOverride={(w, h) => {
                    setSizeMode("custom");
                    setSizeLabel("Custom Size");
                    var long = Math.max(w, h), short = Math.min(w, h);
                    setLongEdge(parseFloat(long.toFixed(3)));
                    setShortEdge(parseFloat(short.toFixed(3)));
                  }}
                  onArtwork={setArtFiles}
                  onCoverArt={setCoverArt}
                  openPreviewModalRef={openPreviewModalRef}
                  debug={proofDebug}
                  staffUnlocked={debugUnlocked}
                />
              </div>
            )}

            {artwork===0.02 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:6,fontSize:12,color:CC.dark,lineHeight:1.6}}>
                <div style={{fontWeight:700,marginBottom:4}}>📧 Email Your Artwork</div>
                <div>Send your artwork or a link to your files to:</div>
                <div style={{fontWeight:700,color:CC.primary,fontSize:14,margin:"6px 0"}}>office@priorityprintservice.com</div>
                <div style={{fontSize:11,color:CC.mid}}>Include your order number in the subject line.</div>
              </div>
            )}

            {artwork===0.03 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:6,fontSize:12,color:"#166534",lineHeight:1.6}}>
                <div style={{fontWeight:700,marginBottom:4}}>✓ Artwork Previously Provided</div>
                <div style={{fontSize:11,color:CC.mid}}>We'll proceed with the files on hand. Contact us if you need to make changes.</div>
              </div>
            )}

            {artwork===0.04 && (
              <div style={{marginTop:8,padding:"12px 14px",background:"#fefce8",border:"1px solid #fde68a",borderRadius:6}}>
                <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#854d0e"}}>🎨 Canva Design</div>
                <div style={{fontSize:11,color:CC.mid,marginBottom:8,lineHeight:1.5}}>
                  Share an <strong>editor link</strong> to your Canva design so we can download print-ready files.
                </div>
                <label style={{fontSize:11,fontWeight:600,color:CC.dark,display:"block",marginBottom:3}}>Canva Editor Link</label>
                <input type="text" value={canvaLink} onChange={e=>setCanvaLink(e.target.value)} placeholder="https://www.canva.com/design/..." style={{...ST.inp,fontSize:13,marginBottom:8}}/>
                <label style={{fontSize:11,fontWeight:600,color:CC.dark,display:"block",marginBottom:3}}>Special Instructions (optional)</label>
                <textarea value={canvaInstructions} onChange={e=>setCanvaInstructions(e.target.value)} placeholder="Any notes about your design..." rows={3} style={{...ST.inp,fontSize:13,resize:"vertical",fontFamily:"inherit"}}/>
                <div style={{fontSize:10,color:"#b45309",marginTop:6}}>* Canva designs require a digital or hardcopy proof before printing.</div>
              </div>
            )}

            {/* Template download */}
            <div style={{marginTop:10,padding:"10px 14px",background:"#f8f9fa",borderRadius:6,border:`1px solid ${CC.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:CC.dark}}>Artwork Template</div>
                <div style={{fontSize:10,color:CC.light,marginTop:1}}>
                  {dimLong}" × {dimShort}" {fold.panels > 1 ? `· ${fold.panels} panels` : "flat"} · Bleed, trim, safety{fold.panels > 1 ? ", fold lines" : ""}
                </div>
              </div>
              <button type="button" onClick={() => generateBrochureTemplate(dimLong, dimShort, foldType, fold.panels, foldDir, (sizeMode === "custom" ? `${dimShort}×${dimLong}` : sizeLabel), perfCount, perfDir, perfPositions)} style={{
                padding: "6px 14px", fontSize: 11, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                border: `1px solid ${CK.cyan}55`, background: CC.tint, color: CK.cyan, whiteSpace: "nowrap",
              }}>📐 Download Template</button>
            </div>

            <div style={{marginTop:10}}/>
            <Sel label={<Tip k="proofing">Proofing</Tip>} badge={<TurnBadge days={r.ti?.proof}/>} value={proof} onChange={v=>setProof(Number(v))}>
              {artwork===0.01 && <option value={0}>Proof & Approve Online (included)</option>}
              {artwork!==0.01 && artwork!==0.04 && <option value={0}>No Proof Needed</option>}
              <option value={0.01}>{`Manual Digital Proof ($${PCF.proof_digital_cost})`}</option>
              <option value={3.01}>{`Hardcopy Proof ($${PCF.proof_hardcopy_cost})`}</option>
            </Sel>
            {proof>=3 && (
              <div style={{marginTop:8,padding:"10px 12px",borderRadius:6,background:"#fefce8",border:"1px solid #fde68a"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#854d0e",marginBottom:6}}>📮 Proof Shipping Address</div>
                <div style={{display:"flex",gap:8,marginBottom:6}}>
                  {[{v:true,l:"Same as shipping address"},{v:false,l:"Different address"}].map(o=>(
                    <button type="button" key={String(o.v)} onClick={()=>setProofAddrSame(o.v)} style={{
                      flex:1,padding:"6px 8px",fontSize:11,fontWeight:600,borderRadius:4,cursor:"pointer",fontFamily:"inherit",
                      border:`1px solid ${proofAddrSame===o.v?"#d97706":"#fde68a"}`,
                      background:proofAddrSame===o.v?"#fef3c7":"#fff",
                      color:proofAddrSame===o.v?"#854d0e":CC.mid,
                    }}>{o.l}</button>
                  ))}
                </div>
                {!proofAddrSame && (
                  <form autoComplete="on" onSubmit={e=>e.preventDefault()} style={{display:"grid",gap:6}}>
                    <input type="text" name="proof-name" autoComplete="name" value={proofAddr.name} onChange={e=>setProofAddr(p=>({...p,name:e.target.value}))} placeholder="Full Name" style={{...ST.inp,fontSize:12,padding:"7px 10px"}}/>

          {/* SECTION 5: Shipping & Delivery */}
          <Sec step={5} summary={secSummary.s5} title="Shipping & Delivery" open={op.s5} onToggle={()=>tog("s5")} badge={r.shipping?.rushCost>0?`+$${r.shipping.rushCost.toFixed(0)} rush`:null}>
            <form autoComplete="on" onSubmit={e=>e.preventDefault()}>

            <div style={r2}>
              <div style={ST.f}><label style={ST.lbl} htmlFor="pps-ship-name">Full Name</label><input id="pps-ship-name" type="text" name="shipping-name" autoComplete="shipping name" value={shipAddr.name} onChange={e=>setShipAddr(p=>({...p,name:e.target.value}))} placeholder="Full Name" style={ST.inp}/></div>
              <div style={ST.f}><label style={ST.lbl} htmlFor="pps-ship-company">Company <span style={{fontWeight:400,color:CC.light}}>(optional)</span></label><input id="pps-ship-company" type="text" name="shipping-organization" autoComplete="shipping organization" value={shipAddr.company} onChange={e=>setShipAddr(p=>({...p,company:e.target.value}))} placeholder="Company" style={ST.inp}/></div>
            </div>
            <div style={{...ST.f,marginTop:6}}><label style={ST.lbl} htmlFor="pps-ship-street1">Street Address</label><input id="pps-ship-street1" type="text" name="shipping-address-line1" autoComplete="shipping address-line1" value={shipAddr.street1} onChange={e=>setShipAddr(p=>({...p,street1:e.target.value}))} placeholder="Street address" style={ST.inp}/></div>
            <div style={{...ST.f,marginTop:6}}><label style={ST.lbl} htmlFor="pps-ship-street2">Address Line 2 <span style={{fontWeight:400,color:CC.light}}>(optional)</span></label><input id="pps-ship-street2" type="text" name="shipping-address-line2" autoComplete="shipping address-line2" value={shipAddr.street2} onChange={e=>setShipAddr(p=>({...p,street2:e.target.value}))} placeholder="Apt, suite, unit, etc." style={ST.inp}/></div>
            {/* City/State/ZIP share a row: 2fr 1fr 1fr on desktop, two columns on
                mobile with City spanning both. Cells zero their own marginTop so the
                grid gap governs alignment. */}
            <div style={{display:"grid",gridTemplateColumns:mob?"1fr 1fr":"2fr 1fr 1fr",gap:mob?8:18,marginTop:12}}>
              <div style={{...ST.f,marginTop:0,gridColumn:mob?"1 / -1":undefined}}><label style={ST.lbl} htmlFor="pps-ship-city">City</label><input id="pps-ship-city" type="text" name="shipping-address-level2" autoComplete="shipping address-level2" value={shipAddr.city} onChange={e=>setShipAddr(p=>({...p,city:e.target.value}))} placeholder="City" style={ST.inp}/></div>
              <Sel label={<Tip k="ship_state">State</Tip>} wrapStyle={{marginTop:0}} selectId="pps-ship-state" value={shipState} onChange={setShipState} name="shipping-address-level1" autoComplete="shipping address-level1">
                <option value="">Select&hellip;</option>
                {US_STATES.map(st=><option key={st} value={st}>{st}</option>)}
              </Sel>
              <div style={{...ST.f,marginTop:0}}><label style={ST.lbl} htmlFor="pps-ship-zip">ZIP Code</label><input id="pps-ship-zip" type="text" name="shipping-postal-code" autoComplete="shipping postal-code" value={shipAddr.zip} onChange={e=>setShipAddr(p=>({...p,zip:e.target.value.replace(/[^\d-]/g,"").slice(0,10)}))} placeholder="ZIP" maxLength={10} style={ST.inp}/></div>
            </div>
            </form>

            {r.shipping&&<>
              <div style={{marginTop:10,padding:mob?"8px 10px":"10px 14px",background:CC.tint,borderRadius:9,border:`1px solid ${CC.tintBorder}`}}>
                <div style={{fontSize:10.5,fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",color:CK.cyan,marginBottom:2}}>Free Delivery Estimate</div>
                <div style={{fontSize:mob?14:15,fontWeight:700,color:CC.dark}}>{r.shipping.freeDeliveryDate}</div>
                <div style={{fontSize:mob?10.5:11,color:CC.mid,marginTop:2}}>{r.shipping.freeDeliveryBizDays} business days</div>
                {/* Production & ship-by dates + transit — shop internals, staff-gated.
                    Customers get the delivery date above and "As soon as" in the panel. */}
                {debugUnlocked&&<div style={{marginTop:6,paddingTop:6,borderTop:`1px solid ${CC.tintBorder}`,display:"flex",flexWrap:"wrap",gap:"2px 16px",fontSize:10.5}}>
                  <span style={{color:CC.mid}}><span style={{fontWeight:600}}>Production starts:</span> {r.shipping.productionStartDate}</span>
                  <span style={{color:CC.mid}}><span style={{fontWeight:600}}>Must ship by:</span> {r.shipping.mustShipDate}</span>
                  <span style={{color: r.shipping.effectiveTransit < r.shipping.transitDays ? "#f59e0b" : CC.light}}>

              </div>

                <label style={ST.lbl}>Select a specific date</label>

                  <span style={{fontSize:12,color:"#3a7124",fontWeight:600}}>✓ No rush needed — your date is within free delivery window</span>
                </div>
              )}
            </>}
          </Sec>

        {/* Mobile: discount code + quantity table after the last section; the
            bottom margin keeps them clear of the fixed bar. */}
        {mob && <div style={{...ST.card,padding:"12px 14px",marginTop:10}}>{discountField()}</div>}

        {!mob && <div ref={railRef} style={{ width: 320, flexShrink: 0, position: "sticky", top: 16, alignSelf: "flex-start" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, pointerEvents: "none" }}>
            {/* The engine's resolved dimensions, not the custom-size state. calculate() reads

                ever written by the custom inputs, a reorder restore or a URL param — so choosing
                a preset repriced correctly while the preview kept whatever the custom fields last
                held, which is the 11x8.5 default on a fresh load. Custom mode looked fine for the
                same reason it was broken: there, those fields ARE the source. */}
            <SidebarBrochurePreview longEdge={previewLong} shortEdge={previewShort} quantity={qty} panels={fold.panels} foldType={foldType} frontArt={coverArt} frontColor={frontColor} sides={sides} onOpenPreview={openPreview}/>

          </div>
          {/* CTA directly under the panel; the old duplicate below the table is gone. */}
          <button type="button" data-pps-cta onClick={handleAddToOrder} style={{ width: "100%", marginTop: 16, padding: "17px 18px", borderRadius: 10, border: "none", background: (result?.error?.length || submitting) ? CC.mid : CK.cyan, color: "#fff", fontSize: 16.5, fontWeight: 750, cursor: (result?.error?.length || submitting) ? "default" : "pointer", fontFamily: "inherit", letterSpacing: ".01em", boxShadow: (result?.error?.length || submitting) ? "none" : "0 4px 14px rgba(0,126,255,.38)", transition: "transform .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s" }} disabled={!!result?.error?.length || submitting}>
            {submitting && uploadProgress ? (
              <div>
                <div style={{ fontSize: 12 }}>{uploadProgress.phase === "upload" ? `Uploading file(s)… ${uploadProgress.pct}%` : "Adding…"}</div>
                <div style={{ width: "100%", height: 3, borderRadius: 2, background: "rgba(255,255,255,.2)", overflow: "hidden", marginTop: 4 }}>
                  <div style={{ height: "100%", borderRadius: 2, background: "#fff", transition: "width .15s", width: uploadProgress.phase === "upload"
                    ? `${((uploadProgress.fileIdx / uploadProgress.fileCount) + (uploadProgress.pct / 100 / uploadProgress.fileCount)) * 100}%`
                    : "100%"
                  }}/>
                </div>
              </div>
            ) : submitting ? "Uploading…" : "Add to Order"}
          </button>
          {/* Shipping is required to place the order, but the CTA keeps its own label —
              a button that renames itself to describe a missing field reads as broken.
              Pressing it jumps to the shipping section. */}
          {missingDest && (
            <div style={{marginTop:7,fontSize:12,fontWeight:600,color:CC.red,lineHeight:1.35}}>
              {missingDestMsg}
            </div>
          )}
          {/* Discount code — one definition, mounted here and in the mobile flow. */}
          <div style={{marginTop:10}}>{discountField()}</div>
          {/* Secondary action, directly under the CTA: visible without scrolling past
              the pricing table, which is where it used to sit. */}
          <button type="button" onClick={()=>{setQOpen(true);setQStatus("idle");setQErrorMsg("");}}
            style={{width:"100%",marginTop:9,padding:"11px 10px",borderRadius:9,border:`1px solid ${CK.cyan}55`,
              background:CC.tint,color:"#0060cc",fontSize:13,fontWeight:650,cursor:"pointer",fontFamily:"inherit",
              transition:"all .2s"}}>
            Ask a question about this quote →
          </button>
          <div style={{marginTop:10}}>{qtyTable()}</div>
          <button type="button" onClick={handleShareLink} style={{ width: "100%", marginTop: 8, padding: "9px", borderRadius: 9, border: `1px solid ${shareCopied ? "#86efac" : CC.border}`, background: shareCopied ? "#f0fdf4" : CC.white, color: shareCopied ? "#16a34a" : CC.mid, fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", transition: "all .2s" }}>
            {shareCopied ? "✓ Link copied to clipboard" : "Save configuration"}
          </button>
          {debugUnlocked&&r.shipping&&r.shipping.estWeightLb>0&&(()=>{queueShipCost(shipZip,shipState,r.shipping.estWeightLb);const _sc=getShipCostEst(shipZip,r.shipping.estWeightLb);return(
            <div style={{marginTop:8,padding:"7px 10px",background:"#1a1a1a",color:"#9fe870",borderRadius:5,fontSize:10.5,fontFamily:"monospace",lineHeight:1.5}}>
              SHIP EST (internal) · ~{r.shipping.estWeightLb} lb · {r.shipping.estCartons} carton{r.shipping.estCartons>1?"s":""}
              {_sc?(" · UPS Ground $"+_sc.amount.toFixed(2)+(_sc.parcels>1?" ("+_sc.parcels+" pkg)":"")):(String(shipZip||"").replace(/[^0-9]/g,"").length>=5?" · rate…":" · enter ZIP for rate")}
            </div>
          );})()}
          {debugUnlocked&&<button type="button" onClick={() => setShowDebug(p => !p)} style={{ width: "100%", marginTop: 8, padding: "6px", borderRadius: 4, border: `1px solid ${showDebug ? "#555" : CC.border}`, background: showDebug ? "#1a1a1a" : "#f8fafc", color: showDebug ? "#888" : "#bbb", fontSize: 10, fontWeight: 600, letterSpacing: ".5px", textTransform: "uppercase", cursor: "pointer", fontFamily: "inherit" }}>
            {showDebug ? "▼ Hide" : "▶ Show"} Debug Panel
          </button>}
          {debugUnlocked && showDebug && r.debug && (
            <div style={{ ...ST.pnl, marginTop: 10, padding: 14, fontSize: 11 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: CC.mid }}>Debug</div>
              {Object.entries(r.debug).map(([k, v]) => (
                k !== "P" ? <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "2px 0" }}>
                  <span style={{ color: CC.light }}>{k}</span>
                  <span style={{ fontFamily: "monospace", color: CK.cyan }}>{typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(4)) : String(v)}</span>
                </div> : null
              ))}
              {r.debug.P && <details style={{ marginTop: 8 }}><summary style={{ cursor: "pointer", fontWeight: 600, color: CC.mid }}>Line Items</summary>
                {Object.entries(r.debug.P).filter(([, v]) => Math.abs(v) > 0.005).map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "2px 0" }}>
                    <span style={{ color: CC.light }}>{k}</span>
                    <span style={{ fontFamily: "monospace", color: v < 0 ? "#16a34a" : CK.cyan }}>${v.toFixed(2)}</span>
                  </div>
                ))}
              </details>}
            </div>
          )}
        </div>}
      </div>

      {/* Desktop condensed total — only while the price card is off screen. Tracked to
          the rail's own column so it reads as the rail folding up rather than as a new
          element arriving. Same numbers, same action, one line. */}
      {!mob&&miniBar&&result&&!result.error?.length&&(()=>{
        const _t=Math.max(0,result.total).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
        const _sh=result.shipping;
        const _when=_sh?(_sh.needByFmt||((_sh.hasDest)?(((_sh.rushCost>0)&&_sh.needByFmt)?_sh.needByFmt:_sh.freeDeliveryDate):_sh.earliestDate)):null;
        const _net=couponActive?netOf(result.total):null;
        return <Float><div style={{position:"fixed",bottom:16,left:miniBar.left,width:miniBar.width,zIndex:9990,
          background:CC.white,border:`1px solid ${CC.border}`,borderRadius:12,
          boxShadow:"0 6px 24px rgba(16,24,40,.16)",padding:"10px 12px",
          display:"flex",alignItems:"center",gap:10,animation:"pps-mini-in .22s ease-out"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:19,fontWeight:800,color:CC.dark,lineHeight:1.05}}>${_t}</div>
            <div style={{fontSize:10.5,color:missingDest?CC.red:CC.light,fontWeight:600,marginTop:1,whiteSpace:missingDest?"normal":"nowrap",overflow:"hidden",textOverflow:missingDest?"clip":"ellipsis",lineHeight:1.25}}>
              {missingDest ? missingDestMsg
                           : `${(result.qty||0).toLocaleString()} qty${_when?` · ${_sh&&_sh.needByFmt?"delivery by":"as soon as"} ${_when}`:""}`}
            </div>
            {/* The condensed bar is the only price on screen once the card scrolls off,
                so it cannot be the one place a live code goes unmentioned. */}
            {_net!=null&&<div style={{fontSize:10.5,fontWeight:700,color:CK.cyan,marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
              {coupon.code} · you pay ${_net.toFixed(2)}
            </div>}
          </div>
          <button type="button" onClick={handleAddToOrder} disabled={submitting}
            style={{flexShrink:0,padding:"11px 16px",borderRadius:8,border:"none",background:submitting?CC.mid:CK.cyan,
              color:"#fff",fontSize:14,fontWeight:750,cursor:submitting?"default":"pointer",fontFamily:"inherit",
              whiteSpace:"nowrap"}}>
            {submitting?"Adding…":"Add to Order"}
          </button>
        </div></Float>;
      })()}

      {/* Mobile-only floating "Have a question?" chip — sits just above the bottom bar.
          Portalled: a transformed WordPress ancestor would trap position:fixed. */}
      {mob && !qOpen && !mobExpanded && (
        <Float><button type="button" onClick={() => { setQOpen(true); setQStatus("idle"); setQErrorMsg(""); }} style={{ position: "fixed", bottom: "calc(var(--pps-bottombar, 70px) + 8px)", right: 12, zIndex: 9989, padding: "7px 13px", borderRadius: 16, border: `1px solid ${CK.cyan}`, background: CC.white, color: CK.cyan, fontSize: 11.5, fontWeight: 700, boxShadow: "0 2px 8px rgba(0,0,0,.12)", cursor: "pointer", fontFamily: "inherit" }}>
          Have a question? →
        </button></Float>
      )}

      {/* Fixed bottom bar — mobile. Portalled: a WordPress-theme ancestor with a
          transform would trap position:fixed in its stacking context. */}
      {mob && <Float>
        {debugUnlocked && showDebug && r.debug && <div style={{ position: "fixed", bottom: "var(--pps-bottombar, 76px)", left: 0, right: 0, zIndex: 9989, maxHeight: "60vh", overflowY: "auto", background: CC.white, borderTop: `1px solid ${CC.border}`, boxShadow: "0 -4px 16px rgba(0,0,0,.12)", padding: "10px" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: CC.mid, marginBottom: 6 }}>DEBUG</div>
          {Object.entries(r.debug).filter(([k]) => k !== "P").map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 10, padding: "1px 0" }}>
              <span style={{ color: CC.light }}>{k}</span>
              <span style={{ fontFamily: "monospace", color: CK.cyan }}>{typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(3)) : String(v)}</span>
            </div>
          ))}
        </div>}
        {/* Fixed bottom bar */}
        <div ref={bottomBarRef} style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 9990, background: CC.white, borderTop: `1px solid ${CC.border}`, boxShadow: "0 -4px 16px rgba(0,0,0,.08)", padding: "8px 10px", paddingBottom: "max(8px, env(safe-area-inset-bottom))" }}>
          {missingDest && <div style={{ fontSize: 11, fontWeight: 600, color: CC.red, lineHeight: 1.3, padding: "0 2px 6px" }}>{missingDestMsg}</div>}
          <div style={{ display: "flex", flexDirection: mobExpanded ? "column" : "row", alignItems: mobExpanded ? "stretch" : "center", gap: 8 }}>

              {debugUnlocked && !mobExpanded && <div style={{ fontSize: 8, textAlign: "center", color: showDebug ? CK.cyan : CC.light, marginTop: 2, letterSpacing: ".5px", textTransform: "uppercase", fontWeight: 600, cursor: "pointer" }} onClick={() => setShowDebug(p => !p)}>{showDebug ? "▼ Hide Debug" : "▲ Debug"}</div>}

              {shareCopied ? "✓" : "🔗"}
            </button>}
            <button type="button" onClick={handleAddToOrder} style={{ flexShrink: 0, padding: "12px 18px", borderRadius: 8, border: "none", background: (result?.error?.length || submitting) ? CC.mid : CK.cyan, color: "#fff", fontSize: 14, fontWeight: 700, cursor: (result?.error?.length || submitting) ? "default" : "pointer", fontFamily: "inherit", whiteSpace: "nowrap", minWidth: submitting && uploadProgress ? 140 : undefined, width: mobExpanded ? "100%" : undefined }}
              disabled={!!result?.error?.length || submitting}>
              {submitting && uploadProgress ? (
                <div>
                  <div style={{ fontSize: 12 }}>{uploadProgress.phase === "upload" ? `Uploading… ${uploadProgress.pct}%` : "Adding…"}</div>
                  <div style={{ width: "100%", height: 3, borderRadius: 2, background: "rgba(255,255,255,.2)", overflow: "hidden", marginTop: 4 }}>
                    <div style={{ height: "100%", borderRadius: 2, background: "#fff", transition: "width .15s", width: uploadProgress.phase === "upload"
                      ? `${((uploadProgress.fileIdx / uploadProgress.fileCount) + (uploadProgress.pct / 100 / uploadProgress.fileCount)) * 100}%`
                      : "100%"
                    }}/>
                  </div>
                </div>
              ) : submitting ? "Uploading…" : "Add to Order"}
            </button>
          </div>
        </div>
      </Float>}

      {/* Question modal — portalled so a transformed ancestor can't trap it */}
      {qOpen && (
        <Float><div style={{ position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,0,0,.55)", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "min(8vh,60px) 16px 16px", overflowY: "auto" }} onClick={resetQuestionForm}>
          <div style={{ background: "#fff", borderRadius: 8, maxWidth: 520, width: "100%", boxShadow: "0 20px 60px rgba(0,0,0,.3)", overflow: "hidden" }} onClick={e => e.stopPropagation()}>
            <div style={{ padding: "16px 20px", borderBottom: `1px solid ${CC.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: CC.dark }}>Have a question about this quote?</div>
              <button type="button" onClick={resetQuestionForm} style={{ background: "none", border: "none", fontSize: 22, lineHeight: 1, color: CC.light, cursor: "pointer", padding: 0, marginLeft: 12 }} aria-label="Close">×</button>
            </div>
            {qStatus === "sent" ? (
              <div style={{ padding: "24px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 34, marginBottom: 8 }}>✓</div>
                <div style={{ fontSize: 14, fontWeight: 600, color: CC.dark, marginBottom: 6 }}>Question sent!</div>
                <div style={{ fontSize: 13, color: CC.mid, lineHeight: 1.5, maxWidth: 380, margin: "0 auto" }}>We&rsquo;ve emailed a copy of your quote to <strong>{qEmail}</strong>. A team member will reply within 1 business day.</div>
                <button type="button" onClick={resetQuestionForm} style={{ marginTop: 18, padding: "9px 20px", borderRadius: 5, border: `1px solid ${CC.border}`, background: "#f8fafc", color: CC.dark, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>Close</button>
              </div>
            ) : (
              <form onSubmit={handleQuestionSubmit} style={{ padding: "16px 20px" }}>
                <div style={{ fontSize: 12, color: CC.mid, marginBottom: 14, lineHeight: 1.45 }}>We&rsquo;ll see exactly what you&rsquo;re looking at — your current configuration and price are included automatically.</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                  <div>
                    <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: CC.mid, marginBottom: 4 }}>Name <span style={{ color: "#d00" }}>*</span></label>
                    <input type="text" value={qName} onChange={e => setQName(e.target.value)} maxLength={120} required style={{ width: "100%", padding: "8px 10px", borderRadius: 4, border: `1px solid ${CC.border}`, fontSize: 14, fontFamily: "inherit", boxSizing: "border-box" }} />
                  </div>
                  <div>
                    <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: CC.mid, marginBottom: 4 }}>Email <span style={{ color: "#d00" }}>*</span></label>
                    <input type="email" value={qEmail} onChange={e => setQEmail(e.target.value)} maxLength={160} required style={{ width: "100%", padding: "8px 10px", borderRadius: 4, border: `1px solid ${CC.border}`, fontSize: 14, fontFamily: "inherit", boxSizing: "border-box" }} />
                  </div>
                </div>
                <div style={{ marginBottom: 10 }}>
                  <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: CC.mid, marginBottom: 4 }}>Phone <span style={{ color: CC.light, fontWeight: 400 }}>(optional)</span></label>
                  <input type="tel" value={qPhone} onChange={e => setQPhone(e.target.value)} maxLength={40} style={{ width: "100%", padding: "8px 10px", borderRadius: 4, border: `1px solid ${CC.border}`, fontSize: 14, fontFamily: "inherit", boxSizing: "border-box" }} />
                </div>
                <div style={{ marginBottom: 14 }}>
                  <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: CC.mid, marginBottom: 4 }}>Your question <span style={{ color: "#d00" }}>*</span></label>
                  <textarea value={qMessage} onChange={e => setQMessage(e.target.value)} maxLength={4000} required rows={5} style={{ width: "100%", padding: "8px 10px", borderRadius: 4, border: `1px solid ${CC.border}`, fontSize: 14, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
                </div>
                <input type="text" name="company_url" tabIndex={-1} autoComplete="off" style={{ position: "absolute", left: "-9999px", width: 1, height: 1, opacity: 0 }} aria-hidden="true" />
                {qStatus === "error" && qErrorMsg && (
                  <div style={{ padding: "8px 12px", background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 4, fontSize: 12, color: "#b91c1c", marginBottom: 10 }}>{qErrorMsg}</div>
                )}
                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", alignItems: "center" }}>
                  <button type="button" onClick={resetQuestionForm} style={{ padding: "9px 16px", borderRadius: 5, border: `1px solid ${CC.border}`, background: "#f8fafc", color: CC.dark, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }} disabled={qStatus === "sending"}>Cancel</button>
                  <button type="submit" disabled={qStatus === "sending"} style={{ padding: "9px 18px", borderRadius: 5, border: "none", background: qStatus === "sending" ? CC.mid : CK.cyan, color: "#fff", fontSize: 13, fontWeight: 700, cursor: qStatus === "sending" ? "wait" : "pointer", fontFamily: "inherit" }}>{qStatus === "sending" ? "Sending…" : "Send question"}</button>
                </div>
              </form>
            )}
          </div>
        </div></Float>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// STYLES
// ═══════════════════════════════════════════════════════════════
function buildST(){ return {
  f:{marginTop:18},
  lbl:{display:"block",fontSize:14,fontWeight:600,color:CC.mid,marginBottom:7,letterSpacing:".005em"},
  sel:{width:"100%",padding:"20px 34px 20px 14px",borderRadius:9,border:`1px solid ${CC.border}`,background:CC.white,fontSize:15,color:CC.dark,fontFamily:"inherit",appearance:"none",cursor:"pointer",outline:"none",boxShadow:"0 1px 2px rgba(16,24,40,.04)",transition:"border-color .15s ease, box-shadow .15s ease"},
  selA:{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:CC.light,pointerEvents:"none"},
  inp:{width:"100%",padding:"20px 14px",borderRadius:9,border:`1px solid ${CC.border}`,background:CC.white,fontSize:15,color:CC.dark,fontFamily:"inherit",outline:"none",boxSizing:"border-box",boxShadow:"0 1px 2px rgba(16,24,40,.04)",transition:"border-color .15s ease, box-shadow .15s ease"},
  // Segmented control: inset track + flat brand thumb (replaces the bevelled 5-stop gradient)
  pills:{display:"flex",borderRadius:10,border:`1px solid ${CC.border}`,overflow:"hidden",background:CC.track,padding:3,gap:3,boxShadow:"inset 0 1px 2px rgba(16,24,40,.04)"},
  pill:{flex:1,padding:"17px 10px",fontSize:14,fontWeight:500,fontFamily:"inherit",border:"none",borderRadius:7,background:"transparent",color:CC.mid,cursor:"pointer",transition:"all .18s cubic-bezier(.4,0,.2,1)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"none"},
  pillOn:{background:CK.cyan,color:"#fff",fontWeight:600,boxShadow:"0 1px 2px rgba(0,126,255,.35)"},
  row2:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18},
  row3:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:18},
  hr:{height:1,background:CC.border,margin:"16px 0 4px"},
  setBox:{marginTop:12,padding:14,borderRadius:10,background:CC.track,border:`1px solid ${CC.border}`},
  addBtn:{width:"100%",marginTop:12,padding:"11px",borderRadius:10,border:`1px dashed ${CC.border}`,background:CC.white,color:CK.cyan,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",transition:"all .15s ease"},
  err:{color:CC.red,fontSize:13,margin:"10px 0 0",padding:"10px 12px",background:CC.errBg,borderRadius:9,border:`1px solid ${CC.errBorder}`},
  note:{fontSize:12,color:CC.light,margin:"5px 0 0"},
  // Section cards: the old left-edge accent stripe is gone; depth now comes from a
  // layered shadow instead of a hard border.
  card:{background:CC.white,borderRadius:14,border:`1px solid ${CC.border}`,overflow:"hidden",boxShadow:"0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.03)"},
  cardH:{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"15px 18px",background:CC.white,border:"none",borderBottom:`1px solid ${CC.border}`,cursor:"pointer",fontFamily:"inherit",fontSize:15},
  pnl:{background:CC.white,borderRadius:14,border:`1px solid ${CC.border}`,overflow:"hidden",boxShadow:"0 1px 2px rgba(16,24,40,.04), 0 6px 16px rgba(16,24,40,.05)"},
  secSub:{margin:"3px 0 0",fontSize:11.5,fontWeight:400,color:CC.light,lineHeight:1.4,textTransform:"none",letterSpacing:0},
  brkBar:{height:8,borderRadius:99,background:"#eef2f6",overflow:"hidden",display:"flex",marginBottom:10},
  specCard:{background:CC.dark,color:"#e2e8f0",borderRadius:12,padding:"16px 18px",marginTop:16,fontFamily:"ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"},
  specEye:{fontSize:10,letterSpacing:".14em",opacity:.55,marginBottom:10},
  specGrid:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 14px",fontSize:12},
}; }
const ST = buildST();

/**
 * Swap theme in place. CC/ST are module-level objects read at render time, so
 * mutating them and re-rendering repaints everything — no theme prop threading.
 */
function pps_applyTheme( name ) {
  const p = PALETTES[ name ] || PALETTES.light;
  Object.assign( CC, p );
  const next = buildST();
  for ( const k in ST ) delete ST[ k ];
  Object.assign( ST, next );
  CHIP = buildCHIP();
  if ( typeof document !== "undefined" ) document.documentElement.dataset.ppsTheme = name;
}

ReactDOM.createRoot(document.getElementById("pps-calculator-root")).render(<ErrorBoundary><App /></ErrorBoundary>);

})();
</script>
