<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude for Safari</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#D97706"/>
          <path d="M8 12C8 10 10 8 12 8C14 8 16 10 16 12C16 14 14 16 12 16" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Claude</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
      </button>
    </header>

    <!-- Page Context Banner -->
    <div id="page-context" class="page-context">
      <div class="context-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
        </svg>
      </div>
      <div class="context-info">
        <span id="page-title" class="page-title">Loading page...</span>
        <span id="page-url" class="page-url"></span>
      </div>
      <button id="refresh-context" class="icon-btn small" title="Refresh page context">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23,4 23,10 17,10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button class="action-btn" data-action="summarize">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="12" x2="14" y2="12"/>
          <line x1="4" y1="18" x2="18" y2="18"/>
        </svg>
        Summarize
      </button>
      <button class="action-btn" data-action="explain">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Explain
      </button>
      <button class="action-btn" data-action="extract">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 9h6M9 13h6M9 17h4"/>
        </svg>
        Extract
      </button>
      <button class="action-btn" data-action="translate">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        Translate
      </button>
    </div>

    <!-- Chat Container -->
    <div id="chat-container" class="chat-container">
      <div id="messages" class="messages">
        <div class="welcome-message">
          <div class="welcome-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" fill="#D97706"/>
              <path d="M8 12C8 10 10 8 12 8C14 8 16 10 16 12C16 14 14 16 12 16" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h3>Hi, I'm Claude</h3>
          <p>I can help you understand this page, extract information, automate tasks, and more. Just ask!</p>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="message-input"
          placeholder="Ask Claude about this page..."
          rows="1"
        ></textarea>
        <div class="input-actions">
          <button id="attach-selection" class="icon-btn" title="Include selected text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button id="send-btn" class="send-btn" title="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22,2 15,22 11,13 2,9"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Automation Panel (Hidden by default) -->
    <div id="automation-panel" class="automation-panel hidden">
      <div class="panel-header">
        <h3>Automation</h3>
        <button id="close-automation" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="automation-options">
        <button class="automation-btn" data-automation="record">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
          </svg>
          <span>Record Workflow</span>
          <small>Teach Claude a sequence of actions</small>
        </button>
        <button class="automation-btn" data-automation="fill-form">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="7" y1="9" x2="17" y2="9"/>
            <line x1="7" y1="13" x2="17" y2="13"/>
            <line x1="7" y1="17" x2="12" y2="17"/>
          </svg>
          <span>Fill Forms</span>
          <small>Auto-fill forms with your data</small>
        </button>
        <button class="automation-btn" data-automation="click-sequence">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>Click Sequence</span>
          <small>Execute a series of clicks</small>
        </button>
        <button class="automation-btn" data-automation="scrape">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span>Extract Data</span>
          <small>Scrape structured data from page</small>
        </button>
      </div>
    </div>

    <!-- Settings Panel (Hidden by default) -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="panel-header">
        <h3>Settings</h3>
        <button id="close-settings" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <div class="setting-group">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" placeholder="sk-ant-...">
          <small>Your Claude API key for direct access</small>
        </div>
        <div class="setting-group">
          <label for="model-select">Model</label>
          <select id="model-select">
            <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
            <option value="claude-opus-4-5-20251101">Claude Opus 4.5</option>
            <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku</option>
          </select>
        </div>
        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="auto-context" checked>
            <span>Auto-include page context</span>
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="save-history" checked>
            <span>Save conversation history</span>
          </label>
        </div>
        <button id="save-settings" class="primary-btn">Save Settings</button>
        <button id="open-claude-app" class="secondary-btn">Open Claude App</button>
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
